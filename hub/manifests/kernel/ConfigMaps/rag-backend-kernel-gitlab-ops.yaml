    # ==================================================================
    # Endpoint: apply_str_replace
    # ==================================================================
    @router.post("/apply-str-replace")
    async def core_gitlab_apply_str_replace(request: dict):
        """ファイルを取得 → 文字列置換 → push (1 commit)。

        Body:
          owner, repo, path (必須)
          old_str, new_str (必須): 置換 (new_str 空文字なら削除)
          message (必須): commit message
          count (任意, default=1): 期待する old_str の出現回数
          branch (任意)
          user_id, gitlab_host (任意)
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        old_str = request.get("old_str", "")
        new_str = request.get("new_str", "")
        message = (request.get("message") or "").strip()
        count = int(request.get("count", 1) or 1)
        branch = request.get("branch") or None

        if not owner or not repo or not path:
            return {
                "ok": False,
                "error": "owner, repo, path are required",
            }
        if not message:
            return {
                "ok": False,
                "error": "message is required",
            }
        if not old_str:
            return {
                "ok": False,
                "error": "old_str is required (empty not allowed)",
            }

        client = _get_client(request)
        got = client.get_file(owner, repo, path, ref=branch)
        if not got.get("ok"):
            return got
        content = got.get("content", "")
        actual = content.count(old_str)
        if actual != count:
            return {
                "ok": False,
                "error": (
                    f"old_str occurrence mismatch: "
                    f"expected {count}, actual {actual}"
                ),
            }
        new_content = content.replace(old_str, new_str, count)
        return client.put_file(
            owner, repo, path, new_content, message, branch=branch
        )


    # ==================================================================
    # Endpoint: grep_file
    # ==================================================================
    @router.post("/grep-file")
    async def core_gitlab_grep_file(request: dict):
        """ファイル内で正規表現 grep を実行し、 マッチ行と context を返す。

        Body:
          owner, repo, path (必須)
          pattern (必須): Python 正規表現
          context (任意, default 2, max 20)
          max_matches (任意, default 50, max 200)
          ignore_case (任意, default False)
          ref (任意)
          user_id, gitlab_host (任意)
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        pattern = request.get("pattern", "")
        context_lines = int(
            request.get("context", _CONTEXT_LINES_DEFAULT) or 0
        )
        max_matches = int(
            request.get("max_matches", _MAX_MATCHES_DEFAULT) or 0
        )
        ignore_case = bool(request.get("ignore_case", False))
        ref = request.get("ref") or None

        if not owner or not repo or not path:
            return {
                "ok": False,
                "error": "owner, repo, path are required",
            }
        if not pattern:
            return {
                "ok": False,
                "error": "pattern is required",
            }

        context_lines = max(
            0, min(context_lines, _CONTEXT_LINES_LIMIT)
        )
        max_matches = max(
            1, min(max_matches, _MAX_MATCHES_LIMIT)
        )

        try:
            flags = re.MULTILINE
            if ignore_case:
                flags |= re.IGNORECASE
            regex = re.compile(pattern, flags)
        except re.error as e:
            return {
                "ok": False,
                "error": f"invalid regex: {e}",
            }

        client = _get_client(request)
        got = client.get_file(owner, repo, path, ref=ref)
        if not got.get("ok"):
            return got
        content = got.get("content", "")
        lines = content.splitlines()

        blocks: List[Dict[str, Any]] = []
        truncated = False
        for i, line in enumerate(lines):
            if not regex.search(line):
                continue
            if len(blocks) >= max_matches:
                truncated = True
                break
            start = max(0, i - context_lines)
            end = min(len(lines), i + context_lines + 1)
            blocks.append({
                "line_number": i + 1,
                "match_line": line,
                "context": [
                    {"line_number": j + 1, "text": lines[j]}
                    for j in range(start, end)
                ],
            })

        return {
            "ok": True,
            "path": path,
            "ref": got.get("ref"),
            "total_matches": len(blocks),
            "truncated": truncated,
            "blocks": blocks,
        }


    # ==================================================================
    # Endpoint: get_file_range
    # ==================================================================
    @router.post("/get-file-range")
    async def core_gitlab_get_file_range(request: dict):
        """ファイルから指定行範囲だけを取得する (1-indexed、 両端含む)。

        Body:
          owner, repo, path (必須)
          start_line, end_line (必須): 1-indexed
          ref (任意)
          user_id, gitlab_host (任意)
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        start_line = int(request.get("start_line", 0) or 0)
        end_line = int(request.get("end_line", 0) or 0)
        ref = request.get("ref") or None

        if not owner or not repo or not path:
            return {
                "ok": False,
                "error": "owner, repo, path are required",
            }
        if start_line < 1 or end_line < start_line:
            return {
                "ok": False,
                "error": (
                    "start_line must be >=1 and "
                    "end_line must be >=start_line"
                ),
            }

        client = _get_client(request)
        got = client.get_file(owner, repo, path, ref=ref)
        if not got.get("ok"):
            return got
        content = got.get("content", "")
        lines = content.splitlines()
        total = len(lines)
        start = min(start_line, total + 1)
        end = min(end_line, total)

        selected = []
        for i in range(start - 1, end):
            selected.append({"line_number": i + 1, "text": lines[i]})

        return {
            "ok": True,
            "path": path,
            "ref": got.get("ref"),
            "total_lines": total,
            "start_line": start,
            "end_line": end,
            "lines": selected,
        }


    # ==================================================================
    # Endpoint: create_repo (project)
    # ==================================================================
    @router.post("/create-repo")
    async def core_gitlab_create_repo(request: dict):
        """GitLab プロジェクトを新規作成する。 冪等: 既存の場合は既存情報を返す。

        Body:
          owner (必須): グループ or ユーザー名
          repo (必須): プロジェクト名
          is_group (任意, default True): グループ配下に作成
          visibility (任意, default "private"): private | internal | public
          description (任意)
          default_branch (任意, default "main")
          initialize_with_readme (任意, default True)
          user_id, gitlab_host (任意)
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()

        if not owner or not repo:
            return {
                "ok": False,
                "web_url": "",
                "http_url_to_repo": "",
                "ssh_url_to_repo": "",
                "default_branch": "",
                "visibility": "private",
                "already_existed": False,
                "error": "owner and repo are required",
            }

        is_group = bool(request.get("is_group", True))
        visibility = (
            request.get("visibility") or "private"
        ).strip().lower()
        if visibility not in ("private", "internal", "public"):
            visibility = "private"

        client = _get_client(request)
        try:
            return client.create_repo(
                owner=owner,
                repo=repo,
                is_group=is_group,
                visibility=visibility,
                description=request.get("description"),
                default_branch=(
                    request.get("default_branch") or "main"
                ),
                initialize_with_readme=bool(
                    request.get("initialize_with_readme", True)
                ),
            )
        except Exception as e:
            logger.error(
                f"[GITLAB_CREATE_REPO] unexpected error: {e}",
                exc_info=True,
            )
            return {
                "ok": False,
                "web_url": "",
                "http_url_to_repo": "",
                "ssh_url_to_repo": "",
                "default_branch": "",
                "visibility": visibility,
                "already_existed": False,
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }
