    # 起動時に index を冪等作成
    # ====================================================================
    try:
        _ensure_index()
    except Exception as _e:
        logger.warning(
            f"[GIT_MIRROR] initial ensure_index failed: "
            f"{type(_e).__name__}: {_e}"
        )
