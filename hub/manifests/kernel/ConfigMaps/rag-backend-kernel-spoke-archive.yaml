    @router.post("/core/spoke/delete-cluster-cr")
    def core_spoke_delete_cluster_cr(request: dict):
        """fleet-cluster の Cluster CR を kubectl delete する独立 endpoint.

        disable と分離されており、 frontend から別の API call で呼ばれる.
        backend kernel ↔ 中央ハブ MCP の循環依存による HTTP デッドロック
        様状況を、 同期処理タイミングの分離により回避する.

        Body:
            {"cluster_name": "..."}
        Returns:
            {"cluster_name": "...",
             "fleet_cluster_cr_removed": <CR 名 or null>,
             "fleet_cluster_cr_error": <エラー文字列 or null>}
        """
        cluster_name = (request or {}).get("cluster_name") or ""
        if not cluster_name:
            raise HTTPException(
                status_code=400,
                detail="cluster_name is required",
            )

        fleet_cluster_cr_removed = None
        fleet_cluster_cr_error = None
        try:
            fleet_cluster_cr_removed = _delete_fleet_cluster_cr(
                cluster_name
            )
            # archive doc に情報を保存 (best-effort、 失敗しても無視)
            if fleet_cluster_cr_removed:
                try:
                    archive_doc = _os_get(INDEX_ARCHIVE, cluster_name)
                    if archive_doc is not None:
                        archive_doc["fleet_cluster_cr_removed"] = (
                            fleet_cluster_cr_removed
                        )
                        _os_put(
                            INDEX_ARCHIVE, cluster_name, archive_doc
                        )
                except Exception:
                    pass
        except Exception as e:
            fleet_cluster_cr_error = (
                f"{type(e).__name__}: {str(e)[:200]}"
            )

        cr_name_display = None
        if isinstance(fleet_cluster_cr_removed, dict):
            cr_name_display = (
                fleet_cluster_cr_removed.get("metadata", {}).get("name")
            )
        return {
            "cluster_name": cluster_name,
            "fleet_cluster_cr_removed": cr_name_display,
            "fleet_cluster_cr_error": fleet_cluster_cr_error,
        }
