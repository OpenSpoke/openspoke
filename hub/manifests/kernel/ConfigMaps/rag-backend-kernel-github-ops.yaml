apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-backend-kernel-github-ops
  namespace: rag-company1
data:
  github_ops.py: |
    """
    github_ops.py
    ====================================================================
    GitHub Operations Module

    main.py から分離した GitHub 操作エンドポイント群 (/core/github/*)、
    GitHubAPIClient、 AST 解析ヘルパー (_gh_*) を収容する。
    main.py からは include_router(router) で取り込む。

    依存方針:
      - main.py へ依存しない (github_account と同流儀)。
      - GitHub API へは requests 直叩き。
      - token は github_account.resolve_github_token() で解決 (関数内 import)。
    """
    from __future__ import annotations

    import ast
    import base64
    import difflib
    import json
    import logging
    import os
    import re
    from datetime import datetime, timezone
    from typing import Any, Dict, List, Optional

    from fastapi import APIRouter, HTTPException

    logger = logging.getLogger(__name__)

    # ── requests (遅延 import) ──
    try:
        import requests
        _REQUESTS_AVAILABLE = True
    except ImportError as _e:
        logger.warning(f"[GITHUB_OPS] requests not available: {_e}")
        _REQUESTS_AVAILABLE = False
        requests = None

    router = APIRouter()

    # ====================================================================
    # GitHubAPIClient (moved from main.py)
    # ====================================================================
    # __GH_OPS_CLIENT_ANCHOR__
    class GitHubAPIClient:
        """GitHub API クライアント"""
        
        def __init__(self, token: str):
            self.token = token
            self.headers = {"Authorization": f"token {token}"}
            self.base_url = "https://api.github.com"
        
        def get_repo_contents(self, owner: str, repo: str, path: str = "") -> list:
            """リポジトリのコンテンツを取得"""
            url = f"{self.base_url}/repos/{owner}/{repo}/contents/{path}"
            response = requests.get(url, headers=self.headers)
            
            if response.status_code != 200:
                raise Exception(f"GitHub API error: {response.status_code}")
            
            return response.json()
        
        def get_file_content(self, owner: str, repo: str, path: str) -> str:
            """ファイルの内容を取得"""
            url = f"{self.base_url}/repos/{owner}/{repo}/contents/{path}"
            response = requests.get(url, headers=self.headers)
            
            if response.status_code != 200:
                raise Exception(f"Failed to get file: {path}")
            
            content_b64 = response.json().get("content", "")
            content = base64.b64decode(content_b64).decode('utf-8', errors='ignore')
            return content
        
        def traverse_repo(self, owner: str, repo: str, path: str = "", file_extensions: list = None) -> list:
            """リポジトリを再帰的に走査"""
            files = []
            
            try:
                contents = self.get_repo_contents(owner, repo, path)
                
                for item in contents:
                    if item["type"] == "file":
                        file_path = item["path"]
                        
                        if file_extensions:
                            if not any(file_path.endswith(ext) for ext in file_extensions):
                                continue
                        
                        try:
                            content = self.get_file_content(owner, repo, file_path)
                            files.append({
                                "path": file_path,
                                "content": content,
                                "size": item["size"]
                            })
                            logger.info(f"[GITHUB] Retrieved: {file_path}")
                        except Exception as e:
                            logger.warning(f"[GITHUB] Failed to get {file_path}: {e}")
                    
                    elif item["type"] == "dir":
                        files.extend(self.traverse_repo(owner, repo, item["path"], file_extensions))
            
            except Exception as e:
                logger.error(f"[GITHUB] Error traversing {path}: {e}")
            
            return files

        def resolve_branch(self, owner: str, repo: str, candidates: list) -> str:
            """候補ブランチを順に試して、存在する最初のブランチ名を返す。全て失敗時は例外を送出。"""
            for b in candidates:
                ref_url = f"{self.base_url}/repos/{owner}/{repo}/git/ref/heads/{b}"
                resp = requests.get(ref_url, headers=self.headers)
                if resp.status_code == 200:
                    logger.info(f"[GITHUB] {owner}/{repo}: branch '{b}' found")
                    return b
                # branches エンドポイントでも確認
                br_url = f"{self.base_url}/repos/{owner}/{repo}/branches/{b}"
                br_resp = requests.get(br_url, headers=self.headers)
                if br_resp.status_code == 200:
                    logger.info(f"[GITHUB] {owner}/{repo}: branch '{b}' found (via branches API)")
                    return b
            raise Exception(f"None of the branches {candidates} exist in {owner}/{repo}")

        def get_all_file_paths(self, owner: str, repo: str, branch: str, file_extensions: list) -> list:
            """Trees APIで再帰取得（1回のAPIコールで全ファイルパスを取得）"""
            ref_url = f"{self.base_url}/repos/{owner}/{repo}/git/ref/heads/{branch}"
            ref_resp = requests.get(ref_url, headers=self.headers)
            if ref_resp.status_code == 200:
                sha = ref_resp.json()["object"]["sha"]
            else:
                branch_url = f"{self.base_url}/repos/{owner}/{repo}/branches/{branch}"
                branch_resp = requests.get(branch_url, headers=self.headers)
                if branch_resp.status_code != 200:
                    raise Exception(f"Failed to get branch SHA: {branch_resp.status_code}")
                sha = branch_resp.json()["commit"]["sha"]

            tree_url = f"{self.base_url}/repos/{owner}/{repo}/git/trees/{sha}?recursive=1"
            tree_resp = requests.get(tree_url, headers=self.headers)
            if tree_resp.status_code != 200:
                raise Exception(f"Trees API error: {tree_resp.status_code}")

            tree = tree_resp.json()
            if tree.get("truncated"):
                logger.warning("[GITHUB] Tree response truncated (repo too large)")

            paths = []
            for item in tree.get("tree", []):
                if item["type"] == "blob":
                    path = item["path"]
                    if file_extensions:
                        if any(path.endswith(ext) for ext in file_extensions):
                            paths.append({"path": path, "size": item.get("size", 0)})
                    else:
                        paths.append({"path": path, "size": item.get("size", 0)})

            logger.info(f"[GITHUB] Trees API: found {len(paths)} matching files in 1 API call")
            return paths

        def list_repos(self, owner: str) -> list:
            """オーナーの全リポジトリ一覧を取得（org/user 両対応、ページネーション対応）"""
            repos = []
            page = 1
            while True:
                # org エンドポイントを先に試し、404 なら user エンドポイントにフォールバック
                url = f"{self.base_url}/orgs/{owner}/repos?per_page=100&page={page}&type=all"
                resp = requests.get(url, headers=self.headers)
                if resp.status_code == 404:
                    url = f"{self.base_url}/users/{owner}/repos?per_page=100&page={page}&type=all"
                    resp = requests.get(url, headers=self.headers)
                if resp.status_code != 200:
                    logger.warning(f"[GITHUB] list_repos failed: {resp.status_code}")
                    break
                data = resp.json()
                if not data:
                    break
                repos.extend([r["name"] for r in data])
                if len(data) < 100:
                    break
                page += 1
            logger.info(f"[GITHUB] Found {len(repos)} repositories for owner: {owner}")
            return repos

        def fetch_files_parallel(self, owner: str, repo: str, paths: list, max_workers: int = 8) -> list:
            """ファイル内容を並列取得（max_workers並列）"""
            results = []
            lock = threading.Lock()

            def fetch_one(item):
                try:
                    content = self.get_file_content(owner, repo, item["path"])
                    with lock:
                        results.append({
                            "path": item["path"],
                            "content": content,
                            "size": item["size"]
                        })
                except Exception as e:
                    logger.warning(f"[GITHUB] Skip {item['path']}: {e}")

            with ThreadPoolExecutor(max_workers=max_workers) as executor:
                list(executor.map(fetch_one, paths))

            return results

        # ── 書き込み系メソッド (commit / push) ──
        # GitHub Contents API を使い、 ファイル単位で commit + push を行う。
        # 通常 git のように local clone は不要。 1 ファイル = 1 commit が API の単位。

        def get_file_sha(self, owner: str, repo: str, path: str, branch: str = None) -> Optional[str]:
            """ファイルの SHA を取得する。 ファイルが存在しなければ None を返す。
            update 時の必須パラメータ (GitHub Contents API の仕様)。"""
            url = f"{self.base_url}/repos/{owner}/{repo}/contents/{path}"
            params = {}
            if branch:
                params["ref"] = branch
            try:
                response = requests.get(url, headers=self.headers, params=params, timeout=30)
                if response.status_code == 200:
                    return response.json().get("sha")
                if response.status_code == 404:
                    return None
                logger.warning(f"[GITHUB] get_file_sha unexpected status {response.status_code} for {path}")
                return None
            except Exception as e:
                logger.warning(f"[GITHUB] get_file_sha error for {path}: {e}")
                return None

        def put_file(self, owner: str, repo: str, path: str, content: str,
                     message: str, branch: str = None) -> Dict[str, Any]:
            """ファイルを作成 or 更新して直接 push する (GitHub Contents API)。

            既存ファイルがあれば SHA を自動取得して更新、 無ければ新規作成。
            commit message に空文字は不可。 1 ファイル = 1 commit。

            Returns:
                {
                    "ok": bool,
                    "action": "created" | "updated",
                    "commit_sha": str,
                    "html_url": str,        # GitHub 上の commit URL
                    "error": str | null
                }
            """
            if not message or not message.strip():
                return {"ok": False, "error": "commit message is required (empty not allowed)"}
            
            url = f"{self.base_url}/repos/{owner}/{repo}/contents/{path}"
            existing_sha = self.get_file_sha(owner, repo, path, branch=branch)
            action = "updated" if existing_sha else "created"
            
            content_b64 = base64.b64encode(content.encode("utf-8")).decode("ascii")
            body = {
                "message": message,
                "content": content_b64,
            }
            if existing_sha:
                body["sha"] = existing_sha
            if branch:
                body["branch"] = branch
            
            try:
                response = requests.put(url, headers=self.headers, json=body, timeout=60)
            except Exception as e:
                logger.error(f"[GITHUB] put_file network error for {path}: {e}")
                return {"ok": False, "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}
            
            if response.status_code in (200, 201):
                resp_json = response.json()
                commit = resp_json.get("commit", {}) or {}
                logger.info(f"[GITHUB] put_file {action}: {owner}/{repo}/{path} commit={commit.get('sha', '?')[:7]}")
                return {
                    "ok": True,
                    "action": action,
                    "commit_sha": commit.get("sha", ""),
                    "html_url": commit.get("html_url", ""),
                    "error": None,
                }
            else:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                logger.error(f"[GITHUB] put_file failed for {path}: status={response.status_code}, body={err_text}")
                return {"ok": False, "error": f"HTTP {response.status_code}: {err_text}"}

        def delete_file(self, owner: str, repo: str, path: str, message: str,
                        branch: str = None) -> Dict[str, Any]:
            """ファイルを削除して直接 push する (GitHub Contents API)。

            ファイルが存在しなければ ok=True, deleted=False (冪等)。

            Returns:
                {
                    "ok": bool,
                    "deleted": bool,
                    "commit_sha": str,
                    "html_url": str,
                    "error": str | null
                }
            """
            if not message or not message.strip():
                return {"ok": False, "deleted": False, "error": "commit message is required"}
            
            existing_sha = self.get_file_sha(owner, repo, path, branch=branch)
            if not existing_sha:
                return {"ok": True, "deleted": False, "error": None}
            
            url = f"{self.base_url}/repos/{owner}/{repo}/contents/{path}"
            body = {
                "message": message,
                "sha": existing_sha,
            }
            if branch:
                body["branch"] = branch
            
            try:
                response = requests.delete(url, headers=self.headers, json=body, timeout=60)
            except Exception as e:
                logger.error(f"[GITHUB] delete_file network error for {path}: {e}")
                return {"ok": False, "deleted": False, "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}
            
            if response.status_code == 200:
                resp_json = response.json()
                commit = resp_json.get("commit", {}) or {}
                logger.info(f"[GITHUB] delete_file: {owner}/{repo}/{path} commit={commit.get('sha', '?')[:7]}")
                return {
                    "ok": True,
                    "deleted": True,
                    "commit_sha": commit.get("sha", ""),
                    "html_url": commit.get("html_url", ""),
                    "error": None,
                }
            else:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                logger.error(f"[GITHUB] delete_file failed for {path}: status={response.status_code}")
                return {"ok": False, "deleted": False, "error": f"HTTP {response.status_code}: {err_text}"}

        # ───────────────────────────────────────────────────────
        # GitHub Issues API
        # ───────────────────────────────────────────────────────
        # GitHub API では Pull Request も Issue の一種として扱われる。
        # list_issues では pull_request フィールド付きを除外して純粋な Issue のみ返す。
        # 参考: https://docs.github.com/en/rest/issues

        @staticmethod
        def _format_issue(item: dict) -> dict:
            """GitHub API の issue/PR レスポンスを整形して返す共通ヘルパー。"""
            user = item.get("user") or {}
            assignees = item.get("assignees") or []
            labels = item.get("labels") or []
            milestone = item.get("milestone") or {}
            return {
                "number": item.get("number"),
                "title": item.get("title", ""),
                "state": item.get("state", ""),
                "body": item.get("body") or "",
                "user": user.get("login", ""),
                "assignees": [a.get("login", "") for a in assignees if a.get("login")],
                "labels": [l.get("name", "") for l in labels if l.get("name")],
                "milestone": milestone.get("title", "") if milestone else "",
                "comments": item.get("comments", 0),
                "created_at": item.get("created_at", ""),
                "updated_at": item.get("updated_at", ""),
                "closed_at": item.get("closed_at"),
                "html_url": item.get("html_url", ""),
                "is_pull_request": "pull_request" in item,
            }

        def list_issues(self, owner: str, repo: str,
                        state: str = "open",
                        labels: Optional[str] = None,
                        assignee: Optional[str] = None,
                        creator: Optional[str] = None,
                        sort: str = "created",
                        direction: str = "desc",
                        per_page: int = 30,
                        page: int = 1,
                        include_pull_requests: bool = False) -> Dict[str, Any]:
            """Issue 一覧を取得する (GET /repos/{owner}/{repo}/issues)。

            Args:
                state: "open" | "closed" | "all"
                labels: カンマ区切りラベル名 (例: "bug,enhancement")
                assignee: アサインされた user (login)、 "none" / "*" も指定可
                creator: issue 作成者 (login)
                sort: "created" | "updated" | "comments"
                direction: "asc" | "desc"
                per_page: 1-100 (GitHub 上限)
                page: 1-始まりのページ番号
                include_pull_requests: True なら PR も含める

            Returns:
                {"ok": bool, "issues": [...], "error": str | null}
            """
            url = f"{self.base_url}/repos/{owner}/{repo}/issues"
            params: Dict[str, Any] = {
                "state": state,
                "sort": sort,
                "direction": direction,
                "per_page": max(1, min(int(per_page or 30), 100)),
                "page": max(1, int(page or 1)),
            }
            if labels:
                params["labels"] = labels
            if assignee:
                params["assignee"] = assignee
            if creator:
                params["creator"] = creator

            try:
                response = requests.get(url, headers=self.headers, params=params, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] list_issues network error for {owner}/{repo}: {e}")
                return {"ok": False, "issues": [], "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}

            if response.status_code != 200:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                logger.error(f"[GITHUB] list_issues failed for {owner}/{repo}: status={response.status_code}")
                return {"ok": False, "issues": [], "error": f"HTTP {response.status_code}: {err_text}"}

            data = response.json() or []
            issues = []
            for item in data:
                if not include_pull_requests and "pull_request" in item:
                    continue
                issues.append(self._format_issue(item))
            return {"ok": True, "issues": issues, "error": None}

        def get_issue(self, owner: str, repo: str, number: int) -> Dict[str, Any]:
            """Issue 1 件の詳細を取得する (GET /repos/{owner}/{repo}/issues/{number})。"""
            url = f"{self.base_url}/repos/{owner}/{repo}/issues/{int(number)}"
            try:
                response = requests.get(url, headers=self.headers, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] get_issue network error for {owner}/{repo}#{number}: {e}")
                return {"ok": False, "exists": False, "issue": None,
                        "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}

            if response.status_code == 404:
                return {"ok": True, "exists": False, "issue": None, "error": None}
            if response.status_code != 200:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                return {"ok": False, "exists": False, "issue": None,
                        "error": f"HTTP {response.status_code}: {err_text}"}

            return {"ok": True, "exists": True,
                    "issue": self._format_issue(response.json() or {}),
                    "error": None}

        def list_issue_comments(self, owner: str, repo: str, number: int,
                                per_page: int = 30, page: int = 1) -> Dict[str, Any]:
            """Issue のコメント一覧を取得する (GET /repos/{owner}/{repo}/issues/{number}/comments)。"""
            url = f"{self.base_url}/repos/{owner}/{repo}/issues/{int(number)}/comments"
            params = {
                "per_page": max(1, min(int(per_page or 30), 100)),
                "page": max(1, int(page or 1)),
            }
            try:
                response = requests.get(url, headers=self.headers, params=params, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] list_issue_comments network error for {owner}/{repo}#{number}: {e}")
                return {"ok": False, "comments": [], "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}

            if response.status_code != 200:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                return {"ok": False, "comments": [], "error": f"HTTP {response.status_code}: {err_text}"}

            data = response.json() or []
            comments = []
            for c in data:
                user = c.get("user") or {}
                comments.append({
                    "id": c.get("id"),
                    "user": user.get("login", ""),
                    "body": c.get("body") or "",
                    "created_at": c.get("created_at", ""),
                    "updated_at": c.get("updated_at", ""),
                    "html_url": c.get("html_url", ""),
                })
            return {"ok": True, "comments": comments, "error": None}

        def create_issue(self, owner: str, repo: str, title: str,
                         body: Optional[str] = None,
                         labels: Optional[list] = None,
                         assignees: Optional[list] = None,
                         milestone: Optional[int] = None) -> Dict[str, Any]:
            """Issue を新規作成する (POST /repos/{owner}/{repo}/issues)。"""
            if not title or not title.strip():
                return {"ok": False, "number": None, "html_url": "", "issue": None,
                        "error": "title is required"}

            url = f"{self.base_url}/repos/{owner}/{repo}/issues"
            payload: Dict[str, Any] = {"title": title}
            if body is not None:
                payload["body"] = body
            if labels:
                payload["labels"] = labels
            if assignees:
                payload["assignees"] = assignees
            if milestone is not None:
                payload["milestone"] = int(milestone)

            try:
                response = requests.post(url, headers=self.headers, json=payload, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] create_issue network error for {owner}/{repo}: {e}")
                return {"ok": False, "number": None, "html_url": "", "issue": None,
                        "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}

            if response.status_code != 201:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                logger.error(f"[GITHUB] create_issue failed for {owner}/{repo}: status={response.status_code}")
                return {"ok": False, "number": None, "html_url": "", "issue": None,
                        "error": f"HTTP {response.status_code}: {err_text}"}

            data = response.json() or {}
            formatted = self._format_issue(data)
            logger.info(f"[GITHUB] create_issue: {owner}/{repo}#{formatted.get('number')} '{title[:40]}'")
            return {"ok": True, "number": formatted.get("number"),
                    "html_url": formatted.get("html_url", ""),
                    "issue": formatted, "error": None}

        def update_issue(self, owner: str, repo: str, number: int,
                         title: Optional[str] = None,
                         body: Optional[str] = None,
                         state: Optional[str] = None,
                         state_reason: Optional[str] = None,
                         labels: Optional[list] = None,
                         assignees: Optional[list] = None,
                         milestone: Optional[int] = None) -> Dict[str, Any]:
            """Issue を更新する (PATCH /repos/{owner}/{repo}/issues/{number})。

            None の引数は変更されない。 labels / assignees に空配列 [] を渡すと全クリア。
            state: "open" | "closed"
            state_reason (closed 時): "completed" | "not_planned" | "reopened"
            """
            url = f"{self.base_url}/repos/{owner}/{repo}/issues/{int(number)}"
            payload: Dict[str, Any] = {}
            if title is not None:
                payload["title"] = title
            if body is not None:
                payload["body"] = body
            if state is not None:
                if state not in ("open", "closed"):
                    return {"ok": False, "issue": None, "error": "state must be 'open' or 'closed'"}
                payload["state"] = state
            if state_reason is not None:
                payload["state_reason"] = state_reason
            if labels is not None:
                payload["labels"] = labels
            if assignees is not None:
                payload["assignees"] = assignees
            if milestone is not None:
                payload["milestone"] = milestone

            if not payload:
                return {"ok": False, "issue": None, "error": "no fields to update"}

            try:
                response = requests.patch(url, headers=self.headers, json=payload, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] update_issue network error for {owner}/{repo}#{number}: {e}")
                return {"ok": False, "issue": None,
                        "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}

            if response.status_code != 200:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                logger.error(f"[GITHUB] update_issue failed for {owner}/{repo}#{number}: status={response.status_code}")
                return {"ok": False, "issue": None,
                        "error": f"HTTP {response.status_code}: {err_text}"}

            data = response.json() or {}
            formatted = self._format_issue(data)
            logger.info(f"[GITHUB] update_issue: {owner}/{repo}#{number} state={formatted.get('state')}")
            return {"ok": True, "issue": formatted, "error": None}

        def add_issue_comment(self, owner: str, repo: str, number: int, body: str) -> Dict[str, Any]:
            """Issue にコメントを追加する (POST /repos/{owner}/{repo}/issues/{number}/comments)。"""
            if not body or not body.strip():
                return {"ok": False, "comment_id": None, "html_url": "",
                        "error": "body is required"}

            url = f"{self.base_url}/repos/{owner}/{repo}/issues/{int(number)}/comments"
            try:
                response = requests.post(url, headers=self.headers, json={"body": body}, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] add_issue_comment network error for {owner}/{repo}#{number}: {e}")
                return {"ok": False, "comment_id": None, "html_url": "",
                        "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}

            if response.status_code != 201:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                logger.error(f"[GITHUB] add_issue_comment failed for {owner}/{repo}#{number}: status={response.status_code}")
                return {"ok": False, "comment_id": None, "html_url": "",
                        "error": f"HTTP {response.status_code}: {err_text}"}

            data = response.json() or {}
            logger.info(f"[GITHUB] add_issue_comment: {owner}/{repo}#{number} comment={data.get('id')}")
            return {"ok": True, "comment_id": data.get("id"),
                    "html_url": data.get("html_url", ""), "error": None}

        # --- GitHub Actions (workflows / workflow runs / jobs) ---------------

        def list_workflows(self, owner: str, repo: str,
                           per_page: int = 50, page: int = 1) -> Dict[str, Any]:
            """ワークフロー定義の一覧 (GET /repos/{owner}/{repo}/actions/workflows)。"""
            url = f"{self.base_url}/repos/{owner}/{repo}/actions/workflows"
            params = {"per_page": max(1, min(100, int(per_page))), "page": max(1, int(page))}
            try:
                response = requests.get(url, headers=self.headers, params=params, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] list_workflows network error for {owner}/{repo}: {e}")
                return {"ok": False, "total_count": 0, "workflows": [],
                        "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}
            if response.status_code != 200:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                return {"ok": False, "total_count": 0, "workflows": [],
                        "error": f"HTTP {response.status_code}: {err_text}"}
            d = response.json() or {}
            return {"ok": True,
                    "total_count": d.get("total_count", 0),
                    "workflows": d.get("workflows", []) or [],
                    "error": None}

        def list_workflow_runs(self, owner: str, repo: str,
                               workflow: "str | int | None" = None,
                               branch: "str | None" = None,
                               event: "str | None" = None,
                               status: "str | None" = None,
                               actor: "str | None" = None,
                               per_page: int = 30, page: int = 1) -> Dict[str, Any]:
            """ワークフロー実行一覧。

            workflow が None ならリポジトリ全体の実行一覧
            (GET /repos/{owner}/{repo}/actions/runs)。
            workflow が指定されれば特定ワークフローの実行一覧
            (GET /repos/{owner}/{repo}/actions/workflows/{workflow}/runs)。
            workflow は id (int) でもファイル名 (例: "build.yml") でも可。

            status は GitHub Actions が受け付ける値:
              queued / in_progress / completed / waiting / pending /
              success / failure / cancelled / skipped / timed_out /
              action_required / neutral / stale / requested
            """
            if workflow is None or (isinstance(workflow, str) and not workflow.strip()):
                url = f"{self.base_url}/repos/{owner}/{repo}/actions/runs"
            else:
                wf = str(workflow).strip()
                url = f"{self.base_url}/repos/{owner}/{repo}/actions/workflows/{wf}/runs"
            params: dict = {"per_page": max(1, min(100, int(per_page))),
                            "page": max(1, int(page))}
            if branch:
                params["branch"] = branch
            if event:
                params["event"] = event
            if status:
                params["status"] = status
            if actor:
                params["actor"] = actor
            try:
                response = requests.get(url, headers=self.headers, params=params, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] list_workflow_runs network error for {owner}/{repo}: {e}")
                return {"ok": False, "total_count": 0, "workflow_runs": [],
                        "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}
            if response.status_code != 200:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                return {"ok": False, "total_count": 0, "workflow_runs": [],
                        "error": f"HTTP {response.status_code}: {err_text}"}
            d = response.json() or {}
            # 応答が大きくなりやすいので、 主要フィールドだけ抜粋する
            runs = []
            for r in (d.get("workflow_runs") or []):
                runs.append({
                    "id": r.get("id"),
                    "name": r.get("name"),
                    "display_title": r.get("display_title"),
                    "head_branch": r.get("head_branch"),
                    "head_sha": (r.get("head_sha") or "")[:7],
                    "event": r.get("event"),
                    "status": r.get("status"),
                    "conclusion": r.get("conclusion"),
                    "run_number": r.get("run_number"),
                    "run_attempt": r.get("run_attempt"),
                    "actor": (r.get("actor") or {}).get("login"),
                    "created_at": r.get("created_at"),
                    "updated_at": r.get("updated_at"),
                    "run_started_at": r.get("run_started_at"),
                    "html_url": r.get("html_url"),
                    "workflow_id": r.get("workflow_id"),
                })
            return {"ok": True,
                    "total_count": d.get("total_count", 0),
                    "workflow_runs": runs,
                    "error": None}

        def get_workflow_run(self, owner: str, repo: str, run_id: int) -> Dict[str, Any]:
            """ワークフロー実行 1 件の詳細 (GET /repos/{owner}/{repo}/actions/runs/{run_id})。"""
            url = f"{self.base_url}/repos/{owner}/{repo}/actions/runs/{int(run_id)}"
            try:
                response = requests.get(url, headers=self.headers, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] get_workflow_run network error for {owner}/{repo}/{run_id}: {e}")
                return {"ok": False, "run": None,
                        "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}
            if response.status_code != 200:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                return {"ok": False, "run": None,
                        "error": f"HTTP {response.status_code}: {err_text}"}
            r = response.json() or {}
            return {"ok": True,
                    "run": {
                        "id": r.get("id"),
                        "name": r.get("name"),
                        "display_title": r.get("display_title"),
                        "head_branch": r.get("head_branch"),
                        "head_sha": (r.get("head_sha") or "")[:7],
                        "event": r.get("event"),
                        "status": r.get("status"),
                        "conclusion": r.get("conclusion"),
                        "run_number": r.get("run_number"),
                        "run_attempt": r.get("run_attempt"),
                        "actor": (r.get("actor") or {}).get("login"),
                        "triggering_actor": (r.get("triggering_actor") or {}).get("login"),
                        "created_at": r.get("created_at"),
                        "updated_at": r.get("updated_at"),
                        "run_started_at": r.get("run_started_at"),
                        "html_url": r.get("html_url"),
                        "logs_url": r.get("logs_url"),
                        "jobs_url": r.get("jobs_url"),
                        "workflow_id": r.get("workflow_id"),
                    },
                    "error": None}

        def list_workflow_run_jobs(self, owner: str, repo: str, run_id: int,
                                   filter: str = "latest",
                                   per_page: int = 30, page: int = 1) -> Dict[str, Any]:
            """実行の job 一覧 (GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs)。

            filter='latest' (default) は最新試行のみ、 'all' は全試行を返す。
            各 job の steps (各ステップの状態) も含めて返す。
            """
            url = f"{self.base_url}/repos/{owner}/{repo}/actions/runs/{int(run_id)}/jobs"
            params = {"filter": filter if filter in ("latest", "all") else "latest",
                      "per_page": max(1, min(100, int(per_page))),
                      "page": max(1, int(page))}
            try:
                response = requests.get(url, headers=self.headers, params=params, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] list_workflow_run_jobs network error for {owner}/{repo}/{run_id}: {e}")
                return {"ok": False, "total_count": 0, "jobs": [],
                        "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}
            if response.status_code != 200:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                return {"ok": False, "total_count": 0, "jobs": [],
                        "error": f"HTTP {response.status_code}: {err_text}"}
            d = response.json() or {}
            jobs = []
            for j in (d.get("jobs") or []):
                steps = []
                for s in (j.get("steps") or []):
                    steps.append({
                        "name": s.get("name"),
                        "status": s.get("status"),
                        "conclusion": s.get("conclusion"),
                        "number": s.get("number"),
                        "started_at": s.get("started_at"),
                        "completed_at": s.get("completed_at"),
                    })
                jobs.append({
                    "id": j.get("id"),
                    "run_id": j.get("run_id"),
                    "name": j.get("name"),
                    "status": j.get("status"),
                    "conclusion": j.get("conclusion"),
                    "started_at": j.get("started_at"),
                    "completed_at": j.get("completed_at"),
                    "html_url": j.get("html_url"),
                    "runner_name": j.get("runner_name"),
                    "labels": j.get("labels") or [],
                    "steps": steps,
                })
            return {"ok": True,
                    "total_count": d.get("total_count", 0),
                    "jobs": jobs,
                    "error": None}

        def dispatch_workflow(self, owner: str, repo: str, workflow: str,
                              ref: str, inputs: "dict | None" = None) -> Dict[str, Any]:
            """ワークフローを手動トリガーする
            (POST /repos/{owner}/{repo}/actions/workflows/{workflow}/dispatches)。

            workflow はワークフロー id (int) でも、 ファイル名 (例: "build.yml") でも可。
            ref は ブランチ名 / tag 名 / commit SHA。
            inputs はワークフロー側で workflow_dispatch.inputs に定義したもの。
            成功時 GitHub は 204 No Content を返す (run_id は返らないため、
            直後に list_workflow_runs で確認する。)
            """
            wf = str(workflow).strip()
            if not wf:
                return {"ok": False, "error": "workflow is required"}
            if not ref or not str(ref).strip():
                return {"ok": False, "error": "ref is required"}
            url = f"{self.base_url}/repos/{owner}/{repo}/actions/workflows/{wf}/dispatches"
            payload: dict = {"ref": str(ref).strip()}
            if inputs:
                # GitHub は string 値のみ受け付ける
                payload["inputs"] = {str(k): ("" if v is None else str(v))
                                     for k, v in dict(inputs).items()}
            try:
                response = requests.post(url, headers=self.headers, json=payload, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] dispatch_workflow network error for {owner}/{repo} wf={wf}: {e}")
                return {"ok": False, "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}
            if response.status_code != 204:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                return {"ok": False,
                        "error": f"HTTP {response.status_code}: {err_text}"}
            logger.info(f"[GITHUB] dispatch_workflow: {owner}/{repo} wf={wf} ref={ref}")
            return {"ok": True, "workflow": wf, "ref": str(ref).strip(),
                    "inputs": payload.get("inputs") or {},
                    "note": "GitHub returns 204 No Content; use list_workflow_runs to locate the new run.",
                    "error": None}

        def rerun_workflow_run(self, owner: str, repo: str, run_id: int,
                               failed_only: bool = False) -> Dict[str, Any]:
            """ワークフロー実行を再実行する。

            failed_only=True なら失敗 job のみ再実行
            (POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs)。
            False なら全 job を再実行
            (POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun)。
            成功時は 201 を返す。
            """
            if failed_only:
                url = f"{self.base_url}/repos/{owner}/{repo}/actions/runs/{int(run_id)}/rerun-failed-jobs"
            else:
                url = f"{self.base_url}/repos/{owner}/{repo}/actions/runs/{int(run_id)}/rerun"
            try:
                response = requests.post(url, headers=self.headers, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] rerun_workflow_run network error for {owner}/{repo}/{run_id}: {e}")
                return {"ok": False, "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}
            if response.status_code not in (201, 202):
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                return {"ok": False,
                        "error": f"HTTP {response.status_code}: {err_text}"}
            logger.info(f"[GITHUB] rerun_workflow_run: {owner}/{repo}/{run_id} failed_only={failed_only}")
            return {"ok": True, "run_id": int(run_id), "failed_only": bool(failed_only),
                    "error": None}

        def cancel_workflow_run(self, owner: str, repo: str, run_id: int) -> Dict[str, Any]:
            """実行中のワークフローをキャンセル
            (POST /repos/{owner}/{repo}/actions/runs/{run_id}/cancel)。 成功時 202。"""
            url = f"{self.base_url}/repos/{owner}/{repo}/actions/runs/{int(run_id)}/cancel"
            try:
                response = requests.post(url, headers=self.headers, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] cancel_workflow_run network error for {owner}/{repo}/{run_id}: {e}")
                return {"ok": False, "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}
            if response.status_code not in (202, 200):
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                return {"ok": False,
                        "error": f"HTTP {response.status_code}: {err_text}"}
            logger.info(f"[GITHUB] cancel_workflow_run: {owner}/{repo}/{run_id}")
            return {"ok": True, "run_id": int(run_id), "error": None}

        # --- Issue 周辺の閲覧系 (Phase A) -------------------------------------

        def list_issue_events(self, owner: str, repo: str, number: int,
                              per_page: int = 30, page: int = 1) -> Dict[str, Any]:
            """Issue の event 履歴を取得する
            (GET /repos/{owner}/{repo}/issues/{number}/events)。

            誰がいつ assign / label / milestone / closed / reopened / merged
            等の操作をしたか。 コメント本文ではなく状態遷移の記録。
            """
            url = f"{self.base_url}/repos/{owner}/{repo}/issues/{int(number)}/events"
            params = {
                "per_page": max(1, min(int(per_page or 30), 100)),
                "page": max(1, int(page or 1)),
            }
            try:
                response = requests.get(url, headers=self.headers, params=params, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] list_issue_events network error for {owner}/{repo}#{number}: {e}")
                return {"ok": False, "events": [],
                        "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}
            if response.status_code != 200:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                return {"ok": False, "events": [],
                        "error": f"HTTP {response.status_code}: {err_text}"}
            data = response.json() or []
            events = []
            for e in data:
                actor = e.get("actor") or {}
                ev = {
                    "id": e.get("id"),
                    "event": e.get("event"),
                    "actor": actor.get("login", ""),
                    "created_at": e.get("created_at", ""),
                    "commit_id": e.get("commit_id"),
                }
                # event 種別ごとの補足
                if e.get("label"):
                    ev["label"] = (e.get("label") or {}).get("name", "")
                if e.get("assignee"):
                    ev["assignee"] = (e.get("assignee") or {}).get("login", "")
                if e.get("milestone"):
                    ev["milestone"] = (e.get("milestone") or {}).get("title", "")
                if e.get("rename"):
                    ev["rename"] = e.get("rename")
                if e.get("state_reason"):
                    ev["state_reason"] = e.get("state_reason")
                events.append(ev)
            return {"ok": True, "events": events, "error": None}

        def search_issues(self, q: str,
                          sort: "str | None" = None,
                          order: str = "desc",
                          per_page: int = 30,
                          page: int = 1) -> Dict[str, Any]:
            """GitHub 検索 API で Issue / PR を横断検索する
            (GET /search/issues?q=...)。

            q には GitHub の検索構文をそのまま渡す。 例:
              "repo:your-org/your-repo is:issue is:open"
              "is:pr review-requested:your-user"
              "author:your-user label:bug created:>=2026-01-01"
              "repo:foo/bar is:open -label:wontfix sort:updated"
            ツール側で構文の解釈はしない (透過プロキシ)。

            sort: comments / reactions / reactions-+1 / reactions--1 /
                  reactions-smile / reactions-thinking_face /
                  reactions-heart / reactions-tada / interactions /
                  created / updated。 None なら best match。
            order: asc / desc (default desc)。
            """
            if not q or not q.strip():
                return {"ok": False, "total_count": 0, "items": [],
                        "incomplete_results": False, "error": "q is required"}
            url = f"{self.base_url}/search/issues"
            params: dict = {
                "q": q,
                "per_page": max(1, min(int(per_page or 30), 100)),
                "page": max(1, int(page or 1)),
                "order": order if order in ("asc", "desc") else "desc",
            }
            if sort:
                params["sort"] = sort
            try:
                response = requests.get(url, headers=self.headers, params=params, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] search_issues network error: {e}")
                return {"ok": False, "total_count": 0, "items": [],
                        "incomplete_results": False,
                        "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}
            if response.status_code != 200:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                return {"ok": False, "total_count": 0, "items": [],
                        "incomplete_results": False,
                        "error": f"HTTP {response.status_code}: {err_text}"}
            d = response.json() or {}
            items = []
            for it in (d.get("items") or []):
                user = it.get("user") or {}
                pull = it.get("pull_request") or None
                items.append({
                    "id": it.get("id"),
                    "number": it.get("number"),
                    "title": it.get("title"),
                    "state": it.get("state"),
                    "state_reason": it.get("state_reason"),
                    "is_pr": bool(pull),
                    "draft": it.get("draft"),
                    "user": user.get("login", ""),
                    "labels": [(la or {}).get("name", "") for la in (it.get("labels") or [])],
                    "assignees": [(a or {}).get("login", "") for a in (it.get("assignees") or [])],
                    "comments": it.get("comments"),
                    "created_at": it.get("created_at", ""),
                    "updated_at": it.get("updated_at", ""),
                    "closed_at": it.get("closed_at"),
                    "html_url": it.get("html_url", ""),
                    "repository_url": it.get("repository_url", ""),
                })
            return {"ok": True,
                    "total_count": d.get("total_count", 0),
                    "incomplete_results": bool(d.get("incomplete_results")),
                    "items": items,
                    "error": None}

        def list_labels(self, owner: str, repo: str,
                        per_page: int = 100, page: int = 1) -> Dict[str, Any]:
            """リポジトリのラベル一覧を取得する
