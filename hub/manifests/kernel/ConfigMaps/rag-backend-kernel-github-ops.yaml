    # ======================================================================
    # GitHub Checkpoint / Restore (Phase A)
    # ----------------------------------------------------------------------
    # lightweight tag を checkpoint として使い、 後から特定ファイルだけ
    # その時点の内容に巻き戻せるようにする。 GitOps 配下なので reset ではなく
    # forward commit 方式 (履歴は消さない)。
    # ======================================================================

    def _gh_resolve_commit_sha(client, owner, repo, ref):
        """ref を commit SHA に解決する。

        - ref が空: default branch HEAD
        - ref が 40 桁 hex: そのまま使う
        - それ以外: branch とみなして heads/{ref} を引く

        Returns: (sha, error_str_or_None)
        """
        if not ref:
            r = requests.get(f"{client.base_url}/repos/{owner}/{repo}",
                             headers=client.headers, timeout=30)
            if r.status_code != 200:
                return None, f"repo lookup failed: HTTP {r.status_code}"
            ref = r.json().get("default_branch", "main")
        if len(ref) == 40 and all(c in "0123456789abcdef" for c in ref.lower()):
            return ref.lower(), None
        r = requests.get(
            f"{client.base_url}/repos/{owner}/{repo}/git/refs/heads/{ref}",
            headers=client.headers, timeout=30)
        if r.status_code != 200:
            return None, f"branch '{ref}' not found: HTTP {r.status_code}"
        sha = r.json().get("object", {}).get("sha", "")
        if not sha:
            return None, f"branch '{ref}' resolved to empty SHA"
        return sha, None


    @router.post("/core/github/create-tag")
    async def core_github_create_tag(request: dict):
        """lightweight tag を作成する (checkpoint 用)。

        Body:
            {
              "owner": "your-org",
              "repo":  "rag",
              "tag":   "checkpoint/claude/before_phaseA",
              "ref":   "main" | "<40-char SHA>" | null,
              "user_id": "..."
            }
        Returns:
            {"ok": bool, "tag": str, "sha": str, "error": str|null}
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        tag = (request.get("tag") or "").strip()
        ref = (request.get("ref") or "").strip()
        if not owner or not repo or not tag:
            return {"ok": False, "tag": "", "sha": "",
                    "error": "owner, repo, tag are required"}
        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "tag": "", "sha": "",
                    "error": f"github token unavailable: {_e}"}
        try:
            client = GitHubAPIClient(token=github_token)
            commit_sha, err = _gh_resolve_commit_sha(client, owner, repo, ref)
            if err:
                return {"ok": False, "tag": "", "sha": "", "error": err}
            r = requests.post(
                f"{client.base_url}/repos/{owner}/{repo}/git/refs",
                headers=client.headers,
                json={"ref": f"refs/tags/{tag}", "sha": commit_sha},
                timeout=30,
            )
            if r.status_code == 422:
                return {"ok": False, "tag": tag, "sha": commit_sha,
                        "error": f"tag already exists: {tag}"}
            if r.status_code not in (200, 201):
                return {"ok": False, "tag": tag, "sha": commit_sha,
                        "error": f"create-tag HTTP {r.status_code}: {r.text[:200]}"}
            return {"ok": True, "tag": tag, "sha": commit_sha, "error": None}
        except Exception as e:
            logger.error(f"[GITHUB_CREATE_TAG] unexpected error: {e}", exc_info=True)
            return {"ok": False, "tag": "", "sha": "",
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/list-tags")
    async def core_github_list_tags(request: dict):
        """tag 一覧を取得する (prefix 絞り込み + committed_date 降順)。

        実装: /git/matching-refs/tags/{prefix} で tag を引いて、 各 tag が
        指す commit の committer.date で降順ソート。 limit 件で打ち切り。

        Body:
            {"owner": str, "repo": str, "prefix": "checkpoint/claude/",
             "limit": 20, "user_id": "..."}
        Returns:
            {"ok": bool, "tags": [{"name": str, "sha": str, "date": str}],
             "error": str|null}
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        prefix = (request.get("prefix") or "").strip()
        limit = max(1, min(200, int(request.get("limit") or 20)))
        if not owner or not repo:
            return {"ok": False, "tags": [],
                    "error": "owner, repo are required"}
        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "tags": [],
                    "error": f"github token unavailable: {_e}"}
        try:
            client = GitHubAPIClient(token=github_token)
            # matching-refs path: tags/{prefix} (no leading "refs/")
            api_suffix = f"tags/{prefix}" if prefix else "tags"
            url = f"{client.base_url}/repos/{owner}/{repo}/git/matching-refs/{api_suffix}"
            r = requests.get(url, headers=client.headers, timeout=30)
            if r.status_code != 200:
                return {"ok": False, "tags": [],
                        "error": f"list-tags HTTP {r.status_code}: {r.text[:200]}"}
            refs = r.json() or []
            items = []
            for ref in refs:
                ref_name = ref.get("ref", "")
                name = ref_name[len("refs/tags/"):] if ref_name.startswith("refs/tags/") else ref_name
                obj = ref.get("object", {}) or {}
                sha = obj.get("sha", "")
                obj_type = obj.get("type", "")
                if obj_type == "tag":
                    # Annotated tag -> resolve to commit
                    rr = requests.get(
                        f"{client.base_url}/repos/{owner}/{repo}/git/tags/{sha}",
                        headers=client.headers, timeout=30)
                    if rr.status_code == 200:
                        sha = rr.json().get("object", {}).get("sha", sha)
                items.append({"name": name, "sha": sha})
            # Fetch committer dates for top candidates (capped to keep API calls bounded)
            top_n = min(len(items), max(limit * 3, 60))
            for it in items[:top_n]:
                s = it.get("sha", "")
                if not s:
                    continue
                cr = requests.get(
                    f"{client.base_url}/repos/{owner}/{repo}/git/commits/{s}",
                    headers=client.headers, timeout=30)
                if cr.status_code == 200:
                    it["date"] = cr.json().get("committer", {}).get("date", "")
            for it in items:
                it.setdefault("date", "")
            items.sort(key=lambda x: x.get("date", ""), reverse=True)
            return {"ok": True, "tags": items[:limit], "error": None}
        except Exception as e:
            logger.error(f"[GITHUB_LIST_TAGS] unexpected error: {e}", exc_info=True)
            return {"ok": False, "tags": [],
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/delete-tag")
    async def core_github_delete_tag(request: dict):
        """tag を削除する。

        Body:
            {"owner": str, "repo": str, "tag": str, "user_id": "..."}
        Returns:
            {"ok": bool, "deleted": bool, "error": str|null}
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        tag = (request.get("tag") or "").strip()
        if not owner or not repo or not tag:
            return {"ok": False, "deleted": False,
                    "error": "owner, repo, tag are required"}
        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "deleted": False,
                    "error": f"github token unavailable: {_e}"}
        try:
            client = GitHubAPIClient(token=github_token)
            r = requests.delete(
                f"{client.base_url}/repos/{owner}/{repo}/git/refs/tags/{tag}",
                headers=client.headers, timeout=30)
            if r.status_code in (404, 422):
                return {"ok": True, "deleted": False, "error": None}
            if r.status_code not in (200, 204):
                return {"ok": False, "deleted": False,
                        "error": f"delete-tag HTTP {r.status_code}: {r.text[:200]}"}
            return {"ok": True, "deleted": True, "error": None}
        except Exception as e:
            logger.error(f"[GITHUB_DELETE_TAG] unexpected error: {e}", exc_info=True)
            return {"ok": False, "deleted": False,
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/restore-from-tag")
    async def core_github_restore_from_tag(request: dict):
        """tag 時点の内容で指定 paths を branch に forward commit する。

        実装手順:
          1. tag -> commit SHA (annotated tag は一段解決)
          2. branch -> head commit SHA + head tree SHA
          3. 各 path について tag 時点の blob SHA を取得
             (path が tag 時点に存在しなければ削除扱い = sha:null)
          4. base_tree=head_tree_sha の上に変更分を載せた new_tree を作成
          5. parents=[head_commit_sha] で new commit を作成
          6. branch ref を new commit に PATCH (force=False)

        Body:
            {
              "owner": str, "repo": str, "tag": str,
              "paths": [str, ...],
              "message": str,
              "branch": str | null,
              "user_id": "..."
            }
        Returns:
            {
              "ok": bool,
              "restored_paths": [str, ...],
              "deleted_paths": [str, ...],
              "commit_sha": str,
              "html_url": str,
              "error": str | null
            }
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        tag = (request.get("tag") or "").strip()
        message = (request.get("message") or "").strip()
        branch = request.get("branch") or None
        paths = request.get("paths") or []
        if not isinstance(paths, list):
            return {"ok": False, "restored_paths": [], "deleted_paths": [],
                    "commit_sha": "", "html_url": "",
                    "error": "paths must be a list"}
        paths = [str(p).strip() for p in paths if str(p).strip()]
        if not owner or not repo or not tag or not message or not paths:
            return {"ok": False, "restored_paths": [], "deleted_paths": [],
                    "commit_sha": "", "html_url": "",
                    "error": "owner, repo, tag, message, paths are required"}
        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "restored_paths": [], "deleted_paths": [],
                    "commit_sha": "", "html_url": "",
                    "error": f"github token unavailable: {_e}"}
        try:
            client = GitHubAPIClient(token=github_token)
            base = client.base_url
            hdrs = client.headers

            # 1. tag -> commit SHA
            r = requests.get(f"{base}/repos/{owner}/{repo}/git/refs/tags/{tag}",
                             headers=hdrs, timeout=30)
            if r.status_code != 200:
                return {"ok": False, "restored_paths": [], "deleted_paths": [],
                        "commit_sha": "", "html_url": "",
                        "error": f"tag '{tag}' not found: HTTP {r.status_code}"}
            obj = r.json().get("object", {}) or {}
            tag_sha = obj.get("sha", "")
            if obj.get("type") == "tag":
                rr = requests.get(f"{base}/repos/{owner}/{repo}/git/tags/{tag_sha}",
                                  headers=hdrs, timeout=30)
                if rr.status_code == 200:
                    tag_sha = rr.json().get("object", {}).get("sha", tag_sha)
            if not tag_sha:
                return {"ok": False, "restored_paths": [], "deleted_paths": [],
                        "commit_sha": "", "html_url": "",
                        "error": f"tag '{tag}' has empty SHA"}

            # 2. branch -> head commit + tree
            if not branch:
                rb = requests.get(f"{base}/repos/{owner}/{repo}",
                                  headers=hdrs, timeout=30)
                if rb.status_code != 200:
                    return {"ok": False, "restored_paths": [], "deleted_paths": [],
                            "commit_sha": "", "html_url": "",
                            "error": f"repo lookup failed: HTTP {rb.status_code}"}
                branch = rb.json().get("default_branch", "main")
            r = requests.get(f"{base}/repos/{owner}/{repo}/git/refs/heads/{branch}",
                             headers=hdrs, timeout=30)
            if r.status_code != 200:
                return {"ok": False, "restored_paths": [], "deleted_paths": [],
                        "commit_sha": "", "html_url": "",
                        "error": f"branch '{branch}' not found: HTTP {r.status_code}"}
            head_sha = r.json().get("object", {}).get("sha", "")
            r = requests.get(f"{base}/repos/{owner}/{repo}/git/commits/{head_sha}",
                             headers=hdrs, timeout=30)
            if r.status_code != 200:
                return {"ok": False, "restored_paths": [], "deleted_paths": [],
                        "commit_sha": "", "html_url": "",
                        "error": f"head commit lookup failed: HTTP {r.status_code}"}
            head_tree_sha = r.json().get("tree", {}).get("sha", "")

            # 3. 各 path について tag 時点の blob SHA を取得
            tree_entries = []
            restored = []
            deleted = []
            for p in paths:
                rr = requests.get(
                    f"{base}/repos/{owner}/{repo}/contents/{p}",
                    headers=hdrs, params={"ref": tag_sha}, timeout=30)
                if rr.status_code == 200:
                    data = rr.json()
                    if isinstance(data, dict) and data.get("type") == "file":
                        blob_sha = data.get("sha", "")
                        tree_entries.append({
                            "path": p, "mode": "100644", "type": "blob",
                            "sha": blob_sha,
                        })
                        restored.append(p)
                    else:
                        return {"ok": False, "restored_paths": [],
                                "deleted_paths": [],
                                "commit_sha": "", "html_url": "",
                                "error": f"path '{p}' is not a regular file (dir restore は v1 未対応)"}
                elif rr.status_code == 404:
                    tree_entries.append({
                        "path": p, "mode": "100644", "type": "blob",
                        "sha": None,
                    })
                    deleted.append(p)
                else:
                    return {"ok": False, "restored_paths": [], "deleted_paths": [],
                            "commit_sha": "", "html_url": "",
                            "error": f"contents lookup for '{p}' HTTP {rr.status_code}"}

            # 4. new tree
            r = requests.post(
                f"{base}/repos/{owner}/{repo}/git/trees",
                headers=hdrs,
                json={"base_tree": head_tree_sha, "tree": tree_entries},
                timeout=60,
            )
            if r.status_code not in (200, 201):
                return {"ok": False, "restored_paths": [], "deleted_paths": [],
                        "commit_sha": "", "html_url": "",
                        "error": f"create-tree HTTP {r.status_code}: {r.text[:200]}"}
            new_tree_sha = r.json().get("sha", "")

            # No-op short-circuit
            if new_tree_sha == head_tree_sha:
                return {"ok": True, "restored_paths": restored,
                        "deleted_paths": deleted,
                        "commit_sha": head_sha, "html_url": "",
                        "error": "no-op (tag 時点と現在の内容が一致)"}

            # 5. new commit
            r = requests.post(
                f"{base}/repos/{owner}/{repo}/git/commits",
                headers=hdrs,
                json={"message": message, "tree": new_tree_sha,
                      "parents": [head_sha]},
                timeout=60,
            )
            if r.status_code not in (200, 201):
                return {"ok": False, "restored_paths": [], "deleted_paths": [],
                        "commit_sha": "", "html_url": "",
                        "error": f"create-commit HTTP {r.status_code}: {r.text[:200]}"}
            new_commit = r.json()
            new_commit_sha = new_commit.get("sha", "")
            new_commit_url = new_commit.get("html_url", "")

            # 6. update branch ref
            r = requests.patch(
                f"{base}/repos/{owner}/{repo}/git/refs/heads/{branch}",
                headers=hdrs,
                json={"sha": new_commit_sha, "force": False},
                timeout=30,
            )
            if r.status_code not in (200, 201):
                return {"ok": False, "restored_paths": restored,
                        "deleted_paths": deleted,
                        "commit_sha": new_commit_sha, "html_url": new_commit_url,
                        "error": f"update-ref HTTP {r.status_code}: {r.text[:200]} (commit は作成済み)"}

            return {"ok": True, "restored_paths": restored,
                    "deleted_paths": deleted,
                    "commit_sha": new_commit_sha,
                    "html_url": new_commit_url, "error": None}
        except Exception as e:
            logger.error(f"[GITHUB_RESTORE_FROM_TAG] unexpected error: {e}", exc_info=True)
            return {"ok": False, "restored_paths": [], "deleted_paths": [],
                    "commit_sha": "", "html_url": "",
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    # ======================================================================
    # GitHub Auto-Checkpoint (Phase A.2)
    # ----------------------------------------------------------------------
    # put-file / delete-file 等の write 系が実行されるたびに、 直前の commit
    # SHA を OpenSearch index 'github_autockpt' に自動記録する。 これにより
    # 「直前の str_replace で壊れたから戻したい」 が低オーバーヘッドで可能。
    # 利用側: github_autockpt_list で履歴閲覧、 github_restore_from_sha で復元。
    # ======================================================================

    def _get_commit_parent_sha(client, owner, repo, commit_sha):
        """1 つ目の親 commit SHA を返す (初回 commit や取得失敗時は None)。"""
        if not commit_sha:
            return None
        try:
            r = requests.get(
                f"{client.base_url}/repos/{owner}/{repo}/git/commits/{commit_sha}",
                headers=client.headers, timeout=10,
            )
            if r.status_code == 200:
                parents = r.json().get("parents") or []
                if parents:
                    return parents[0].get("sha", "") or None
        except Exception:
            pass
        return None


    def _record_autockpt(owner, repo, path, branch, pre_commit_sha,
                         tool, message, user_id):
        """auto-checkpoint を OpenSearch 'github_autockpt' index に記録する。

        ベストエフォート: 失敗してもログ警告のみで例外は投げない。
        """
        if not pre_commit_sha:
            return
        try:
            from datetime import datetime, timezone
            doc = {
                "owner": owner,
                "repo": repo,
                "path": path,
                "branch": branch or "main",
                "pre_commit_sha": pre_commit_sha,
                "tool": tool or "put-file",
                "commit_message": (message or "")[:500],
                "user_id": (user_id or ""),
                "created_at": datetime.now(timezone.utc).isoformat(),
            }
            requests.post(
                f"{OPENSEARCH_URL}/github_autockpt/_doc",
                json=doc,
                timeout=5,
            )
        except Exception as e:
            try:
                logger.warning(f"[AUTOCKPT] record failed (non-fatal): {e}")
            except Exception:
                pass


    @router.post("/core/github/autockpt-list")
    async def core_github_autockpt_list(request: dict):
        """auto-checkpoint の一覧を返す (新しい順)。

        Body:
            {"owner": str, "repo": str,
             "path": str (任意),
             "branch": str (任意),
             "limit": 20 (max 200), "user_id": ...}
        Returns:
            {"ok": bool,
             "items": [{"id", "owner", "repo", "path", "branch",
                        "pre_commit_sha", "tool", "commit_message",
                        "user_id", "created_at"}],
             "error": str|null}
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        branch = (request.get("branch") or "").strip()
        limit = max(1, min(200, int(request.get("limit") or 20)))

        must = []
        if owner:
            must.append({"term": {"owner.keyword": owner}})
        if repo:
            must.append({"term": {"repo.keyword": repo}})
        if path:
            must.append({"term": {"path.keyword": path}})
        if branch:
            must.append({"term": {"branch.keyword": branch}})

        query = {
            "size": limit,
            "sort": [{"created_at": {"order": "desc"}}],
            "query": {"bool": {"must": must}} if must else {"match_all": {}},
        }
        try:
            r = requests.post(
                f"{OPENSEARCH_URL}/github_autockpt/_search",
                json=query, timeout=10,
            )
            if r.status_code == 404:
                # Index not yet created (no autockpt recorded yet)
                return {"ok": True, "items": [], "error": None}
            if r.status_code != 200:
                return {"ok": False, "items": [],
                        "error": f"OS HTTP {r.status_code}: {r.text[:200]}"}
            hits = r.json().get("hits", {}).get("hits", []) or []
            items = []
            for h in hits:
                src = dict(h.get("_source", {}) or {})
                src["id"] = h.get("_id", "")
                items.append(src)
            return {"ok": True, "items": items, "error": None}
        except Exception as e:
            logger.error(f"[GITHUB_AUTOCKPT_LIST] unexpected error: {e}", exc_info=True)
            return {"ok": False, "items": [],
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/restore-from-sha")
    async def core_github_restore_from_sha(request: dict):
        """commit SHA 時点の内容で指定 paths を branch に forward commit する。

        restore-from-tag と同じだが入力が tag ではなく commit SHA。
        auto-checkpoint からの復元に使う。

        Body:
            {
              "owner": str, "repo": str,
              "commit_sha": str,           # 復元元 commit SHA (40 桁 hex)
              "paths": [str, ...],
              "message": str,
              "branch": str | null,
              "user_id": "..."
            }
        Returns:
            {"ok": bool, "restored_paths": [], "deleted_paths": [],
             "commit_sha": str, "html_url": str, "error": str|null}
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        commit_sha = (request.get("commit_sha") or "").strip().lower()
        message = (request.get("message") or "").strip()
        branch = request.get("branch") or None
        paths = request.get("paths") or []
        if not isinstance(paths, list):
            return {"ok": False, "restored_paths": [], "deleted_paths": [],
                    "commit_sha": "", "html_url": "",
                    "error": "paths must be a list"}
        paths = [str(p).strip() for p in paths if str(p).strip()]
        if not owner or not repo or not commit_sha or not message or not paths:
            return {"ok": False, "restored_paths": [], "deleted_paths": [],
                    "commit_sha": "", "html_url": "",
                    "error": "owner, repo, commit_sha, message, paths are required"}
        if len(commit_sha) != 40 or not all(c in "0123456789abcdef" for c in commit_sha):
            return {"ok": False, "restored_paths": [], "deleted_paths": [],
                    "commit_sha": "", "html_url": "",
                    "error": "commit_sha must be a 40-char hex string"}
        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "restored_paths": [], "deleted_paths": [],
                    "commit_sha": "", "html_url": "",
                    "error": f"github token unavailable: {_e}"}
        try:
            client = GitHubAPIClient(token=github_token)
            base = client.base_url
            hdrs = client.headers

            # 1. branch -> head commit + tree
            if not branch:
                rb = requests.get(f"{base}/repos/{owner}/{repo}",
                                  headers=hdrs, timeout=30)
                if rb.status_code != 200:
                    return {"ok": False, "restored_paths": [], "deleted_paths": [],
                            "commit_sha": "", "html_url": "",
                            "error": f"repo lookup failed: HTTP {rb.status_code}"}
                branch = rb.json().get("default_branch", "main")
            r = requests.get(f"{base}/repos/{owner}/{repo}/git/refs/heads/{branch}",
                             headers=hdrs, timeout=30)
            if r.status_code != 200:
                return {"ok": False, "restored_paths": [], "deleted_paths": [],
                        "commit_sha": "", "html_url": "",
                        "error": f"branch '{branch}' not found: HTTP {r.status_code}"}
            head_sha = r.json().get("object", {}).get("sha", "")
            r = requests.get(f"{base}/repos/{owner}/{repo}/git/commits/{head_sha}",
                             headers=hdrs, timeout=30)
            if r.status_code != 200:
                return {"ok": False, "restored_paths": [], "deleted_paths": [],
                        "commit_sha": "", "html_url": "",
                        "error": f"head commit lookup failed: HTTP {r.status_code}"}
            head_tree_sha = r.json().get("tree", {}).get("sha", "")

            # 2. 各 path について commit_sha 時点の blob SHA を取得
            tree_entries = []
            restored = []
            deleted = []
            for p in paths:
                rr = requests.get(
                    f"{base}/repos/{owner}/{repo}/contents/{p}",
                    headers=hdrs, params={"ref": commit_sha}, timeout=30)
                if rr.status_code == 200:
                    data = rr.json()
                    if isinstance(data, dict) and data.get("type") == "file":
                        blob_sha = data.get("sha", "")
                        tree_entries.append({
                            "path": p, "mode": "100644", "type": "blob",
                            "sha": blob_sha,
                        })
                        restored.append(p)
                    else:
                        return {"ok": False, "restored_paths": [],
                                "deleted_paths": [],
                                "commit_sha": "", "html_url": "",
                                "error": f"path '{p}' is not a regular file (dir restore は v1 未対応)"}
                elif rr.status_code == 404:
                    tree_entries.append({
                        "path": p, "mode": "100644", "type": "blob",
                        "sha": None,
                    })
                    deleted.append(p)
                else:
                    return {"ok": False, "restored_paths": [], "deleted_paths": [],
                            "commit_sha": "", "html_url": "",
                            "error": f"contents lookup for '{p}' HTTP {rr.status_code}"}

            # 3. new tree
            r = requests.post(
                f"{base}/repos/{owner}/{repo}/git/trees",
                headers=hdrs,
                json={"base_tree": head_tree_sha, "tree": tree_entries},
                timeout=60,
            )
            if r.status_code not in (200, 201):
                return {"ok": False, "restored_paths": [], "deleted_paths": [],
                        "commit_sha": "", "html_url": "",
                        "error": f"create-tree HTTP {r.status_code}: {r.text[:200]}"}
            new_tree_sha = r.json().get("sha", "")

            if new_tree_sha == head_tree_sha:
                return {"ok": True, "restored_paths": restored,
                        "deleted_paths": deleted,
                        "commit_sha": head_sha, "html_url": "",
                        "error": "no-op (SHA 時点と現在の内容が一致)"}

            # 4. new commit
            r = requests.post(
                f"{base}/repos/{owner}/{repo}/git/commits",
                headers=hdrs,
                json={"message": message, "tree": new_tree_sha,
                      "parents": [head_sha]},
                timeout=60,
            )
            if r.status_code not in (200, 201):
                return {"ok": False, "restored_paths": [], "deleted_paths": [],
                        "commit_sha": "", "html_url": "",
                        "error": f"create-commit HTTP {r.status_code}: {r.text[:200]}"}
            new_commit = r.json()
            new_commit_sha = new_commit.get("sha", "")
            new_commit_url = new_commit.get("html_url", "")

            # 5. update branch ref
            r = requests.patch(
                f"{base}/repos/{owner}/{repo}/git/refs/heads/{branch}",
                headers=hdrs,
                json={"sha": new_commit_sha, "force": False},
                timeout=30,
            )
            if r.status_code not in (200, 201):
                return {"ok": False, "restored_paths": restored,
                        "deleted_paths": deleted,
                        "commit_sha": new_commit_sha, "html_url": new_commit_url,
                        "error": f"update-ref HTTP {r.status_code}: {r.text[:200]} (commit は作成済み)"}

            # Record autockpt for the restore itself (so we can undo the restore)
            _record_autockpt(
                owner=owner, repo=repo,
                path=(paths[0] if len(paths) == 1 else f"<batch:{len(paths)} files>"),
                branch=branch, pre_commit_sha=head_sha,
                tool="restore-from-sha",
                message=message,
                user_id=request.get("user_id"),
            )

            return {"ok": True, "restored_paths": restored,
                    "deleted_paths": deleted,
                    "commit_sha": new_commit_sha,
                    "html_url": new_commit_url, "error": None}
        except Exception as e:
            logger.error(f"[GITHUB_RESTORE_FROM_SHA] unexpected error: {e}", exc_info=True)
            return {"ok": False, "restored_paths": [], "deleted_paths": [],
                    "commit_sha": "", "html_url": "",
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    # ======================================================================
    # GitHub Outline / Symbol (Phase B - 低コンテキスト編集)
    # ----------------------------------------------------------------------
    # 大きなファイル (kernel ConfigMap 等 数百 KB) を 1 回呼ぶたびに
    # 全文取得するのではなく、 構造の骨格 (function/class 名、 YAML key、
    # K8s kind+name) と行範囲だけを返して LLM のコンテキスト消費を抑える。
    # ======================================================================

    def _gh_find_literal_block(yaml_text):
        """data: <name>.py: | リテラルブロックを最初の 1 つだけ検出する。

        Returns:
            {"key", "key_line", "content_start_line", "content_end_line",
             "content_indent"} (line は 1-indexed、 end は exclusive) or None
        """
        import re as _re
        lines = yaml_text.split('\n')
        for i, line in enumerate(lines):
            m = _re.match(r'^(\s*)(\S+)\.py:\s*\|[+-]?\s*$', line)
            if not m:
                continue
            key_indent = len(m.group(1))
            content_start = i + 1
            content_indent = None
            for j in range(content_start, len(lines)):
                if lines[j].strip():
                    content_indent = len(lines[j]) - len(lines[j].lstrip())
                    break
            if content_indent is None or content_indent <= key_indent:
                continue
            content_end = len(lines)
            for j in range(content_start, len(lines)):
                lj = lines[j]
                if not lj.strip():
                    continue
                li = len(lj) - len(lj.lstrip())
                if li <= key_indent:
                    content_end = j
                    break
            return {
                "key": m.group(2) + ".py",
                "key_line": i + 1,
                "content_start_line": content_start + 1,
                "content_end_line": content_end,
                "content_indent": content_indent,
            }
        return None

    def _gh_extract_python_from_yaml(yaml_text, block):
        """literal block 内の Python ソースを indent を剥がして返す。"""
        lines = yaml_text.split('\n')
        ind = block["content_indent"]
        out = []
        for i in range(block["content_start_line"] - 1, block["content_end_line"]):
            line = lines[i]
            if not line.strip():
                out.append("")
            elif line.startswith(" " * ind):
                out.append(line[ind:])
            else:
                out.append(line)
        return "\n".join(out)

    def _gh_python_outline(source, line_offset=0):
        """Python source から top-level の def/class + クラス内 method を抽出。

        line_offset: 出力 line 番号に足すオフセット (YAML 内 Python の場合)。
        Returns: (symbols_list, error_str_or_None)
        """
        import ast as _ast
        try:
            tree = _ast.parse(source)
        except SyntaxError as e:
            return None, f"Python syntax error: {e}"

        def _start_line(node):
            # decorator も含めた開始行
            if getattr(node, "decorator_list", None):
                return min(d.lineno for d in node.decorator_list)
            return node.lineno

        out = []
        for node in tree.body:
            if isinstance(node, (_ast.FunctionDef, _ast.AsyncFunctionDef)):
                kind = "async_function" if isinstance(node, _ast.AsyncFunctionDef) else "function"
                out.append({
                    "name": node.name, "kind": kind,
                    "start_line": _start_line(node) + line_offset,
                    "end_line": (node.end_lineno or node.lineno) + line_offset,
                    "children": [],
                })
            elif isinstance(node, _ast.ClassDef):
                children = []
                for child in node.body:
                    if isinstance(child, (_ast.FunctionDef, _ast.AsyncFunctionDef)):
                        ck = "async_method" if isinstance(child, _ast.AsyncFunctionDef) else "method"
                        children.append({
                            "name": child.name, "kind": ck,
                            "start_line": _start_line(child) + line_offset,
                            "end_line": (child.end_lineno or child.lineno) + line_offset,
                            "children": [],
                        })
                out.append({
                    "name": node.name, "kind": "class",
                    "start_line": _start_line(node) + line_offset,
                    "end_line": (node.end_lineno or node.lineno) + line_offset,
                    "children": children,
                })
            elif isinstance(node, _ast.Assign):
                for target in node.targets:
                    if isinstance(target, _ast.Name) and target.id.isupper():
                        out.append({
                            "name": target.id, "kind": "constant",
                            "start_line": node.lineno + line_offset,
                            "end_line": (node.end_lineno or node.lineno) + line_offset,
                            "children": [],
                        })
        return out, None

    def _gh_yaml_outline(source):
        """YAML source から top-level key (および K8s なら kind+name) を抽出。

        実装は best-effort: top-level key の行番号は raw text scan で求める。
        """
        try:
            import yaml as _yaml
        except Exception as e:
            return None, f"PyYAML import failed: {e}"
        lines = source.split('\n')
        try:
            docs = list(_yaml.safe_load_all(source))
        except Exception as e:
            return None, f"YAML parse error: {e}"
        out = []
        for di, doc in enumerate(docs):
            if not isinstance(doc, dict):
                continue
            kind = doc.get("kind")
            meta = doc.get("metadata")
            name = meta.get("name") if isinstance(meta, dict) else None
            label = None
            if kind:
                label = f"{kind}/{name}" if name else kind
            children = []
            for k in doc.keys():
                line_no = 1
                key_pat = f"{k}:"
                for i, ln in enumerate(lines):
                    s = ln.lstrip()
                    if s.startswith(key_pat) and (len(s) == len(key_pat) or s[len(key_pat)] in (' ', '\n', '|', '>')):
                        # top-level: indent 0
                        if len(ln) - len(s) == 0:
                            line_no = i + 1
                            break
                children.append({
                    "name": str(k), "kind": "yaml_key",
                    "start_line": line_no,
                    "end_line": line_no,
                    "children": [],
                })
            if label:
                out.append({
                    "name": label, "kind": "k8s_resource",
                    "start_line": 1, "end_line": len(lines),
                    "children": children,
                })
            else:
                out.extend(children)
        return out, None

    @router.post("/core/github/get-outline")
    async def core_github_get_outline(request: dict):
        """ファイル構造のアウトライン (symbol 名 + 行範囲) を返す。

        対応:
          - .py: Python AST で top-level def/class + クラス内 method
          - .yaml/.yml: YAML top-level key、 K8s manifest なら kind+name
          - data: <name>.py: | (YAML 内に埋め込まれた Python):
            treat_as="auto" で自動検出して Python として扱う

        Body:
            {
              "owner": str, "repo": str, "path": str,
              "branch": str | null,
              "treat_as": "auto" | "python" | "yaml" | "python_in_yaml",
              "user_id": "..."
            }
        Returns:
            {
              "ok": bool,
              "language": "python" | "yaml" | "python_in_yaml",
              "total_lines": int,
              "symbols": [{"name", "kind", "start_line", "end_line", "children":[...]}],
              "yaml_python_block": {...} | null,
              "error": str | null
            }
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        branch = request.get("branch") or None
        treat_as = (request.get("treat_as") or "auto").strip().lower()
        if not owner or not repo or not path:
            return {"ok": False, "language": "", "total_lines": 0,
                    "symbols": [], "yaml_python_block": None,
                    "error": "owner, repo, path are required"}
        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "language": "", "total_lines": 0,
                    "symbols": [], "yaml_python_block": None,
                    "error": f"github token unavailable: {_e}"}
        try:
            client = GitHubAPIClient(token=github_token)
            url = f"{client.base_url}/repos/{owner}/{repo}/contents/{path}"
            params = {"ref": branch} if branch else {}
            r = requests.get(url, headers=client.headers, params=params, timeout=60)
            if r.status_code == 404:
                return {"ok": False, "language": "", "total_lines": 0,
                        "symbols": [], "yaml_python_block": None,
                        "error": "file not found"}
            if r.status_code != 200:
                return {"ok": False, "language": "", "total_lines": 0,
                        "symbols": [], "yaml_python_block": None,
                        "error": f"HTTP {r.status_code}: {r.text[:200]}"}
            content_b64 = r.json().get("content", "")
            text = base64.b64decode(content_b64).decode("utf-8")
            total_lines = text.count('\n') + 1

            path_lower = path.lower()
            if treat_as == "auto":
                if path_lower.endswith(".py"):
                    lang = "python"
                elif path_lower.endswith(".yaml") or path_lower.endswith(".yml"):
                    block = _gh_find_literal_block(text)
                    lang = "python_in_yaml" if block else "yaml"
                else:
                    lang = "yaml"
            else:
                lang = treat_as

            if lang == "python":
                symbols, err = _gh_python_outline(text)
                if err:
                    return {"ok": False, "language": lang, "total_lines": total_lines,
                            "symbols": [], "yaml_python_block": None, "error": err}
                return {"ok": True, "language": lang, "total_lines": total_lines,
                        "symbols": symbols, "yaml_python_block": None, "error": None}
            if lang == "python_in_yaml":
                block = _gh_find_literal_block(text)
                if not block:
                    return {"ok": False, "language": lang, "total_lines": total_lines,
                            "symbols": [], "yaml_python_block": None,
                            "error": "no `<name>.py: |` literal block found"}
                py_source = _gh_extract_python_from_yaml(text, block)
                offset = block["content_start_line"] - 1
                symbols, err = _gh_python_outline(py_source, line_offset=offset)
                if err:
                    return {"ok": False, "language": lang, "total_lines": total_lines,
                            "symbols": [], "yaml_python_block": block, "error": err}
                return {"ok": True, "language": lang, "total_lines": total_lines,
                        "symbols": symbols, "yaml_python_block": block, "error": None}
            # yaml
            symbols, err = _gh_yaml_outline(text)
            if err:
                return {"ok": False, "language": "yaml", "total_lines": total_lines,
                        "symbols": [], "yaml_python_block": None, "error": err}
            return {"ok": True, "language": "yaml", "total_lines": total_lines,
                    "symbols": symbols or [], "yaml_python_block": None,
                    "error": None}
        except Exception as e:
            logger.error(f"[GITHUB_GET_OUTLINE] unexpected error: {e}", exc_info=True)
            return {"ok": False, "language": "", "total_lines": 0,
                    "symbols": [], "yaml_python_block": None,
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/get-symbol")
    async def core_github_get_symbol(request: dict):
        """指定 symbol の本体だけを返す (def/class 本体、 decorator 含む)。

        symbol は "func_name" or "ClassName" or "ClassName.method_name"。

        Body:
            {
              "owner": str, "repo": str, "path": str,
              "symbol": str,
              "branch": str | null,
              "treat_as": "auto" | "python" | "python_in_yaml",
              "user_id": "..."
            }
        Returns:
            {
              "ok": bool, "language": str, "symbol": str,
              "start_line": int, "end_line": int,
              "body": str,
              "error": str | null
            }
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        symbol = (request.get("symbol") or "").strip()
        branch = request.get("branch") or None
        treat_as = (request.get("treat_as") or "auto").strip().lower()
        if not owner or not repo or not path or not symbol:
            return {"ok": False, "language": "", "symbol": symbol,
                    "start_line": 0, "end_line": 0, "body": "",
                    "error": "owner, repo, path, symbol are required"}
        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "language": "", "symbol": symbol,
                    "start_line": 0, "end_line": 0, "body": "",
                    "error": f"github token unavailable: {_e}"}
        try:
            client = GitHubAPIClient(token=github_token)
            url = f"{client.base_url}/repos/{owner}/{repo}/contents/{path}"
            params = {"ref": branch} if branch else {}
            r = requests.get(url, headers=client.headers, params=params, timeout=60)
            if r.status_code == 404:
                return {"ok": False, "language": "", "symbol": symbol,
                        "start_line": 0, "end_line": 0, "body": "",
                        "error": "file not found"}
            if r.status_code != 200:
                return {"ok": False, "language": "", "symbol": symbol,
                        "start_line": 0, "end_line": 0, "body": "",
                        "error": f"HTTP {r.status_code}: {r.text[:200]}"}
            content_b64 = r.json().get("content", "")
            text = base64.b64decode(content_b64).decode("utf-8")
            all_lines = text.split('\n')

            path_lower = path.lower()
            if treat_as == "auto":
                if path_lower.endswith(".py"):
                    lang = "python"
                elif path_lower.endswith(".yaml") or path_lower.endswith(".yml"):
                    block = _gh_find_literal_block(text)
                    lang = "python_in_yaml" if block else "python"
                else:
                    lang = "python"
            else:
                lang = treat_as

            if lang == "python_in_yaml":
                block = _gh_find_literal_block(text)
                if not block:
                    return {"ok": False, "language": lang, "symbol": symbol,
                            "start_line": 0, "end_line": 0, "body": "",
                            "error": "no `<name>.py: |` literal block found"}
                py_source = _gh_extract_python_from_yaml(text, block)
                offset = block["content_start_line"] - 1
                symbols, err = _gh_python_outline(py_source, line_offset=offset)
                use_lines = all_lines  # extract from YAML coords
            else:
                symbols, err = _gh_python_outline(text)
                use_lines = all_lines
                offset = 0
            if err:
                return {"ok": False, "language": lang, "symbol": symbol,
                        "start_line": 0, "end_line": 0, "body": "",
                        "error": err}

            # Resolve symbol path (e.g. "ClassName.method")
            target = None
            parts = symbol.split(".")
            head = parts[0]
            for s in symbols:
                if s["name"] == head:
                    target = s
                    break
            if target is None:
                return {"ok": False, "language": lang, "symbol": symbol,
                        "start_line": 0, "end_line": 0, "body": "",
                        "error": f"symbol '{head}' not found at top level"}
            for p in parts[1:]:
                child = None
                for c in target.get("children", []) or []:
                    if c["name"] == p:
                        child = c
                        break
                if child is None:
                    return {"ok": False, "language": lang, "symbol": symbol,
                            "start_line": 0, "end_line": 0, "body": "",
                            "error": f"child '{p}' not found in {target['name']}"}
                target = child

            sl = target["start_line"]
            el = target["end_line"]
            body = "\n".join(use_lines[sl - 1:el])
            return {"ok": True, "language": lang, "symbol": symbol,
                    "start_line": sl, "end_line": el, "body": body,
                    "error": None}
        except Exception as e:
            logger.error(f"[GITHUB_GET_SYMBOL] unexpected error: {e}", exc_info=True)
            return {"ok": False, "language": "", "symbol": symbol,
                    "start_line": 0, "end_line": 0, "body": "",
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    def _gh_apply_indent(new_body, base_indent_str):
        """new_body の各行に base_indent_str を prefix する (空行はそのまま)。"""
        out = []
        for ln in new_body.split('\n'):
            if ln.strip():
                out.append(base_indent_str + ln)
            else:
                out.append("")
        return out

    def _gh_unified_diff(before_lines, after_lines, label):
        """簡易 unified diff (最大 200 行)。"""
        import difflib as _difflib
        diff = list(_difflib.unified_diff(
            before_lines, after_lines,
            fromfile=label + " (before)", tofile=label + " (after)",
            lineterm="", n=3,
        ))
        if len(diff) > 200:
            diff = diff[:200] + ["... (truncated)"]
        return "\n".join(diff)

    @router.post("/core/github/replace-symbol")
    async def core_github_replace_symbol(request: dict):
        """指定 symbol を新しい本体で置き換えて push する (AST aware)。

        new_body は column 0 で書いた Python ソースとして渡す (decorator から
        メソッド本体まで)。 元の symbol の line にあった indent を計測して
        new_body の各行に prefix し直すので、 クラス内 method や YAML 内
        Python でも適切な indent で挿入される。

        Body:
            {
              "owner": str, "repo": str, "path": str,
              "symbol": str,
              "new_body": str,            # column 0 で記述
              "message": str,
              "branch": str | null,
              "treat_as": "auto" | "python" | "python_in_yaml",
              "dry_run": bool,            # True なら push せず diff のみ返す
              "user_id": "..."
            }
        Returns:
            {
              "ok": bool,
              "action": "replaced" | "dry_run",
              "language": str,
              "symbol": str,
              "start_line": int, "end_line": int,
              "diff_preview": str,
              "commit_sha": str, "html_url": str,
              "error": str | null
            }
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        symbol = (request.get("symbol") or "").strip()
        new_body = request.get("new_body")
        message = (request.get("message") or "").strip()
        branch = request.get("branch") or None
        treat_as = (request.get("treat_as") or "auto").strip().lower()
        dry_run = bool(request.get("dry_run") or False)
        if not owner or not repo or not path or not symbol:
            return {"ok": False, "action": "", "language": "", "symbol": symbol,
                    "start_line": 0, "end_line": 0, "diff_preview": "",
                    "commit_sha": "", "html_url": "",
                    "error": "owner, repo, path, symbol are required"}
        if new_body is None or not isinstance(new_body, str):
            return {"ok": False, "action": "", "language": "", "symbol": symbol,
                    "start_line": 0, "end_line": 0, "diff_preview": "",
                    "commit_sha": "", "html_url": "",
                    "error": "new_body (string) is required"}
        if not dry_run and not message:
            return {"ok": False, "action": "", "language": "", "symbol": symbol,
                    "start_line": 0, "end_line": 0, "diff_preview": "",
                    "commit_sha": "", "html_url": "",
                    "error": "commit message is required (unless dry_run=True)"}
        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "action": "", "language": "", "symbol": symbol,
                    "start_line": 0, "end_line": 0, "diff_preview": "",
                    "commit_sha": "", "html_url": "",
                    "error": f"github token unavailable: {_e}"}
        try:
            client = GitHubAPIClient(token=github_token)
            url = f"{client.base_url}/repos/{owner}/{repo}/contents/{path}"
            params = {"ref": branch} if branch else {}
            r = requests.get(url, headers=client.headers, params=params, timeout=60)
            if r.status_code == 404:
                return {"ok": False, "action": "", "language": "", "symbol": symbol,
                        "start_line": 0, "end_line": 0, "diff_preview": "",
                        "commit_sha": "", "html_url": "",
                        "error": "file not found"}
            if r.status_code != 200:
                return {"ok": False, "action": "", "language": "", "symbol": symbol,
                        "start_line": 0, "end_line": 0, "diff_preview": "",
                        "commit_sha": "", "html_url": "",
                        "error": f"HTTP {r.status_code}: {r.text[:200]}"}
            content_b64 = r.json().get("content", "")
            text = base64.b64decode(content_b64).decode("utf-8")
            all_lines = text.split('\n')

            path_lower = path.lower()
            if treat_as == "auto":
                if path_lower.endswith(".py"):
                    lang = "python"
                elif path_lower.endswith(".yaml") or path_lower.endswith(".yml"):
                    block = _gh_find_literal_block(text)
                    lang = "python_in_yaml" if block else "python"
                else:
                    lang = "python"
            else:
                lang = treat_as

            if lang == "python_in_yaml":
                block = _gh_find_literal_block(text)
                if not block:
                    return {"ok": False, "action": "", "language": lang,
                            "symbol": symbol, "start_line": 0, "end_line": 0,
                            "diff_preview": "", "commit_sha": "", "html_url": "",
                            "error": "no `<name>.py: |` literal block found"}
                py_source = _gh_extract_python_from_yaml(text, block)
                offset = block["content_start_line"] - 1
                symbols, err = _gh_python_outline(py_source, line_offset=offset)
            else:
                symbols, err = _gh_python_outline(text)
            if err:
                return {"ok": False, "action": "", "language": lang,
                        "symbol": symbol, "start_line": 0, "end_line": 0,
                        "diff_preview": "", "commit_sha": "", "html_url": "",
                        "error": err}

            # Resolve symbol
            parts = symbol.split(".")
            head = parts[0]
            target = None
            for s in symbols:
                if s["name"] == head:
                    target = s
                    break
            if target is None:
                return {"ok": False, "action": "", "language": lang,
                        "symbol": symbol, "start_line": 0, "end_line": 0,
                        "diff_preview": "", "commit_sha": "", "html_url": "",
                        "error": f"symbol '{head}' not found at top level"}
            for p in parts[1:]:
                child = None
                for c in target.get("children", []) or []:
                    if c["name"] == p:
                        child = c
                        break
                if child is None:
                    return {"ok": False, "action": "", "language": lang,
                            "symbol": symbol, "start_line": 0, "end_line": 0,
                            "diff_preview": "", "commit_sha": "", "html_url": "",
                            "error": f"child '{p}' not found in {target['name']}"}
                target = child

            sl = target["start_line"]
            el = target["end_line"]

            # Capture indent from original first line
            first_line = all_lines[sl - 1] if 1 <= sl <= len(all_lines) else ""
            indent_str = first_line[:len(first_line) - len(first_line.lstrip())]

            # Apply indent to new_body
            indented_new = _gh_apply_indent(new_body, indent_str)

            # Build new file
            before_lines = all_lines[sl - 1:el]
            new_all_lines = all_lines[:sl - 1] + indented_new + all_lines[el:]
            new_text = "\n".join(new_all_lines)

            # Validation: for python_in_yaml, re-extract and parse to ensure
            # the resulting source is still valid
            if lang in ("python", "python_in_yaml"):
                if lang == "python_in_yaml":
                    new_block = _gh_find_literal_block(new_text)
                    if not new_block:
                        return {"ok": False, "action": "", "language": lang,
                                "symbol": symbol, "start_line": sl, "end_line": el,
                                "diff_preview": "", "commit_sha": "", "html_url": "",
                                "error": "post-edit: literal block lost (probable indent mismatch)"}
                    new_py = _gh_extract_python_from_yaml(new_text, new_block)
                else:
                    new_py = new_text
                import ast as _ast
                try:
                    _ast.parse(new_py)
                except SyntaxError as e:
                    return {"ok": False, "action": "", "language": lang,
                            "symbol": symbol, "start_line": sl, "end_line": el,
                            "diff_preview": "", "commit_sha": "", "html_url": "",
                            "error": f"post-edit syntax error: {e}"}

            diff_preview = _gh_unified_diff(before_lines, indented_new,
                                            f"{path}:{sl}-{el}")

            if dry_run:
                return {"ok": True, "action": "dry_run", "language": lang,
                        "symbol": symbol, "start_line": sl, "end_line": el,
                        "diff_preview": diff_preview,
                        "commit_sha": "", "html_url": "", "error": None}

            # Push
            result = client.put_file(owner=owner, repo=repo, path=path,
                                     content=new_text, message=message,
                                     branch=branch)
            if not result.get("ok"):
                return {"ok": False, "action": "", "language": lang,
                        "symbol": symbol, "start_line": sl, "end_line": el,
                        "diff_preview": diff_preview,
                        "commit_sha": "", "html_url": "",
                        "error": result.get("error", "unknown")}
            return {"ok": True, "action": "replaced", "language": lang,
                    "symbol": symbol, "start_line": sl, "end_line": el,
                    "diff_preview": diff_preview,
                    "commit_sha": result.get("commit_sha", ""),
                    "html_url": result.get("html_url", ""),
                    "error": None}
        except Exception as e:
            logger.error(f"[GITHUB_REPLACE_SYMBOL] unexpected error: {e}", exc_info=True)
            return {"ok": False, "action": "", "language": "", "symbol": symbol,
                    "start_line": 0, "end_line": 0, "diff_preview": "",
                    "commit_sha": "", "html_url": "",
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/str-replace-dryrun")
    async def core_github_str_replace_dryrun(request: dict):
        """str_replace の dry-run。 push せず、 置換後の diff を返す。

        本物の置換は github_apply_str_replace (既存) を使う。 これは
        「old_str がどの位置にマッチするか」 「マッチ数は期待通りか」 を
        push 前に確認するためのツール。

        Body:
            {
              "owner": str, "repo": str, "path": str,
              "old_str": str,
              "new_str": str,
              "count": int,         # 期待出現回数 (default 1)
              "branch": str | null,
              "user_id": "..."
            }
        Returns:
            {
              "ok": bool,
              "found_occurrences": int,
              "expected_occurrences": int,
              "match_lines": [int, ...],     # 1-indexed の各マッチ開始行
              "diff_preview": str,
              "error": str | null
            }
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        old_str = request.get("old_str")
        new_str = request.get("new_str")
        count = int(request.get("count") or 1)
        branch = request.get("branch") or None
        if not owner or not repo or not path:
            return {"ok": False, "found_occurrences": 0,
                    "expected_occurrences": count, "match_lines": [],
                    "diff_preview": "",
                    "error": "owner, repo, path are required"}
        if not isinstance(old_str, str) or not old_str:
            return {"ok": False, "found_occurrences": 0,
                    "expected_occurrences": count, "match_lines": [],
                    "diff_preview": "", "error": "old_str (string) is required"}
        if new_str is None or not isinstance(new_str, str):
            return {"ok": False, "found_occurrences": 0,
                    "expected_occurrences": count, "match_lines": [],
                    "diff_preview": "", "error": "new_str (string) is required"}
        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "found_occurrences": 0,
                    "expected_occurrences": count, "match_lines": [],
                    "diff_preview": "",
                    "error": f"github token unavailable: {_e}"}
        try:
            client = GitHubAPIClient(token=github_token)
            url = f"{client.base_url}/repos/{owner}/{repo}/contents/{path}"
            params = {"ref": branch} if branch else {}
            r = requests.get(url, headers=client.headers, params=params, timeout=60)
            if r.status_code == 404:
                return {"ok": False, "found_occurrences": 0,
                        "expected_occurrences": count, "match_lines": [],
                        "diff_preview": "", "error": "file not found"}
            if r.status_code != 200:
                return {"ok": False, "found_occurrences": 0,
                        "expected_occurrences": count, "match_lines": [],
                        "diff_preview": "",
                        "error": f"HTTP {r.status_code}: {r.text[:200]}"}
            content_b64 = r.json().get("content", "")
            text = base64.b64decode(content_b64).decode("utf-8")

            # Count and locate matches
            occ = text.count(old_str)
            # Find line numbers of each match (1-indexed start)
            match_lines = []
            search_from = 0
            while True:
                idx = text.find(old_str, search_from)
                if idx < 0:
                    break
                line_no = text.count('\n', 0, idx) + 1
                match_lines.append(line_no)
                search_from = idx + 1
                if len(match_lines) >= 20:
                    break

            if occ != count:
                return {"ok": False, "found_occurrences": occ,
                        "expected_occurrences": count,
                        "match_lines": match_lines, "diff_preview": "",
                        "error": f"occurrences mismatch: expected {count}, found {occ}"}

            # Build diff_preview (limited)
            new_text = text.replace(old_str, new_str, count)
            before_lines = text.splitlines()
            after_lines = new_text.splitlines()
            diff_preview = _gh_unified_diff(before_lines, after_lines, path)
            return {"ok": True, "found_occurrences": occ,
                    "expected_occurrences": count,
                    "match_lines": match_lines,
                    "diff_preview": diff_preview, "error": None}
        except Exception as e:
            logger.error(f"[GITHUB_STR_REPLACE_DRYRUN] unexpected error: {e}", exc_info=True)
            return {"ok": False, "found_occurrences": 0,
                    "expected_occurrences": count, "match_lines": [],
                    "diff_preview": "",
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    # ====================================================================
    # Projects v2 (GraphQL) endpoints
    # ====================================================================
    # __GH_OPS_PROJECTS_V2_ANCHOR__

    _GITHUB_GRAPHQL_URL = "https://api.github.com/graphql"


    def _gh_graphql(token, query, variables=None):
        """GitHub GraphQL API を叩いて結果 dict を返す。

        Returns:
            {"ok": bool, "data": dict | None, "errors": list,
             "error": str | None}
        """
        if not _REQUESTS_AVAILABLE:
            return {"ok": False, "data": None, "errors": [],
                    "error": "requests library is not available"}
        if not token:
            return {"ok": False, "data": None, "errors": [],
                    "error": "github token is empty"}
        headers = {
            "Authorization": f"Bearer {token}",
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json",
        }
        body = {"query": query, "variables": variables or {}}
        try:
            r = requests.post(_GITHUB_GRAPHQL_URL, headers=headers,
                              json=body, timeout=30)
        except Exception as e:
            return {"ok": False, "data": None, "errors": [],
                    "error": f"HTTP request failed: {type(e).__name__}: {str(e)[:200]}"}
        if r.status_code != 200:
            return {"ok": False, "data": None, "errors": [],
                    "error": f"HTTP {r.status_code}: {r.text[:300]}"}
        try:
            d = r.json()
        except Exception as e:
            return {"ok": False, "data": None, "errors": [],
                    "error": f"JSON decode failed: {type(e).__name__}: {str(e)[:200]}"}
        errors = d.get("errors") or []
        if errors:
            err_msg = "; ".join(str(e.get("message", "")) for e in errors[:3])
            return {"ok": False, "data": d.get("data"), "errors": errors,
                    "error": f"GraphQL errors: {err_msg[:400]}"}
        return {"ok": True, "data": d.get("data") or {},
                "errors": [], "error": None}


    def _gh_resolve_token_or_error(request):
        """request から token を解決。 (token, error_dict_or_None) を返す。"""
        try:
            from github_account import resolve_github_token
            token = resolve_github_token(request.get("user_id"))
            return token, None
        except Exception as e:
            return None, {"ok": False,
                          "error": f"github token unavailable: {e}"}


    def _gh_project_resolve(token, org, number):
        """org+number から ProjectV2 の最小情報 (id, title, url) を解決。

        Returns (project_dict, error_dict_or_None).
        """
        q = (
            "query($org:String!, $number:Int!) {\n"
            "  organization(login:$org) {\n"
            "    projectV2(number:$number) { id title url number closed }\n"
            "  }\n"
            "}\n"
        )
        res = _gh_graphql(token, q, {"org": org, "number": number})
        if not res["ok"]:
            return None, {"ok": False, "error": res["error"]}
        proj = (((res.get("data") or {}).get("organization") or {})
                .get("projectV2"))
        if not proj or not proj.get("id"):
            return None, {"ok": False,
                          "error": f"project not found: {org}/projects/{number}"}
        return proj, None


    @router.post("/core/github/project/get")
    async def core_github_project_get(request: dict):
        """ProjectV2 の基本情報 (id, title, url, closed) を返す。

        Body: { "org": "example-org", "number": 11 }
        """
        org = (request.get("org") or "").strip()
        try:
            number = int(request.get("number") or 0)
        except Exception:
            number = 0
        if not org or number <= 0:
            return {"ok": False, "project": None,
                    "error": "org, number are required"}
        token, err = _gh_resolve_token_or_error(request)
        if err:
            return {**err, "project": None}
        try:
            proj, perr = _gh_project_resolve(token, org, number)
            if perr:
                return {**perr, "project": None}
            return {"ok": True, "project": proj, "error": None}
        except Exception as e:
            logger.error(f"[GH_PROJ_GET] error: {e}", exc_info=True)
            return {"ok": False, "project": None,
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/project/get-fields")
    async def core_github_project_get_fields(request: dict):
        """ProjectV2 のフィールド定義一覧を返す。 SingleSelect は options も含む。

        Body: { "org": "example-org", "number": 11 }
        Returns:
          { "ok": bool, "project_id": str, "project_title": str,
            "fields": [
              { "id": str, "name": str, "data_type": str, "typename": str,
                "options": [{"id": str, "name": str, "color": str}],
                "iterations": [{"id": str, "title": str, "startDate": str,
                                "duration": int}],
                "completed_iterations": [...]
              }, ...],
            "error": str | null }
        """
        org = (request.get("org") or "").strip()
        try:
            number = int(request.get("number") or 0)
        except Exception:
            number = 0
        if not org or number <= 0:
            return {"ok": False, "project_id": None, "project_title": None,
                    "fields": [], "error": "org, number are required"}
        token, err = _gh_resolve_token_or_error(request)
        if err:
            return {**err, "project_id": None, "project_title": None,
                    "fields": []}
        q = (
            "query($org:String!, $number:Int!) {\n"
            "  organization(login:$org) {\n"
            "    projectV2(number:$number) {\n"
            "      id title\n"
            "      fields(first:50) {\n"
            "        nodes {\n"
            "          __typename\n"
            "          ... on ProjectV2FieldCommon { id name dataType }\n"
            "          ... on ProjectV2SingleSelectField {\n"
            "            options { id name color }\n"
            "          }\n"
            "          ... on ProjectV2IterationField {\n"
            "            configuration {\n"
            "              iterations { id title startDate duration }\n"
            "              completedIterations { id title startDate duration }\n"
            "            }\n"
            "          }\n"
            "        }\n"
            "      }\n"
            "    }\n"
            "  }\n"
            "}\n"
        )
        try:
            res = _gh_graphql(token, q, {"org": org, "number": number})
            if not res["ok"]:
                return {"ok": False, "project_id": None, "project_title": None,
                        "fields": [], "error": res["error"]}
            proj = (((res.get("data") or {}).get("organization") or {})
                    .get("projectV2") or {})
            if not proj.get("id"):
                return {"ok": False, "project_id": None, "project_title": None,
                        "fields": [],
                        "error": f"project not found: {org}/projects/{number}"}
            field_nodes = ((proj.get("fields") or {}).get("nodes") or [])
            fields = []
            for fn in field_nodes:
                if not fn:
                    continue
                fld = {
                    "id": fn.get("id"),
                    "name": fn.get("name"),
                    "data_type": fn.get("dataType"),
                    "typename": fn.get("__typename"),
                }
                if fn.get("options"):
                    fld["options"] = fn["options"]
                cfg = fn.get("configuration") or {}
                if cfg:
                    fld["iterations"] = cfg.get("iterations") or []
                    fld["completed_iterations"] = (
                        cfg.get("completedIterations") or [])
                fields.append(fld)
            return {"ok": True, "project_id": proj.get("id"),
                    "project_title": proj.get("title"),
                    "fields": fields, "error": None}
        except Exception as e:
            logger.error(f"[GH_PROJ_FIELDS] error: {e}", exc_info=True)
            return {"ok": False, "project_id": None, "project_title": None,
                    "fields": [],
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/project/list-items")
    async def core_github_project_list_items(request: dict):
        """ProjectV2 の Item 一覧 (Issue/PR/DraftIssue + 各フィールド値) を返す。

        Body:
          { "org": "example-org", "number": 11,
            "first": 50,           # 1-100, default 50
            "after": ""            # ページング cursor (前回の next_cursor)
          }
        Returns:
          { "ok": bool, "project_id": str, "items": [{
              "item_id": str,
              "type": "ISSUE"|"PULL_REQUEST"|"DRAFT_ISSUE"|...,
              "content": {
                  "number": int | null, "title": str, "state": str | null,
                  "url": str | null, "repository": str | null
              },
              "fields": { "<field_name>": "<display_value>", ... },
              "field_raw": [{ "field_id": str, "field_name": str,
                              "type": str, "value": any,
                              "option_id": str | null }, ...]
            }, ...],
            "next_cursor": str | null, "has_next": bool,
            "error": str | null }
        """
        org = (request.get("org") or "").strip()
        try:
            number = int(request.get("number") or 0)
        except Exception:
            number = 0
        try:
            first = int(request.get("first") or 50)
        except Exception:
            first = 50
        first = max(1, min(100, first))
        after = (request.get("after") or "").strip() or None

        if not org or number <= 0:
            return {"ok": False, "project_id": None, "items": [],
                    "next_cursor": None, "has_next": False,
                    "error": "org, number are required"}
        token, err = _gh_resolve_token_or_error(request)
        if err:
            return {**err, "project_id": None, "items": [],
                    "next_cursor": None, "has_next": False}

        q = (
            "query($org:String!, $number:Int!, $first:Int!, $after:String) {\n"
            "  organization(login:$org) {\n"
            "    projectV2(number:$number) {\n"
            "      id\n"
            "      items(first:$first, after:$after) {\n"
            "        pageInfo { hasNextPage endCursor }\n"
            "        nodes {\n"
            "          id type\n"
            "          content {\n"
            "            __typename\n"
            "            ... on Issue {\n"
            "              number title state url\n"
            "              repository { nameWithOwner }\n"
            "            }\n"
            "            ... on PullRequest {\n"
            "              number title state url\n"
            "              repository { nameWithOwner }\n"
            "            }\n"
            "            ... on DraftIssue { title body }\n"
            "          }\n"
            "          fieldValues(first:50) {\n"
            "            nodes {\n"
            "              __typename\n"
            "              ... on ProjectV2ItemFieldSingleSelectValue {\n"
            "                field { ... on ProjectV2FieldCommon { id name } }\n"
            "                name optionId\n"
            "              }\n"
            "              ... on ProjectV2ItemFieldTextValue {\n"
            "                field { ... on ProjectV2FieldCommon { id name } }\n"
            "                text\n"
            "              }\n"
            "              ... on ProjectV2ItemFieldNumberValue {\n"
            "                field { ... on ProjectV2FieldCommon { id name } }\n"
            "                number\n"
            "              }\n"
            "              ... on ProjectV2ItemFieldDateValue {\n"
            "                field { ... on ProjectV2FieldCommon { id name } }\n"
            "                date\n"
            "              }\n"
            "              ... on ProjectV2ItemFieldIterationValue {\n"
            "                field { ... on ProjectV2FieldCommon { id name } }\n"
            "                title iterationId startDate duration\n"
            "              }\n"
            "              ... on ProjectV2ItemFieldLabelValue {\n"
            "                field { ... on ProjectV2FieldCommon { id name } }\n"
            "                labels(first:20) { nodes { name } }\n"
            "              }\n"
            "              ... on ProjectV2ItemFieldMilestoneValue {\n"
            "                field { ... on ProjectV2FieldCommon { id name } }\n"
            "                milestone { title number }\n"
            "              }\n"
            "              ... on ProjectV2ItemFieldUserValue {\n"
            "                field { ... on ProjectV2FieldCommon { id name } }\n"
            "                users(first:10) { nodes { login } }\n"
            "              }\n"
            "              ... on ProjectV2ItemFieldRepositoryValue {\n"
            "                field { ... on ProjectV2FieldCommon { id name } }\n"
            "                repository { nameWithOwner }\n"
            "              }\n"
            "            }\n"
            "          }\n"
            "        }\n"
            "      }\n"
            "    }\n"
            "  }\n"
            "}\n"
        )
        try:
            variables = {"org": org, "number": number,
                         "first": first, "after": after}
            res = _gh_graphql(token, q, variables)
            if not res["ok"]:
                return {"ok": False, "project_id": None, "items": [],
                        "next_cursor": None, "has_next": False,
                        "error": res["error"]}
            proj = (((res.get("data") or {}).get("organization") or {})
                    .get("projectV2") or {})
            if not proj.get("id"):
                return {"ok": False, "project_id": None, "items": [],
                        "next_cursor": None, "has_next": False,
                        "error": f"project not found: {org}/projects/{number}"}
            items_block = proj.get("items") or {}
            page_info = items_block.get("pageInfo") or {}
            nodes = items_block.get("nodes") or []

            out_items = []
            for n in nodes:
                if not n:
                    continue
                content = n.get("content") or {}
                ctype = content.get("__typename") or ""
                c_out = {
                    "number": content.get("number"),
                    "title": content.get("title") or "",
                    "state": content.get("state"),
                    "url": content.get("url"),
                    "repository": None,
                }
                repo_obj = content.get("repository") or {}
                if repo_obj.get("nameWithOwner"):
                    c_out["repository"] = repo_obj["nameWithOwner"]

                fv_nodes = ((n.get("fieldValues") or {}).get("nodes") or [])
                field_map = {}
                field_raw = []
                for fv in fv_nodes:
                    if not fv:
                        continue
                    fld = fv.get("field") or {}
                    fname = fld.get("name")
                    fid = fld.get("id")
                    typename = fv.get("__typename") or ""
                    raw = {"field_id": fid, "field_name": fname,
                           "type": typename, "value": None,
                           "option_id": None}
                    if typename == "ProjectV2ItemFieldSingleSelectValue":
                        raw["value"] = fv.get("name")
                        raw["option_id"] = fv.get("optionId")
                    elif typename == "ProjectV2ItemFieldTextValue":
                        raw["value"] = fv.get("text")
                    elif typename == "ProjectV2ItemFieldNumberValue":
                        raw["value"] = fv.get("number")
                    elif typename == "ProjectV2ItemFieldDateValue":
                        raw["value"] = fv.get("date")
                    elif typename == "ProjectV2ItemFieldIterationValue":
                        raw["value"] = fv.get("title")
                        raw["option_id"] = fv.get("iterationId")
                    elif typename == "ProjectV2ItemFieldLabelValue":
                        labels = ((fv.get("labels") or {}).get("nodes") or [])
                        raw["value"] = [l.get("name") for l in labels if l]
                    elif typename == "ProjectV2ItemFieldMilestoneValue":
                        ms = fv.get("milestone") or {}
                        raw["value"] = ms.get("title")
                    elif typename == "ProjectV2ItemFieldUserValue":
                        users = ((fv.get("users") or {}).get("nodes") or [])
                        raw["value"] = [u.get("login") for u in users if u]
                    elif typename == "ProjectV2ItemFieldRepositoryValue":
                        rv = fv.get("repository") or {}
                        raw["value"] = rv.get("nameWithOwner")
                    field_raw.append(raw)
                    if fname is not None:
                        field_map[fname] = raw["value"]

                out_items.append({
                    "item_id": n.get("id"),
                    "type": n.get("type") or ctype.upper() or "UNKNOWN",
                    "content": c_out,
                    "fields": field_map,
                    "field_raw": field_raw,
                })
            return {"ok": True, "project_id": proj.get("id"),
                    "items": out_items,
                    "next_cursor": page_info.get("endCursor"),
                    "has_next": bool(page_info.get("hasNextPage")),
                    "error": None}
        except Exception as e:
            logger.error(f"[GH_PROJ_LIST_ITEMS] error: {e}", exc_info=True)
            return {"ok": False, "project_id": None, "items": [],
                    "next_cursor": None, "has_next": False,
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/project/update-item-field")
    async def core_github_project_update_item_field(request: dict):
        """ProjectV2 Item のフィールド値を更新 (カラム移動など)。

        Body (どちらか):

          A) ID 全指定:
             { "project_id": "PVT_xxx", "item_id": "PVTI_xxx",
               "field_id": "PVTSSF_xxx",
               "value_type": "single_select" | "text" | "number" | "date" | "iteration",
               "value": "<option_id or text or number or date or iteration_id>" }

          B) 名前ベース (org+number+field_name+option_name から解決):
             { "org": "example-org", "number": 11,
               "item_id": "PVTI_xxx",
               "field_name": "Status", "option_name": "In Progress" }
             → SingleSelect を内部解決して更新する。

        Returns:
          { "ok": bool, "item_id": str, "error": str | null }
        """
        item_id = (request.get("item_id") or "").strip()
        if not item_id:
            return {"ok": False, "item_id": None,
                    "error": "item_id is required"}
        token, err = _gh_resolve_token_or_error(request)
        if err:
            return {**err, "item_id": None}

        project_id = (request.get("project_id") or "").strip() or None
        field_id = (request.get("field_id") or "").strip() or None
        value_type = (request.get("value_type") or "").strip().lower()
        value = request.get("value")

        org = (request.get("org") or "").strip()
        try:
            number = int(request.get("number") or 0)
        except Exception:
            number = 0
        field_name = (request.get("field_name") or "").strip()
        option_name = (request.get("option_name") or "").strip()

        # 便利モード: org+number+field_name から id を解決
        if (not project_id or not field_id) and org and number > 0 and field_name:
            try:
                fq = (
                    "query($org:String!, $number:Int!) {\n"
                    "  organization(login:$org) {\n"
                    "    projectV2(number:$number) {\n"
                    "      id\n"
                    "      fields(first:50) {\n"
                    "        nodes {\n"
                    "          __typename\n"
                    "          ... on ProjectV2FieldCommon { id name dataType }\n"
                    "          ... on ProjectV2SingleSelectField {\n"
                    "            options { id name }\n"
                    "          }\n"
                    "        }\n"
                    "      }\n"
                    "    }\n"
                    "  }\n"
                    "}\n"
                )
                res = _gh_graphql(token, fq, {"org": org, "number": number})
                if not res["ok"]:
                    return {"ok": False, "item_id": item_id,
                            "error": "field resolve failed: "
                                     + (res["error"] or "")}
                proj = (((res.get("data") or {}).get("organization") or {})
                        .get("projectV2") or {})
                if not proj.get("id"):
                    return {"ok": False, "item_id": item_id,
                            "error": f"project not found: {org}/projects/{number}"}
                project_id = proj["id"]
                fnodes = ((proj.get("fields") or {}).get("nodes") or [])
                target = None
                for fn in fnodes:
                    if fn and fn.get("name") == field_name:
                        target = fn
                        break
                if not target:
                    avail = [str(fn.get("name")) for fn in fnodes if fn]
                    return {"ok": False, "item_id": item_id,
                            "error": (f"field not found: {field_name}; "
                                      f"available={avail}")}
                field_id = target.get("id")
                tn = target.get("__typename") or ""
                if tn == "ProjectV2SingleSelectField":
                    value_type = "single_select"
                    if option_name:
                        opts = target.get("options") or []
                        opt = None
                        for o in opts:
                            if (o.get("name") or "") == option_name:
                                opt = o
                                break
                        if not opt:
                            avail_opts = [o.get("name") for o in opts]
                            return {"ok": False, "item_id": item_id,
                                    "error": (f"option not found: {option_name}; "
                                              f"available={avail_opts}")}
                        value = opt.get("id")
            except Exception as e:
                logger.error(f"[GH_PROJ_UPDATE resolve] {e}", exc_info=True)
                return {"ok": False, "item_id": item_id,
                        "error": f"resolve error: {type(e).__name__}: {str(e)[:200]}"}

        if not project_id or not field_id:
            return {"ok": False, "item_id": item_id,
                    "error": ("project_id and field_id are required "
                              "(or org+number+field_name)")}
        if not value_type:
            return {"ok": False, "item_id": item_id,
                    "error": "value_type is required"}

        if value_type == "single_select":
            graphql_value = {"singleSelectOptionId": str(value) if value else None}
        elif value_type == "text":
            graphql_value = {"text": str(value) if value is not None else ""}
        elif value_type == "number":
            try:
                graphql_value = {"number": float(value)}
            except Exception:
                return {"ok": False, "item_id": item_id,
                        "error": f"value is not a number: {value!r}"}
        elif value_type == "date":
            graphql_value = {"date": str(value) if value else None}
        elif value_type == "iteration":
            graphql_value = {"iterationId": str(value) if value else None}
        else:
            return {"ok": False, "item_id": item_id,
                    "error": f"unsupported value_type: {value_type}"}

        primary = list(graphql_value.values())[0]
        if primary is None:
            return {"ok": False, "item_id": item_id,
                    "error": ("value is null; clearing a field value is not "
                              "supported by this endpoint")}

        mutation = (
            "mutation($projectId:ID!, $itemId:ID!, $fieldId:ID!, "
            "$value:ProjectV2FieldValue!) {\n"
            "  updateProjectV2ItemFieldValue(input:{\n"
            "    projectId:$projectId, itemId:$itemId, fieldId:$fieldId, "
            "value:$value\n"
            "  }) {\n"
            "    projectV2Item { id }\n"
            "  }\n"
            "}\n"
        )
        variables = {
            "projectId": project_id,
            "itemId": item_id,
            "fieldId": field_id,
            "value": graphql_value,
        }
        try:
            res = _gh_graphql(token, mutation, variables)
            if not res["ok"]:
                return {"ok": False, "item_id": item_id, "error": res["error"]}
            updated = (((res.get("data") or {})
                        .get("updateProjectV2ItemFieldValue") or {})
                       .get("projectV2Item") or {})
            return {"ok": True, "item_id": updated.get("id") or item_id,
                    "error": None}
        except Exception as e:
            logger.error(f"[GH_PROJ_UPDATE] {e}", exc_info=True)
            return {"ok": False, "item_id": item_id,
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/project/add-item")
    async def core_github_project_add_item(request: dict):
        """Issue/PR を ProjectV2 に追加する。

        Body:
          A) Node ID:
             { "project_id": "PVT_xxx", "content_id": "I_xxx" }
          B) Issue 番号で指定 (内部解決):
             { "org": "example-org", "number": 11,
               "issue_owner": "example-org", "issue_repo": "example-repo",
               "issue_number": 107 }
        Returns: { "ok": bool, "item_id": str | null, "error": str | null }
        """
        token, err = _gh_resolve_token_or_error(request)
        if err:
            return {**err, "item_id": None}

        project_id = (request.get("project_id") or "").strip() or None
        content_id = (request.get("content_id") or "").strip() or None

        org = (request.get("org") or "").strip()
        try:
            number = int(request.get("number") or 0)
        except Exception:
            number = 0
        iowner = (request.get("issue_owner") or "").strip()
        irepo = (request.get("issue_repo") or "").strip()
        try:
            inumber = int(request.get("issue_number") or 0)
        except Exception:
            inumber = 0

        if not project_id and org and number > 0:
            proj, perr = _gh_project_resolve(token, org, number)
            if perr:
                return {**perr, "item_id": None}
            project_id = proj["id"]
        if not project_id:
            return {"ok": False, "item_id": None,
                    "error": "project_id or (org+number) is required"}

        if not content_id and iowner and irepo and inumber > 0:
            try:
                iq = (
                    "query($o:String!, $r:String!, $n:Int!) {\n"
                    "  repository(owner:$o, name:$r) {\n"
                    "    issueOrPullRequest(number:$n) {\n"
                    "      __typename\n"
                    "      ... on Issue { id }\n"
                    "      ... on PullRequest { id }\n"
                    "    }\n"
                    "  }\n"
                    "}\n"
                )
                res = _gh_graphql(token, iq,
                                  {"o": iowner, "r": irepo, "n": inumber})
                if not res["ok"]:
                    return {"ok": False, "item_id": None,
                            "error": "issue resolve failed: "
                                     + (res["error"] or "")}
                ipr = (((res.get("data") or {}).get("repository") or {})
                       .get("issueOrPullRequest") or {})
                content_id = ipr.get("id")
            except Exception as e:
                logger.error(f"[GH_PROJ_ADD resolve] {e}", exc_info=True)
                return {"ok": False, "item_id": None,
                        "error": f"resolve error: {type(e).__name__}: {str(e)[:200]}"}
        if not content_id:
            return {"ok": False, "item_id": None,
                    "error": ("content_id or "
                              "(issue_owner+issue_repo+issue_number) is required")}

        mutation = (
            "mutation($p:ID!, $c:ID!) {\n"
            "  addProjectV2ItemById(input:{projectId:$p, contentId:$c}) {\n"
            "    item { id }\n"
            "  }\n"
            "}\n"
        )
        try:
            res = _gh_graphql(token, mutation,
                              {"p": project_id, "c": content_id})
            if not res["ok"]:
                return {"ok": False, "item_id": None, "error": res["error"]}
            item = (((res.get("data") or {})
                     .get("addProjectV2ItemById") or {})
                    .get("item") or {})
            return {"ok": True, "item_id": item.get("id"), "error": None}
        except Exception as e:
            logger.error(f"[GH_PROJ_ADD] {e}", exc_info=True)
            return {"ok": False, "item_id": None,
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/project/delete-item")
    async def core_github_project_delete_item(request: dict):
        """Item を ProjectV2 から削除する (Issue 自体は残る)。

        Body:
          { "item_id": "PVTI_xxx",
            "project_id": "PVT_xxx",                    # OR
            "org": "example-org", "number": 11           # で内部解決
          }
        """
        token, err = _gh_resolve_token_or_error(request)
        if err:
            return {**err, "deleted_item_id": None}

        item_id = (request.get("item_id") or "").strip()
        if not item_id:
            return {"ok": False, "deleted_item_id": None,
                    "error": "item_id is required"}
        project_id = (request.get("project_id") or "").strip() or None
        if not project_id:
            org = (request.get("org") or "").strip()
            try:
                number = int(request.get("number") or 0)
            except Exception:
                number = 0
            if org and number > 0:
                proj, perr = _gh_project_resolve(token, org, number)
                if perr:
                    return {**perr, "deleted_item_id": None}
                project_id = proj["id"]
        if not project_id:
            return {"ok": False, "deleted_item_id": None,
                    "error": "project_id or (org+number) is required"}

        mutation = (
            "mutation($p:ID!, $i:ID!) {\n"
            "  deleteProjectV2Item(input:{projectId:$p, itemId:$i}) {\n"
            "    deletedItemId\n"
            "  }\n"
            "}\n"
        )
        try:
            res = _gh_graphql(token, mutation,
                              {"p": project_id, "i": item_id})
            if not res["ok"]:
                return {"ok": False, "deleted_item_id": None,
                        "error": res["error"]}
            did = (((res.get("data") or {})
                    .get("deleteProjectV2Item") or {})
                   .get("deletedItemId"))
            return {"ok": True, "deleted_item_id": did, "error": None}
        except Exception as e:
            logger.error(f"[GH_PROJ_DELETE] {e}", exc_info=True)
            return {"ok": False, "deleted_item_id": None,
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}
