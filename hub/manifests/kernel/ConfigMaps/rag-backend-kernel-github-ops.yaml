    @router.post("/core/github/update-issue")
    async def core_github_update_issue(request: dict):
        """Issue を更新する (state 含む)。 None フィールドは変更されない。

        Body:
            {
              "owner": "your-org",          # 必須
              "repo": "rag",                            # 必須
              "number": 42,                             # 必須
              "title": "新タイトル",                    # 省略可
              "body": "新本文",                         # 省略可
              "state": "open" | "closed",              # 省略可
              "state_reason": "completed" | "not_planned" | "reopened",  # 省略可 (state="closed" 時に意味)
              "labels": ["bug"],                        # 省略可。 [] で全クリア
              "assignees": ["your-user"],                # 省略可。 [] で全クリア
              "milestone": 3                            # 省略可
            }
        Returns:
            {"ok": bool, "issue": {...} | null, "error": str | null}
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        number = request.get("number")

        if not owner or not repo:
            return {"ok": False, "issue": None, "error": "owner and repo are required"}
        if number is None:
            return {"ok": False, "issue": None, "error": "number is required"}

        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "issue": None, "error": f"github token unavailable: {_e}"}

        # None 判定 (request に key が無いと「変更しない」、 明示的に None 渡しと区別する)
        def _opt(key):
            return request.get(key) if key in request else None

        try:
            client = GitHubAPIClient(token=github_token)
            return client.update_issue(
                owner=owner, repo=repo, number=int(number),
                title=_opt("title"),
                body=_opt("body"),
                state=_opt("state"),
                state_reason=_opt("state_reason"),
                labels=_opt("labels"),
                assignees=_opt("assignees"),
                milestone=_opt("milestone"),
            )
        except Exception as e:
            logger.error(f"[GITHUB_UPDATE_ISSUE] unexpected error: {e}", exc_info=True)
            return {"ok": False, "issue": None, "error": f"{type(e).__name__}: {str(e)[:200]}"}


