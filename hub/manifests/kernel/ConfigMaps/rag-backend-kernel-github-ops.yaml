            return {"ok": True, "labels": labels, "error": None}

        def list_milestones(self, owner: str, repo: str,
                            state: str = "open",
                            sort: str = "due_on",
                            direction: str = "asc",
                            per_page: int = 50, page: int = 1) -> Dict[str, Any]:
            """リポジトリのマイルストーン一覧
            (GET /repos/{owner}/{repo}/milestones)。

            state: open / closed / all
            sort: due_on / completeness
            direction: asc / desc
            """
            url = f"{self.base_url}/repos/{owner}/{repo}/milestones"
            params = {
                "state": state if state in ("open", "closed", "all") else "open",
                "sort": sort if sort in ("due_on", "completeness") else "due_on",
                "direction": direction if direction in ("asc", "desc") else "asc",
                "per_page": max(1, min(int(per_page or 50), 100)),
                "page": max(1, int(page or 1)),
            }
            try:
                response = requests.get(url, headers=self.headers, params=params, timeout=30)
            except Exception as e:
                logger.error(f"[GITHUB] list_milestones network error for {owner}/{repo}: {e}")
                return {"ok": False, "milestones": [],
                        "error": f"network error: {type(e).__name__}: {str(e)[:200]}"}
            if response.status_code != 200:
                err_text = response.text[:300] if response.text else f"HTTP {response.status_code}"
                return {"ok": False, "milestones": [],
                        "error": f"HTTP {response.status_code}: {err_text}"}
            data = response.json() or []
            milestones = []
            for m in data:
                creator = m.get("creator") or {}
                milestones.append({
                    "id": m.get("id"),
                    "number": m.get("number"),
                    "title": m.get("title"),
                    "description": m.get("description"),
                    "state": m.get("state"),
                    "open_issues": m.get("open_issues"),
                    "closed_issues": m.get("closed_issues"),
                    "creator": creator.get("login", ""),
                    "created_at": m.get("created_at", ""),
                    "updated_at": m.get("updated_at", ""),
                    "due_on": m.get("due_on"),
                    "closed_at": m.get("closed_at"),
                    "html_url": m.get("html_url", ""),
                })
            return {"ok": True, "milestones": milestones, "error": None}


