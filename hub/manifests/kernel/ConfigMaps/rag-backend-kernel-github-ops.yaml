    @router.post("/core/github/get-file")
    async def core_github_get_file(request: dict):
        """GitHub からファイル内容を取得する。

        Body:
            {
              "owner": "your-org",          # 必須
              "repo": "rag",                            # 必須
              "path": "fleet/config.yaml",              # 必須
              "branch": "main"                          # 省略時は default branch
            }
        Returns:
            {
              "ok": bool,
              "exists": bool,
              "content": str | null,        # UTF-8 デコード済みテキスト
              "sha": str | null,            # 現在の SHA (更新時に必要)
              "size": int,                  # バイト数
              "error": str | null
            }
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        branch = request.get("branch") or None

        if not owner or not repo or not path:
            return {"ok": False, "exists": False, "content": None, "sha": None, "size": 0,
                    "error": "owner, repo, path are required"}

        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "exists": False, "content": None, "sha": None, "size": 0,
                    "error": f"github token unavailable: {_e}"}

        try:
            client = GitHubAPIClient(token=github_token)
            url = f"{client.base_url}/repos/{owner}/{repo}/contents/{path}"
            params = {"ref": branch} if branch else {}
            response = requests.get(url, headers=client.headers, params=params, timeout=30)

            if response.status_code == 404:
                return {"ok": True, "exists": False, "content": None, "sha": None, "size": 0,
                        "error": None}
            if response.status_code != 200:
                return {"ok": False, "exists": False, "content": None, "sha": None, "size": 0,
                        "error": f"HTTP {response.status_code}: {response.text[:200]}"}

            data = response.json()
            content_b64 = data.get("content", "")
            try:
                # GitHub API は base64 encoded content を改行入りで返す
                text = base64.b64decode(content_b64).decode("utf-8")
            except Exception as e:
                return {"ok": False, "exists": True, "content": None, "sha": data.get("sha"),
                        "size": data.get("size", 0),
                        "error": f"decode failed: {type(e).__name__}: {str(e)[:200]}"}

            return {
                "ok": True,
                "exists": True,
                "content": text,
                "sha": data.get("sha"),
                "size": data.get("size", 0),
                "error": None,
            }
        except Exception as e:
            logger.error(f"[GITHUB_GET_FILE] unexpected error: {e}", exc_info=True)
            return {"ok": False, "exists": False, "content": None, "sha": None, "size": 0,
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/put-file")
    async def core_github_put_file(request: dict):
        """GitHub にファイルを作成 or 更新して直接 push する。

        既存ファイルがあれば自動的に SHA を取得して update、 無ければ create。
        1 ファイル = 1 commit。

        Body:
            {
              "owner": "your-org",          # 必須
              "repo": "rag",                            # 必須
              "path": "fleet/config.yaml",              # 必須
              "content": "apiVersion: v1\\nkind: ...",  # 必須 (UTF-8 テキスト)
              "message": "Update config.yaml",          # 必須 (commit message)
              "branch": "main"                          # 省略時は default branch
            }
        Returns:
            {
              "ok": bool,
              "action": "created" | "updated" | null,
              "commit_sha": str,
              "html_url": str,        # GitHub 上の commit URL
              "error": str | null
            }
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        content = request.get("content")
        message = (request.get("message") or "").strip()
        branch = request.get("branch") or None

        if not owner or not repo or not path:
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "error": "owner, repo, path are required"}
        if content is None:
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "error": "content is required"}
        if not isinstance(content, str):
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "error": "content must be a string"}
        if not message:
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "error": "commit message is required"}

        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "error": f"github token unavailable: {_e}"}

        try:
            client = GitHubAPIClient(token=github_token)
            result = client.put_file(owner=owner, repo=repo, path=path,
                                     content=content, message=message, branch=branch)
            if result.get("ok"):
                new_sha = result.get("commit_sha", "")
                # Auto-checkpoint (best-effort, non-blocking)
                if new_sha and not request.get("skip_autockpt"):
                    pre_sha = _get_commit_parent_sha(client, owner, repo, new_sha)
                    if pre_sha:
                        _record_autockpt(
                            owner=owner, repo=repo, path=path,
                            branch=(branch or ""),
                            pre_commit_sha=pre_sha,
                            tool=(request.get("tool_hint") or "put-file"),
                            message=message,
                            user_id=request.get("user_id"),
                        )
                return {
                    "ok": True,
                    "action": result.get("action"),
                    "commit_sha": new_sha,
                    "html_url": result.get("html_url", ""),
                    "error": None,
                }
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "error": result.get("error", "unknown")}
        except Exception as e:
            logger.error(f"[GITHUB_PUT_FILE] unexpected error: {e}", exc_info=True)
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/delete-file")
    async def core_github_delete_file(request: dict):
        """GitHub からファイルを削除して直接 push する。

        ファイルが存在しなければ ok=True, deleted=False (冪等)。

        Body:
            {
              "owner": "your-org",          # 必須
              "repo": "rag",                            # 必須
              "path": "fleet/old.yaml",                 # 必須
              "message": "Delete old.yaml",             # 必須 (commit message)
              "branch": "main"                          # 省略時は default branch
            }
        Returns:
            {
              "ok": bool,
              "deleted": bool,            # 実際に削除したか (もともと無ければ False)
              "commit_sha": str,
              "html_url": str,
              "error": str | null
            }
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        message = (request.get("message") or "").strip()
        branch = request.get("branch") or None

        if not owner or not repo or not path:
            return {"ok": False, "deleted": False, "commit_sha": "", "html_url": "",
                    "error": "owner, repo, path are required"}
        if not message:
            return {"ok": False, "deleted": False, "commit_sha": "", "html_url": "",
                    "error": "commit message is required"}

        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "deleted": False, "commit_sha": "", "html_url": "",
                    "error": f"github token unavailable: {_e}"}

        try:
            client = GitHubAPIClient(token=github_token)
            result = client.delete_file(owner=owner, repo=repo, path=path,
                                        message=message, branch=branch)
            if result.get("ok") and result.get("deleted"):
                new_sha = result.get("commit_sha", "")
                if new_sha and not request.get("skip_autockpt"):
                    pre_sha = _get_commit_parent_sha(client, owner, repo, new_sha)
                    if pre_sha:
                        _record_autockpt(
                            owner=owner, repo=repo, path=path,
                            branch=(branch or ""),
                            pre_commit_sha=pre_sha,
                            tool=(request.get("tool_hint") or "delete-file"),
                            message=message,
                            user_id=request.get("user_id"),
                        )
            return {
                "ok": result.get("ok", False),
                "deleted": result.get("deleted", False),
                "commit_sha": result.get("commit_sha", ""),
                "html_url": result.get("html_url", ""),
                "error": result.get("error"),
            }
        except Exception as e:
            logger.error(f"[GITHUB_DELETE_FILE] unexpected error: {e}", exc_info=True)
            return {"ok": False, "deleted": False, "commit_sha": "", "html_url": "",
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @router.post("/core/github/list-directory")
    async def core_github_list_directory(request: dict):
        """GitHub のディレクトリ内容一覧を取得する。

        GitHub Contents API: GET /repos/{owner}/{repo}/contents/{path}
        path がディレクトリの場合、 配下のファイル/ディレクトリ一覧を返す。

        Body:
            {
              "owner": "your-org",          # 必須
              "repo": "rag",                            # 必須
              "path": "your-path/manifests",               # 必須 (ルートなら "" も可)
              "branch": "main"                          # 省略時は default branch
            }
        Returns:
            {
              "ok": bool,
              "exists": bool,
              "is_directory": bool,           # path がディレクトリかどうか
              "items": [
                  {"name": str, "path": str, "type": "file"|"dir",
                   "size": int, "sha": str},
                  ...
              ],
              "error": str | null
            }
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        branch = request.get("branch") or None

        if not owner or not repo:
            return {"ok": False, "exists": False, "is_directory": False, "items": [],
                    "error": "owner and repo are required"}

        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "exists": False, "is_directory": False, "items": [],
                    "error": f"github token unavailable: {_e}"}

        try:
            client = GitHubAPIClient(token=github_token)
            url = f"{client.base_url}/repos/{owner}/{repo}/contents/{path}"
            params = {"ref": branch} if branch else {}
            response = requests.get(url, headers=client.headers, params=params, timeout=30)

            if response.status_code == 404:
                return {"ok": True, "exists": False, "is_directory": False, "items": [],
                        "error": None}
            if response.status_code != 200:
                return {"ok": False, "exists": False, "is_directory": False, "items": [],
                        "error": f"HTTP {response.status_code}: {response.text[:200]}"}

            data = response.json()
            # ディレクトリ → list、 ファイル → dict が返る
            if isinstance(data, list):
                items = []
                for item in data:
                    items.append({
                        "name": item.get("name", ""),
                        "path": item.get("path", ""),
                        "type": item.get("type", ""),  # "file" or "dir"
                        "size": item.get("size", 0),
                        "sha": item.get("sha", ""),
                    })
                # name でソート (見やすさのため)
                items.sort(key=lambda x: (x["type"] != "dir", x["name"]))
                return {"ok": True, "exists": True, "is_directory": True, "items": items,
                        "error": None}
            else:
                # ファイルが指定された場合
                return {"ok": True, "exists": True, "is_directory": False, "items": [],
                        "error": None}
        except Exception as e:
            logger.error(f"[GITHUB_LIST_DIR] unexpected error: {e}", exc_info=True)
            return {"ok": False, "exists": False, "is_directory": False, "items": [],
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


