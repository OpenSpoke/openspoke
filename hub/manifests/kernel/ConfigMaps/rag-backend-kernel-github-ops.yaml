    @router.post("/core/github/get-issue")
    async def core_github_get_issue(request: dict):
        """Issue 1 件の詳細を取得する (コメントも併せて返す)。

        Body:
            {
              "owner": "your-org",          # 必須
              "repo": "rag",                            # 必須
              "number": 42,                             # 必須 (issue 番号)
              "include_comments": true                  # 省略時 true
            }
        Returns:
            {
              "ok": bool,
              "exists": bool,
              "issue": {...} | null,
              "comments": [...],     # include_comments=true の時のみ。 失敗時は []
              "error": str | null
            }
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        number = request.get("number")
        include_comments = bool(request.get("include_comments", True))

        if not owner or not repo:
            return {"ok": False, "exists": False, "issue": None, "comments": [],
                    "error": "owner and repo are required"}
        if number is None:
            return {"ok": False, "exists": False, "issue": None, "comments": [],
                    "error": "number is required"}

        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "exists": False, "issue": None, "comments": [],
                    "error": f"github token unavailable: {_e}"}

        try:
            client = GitHubAPIClient(token=github_token)
            issue_result = client.get_issue(owner=owner, repo=repo, number=int(number))
            if not issue_result.get("ok"):
                return {"ok": False, "exists": False, "issue": None, "comments": [],
                        "error": issue_result.get("error")}
            if not issue_result.get("exists"):
                return {"ok": True, "exists": False, "issue": None, "comments": [],
                        "error": None}

            comments = []
            if include_comments and (issue_result["issue"] or {}).get("comments", 0) > 0:
                # コメントが 1 件以上ある時だけ取得 (per_page=100 で最初の 100 件)
                cmt_result = client.list_issue_comments(
                    owner=owner, repo=repo, number=int(number), per_page=100
                )
                if cmt_result.get("ok"):
                    comments = cmt_result.get("comments", [])
                else:
                    # コメント取得失敗は致命的ではないので warn のみ
                    logger.warning(f"[GITHUB_GET_ISSUE] comments fetch failed: {cmt_result.get('error')}")

            return {
                "ok": True,
                "exists": True,
                "issue": issue_result["issue"],
                "comments": comments,
                "error": None,
            }
        except Exception as e:
            logger.error(f"[GITHUB_GET_ISSUE] unexpected error: {e}", exc_info=True)
            return {"ok": False, "exists": False, "issue": None, "comments": [],
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


