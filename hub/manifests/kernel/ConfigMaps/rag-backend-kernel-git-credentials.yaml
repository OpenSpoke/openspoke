    @router.put("/{provider}/{scope_type}/{scope_id:path}")
    async def put_credential(
        provider: str,
        scope_type: str,
        scope_id: str,
        request: Request,
        payload: Dict[str, Any],
    ) -> Dict[str, Any]:
        """登録・更新 (admin または自分の user scope のみ)。 空値は変更しない扱い。"""
        ident = _require_admin_or_self_user(request, scope_type, scope_id)
        _validate_provider(provider)
        _validate_scope_type(scope_type)
        _validate_scope_id(scope_id)

        token = (payload.get("token") or "").strip()
        note = payload.get("note") or ""
        account_type = payload.get("account_type") or ""
        account_name = payload.get("account_name") or ""
        host = payload.get("host") or ""
        api_base_url = payload.get("api_base_url") or ""

        if provider == "github":
            if not host:
                host = "github.com"
            if not api_base_url:
                api_base_url = GITHUB_API_BASE
            if not account_name:
                account_name = scope_id
        elif provider == "anthropic":
            if not host:
                host = "api.anthropic.com"
            if not api_base_url:
                api_base_url = "https://api.anthropic.com"
            if not account_name:
                account_name = "Anthropic"
        elif provider == "typesafe":
            if not host:
                host = "api.typesafe.ai"
            if not api_base_url:
                api_base_url = "https://api.typesafe.ai"
            if not account_name:
                account_name = "TypeSafe AI"
        else:
            # gitlab
            _validate_host(host)
            if account_type and account_type not in _VALID_ACCOUNT_TYPES:
                raise HTTPException(
                    status_code=400,
                    detail=f"account_type must be one of "
                           f"{_VALID_ACCOUNT_TYPES}",
                )
            if not api_base_url:
                api_base_url = _default_api_base_url(provider, host)
            if not account_name:
                # scope_id が "{host}:{account_name}" 形式なら後半を表示用に
                if ":" in scope_id:
                    account_name = scope_id.split(":", 1)[1]
                else:
                    account_name = scope_id

        _ensure_index()

        doc_id = _doc_id(scope_type, provider, scope_id)
        existing = _os_get(doc_id) or {}
        now = _now_iso()
        actor = ident.get("user") or ident.get("email") or ""

        # token が空なら既存 token を保持 (メタ情報だけの更新に対応)
        effective_token = token or existing.get("token") or ""
        if not effective_token:
            raise HTTPException(
                status_code=400,
                detail="token is required for new credential",
            )

        doc = {
            "provider": provider,
            "host": host,
            "scope_type": scope_type,
            "scope_id": scope_id,
            "account_name": account_name,
            "token": effective_token,
            "note": note if note else existing.get("note") or "",
            "api_base_url": api_base_url,
            "created_at": existing.get("created_at") or now,
            "updated_at": now,
            "created_by": existing.get("created_by") or actor,
            "updated_by": actor,
            "last_used_at": existing.get("last_used_at"),
            "verification": existing.get("verification") or {},
        }
        if provider == "gitlab":
            doc["account_type"] = (
                account_type or existing.get("account_type") or "user"
            )

        ok = _os_put(doc_id, doc)
        if not ok:
            raise HTTPException(
                status_code=500, detail="OpenSearch put failed"
            )

        return {
            "ok": True,
            "item": _safe_view(doc),
            "created": not existing,
        }


