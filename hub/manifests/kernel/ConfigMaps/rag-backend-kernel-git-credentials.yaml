apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-backend-kernel-git-credentials
  namespace: rag-company1
data:
  git_credentials.py: |
    """
    git_credentials.py
    ====================================================================
    Git Credentials Store (組織/アカウントスコープ + 将来の利用者スコープ)

    OpenSpoke で使う GitHub / GitLab の PAT を、 Kubernetes Secret では
    なく OpenSearch に集約管理する。 平文保存 (運用方針として、
    ディスク暗号化前提で暗号鍵管理は増やさない)。

    設計は docs/operations/git-credentials.md を参照。
    Phase 1a では組織スコープ (org) を実装。 利用者スコープ (user) は
    schema 上は用意するが今回は書き込み経路を提供しない。

    エンドポイント (prefix=/core/git_credentials):
      - GET    /list                                         一覧 (token 除去、 admin 限定)
      - GET    /{provider}/{scope_type}/{scope_id:path}      詳細 (token 除去)
      - PUT    /{provider}/{scope_type}/{scope_id:path}      登録・更新
      - DELETE /{provider}/{scope_type}/{scope_id:path}      削除
      - POST   /{provider}/{scope_type}/{scope_id:path}/verify  動作確認
      - POST   /{provider}/{scope_type}/{scope_id:path}/token   内部 token 取得
      - GET    /health                                       health check

    OpenSearch index:
      - git_credentials
        _id = "{scope_type}:{provider}:{scope_id}"
              (例: "org:github:intelligentsoftware",
                    "org:gitlab:gitlab.example.com:username")
        fields:
          provider       (keyword) "github" | "gitlab"
          host           (keyword) "github.com" / "gitlab.com" / etc.
          scope_type     (keyword) "org" | "user"
          scope_id       (keyword) 例: "intelligentsoftware", "gitlab.com:root"
          account_type   (keyword) GitLab のみ "user" | "group"
          account_name   (keyword) 表示用
          token          (keyword, index=False) PAT 平文
          note           (text)                 説明
          api_base_url   (keyword) GitHub: https://api.github.com,
                                    GitLab: https://{host}/api/v4
          created_at     (date)
          updated_at     (date)
          created_by     (keyword) 作成者 (X-Forwarded-User)
          updated_by     (keyword)
          last_used_at   (date)   token エンドポイント呼び出し時刻
          verification   (object) {ok, checked_at, login, scopes, error}

    admin 判定:
      X-Forwarded-Groups header (oauth2-proxy が Keycloak realm role
      を注入) に "role:openspoke_admin" が含まれる場合のみ通す。
      内部から呼び出す token エンドポイントは frontend 経由ではないため
      ヘッダが無いことを許容する (Phase 2 で内部認証を検討)。

    設計方針:
      - kernel 本体 (main.py) への依存をゼロ (OpenSearch と外部 API へは
        requests で直接アクセス、 kernel 既存モジュールと同じ流儀)
      - import 失敗時は警告のみで kernel 起動を妨げない
      - index は起動時と write 時に lazy 作成 (idempotent)
      - 平文保存 (運用方針として、 メール/GitHub アカウント管理と同方針)
    """
    from __future__ import annotations

    import logging
    import os
    import re
    from datetime import datetime, timezone
    from typing import Any, Dict, List, Optional, Tuple
    from urllib.parse import quote as _urlquote

    from fastapi import APIRouter, HTTPException, Request

    logger = logging.getLogger(__name__)

    # ── requests (遅延 import) ──
    try:
        import requests
        _REQUESTS_AVAILABLE = True
    except ImportError as _e:
        logger.warning(f"[GIT_CREDENTIALS] requests not available: {_e}")
        _REQUESTS_AVAILABLE = False
        requests = None


    # ── 設定 ──
    OPENSEARCH_URL = os.environ.get(
        "OPENSEARCH_URL",
        "http://opensearch.opensearch.svc.cluster.local:9200"
    )
    OS_INDEX = "git_credentials"

    GITHUB_API_BASE = "https://api.github.com"

    # 起動モード: strict / bootstrap
    #   strict    (default): store 参照のみ
    #   bootstrap: store 空の間は GITHUB_TOKEN env フォールバックを許可
    CREDENTIALS_BOOTSTRAP_MODE = os.environ.get(
        "CREDENTIALS_BOOTSTRAP_MODE", "strict"
    ).strip().lower()

    _ADMIN_ROLE = "role:openspoke_admin"

    # 許容文字: 英数字 + ドット + アンダースコア + ハイフン + コロン
    #   (GitLab の "{host}:{account_name}" 複合キーを想定)
    _SCOPE_ID_RE = re.compile(r"^[A-Za-z0-9._:@\-]+$")
    _HOST_RE = re.compile(r"^[A-Za-z0-9._\-]+$")
    _VALID_PROVIDERS = ("github", "gitlab", "anthropic", "typesafe")
    _VALID_SCOPE_TYPES = ("org", "user")
    _VALID_ACCOUNT_TYPES = ("user", "group")


    def _now_iso() -> str:
        return datetime.now(timezone.utc).isoformat()


    def _mask_token(token: Optional[str]) -> str:
        """token を先頭 4 + アスタリスク + 末尾 4 に整形。"""
        if not token:
            return ""
        if len(token) <= 10:
            return "*" * len(token)
        return f"{token[:4]}{'*' * (len(token) - 8)}{token[-4:]}"


    # ====================================================================
    # admin 判定
    # ====================================================================

    def _extract_login_identity(request: Request) -> Dict[str, str]:
        """oauth2-proxy が入れるヘッダから login 情報を抜き出す。"""
        try:
            headers = {k.lower(): v for k, v in request.headers.items()}
        except Exception:
            return {"user": "", "email": "", "groups": ""}
        return {
            "user":   headers.get("x-forwarded-preferred-username")
                       or headers.get("x-forwarded-user")
                       or headers.get("x-auth-request-user")
                       or "",
            "email":  headers.get("x-forwarded-email")
                       or headers.get("x-auth-request-email")
                       or "",
            "groups": headers.get("x-forwarded-groups") or "",
        }


    def _is_admin(request: Request) -> bool:
        """X-Forwarded-Groups に role:openspoke_admin が含まれれば admin。"""
        ident = _extract_login_identity(request)
        groups = ident.get("groups", "")
        if not groups:
            return False
        parts = [g.strip() for g in groups.split(",")]
        return _ADMIN_ROLE in parts


    def _require_admin(request: Request) -> Dict[str, str]:
        """admin でなければ 403。 admin なら login identity を返す。"""
        if not _is_admin(request):
            raise HTTPException(
                status_code=403,
                detail="admin only (role:openspoke_admin required)",
            )
        return _extract_login_identity(request)


    def _require_admin_or_self_user(
        request: Request, scope_type: str, scope_id: str
    ) -> Dict[str, str]:
        """admin なら常に許可。 それ以外は scope_type=='user' かつ scope_id が
        呼び出し利用者のログイン識別子 (preferred_username または email) と
        一致するときのみ許可。 それ以外は 403。

        Phase 2-h で追加: 非 admin 利用者が自分の個人 PAT (user スコープ) を
        管理できるようにする。 org スコープや他人の user スコープには
        アクセスできない。
        """
        ident = _extract_login_identity(request)
        if _is_admin(request):
            return ident
        if scope_type != "user":
            raise HTTPException(
                status_code=403,
                detail=(
                    "non-admin can only manage user-scope credentials "
                    "(scope_type=='user')"
                ),
            )
        self_user = (ident.get("user") or "").strip()
        self_email = (ident.get("email") or "").strip()
        allowed = {v for v in (self_user, self_email) if v}
        if scope_id and scope_id in allowed:
            return ident
        raise HTTPException(
            status_code=403,
            detail=(
                "user scope: scope_id must match your login identity "
                "(preferred_username or email)"
            ),
        )


    # ====================================================================
    # 入力検証
    # ====================================================================

    def _validate_provider(provider: str) -> None:
        if provider not in _VALID_PROVIDERS:
            raise HTTPException(
                status_code=400,
                detail=f"provider must be one of {_VALID_PROVIDERS}",
            )


    def _validate_scope_type(scope_type: str) -> None:
        if scope_type not in _VALID_SCOPE_TYPES:
            raise HTTPException(
                status_code=400,
                detail=f"scope_type must be one of {_VALID_SCOPE_TYPES}",
            )


    def _validate_scope_id(scope_id: str) -> None:
        if not scope_id:
            raise HTTPException(status_code=400, detail="scope_id is required")
        if len(scope_id) > 256:
            raise HTTPException(status_code=400, detail="scope_id too long (>256)")
        if not _SCOPE_ID_RE.match(scope_id):
            raise HTTPException(
                status_code=400,
                detail="scope_id contains invalid characters "
                       "(allowed: A-Za-z0-9._-:)",
            )


    def _validate_host(host: str) -> None:
        if not host:
            raise HTTPException(status_code=400, detail="host is required")
        if not _HOST_RE.match(host):
            raise HTTPException(
                status_code=400,
                detail="host contains invalid characters",
            )


    def _doc_id(scope_type: str, provider: str, scope_id: str) -> str:
        return f"{scope_type}:{provider}:{scope_id}"


    def _os_id_quoted(doc_id: str) -> str:
        """OpenSearch _doc/{id} 用に URL エンコード。"""
        return _urlquote(doc_id, safe="")


    def _default_api_base_url(provider: str, host: str) -> str:
        if provider == "github":
            return GITHUB_API_BASE
        if provider == "anthropic":
            return "https://api.anthropic.com"
        if provider == "typesafe":
            return "https://api.typesafe.ai"
        # gitlab
        return f"https://{host}/api/v4"


    # ====================================================================
    # OpenSearch helper (kernel 既存モジュールと同じ流儀で requests 直叩き)
    # ====================================================================

    def _ensure_index() -> None:
        """index が無ければ作成する (idempotent、 起動時と書き込み時に呼ぶ)。"""
        if not _REQUESTS_AVAILABLE:
            return
        try:
            resp = requests.head(f"{OPENSEARCH_URL}/{OS_INDEX}", timeout=3)
            if resp.status_code == 200:
                return
        except Exception as e:
            logger.warning(f"[GIT_CREDENTIALS] index HEAD failed: {e}")
            return

        mapping = {
            "settings": {
                "number_of_shards": 1,
                "number_of_replicas": 0,
            },
            "mappings": {
                "properties": {
                    "provider":     {"type": "keyword"},
                    "host":         {"type": "keyword"},
                    "scope_type":   {"type": "keyword"},
                    "scope_id":     {"type": "keyword"},
                    "account_type": {"type": "keyword"},
                    "account_name": {"type": "keyword"},
                    "token":        {"type": "keyword", "index": False},
                    "note":         {"type": "text"},
                    "api_base_url": {"type": "keyword"},
                    "created_at":   {"type": "date"},
                    "updated_at":   {"type": "date"},
                    "created_by":   {"type": "keyword"},
                    "updated_by":   {"type": "keyword"},
                    "last_used_at": {"type": "date"},
                    "verification": {
                        "type": "object",
                        "enabled": True,
                    },
                }
            }
        }
        try:
            resp = requests.put(
                f"{OPENSEARCH_URL}/{OS_INDEX}",
                json=mapping,
                timeout=5,
            )
            if resp.status_code >= 400:
                logger.warning(
                    f"[GIT_CREDENTIALS] index create failed: "
                    f"{resp.status_code} {resp.text[:200]}"
                )
            else:
                logger.info(f"[GIT_CREDENTIALS] index created: {OS_INDEX}")
        except Exception as e:
            logger.warning(f"[GIT_CREDENTIALS] index create error: {e}")


    def _os_get(doc_id: str) -> Optional[Dict[str, Any]]:
        if not _REQUESTS_AVAILABLE:
            return None
        try:
            resp = requests.get(
                f"{OPENSEARCH_URL}/{OS_INDEX}/_doc/{_os_id_quoted(doc_id)}",
                timeout=3,
            )
            if resp.status_code == 404:
                return None
            if resp.status_code >= 400:
                logger.warning(
                    f"[GIT_CREDENTIALS] _os_get failed: "
                    f"{resp.status_code} {resp.text[:200]}"
                )
                return None
            return resp.json().get("_source")
        except Exception as e:
            logger.warning(f"[GIT_CREDENTIALS] _os_get error: {e}")
            return None


    def _os_put(doc_id: str, doc: Dict[str, Any]) -> bool:
        if not _REQUESTS_AVAILABLE:
            return False
        try:
            resp = requests.put(
                f"{OPENSEARCH_URL}/{OS_INDEX}/_doc/"
                f"{_os_id_quoted(doc_id)}?refresh=true",
                json=doc,
                timeout=5,
            )
            if resp.status_code >= 400:
                logger.warning(
                    f"[GIT_CREDENTIALS] _os_put failed: "
                    f"{resp.status_code} {resp.text[:200]}"
                )
                return False
            return True
        except Exception as e:
            logger.warning(f"[GIT_CREDENTIALS] _os_put error: {e}")
            return False


    def _os_delete(doc_id: str) -> bool:
        if not _REQUESTS_AVAILABLE:
            return False
        try:
            resp = requests.delete(
                f"{OPENSEARCH_URL}/{OS_INDEX}/_doc/"
                f"{_os_id_quoted(doc_id)}?refresh=true",
                timeout=3,
            )
            if resp.status_code in (200, 404):
                return True
            logger.warning(
                f"[GIT_CREDENTIALS] _os_delete failed: "
                f"{resp.status_code} {resp.text[:200]}"
            )
            return False
        except Exception as e:
            logger.warning(f"[GIT_CREDENTIALS] _os_delete error: {e}")
            return False


    def _os_search(
        scope_type: Optional[str] = None,
        provider: Optional[str] = None,
    ) -> List[Dict[str, Any]]:
        if not _REQUESTS_AVAILABLE:
            return []
        must: List[Dict[str, Any]] = []
        if scope_type:
            must.append({"term": {"scope_type": scope_type}})
        if provider:
            must.append({"term": {"provider": provider}})
        query = (
            {"match_all": {}}
            if not must
            else {"bool": {"must": must}}
        )
        try:
            resp = requests.post(
                f"{OPENSEARCH_URL}/{OS_INDEX}/_search",
                json={"query": query, "size": 1000},
                timeout=5,
            )
            if resp.status_code == 404:
                return []
            if resp.status_code >= 400:
                logger.warning(
                    f"[GIT_CREDENTIALS] _os_search failed: "
                    f"{resp.status_code} {resp.text[:200]}"
                )
                return []
            hits = resp.json().get("hits", {}).get("hits", [])
            return [h.get("_source", {}) for h in hits]
        except Exception as e:
            logger.warning(f"[GIT_CREDENTIALS] _os_search error: {e}")
            return []


    def _os_touch_last_used(doc_id: str) -> None:
        if not _REQUESTS_AVAILABLE:
            return
        try:
            requests.post(
                f"{OPENSEARCH_URL}/{OS_INDEX}/_update/"
                f"{_os_id_quoted(doc_id)}?refresh=false",
                json={"doc": {"last_used_at": _now_iso()}},
                timeout=3,
            )
        except Exception:
            pass


    def _os_update_verification(doc_id: str, verification: Dict[str, Any]) -> None:
        if not _REQUESTS_AVAILABLE:
            return
        try:
            requests.post(
                f"{OPENSEARCH_URL}/{OS_INDEX}/_update/"
                f"{_os_id_quoted(doc_id)}?refresh=true",
                json={"doc": {"verification": verification}},
                timeout=5,
            )
        except Exception as e:
            logger.warning(
                f"[GIT_CREDENTIALS] update verification error: {e}"
            )


    # ====================================================================
    # 外部 API による token 検証
    # ====================================================================

    def _verify_github_token(token: str) -> Dict[str, Any]:
        """GET https://api.github.com/user で検証。"""
        if not _REQUESTS_AVAILABLE:
            return {"ok": False, "error": "requests unavailable"}
        try:
            resp = requests.get(
                f"{GITHUB_API_BASE}/user",
                headers={
                    "Authorization": f"Bearer {token}",
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28",
                },
                timeout=10,
            )
        except Exception as e:
            return {"ok": False, "error": str(e)}

        if resp.status_code != 200:
            return {
                "ok": False,
                "status_code": resp.status_code,
                "error": resp.text[:300],
            }
        data = resp.json() or {}
        scopes = resp.headers.get("X-OAuth-Scopes", "")
        scope_list = [
            s.strip() for s in scopes.split(",") if s.strip()
        ] if scopes else []
        return {
            "ok": True,
            "login": data.get("login") or "",
            "name": data.get("name") or "",
            "scopes": scope_list,
        }


    def _verify_gitlab_token(token: str, api_base_url: str) -> Dict[str, Any]:
        """GET {api_base_url}/personal_access_tokens/self を第一選択、
        失敗時は /user に落とす。"""
        if not _REQUESTS_AVAILABLE:
            return {"ok": False, "error": "requests unavailable"}
        base = (api_base_url or "").rstrip("/")
        if not base:
            return {"ok": False, "error": "api_base_url is empty"}
        try:
            resp = requests.get(
                f"{base}/personal_access_tokens/self",
                headers={"PRIVATE-TOKEN": token},
                timeout=10,
            )
        except Exception as e:
            return {"ok": False, "error": str(e)}

        if resp.status_code == 200:
            data = resp.json() or {}
            return {
                "ok": True,
                "login": data.get("name") or "",
                "user_id": data.get("user_id"),
                "scopes": data.get("scopes") or [],
                "endpoint": "personal_access_tokens/self",
            }

        # フォールバック: /user
        try:
            resp2 = requests.get(
                f"{base}/user",
                headers={"PRIVATE-TOKEN": token},
                timeout=10,
            )
        except Exception as e:
            return {"ok": False, "error": str(e)}
        if resp2.status_code != 200:
            return {
                "ok": False,
                "status_code": resp2.status_code,
                "error": resp2.text[:300],
            }
        data = resp2.json() or {}
        return {
            "ok": True,
            "login": data.get("username") or "",
            "name": data.get("name") or "",
            "user_id": data.get("id"),
            "scopes": [],
            "endpoint": "user (scopes unavailable)",
        }


    def _verify_anthropic_token(token: str) -> Dict[str, Any]:
        """POST https://api.anthropic.com/v1/messages に最小メッセージを 1 通送って検証。

        Haiku で max_tokens=1、 コストは 1 回あたり数円未満。 200 応答で
        id / model / usage が返れば ok=true。 usage から入出力 tokens を回収。
        """
        if not _REQUESTS_AVAILABLE:
            return {"ok": False, "error": "requests unavailable"}
        try:
            resp = requests.post(
                "https://api.anthropic.com/v1/messages",
                headers={
                    "x-api-key": token,
                    "anthropic-version": "2023-06-01",
                    "content-type": "application/json",
                },
                json={
                    "model": "claude-haiku-4-5",
                    "max_tokens": 1,
                    "messages": [{"role": "user", "content": "ping"}],
                },
                timeout=15,
            )
        except Exception as e:
            return {"ok": False, "error": str(e)}

        if resp.status_code != 200:
            return {
                "ok": False,
                "status_code": resp.status_code,
                "error": resp.text[:300],
            }
        data = resp.json() or {}
        usage = data.get("usage") or {}
        return {
            "ok": True,
            "model": data.get("model") or "",
            "input_tokens": usage.get("input_tokens", 0),
            "output_tokens": usage.get("output_tokens", 0),
        }


    def _verify_typesafe_token(token: str) -> Dict[str, Any]:
        """POST https://api.typesafe.ai/v1/systemone に最小 state + 1 noul を投げて検証。

        model=jev-latest、 質問 1 個 (noul)、 出力課金なしなので実質入力代のみ。
        200 応答で answers が返れば ok=true。 usage から入力 tokens を回収。
        """
        if not _REQUESTS_AVAILABLE:
            return {"ok": False, "error": "requests unavailable"}
        try:
            resp = requests.post(
                "https://api.typesafe.ai/v1/systemone",
                headers={
                    "Authorization": f"Bearer {token}",
                    "Content-Type": "application/json",
                },
                json={
                    "state": "ping",
                    "model": "jev-latest",
                    "questions": {
                        "verify": {
                            "type": "noul",
                            "instructions": "Is this a verification ping?",
                        }
                    },
                },
                timeout=15,
            )
        except Exception as e:
            return {"ok": False, "error": str(e)}

        if resp.status_code != 200:
            return {
                "ok": False,
                "status_code": resp.status_code,
                "error": resp.text[:300],
            }
        data = resp.json() or {}
        usage = data.get("usage") or {}
        return {
            "ok": True,
            "model": data.get("model") or "jev-latest",
            "input_tokens": usage.get("input_tokens", 0),
            "output_tokens": usage.get("output_tokens", 0),
        }


    def _verify(doc: Dict[str, Any]) -> Dict[str, Any]:
        """provider に応じて verify を呼び分ける。"""
        provider = doc.get("provider")
        token = doc.get("token") or ""
        if provider == "github":
            result = _verify_github_token(token)
        elif provider == "gitlab":
            result = _verify_gitlab_token(token, doc.get("api_base_url") or "")
        elif provider == "anthropic":
            result = _verify_anthropic_token(token)
        elif provider == "typesafe":
            result = _verify_typesafe_token(token)
        else:
            result = {"ok": False, "error": f"unknown provider: {provider}"}
        result["checked_at"] = _now_iso()
        return result


    # ====================================================================
    # DTO 加工 (token マスク)
    # ====================================================================

    def _safe_view(doc: Dict[str, Any]) -> Dict[str, Any]:
        """token 平文を除去して代わりにマスク済み文字列を入れる。"""
        if not doc:
            return {}
        safe = dict(doc)
        token = safe.pop("token", "") or ""
        safe["token_masked"] = _mask_token(token)
        return safe


    # ====================================================================
    # FastAPI Router
    # ====================================================================

    router = APIRouter(
        prefix="/core/git_credentials", tags=["git-credentials"]
    )


    @router.get("/health")
    async def health() -> Dict[str, Any]:
        """git_credentials モジュール自身の health check。"""
        os_status = "unknown"
        count = 0
        if _REQUESTS_AVAILABLE:
            try:
                resp = requests.head(
                    f"{OPENSEARCH_URL}/{OS_INDEX}", timeout=2
                )
                if resp.status_code == 200:
                    os_status = "ok"
                elif resp.status_code == 404:
                    os_status = "not_found"
                else:
                    os_status = f"http_{resp.status_code}"
            except Exception as e:
                os_status = f"error: {type(e).__name__}"
            try:
                resp2 = requests.get(
                    f"{OPENSEARCH_URL}/{OS_INDEX}/_count", timeout=2
                )
                if resp2.status_code == 200:
                    count = int(resp2.json().get("count") or 0)
            except Exception:
                pass
        return {
            "ok": True,
            "opensearch_url": OPENSEARCH_URL,
            "index": OS_INDEX,
            "index_status": os_status,
            "count": count,
            "bootstrap_mode": CREDENTIALS_BOOTSTRAP_MODE,
        }


    @router.get("/list")
    async def list_credentials(
        request: Request,
        scope_type: Optional[str] = None,
        provider: Optional[str] = None,
    ) -> Dict[str, Any]:
        """一覧 (token 除去)。 admin なら全件、 非 admin なら自分の user
        スコープのエントリのみを返す。
        """
        ident = _extract_login_identity(request)
        is_admin = _is_admin(request)
        if not is_admin:
            # 非 admin は user スコープの自分のエントリのみ
            scope_type = "user"
        if scope_type is not None and scope_type not in _VALID_SCOPE_TYPES:
            raise HTTPException(
                status_code=400,
                detail=f"scope_type must be one of {_VALID_SCOPE_TYPES}",
            )
        if provider is not None and provider not in _VALID_PROVIDERS:
            raise HTTPException(
                status_code=400,
                detail=f"provider must be one of {_VALID_PROVIDERS}",
            )
        _ensure_index()
        docs = _os_search(scope_type, provider)
        if not is_admin:
            self_user = (ident.get("user") or "").strip()
            self_email = (ident.get("email") or "").strip()
            allowed = {v for v in (self_user, self_email) if v}
            docs = [d for d in docs if d.get("scope_id") in allowed]
        items = [_safe_view(d) for d in docs]
        return {"ok": True, "items": items, "count": len(items)}


    @router.get("/{provider}/{scope_type}/{scope_id:path}")
    async def get_credential(
        provider: str,
