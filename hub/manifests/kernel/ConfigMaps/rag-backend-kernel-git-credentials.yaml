    @router.post("/{provider}/{scope_type}/{scope_id:path}/token")
    async def get_internal_token(
        provider: str,
        scope_type: str,
        scope_id: str,
    ) -> Dict[str, Any]:
        """内部 token 取得 (ClusterIP 経由の内部利用専用)。
        呼び出し元の識別ヘッダは要求しない (frontend 経由ではなく
        MCP / builder / mattermost などのクラスタ内 Pod が使う)。
        Phase 2 で内部認証キーの導入を検討。"""
        _validate_provider(provider)
        _validate_scope_type(scope_type)
        _validate_scope_id(scope_id)
        doc_id = _doc_id(scope_type, provider, scope_id)
        doc = _os_get(doc_id)
        if not doc:
            raise HTTPException(status_code=404, detail="not found")
        token = doc.get("token")
        if not token:
            raise HTTPException(
                status_code=404, detail="token is empty"
            )
        _os_touch_last_used(doc_id)
        return {
            "ok": True,
            "token": token,
            "api_base_url": doc.get("api_base_url") or "",
        }


