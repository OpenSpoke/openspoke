    def resolve_github_token_for_org(owner: str) -> Optional[str]:
        """組織スコープの GitHub PAT を保管庫から取得する。

        github_account.resolve_github_token() から呼ばれる想定。 存在しない
        場合は None を返す (呼び出し側で env フォールバック等を判断)。

        取得成功時は last_used_at を更新する (fire-and-forget)。

        Args:
            owner: GitHub 組織名 (canonical form、 例: "intelligentsoftware")

        Returns:
            PAT 文字列 (未登録なら None、 OpenSearch エラー時も None)
        """
        if not owner:
            return None
        try:
            doc_id = _doc_id("org", "github", owner)
            doc = _os_get(doc_id)
            if not doc:
                return None
            token = doc.get("token")
            if not token:
                return None
            _os_touch_last_used(doc_id)
            return token
        except Exception as _e:
            logger.warning(
                f"[GIT_CREDENTIALS] resolve_github_token_for_org error: {_e}"
            )
            return None


    def resolve_gitlab_token_for_org(host: str, owner: str) -> Optional[str]:
        """組織スコープの GitLab PAT を保管庫から取得する。

        gitlab_account.resolve_gitlab_token() から呼ばれる想定。 存在しない
        場合は None を返す (呼び出し側で env フォールバック等を判断)。

        取得成功時は last_used_at を更新する (fire-and-forget)。

        Args:
            host:  GitLab ホスト名 (例: "gitlab.com" / "gitlab.example.com")
            owner: GitLab 組織 (group) 名 (例: "intelligentsoftware")

        Returns:
            PAT 文字列 (未登録なら None、 OpenSearch エラー時も None)
        """
        if not host or not owner:
            return None
        try:
            scope_id = f"{host}:{owner}"
            doc_id = _doc_id("org", "gitlab", scope_id)
            doc = _os_get(doc_id)
            if not doc:
                return None
            token = doc.get("token")
            if not token:
                return None
            _os_touch_last_used(doc_id)
            return token
        except Exception as _e:
            logger.warning(
                f"[GIT_CREDENTIALS] resolve_gitlab_token_for_org error: {_e}"
            )
            return None


    def resolve_typesafe_token_for_org(scope_id: str = "typesafe") -> Optional[str]:
        """組織スコープの TypeSafe (Jev) API キーを保管庫から取得する。

        _fetch_typesafe_key_from_store から直接呼ばれる想定 (localhost:8000
        経由の HTTP fetch は spawn/pickup で Uvicorn worker が塞がって
        deadlock 気味になるため、 プロセス内 direct call を提供する)。 存在
        しない場合は None を返す (呼び出し側で env フォールバック等を判断)。

        取得成功時は last_used_at を更新する (fire-and-forget)。

        Args:
            scope_id: TypeSafe 組織 ID (canonical form、 default "typesafe")

        Returns:
            API キー文字列 (未登録なら None、 OpenSearch エラー時も None)
        """
        if not scope_id:
            return None
        try:
            doc_id = _doc_id("org", "typesafe", scope_id)
            doc = _os_get(doc_id)
            if not doc:
                return None
            token = doc.get("token")
            if not token:
                return None
            _os_touch_last_used(doc_id)
            return token
        except Exception as _e:
            logger.warning(
                f"[GIT_CREDENTIALS] resolve_typesafe_token_for_org error: {_e}"
            )
            return None


