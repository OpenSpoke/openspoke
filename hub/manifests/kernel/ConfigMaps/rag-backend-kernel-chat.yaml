    @router.post("/core/chat/threads")
    async def core_chat_create_thread(request: dict):
        """スレッド作成。 thread_id は呼び出し元が生成した UUID v4 を受け取る。"""
        thread_id = (request.get("thread_id") or "").strip()
        if not thread_id:
            thread_id = _gen_id()
        title = (request.get("title") or "新しい会話").strip()
        owner = (request.get("owner") or "").strip()
        model = (request.get("model") or "").strip()
        project_id = (request.get("project_id") or "").strip() or None

        if not owner:
            return {"ok": False, "error": "owner is required"}
        if not model:
            return {"ok": False, "error": "model is required"}

        _ensure_indexes()

        now = _now_iso()
        doc = {
            "id": thread_id,
            "owner": owner,
            "title": title,
            "model": model,
            "project_id": project_id,
            "status": "active",
            "created_at": now,
            "updated_at": now,
            "last_message_id": None,
            "last_message_at": None,
            "message_count": 0,
            "total_input_tokens": 0,
            "total_output_tokens": 0,
            "total_cost_usd": 0.0,
        }
        res = _os_post(
            f"/{CHAT_THREADS_INDEX}/_doc/{thread_id}?refresh=true", doc,
        )
        if not res.get("ok"):
            return {"ok": False, "error": res.get("error") or "create failed"}
        return {"ok": True, "thread_id": thread_id, "thread": doc}


