    # ----------------------------------------------------------------------
    # 共通 util: ISO 8601 UTC 時刻、 UUID 生成
    # ----------------------------------------------------------------------

    def _now_iso() -> str:
        return datetime.now(timezone.utc).isoformat(timespec="microseconds").replace(
            "+00:00", "Z",
        )

    def _gen_id() -> str:
        return str(uuid.uuid4())


    # ----------------------------------------------------------------------
    # OpenSearch (kernel 内の opensearch_app 経由) 操作 util
    # ----------------------------------------------------------------------
    # kernel 本体が opensearch namespace の OpenSearch にアクセスする HTTP ラッパ
    # (opensearch_app.py の _os_post など) を直接使えないので、 HTTP で kernel 内の
    # 既存エンドポイント (/core/opensearch/*) を叩いて実質同じ処理をする。
    # こうすることで本モジュールは opensearch 操作の実装詳細に依存しない。

    def _os_post(url: str, body: Dict[str, Any]) -> Dict[str, Any]:
        """kernel 内の /core/opensearch/raw-post を叩いて OpenSearch に POST。"""
        try:
            with httpx.Client(timeout=30.0) as cli:
                r = cli.post(
                    "http://127.0.0.1:8000/core/opensearch/raw-post",
                    json={"url_path": url, "body": body},
                )
                r.raise_for_status()
                return r.json()
        except Exception as e:
            logger.error(f"[CHAT] _os_post {url} failed: {e}", exc_info=True)
            return {"ok": False, "error": f"{type(e).__name__}: {e}"}


    def _os_get(url: str) -> Dict[str, Any]:
        """kernel 内の /core/opensearch/raw-get を叩いて OpenSearch に GET。"""
        try:
            with httpx.Client(timeout=30.0) as cli:
                r = cli.get(
                    "http://127.0.0.1:8000/core/opensearch/raw-get",
                    params={"url_path": url},
                )
                r.raise_for_status()
                return r.json()
        except Exception as e:
            logger.error(f"[CHAT] _os_get {url} failed: {e}", exc_info=True)
            return {"ok": False, "error": f"{type(e).__name__}: {e}"}


    def _os_delete(url: str) -> Dict[str, Any]:
        """kernel 内の /core/opensearch/raw-delete を叩いて OpenSearch に DELETE。"""
        try:
            with httpx.Client(timeout=30.0) as cli:
                r = cli.delete(
                    "http://127.0.0.1:8000/core/opensearch/raw-delete",
                    params={"url_path": url},
                )
                r.raise_for_status()
                return r.json()
        except Exception as e:
            logger.error(f"[CHAT] _os_delete {url} failed: {e}", exc_info=True)
            return {"ok": False, "error": f"{type(e).__name__}: {e}"}


    # ----------------------------------------------------------------------
    # インデックス初期化
    # ----------------------------------------------------------------------
    # chat_threads / chat_messages インデックスは app 起動時に _ensure_indexes
    # を呼んで idempotent に作成する。 既存であれば何もしない。

    def _ensure_indexes():
        """chat_threads / chat_messages インデックスが無ければ作る。"""
        _ensure_threads_index()
        _ensure_messages_index()


    def _ensure_threads_index():
        """chat_threads インデックスの mapping を保証。"""
        head = _os_get(f"/{CHAT_THREADS_INDEX}")
        if head.get("ok"):
            return  # 既存
        body = {
            "settings": {"number_of_shards": 1, "number_of_replicas": 0},
            "mappings": {
                "properties": {
                    "id": {"type": "keyword"},
                    "owner": {"type": "keyword"},
                    "title": {
                        "type": "text",
                        "analyzer": "kuromoji",
                        "fields": {"keyword": {"type": "keyword"}},
                    },
                    "model": {"type": "keyword"},
                    "project_id": {"type": "keyword"},
                    "status": {"type": "keyword"},  # active | archived | deleted
                    "created_at": {"type": "date"},
                    "updated_at": {"type": "date"},
                    "last_message_id": {"type": "keyword"},
                    "last_message_at": {"type": "date"},
                    "message_count": {"type": "integer"},
                    "total_input_tokens": {"type": "long"},
                    "total_output_tokens": {"type": "long"},
                    "total_cost_usd": {"type": "double"},
                },
            },
        }
        res = _os_post(f"/{CHAT_THREADS_INDEX}", body)
        if res.get("ok"):
            logger.info(f"[CHAT] created index {CHAT_THREADS_INDEX}")
        else:
            logger.warning(f"[CHAT] failed to create index {CHAT_THREADS_INDEX}: {res}")


    def _ensure_messages_index():
        """chat_messages インデックスの mapping を保証。"""
        head = _os_get(f"/{CHAT_MESSAGES_INDEX}")
        if head.get("ok"):
            return  # 既存
        body = {
            "settings": {"number_of_shards": 1, "number_of_replicas": 0},
            "mappings": {
                "properties": {
                    "id": {"type": "keyword"},
                    "thread_id": {"type": "keyword"},
                    "role": {"type": "keyword"},
                    "content": {
                        "type": "text",
                        "analyzer": "kuromoji",
                    },
                    "created_at": {"type": "date"},
                    "edited_at": {"type": "date"},
                    "deleted": {"type": "boolean"},
                    "parent_message_id": {"type": "keyword"},
                    "model": {"type": "keyword"},
                    "input_tokens": {"type": "integer"},
                    "output_tokens": {"type": "integer"},
                    "cache_write_tokens": {"type": "integer"},
                    "cache_read_tokens": {"type": "integer"},
                    "cost_usd": {"type": "double"},
                    "tool_calls": {"type": "object", "enabled": False},
                    "injected_topics": {"type": "object", "enabled": False},
                    "stop_reason": {"type": "keyword"},
                },
            },
        }
        res = _os_post(f"/{CHAT_MESSAGES_INDEX}", body)
        if res.get("ok"):
            logger.info(f"[CHAT] created index {CHAT_MESSAGES_INDEX}")
        else:
            logger.warning(f"[CHAT] failed to create index {CHAT_MESSAGES_INDEX}: {res}")


    # ----------------------------------------------------------------------
    # Jev KB 外部脳 (claude.ai の対話 Claude 用) 用の topic 検索と埋め込み
    # ----------------------------------------------------------------------

    def _get_neo4j_driver():
        """main.py が持つ neo4j_driver を遅延 import で取得。 なければ None。"""
        try:
            from main import neo4j_driver
            return neo4j_driver
        except Exception as e:
            logger.warning(f"[CHAT/SEARCH] neo4j_driver import failed: {e}")
            return None


    def _memgraph_list_recent_topics(limit: int) -> List[Dict[str, Any]]:
        """Memgraph から新しい順に topic を limit 件取得する。"""
        _neo4j_driver = _get_neo4j_driver()
        if _neo4j_driver is None:
            logger.warning("[CHAT/SEARCH] neo4j_driver is None (fallback to empty)")
            return []
        try:
            from main import neo4j_driver as _driver_check
            if _driver_check is None:
                return []
        except Exception as e:
            logger.warning(f"[CHAT/SEARCH] neo4j_driver import failed: {e}")
            return []
        if _neo4j_driver is None:
            logger.warning("[CHAT/SEARCH] neo4j_driver is None")
            return []
        cypher = (
            "MATCH (t:Topic) "
            "RETURN t.id AS id, t.title AS title, t.summary AS summary, "
            "t.content AS content, t.updated_at AS updated_at"
        )
        try:
            with _neo4j_driver.session() as session:
                result = session.run(cypher)
                rows = []
                for row in result:
                    rows.append({
                        "id": row.get("id"),
                        "title": row.get("title") or "",
                        "summary": row.get("summary") or "",
                        "content": row.get("content") or "",
                        "updated_at": str(row.get("updated_at") or ""),
                    })
                return rows
        except Exception as e:
            logger.error(f"[CHAT/SEARCH] cypher failed: {e}", exc_info=True)
            return []


    def _kb_filter_topics_for_query(
        topics: List[Dict[str, Any]], query: str,
    ) -> List[Dict[str, Any]]:
        """ユーザー質問文からキーワード抽出 → topic の title/summary/content でヒットするものだけ残す。

        ベクトル検索ではなく「含まれているか」のシンプルな部分一致でよい:
        - Jev は後段で選抜するので、 ここでは recall 重視で網を広く
        - 日本語の形態素解析まではしない (キーワード単語を想定)
        """
        if not query:
            return topics
        # かな・漢字・英数の連続を単語として取り出す (最低 2 文字以上)
        words = re.findall(r"[A-Za-z0-9ぁ-ヿ一-龯]{2,}", query)
        if not words:
            return topics
        matched = []
        for t in topics:
            hay = " ".join([
                t.get("id") or "",
                t.get("title") or "",
                t.get("summary") or "",
                t.get("content") or "",
            ])
            if any(w.lower() in hay.lower() for w in words):
                matched.append(t)
        return matched


    # ----------------------------------------------------------------------
    # /core/kb/prep_turn: Jev KB gate (claude.ai の対話 Claude 用 外部脳)
    # ----------------------------------------------------------------------
    # claude.ai の対話 Claude が turn 開始時にこの endpoint を叩き、
    # 「現 instruction に KB 参照が必要か」 「必要なら topic 候補はどれか」 を
    # Jev に判定させて、 候補 topic の本文を返す。
    # 対話 Claude 側はこの結果を見て、 必要なら引き続き system_lookup を叩く。

    @router.post("/core/kb/prep_turn")
    async def core_kb_prep_turn(request: dict):
        """Jev KB gate (needs_kb 判定 + topic 選抜 + 本文返却)。

        Body:
            {
              "instruction": "<ユーザー発話>",       # 必須
              "chosen_topics_max": 5                  # 任意 (default 5)
            }
        Returns:
            {
              "ok": bool,
              "needs_kb": bool,
              "chosen_topics": [{id, title, summary, content, updated_at}, ...],
              "jev_usage": {input_tokens, output_tokens},
              "error": str | null
            }
        """
        instruction = (request.get("instruction") or "").strip()
        if not instruction:
            return {"ok": False, "needs_kb": False, "chosen_topics": [],
                    "jev_usage": {}, "error": "instruction is required"}

        chosen_topics_max = int(request.get("chosen_topics_max") or 5)
        if chosen_topics_max < 1 or chosen_topics_max > 20:
            chosen_topics_max = 5

        # Step 1: Memgraph から全 topic を取る (title/summary だけで十分、
        #         content は後段で選抜後に取得)
        topics_all = _memgraph_list_recent_topics(limit=500)
        if not topics_all:
            return {"ok": True, "needs_kb": False, "chosen_topics": [],
                    "jev_usage": {}, "error": None}

        # Step 2: キーワード一致で topic を絞る (recall 重視)
        topics_filtered = _kb_filter_topics_for_query(topics_all, instruction)
        logger.info(
            f"[CHAT/KB_PREP] filtered {len(topics_filtered)}/{len(topics_all)} topics "
            f"for instruction len={len(instruction)}"
        )

        # Step 3: Jev に needs_kb と topic 選抜を同時に問う
        try:
            from main import call_jev
        except Exception as e:
            return {"ok": False, "needs_kb": False, "chosen_topics": [],
                    "jev_usage": {}, "error": f"call_jev import failed: {e}"}

        # Jev の state (context)
        topics_meta_for_jev = [
            {
                "id": t.get("id") or "",
                "title": t.get("title") or "",
                "summary": (t.get("summary") or "")[:300],
            }
            for t in topics_filtered[:50]  # Jev の context 節約で先頭 50 件まで
        ]
        state = {
            "instruction": instruction,
            "available_topics": topics_meta_for_jev,
        }
        questions = {
            "needs_kb": {
                "type": "boolean",
                "instructions": (
                    "この利用者発話に答えるのに、 社内の知識ベース (topic 集) を"
                    " 参照する必要があるか? 挨拶・雑談・一般常識で答えられるものは false。"
                    " 固有名詞 (システム名・プロジェクト名・人名)、 過去の経緯、"
                    " 専門的な技術仕様、 社内ルールが絡むものは true。"
                ),
            },
            "chosen_topic_ids": {
                "type": "choices",
                "criteria": {
                    (t.get("id") or ""): (t.get("title") or "") + " — "
                    + (t.get("summary") or "")[:150]
                    for t in topics_meta_for_jev
                },
                "instructions": (
                    f"needs_kb=true の場合、 回答に実際に役立つ topic を最大"
                    f" {chosen_topics_max} 個まで id で選べ。 推測で選ばず、"
                    " title/summary を見て関連がはっきりしているものだけ選ぶ。"
                    " needs_kb=false なら空リストでよい。"
                ),
            },
        }

        try:
            jev_result = call_jev(
                state=state, questions=questions, timeout=15,
            )
        except Exception as e:
            logger.error(f"[CHAT/KB_PREP] call_jev failed: {e}", exc_info=True)
            return {"ok": False, "needs_kb": False, "chosen_topics": [],
                    "jev_usage": {}, "error": f"call_jev failed: {type(e).__name__}: {e}"}

        answers = jev_result.get("answers") or {}
        needs_kb_answer = answers.get("needs_kb") or {}
        needs_kb = bool(needs_kb_answer.get("boolean", False))
        chosen_topic_ids_answer = answers.get("chosen_topic_ids") or {}
        chosen_ids = chosen_topic_ids_answer.get("choices") or []
        if not isinstance(chosen_ids, list):
            chosen_ids = []
        chosen_ids = [str(x) for x in chosen_ids[:chosen_topics_max]]

        jev_usage = jev_result.get("usage") or {}

        # Step 4: 選ばれた topic の本文を取る (title/summary だけでは足りないので full content)
        chosen_topics: List[Dict[str, Any]] = []
        if chosen_ids:
            # topics_filtered に本文は入っているはず
            id_to_topic = {(t.get("id") or ""): t for t in topics_filtered}
            for tid in chosen_ids:
                t = id_to_topic.get(tid)
                if t:
                    chosen_topics.append({
                        "id": t.get("id") or "",
                        "title": t.get("title") or "",
                        "summary": t.get("summary") or "",
                        "content": t.get("content") or "",
                        "updated_at": t.get("updated_at") or "",
                    })

        logger.info(
            f"[CHAT/KB_PREP] needs_kb={needs_kb} chosen={len(chosen_topics)} "
            f"ids={chosen_ids} jev_in={jev_usage.get('input_tokens')} "
            f"jev_out={jev_usage.get('output_tokens')}"
        )

        return {
            "ok": True,
            "needs_kb": needs_kb,
            "chosen_topics": chosen_topics,
            "jev_usage": {
                "input_tokens": jev_usage.get("input_tokens", 0),
                "output_tokens": jev_usage.get("output_tokens", 0),
            },
            "error": None,
        }


    # ----------------------------------------------------------------------
    # /core/kb/record_turn: 外部脳 (claude.ai の対話 Claude 用) 記録
    # ----------------------------------------------------------------------
    # 対話 Claude が turn 完了時にこの endpoint を叩き、 「このやりとりは記録に値するか」
    # を Jev に判定させて、 記録に値するなら Memgraph の知識ベースに topic として保存する。

    @router.post("/core/kb/record_turn")
    async def core_kb_record_turn(request: dict):
        """Jev gate (worth_recording 判定 + Memgraph への topic 保存)。

        Body:
            {
              "instruction": "<ユーザー発話>",      # 任意 (contextには推奨)
              "context":     "<対話コンテキスト>",  # 任意
              "result":      "<作業結果>",          # 必須
              "topic_id":    "proposal_topic_id",   # 必須 (英数+_、 ユニーク)
              "title":       "トピックタイトル",     # 必須
              "summary":     "1-2 文の要約",         # 必須
              "body":        "本文 (markdown)",      # 必須
              "worth_recording_threshold": 0.6       # 任意 (default 0.6)
            }
        Returns:
            {
              "ok": bool,
              "recorded": bool,
              "action": "created" | "updated" | null,
              "topic_id": str,
              "aki_report": str,     # 利用者 (Aki) に見せる 1 行報告
              "user_report": str,    # (互換) 同上
              "jev_verdict": {worth_recording_noul: float},
              "jev_info": {gate: {...}, upsert: {...}, errors: [...]},
              "error": str | null
            }
        """
        instruction = (request.get("instruction") or "").strip()
        context = (request.get("context") or "").strip()
        result = (request.get("result") or "").strip()
        topic_id = (request.get("topic_id") or "").strip()
        title = (request.get("title") or "").strip()
        summary = (request.get("summary") or "").strip()
        body = (request.get("body") or "").strip()
        threshold = float(request.get("worth_recording_threshold") or 0.6)

        # 入力検証
        errors: List[str] = []
        if not result:
            errors.append("result is required")
        if not topic_id:
            errors.append("topic_id is required")
        else:
            for c in topic_id:
                if not (c.isascii() and (c.isalnum() or c == "_")):
                    errors.append(f"topic_id contains invalid character ('{c}')")
                    break
        if not title:
            errors.append("title is required")
        if not summary:
            errors.append("summary is required")
        if not body:
            errors.append("body is required")

        if errors:
            return {"ok": False, "recorded": False, "action": None,
                    "topic_id": topic_id,
                    "aki_report": "", "user_report": "",
                    "jev_verdict": {}, "jev_info": {"errors": errors},
                    "error": "; ".join(errors)}

        # Step 1: Jev に worth_recording を判定させる
        try:
            from main import call_jev
        except Exception as e:
            return {"ok": False, "recorded": False, "action": None,
                    "topic_id": topic_id,
                    "aki_report": "", "user_report": "",
                    "jev_verdict": {}, "jev_info": {"errors": [str(e)]},
                    "error": f"call_jev import failed: {e}"}

        gate_state = {
            "instruction": instruction,
            "context": context,
            "result": result,
            "proposed_topic": {
                "topic_id": topic_id,
                "title": title,
                "summary": summary,
                "body_excerpt": body[:1000],
            },
        }
        gate_questions = {
            "worth_recording": {
                "type": "noul",
                "instructions": (
                    "この対話記録 (result と proposed_topic) は、 将来の対話で"
                    " 参照する価値があるか? 0.0 (全く無価値、 使い捨て) 〜"
                    " 1.0 (重要な設計判断・事実・運用知見で、 必ず残すべき) で評価。"
                    " 単なる挨拶・雑談は 0.1 前後、 日常的な単発タスクは 0.3-0.5、"
                    " 新しい知見・設計判断・システム変更の記録は 0.7-1.0。"
                ),
            },
        }

        try:
            gate_result = call_jev(
                state=gate_state, questions=gate_questions, timeout=15,
            )
        except Exception as e:
            logger.error(f"[CHAT/KB_RECORD] call_jev gate failed: {e}", exc_info=True)
            return {"ok": False, "recorded": False, "action": None,
                    "topic_id": topic_id,
                    "aki_report": "", "user_report": "",
                    "jev_verdict": {}, "jev_info": {"errors": [str(e)]},
                    "error": f"call_jev gate failed: {type(e).__name__}: {e}"}

        gate_answers = gate_result.get("answers") or {}
        worth_recording_answer = gate_answers.get("worth_recording") or {}
        worth_recording_noul = float(worth_recording_answer.get("noul", 0.0))

        jev_info: Dict[str, Any] = {
            "errors": [],
            "gate": {
                "model": gate_result.get("model") or "",
                "answers": gate_answers,
                "usage": gate_result.get("usage") or {},
            },
        }
        jev_verdict = {"worth_recording_noul": worth_recording_noul}

        # 閾値に満たなければ記録しない
        if worth_recording_noul < threshold:
            report = (
                f"知識ベース記録はスキップしました: Jev worth_recording={worth_recording_noul:.2f}"
                f" < 閾値 {threshold:.2f}。 topic 案 `{topic_id}` は雑談・一時的内容と判定。"
            )
            logger.info(
                f"[CHAT/KB_RECORD] skipped topic_id={topic_id} "
                f"noul={worth_recording_noul:.3f} threshold={threshold:.3f}"
            )
            return {"ok": True, "recorded": False, "action": None,
                    "topic_id": topic_id,
                    "aki_report": report, "user_report": report,
                    "jev_verdict": jev_verdict, "jev_info": jev_info,
                    "error": None}

        # Step 2: Memgraph に upsert (既存なら MERGE で属性更新)
        _neo4j_driver = _get_neo4j_driver()
        if _neo4j_driver is None:
            jev_info["errors"].append("neo4j_driver is None")
            return {"ok": False, "recorded": False, "action": None,
                    "topic_id": topic_id,
                    "aki_report": "", "user_report": "",
                    "jev_verdict": jev_verdict, "jev_info": jev_info,
                    "error": "neo4j_driver unavailable"}

        now_iso = _now_iso()
        action: Optional[str] = None
        try:
            with _neo4j_driver.session() as session:
                # 既存チェック
                existing = session.run(
                    "MATCH (t:Topic {id: $id}) RETURN t.updated_at AS updated_at",
                    id=topic_id,
                ).single()
                if existing:
                    action = "updated"
                else:
                    action = "created"

                # upsert
                session.run(
                    "MERGE (t:Topic {id: $id}) "
                    "SET t.title = $title, t.summary = $summary, "
                    "    t.content = $body, t.updated_at = $now",
                    id=topic_id, title=title, summary=summary,
                    body=body, now=now_iso,
                )

                # 新規作成なら created_at も設定
                if action == "created":
                    session.run(
                        "MATCH (t:Topic {id: $id}) "
                        "SET t.created_at = $now",
                        id=topic_id, now=now_iso,
                    )
        except Exception as e:
            logger.error(
                f"[CHAT/KB_RECORD] memgraph upsert failed: {e}", exc_info=True,
            )
            jev_info["errors"].append(f"memgraph upsert failed: {e}")
            return {"ok": False, "recorded": False, "action": None,
                    "topic_id": topic_id,
                    "aki_report": "", "user_report": "",
                    "jev_verdict": jev_verdict, "jev_info": jev_info,
                    "error": f"memgraph upsert failed: {type(e).__name__}: {e}"}

        jev_info["upsert"] = {"action": action, "updated_at": now_iso}

        action_verb = "新規記録" if action == "created" else "更新"
        report = (
            f"知識ベースに{action_verb}: `{topic_id}` — {summary}"
        )
        logger.info(
            f"[CHAT/KB_RECORD] {action} topic_id={topic_id} "
            f"noul={worth_recording_noul:.3f} jev_in={gate_result.get('usage', {}).get('input_tokens')}"
        )

        return {
            "ok": True,
            "recorded": True,
            "action": action,
            "topic_id": topic_id,
            "aki_report": report,
            "user_report": report,  # 互換のため両方
            "jev_verdict": jev_verdict,
            "jev_info": jev_info,
            "error": None,
        }


    # ----------------------------------------------------------------------
    # Message bulk operation (OpenSearch _bulk)
    # ----------------------------------------------------------------------

    def _bulk_index_messages(docs: List[Dict[str, Any]]):
        """複数メッセージを 1 回の _bulk で保存。 docs は id 必須。"""
        if not docs:
            return {"ok": True, "took": 0, "errors": False}
        lines = []
        for d in docs:
            if not d.get("id"):
                continue
            lines.append(json.dumps(
                {"index": {"_index": CHAT_MESSAGES_INDEX, "_id": d["id"]}},
                ensure_ascii=False,
            ))
            lines.append(json.dumps(d, ensure_ascii=False, default=str))
        if not lines:
            return {"ok": True, "took": 0, "errors": False}
        body = "\n".join(lines) + "\n"
        # _bulk は Content-Type: application/x-ndjson が必要
        try:
            with httpx.Client(timeout=60.0) as cli:
                r = cli.post(
                    "http://127.0.0.1:8000/core/opensearch/raw-bulk",
                    json={"body": body},
                )
                r.raise_for_status()
                return r.json()
        except Exception as e:
            logger.error(f"[CHAT] _bulk_index_messages failed: {e}", exc_info=True)
            return {"ok": False, "errors": True, "error": f"{type(e).__name__}: {e}"}


    # ----------------------------------------------------------------------
    # Jev + gemma2 (Chat mode 用) 整形 + キャッシュ制御
    # ----------------------------------------------------------------------

    def _messages_with_cache_control(msgs: List[dict]) -> List[dict]:
        """messages 配列の最後の user/assistant メッセージに cache_control を追加。

        Anthropic の prompt caching は、 cache_control を付けた位置までを含めて
        キャッシュ対象になる。 典型的には:
          - system prompt (別途付与済み)
          - 最初の user メッセージ (または早期の長い入力)
          - 直前の tool_result
        あたりに付けると効率が良い。 ここでは単純に 「最後のメッセージ」 に付ける。

        注意: content が list (block 配列) の場合は、 最後の block に ephemeral を付ける。
        content が str の場合は、 そのメッセージ全体 (content=[{type: text, text, cache_control}])
        として展開する。
        """
        if not msgs:
            return msgs
        new_msgs = list(msgs)
        last = dict(new_msgs[-1])
        content = last.get("content")
        if isinstance(content, str):
            last["content"] = [
                {
                    "type": "text",
                    "text": content,
                    "cache_control": {"type": "ephemeral"},
                },
            ]
        elif isinstance(content, list) and content:
            # 最後の block に cache_control
            new_content = []
            for i, block in enumerate(content):
                if i == len(content) - 1 and isinstance(block, dict):
                    nb = dict(block)
                    nb["cache_control"] = {"type": "ephemeral"}
                    new_content.append(nb)
                else:
                    new_content.append(block)
            last["content"] = new_content
        new_msgs[-1] = last
        return new_msgs


