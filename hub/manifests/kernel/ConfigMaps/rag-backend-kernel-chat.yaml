                        "description": "topic 内で何を探すか (日本語 / 英語)",
                    },
                    "top_k": {
                        "type": "integer",
                        "description": "返すチャンク数 (default 5、 max 20)",
                        "default": 5,
                    },
                },
                "required": ["topic_id", "query"],
            },
        },
        {
