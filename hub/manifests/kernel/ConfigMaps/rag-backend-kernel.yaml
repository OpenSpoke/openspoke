    # ----------------------------------------------------------------------
    # 知識ベース (knowledge base) — 汎用ナレッジ転送機構
    # ----------------------------------------------------------------------
    # アプリ (the assistant system等) と外部 LLM (Claude 等) が共有する
    # 整理済みの知識・設計・原則を Milvus に永続化する汎用機構。
    #
    # collection 名は user_id (テナント識別子) から自動展開:
    #     "user_example_com" → "secretary_knowledge_user_example_com"
    # collection が存在しなければ schema 付きで自動作成する。
    #
    # MCP server の upsert_knowledge / delete_knowledge tool と同等のロジックを
    # kernel HTTP API として提供することで、 内部アプリ (the assistantバックエンド等) も
    # 同じ知識ベースに直接アクセスできるようにする。 MCP server は外部 LLM 専用、
    # kernel は内部アプリの汎用基盤、 という役割分担。

    KNOWLEDGE_COLLECTION_PREFIX = "secretary_knowledge_"
    KNOWLEDGE_EMBEDDING_DIM = 384
    # ベクトルフィールド名は既存 secretary_conv_* / vector_search の規約に合わせて "vector"
    # (kernel /core/vectorstore/search の anns_field default と一致)
    KNOWLEDGE_SCHEMA = {
        "fields": [
            {"name": "id",         "dtype": "VARCHAR", "is_primary": True,
             "max_length": 128,    "description": "知識エントリの一意識別子 (手動指定)"},
            {"name": "vector",     "dtype": "FLOAT_VECTOR", "dim": KNOWLEDGE_EMBEDDING_DIM,
             "description": "title + content から生成した埋め込みベクトル"},
            {"name": "title",      "dtype": "VARCHAR", "max_length": 512,
             "description": "知識エントリのタイトル (1 行)"},
            {"name": "content",    "dtype": "VARCHAR", "max_length": 65535,
             "description": "本文 (推奨 500-2000 字、 主題エントリ)"},
            {"name": "category",   "dtype": "VARCHAR", "max_length": 64,
             "description": "粒度カテゴリ (topic / principle / troubleshooting / future_plan 等)"},
            {"name": "created_at", "dtype": "VARCHAR", "max_length": 32,
             "description": "ISO8601 (UTC)"},
            {"name": "updated_at", "dtype": "VARCHAR", "max_length": 32,
             "description": "ISO8601 (UTC)"},
        ],
        "description": "Knowledge transfer collection (shared between apps and external LLMs)",
    }
    KNOWLEDGE_INDEX_PARAMS = {
        "index_type": "IVF_FLAT",
        "metric_type": "COSINE",
        "params": {"nlist": 128},
    }


    def _knowledge_validate_id(entry_id: str) -> str:
        """知識エントリ ID の形式を検証する。 エラー文字列を返す (空なら OK)。"""
        if not entry_id:
            return "id is required"
        if len(entry_id) > 128:
            return f"id too long (max 128, actual {len(entry_id)})"
        for c in entry_id:
            if not (c.isascii() and (c.isalnum() or c == "_")):
                return f"id contains invalid character ('{c}'). Only ASCII alnum and underscore allowed"
        return ""


    def _knowledge_validate_user_id(user_id: str) -> str:
        """user_id の形式を検証する。 エラー文字列を返す (空なら OK)。"""
        if not user_id:
            return "user_id is required"
        if len(user_id) > 256:
            return f"user_id too long (max 256, actual {len(user_id)})"
        for c in user_id:
            if not (c.isascii() and (c.isalnum() or c in "_.-")):
                return f"user_id contains invalid character ('{c}')"
        return ""


    def _knowledge_resolve_collection(user_id: str) -> str:
        """user_id から実際の Milvus collection 名を組み立てる。

        Milvus collection 名は識別子として英数とアンダースコアのみを許容するため、
        user_id に含まれる英数以外の文字 (ハイフン、 ピリオド等) は `_` に置換する。
        これはthe assistantバックエンドの get_secretary_collection_name と同じ正規化規則。

        例:
            "00000000-0000-0000-0000-000000000000"
                → "secretary_knowledge_00000000_0000_0000_0000_000000000000"
            "user@example.com"
                → "secretary_knowledge_user_example_com"

        既に prefix 付きの場合 (例: "secretary_knowledge_xxx") はそのまま返す。
        """
        ns = (user_id or "").strip()
        if not ns:
            return ""
        if ns.startswith(KNOWLEDGE_COLLECTION_PREFIX):
            return ns
        # 英数以外を _ に置換
        safe = "".join(c if c.isalnum() else "_" for c in ns)
        return KNOWLEDGE_COLLECTION_PREFIX + safe


    def _knowledge_ensure_collection(collection_name: str) -> str:
        """collection が存在しなければ schema 付きで作成する。 エラー文字列を返す (空なら OK)。"""
        try:
            if utility.has_collection(collection_name):
                return ""
            fields = [_vs_build_field_schema(f) for f in KNOWLEDGE_SCHEMA["fields"]]
            schema = CollectionSchema(fields, description=KNOWLEDGE_SCHEMA.get("description", ""))
            collection = Collection(name=collection_name, schema=schema)
            collection.create_index(
                field_name="vector",
                index_params=KNOWLEDGE_INDEX_PARAMS,
            )
            logger.info(f"[KNOWLEDGE] collection created: {collection_name}")
            return ""
        except Exception as e:
            logger.error(f"[KNOWLEDGE] ensure_collection error: {collection_name}: {e}", exc_info=True)
            return f"{type(e).__name__}: {str(e)[:200]}"


    @app.post("/core/knowledge/upsert")
    async def core_knowledge_upsert(request: dict):
        """知識ベースに 1 エントリを保存する (新規・更新両対応の冪等操作)。

        collection 名は user_id から自動展開:
            "user_example_com" → "secretary_knowledge_user_example_com"
        collection が存在しなければ schema 付きで自動作成する。

        kernel `/core/vectorstore/upsert` は内部で collection.insert() を呼ぶ
        単純 insert (同 id で重複行が増える) なので、 ここでは「delete (existing id)
        → insert」の 2 段階で冪等性を担保する。

        Body:
            {
              "user_id":  "user_example_com",              必須
              "id":       "knowledge_transfer_design",      必須 (半角英数+アンダースコア、 128字以内)
              "title":    "...",                           必須 (512字以内)
              "content":  "...",                           必須 (65535字以内)
              "category": "topic",                          省略可 (default "topic")
              "mode":     "create" | "update" | "upsert"    省略可 (default "upsert")
            }
        Returns:
            {
              "ok": bool,
              "action": "created" | "updated",   # ok=True 時のみ
              "collection": "...",
              "id": "...",
              "title": "...",
              "category": "...",
              "created_at": "...",
              "updated_at": "...",
              "error": str | null
            }
        """
        user_id = request.get("user_id") or ""
        entry_id = request.get("id") or ""
        title = request.get("title") or ""
        content = request.get("content") or ""
        category = request.get("category") or "topic"
        mode = request.get("mode") or "upsert"

        # 1. 入力検証
        err = _knowledge_validate_user_id(user_id)
        if err:
            return {"ok": False, "error": err}
        err = _knowledge_validate_id(entry_id)
        if err:
            return {"ok": False, "error": err}
        if not title:
            return {"ok": False, "error": "title is required"}
        if not content:
            return {"ok": False, "error": "content is required"}
        if len(title) > 512:
            return {"ok": False, "error": f"title too long (max 512, actual {len(title)})"}
        if len(content) > 65535:
            return {"ok": False, "error": f"content too long (max 65535, actual {len(content)})"}
        if len(category) > 64:
            return {"ok": False, "error": f"category too long (max 64, actual {len(category)})"}
        if mode not in ("create", "update", "upsert"):
            return {"ok": False, "error": f"mode must be 'create' / 'update' / 'upsert' (actual: '{mode}')"}

        collection_name = _knowledge_resolve_collection(user_id)

        try:
            # 2. collection 確保
            err = _knowledge_ensure_collection(collection_name)
            if err:
                return {"ok": False, "error": f"ensure_collection failed: {err}"}

            collection = Collection(collection_name)
            collection.load()

            # 3. 既存 id 確認 (mode 衝突制御 + created_at 保持のため)
            existing_results = collection.query(
                expr=f'id == "{entry_id}"',
                output_fields=["id", "title", "created_at"],
                limit=1,
            )
            is_update = bool(existing_results)

            if mode == "create" and is_update:
                ex_title = existing_results[0].get("title", "")
                return {
                    "ok": False,
                    "error": (
                        f"id='{entry_id}' already exists (mode='create' is for new entries). "
                        f"Existing title: {ex_title}. "
                        f"Use mode='update' or 'upsert' to overwrite, or choose a different id."
                    ),
                }
            if mode == "update" and not is_update:
                return {
                    "ok": False,
                    "error": (
                        f"id='{entry_id}' does not exist (mode='update' is for existing entries). "
                        f"Use mode='create' for new entries."
                    ),
                }

            # 4. embedding 生成
            emb_text = f"{title}\n\n{content}"
            vector = get_embedding(emb_text)
            if not vector or len(vector) != KNOWLEDGE_EMBEDDING_DIM:
                return {"ok": False, "error": f"embedding generation failed (got {len(vector) if vector else 0} dims, expected {KNOWLEDGE_EMBEDDING_DIM})"}

            # 5. 時刻
            from datetime import datetime, timezone
            now_iso = datetime.now(timezone.utc).isoformat(timespec="seconds")
            created_at = now_iso

            # 6. 既存削除 (created_at は引き継ぐ)
            if is_update:
                ex_created = existing_results[0].get("created_at")
                if ex_created:
                    created_at = ex_created
                collection.delete(expr=f'id == "{entry_id}"')
                collection.flush()

            # 7. insert
            row = {
                "id": entry_id,
                "vector": vector,
                "title": title,
                "content": content,
                "category": category,
                "created_at": created_at,
                "updated_at": now_iso,
            }
            # 行指向 → 列指向 (vectorstore/upsert と同じ流儀)
            field_names = [f["name"] for f in KNOWLEDGE_SCHEMA["fields"]]
            columns = [[row[fname]] for fname in field_names]
            collection.insert(columns)
            collection.flush()
            collection.load()

            action = "updated" if is_update else "created"
            logger.info(f"[KNOWLEDGE] {action}: collection={collection_name} id={entry_id}")
            return {
                "ok": True,
                "action": action,
                "collection": collection_name,
                "id": entry_id,
                "title": title,
                "category": category,
                "created_at": created_at,
                "updated_at": now_iso,
                "error": None,
            }
        except Exception as e:
            logger.error(f"[KNOWLEDGE] upsert error: collection={collection_name} id={entry_id}: {e}", exc_info=True)
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/knowledge/delete")
    async def core_knowledge_delete(request: dict):
        """指定 id の知識エントリを削除する。 collection が無い、 もしくは id が無い
        場合も冪等成功で返す (削除対象なし)。

        Body:
            {"user_id": "...", "id": "..."}
        Returns:
            {
              "ok": bool,
              "deleted": bool,        # 実際に削除したか (なかった場合 false)
              "collection": "...",
              "id": "...",
              "title": "...",         # deleted=true のみ (削除前の title)
              "error": str | null
            }
        """
        user_id = request.get("user_id") or ""
        entry_id = request.get("id") or ""

        err = _knowledge_validate_user_id(user_id)
        if err:
            return {"ok": False, "deleted": False, "error": err}
        err = _knowledge_validate_id(entry_id)
        if err:
            return {"ok": False, "deleted": False, "error": err}

        collection_name = _knowledge_resolve_collection(user_id)

        try:
            if not utility.has_collection(collection_name):
                return {
                    "ok": True,
                    "deleted": False,
                    "collection": collection_name,
                    "id": entry_id,
                    "error": None,
                }

            collection = Collection(collection_name)
            collection.load()
            existing_results = collection.query(
                expr=f'id == "{entry_id}"',
                output_fields=["id", "title"],
                limit=1,
            )
            if not existing_results:
                return {
                    "ok": True,
                    "deleted": False,
                    "collection": collection_name,
                    "id": entry_id,
                    "error": None,
                }
            ex_title = existing_results[0].get("title", "")
            collection.delete(expr=f'id == "{entry_id}"')
            collection.flush()
            logger.info(f"[KNOWLEDGE] deleted: collection={collection_name} id={entry_id}")
            return {
                "ok": True,
                "deleted": True,
                "collection": collection_name,
                "id": entry_id,
                "title": ex_title,
                "error": None,
            }
        except Exception as e:
            logger.error(f"[KNOWLEDGE] delete error: collection={collection_name} id={entry_id}: {e}", exc_info=True)
            return {"ok": False, "deleted": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    # ----------------------------------------------------------------------
    # グラフ DB (Memgraph/Neo4j 互換) の汎用 Cypher プロキシ
    # ----------------------------------------------------------------------
    # 「グラフでデータを保存・検索したい」という抽象機能を kernel が提供する。
    # 実装は現在 Memgraph (neo4j ドライバ経由) だが、呼び出し元アプリは
    # 「Cypher を実行して records (dict のリスト) を受け取る」というレベルでしか触らない。
    # neo4j Node/Relationship オブジェクトは properties の dict に変換して返す。

    def _vs_neo4j_value_to_jsonable(value):
        """neo4j の値 (Node, Relationship, Path, primitive 等) を JSON シリアライズ可能な値に変換する。"""
        # primitive はそのまま
        if value is None or isinstance(value, (bool, int, float, str)):
            return value
        # list, tuple は要素ごとに変換
        if isinstance(value, (list, tuple)):
            return [_vs_neo4j_value_to_jsonable(v) for v in value]
        # dict は値ごとに変換
        if isinstance(value, dict):
            return {k: _vs_neo4j_value_to_jsonable(v) for k, v in value.items()}
        # neo4j Node / Relationship は properties + ラベル/タイプを dict 化
        try:
            # Node: labels と properties を持つ
            from neo4j.graph import Node, Relationship, Path
            if isinstance(value, Node):
                return {
                    "_type": "Node",
                    "_labels": list(value.labels),
                    "_id": value.element_id,
                    **{k: _vs_neo4j_value_to_jsonable(v) for k, v in dict(value).items()},
                }
            if isinstance(value, Relationship):
                return {
                    "_type": "Relationship",
                    "_rel_type": value.type,
                    "_id": value.element_id,
                    **{k: _vs_neo4j_value_to_jsonable(v) for k, v in dict(value).items()},
                }
            if isinstance(value, Path):
                return {
                    "_type": "Path",
                    "nodes": [_vs_neo4j_value_to_jsonable(n) for n in value.nodes],
                    "relationships": [_vs_neo4j_value_to_jsonable(r) for r in value.relationships],
                }
        except ImportError:
            pass
        # 最後の手段: str 化
        return str(value)


    @app.post("/core/graph/run")
    async def core_graph_run(request: dict):
        """Cypher を実行し、records (dict のリスト) を返す。

        Body:
            {
              "cypher": "MATCH (c:Contract {doc_id: $doc_id}) RETURN c",
              "params": {"doc_id": "..."}    # 任意
            }
        Returns:
            {
              "ok": bool,
              "records": [{key: value, ...}, ...],
              "error": str | null
            }
        Node/Relationship/Path オブジェクトは {_type, _labels, ...properties} の dict に変換される。
        書き込み専用クエリ (RETURN なし) でも records は空リストで ok=true を返す。
        """
        cypher = request.get("cypher") or ""
        params = request.get("params") or {}
        if not cypher:
            return {"ok": False, "records": [], "error": "cypher is required"}
        if not NEO4J_AVAILABLE or neo4j_driver is None:
            return {"ok": False, "records": [], "error": "graph database not connected"}
        if not isinstance(params, dict):
            return {"ok": False, "records": [], "error": "params must be a dict"}

        try:
            with neo4j_driver.session() as session:
                result = session.run(cypher, **params)
                records = []
                for record in result:
                    records.append({
                        k: _vs_neo4j_value_to_jsonable(v)
                        for k, v in record.items()
                    })
            logger.info(f"[GRAPH] run OK: {len(records)} records (cypher_prefix={cypher[:60].strip()})")
            return {"ok": True, "records": records, "error": None}
        except Exception as e:
            logger.error(f"[GRAPH] run error: {e} (cypher_prefix={cypher[:80].strip()})", exc_info=True)
            return {"ok": False, "records": [], "error": f"{type(e).__name__}: {str(e)[:300]}"}


    # ----------------------------------------------------------------------
    # Reranker (Cross-Encoder スコアリング)
    # ----------------------------------------------------------------------
    # 「クエリと候補テキスト群の類似度を Cross-Encoder で再評価して、上位 N 件を返す」
    # という抽象機能。実装は BAAI/bge-reranker-base (sentence-transformers)。
    # 呼び出し元アプリは候補 dict のリストを渡し、reranking 済み dict のリストを受け取る。

    @app.post("/core/reranker/score")
    async def core_reranker_score(request: dict):
        """候補テキスト群を Cross-Encoder で再評価し、上位 final_count 件を返す。

        Body:
            {
              "question": "...",
              "candidates": [{"text": "...", ...other_fields}, ...],
              "final_count": 10
            }
        Returns:
            {
              "ok": bool,
              "results": [{"text": "...", ..., "rerank_score": float}, ...],
              "debug_info": {"reranked": bool, "method": "...", "candidates_count": int, "selected_count": int, "rerank_time_sec": float},
              "error": str | null
            }
        候補数が final_count 以下の場合は reranking せずにそのまま返す。
        失敗時も例外は投げず、ok=true で reranking 失敗フラグ付きで返す (旧関数の挙動と互換)。
        """
        question = request.get("question") or ""
        candidates = request.get("candidates") or []
        final_count = int(request.get("final_count", 10))

        if not question:
            return {"ok": False, "results": [], "debug_info": {}, "error": "question is required"}
        if not isinstance(candidates, list):
            return {"ok": False, "results": [], "debug_info": {}, "error": "candidates must be a list"}

        # 候補が少ない場合は reranking しない (旧関数と同じ挙動)
        if len(candidates) <= final_count:
            return {
                "ok": True,
                "results": candidates,
                "debug_info": {"reranked": False, "reason": "candidates_too_few"},
                "error": None,
            }

        try:
            model = get_reranker()
            # クエリと候補のペアを作成 (テキストは500文字に制限)
            pairs = [[question, (c.get("text") or "")[:500]] for c in candidates]

            start = time.time()
            scores = model.predict(pairs)
            elapsed = time.time() - start
            logger.info(f"[RERANKER] Scored {len(candidates)} candidates in {elapsed:.2f}s")

            # スコアでソートして上位 final_count 件を選ぶ
            import numpy as np
            ranked_indices = np.argsort(scores)[::-1][:final_count]
            reranked = []
            for idx in ranked_indices:
                cand = dict(candidates[idx])  # コピー
                cand["rerank_score"] = float(scores[idx])
                reranked.append(cand)

            debug_info = {
                "reranked": True,
                "method": "cross_encoder",
                "candidates_count": len(candidates),
                "selected_count": len(reranked),
                "rerank_time_sec": round(elapsed, 2),
            }
            logger.info(f"[RERANKER] Selected top {len(reranked)} from {len(candidates)} candidates")
            return {"ok": True, "results": reranked, "debug_info": debug_info, "error": None}
        except Exception as e:
            logger.error(f"[RERANKER] Error: {e}", exc_info=True)
            return {
                "ok": True,
                "results": candidates[:final_count],
                "debug_info": {"reranked": False, "reason": str(e)[:200]},
                "error": None,
            }


    # ========================================================================
    # KV Store (Valkey/Redis) - 汎用 Key-Value ストア
    # ========================================================================
    # アプリケーション中立な KV ストアの薄い HTTP ラッパー。
    # 呼び出し側 (the assistant system等) が key 名前空間 / db番号 / TTL ポリシーを
    # 全て決める。kernel は Valkey への中継のみで、業務ロジックは持たない。
    #
    # 接続先 Valkey は環境変数 KV_VALKEY_HOST / KV_VALKEY_PORT で指定 (省略時は
    # cluster 内の valkey.valkey.svc.cluster.local:6379)。db番号は各リクエストで指定。
    # 接続インスタンスは (host, port, db) 単位で内部キャッシュする。

    KV_VALKEY_HOST = os.environ.get("KV_VALKEY_HOST", "valkey.valkey.svc.cluster.local")
    KV_VALKEY_PORT = int(os.environ.get("KV_VALKEY_PORT", "6379"))
    _kv_clients = {}  # (host, port, db) -> redis.Redis

    def _kv_get_client(db: int):
        """指定 db に接続済みの Valkey クライアントを返す (キャッシュあり)。"""
        try:
            import redis as _redis_mod
        except ImportError:
            raise RuntimeError("redis-py is not installed in kernel image")
        key = (KV_VALKEY_HOST, KV_VALKEY_PORT, int(db))
        client = _kv_clients.get(key)
        if client is None:
            client = _redis_mod.Redis(
                host=KV_VALKEY_HOST,
                port=KV_VALKEY_PORT,
                db=int(db),
                decode_responses=True,
                socket_connect_timeout=3,
                socket_timeout=5,
            )
            _kv_clients[key] = client
        return client


    @app.post("/core/kv/get")
    async def core_kv_get(request: dict):
        """KV ストアから1キーの値を取得する。

        Body:
            {"key": "...", "db": 0}      # db 省略時は 0
        Returns:
            {"ok": bool, "value": str | null, "error": str | null}
        キーが存在しない場合は ok=true, value=null。
        """
        key = request.get("key") or ""
        db = int(request.get("db", 0))
        if not key:
            return {"ok": False, "value": None, "error": "key is required"}
        try:
            client = _kv_get_client(db)
            value = client.get(key)
            return {"ok": True, "value": value, "error": None}
        except Exception as e:
            logger.warning(f"[KV] get failed: db={db} key={key[:60]}: {e}")
            return {"ok": False, "value": None, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/kv/set")
    async def core_kv_set(request: dict):
        """KV ストアに1キーの値を保存する。TTL秒を指定可能。

        Body:
            {
              "key": "...",     # 必須
              "value": "...",   # 必須 (文字列)
              "db": 0,          # 省略時は 0
              "ttl": 0          # 省略時は 0 (TTLなし、永続)
            }
        Returns:
            {"ok": bool, "error": str | null}
        """
        key = request.get("key") or ""
        if not key:
            return {"ok": False, "error": "key is required"}
        if "value" not in request:
            return {"ok": False, "error": "value is required"}
        value = request.get("value")
        if not isinstance(value, str):
            value = json.dumps(value, ensure_ascii=False)
        db = int(request.get("db", 0))
        ttl = int(request.get("ttl", 0) or 0)
        try:
            client = _kv_get_client(db)
            if ttl > 0:
                client.set(key, value, ex=ttl)
            else:
                client.set(key, value)
            return {"ok": True, "error": None}
        except Exception as e:
            logger.warning(f"[KV] set failed: db={db} key={key[:60]}: {e}")
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/kv/delete")
    async def core_kv_delete(request: dict):
        """KV ストアから1キーを削除する。

        Body:
            {"key": "...", "db": 0}
        Returns:
            {"ok": bool, "deleted": bool, "error": str | null}
        deleted は実際に削除された場合 true (キーが存在しなかった場合 false)。
