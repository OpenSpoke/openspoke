    @app.post("/core/kv/keys")
    async def core_kv_keys(request: dict):
        """パターンに一致するキー一覧を返す (デバッグ・管理用、本番運用では注意)。

        SCAN でイテレートするため Valkey のブロッキングは最小化される。
        ただし大量の keys が返る可能性があるので、呼び出し側でパターンを絞ること。

        Body:
            {"pattern": "secretary:*", "db": 0, "limit": 1000}
        Returns:
            {"ok": bool, "keys": ["..."], "truncated": bool, "error": str | null}
        truncated は limit 件で打ち切ったかどうか。
        """
        pattern = request.get("pattern") or "*"
        db = int(request.get("db", 0))
        limit = int(request.get("limit", 1000))
        try:
            client = _kv_get_client(db)
            keys = []
            truncated = False
            for k in client.scan_iter(match=pattern, count=200):
                keys.append(k)
                if len(keys) >= limit:
                    truncated = True
                    break
            return {"ok": True, "keys": keys, "truncated": truncated, "error": None}
        except Exception as e:
            logger.warning(f"[KV] keys failed: db={db} pattern={pattern[:60]}: {e}")
            return {"ok": False, "keys": [], "truncated": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/kv/incr")
    async def core_kv_incr(request: dict):
        """整数値のカウンタをアトミックに増加させる。レート制限・ロック等で有用。

        キーが存在しない場合は 0 から始めて amount だけ加算する。
        値が整数として解釈できない場合はエラー。

        Body:
            {"key": "...", "db": 0, "amount": 1}
        Returns:
            {"ok": bool, "value": int, "error": str | null}
        """
        key = request.get("key") or ""
        db = int(request.get("db", 0))
        amount = int(request.get("amount", 1))
        if not key:
            return {"ok": False, "value": 0, "error": "key is required"}
        try:
            client = _kv_get_client(db)
            new_val = client.incrby(key, amount)
            return {"ok": True, "value": int(new_val), "error": None}
        except Exception as e:
            logger.warning(f"[KV] incr failed: db={db} key={key[:60]}: {e}")
            return {"ok": False, "value": 0, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/kv/expire")
    async def core_kv_expire(request: dict):
        """既存キーに TTL秒を設定する (またはキーから TTL を取り除く)。

        Body:
            {"key": "...", "db": 0, "ttl": 60}    # ttl=0 で TTL 解除 (PERSIST 相当)
        Returns:
            {"ok": bool, "applied": bool, "error": str | null}
        applied はキーが存在して TTL/PERSIST が反映されたかどうか。
        """
        key = request.get("key") or ""
        db = int(request.get("db", 0))
        ttl = int(request.get("ttl", 0) or 0)
        if not key:
            return {"ok": False, "applied": False, "error": "key is required"}
        try:
            client = _kv_get_client(db)
            if ttl > 0:
                applied = bool(client.expire(key, ttl))
            else:
                applied = bool(client.persist(key))
            return {"ok": True, "applied": applied, "error": None}
        except Exception as e:
            logger.warning(f"[KV] expire failed: db={db} key={key[:60]}: {e}")
            return {"ok": False, "applied": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/debug/sleep")
    def core_debug_sleep(request: dict):
        """並行性ベンチマーク用の sleep エンドポイント。

        FastAPI のセマンティクス:
          - async def ハンドラ内で time.sleep() を呼ぶと event loop を握り、
            同 Pod の他リクエストは全部直列化される (uvicorn workers=1 の場合特に顕著)。
          - 普通の def (sync) で宣言すると FastAPI が自動的に threadpool で実行するので
            並列リクエストが捌ける。
        このエンドポイントは「重い同期処理」 を擬似するのが目的なので def にする。

        Body:
            {
              "seconds": 3.0,           # sleep 秒数 (0 〜 60 にクランプ)
              "mode": "blocking",       # "blocking" | "async"
                                        #   blocking: time.sleep() (FastAPI threadpool で並列実行)
                                        #   async   : asyncio.run で await asyncio.sleep
                                        #             (新規 event loop で動かすので参考値)
              "label": "..."            # 任意ラベル (ログ用)
            }
        Returns:
            {
              "slept": 3.0,
              "mode": "blocking",
              "label": "...",
              "started_at": "ISO8601",
              "ended_at":   "ISO8601",
              "wall_seconds": 3.001,
              "thread_id": 140123...,
              "task_id":   ""
            }

        本番有効。 ingress には公開せず cluster-internal Service 経由のみで叩く想定。
        """
        from datetime import datetime, timezone
        seconds = float(request.get("seconds", 1.0) or 0.0)
        mode = (request.get("mode") or "blocking").strip().lower()
        label = str(request.get("label") or "")
        # 安全装置: 0 〜 60 秒にクランプ
        if seconds < 0:
            seconds = 0.0
        if seconds > 60.0:
            seconds = 60.0
        if mode not in ("blocking", "async"):
            mode = "blocking"

        started = datetime.now(timezone.utc)
        wall_t0 = time.time()
        thread_id = threading.get_ident()
        task_id = ""  # sync handler なので asyncio.current_task は None

        if mode == "blocking":
            # 普通の time.sleep。 FastAPI が threadpool で実行するので event loop を握らない。
            time.sleep(seconds)
        else:
            # 比較用: async モード。 sync ハンドラ内なので、 ここで新規 event loop を作って
            # await asyncio.sleep する。 主たる用途は blocking 側なのでこちらは参考値。
            asyncio.run(asyncio.sleep(seconds))

        ended = datetime.now(timezone.utc)
        wall = time.time() - wall_t0
        return {
            "slept": seconds,
            "mode": mode,
            "label": label,
            "started_at": started.isoformat(),
            "ended_at": ended.isoformat(),
            "wall_seconds": wall,
            "thread_id": thread_id,
            "task_id": task_id,
        }


    @app.post("/github/index")
    async def index_github_repo(request: dict, background_tasks: BackgroundTasks):
        """GitHubリポジトリをバックグラウンドでインデックス化（即時job_id返却）。
        repo にワイルドカード（* ? [ ]）を含む場合はオーナーの全リポジトリを列挙してパターンマッチを行う。"""
        owner        = request.get("owner")
        repo_pattern = request.get("repo")
        branch       = request.get("branch", "main")
        user_id      = request.get("user_id")
        max_files    = request.get("max_files", 0)

        if not all([owner, repo_pattern, user_id]):
            raise HTTPException(status_code=400, detail="Missing required parameters")

        github_token = os.environ.get("GITHUB_TOKEN")
        if not github_token:
            raise HTTPException(status_code=500, detail="GitHub token not configured")

        # ワイルドカードパターンが含まれる場合はリポジトリ一覧を取得してフィルタリング
        if any(c in repo_pattern for c in ('*', '?', '[', ']')):
            client = GitHubAPIClient(token=github_token)
            all_repos = client.list_repos(owner)
            matched_repos = [r for r in all_repos if fnmatch.fnmatch(r, repo_pattern)]
            if not matched_repos:
                raise HTTPException(
                    status_code=404,
                    detail=f"No repositories matching '{repo_pattern}' found for owner '{owner}'"
                )
            logger.info(f"[GITHUB] Pattern '{repo_pattern}' matched {len(matched_repos)} repos: {matched_repos}")
        else:
            matched_repos = [repo_pattern]

        job_id = str(uuid4())[:8]
        with _job_lock:
            _job_status[job_id] = {
                "status": "queued", "progress": 0, "total": 0,
                "files": 0, "chunks": 0, "error": None,
                "repos": [f"{owner}/{r}" for r in matched_repos],
                "repo_count": len(matched_repos),
                "current_repo": "",
                "repo_index": 0,
                "completed_repos": [],
                "skipped_repos": [],
                "branch": branch
            }

        background_tasks.add_task(
            _github_index_job,
            job_id, owner, matched_repos, branch, user_id, max_files, github_token
        )

        logger.info(f"[GITHUB] Job {job_id} queued for {len(matched_repos)} repo(s): {matched_repos}")
        return {"job_id": job_id, "status": "queued", "matched_repos": matched_repos}


    @app.get("/github/status/{job_id}")
    async def github_index_status(job_id: str):
        """ジョブの進捗確認"""
        with _job_lock:
            status = _job_status.get(job_id)
        if status is None:
            raise HTTPException(status_code=404, detail="Job not found")
        return status


