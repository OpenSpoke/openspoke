        logger.info(f"OpenSearch: {'Enabled' if OPENSEARCH_ENABLED else 'Disabled'} ({OPENSEARCH_URL})")
        logger.info(f"Semantic Cache: {'Enabled' if CACHE_ENABLED else 'Disabled'} ({CACHE_URL})")
        
        # MinIO接続とバケット作成
        global minio_client
