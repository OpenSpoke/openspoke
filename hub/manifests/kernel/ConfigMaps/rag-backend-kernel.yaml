    def store_entities_in_neo4j(extraction_result: Dict[str, Any], tenant: str):
        """抽出したエンティティをMemgraphに保存"""
        if not NEO4J_AVAILABLE or neo4j_driver is None:
            logger.warning("[GRAPH] Driver not available, skipping graph storage")
            return
        
        doc_id = extraction_result.get("doc_id", "unknown")
        entities = extraction_result.get("entities", [])
        relationships = extraction_result.get("relationships", [])
        
        logger.info(f"[GRAPH] Storing {len(entities)} entities and {len(relationships)} relationships for tenant: {tenant}")
        
        with neo4j_driver.session() as session:
            session.run(
                """
                MERGE (d:Document {doc_id: $doc_id, tenant: $tenant})
                SET d.updated_at = datetime()
                """,
                doc_id=doc_id, tenant=tenant
            )
            
            for entity in entities:
                entity_name = (entity.get("name") or "").strip()
                entity_type = entity.get("type") or "Other"
                description = entity.get("description") or ""
                
                if not entity_name:
                    continue
                
                session.run(
                    """
                    MERGE (e:Entity {name: $name, tenant: $tenant})
                    SET e.type = $type, e.description = $description, e.updated_at = datetime()
                    WITH e
                    MATCH (d:Document {doc_id: $doc_id, tenant: $tenant})
                    MERGE (d)-[:CONTAINS]->(e)
                    """,
                    name=entity_name, tenant=tenant, type=entity_type,
                    description=description, doc_id=doc_id
                )
            
            for rel in relationships:
                from_name = (rel.get("from") or "").strip()
                to_name = (rel.get("to") or "").strip()
                rel_type = (rel.get("type") or "RELATED_TO").upper().replace(" ", "_")
                rel_desc = rel.get("description") or ""
                
                if not from_name or not to_name:
                    continue
                
                session.run(
                    """
                    MATCH (e1:Entity {name: $from_name, tenant: $tenant})
                    MATCH (e2:Entity {name: $to_name, tenant: $tenant})
                    MERGE (e1)-[r:RELATES_TO]->(e2)
                    SET r.type = $rel_type, r.description = $rel_desc
                    """,
                    from_name=from_name, to_name=to_name, tenant=tenant,
                    rel_type=rel_type, rel_desc=rel_desc
                )
            
            # 同一ドキュメント内のエンティティ間にCO_OCCURS関係を自動作成
            entity_names = [(e.get("name") or "").strip() for e in entities if (e.get("name") or "").strip()]
            if len(entity_names) > 1:
                session.run(
                    """
                    MATCH (d:Document {doc_id: $doc_id, tenant: $tenant})-[:CONTAINS]->(e1:Entity)
                    MATCH (d)-[:CONTAINS]->(e2:Entity)
                    WHERE id(e1) < id(e2)
                    MERGE (e1)-[r:CO_OCCURS]->(e2)
                    SET r.doc_id = $doc_id
                    """,
                    doc_id=doc_id, tenant=tenant
                )
                logger.info(f"[GRAPH] Created CO_OCCURS relationships for {len(entity_names)} entities")
        
        logger.info(f"[GRAPH] Storage complete for doc: {doc_id}")


    def store_chunks_in_neo4j(chunks: List[str], doc_id: str, tenant: str):
        """チャンクをMemgraphに保存（グラフ優先検索用）"""
        if not NEO4J_AVAILABLE or neo4j_driver is None:
            return
        
        logger.info(f"[GRAPH] Storing {len(chunks)} chunks for doc: {doc_id}")
        
        with neo4j_driver.session() as session:
            for idx, chunk_text in enumerate(chunks):
                session.run(
                    """
                    MATCH (d:Document {doc_id: $doc_id, tenant: $tenant})
                    CREATE (c:Chunk {
                        chunk_id: $chunk_id,
                        text: $text,
                        tenant: $tenant,
                        doc_id: $doc_id
                    })
                    MERGE (d)-[:HAS_CHUNK]->(c)
                    """,
                    doc_id=doc_id, tenant=tenant,
                    chunk_id=f"{doc_id}_chunk_{idx}",
                    text=chunk_text[:4000]  # 長すぎるテキストは切り詰め
                )
            
            # チャンクとエンティティを関連付け（チャンク内にエンティティ名が含まれる場合）
            session.run(
                """
                MATCH (c:Chunk {tenant: $tenant, doc_id: $doc_id})
                MATCH (e:Entity {tenant: $tenant})
                WHERE c.text CONTAINS e.name
                MERGE (c)-[:MENTIONS]->(e)
                """,
                tenant=tenant, doc_id=doc_id
            )
        
        logger.info(f"[GRAPH] Chunks storage complete for doc: {doc_id}")


    def search_graph_first(question: str, tenant: str, limit: int = 10) -> Dict[str, Any]:
        """グラフ優先検索：エンティティ→関連チャンク取得"""
        if not NEO4J_AVAILABLE or neo4j_driver is None:
            return {"chunks": [], "entities": [], "paths": []}
        
        chunks = []
        entities = []
        paths = []
        
        with neo4j_driver.session() as session:
            # 1. 質問にマッチするエンティティを取得
            entity_result = session.run(
                """
                MATCH (e:Entity {tenant: $tenant})
                WHERE $question CONTAINS e.name
                RETURN e.name as name, e.type as type, e.description as desc
                """,
                tenant=tenant, question=question
            )
            
            matched_entities = []
            for record in entity_result:
                matched_entities.append(record["name"])
                entities.append({
                    "entity": record["name"],
                    "type": record["type"],
                    "description": record["desc"]
                })
            
            if not matched_entities:
                logger.info("[GRAPH_FIRST] No matching entities found")
                return {"chunks": [], "entities": [], "paths": []}
            
            # 2. マルチホップで関連エンティティを取得
            path_result = session.run(
                """
                MATCH (start:Entity {tenant: $tenant})
                WHERE start.name IN $entity_names
                MATCH path = (start)-[:RELATES_TO|CO_OCCURS*1..3]-(end:Entity {tenant: $tenant})
                WHERE start <> end
                WITH start, end, [n IN nodes(path) | n.name] as node_names, length(path) as hops
                RETURN DISTINCT start.name as start_entity, end.name as end_entity,
                       node_names as path_nodes, hops
                ORDER BY hops
                LIMIT 20
                """,
                tenant=tenant, entity_names=matched_entities
            )
            
            related_entities = set(matched_entities)
            for record in path_result:
                paths.append({
                    "from": record["start_entity"],
                    "to": record["end_entity"],
                    "path": record["path_nodes"],
                    "hops": record["hops"]
                })
                related_entities.add(record["end_entity"])
            
            # 3. 関連エンティティに紐づくチャンクを取得
            chunk_result = session.run(
                """
                MATCH (c:Chunk {tenant: $tenant})-[:MENTIONS]->(e:Entity {tenant: $tenant})
                WHERE e.name IN $entity_names
                RETURN DISTINCT c.text as text, c.chunk_id as chunk_id,
                       collect(DISTINCT e.name) as mentioned_entities
                LIMIT $limit
                """,
                tenant=tenant, entity_names=list(related_entities), limit=limit
            )
            
            for record in chunk_result:
                chunks.append({
                    "text": record["text"],
                    "chunk_id": record["chunk_id"],
                    "mentioned_entities": record["mentioned_entities"]
                })
            
            # 4. チャンクが見つからない場合、ドキュメント経由で取得
            if not chunks:
                logger.info("[GRAPH_FIRST] No chunks via MENTIONS, trying via Document")
                chunk_result = session.run(
                    """
                    MATCH (e:Entity {tenant: $tenant})<-[:CONTAINS]-(d:Document {tenant: $tenant})
                    WHERE e.name IN $entity_names
                    MATCH (d)-[:HAS_CHUNK]->(c:Chunk)
                    RETURN DISTINCT c.text as text, c.chunk_id as chunk_id
                    LIMIT $limit
                    """,
                    tenant=tenant, entity_names=list(related_entities), limit=limit
                )
                
                for record in chunk_result:
                    chunks.append({
                        "text": record["text"],
                        "chunk_id": record["chunk_id"],
                        "mentioned_entities": []
                    })
        
        logger.info(f"[GRAPH_FIRST] Found {len(entities)} entities, {len(paths)} paths, {len(chunks)} chunks")
        return {"chunks": chunks, "entities": entities, "paths": paths}


    def search_graph_context(question: str, tenant: str, limit: int = 10) -> List[Dict[str, Any]]:
        """質問に関連するエンティティと関係をMemgraphから検索（マルチホップ対応）"""
        if not NEO4J_AVAILABLE or neo4j_driver is None:
            return []
        
        results = []
        paths = []
        
        with neo4j_driver.session() as session:
            # 1. 質問文にエンティティ名が含まれているかで検索（日本語対応）
            query_result = session.run(
                """
                MATCH (e:Entity {tenant: $tenant})
                WHERE $question CONTAINS e.name
                OPTIONAL MATCH (e)-[r:RELATES_TO|CO_OCCURS]-(related:Entity {tenant: $tenant})
                RETURN e.name as entity, e.type as type, e.description as desc,
                       collect(DISTINCT {name: related.name, type: related.type, rel: type(r)})[..5] as related
                LIMIT $limit
                """,
                tenant=tenant, question=question, limit=limit
            )
            
            for record in query_result:
                results.append({
                    "entity": record["entity"],
                    "type": record["type"],
                    "description": record["desc"],
                    "related": record["related"]
                })
            
            # 2. マルチホップパスを取得（2-3ホップ）
            path_result = session.run(
                """
                MATCH (start:Entity {tenant: $tenant})
                WHERE $question CONTAINS start.name
                MATCH path = (start)-[:RELATES_TO|CO_OCCURS*1..3]-(end:Entity {tenant: $tenant})
                WHERE start <> end
                WITH start, end, 
                     [n IN nodes(path) | n.name] as node_names,
                     length(path) as hops
                RETURN DISTINCT start.name as start_entity, 
                       end.name as end_entity,
                       end.type as end_type,
                       node_names as path_nodes,
                       hops
                ORDER BY hops
                LIMIT 10
                """,
                tenant=tenant, question=question
            )
            
            for record in path_result:
                paths.append({
                    "from": record["start_entity"],
                    "to": record["end_entity"],
                    "to_type": record["end_type"],
                    "path": record["path_nodes"],
                    "hops": record["hops"]
                })
        
        # 重複除去
        seen = set()
        unique_results = []
        for r in results:
            if r["entity"] not in seen:
                seen.add(r["entity"])
                unique_results.append(r)
        
        # パス情報を結果に追加
        if paths:
            unique_results.append({
                "entity": "_paths",
                "type": "PathInfo",
                "description": "マルチホップ関係",
                "paths": paths
            })
        
        return unique_results[:limit + 1]


    def format_graph_context(graph_results: List[Dict[str, Any]]) -> str:
        """グラフ検索結果をコンテキスト文字列に変換"""
        if not graph_results:
            return ""
        
        context_parts = ["[関連エンティティ情報]"]
        path_info = None
        
        for r in graph_results:
            # パス情報は別処理
            if r.get("entity") == "_paths":
                path_info = r.get("paths", [])
                continue
            
            part = f"- {r['entity']} ({r['type']})"
            if r.get('description'):
                part += f": {r['description']}"
            
            if r.get('related'):
                related_strs = []
                for rel in r['related']:
                    if rel.get('name'):
                        related_strs.append(f"{rel.get('rel', 'RELATED')}->{rel['name']}")
                if related_strs:
                    part += f" [関連: {', '.join(related_strs)}]"
            
            context_parts.append(part)
        
        # マルチホップパス情報を追加
        if path_info:
            context_parts.append("\n[関係パス]")
            seen_paths = set()
            for p in path_info:
                path_str = " → ".join(p["path"])
                if path_str not in seen_paths:
                    seen_paths.add(path_str)
                    context_parts.append(f"- {path_str}")
        
        return "\n".join(context_parts)


    def rerank_with_cross_encoder(question: str, candidates: List[Dict[str, Any]], final_count: int = 10) -> tuple:
        """Cross-Encoderを使って検索結果をリランキング
        
        Args:
            question: 検索クエリ
            candidates: 候補リスト
            final_count: 最終的に返す件数（デフォルト10件）
        
        Returns:
            tuple: (reranked_results, debug_info)
        """
        if len(candidates) <= final_count:
            return candidates, {"reranked": False, "reason": "candidates_too_few"}
        
        try:
            model = get_reranker()
            
            # クエリと候補のペアを作成（テキストは500文字に制限）
            pairs = [[question, c["text"][:500]] for c in candidates]
            
            # バッチでスコア計算
            import time
            start = time.time()
            scores = model.predict(pairs)
            elapsed = time.time() - start
            
            logger.info(f"[RERANKER] Scored {len(candidates)} candidates in {elapsed:.2f}s")
            
            # スコアでソート
            import numpy as np
            ranked_indices = np.argsort(scores)[::-1][:final_count]
            
            # 元の候補にrerankerスコアを追加
            reranked = []
            for idx in ranked_indices:
                candidate = candidates[idx].copy()
                candidate["rerank_score"] = float(scores[idx])
                reranked.append(candidate)
            
            debug_info = {
                "reranked": True,
                "method": "cross_encoder",
                "candidates_count": len(candidates),
                "selected_count": len(reranked),
                "rerank_time_sec": round(elapsed, 2)
            }
            
            logger.info(f"[RERANKER] Selected top {len(reranked)} from {len(candidates)} candidates")
            return reranked, debug_info
        
        except Exception as e:
            logger.error(f"[RERANKER] Error: {e}")
            return candidates[:final_count], {"reranked": False, "reason": str(e)}


    def generate_response(question: str, context: str, graph_context: str = "") -> str:
        """LLM応答生成"""
        # コンテキスト長を制限
        MAX_CONTEXT_CHARS = 8000  # Gemma4 E4B(128K)に合わせて拡大
        MAX_GRAPH_CHARS = 2000
        
        original_context_len = len(context)
        original_graph_len = len(graph_context) if graph_context else 0
        
        if len(context) > MAX_CONTEXT_CHARS:
            logger.warning(f"[LLM_DEBUG] Context too long ({len(context)} chars), truncating to {MAX_CONTEXT_CHARS}")
            context = context[:MAX_CONTEXT_CHARS] + "\n... (以下省略)"
        
        if graph_context and len(graph_context) > MAX_GRAPH_CHARS:
            logger.warning(f"[LLM_DEBUG] Graph context too long ({len(graph_context)} chars), truncating to {MAX_GRAPH_CHARS}")
            graph_context = graph_context[:MAX_GRAPH_CHARS] + "... (以下省略)"
        
        full_context = context
        if graph_context:
            full_context = f"{graph_context}\n\n[ドキュメント情報]\n{context}"
        
        from datetime import datetime
        today = datetime.now().strftime("%Y年%m月%d日")
        
        prompt = f"""あなたは親切で知識豊富な日本語アシスタントです。
    今日は{today}です。以下のコンテキストを参考にして、質問に対して正確かつ丁寧に、具体的な内容を含めて詳しく日本語で答えてください。 コンテキストに記載されている情報は積極的に活用し、人物や事柄の特徴・背景・エピソードなどを交えて、読み手が理解しやすい自然な文章で回答してください。 コンテキストに情報がない場合は「情報が見つかりませんでした」と正直に答えてください。
    コンテキスト: {full_context}
    質問: {question}
    回答:"""
        
        # 詳細なログ出力
        prompt_length = len(prompt)
        estimated_tokens = int(prompt_length * 2.0)  # 保守的な見積もり（日本語多めを想定）
        
        logger.info(f"[LLM_DEBUG] ==================== LLM Request Debug ====================")
        logger.info(f"[LLM_DEBUG] Question length: {len(question)} chars")
        logger.info(f"[LLM_DEBUG] Original context: {original_context_len} chars")
        logger.info(f"[LLM_DEBUG] Original graph: {original_graph_len} chars")
        logger.info(f"[LLM_DEBUG] Final context: {len(context)} chars")
        logger.info(f"[LLM_DEBUG] Final graph: {len(graph_context) if graph_context else 0} chars")
        logger.info(f"[LLM_DEBUG] Full context: {len(full_context)} chars")
        logger.info(f"[LLM_DEBUG] Total prompt: {prompt_length} chars")
        logger.info(f"[LLM_DEBUG] Estimated tokens: {estimated_tokens} (max: 32768)")
        
        if estimated_tokens > 32768:
            logger.error(f"[LLM_DEBUG] WARNING: Estimated tokens ({estimated_tokens}) > num_ctx (32768)")
            logger.error(f"[LLM_DEBUG] This will likely cause timeout or failure")
        
        logger.info(f"[LLM_DEBUG] =========================================================")
        
        start_time = time.time()
        logger.info(f"[LLM] Generating response for: {question[:50]}...")
        
        try:
            response = requests.post(
                f"{VLLM_URL}/v1/chat/completions",
                json={
                    "model": LLM_MODEL,
                    "messages": [{"role": "user", "content": prompt}],
                    "temperature": 0.7,
                    "top_p": 0.9,
                    "max_tokens": 2048
                },
                timeout=LLM_TIMEOUT
            )
            response.raise_for_status()

            elapsed = time.time() - start_time
            result = response.json()["choices"][0]["message"]["content"]
            logger.info(f"[LLM] Response generated in {elapsed:.1f}s")
            logger.info(f"[LLM_DEBUG] Response length: {len(result)} chars")
            
            return result
        
        except requests.exceptions.Timeout:
            elapsed = time.time() - start_time
            logger.error(f"[LLM_ERROR] Timeout after {elapsed:.1f}s")
            logger.error(f"[LLM_ERROR] Context was {len(full_context)} chars (~{estimated_tokens} tokens)")
            return "申し訳ございません。処理に時間がかかりすぎたため、回答を生成できませんでした。コンテキストが長すぎる可能性があります。"
        
        except requests.exceptions.RequestException as e:
            logger.error(f"[LLM_ERROR] Request failed: {e}")
            return "申し訳ございません。LLMサービスでエラーが発生しました。"
        
        except Exception as e:
            logger.error(f"[LLM_ERROR] Unexpected error: {e}")
            return "申し訳ございません。予期しないエラーが発生しました。"


    # ============== Claude API 呼び出し(補完用サブエージェント) ==============
    # Claude API 使用量カウンタ（Pod 生存期間中の累計）
    # 削減施策の効果測定用。Pod 再起動でリセットされる。
    _claude_usage_lock = threading.Lock()
    _claude_usage = {
        "calls": 0,
        "input_tokens": 0,
        "output_tokens": 0,
        "cache_creation_tokens": 0,
        "cache_read_tokens": 0,
        "by_op": {},  # op名 → {"calls":N, "input":N, "output":N, "cache_w":N, "cache_r":N}
    }

    # Claude 使用量を OpenSearch に記録。インデックス名は環境変数で上書き可。
    # 既存の OpenSearch クラスタ (OPENSEARCH_URL) に書き込む。
    OPENSEARCH_USAGE_INDEX = os.environ.get("OPENSEARCH_USAGE_INDEX", "claude_usage")


    def record_claude_usage(op: str, input_tokens: int, output_tokens: int, model: str = "",
                            cache_w: int = 0, cache_r: int = 0,
                            session_id: str = None, user_id: str = None):
        """Claude API 呼び出しのトークン数を記録。
        op はカテゴリ名 (例: draft_markdown, draft_questions, clean_format, judge_json 等)。
        [CLAUDE_COST] プレフィックスでログ出力し、メモリ累計カウンタを更新し、
        OpenSearch (claude_usage インデックス) にドキュメントを 1 つ追加する。
        OpenSearch への書き込み失敗は警告ログのみで握りつぶす(本処理を中断しない)。
        OPENSEARCH_ENABLED=false の環境では OpenSearch 書き込みをスキップする。
        """
        try:
            input_tokens = int(input_tokens or 0)
            output_tokens = int(output_tokens or 0)
            cache_w = int(cache_w or 0)
            cache_r = int(cache_r or 0)
        except (TypeError, ValueError):
            input_tokens, output_tokens, cache_w, cache_r = 0, 0, 0, 0
        total = input_tokens + output_tokens
        used_model = model or CLAUDE_MODEL
        logger.info(f"[CLAUDE_COST] op={op} input={input_tokens} output={output_tokens} total={total} model={used_model}")
        with _claude_usage_lock:
            _claude_usage["calls"] += 1
            _claude_usage["input_tokens"] += input_tokens
            _claude_usage["output_tokens"] += output_tokens
            _claude_usage["cache_creation_tokens"] += cache_w
            _claude_usage["cache_read_tokens"] += cache_r
            op_stats = _claude_usage["by_op"].setdefault(op, {"calls": 0, "input": 0, "output": 0, "cache_w": 0, "cache_r": 0})
            op_stats["calls"] += 1
            op_stats["input"] += input_tokens
            op_stats["output"] += output_tokens
            op_stats["cache_w"] += cache_w
            op_stats["cache_r"] += cache_r

        # OpenSearch 永続化 (失敗しても本処理は継続)
        if not OPENSEARCH_ENABLED:
            return
        try:
            from datetime import datetime, timezone
            # コスト計算 (USD): input $3/M, cache_w $3.75/M, cache_r $0.30/M, output $15/M
            cost_usd = (
                (input_tokens * 3.0 / 1_000_000)
                + (cache_w * 3.75 / 1_000_000)
                + (cache_r * 0.30 / 1_000_000)
                + (output_tokens * 15.0 / 1_000_000)
            )
            doc = {
                "@timestamp": datetime.now(timezone.utc).isoformat(),
                "op": op,
                "model": used_model,
                "input_tokens": input_tokens,
                "output_tokens": output_tokens,
                "cache_w": cache_w,
                "cache_r": cache_r,
                "session_id": session_id,
                "user_id": user_id,
                "cost_usd": cost_usd,
            }
            resp = requests.post(
                f"{OPENSEARCH_URL}/{OPENSEARCH_USAGE_INDEX}/_doc",
                json=doc,
                headers={"Content-Type": "application/json"},
                timeout=3,
            )
            if resp.status_code not in (200, 201):
                logger.warning(f"[CLAUDE_USAGE_OS] Index returned {resp.status_code}: {resp.text[:200]}")
        except Exception as e:
            logger.warning(f"[CLAUDE_USAGE_OS] Failed to index usage record: {type(e).__name__}: {e}")


    _anthropic_client = None

    def get_anthropic_client():
        """Anthropic クライアントを取得(初回のみ生成)"""
        global _anthropic_client
        if _anthropic_client is None:
            if not ANTHROPIC_API_KEY:
                raise RuntimeError("ANTHROPIC_API_KEY is not set")
            import anthropic
            _anthropic_client = anthropic.Anthropic(api_key=ANTHROPIC_API_KEY)
            logger.info("[CLAUDE] Anthropic client initialized (model is selected per request)")
        return _anthropic_client


    # ============== Phase 2.1: MCP クライアント(requests ベース) ==============
    class SimpleMCPClient:
        """requests で MCP over SSE プロトコルを話す軽量クライアント。

        MCP サーバー側は一切変更しない。クラスター内通信 + x-api-key 認証で接続する。
        SSE ストリームから JSON-RPC レスポンスを受信し、POST で送信する。

        SSE 仕様(W3C)に準拠: 空行までの data: 行を改行で結合して 1 つのフレームとする。
        """

        def __init__(self, sse_url: str, api_key: str, timeout: float = 30.0):
            self.sse_url = sse_url
            self.api_key = api_key
            self.timeout = timeout
            self._session = None
            self._sse_response = None
            self._sse_iter = None
            self._messages_url = None
            self._request_id = 0
            self._base_url = sse_url.rsplit("/sse", 1)[0] if sse_url.endswith("/sse") else sse_url.rsplit("/", 1)[0]

        def __enter__(self):
            import requests
            self._session = requests.Session()
            self._session.headers.update({"x-api-key": self.api_key})
            # SSE 接続(stream=True で iter_lines できる、タイムアウトはリードは無制限、接続だけ self.timeout)
            self._sse_response = self._session.get(
                self.sse_url,
                stream=True,
                timeout=(self.timeout, None),
                headers={"Accept": "text/event-stream"}
            )
            self._sse_response.raise_for_status()
            # バイト単位で読み込む（iter_lines は大きな行で詰まる場合があるため自前処理）
            self._sse_iter = self._sse_response.iter_content(chunk_size=1, decode_unicode=False)
            self._sse_buf = b""  # 読み込みバッファ
            # 最初の endpoint イベントを読む
            self._messages_url = self._read_endpoint_event()
            logger.info(f"[MCP_CLIENT] SSE connected, messages endpoint: {self._messages_url}")
            # initialize ハンドシェイク
            self._initialize()
            return self

        def __exit__(self, exc_type, exc_val, exc_tb):
            try:
                if self._sse_response is not None:
                    self._sse_response.close()
            except Exception:
                pass
            if self._session is not None:
                self._session.close()

        def _read_line(self):
            """SSE ストリームから 1 行(\n 終端)を読み取る。バッファリング対応。

            iter_lines() は大きな行が来るとチャンクサイズ制限でハングすることがあるため、
            iter_content でバイト列を取得して自前で改行分割する。
            """
            while True:
                idx = self._sse_buf.find(b"\n")
                if idx >= 0:
                    line = self._sse_buf[:idx]
                    # \r\n も \n も許容
                    if line.endswith(b"\r"):
                        line = line[:-1]
                    self._sse_buf = self._sse_buf[idx + 1:]
                    return line.decode("utf-8", errors="replace")
                # バッファに改行がない → もっと読み込む
                try:
                    chunk = next(self._sse_iter)
                except StopIteration:
                    # ストリーム終了
                    if self._sse_buf:
                        rest = self._sse_buf.decode("utf-8", errors="replace")
                        self._sse_buf = b""
                        return rest
                    return None
                if chunk:
                    self._sse_buf += chunk

        def _iter_sse_events(self):
            """SSE ストリームを (event_type, data) のタプルとしてイテレート(SSE 仕様準拠)。

            空行がフレーム境界。空行までの data: 行を改行で結合する。
            """
            event_type = "message"
            data_lines = []
            while True:
                line = self._read_line()
                if line is None:
                    # ストリーム終了
                    if data_lines:
                        yield (event_type, "\n".join(data_lines))
                    return
                if line == "":
                    if data_lines:
                        yield (event_type, "\n".join(data_lines))
                    event_type = "message"
                    data_lines = []
                elif line.startswith(":"):
                    continue
                elif line.startswith("event:"):
                    event_type = line[6:].lstrip()
                elif line.startswith("data:"):
                    data_lines.append(line[5:].lstrip() if line[5:].startswith(" ") else line[5:])
                # id:, retry: は使わないので無視

        def _read_endpoint_event(self) -> str:
            """最初の event: endpoint を読んで messages URL を返す"""
            for event_type, data in self._iter_sse_events():
                if event_type == "endpoint":
                    if data.startswith("/"):
                        return self._base_url + data
                    return data
            raise RuntimeError("SSE stream ended without endpoint event")

        def _read_message_event(self, expected_id: int) -> dict:
            """event: message を読んで、id がマッチする JSON-RPC レスポンスを返す"""
            import json
            for event_type, data in self._iter_sse_events():
                if event_type != "message":
                    continue
                try:
                    msg = json.loads(data)
                except json.JSONDecodeError as e:
                    logger.warning(f"[MCP_CLIENT] JSON decode failed: {e}; head: {data[:200]}")
                    continue
                if msg.get("id") == expected_id:
                    return msg
                logger.info(f"[MCP_CLIENT] Skipping unmatched id={msg.get('id')} (expected {expected_id})")
            raise RuntimeError(f"SSE stream ended without response for id={expected_id}")

        def _post_request(self, method: str, params = None) -> dict:
            """JSON-RPC リクエストを POST し、SSE から同 id のレスポンスを受信"""
            self._request_id += 1
            req_id = self._request_id
            payload = {"jsonrpc": "2.0", "id": req_id, "method": method}
            if params is not None:
                payload["params"] = params
            resp = self._session.post(self._messages_url, json=payload, timeout=self.timeout)
            if resp.status_code not in (200, 202):
                raise RuntimeError(f"POST {method} failed: HTTP {resp.status_code}: {resp.text[:200]}")
            return self._read_message_event(req_id)

        def _initialize(self):
            res = self._post_request("initialize", {
                "protocolVersion": "2025-03-26",
                "capabilities": {},
                "clientInfo": {"name": "rag-backend", "version": "1.0"}
            })
            if "error" in res:
                raise RuntimeError(f"MCP initialize error: {res['error']}")
            # notifications/initialized(通知、レスポンスなし)
            self._session.post(self._messages_url, json={
                "jsonrpc": "2.0",
                "method": "notifications/initialized"
            }, timeout=self.timeout)
            logger.info("[MCP_CLIENT] initialize completed")

        def list_tools(self) -> list:
            res = self._post_request("tools/list", {})
            if "error" in res:
                raise RuntimeError(f"tools/list error: {res['error']}")
            return res.get("result", {}).get("tools", [])

        def call_tool(self, name: str, arguments: dict) -> str:
            res = self._post_request("tools/call", {"name": name, "arguments": arguments})
            if "error" in res:
                raise RuntimeError(f"tools/call error: {res['error']}")
            content = res.get("result", {}).get("content", [])
            text_parts = []
            for c in content:
                if c.get("type") == "text":
                    text_parts.append(c.get("text", ""))
            return "\n".join(text_parts)


    def generate_response_claude(question: str, context: str, graph_context: str = "", user_id: str = "default", model: str = "", use_tools: bool = True, system_prompt: Optional[str] = None) -> str:
        """Claude + MCP クライアントによる応答生成(Phase 2.1)

        rag-backend が requests ベースの MCP クライアントとなり、
        Claude の function calling で MCP サーバーのツールを実行する。
        Claude API は標準の messages.create を使用(mcp_servers パラメータは使わない)。
        MCP サーバー側のコードは変更しない(Claude.ai からも同じ MCP を使えるように)。
        引数 context / graph_context は後方互換のため残しているが、本関数では使用しない。
        model: 使用する Claude モデル名。 空なら CLAUDE_MODEL (Sonnet)。
            オーケストレーターの triage が選んだ tier をここで渡す。
        """
        from datetime import datetime
        today = datetime.now().strftime("%Y年%m月%d日")

        effective_model = model if model else CLAUDE_MODEL
        # 応答出力トークン上限はモデルで変える。 Haiku は据え置き、
        # Sonnet / Opus は拡大 (上位モデルは長く詳細に答えるため 2048
        # では末尾が切れる)。
        effective_max_tokens = _query_max_tokens_for_model(effective_model)

        if not MCP_API_KEY or not MCP_SERVER_URL:
            logger.error(f"[CLAUDE_ERROR] MCP config missing: MCP_API_KEY set={bool(MCP_API_KEY)}, MCP_SERVER_URL={MCP_SERVER_URL}")
            return "申し訳ございません。MCP 設定が不完全です。"

        logger.info(f"[CLAUDE] ==================== Claude + MCP (Phase 2.1) Request ====================")
        logger.info(f"[CLAUDE] Model: {effective_model}")
        logger.info(f"[CLAUDE] Question: {question[:80]}...")
        logger.info(f"[CLAUDE] user_id: {user_id}")
        logger.info(f"[CLAUDE] MCP URL: {MCP_SERVER_URL}")
        logger.info(f"[CLAUDE] =======================================================================")

        start_time = time.time()

        try:
            with SimpleMCPClient(MCP_SERVER_URL, MCP_API_KEY, timeout=MCP_CONNECT_TIMEOUT) as mcp_client:
                all_tools = mcp_client.list_tools()
                logger.info(f"[CLAUDE] MCP provides {len(all_tools)} tools: {[t.get('name') for t in all_tools]}")

                # Phase 2.1 では retrieve_chunks のみ Claude に公開。
                # use_tools=False (呼び出し側が自己完結プロンプトを用意するケース)
                # では一切ツールを渡さない。
                if use_tools:
                    allowed_tool_names = {"retrieve_chunks"}
                else:
                    allowed_tool_names = set()
                tools_for_claude = []
                for t in all_tools:
                    if t.get("name") not in allowed_tool_names:
                        continue
                    tools_for_claude.append({
                        "name": t["name"],
                        "description": t.get("description", ""),
                        "input_schema": t.get("inputSchema", {"type": "object", "properties": {}})
                    })
                logger.info(f"[CLAUDE] Exposing {len(tools_for_claude)} tools to Claude: {[t['name'] for t in tools_for_claude]}")

                # システムプロンプト
                if system_prompt is not None:
                    # 呼び出し側 (アプリケーション backend) から明示的に渡された
                    # 独自 system prompt をそのまま使う。 {today}, {user_id} など
                    # のプレースホルダは呼び出し側で置換済み前提。
                    pass
                elif use_tools:
                    system_prompt = f"""あなたは親切で知識豊富な日本語アシスタントです。
    今日は{today}です。
    必要に応じて retrieve_chunks ツールを使って、社内ナレッジベースから関連情報を取得してください。 retrieve_chunks を呼ぶときは、user_id として必ず "{user_id}" を指定してください。 質問に答えるために必要に応じて複数回ツールを呼び出しても構いません。
    情報が見つからない場合は「情報が見つかりませんでした」と正直に答えてください。"""
                else:
                    # コンテキスト自己完結型。 RAG 検索は呼び出し側で実施済みで、
                    # 必要な情報はユーザーメッセージ内に同梱されている。 ツールは
                    # 無い前提。 「ナレッジベースにアクセスできない」 等の前置きや
                    # 言い訳を書かせない。 汎用 default prompt。
                    system_prompt = f"""あなたは親切で知識豊富な日本語アシスタントです。
    今日は{today}です。
    ユーザーのメッセージには、 回答の根拠となる情報が同梱されている場合があります。 それらと一般知識を踏まえて、 具体的かつ実務的に日本語で回答してください。
    「ナレッジベースにアクセスできない」「検索に課題がある」 等、 内部の仕組みやデータ取得状況に言及する前置き・言い訳は書かないこと。 与えられた情報と知識で本題に答えること。"""

                # Claude function calling ループ
                messages = [{"role": "user", "content": question}]
                total_input_tokens = 0
                total_output_tokens = 0
                tool_call_count = 0

                client = get_anthropic_client()

                for iteration in range(CLAUDE_MAX_TOOL_ITERATIONS):
                    logger.info(f"[CLAUDE] Iteration {iteration + 1}/{CLAUDE_MAX_TOOL_ITERATIONS}")
                    _create_kwargs = {
                        "model": effective_model,
                        "max_tokens": effective_max_tokens,
                        "system": system_prompt,
                        "messages": messages,
                    }
                    # tools は空 (use_tools=False 等) のとき渡さない。
                    # tools=None / [] は Anthropic API で 400 になる。
                    if tools_for_claude:
                        _create_kwargs["tools"] = tools_for_claude
                    response = client.with_options(timeout=CLAUDE_TIMEOUT).messages.create(
                        **_create_kwargs
                    )

                    total_input_tokens += getattr(response.usage, "input_tokens", 0)
                    total_output_tokens += getattr(response.usage, "output_tokens", 0)
                    record_claude_usage("response_claude", getattr(response.usage, "input_tokens", 0), getattr(response.usage, "output_tokens", 0), effective_model)

                    stop_reason = getattr(response, "stop_reason", None)
                    logger.info(f"[CLAUDE] stop_reason: {stop_reason}")

                    if stop_reason != "tool_use":
                        result_parts = []
                        for block in response.content:
                            if getattr(block, "type", None) == "text":
                                result_parts.append(block.text)
                        result = "\n".join(p for p in result_parts if p)
                        elapsed = time.time() - start_time
                        cost_usd = (total_input_tokens * 3 / 1_000_000) + (total_output_tokens * 15 / 1_000_000)
                        logger.info(f"[CLAUDE] Response generated in {elapsed:.1f}s, tool calls: {tool_call_count}")
                        logger.info(f"[CLAUDE] Tokens: in={total_input_tokens} out={total_output_tokens} cost=${cost_usd:.4f}")
                        if not result:
                            return "申し訳ございません。Claude から空の応答が返りました。"
                        return result

                    # tool_use ブロックを実行
                    assistant_content = list(response.content)
                    messages.append({"role": "assistant", "content": assistant_content})

                    tool_results_content = []
                    for block in response.content:
                        if getattr(block, "type", None) == "tool_use":
                            tool_call_count += 1
                            tool_name = block.name
                            tool_args = dict(block.input)
                            logger.info(f"[CLAUDE] Tool #{tool_call_count}: {tool_name}({tool_args})")
                            try:
                                tool_output = mcp_client.call_tool(tool_name, tool_args)
                                logger.info(f"[CLAUDE] Tool result: {len(tool_output)} chars")
                                tool_results_content.append({
                                    "type": "tool_result",
                                    "tool_use_id": block.id,
                                    "content": tool_output if tool_output else "(no result)"
                                })
                            except Exception as e:
                                logger.error(f"[CLAUDE_ERROR] MCP tool {tool_name} failed: {type(e).__name__}: {e}")
                                tool_results_content.append({
                                    "type": "tool_result",
                                    "tool_use_id": block.id,
                                    "content": f"ツール実行エラー: {type(e).__name__}",
                                    "is_error": True
                                })

                    messages.append({"role": "user", "content": tool_results_content})

                logger.warning(f"[CLAUDE] Max tool iterations reached")
                return "申し訳ございません。ツール呼び出しの反復が上限に達しました。"

        except Exception as e:
            elapsed = time.time() - start_time
            logger.error(f"[CLAUDE_ERROR] Failed after {elapsed:.1f}s: {type(e).__name__}: {e}")
            import traceback
            logger.error(f"[CLAUDE_ERROR] Traceback: {traceback.format_exc()}")
            return f"申し訳ございません。Claude API の呼び出しでエラーが発生しました: {type(e).__name__}"


    def generate_claude_text(prompt, max_tokens: int = 1024, temperature: float = 0.3, timeout: float = None, max_retries: int = None, system=None, response_schema: dict = None, use_streaming: bool = None, op: str = "text", session_id: str = None, user_id: str = None, model: str = None) -> str:
        """Claude に自由テキスト生成を依頼するシンプルなヘルパー。

        テキスト生成や比較判定など、ユーザープロンプトのみで完結する用途向け。
        エラー時はエラーメッセージ文字列を返す(呼び出し側で例外処理不要)。
        timeout=None の場合は CLAUDE_TIMEOUT を使う。
        max_retries=None の場合は SDK のデフォルト(2回)。0 で即座に失敗、1で1回リトライ。
        system を指定すると system prompt を設定する(前置き禁止、JSON出力強制などに有効)。
        prompt は文字列、または content block のリスト([{"type":"text","text":"...","cache_control":...}, ...])を受け付ける。
        system も文字列、または block リストを受け付ける。block 形式で cache_control を付与すると Prompt Caching が有効化される。
        response_schema を指定すると Structured Outputs(beta)を使って JSON スキーマ準拠を保証する。
        use_streaming: None の場合は max_tokens >= 4096 で自動 streaming(長いリクエストの timeout 回避)。
            True/False で明示指定可能。
            参考: https://docs.anthropic.com/en/api/errors#long-requests
        model: 使用する Claude モデル名 (例: "claude-opus-4-6")。 None / 空文字なら CLAUDE_MODEL を使用。
            呼び出し側 (アプリ) が op に応じて opus/sonnet を切り替える用途を想定。
        """
        start_time = time.time()
        effective_timeout = timeout if timeout is not None else CLAUDE_TIMEOUT
        effective_model = model if model else CLAUDE_MODEL
        # 自動 streaming 判定: max_tokens が大きい場合は streaming にする
        # ただし response_schema (Structured Outputs) を使う場合は streaming 不可なので強制 False
        if use_streaming is None:
            use_streaming = (max_tokens >= 4096) and (response_schema is None)
        elif use_streaming and response_schema is not None:
            # 明示的に True 指定でも、Structured Outputs と組み合わせは未サポートなので無効化
            logger.warning("[CLAUDE_TEXT] use_streaming=True is incompatible with response_schema; falling back to non-streaming")
            use_streaming = False
        try:
            client = get_anthropic_client()
            options = {"timeout": effective_timeout}
            if max_retries is not None:
                options["max_retries"] = max_retries

            create_kwargs = {
                "model": effective_model,
                "max_tokens": max_tokens,
                "temperature": temperature,
                "messages": [{"role": "user", "content": prompt}],
            }
            if system:
                create_kwargs["system"] = system
            used_structured = False
            if response_schema is not None:
                create_kwargs["extra_headers"] = {"anthropic-beta": "structured-outputs-2025-11-13"}
                create_kwargs["extra_body"] = {"output_format": {"type": "json_schema", "schema": response_schema}}
                used_structured = True

            # Opus 4.7 / 4.8 以降は temperature/top_p/top_k を受け付けないため除外する
            _claude_strip_unsupported_sampling(effective_model, create_kwargs)

            client_with_options = client.with_options(**options)

            if use_streaming:
                # Streaming モード: long request の HTTP idle timeout を回避
                text_parts = []
                input_tokens = 0
                output_tokens = 0
                with client_with_options.messages.stream(**create_kwargs) as stream:
                    for text_chunk in stream.text_stream:
                        text_parts.append(text_chunk)
                    final_message = stream.get_final_message()
                    input_tokens = getattr(final_message.usage, "input_tokens", 0)
                    output_tokens = getattr(final_message.usage, "output_tokens", 0)
                    cache_creation_tokens = getattr(final_message.usage, "cache_creation_input_tokens", 0) or 0
                    cache_read_tokens = getattr(final_message.usage, "cache_read_input_tokens", 0) or 0
                    record_claude_usage(op, input_tokens, output_tokens, effective_model,
                                        cache_w=cache_creation_tokens, cache_r=cache_read_tokens,
                                        session_id=session_id, user_id=user_id)
                result = "".join(text_parts)
            else:
                # 非 streaming モード: 短いリクエスト用
                response = client_with_options.messages.create(**create_kwargs)
                text_parts = []
                for block in response.content:
                    if getattr(block, "type", None) == "text":
                        text_parts.append(block.text)
                result = "\n".join(p for p in text_parts if p)
                input_tokens = getattr(response.usage, "input_tokens", 0)
                output_tokens = getattr(response.usage, "output_tokens", 0)
                cache_creation_tokens = getattr(response.usage, "cache_creation_input_tokens", 0) or 0
                cache_read_tokens = getattr(response.usage, "cache_read_input_tokens", 0) or 0
                record_claude_usage(op, input_tokens, output_tokens, effective_model,
                                    cache_w=cache_creation_tokens, cache_r=cache_read_tokens,
                                    session_id=session_id, user_id=user_id)

            # cost: モデル別単価で計算 (Sonnet/Opus/Haiku 対応)
            if "opus" in effective_model:
                _p_in_log, _p_cw_log, _p_cr_log, _p_out_log = 15.0, 18.75, 1.50, 75.0
            elif "haiku" in effective_model:
                _p_in_log, _p_cw_log, _p_cr_log, _p_out_log = 1.0, 1.25, 0.10, 5.0
            else:
                _p_in_log, _p_cw_log, _p_cr_log, _p_out_log = 3.0, 3.75, 0.30, 15.0
            cost_usd = (
                (input_tokens * _p_in_log / 1_000_000)
                + (cache_creation_tokens * _p_cw_log / 1_000_000)
                + (cache_read_tokens * _p_cr_log / 1_000_000)
                + (output_tokens * _p_out_log / 1_000_000)
            )
            elapsed = time.time() - start_time
            schema_tag = " [schema]" if used_structured else ""
            stream_tag = " [stream]" if use_streaming else ""
            logger.info(f"[CLAUDE_TEXT]{schema_tag}{stream_tag} OK in {elapsed:.2f}s, model={effective_model}, tokens in={input_tokens} out={output_tokens} cache_w={cache_creation_tokens} cache_r={cache_read_tokens}, cost=${cost_usd:.4f}")

            return result if result else "(Claude から空の応答)"

        except Exception as e:
            elapsed = time.time() - start_time
            logger.error(f"[CLAUDE_TEXT_ERROR] Failed after {elapsed:.2f}s: {type(e).__name__}: {e}")
            return f"エラー: {type(e).__name__}: {str(e)[:100]}"


    def chunk_text(text: str, chunk_size: int = CHUNK_SIZE, overlap: int = CHUNK_OVERLAP) -> List[str]:
        """テキストをチャンクに分割"""
        chunks = []
        start = 0
        text_length = len(text)
        
        while start < text_length:
            end = start + chunk_size
            chunk = text[start:end]
            
            if end < text_length and not text[end].isspace():
                last_period = chunk.rfind('。')
                last_newline = chunk.rfind('\n')
                last_break = max(last_period, last_newline)
                
                if last_break > chunk_size // 2:
                    chunk = chunk[:last_break + 1]
                    end = start + last_break + 1
            
            chunks.append(chunk.strip())
            start = end - overlap
        
        return [c for c in chunks if c]



    DOCX_EXTRACTION_METHOD = os.environ.get("DOCX_EXTRACTION_METHOD", "claude")

    def _extract_docx_paragraphs_structured(file_content: bytes):
        """docx から段落とスタイル情報(numId, ilvl)と表を構造化して抽出する。
        各段落には1始まりの通し番号 index を付与する。"""
        W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'
        def qn(tag):
            return f'{{{W_NS}}}{tag}'

        docx_file = io.BytesIO(file_content)
        doc = Document(docx_file)

        paragraphs = []
        next_idx = 1
        for para in doc.paragraphs:
            text = para.text
            if not text.strip():
                continue
            num_id = None
            ilvl = None
            pPr = para._element.find(qn('pPr'))
            if pPr is not None:
                numPr = pPr.find(qn('numPr'))
                if numPr is not None:
                    num_id_elem = numPr.find(qn('numId'))
                    ilvl_elem = numPr.find(qn('ilvl'))
                    if num_id_elem is not None:
                        num_id = int(num_id_elem.get(qn('val')))
                    if ilvl_elem is not None:
                        ilvl = int(ilvl_elem.get(qn('val')))
                    else:
                        ilvl = 0
            paragraphs.append({"index": next_idx, "text": text, "num_id": num_id, "ilvl": ilvl, "is_table": False})
            next_idx += 1

        for table in doc.tables:
            for row in table.rows:
                cells = [cell.text.strip() for cell in row.cells]
                row_text = " | ".join(c for c in cells if c)
                if row_text.strip():
                    paragraphs.append({"index": next_idx, "text": row_text, "num_id": None, "ilvl": None, "is_table": True})
                    next_idx += 1

        # numbering_part は docx に numbering 定義がない場合 NotImplementedError を投げる
        # その場合は formats を空のまま処理を続ける(リスト書式は反映されないが、テキスト抽出は可能)
        try:
            numbering_part = doc.part.numbering_part
        except NotImplementedError:
            numbering_part = None
            logger.info("[DOCX_EXTRACT] No numbering definition in docx; skipping numbering format extraction")
        formats = {}
        if numbering_part is not None:
            root = numbering_part.element
            abstract_formats = {}
            for abs_num in root.findall(qn('abstractNum')):
                abs_id = int(abs_num.get(qn('abstractNumId')))
                abstract_formats[abs_id] = {}
                for lvl in abs_num.findall(qn('lvl')):
                    lvl_ilvl = int(lvl.get(qn('ilvl')))
                    lvl_text_elem = lvl.find(qn('lvlText'))
                    if lvl_text_elem is not None:
                        abstract_formats[abs_id][lvl_ilvl] = lvl_text_elem.get(qn('val'))
            for num in root.findall(qn('num')):
                nid = int(num.get(qn('numId')))
                abs_id_elem = num.find(qn('abstractNumId'))
                if abs_id_elem is not None:
                    abs_id = int(abs_id_elem.get(qn('val')))
                    if abs_id in abstract_formats:
                        formats[nid] = abstract_formats[abs_id]

        return paragraphs, formats


    def _build_docx_numbering_prompt(paragraphs, formats):
        """Claude に採番プレフィックス(JSON配列)を生成させるプロンプト。

        各段落の本文は渡さず、番号付き段落の (index, num_id, ilvl) のみを渡す。
        Claude には番号書式定義を元に、各 index に対応する prefix 文字列を生成させる。
        本文の改変リスクをゼロにするため、本文は Python 側で保持する。
        """
        format_lines = ["# 書式定義"]
        for num_id in sorted(formats.keys()):
            format_lines.append(f"numId={num_id}:")
            for ilvl in sorted(formats[num_id].keys()):
                fmt = formats[num_id][ilvl]
                format_lines.append(f"  レベル{ilvl}: \"{fmt}\"")
        format_block = "\n".join(format_lines)

        numbered_paragraphs = [p for p in paragraphs if p.get('num_id') is not None]
        item_lines = ["# 番号付き段落の一覧 (順序どおり)"]
        for p in numbered_paragraphs:
            item_lines.append(f"index={p['index']}, numId={p['num_id']}, ilvl={p['ilvl']}")
        items_block = "\n".join(item_lines)

        header = "あなたは Word 文書の自動採番を計算する専門家です。以下の書式定義と、番号付き段落のメタ情報から、各段落の先頭に付与すべき番号プレフィックス文字列を計算してください。"

        rules_header = "# 採番のルール"
        rule1 = "- 同じ numId 内では、ilvl ごとに独立したカウンタで連番を付けます(例: numId=1, ilvl=0 は「第1条」「第2条」「第3条」…)"
        rule2 = "- ilvl が深くなった後、浅い ilvl に戻った場合、深い ilvl のカウンタは次回深くなった時にリセットされます(例: 第1条の下に(1)(2)(3)があり、第2条に移ると(1)から再開)"
        rule3 = "- 書式の %1 %2 %3 は、それぞれ ilvl=0, ilvl=1, ilvl=2 のカウンタ値で置換します"
        rule4 = "- 書式に含まれる文字(「第」「条」「(」「)」等)はリテラルとしてそのまま使います"
        rule5 = "- 書式の · (中黒) は bullet 形式を意味し、カウンタではなくその文字自体を使います"
        rule6 = "- 番号の後には半角スペース1個を付けて本文と区切ってください(例: \"第1条 \" \"(1) \")"
        rules_block = rules_header + "\n\n" + "\n".join([rule1, rule2, rule3, rule4, rule5, rule6])

        out_header = "# 出力形式"
        out1 = "- 番号付き段落の一覧と全く同じ順序・同じ index で、JSON 配列を返してください"
        out2 = "- 各要素は {\"index\": 段落index, \"prefix\": 番号プレフィックス文字列} の形式"
        out3 = "- 例: [{\"index\": 3, \"prefix\": \"第1条 \"}, {\"index\": 5, \"prefix\": \"(1) \"}, ...]"
        out4 = "- JSON 配列以外の前置き・後書き・コードブロック記号は一切不要、JSON だけを返してください"
        out5 = "- 配列の要素数は、与えられた番号付き段落の数と完全に一致させてください"
        output_block = out_header + "\n\n" + "\n".join([out1, out2, out3, out4, out5])

        tail = "では採番プレフィックスの JSON 配列を出力してください:"

        return "\n\n".join([header, format_block, items_block, rules_block, output_block, tail])


    def _extract_text_from_docx_plain(file_content: bytes) -> str:
        """python-docx で段落・表を抽出する従来方式(採番なし)。"""
        docx_file = io.BytesIO(file_content)
        doc = Document(docx_file)
        text = ""
        for para in doc.paragraphs:
            if para.text.strip():
                text += para.text + "\n"
        for table in doc.tables:
            for row in table.rows:
                row_text = " | ".join([cell.text.strip() for cell in row.cells])
                if row_text.strip():
                    text += row_text + "\n"
        return text.strip()


    def _parse_claude_prefix_json(result: str):
        """Claude の返答から JSON 配列を取り出して {index: prefix} の辞書にする。
        失敗時は None を返す。"""
        stripped = result.strip()
        if stripped.startswith("```"):
            lines = stripped.split("\n")
            if lines and lines[0].startswith("```"):
                lines = lines[1:]
            if lines and lines[-1].startswith("```"):
                lines = lines[:-1]
            stripped = "\n".join(lines).strip()
        start = stripped.find("[")
        end = stripped.rfind("]")
        if start < 0 or end < 0 or end <= start:
            return None
        candidate = stripped[start:end+1]
        try:
            parsed = json.loads(candidate)
        except Exception:
            return None
        if not isinstance(parsed, list):
            return None
        prefix_map = {}
        for item in parsed:
            if not isinstance(item, dict):
                continue
            idx = item.get("index")
            prefix = item.get("prefix", "")
            if isinstance(idx, int) and isinstance(prefix, str):
                prefix_map[idx] = prefix
        return prefix_map


    def _render_paragraphs_with_prefixes(paragraphs, prefix_map):
        """段落リストに prefix を適用してテキストを生成する(本文は python-docx のまま)。"""
        lines = []
        for p in paragraphs:
            text = p['text']
            prefix = prefix_map.get(p['index'], "")
            if prefix:
                lines.append(prefix + text)
            else:
                lines.append(text)
        return "\n".join(lines)


    def extract_text_from_docx(file_content: bytes) -> str:
        """Wordファイルからテキスト抽出。自動採番は Claude に prefix を計算させる方式。
        本文は python-docx から取得したものをそのまま使い、Claude には prefix のみ生成させる。
        """
        if Document is None:
            raise HTTPException(status_code=500, detail="python-docx not installed")

        if DOCX_EXTRACTION_METHOD != "claude":
            return _extract_text_from_docx_plain(file_content)

        try:
            paragraphs, formats = _extract_docx_paragraphs_structured(file_content)
            if not paragraphs:
                return ""
            numbered = [p for p in paragraphs if p.get('num_id') is not None]
            if not numbered:
                logger.info("[DOCX_EXTRACT] No numbered paragraphs, using plain extraction")
                return _extract_text_from_docx_plain(file_content)

            prompt = _build_docx_numbering_prompt(paragraphs, formats)
            logger.info(f"[DOCX_EXTRACT] Calling Claude for prefix generation: {len(paragraphs)} total paragraphs, {len(numbered)} numbered, {len(prompt)} chars prompt")
            docx_system_prompt = "You are a numbering expansion engine. Respond with ONLY a JSON array. Do NOT include any preamble, explanation, or markdown code fences. Do NOT start with phrases like 'I will', 'Here is', 'Let me', 'I\\'ll', or any thinking-out-loud text. The first character of your response must be '[' and the last must be ']'."
            docx_response_schema = {
                "type": "array",
                "items": {
                    "type": "object",
                    "properties": {
                        "index": {"type": "integer"},
                        "prefix": {"type": "string"}
                    },
                    "required": ["index", "prefix"],
                    "additionalProperties": False
                }
            }
            result = generate_claude_text(prompt, max_tokens=8000, temperature=0.0, timeout=300, max_retries=0, system=docx_system_prompt, response_schema=docx_response_schema, op="docx_extract")
            if not result or result.startswith("エラー:"):
                logger.warning(f"[DOCX_EXTRACT] Claude failed with structured output, retrying without schema: {result[:150] if result else 'empty'}")
                result = generate_claude_text(prompt, max_tokens=8000, temperature=0.0, timeout=300, max_retries=0, system=docx_system_prompt, op="docx_extract")
                if not result or result.startswith("エラー:"):
                    logger.warning(f"[DOCX_EXTRACT] Claude retry also failed, falling back to plain: {result[:100] if result else 'empty'}")
                    return _extract_text_from_docx_plain(file_content)

            prefix_map = _parse_claude_prefix_json(result)
            if prefix_map is None:
                logger.warning(f"[DOCX_EXTRACT] Failed to parse JSON, falling back to plain. First 200 chars: {result[:200]}")
                return _extract_text_from_docx_plain(file_content)

            missing = [p['index'] for p in numbered if p['index'] not in prefix_map]
            if missing:
                logger.warning(f"[DOCX_EXTRACT] Claude returned {len(prefix_map)} prefixes but {len(missing)} numbered paragraphs are missing (first missing indices: {missing[:5]}). Falling back to plain.")
                return _extract_text_from_docx_plain(file_content)

            rendered = _render_paragraphs_with_prefixes(paragraphs, prefix_map)
            logger.info(f"[DOCX_EXTRACT] Successfully rendered {len(paragraphs)} paragraphs with {len(prefix_map)} prefixes, total {len(rendered)} chars")
            return rendered
        except Exception as e:
            logger.error(f"[DOCX_EXTRACT] Error during Claude extraction, falling back to plain: {type(e).__name__}: {e}", exc_info=True)
            return _extract_text_from_docx_plain(file_content)


    def extract_chunks_from_xlsx_with_context(file_content: bytes) -> List[str]:
        """Excelファイルから行単位でチャンク抽出"""
        if load_workbook is None:
            raise HTTPException(status_code=500, detail="openpyxl not installed")
        
        xlsx_file = io.BytesIO(file_content)
        wb = load_workbook(xlsx_file, data_only=True)
        
        chunks = []
        for sheet_name in wb.sheetnames:
            sheet = wb[sheet_name]
            
            headers = []
            for cell in sheet[1]:
                if cell.value:
                    headers.append(str(cell.value))
                else:
                    headers.append("")
            
            header_str = " | ".join([h for h in headers if h])
            
            rows_data = []
            for row_idx, row in enumerate(sheet.iter_rows(min_row=2, values_only=True), start=2):
                if all(cell is None or str(cell).strip() == '' for cell in row):
                    continue
                
                row_data = []
                for idx, cell in enumerate(row):
                    if cell is not None and str(cell).strip():
                        if idx < len(headers) and headers[idx]:
                            row_data.append(f"{headers[idx]}: {cell}")
                        else:
                            row_data.append(str(cell))
                
                if row_data:
                    rows_data.append(" | ".join(row_data))
            
            for row_text in rows_data:
                chunk = f"[シート: {sheet_name}]\n項目: {header_str}\nデータ: {row_text}"
                chunks.append(chunk)
        
        return chunks


    def extract_text_from_pptx(file_content: bytes) -> str:
        """PowerPointファイルからテキスト抽出"""
        if Presentation is None:
            raise HTTPException(status_code=500, detail="python-pptx not installed")
        
        pptx_file = io.BytesIO(file_content)
        prs = Presentation(pptx_file)
        
        text = ""
        for slide_idx, slide in enumerate(prs.slides, start=1):
            text += f"\n=== スライド {slide_idx} ===\n"
            
            for shape in slide.shapes:
                if hasattr(shape, "text") and shape.text.strip():
                    text += shape.text + "\n"
                
                if shape.has_table:
                    table = shape.table
                    for row in table.rows:
                        row_text = " | ".join([cell.text.strip() for cell in row.cells])
                        if row_text.strip():
                            text += row_text + "\n"
        
        return text.strip()


    def extract_text_from_pdf(file_content: bytes) -> str:

        """PDFファイルからテキスト抽出（テキスト不足時はOCRにフォールバック）"""

        if not PYPDF_AVAILABLE:

            raise HTTPException(status_code=500, detail="pypdf not installed")

        pdf_file = io.BytesIO(file_content)

        reader = pypdf.PdfReader(pdf_file)

        text = ""

        for page in reader.pages:

            page_text = page.extract_text()

            if page_text:

                text += page_text + "\n"

        if len(text.strip()) > 100:
            logger.info(f"[PDF] Text extracted by pypdf: {len(text)} chars")
            return text.strip()

        logger.info(f"[PDF] pypdf extracted only {len(text.strip())} chars, trying OCR...")
        try:
            return extract_text_from_pdf_ocr(file_content)
        except Exception as e:
            logger.warning(f"[PDF] OCR fallback failed: {e}")
            if text.strip():
                return text.strip()
            raise HTTPException(status_code=400, detail="PDFからテキストを抽出できませんでした")


    def extract_text_from_pdf_ocr(file_content: bytes) -> str:
        """PDFファイルからOCRでテキスト抽出（強制OCRモード）"""
        try:
            import pytesseract
            from pdf2image import convert_from_bytes
        except ImportError:
            raise HTTPException(status_code=500, detail="OCRライブラリが利用できません（pytesseract/pdf2imageが未インストール）")
        
        try:
            logger.info("[PDF_OCR] Force OCR mode: converting PDF to images...")
            images = convert_from_bytes(file_content, dpi=300)
            logger.info(f"[PDF_OCR] Converted {len(images)} pages to images")
            
            ocr_text = ""
            for i, image in enumerate(images):
                page_text = pytesseract.image_to_string(image, lang='jpn+eng')
                if page_text.strip():
                    ocr_text += page_text + "\n"
                logger.info(f"[PDF_OCR] Page {i+1}/{len(images)}: {len(page_text)} chars")
            
            if ocr_text.strip():
                logger.info(f"[PDF_OCR] Total OCR text: {len(ocr_text)} chars")
                return ocr_text.strip()
            else:
                raise HTTPException(status_code=400, detail="OCRでテキストを抽出できませんでした")
        except HTTPException:
            raise
        except Exception as e:
            logger.error(f"[PDF_OCR] OCR failed: {e}")
            raise HTTPException(status_code=500, detail=f"OCR処理でエラーが発生しました: {str(e)}")


    # Google Drive OAuth トークンの永続化先 (MinIO primary)。
    # /model-cache は emptyDir / PVC キャッシュで Pod 再起動・PVC 再作成で消えるため、
    # MinIO (bucket=MINIO_BUCKET, object=gdrive/token.json) を source of truth とする。
    GDRIVE_TOKEN_MINIO_OBJECT = "gdrive/token.json"


    def _gdrive_token_load_from_minio():

        """MinIO から gdrive token を JSON dict として読み込む。 無ければ None。"""

        global minio_client

        if minio_client is None:

            return None

        resp = None

        try:

            resp = minio_client.get_object(MINIO_BUCKET, GDRIVE_TOKEN_MINIO_OBJECT)

            raw = resp.read()

            return json.loads(raw.decode("utf-8"))

        except Exception as e:

            err_str = str(e)

            if "NoSuchKey" in err_str or "NoSuchObject" in err_str or "code: NoSuch" in err_str:

                return None

            logger.warning(f"[GDRIVE] MinIO get failed: {type(e).__name__}: {err_str[:200]}")

            return None

        finally:

            if resp is not None:

                try:

                    resp.close()

                    resp.release_conn()

                except Exception:

                    pass


    def _gdrive_token_save_to_minio(token_data):

        """MinIO に gdrive token を JSON として保存する。 成功なら True。"""

        global minio_client

        if minio_client is None:

            return False

        try:

            import io as _io

            raw = json.dumps(token_data, ensure_ascii=False).encode("utf-8")

            minio_client.put_object(

                MINIO_BUCKET,

                GDRIVE_TOKEN_MINIO_OBJECT,

                _io.BytesIO(raw),

                len(raw),

                content_type="application/json",

            )

            return True

        except Exception as e:

            logger.error(f"[GDRIVE] MinIO put failed: {type(e).__name__}: {str(e)[:200]}")

            return False


    def load_gdrive_credentials():

        """保存済みOAuth2トークンを読み込む。期限切れの場合はリフレッシュ。

        プライマリは MinIO。 MinIO に無ければ legacy PVC ファイルを読み、 取得できたら MinIO に書き戻して自動移行する。
        """

        if not GDRIVE_AVAILABLE:

            return None

        # 1. プライマリ (MinIO) を試す

        token_data = _gdrive_token_load_from_minio()

        # 2. legacy フォールバック (PVC ファイル) を試す。 取得できたら MinIO へ自動移行。

        if token_data is None and os.path.exists(GDRIVE_TOKEN_PATH):

            try:

                with open(GDRIVE_TOKEN_PATH, "r") as _f:

                    token_data = json.load(_f)

                if _gdrive_token_save_to_minio(token_data):

                    logger.info("[GDRIVE] Migrated legacy PVC token to MinIO")

            except Exception as e:

                logger.error(f"[GDRIVE] Failed to load legacy PVC token: {e}")

                token_data = None

        if token_data is None:

            return None

        try:

            creds = Credentials(

                token=token_data.get("token"),

                refresh_token=token_data.get("refresh_token"),

                token_uri="https://oauth2.googleapis.com/token",

                client_id=GOOGLE_CLIENT_ID,

                client_secret=GOOGLE_CLIENT_SECRET,

                scopes=GDRIVE_SCOPES

            )

            if creds.expired and creds.refresh_token:

                creds.refresh(Request())

                save_gdrive_credentials(creds)

                logger.info("[GDRIVE] Token refreshed")

            return creds

        except Exception as e:

            logger.error(f"[GDRIVE] Failed to load credentials: {e}")

            return None


    def save_gdrive_credentials(creds):

        """OAuth2トークンを保存する。 プライマリは MinIO、 PVC は性能用キャッシュ。"""

        token_data = {

            "token": creds.token,

            "refresh_token": creds.refresh_token,

            "expiry": creds.expiry.isoformat() if creds.expiry else None

        }

        # 1. MinIO に必須保存 (Pod 再起動・PVC 再作成でも残る)

        minio_ok = _gdrive_token_save_to_minio(token_data)

        if not minio_ok:

            logger.warning("[GDRIVE] MinIO save failed; PVC のみに保存します (Pod 再起動で消失します)")

        # 2. PVC キャッシュにも書く (性能用、 失敗しても致命的ではない)

        try:

            os.makedirs(os.path.dirname(GDRIVE_TOKEN_PATH), exist_ok=True)

            with open(GDRIVE_TOKEN_PATH, "w") as _f:

                json.dump(token_data, _f)

        except Exception as e:

            logger.warning(f"[GDRIVE] PVC cache write failed: {e}")

        if minio_ok:

            logger.info("[GDRIVE] Token saved (MinIO primary, PVC cache)")


    def create_or_get_collection(user_id: str):
        """コレクション作成または取得"""
        collection_name = get_collection_name(user_id)
        
        if utility.has_collection(collection_name):
            return Collection(collection_name)
        else:
            fields = [
                FieldSchema(name="id", dtype=DataType.INT64, is_primary=True, auto_id=True),
                FieldSchema(name="text", dtype=DataType.VARCHAR, max_length=5000),
                FieldSchema(name="embedding", dtype=DataType.FLOAT_VECTOR, dim=EMBEDDING_DIM)
            ]
            schema = CollectionSchema(fields=fields)
            collection = Collection(name=collection_name, schema=schema)
            
            index_params = {
                "metric_type": "IP",
                "index_type": "IVF_FLAT",
                "params": {"nlist": 128}
            }
            collection.create_index(field_name="embedding", index_params=index_params)
            return collection


    @app.on_event("startup")
