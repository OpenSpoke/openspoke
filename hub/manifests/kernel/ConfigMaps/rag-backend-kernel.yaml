    @app.on_event("shutdown")
    async def shutdown():
        global neo4j_driver, _scheduler_task, _scheduler_stop
        # スケジューラループを停止
        _scheduler_stop = True
        if _scheduler_task is not None:
            try:
                _scheduler_task.cancel()
                logger.info("Scheduler: stop requested")
            except Exception as e:
                logger.warning(f"Scheduler: shutdown cancel error: {e}")
        if neo4j_driver:
            neo4j_driver.close()
            logger.info("Memgraph connection closed")


    @app.get("/health")
    async def health():
