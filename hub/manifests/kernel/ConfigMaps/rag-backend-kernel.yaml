    )

    @app.post("/core/asr/transcribe")
    async def core_asr_transcribe(request: dict):
        """音声ファイルを文字起こしする。

        Body:
            {
              "filename": "voice.webm",                    # 必須 (拡張子で format ヒント)
              "content_base64": "GkXfo59ChoEB...",         # 必須 (元音声を base64 化したもの)
              "mime_type": "audio/webm",                   # 任意 (省略時 application/octet-stream)
              "timeout": 120                               # 任意 (秒、 省略時 120)
            }
        Returns:
            {
              "ok": bool,
              "text": str | null,                          # 文字起こし結果 (全文)
              "language": str | null,                      # 検出言語 (通常 "ja")
              "duration": float | null,                    # 音声の秒数
              "elapsed": float | null,                     # 処理時間 (秒)
              "segments": list | null,                     # 区間ごとの結果
              "error": str | null,
              "status_code": int
            }
        失敗時も例外は投げない (ok=false で返す、 呼び出し側で扱いやすい)。
        """
        filename = request.get("filename") or ""
        content_b64 = request.get("content_base64") or ""
        mime_type = request.get("mime_type") or "application/octet-stream"
        timeout = float(request.get("timeout", 120))

        if not filename:
            return {"ok": False, "text": None, "error": "filename is required", "status_code": 0}
        if not content_b64:
            return {"ok": False, "text": None, "error": "content_base64 is required", "status_code": 0}

        try:
            content = base64.b64decode(content_b64)
        except Exception as e:
            return {"ok": False, "text": None, "error": f"base64 decode failed: {e}", "status_code": 0}

        try:
            files = {"file": (filename, content, mime_type)}
            r = requests.post(f"{ASR_SERVER_URL}/transcribe", files=files, timeout=timeout)
            status_code = r.status_code
            if status_code != 200:
                detail = ""
                try:
                    detail = r.json().get("detail", "")
                except Exception:
                    detail = r.text[:300]
                logger.error(f"[ASR_TRANSCRIBE] failed: status={status_code} filename={filename} detail={detail}")
                return {"ok": False, "text": None, "error": f"HTTP {status_code}: {detail[:300]}", "status_code": status_code}

            body = r.json()
            text = body.get("text", "") or ""
            duration = body.get("duration") or 0.0
            elapsed = body.get("elapsed") or 0.0
            logger.info(
                f"[ASR_TRANSCRIBE] OK: {filename} {len(content)} bytes "
                f"dur={duration:.2f}s elapsed={elapsed:.2f}s chars={len(text)}"
            )
            return {
                "ok": True,
                "text": text,
                "language": body.get("language"),
                "duration": duration,
                "elapsed": elapsed,
                "segments": body.get("segments"),
                "error": None,
                "status_code": status_code,
            }
        except requests.exceptions.RequestException as e:
            logger.error(f"[ASR_TRANSCRIBE] network error: {e}")
            return {"ok": False, "text": None, "error": f"network error: {str(e)[:200]}", "status_code": 0}
        except Exception as e:
            logger.error(f"[ASR_TRANSCRIBE] unexpected error: {e}", exc_info=True)
            return {"ok": False, "text": None, "error": f"{type(e).__name__}: {str(e)[:200]}", "status_code": 0}


    # ----------------------------------------------------------------------
    # TTS (Text-to-Speech / 音声合成)
    # ----------------------------------------------------------------------
    # 「テキスト → 音声」 という抽象機能を kernel が提供する。 実装 (現在は
    # voice/tts-server Pod = Style-Bert-VITS2 / jvnv-F1-jp) は kernel に隠蔽し、
    # 呼び出し元アプリは URL も実装方式も知る必要がない。

    TTS_SERVER_URL = os.environ.get(
        "TTS_SERVER_URL",
        "http://tts-server.voice.svc.cluster.local:8000",
    )

    @app.post("/core/tts/synthesize")
    async def core_tts_synthesize(request: dict):
        """テキストを音声合成して WAV (base64) を返す。

        Body:
            {
              "text": "こんにちは",                          # 必須
              "style": "Neutral",                            # 任意 (jvnv モデルの感情)
              "speaker_id": 0,                               # 任意
              "length": 1.0,                                 # 任意 (話速、 大きいほど遅い)
              "timeout": 120                                 # 任意 (秒、 省略時 120)
            }
        Returns:
            {
              "ok": bool,
              "audio_base64": str | null,                    # WAV (PCM16) を base64 化
              "content_type": str | null,                    # "audio/wav"
              "sample_rate": int | null,
              "duration": float | null,                      # 音声の秒数
              "elapsed": float | null,                       # 処理時間 (秒)
              "error": str | null,
              "status_code": int
            }
        失敗時も例外は投げない (ok=false で返す、 呼び出し側で扱いやすい)。
        """
        text = (request.get("text") or "").strip()
        timeout = float(request.get("timeout", 120))

        if not text:
            return {"ok": False, "audio_base64": None, "error": "text is required", "status_code": 0}

        payload = {"text": text}
        if request.get("style"):
            payload["style"] = request.get("style")
        if request.get("speaker_id") is not None:
            payload["speaker_id"] = int(request.get("speaker_id"))
        if request.get("length") is not None:
            payload["length"] = float(request.get("length"))

        try:
            r = requests.post(f"{TTS_SERVER_URL}/synthesize", json=payload, timeout=timeout)
            status_code = r.status_code
            if status_code != 200:
                detail = ""
                try:
                    detail = r.json().get("detail", "")
                except Exception:
                    detail = r.text[:300]
                logger.error(f"[TTS_SYNTHESIZE] failed: status={status_code} chars={len(text)} detail={detail}")
                return {"ok": False, "audio_base64": None, "error": f"HTTP {status_code}: {detail[:300]}", "status_code": status_code}

            audio = r.content
            try:
                sample_rate = int(r.headers.get("X-TTS-Sample-Rate") or 0)
            except Exception:
                sample_rate = 0
            try:
                duration = float(r.headers.get("X-TTS-Duration") or 0.0)
            except Exception:
                duration = 0.0
            try:
                elapsed = float(r.headers.get("X-TTS-Elapsed") or 0.0)
            except Exception:
                elapsed = 0.0
            audio_b64 = base64.b64encode(audio).decode("ascii")
            logger.info(
                f"[TTS_SYNTHESIZE] OK: chars={len(text)} bytes={len(audio)} "
                f"dur={duration:.2f}s elapsed={elapsed:.2f}s"
            )
            return {
                "ok": True,
                "audio_base64": audio_b64,
                "content_type": r.headers.get("Content-Type") or "audio/wav",
                "sample_rate": sample_rate,
                "duration": duration,
                "elapsed": elapsed,
                "error": None,
                "status_code": status_code,
            }
        except requests.exceptions.RequestException as e:
            logger.error(f"[TTS_SYNTHESIZE] network error: {e}")
            return {"ok": False, "audio_base64": None, "error": f"network error: {str(e)[:200]}", "status_code": 0}
        except Exception as e:
            logger.error(f"[TTS_SYNTHESIZE] unexpected error: {e}", exc_info=True)
            return {"ok": False, "audio_base64": None, "error": f"{type(e).__name__}: {str(e)[:200]}", "status_code": 0}


    # ----------------------------------------------------------------------
    # Web fetch (URL からテキスト本体を取得する汎用エンドポイント)
    # ----------------------------------------------------------------------
    # 既存の WebContentFetcher (web_content_fetcher.py) を流用。
    # アプリケーション (the assistant、 その他) や外部 LLM (MCP server 経由)
    # から呼ばれる汎用 Web 取得機能を提供する。
    #
    # 実装方針:
    #   - リクエストごとに WebContentFetcher を新規生成 (timeout/max_content_length を都度上書きするため)
    #   - 既存のグローバル web_fetcher (RAG 用、 800 字制限) には触らない
    #   - text/html, text/plain 以外の Content-Type は弾く (WebContentFetcher の仕様)
    #
    # セキュリティ:
    #   - SSRF 対策は当面なし (内部開発環境向け)。 本番運用で必要になったら追加
    #   - User-Agent は WebContentFetcher が Mozilla/5.0 系を設定済


    @app.post("/core/web/fetch")
    async def core_web_fetch(request: dict):
        """指定 URL の Web ページ本体テキストを取得する。

        Body:
            {
              "url": "https://example.com/article",   # 必須
              "max_content_length": 5000,              # 省略時 5000
              "timeout": 10                            # 省略時 10 秒
            }
        Returns:
            {
              "ok": bool,
              "url": str,
              "content": str | null,        # 取得テキスト (max_content_length で切り詰め済)
              "original_length": int,        # 切り詰め前の文字数 (取得失敗時は 0)
              "truncated": bool,
              "error": str | null
            }
        """
        url = (request.get("url") or "").strip()
        max_content_length = int(request.get("max_content_length") or 5000)
        timeout = int(request.get("timeout") or 10)

        if not url:
            return {"ok": False, "url": "", "content": None, "original_length": 0,
                    "truncated": False, "error": "url is required"}
        if not (url.startswith("http://") or url.startswith("https://")):
            return {"ok": False, "url": url, "content": None, "original_length": 0,
                    "truncated": False, "error": "url must start with http:// or https://"}
        if max_content_length < 1 or max_content_length > 200000:
            return {"ok": False, "url": url, "content": None, "original_length": 0,
                    "truncated": False, "error": "max_content_length must be 1-200000"}
        if timeout < 1 or timeout > 60:
            return {"ok": False, "url": url, "content": None, "original_length": 0,
                    "truncated": False, "error": "timeout must be 1-60 seconds"}

        try:
            # リクエストごとに新しい instance を生成 (timeout/max_content_length が引数で渡せないため)
            fetcher = WebContentFetcher(timeout=timeout, max_content_length=max_content_length)
            content = fetcher.fetch_content(url)

            if content is None:
                # WebContentFetcher 内で warning ログは出ているので、 ここではエラー文字列だけ返す
                return {"ok": False, "url": url, "content": None, "original_length": 0,
                        "truncated": False, "error": "fetch failed (timeout/HTTP error/unsupported content-type)"}

            # WebContentFetcher は max_content_length を超えると "...(以下省略)" を付ける
            truncated = content.endswith("\n... (以下省略)")
            # truncated 判定のため、 内部で original_length を見たいが、
            # WebContentFetcher は返してくれない。 切り詰め後のサイズで近似的に判定する。
            # truncated=True なら最低でも max_content_length に達している。
            original_length = len(content)
            if truncated:
                # 切り詰め前のサイズは取得できないので、 切り詰め後 + 補足分として最低でも max_content_length 以上
                original_length = max_content_length  # 推定値、 厳密ではない

            return {
                "ok": True,
                "url": url,
                "content": content,
                "original_length": original_length,
                "truncated": truncated,
                "error": None,
            }
        except Exception as e:
            logger.error(f"[WEB_FETCH] unexpected error for {url}: {e}", exc_info=True)
            return {"ok": False, "url": url, "content": None, "original_length": 0,
                    "truncated": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/web/fetch-batch")
    async def core_web_fetch_batch(request: dict):
        """複数 URL を並列取得する。

        Body:
            {
              "urls": ["https://...", "https://..."],   # 必須 (1〜20 件)
              "max_content_length": 5000,                # 省略時 5000
              "timeout": 10,                             # 省略時 10 秒
              "max_workers": 3                           # 並列度、 省略時 3 (1〜10)
            }
        Returns:
            {
              "ok": bool,
              "results": [
                {"url": str, "ok": bool, "content": str | null, "original_length": int,
                 "truncated": bool, "error": str | null},
                ...
              ],
              "fetched_count": int,        # ok=True の件数
              "elapsed_sec": float
            }
        """
        urls = request.get("urls") or []
        max_content_length = int(request.get("max_content_length") or 5000)
        timeout = int(request.get("timeout") or 10)
        max_workers = int(request.get("max_workers") or 3)

        if not isinstance(urls, list) or not urls:
            return {"ok": False, "results": [], "fetched_count": 0, "elapsed_sec": 0.0,
                    "error": "urls must be a non-empty list"}
        if len(urls) > 20:
            return {"ok": False, "results": [], "fetched_count": 0, "elapsed_sec": 0.0,
                    "error": "too many urls (max 20)"}
        if max_content_length < 1 or max_content_length > 200000:
            return {"ok": False, "results": [], "fetched_count": 0, "elapsed_sec": 0.0,
                    "error": "max_content_length must be 1-200000"}
        if timeout < 1 or timeout > 60:
            return {"ok": False, "results": [], "fetched_count": 0, "elapsed_sec": 0.0,
                    "error": "timeout must be 1-60 seconds"}
        if max_workers < 1 or max_workers > 10:
            return {"ok": False, "results": [], "fetched_count": 0, "elapsed_sec": 0.0,
                    "error": "max_workers must be 1-10"}

        import time as _time
        start = _time.time()
        try:
            fetcher = WebContentFetcher(timeout=timeout, max_content_length=max_content_length)
            url_contents = fetcher.fetch_urls_parallel(urls, max_workers=max_workers)

            results = []
            fetched_count = 0
            for url in urls:  # 入力順を保持
                content = url_contents.get(url)
                if content is None:
                    results.append({
                        "url": url, "ok": False, "content": None,
                        "original_length": 0, "truncated": False,
                        "error": "fetch failed",
                    })
                else:
                    truncated = content.endswith("\n... (以下省略)")
                    original_length = max_content_length if truncated else len(content)
                    results.append({
                        "url": url, "ok": True, "content": content,
                        "original_length": original_length, "truncated": truncated,
                        "error": None,
                    })
                    fetched_count += 1

            elapsed = _time.time() - start
            return {
                "ok": True,
                "results": results,
                "fetched_count": fetched_count,
                "elapsed_sec": round(elapsed, 3),
            }
        except Exception as e:
            elapsed = _time.time() - start
            logger.error(f"[WEB_FETCH_BATCH] unexpected error: {e}", exc_info=True)
            return {
                "ok": False, "results": [], "fetched_count": 0,
                "elapsed_sec": round(elapsed, 3),
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }


    # ----------------------------------------------------------------------
    # GitHub Contents API (ファイル単位 commit / push)
    # ----------------------------------------------------------------------
    # 既存の GitHubAPIClient を流用。 GITHUB_TOKEN は環境変数から取得済。
    # 1 ファイル = 1 commit。 git clone は不要。 ブランチも指定可 (省略時は default branch)。
    #
    # 想定ユースケース:
    #   - わたくし (the assistant) や外部 LLM が ConfigMap 等のマニフェストを直接 commit
    #   - Fleet が pull → クラスタに自動 apply
    #
    # 認証: 既存の GITHUB_TOKEN (repo スコープ) を共用
    # 検証: なし (運用で制御、 the operator相談済)




    @app.post("/core/github/push-from-knowledge")
    async def core_github_push_from_knowledge(request: dict):
        """知識ベースに staging されたコード片を結合して GitHub に push する。

        Claude (外部 LLM) は応答 token 制約により大きなファイル全体を 1 回で
        引数として渡せない。 そこで:
          1. Claude が upsert_knowledge で 1 ファイルを複数 part に分けて知識ベースに保存
             (id 規約: github_staging_{staging_id}_part_{NNN}, 3 桁 0 埋め)
          2. このエンドポイントが該当 part を全て収集 → id 順で結合 → GitHub に push
          3. 成功したら staging エントリを自動削除 (delete_after_push=true)

        部分的な存在チェック・並べ替え失敗の検出 (連番に欠番があれば失敗扱い) を行うため、
        中途半端な状態のままで push される事故を防ぐ。

        Body:
            {
              "namespace":  "example_tenant",                  # 必須 (知識ベースのテナント)
              "staging_id": "kernel_20260506",                  # 必須 (part 群を束ねる識別子)
              "owner":      "your-org",                        # 必須
              "repo":       "rag",                              # 必須
              "path":       "your-path/manifests/.../foo.yaml",    # 必須
              "message":    "kernel: add staging API",          # 必須 (commit message)
              "branch":     "main",                             # 任意 (省略時は default branch)
              "delete_after_push": true                         # 任意 (default true)
            }
        Returns:
            {
              "ok": bool,
              "action": "created" | "updated" | null,
              "commit_sha": str,
              "html_url": str,
              "total_parts": int,
              "total_bytes": int,
              "deleted_parts": int,        # 後始末で削除した staging エントリ数
              "error": str | null
            }
        """
        namespace = (request.get("namespace") or "").strip()
        staging_id = (request.get("staging_id") or "").strip()
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        message = (request.get("message") or "").strip()
        branch = request.get("branch") or None
        delete_after_push = bool(request.get("delete_after_push", True))

        # 1. 入力検証
        if not namespace:
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "total_parts": 0, "total_bytes": 0, "deleted_parts": 0,
                    "error": "namespace is required"}
        if not staging_id:
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "total_parts": 0, "total_bytes": 0, "deleted_parts": 0,
                    "error": "staging_id is required"}
        # staging_id は安全なら英数+アンダースコア (Milvus expr に埋め込むため)
        for c in staging_id:
            if not (c.isascii() and (c.isalnum() or c == "_")):
                return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                        "total_parts": 0, "total_bytes": 0, "deleted_parts": 0,
                        "error": f"staging_id contains invalid character ('{c}')"}
        if not owner or not repo or not path:
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "total_parts": 0, "total_bytes": 0, "deleted_parts": 0,
                    "error": "owner, repo, path are required"}
        if not message:
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "total_parts": 0, "total_bytes": 0, "deleted_parts": 0,
                    "error": "commit message is required"}

        try:
            from github_account import resolve_github_token
            github_token = resolve_github_token(request.get("user_id"))
        except Exception as _e:
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "total_parts": 0, "total_bytes": 0, "deleted_parts": 0,
                    "error": f"github token unavailable: {_e}"}

        # 2. 知識ベースから part 群を収集
        collection_name = _knowledge_resolve_collection(namespace)
        if not utility.has_collection(collection_name):
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "total_parts": 0, "total_bytes": 0, "deleted_parts": 0,
                    "error": f"knowledge collection not found: {collection_name}"}

        try:
            collection = Collection(collection_name)
            collection.load()
            id_prefix = f"github_staging_{staging_id}_part_"
            # Milvus は LIKE 演算子をサポート (% は任意文字列)
            results = collection.query(
                expr=f'id like "{id_prefix}%"',
                output_fields=["id", "content"],
                limit=1000,
            )
        except Exception as e:
            logger.error(f"[GITHUB_PUSH_KB] query failed: {e}", exc_info=True)
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "total_parts": 0, "total_bytes": 0, "deleted_parts": 0,
                    "error": f"knowledge query failed: {type(e).__name__}: {str(e)[:200]}"}

        if not results:
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "total_parts": 0, "total_bytes": 0, "deleted_parts": 0,
                    "error": f"no staging parts found for id_prefix={id_prefix}"}

        # 3. id 文字列の自然ソート (3 桁 0 埋めの前提で文字列比較が正しく機能する)
        results.sort(key=lambda r: r.get("id", ""))

        # 4. 連番欠番チェック (part_001, part_002, ... が連続しているか)
        expected_seq = 1
        sequence_errors = []
        for r in results:
            entry_id = r.get("id", "")
            # id_prefix の後ろの数字部分を取り出す
            try:
                seq_str = entry_id[len(id_prefix):]
                seq = int(seq_str)
            except (ValueError, IndexError):
                sequence_errors.append(f"invalid id format: {entry_id}")
                continue
            if seq != expected_seq:
                sequence_errors.append(f"expected part_{expected_seq:03d}, got part_{seq:03d}")
                # 連番が崩れていてもチェックは続ける (全エラーを報告)
            expected_seq = seq + 1

        if sequence_errors:
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "total_parts": len(results), "total_bytes": 0, "deleted_parts": 0,
                    "error": f"sequence error: {'; '.join(sequence_errors[:5])}"}

        # 5. content を結合
        combined_content = "".join(r.get("content", "") for r in results)
        total_parts = len(results)
        total_bytes = len(combined_content.encode("utf-8"))
        logger.info(f"[GITHUB_PUSH_KB] combined {total_parts} parts, {total_bytes} bytes for staging_id={staging_id}")

        # 6. GitHub に push
        try:
            client = GitHubAPIClient(token=github_token)
            push_result = client.put_file(owner=owner, repo=repo, path=path,
                                          content=combined_content, message=message, branch=branch)
        except Exception as e:
            logger.error(f"[GITHUB_PUSH_KB] put_file failed: {e}", exc_info=True)
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "total_parts": total_parts, "total_bytes": total_bytes, "deleted_parts": 0,
                    "error": f"push failed: {type(e).__name__}: {str(e)[:200]}"}

        if not push_result.get("ok"):
            return {"ok": False, "action": None, "commit_sha": "", "html_url": "",
                    "total_parts": total_parts, "total_bytes": total_bytes, "deleted_parts": 0,
                    "error": push_result.get("error", "unknown push error")}

        # 7. 後始末: staging エントリを削除 (delete_after_push=true の場合)
        deleted_parts = 0
        if delete_after_push:
            try:
                # 全 staging id を集めて 1 回の delete で済ませる
                staging_ids = [r.get("id") for r in results if r.get("id")]
                if staging_ids:
                    quoted_ids = ", ".join(f'"{sid}"' for sid in staging_ids)
                    collection.delete(expr=f"id in [{quoted_ids}]")
                    collection.flush()
                    deleted_parts = len(staging_ids)
                    logger.info(f"[GITHUB_PUSH_KB] cleaned up {deleted_parts} staging entries")
            except Exception as e:
                # クリーンアップ失敗は push 自体を失敗扱いにしない (ログだけ出す)
                logger.warning(f"[GITHUB_PUSH_KB] cleanup failed (push itself succeeded): {e}")

        return {
            "ok": True,
            "action": push_result.get("action"),
            "commit_sha": push_result.get("commit_sha", ""),
            "html_url": push_result.get("html_url", ""),
            "total_parts": total_parts,
            "total_bytes": total_bytes,
            "deleted_parts": deleted_parts,
            "error": None,
        }




    # ----------------------------------------------------------------------
    # OpenSearch (汎用 HTTP プロキシ)
    # ----------------------------------------------------------------------
    # 「データを保存・検索したい」という抽象機能を kernel が提供する。
    # 実装 (OpenSearch クラスタへの HTTP 呼び出し) は kernel に隠蔽し、
    # 呼び出し元アプリは URL も実装方式も知る必要がない。
    #
    # 本エンドポイントは 1 つで OpenSearch の全 REST API をカバーする汎用プロキシ。
    # method/path/body/params/body_ndjson を受け取って OpenSearch に転送し、
    # ステータスコードと JSON レスポンスを返す。

    @app.post("/core/opensearch/request")
    async def core_opensearch_request(request: dict):
        """OpenSearch への汎用 HTTP リクエストを中継する。

        Body:
            {
              "method": "GET" | "POST" | "PUT" | "DELETE" | "HEAD",   # 必須
              "path": "/index/_search",                       # 必須 (先頭スラッシュ付き)
              "body": {...} | null,                           # 任意 (JSON ボディ)
              "body_ndjson": "..." | null,                    # 任意 (_bulk 用 NDJSON 文字列)
              "params": {...} | null,                         # 任意 (URL クエリパラメータ)
              "timeout": 30                                   # 任意 (秒、省略時 30)
            }
        Returns:
            {
              "status_code": int,
              "json": {...} | null,           # OpenSearch のレスポンス JSON (パース失敗時 null)
              "error": str | null              # ネットワーク/予期せぬエラーがあった場合のメッセージ
            }
        例外は投げず、ネットワークエラー時も status_code=0 + error 文字列で返す。
        body と body_ndjson は同時指定できない。
        """
        method = (request.get("method") or "").upper()
        path = request.get("path") or ""
        body = request.get("body")
        body_ndjson = request.get("body_ndjson")
        params = request.get("params")
        timeout = float(request.get("timeout", 30))

        if method not in ("GET", "POST", "PUT", "DELETE", "HEAD"):
            return {"status_code": 0, "json": None, "error": f"invalid method: {method}"}
        if not path or not path.startswith("/"):
            return {"status_code": 0, "json": None, "error": "path is required and must start with '/'"}
        if body is not None and body_ndjson is not None:
            return {"status_code": 0, "json": None, "error": "body and body_ndjson cannot be used together"}

        url = f"{OPENSEARCH_URL}{path}"
        headers = {"Content-Type": "application/x-ndjson"} if body_ndjson is not None else {"Content-Type": "application/json"}

        try:
            if body_ndjson is not None:
                # _bulk 等の NDJSON ボディ
                resp = requests.request(
                    method, url,
                    headers=headers,
                    params=params,
                    data=body_ndjson.encode("utf-8"),
                    timeout=timeout,
                )
            else:
                resp = requests.request(
                    method, url,
                    headers=headers,
                    params=params,
                    json=body,
                    timeout=timeout,
                )
            status_code = resp.status_code
            try:
                resp_json = resp.json()
            except Exception:
                resp_json = None
            return {"status_code": status_code, "json": resp_json, "error": None}
        except requests.exceptions.RequestException as e:
            logger.error(f"[OPENSEARCH] network error: {method} {path}: {e}")
            return {"status_code": 0, "json": None, "error": f"network error: {str(e)[:200]}"}
        except Exception as e:
            logger.error(f"[OPENSEARCH] unexpected error: {method} {path}: {e}", exc_info=True)
            return {"status_code": 0, "json": None, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    # ----------------------------------------------------------------------
    # ベクトルストア (汎用ベクトル DB 抽象)
    # ----------------------------------------------------------------------
    # 「ベクトルとメタデータを保存して、類似検索したい」という抽象機能を kernel が提供する。
    # 実装は現在 Milvus (pymilvus) だが、呼び出し元アプリは「コレクション (=namespace) を
    # 作って、ベクトル+属性を保存して、検索する」というレベルでしか触らない。
    # スキーマやコレクション名は呼び出し元アプリが指定する (kernel は中身を知らない)。

    # JSON で渡される dtype 文字列を pymilvus DataType に変換するマップ
    _VS_DTYPE_MAP = {
        "INT64": DataType.INT64,
        "INT32": DataType.INT32,
        "FLOAT": DataType.FLOAT,
        "DOUBLE": DataType.DOUBLE,
        "VARCHAR": DataType.VARCHAR,
        "FLOAT_VECTOR": DataType.FLOAT_VECTOR,
        "BOOL": DataType.BOOL,
    }


    def _vs_build_field_schema(field_dict: dict) -> FieldSchema:
        """JSON dict から pymilvus FieldSchema を構築する。
        受け付けるキー: name, dtype, is_primary, auto_id, dim, max_length, description
        """
        name = field_dict.get("name")
        dtype_str = field_dict.get("dtype", "")
        if dtype_str not in _VS_DTYPE_MAP:
            raise ValueError(f"unsupported dtype: {dtype_str}")
        dtype = _VS_DTYPE_MAP[dtype_str]
        kwargs = {
            "name": name,
            "dtype": dtype,
        }
        if field_dict.get("is_primary"):
            kwargs["is_primary"] = True
        if field_dict.get("auto_id"):
            kwargs["auto_id"] = True
        if "dim" in field_dict:
            kwargs["dim"] = int(field_dict["dim"])
        if "max_length" in field_dict:
            kwargs["max_length"] = int(field_dict["max_length"])
        if "description" in field_dict:
            kwargs["description"] = str(field_dict["description"])
        return FieldSchema(**kwargs)


    @app.post("/core/vectorstore/has-namespace")
    async def core_vs_has_namespace(request: dict):
        """指定された namespace (Milvus collection) が存在するか確認する。

        Body: {"namespace": "..."}
        Returns: {"exists": bool, "error": str | null}
        """
        namespace = request.get("namespace") or ""
        if not namespace:
            return {"exists": False, "error": "namespace is required"}
        try:
            exists = utility.has_collection(namespace)
            return {"exists": bool(exists), "error": None}
        except Exception as e:
            logger.error(f"[VS] has_namespace error: {e}")
            return {"exists": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/vectorstore/init-namespace")
    async def core_vs_init_namespace(request: dict):
        """namespace (Milvus collection) を作成する (既存なら何もしない)。

        Body:
            {
              "namespace": "...",
              "schema": {
                "fields": [{"name", "dtype", "is_primary"?, "auto_id"?, "dim"?, "max_length"?, "description"?}, ...],
                "description": "..."   # 任意
              },
              "index": {                # 任意 (指定すれば作成後にインデックス構築)
                "field": "vector",
                "index_type": "IVF_FLAT",
                "metric_type": "COSINE",
                "params": {...}
              }
            }
        Returns: {"ok": bool, "created": bool, "error": str | null}
        """
        namespace = request.get("namespace") or ""
        schema_dict = request.get("schema") or {}
        index_dict = request.get("index")
        if not namespace:
            return {"ok": False, "created": False, "error": "namespace is required"}
        if not schema_dict.get("fields"):
            return {"ok": False, "created": False, "error": "schema.fields is required"}

        try:
            if utility.has_collection(namespace):
                return {"ok": True, "created": False, "error": None}

            fields = [_vs_build_field_schema(f) for f in schema_dict["fields"]]
            schema = CollectionSchema(fields, description=schema_dict.get("description", ""))
            collection = Collection(name=namespace, schema=schema)

            if index_dict:
                index_params = {
                    "index_type": index_dict.get("index_type", "IVF_FLAT"),
                    "metric_type": index_dict.get("metric_type", "COSINE"),
                    "params": index_dict.get("params", {"nlist": 128}),
                }
                collection.create_index(
                    field_name=index_dict.get("field", "vector"),
                    index_params=index_params,
                )
            logger.info(f"[VS] init_namespace OK: {namespace}")
            return {"ok": True, "created": True, "error": None}
        except Exception as e:
            logger.error(f"[VS] init_namespace error: {namespace}: {e}", exc_info=True)
            return {"ok": False, "created": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/vectorstore/drop-namespace")
