    async def _triage_single_sample(messages: list, seed: int) -> Dict[str, Any]:
        """1サンプル分の triage を実行する内部ヘルパー。 vLLM を直接叩く。"""
        payload = {
            "model": LLM_MODEL,
            "messages": messages,
            "max_tokens": ORCHESTRATE_TRIAGE_MAX_TOKENS,
            "temperature": 0.4,
            "seed": int(seed),
        }
        try:
            response = await asyncio.to_thread(
                requests.post,
                f"{VLLM_URL}/v1/chat/completions",
                json=payload,
                timeout=60,
            )
            response.raise_for_status()
            text = response.json()["choices"][0]["message"]["content"]
            m = re.search(r"\{[\s\S]*?\}", text)
            if not m:
                return {"decision": "C", "reasoning": f"no JSON: {text[:80]}"}
            parsed = json.loads(m.group())
            decision = str(parsed.get("decision", "C")).upper().strip()
            # 後方互換 + 拡張: A / B / B_LIGHT / B_STD / B_ADV / C を受理。
            # 旧 "B" 単独は標準 (B_STD) とみなす。
            if decision == "B":
                decision = "B_STD"
            if decision not in ("A", "B_LIGHT", "B_STD", "B_ADV", "C"):
                decision = "C"
            reasoning = str(parsed.get("reasoning", ""))[:300]
            return {"decision": decision, "reasoning": reasoning}
        except Exception as e:
            return {"decision": "C", "reasoning": f"error: {type(e).__name__}: {str(e)[:80]}"}


    async def triage_with_swallow(
        question: str,
        samples: int = 3,
        history_block: str = "",
        memory_block: str = "",
    ) -> Dict[str, Any]:
        """Swallow に「誰が応答すべきか」を 3並列サンプリングで判断させる。

        判定値 (Swallow への提示は 4 段階。 戻り値の decision は後方互換):
            A       = Swallow 単独応答 (シンプル、 定型、 短い相槌)
            B_LIGHT = Claude 軽量 (Haiku): Claude が必要だが負荷の軽い処理
            B_STD   = Claude 標準 (Sonnet): 通常の複雑な推論・長文整理
            B_ADV   = Claude 高度 (Opus): 機微な判断・多段推論・重要相談
            C       = 判断不能 (安全側 = Claude 高度にフォールバック)

        戻り値:
            decision (後方互換: A / B / C / None。 B_* はすべて B に正規化)
            claude_tier (B 系のとき "light"/"standard"/"advanced"、 それ以外 None)
            claude_model (claude_tier を実モデル名に解決。 A のとき None)
            votes、 agreement (0.0-1.0)、 reasonings、
            complexity (後方互換: A→simple, それ以外→complex)、 reason、
            samples_count、 elapsed_sec
        """
        start = time.time()

        system_lines = [
            "あなたは the assistant systemの triage 担当です。 ユーザー発話に対して、 誰がどのモデルで応答すべきかを判断してください。",
            "",
            "選択肢:",
            "A) Swallow (あなた) が単独で応答 - シンプルな質問、 定型応答、 短い相槌、 過去記憶を使わずに答えられるもの",
            "B_LIGHT) Claude 軽量モデル - Claude の言語能力は要るが負荷は軽い。 短い整理・要約、 軽い言い換え、 定型的だが Swallow では不安な処理",
            "B_STD) Claude 標準モデル - 通常の複雑な推論、 長文の整理、 一般的で標準的な判断、 過去記憶の参照が必要",
            "B_ADV) Claude 高度モデル - 機微で重要な判断、 多段の論理推論、 誤りが許されない領域、 深い文脈参照が必要",
            "C) 判断不能 - 上記の判別自体が難しい場合",
            "",
            "迷ったら C を選んでください。 C は安全側 (高品質モデル) で処理されます。 自信過剰は避けてください。",
            "",
            "出力は厳密に以下の JSON 形式のみ。 前置き・後書きは一切不要:",
            '{"decision": "A" or "B_LIGHT" or "B_STD" or "B_ADV" or "C", "reasoning": "1-2文で判断理由"}',
        ]
        if history_block:
            system_lines += ["", "--- 直近の会話履歴 ---", history_block]
        if memory_block:
            system_lines += ["", "--- 想起された過去記憶 ---", memory_block]
        system_text = "\n".join(system_lines)

        user_text = f"ユーザー発話: {question}\n\nJSON:"
        messages = [
            {"role": "system", "content": system_text},
            {"role": "user", "content": user_text},
        ]

        seeds = [random.randint(1, 10**9) for _ in range(max(1, samples))]
        try:
            results = await asyncio.gather(
                *[_triage_single_sample(messages, s) for s in seeds]
            )
        except Exception as e:
            elapsed = time.time() - start
            logger.error(f"[TRIAGE] parallel exec failed: {type(e).__name__}: {e}")
            # フォールバックは安全側 = Claude 高度 (Opus)
            return {
                "decision": None,
                "claude_tier": "advanced",
                "claude_model": CLAUDE_TIER_TO_MODEL["advanced"],
                "votes": [],
                "agreement": 0.0,
                "reasonings": [],
                "complexity": "complex",
                "reason": f"fallback: {type(e).__name__}",
                "samples_count": 0,
                "elapsed_sec": round(elapsed, 3),
            }

        votes = [r["decision"] for r in results]
        reasonings = [r["reasoning"] for r in results]

        _labels = ("A", "B_LIGHT", "B_STD", "B_ADV", "C")
        counts = {k: votes.count(k) for k in _labels}
        max_count = max(counts.values()) if votes else 0
        winners = [k for k, v in counts.items() if v == max_count and v > 0]

        if len(winners) == 1:
            raw_decision = winners[0]
            agreement = max_count / len(votes) if votes else 0.0
        else:
            # 票割れ: 安全側 = 最も高品質寄りを採用 (B_ADV > B_STD > B_LIGHT > A、 C は B_ADV 相当)
            raw_decision = None
            agreement = 0.0

        if raw_decision is not None and raw_decision != "C":
            winner_reasonings = [reasonings[i] for i, v in enumerate(votes) if v == raw_decision]
            representative_reason = winner_reasonings[0] if winner_reasonings else ""
        else:
            representative_reason = "split or undecided -> safe high-quality model"

        # raw_decision → (後方互換 decision, claude_tier)
        # A: Swallow / B_*: Claude (tier 別) / C・split: 安全側 = advanced
        if raw_decision == "A":
            decision = "A"
            claude_tier = None
        elif raw_decision == "B_LIGHT":
            decision = "B"
            claude_tier = "light"
        elif raw_decision == "B_STD":
            decision = "B"
            claude_tier = "standard"
        elif raw_decision == "B_ADV":
            decision = "B"
            claude_tier = "advanced"
        else:
            # C または split decision: 安全側で Claude 高度
            decision = "B" if raw_decision == "C" else None
            claude_tier = "advanced"

        claude_model = CLAUDE_TIER_TO_MODEL.get(claude_tier) if claude_tier else None
        complexity = "simple" if raw_decision == "A" else "complex"

        elapsed = time.time() - start
        logger.info(
            f"[TRIAGE] votes={votes} raw={raw_decision} decision={decision} "
            f"tier={claude_tier} model={claude_model} agreement={agreement:.3f} "
            f"complexity={complexity} elapsed={elapsed:.2f}s"
        )
        return {
            "decision": decision,
            "claude_tier": claude_tier,
            "claude_model": claude_model,
            "votes": votes,
            "agreement": round(agreement, 3),
            "reasonings": reasonings,
            "complexity": complexity,
            "reason": representative_reason[:200],
            "samples_count": len(votes),
            "elapsed_sec": round(elapsed, 3),
        }


    def judge_answers_with_swallow(
        question: str,
        answer_a: str,
        answer_b: str,
        history_block: str = "",
        memory_block: str = "",
    ) -> Dict[str, Any]:
        """Swallow に 2 つの応答を比較させる。 評価軸自体を Swallow に自己決定させる進化型 judge。

        旧版は「網羅性」を絶対基準としたが、 本版は発話の性質に応じて Swallow が
        評価軸を自ら立て、 その軸に照らして判定する。 criteria はログに残し、
        the assistant systemの進化材料として蓄積する。

        戻り値:
            winner (A/B/TIE)、 criteria (Swallow が立てた評価軸)、 reasoning、
            confidence (0.0-1.0)、 reason (後方互換)、 elapsed_sec
        """
        start = time.time()

        system_lines = [
            "あなたは応答品質の評価者です。 以下のユーザー発話と、 それに対する 2 つの応答候補を見て、",
            "発話の性質に応じた評価軸を**自分で考え**、 その軸に照らして優劣を判定してください。",
            "",
            "評価軸の例 (これに限定されない):",
            "- 事実の正確性 (記憶を正しく参照しているか)",
            "- 会話としての自然さ (冗長すぎず、 機械的すぎないか)",
            "- 共感の質 (機微な内容の場合)",
            "- 網羅性 (情報整理が必要な場合)",
            "- 簡潔性 (短い相槌で十分な場合)",
            "",
            "応答 A と B のどちらがどのモデルかは伏せられています。 内容のみで判定してください。",
            "",
            "出力は厳密に以下の JSON 形式のみ。 前置き・後書きは一切不要:",
            '{"winner": "A" or "B" or "TIE",',
            ' "criteria": "今回の発話で重視すべき評価軸を1-2文で",',
            ' "reasoning": "両応答の比較分析を2-3文で",',
            ' "confidence": 0.0-1.0}',
        ]
        if history_block:
            system_lines += ["", "--- 直近の会話履歴 ---", history_block]
        if memory_block:
            system_lines += ["", "--- 想起された過去記憶 ---", memory_block]
        system_text = "\n".join(system_lines)

        user_text = (
            f"ユーザー発話: {question}\n\n"
            f"--- 応答A ---\n{answer_a[:2000]}\n\n"
            f"--- 応答B ---\n{answer_b[:2000]}\n\n"
            "JSON:"
        )

        payload = {
            "model": LLM_MODEL,
            "messages": [
                {"role": "system", "content": system_text},
                {"role": "user", "content": user_text},
            ],
            "max_tokens": ORCHESTRATE_JUDGE_MAX_TOKENS,
            "temperature": 0.1,
        }
        try:
            response = requests.post(
                f"{VLLM_URL}/v1/chat/completions",
                json=payload,
                timeout=120,
            )
            response.raise_for_status()
            text = response.json()["choices"][0]["message"]["content"]
            m = re.search(r"\{[\s\S]*\}", text)
            if not m:
                elapsed = time.time() - start
                logger.warning(f"[JUDGE] No JSON in response: {text[:120]}")
                return {
                    "winner": "TIE",
                    "criteria": "",
                    "reasoning": "fallback: judge JSON not found",
                    "confidence": 0.0,
                    "reason": "fallback: judge JSON not found",
                    "elapsed_sec": round(elapsed, 3),
                }
            parsed = json.loads(m.group())
            winner = str(parsed.get("winner", "TIE")).upper()
            if winner not in ("A", "B", "TIE"):
                winner = "TIE"
            criteria = str(parsed.get("criteria", ""))[:300]
            reasoning = str(parsed.get("reasoning", ""))[:500]
            try:
                confidence = float(parsed.get("confidence", 0.0))
                confidence = max(0.0, min(1.0, confidence))
            except (TypeError, ValueError):
                confidence = 0.0
            elapsed = time.time() - start
            logger.info(
                f"[JUDGE] winner={winner} confidence={confidence:.2f} "
                f"criteria={criteria[:60]}... elapsed={elapsed:.2f}s"
            )
            return {
                "winner": winner,
                "criteria": criteria,
                "reasoning": reasoning,
                "confidence": round(confidence, 3),
                "reason": reasoning[:300],
                "elapsed_sec": round(elapsed, 3),
            }
        except Exception as e:
            elapsed = time.time() - start
            logger.error(f"[JUDGE_ERROR] {type(e).__name__}: {e}")
            return {
                "winner": "TIE",
                "criteria": "",
                "reasoning": f"fallback: {type(e).__name__}",
                "confidence": 0.0,
                "reason": f"fallback: {type(e).__name__}",
                "elapsed_sec": round(elapsed, 3),
            }


    async def call_query_internal(
        question: str,
        user_id: str,
        top_k: int,
        use_graph: bool,
        search_mode: str,
        llm_backend: str,
        recursion_depth: int,
        skip_cache: bool = False,
        claude_model: str = "",
        use_tools: bool = True,
        system_prompt: Optional[str] = None,
    ) -> Dict[str, Any]:
        """内部 /query エンドポイントをHTTP経由で呼ぶ。受信depthをそのまま転送する。

        claude_model: llm_backend="claude" のとき使う Claude モデル名。
            空文字なら /query 側既定 (CLAUDE_MODEL)。 triage が選んだ
            tier (haiku/sonnet/opus) をここで渡す。
        use_tools: False で Claude に MCP ツールを渡さず自己完結プロンプト。
        system_prompt: 呼び出し側が独自の system prompt を渡す場合に指定。
            None なら kernel の generic default を使う。
        """
        import httpx as _httpx
        payload = {
            "question": question,
            "user_id": user_id,
            "top_k": top_k,
            "use_graph": use_graph,
            "search_mode": search_mode,
            "llm_backend": llm_backend,
            "skip_cache": skip_cache,
            "claude_model": claude_model or "",
            "use_tools": use_tools,
        }
        if system_prompt is not None:
            payload["system_prompt"] = system_prompt
        headers = {
            "Content-Type": "application/json",
            "X-Recursion-Depth": str(recursion_depth),
        }
        async with _httpx.AsyncClient(timeout=ORCHESTRATE_QUERY_TIMEOUT) as client:
            resp = await client.post(ORCHESTRATE_INTERNAL_QUERY_URL, json=payload, headers=headers)
            resp.raise_for_status()
            return resp.json()


    @app.post("/orchestrate")
    async def orchestrate(request: OrchestrateRequest, http_request: HTTPRequest):
        """動的オーケストレーター。質問の難易度を判定し、simpleならSwallow単独、complexならSwallow+Claudeを並列実行して審判する。"""
        import asyncio
        import random
        start_time = time.time()
        recursion_depth = get_recursion_depth(http_request)
        logger.info(f"[ORCHESTRATE] Question: {request.question[:50]}... force_mode={request.force_mode} depth={recursion_depth}")

        if request.force_mode == "simple" or request.force_mode == "swallow_only":
            complexity = "simple"
            triage_info = {"complexity": "simple", "reason": f"force_mode={request.force_mode}"}
        elif request.force_mode == "complex" or request.force_mode == "claude_only":
            complexity = "complex"
            triage_info = {"complexity": "complex", "reason": f"force_mode={request.force_mode}"}
        else:
            triage_info = await triage_with_swallow(request.question)
            complexity = triage_info["complexity"]

        # 使用する Claude モデルを解決する。
        # 優先順位: (1) リクエストの明示指定 > (2) triage が選んだ tier
        #           > (3) フォールバック (CLAUDE_MODEL = Sonnet)
        _req_claude_model = (getattr(request, "claude_model", "") or "").strip()
        _triage_claude_model = (triage_info.get("claude_model") or "").strip() if isinstance(triage_info, dict) else ""
        effective_claude_model = _req_claude_model or _triage_claude_model or CLAUDE_MODEL
        # 上限ティアでクランプ (指定があれば、 それを超えるモデルは上限へ下げる)
        _max_tier = (getattr(request, "max_claude_tier", "") or "").strip()
        _before_cap = effective_claude_model
        effective_claude_model = _clamp_claude_model_to_max(effective_claude_model, _max_tier)
        triage_info["effective_claude_model"] = effective_claude_model
        if _max_tier and effective_claude_model != _before_cap:
            logger.info(
                f"[ORCHESTRATE] claude_model resolved: req='{_req_claude_model}' "
                f"triage='{_triage_claude_model}' -> '{_before_cap}' "
                f"-> capped by max_claude_tier='{_max_tier}' -> '{effective_claude_model}'"
            )
        else:
            logger.info(
                f"[ORCHESTRATE] claude_model resolved: req='{_req_claude_model}' "
                f"triage='{_triage_claude_model}' -> '{effective_claude_model}'"
                + (f" (max_claude_tier='{_max_tier}', within cap)" if _max_tier else "")
            )

        if complexity == "simple" or request.force_mode == "swallow_only":
            try:
                result = await call_query_internal(
                    question=request.question,
                    user_id=request.user_id,
                    top_k=request.top_k,
                    use_graph=request.use_graph,
                    search_mode=request.search_mode,
                    llm_backend="swallow",
                    recursion_depth=recursion_depth,
                    skip_cache=True,
                )
                elapsed = time.time() - start_time
                result["orchestration"] = {
                    "mode": "simple",
                    "triage": triage_info,
                    "winner_backend": "swallow",
                    "processing_time_sec": round(elapsed, 2),
                }
                return result
            except Exception as e:
                logger.error(f"[ORCHESTRATE] simple mode /query failed: {type(e).__name__}: {e}")
                raise HTTPException(status_code=500, detail=f"Simple mode query failed: {type(e).__name__}")

        if request.force_mode == "claude_only":
            try:
                result = await call_query_internal(
                    question=request.question,
                    user_id=request.user_id,
                    top_k=request.top_k,
                    use_graph=request.use_graph,
                    search_mode=request.search_mode,
                    llm_backend="claude",
                    recursion_depth=recursion_depth,
                    skip_cache=True,
                    claude_model=effective_claude_model,
                    use_tools=getattr(request, "use_tools", True),
                    system_prompt=getattr(request, "system_prompt", None),
                )
                elapsed = time.time() - start_time
                result["orchestration"] = {
                    "mode": "claude_only",
                    "triage": triage_info,
                    "winner_backend": "claude",
                    "processing_time_sec": round(elapsed, 2),
                }
                return result
            except Exception as e:
                logger.error(f"[ORCHESTRATE] claude_only mode /query failed: {type(e).__name__}: {e}")
                raise HTTPException(status_code=500, detail=f"Claude only query failed: {type(e).__name__}")

        swallow_task = asyncio.create_task(call_query_internal(
            question=request.question,
            user_id=request.user_id,
            top_k=request.top_k,
            use_graph=request.use_graph,
            search_mode=request.search_mode,
            llm_backend="swallow",
            recursion_depth=recursion_depth,
            skip_cache=True,
        ))
        claude_task = asyncio.create_task(call_query_internal(
            question=request.question,
            user_id=request.user_id,
            top_k=request.top_k,
            use_graph=request.use_graph,
            search_mode=request.search_mode,
            llm_backend="claude",
            recursion_depth=recursion_depth,
            skip_cache=True,
            claude_model=effective_claude_model,
            use_tools=getattr(request, "use_tools", True),
            system_prompt=getattr(request, "system_prompt", None),
        ))
        results = await asyncio.gather(swallow_task, claude_task, return_exceptions=True)
        swallow_result, claude_result = results[0], results[1]
        swallow_ok = not isinstance(swallow_result, Exception)
        claude_ok = not isinstance(claude_result, Exception)

        if not swallow_ok and not claude_ok:
            logger.error(f"[ORCHESTRATE] Both backends failed: swallow={swallow_result}, claude={claude_result}")
            raise HTTPException(status_code=500, detail="Both swallow and claude backends failed")

        if swallow_ok and not claude_ok:
            logger.warning(f"[ORCHESTRATE] Claude failed, using Swallow: {type(claude_result).__name__}")
            elapsed = time.time() - start_time
            swallow_result["orchestration"] = {
                "mode": "complex",
                "triage": triage_info,
                "winner_backend": "swallow",
                "winner_reason": "claude_failed",
                "claude_error": f"{type(claude_result).__name__}: {str(claude_result)[:200]}",
                "processing_time_sec": round(elapsed, 2),
            }
            return swallow_result

        if claude_ok and not swallow_ok:
            logger.warning(f"[ORCHESTRATE] Swallow failed, using Claude: {type(swallow_result).__name__}")
            elapsed = time.time() - start_time
            claude_result["orchestration"] = {
                "mode": "complex",
                "triage": triage_info,
                "winner_backend": "claude",
                "winner_reason": "swallow_failed",
                "swallow_error": f"{type(swallow_result).__name__}: {str(swallow_result)[:200]}",
                "processing_time_sec": round(elapsed, 2),
            }
            return claude_result

        swap = random.random() < 0.5
        if swap:
            answer_a = claude_result.get("answer", "")
            answer_b = swallow_result.get("answer", "")
            label_a_backend = "claude"
            label_b_backend = "swallow"
        else:
            answer_a = swallow_result.get("answer", "")
            answer_b = claude_result.get("answer", "")
            label_a_backend = "swallow"
            label_b_backend = "claude"

        judgment = await asyncio.to_thread(judge_answers_with_swallow, request.question, answer_a, answer_b)
        winner_label = judgment["winner"]

        if winner_label == "A":
            winner_backend = label_a_backend
        elif winner_label == "B":
            winner_backend = label_b_backend
        else:
            winner_backend = "claude"

        winning_result = claude_result if winner_backend == "claude" else swallow_result
        losing_result = swallow_result if winner_backend == "claude" else claude_result
        losing_backend = "swallow" if winner_backend == "claude" else "claude"

        elapsed = time.time() - start_time
        winning_result["orchestration"] = {
            "mode": "complex",
            "triage": triage_info,
            "winner_backend": winner_backend,
            "winner_reason": judgment["reason"],
            "judge_blind_label": winner_label,
            "label_mapping": {"A": label_a_backend, "B": label_b_backend},
            "loser": {
                "backend": losing_backend,
                "answer": losing_result.get("answer", "")[:1000],
                "processing_time_sec": losing_result.get("processing_time_sec", 0),
            },
            "processing_time_sec": round(elapsed, 2),
        }
        logger.info(f"[ORCHESTRATE] complex mode completed: winner={winner_backend} total={elapsed:.2f}s")
        return winning_result


    @app.post("/query")
    async def query(request: Query, http_request: HTTPRequest):
        """質問応答（ハイブリッド検索）"""
        try:
            start_time = time.time()

            recursion_depth = get_recursion_depth(http_request)
            if recursion_depth > MAX_CLAUDE_RECURSION_DEPTH and request.llm_backend == "claude":
                logger.warning(
                    f"[RECURSION_GUARD] depth={recursion_depth} > max={MAX_CLAUDE_RECURSION_DEPTH}, "
                    f"forcing llm_backend 'claude' -> 'swallow' to prevent infinite recursion"
                )
                request.llm_backend = "swallow"

            logger.info(f"[QUERY] Question: {request.question[:50]}... mode={request.search_mode} llm={request.llm_backend} depth={recursion_depth}")
            
            # ── Input Guard: jailbreak・トピック制御 ──
            input_guard = call_guardrails("/guard/input", {
                "text": request.question,
                "tenant": get_tenant_label(request.user_id),
            })
            if input_guard and not input_guard.get("allowed", True):
                reason = input_guard.get("reason", "blocked")
                logger.warning(f"[QUERY] Blocked by input guard: {reason}")
                return {
                    "question": request.question,
                    "answer": f"この質問は安全上の理由でブロックされました（{reason}）",
                    "retrieved_documents": [],
                    "graph_entities": [],
                    "search_mode": request.search_mode,
                    "guardrails": {"input_blocked": True, "reason": reason},
                    "processing_time_sec": round(time.time() - start_time, 2)
                }
            
            tenant = get_tenant_label(request.user_id)

            query_embedding = get_embedding(request.question)
            if not request.skip_cache:
                cached = cache_check(query_embedding, tenant, request.question)
                if cached:
                    logger.info(f"[QUERY] Cache HIT: sim={cached.get('similarity', 0):.4f}")
                    cached_result = cached["result"]
                    cached_result["cache_hit"] = True
                    cached_result["cache_similarity"] = cached.get("similarity", 0)
                    cached_result["cached_question"] = cached.get("cached_question", "")
                    cached_result["processing_time_sec"] = round(time.time() - start_time, 2)
                    return cached_result
            else:
                logger.info(f"[QUERY] Cache bypassed (skip_cache=True)")
            
            retrieved_docs = []
            graph_context = ""
            graph_results = []
            
            if request.search_mode == "graph_first" and neo4j_driver:
                # グラフ優先モード
                logger.info("[QUERY] Using graph_first mode")
                graph_search_result = search_graph_first(request.question, tenant, request.top_k)
                
                # グラフから取得したチャンクを使用
                for chunk in graph_search_result["chunks"]:
                    retrieved_docs.append({
                        "text": chunk["text"],
                        "score": 1.0,  # グラフ検索はスコアなし
                        "source": "graph"
                    })
                
                graph_results = graph_search_result["entities"]
                
                # パス情報をコンテキストに追加
                if graph_search_result["paths"]:
                    path_strs = []
                    seen_paths = set()
                    for p in graph_search_result["paths"]:
                        path_str = " → ".join(p["path"])
                        if path_str not in seen_paths:
                            seen_paths.add(path_str)
                            path_strs.append(f"- {path_str}")
                    if path_strs:
                        graph_context = "[関係パス]\n" + "\n".join(path_strs)
                
                # グラフで見つからない場合はベクトル検索にフォールバック
                if not retrieved_docs:
                    logger.info("[QUERY] Graph search returned no results, falling back to vector search")
                    collection_name = get_collection_name(request.user_id)
                    if utility.has_collection(collection_name):
                        collection = Collection(collection_name)
                        collection.load()
                        query_embedding = get_embedding(request.question)
                        search_params = {"metric_type": "IP", "params": {"nprobe": 10}}
                        results = collection.search(
                            data=[query_embedding],
                            anns_field="embedding",
                            param=search_params,
                            limit=request.top_k,
                            output_fields=["text"]
                        )
                        for hit in results[0]:
                            retrieved_docs.append({
                                "text": hit.entity.get("text"),
                                "score": float(hit.distance),
                                "source": "vector_fallback"
                            })
            else:
                # ベクトル優先モード（ドキュメント + コード統合検索）
                logger.info("[QUERY] Using vector_first mode with document and code search")
                collection_name = get_collection_name(request.user_id)
                code_collection_name = get_code_collection_name(request.user_id)
                
                # 通常のドキュメントコレクション検索
                has_docs = utility.has_collection(collection_name)
                has_code = utility.has_collection(code_collection_name)
                
                if not has_docs and not has_code:
                    # ナレッジベース未作成のユーザーでも、 呼び出し側が
                    # question にコンテキストを埋め込んでいれば LLM は回答
                    # できる (例: アプリ backend が必要なコンテキストを
                    # question に同梱して /orchestrate 経由で呼ぶ)。
                    # ここで 404 にすると orchestrator 全体が失敗するため、
                    # 検索をスキップして空コンテキストで処理を継続する。
                    logger.info(
                        "[QUERY] No knowledge base for user '%s'; "
                        "continuing with empty retrieval (context-only answer)."
                        % request.user_id
                    )
                
                query_embedding = get_embedding(request.question)
                search_params = {"metric_type": "IP", "params": {"nprobe": 10}}
                
                all_results = []
                
                # 通常のドキュメント検索
                if has_docs:
                    collection = Collection(collection_name)
                    collection.load()
                    
                    results = collection.search(
                        data=[query_embedding],
                        anns_field="embedding",
                        param=search_params,
                        limit=min(request.top_k * 4, 20),
                        output_fields=["text"]
                    )
                    
                    for hit in results[0]:
                        all_results.append({
                            "text": hit.entity.get("text"),
                            "score": float(hit.distance),
                            "source": "document"
                        })
                    
                    logger.info(f"[QUERY] Document search: {len(results[0])} results")
                
                # コード検索
                if has_code:
                    code_collection = Collection(code_collection_name)
                    code_collection.load()
                    
                    code_results = code_collection.search(
                        data=[query_embedding],
                        anns_field="embedding",
                        param=search_params,
                        limit=min(request.top_k * 4, 20),
                        output_fields=["text", "filepath", "start_line", "end_line", "repository", "branch"]
                    )
                    
                    for hit in code_results[0]:
                        filepath = hit.entity.get("filepath")
                        start_line = hit.entity.get("start_line")
                        end_line = hit.entity.get("end_line")
                        repository = hit.entity.get("repository")
                        
                        # コードの場合はファイル情報を追加
                        code_text = hit.entity.get("text")
                        if filepath:
                            code_display = f"[Code: {filepath}"
                            if start_line and end_line:
                                code_display += f" L{start_line}-{end_line}"
                            if repository:
                                code_display += f" | {repository}"
                            code_display += f"]\n{code_text}"
                        else:
                            code_display = code_text
                        
                        all_results.append({
                            "text": code_display,
                            "score": float(hit.distance),
                            "source": "code",
                            "filepath": filepath,
                            "repository": repository
                        })
                    
                    logger.info(f"[QUERY] Code search: {len(code_results[0])} results")
                
                # BM25全文検索（OpenSearch）
                bm25_results = opensearch_search_bm25(request.question, tenant, top_k=20)
                if bm25_results:
                    logger.info(f"[QUERY] BM25 search: {len(bm25_results)} results")
                
                # RRF統合（Dense + BM25の三位一体、Graphは後で補強）
                if bm25_results:
                    all_results = rrf_merge([all_results, bm25_results], weights=[1.0, 0.3])
                    logger.info(f"[QUERY] RRF merged: {len(all_results)} unique results")
                else:
                    all_results.sort(key=lambda x: x["score"], reverse=True)
                
                # 鮮度ブースト（新しいデータを優先）
                all_results = apply_recency_boost(all_results)
                boosted_count = sum(1 for r in all_results if r.get("recency_boost", 0) > 0)
                if boosted_count > 0:
                    logger.info(f"[QUERY] Recency boost applied to {boosted_count} results")
                
                # 候補数を決定（top_kの4倍、最大20件）
                candidate_count = min(request.top_k * 4, 20, len(all_results))
                candidates = all_results[:candidate_count]
                
                logger.info(f"[QUERY] Candidates for reranking: {len(candidates)} (from {len(all_results)})")
                
                # Cross-Encoderでリランキング
                retrieved_docs, rerank_info = rerank_with_cross_encoder(
                    question=request.question,
                    candidates=candidates,
                    final_count=request.top_k
                )
                
                logger.info(f"[QUERY] After reranking: {len(retrieved_docs)} documents selected")
                
                # 多様性フィルター: 類似したチャンクを除外して複数文書から情報取得
                def apply_diversity_filter(docs, max_similarity=0.7):
                    """テキストの類似度が高いチャンクを除外"""
                    if len(docs) <= 1:
                        return docs
                    
                    filtered = []
                    for doc in docs:
                        is_diverse = True
                        for selected in filtered:
                            # 簡易的な類似度計算（共通単語の割合）
                            words1 = set(doc['text'][:500].split())
                            words2 = set(selected['text'][:500].split())
                            if len(words1) > 0 and len(words2) > 0:
                                overlap = len(words1 & words2) / min(len(words1), len(words2))
                                if overlap > max_similarity:
                                    is_diverse = False
                                    logger.debug(f"[DIVERSITY] Filtered similar chunk (overlap: {overlap:.2f})")
                                    break
                        if is_diverse:
                            filtered.append(doc)
                    return filtered
                
                # 多様性フィルター適用
                original_count = len(retrieved_docs)
                retrieved_docs = apply_diversity_filter(retrieved_docs, max_similarity=0.9)
                if len(retrieved_docs) < original_count:
                    logger.info(f"[DIVERSITY] Filtered {original_count - len(retrieved_docs)} similar chunks, kept {len(retrieved_docs)} diverse documents")
                
                
                # URL先のコンテンツを取得
                fetcher = get_web_fetcher()
                retrieved_docs = fetcher.enhance_results_with_urls(
                    retrieved_docs,
                    max_urls=2
                )
                logger.info(f"[QUERY] After URL enhancement: {len(retrieved_docs)} documents total")
                
                # 鮮度ブースト（reranker後の最終結果に適用）
                retrieved_docs = apply_recency_boost(retrieved_docs)
                
                # グラフ補強
                if request.use_graph and neo4j_driver:
                    graph_results = search_graph_context(request.question, tenant)
                    graph_context = format_graph_context(graph_results)
            
            # ── Retrieval Rails: チャンク内PIIマスク（Bedrockにない機能）──
            chunk_guard = call_guardrails("/guard/chunks", {
                "chunks": [{"text": doc["text"], "score": doc.get("score", 0)} for doc in retrieved_docs],
                "tenant": tenant,
            })
            guardrails_info = {}
            if chunk_guard and chunk_guard.get("masked_count", 0) > 0:
                guarded_chunks = chunk_guard["chunks"]
                for i, doc in enumerate(retrieved_docs):
                    if i < len(guarded_chunks) and guarded_chunks[i].get("masked"):
                        doc["text"] = guarded_chunks[i]["text"]
                        doc["pii_masked"] = True
                guardrails_info["chunks_masked"] = chunk_guard["masked_count"]
                logger.info(f"[QUERY] Retrieval rails: {chunk_guard['masked_count']} chunks masked")

            context = "\n\n".join([doc["text"] for doc in retrieved_docs])
            if request.llm_backend == "claude":
                # async ハンドラ内で同期 requests を使うと uvicorn のイベントループがブロックされ、
                # MCP 経由で rag-backend の /retrieve を呼び戻すとデッドロックになる。
                # asyncio.to_thread で同期処理を別スレッドに逃がすことで、イベントループを空けて /retrieve を処理できるようにする。
                import asyncio
                answer = await asyncio.to_thread(generate_response_claude, request.question, context, graph_context, request.user_id, getattr(request, "claude_model", "") or "", getattr(request, "use_tools", True), getattr(request, "system_prompt", None))
            else:
                import asyncio
                answer = await asyncio.to_thread(generate_response, request.question, context, graph_context)
            
            # ── Output Rails: ハルシネーション検出 ──
            output_guard = call_guardrails("/guard/output", {
                "question": request.question,
                "context": context[:2000],
                "answer": answer,
                "tenant": tenant,
            })
            if output_guard and not output_guard.get("allowed", True):
                reason = output_guard.get("reason", "blocked")
                details = output_guard.get("details", {})
                logger.warning(f"[QUERY] Output guard warning: {reason}")
                guardrails_info["output_warning"] = {
                    "reason": reason,
                    "details": details,
                }
                answer = answer + "\n\n[注意: この回答にはコンテキストに裏付けのない情報が含まれている可能性があります]"

            elapsed = time.time() - start_time
            
            result = {
                "question": request.question,
                "answer": answer,
                "retrieved_documents": retrieved_docs,
                "graph_entities": graph_results,
                "search_mode": request.search_mode,
                "processing_time_sec": round(elapsed, 2)
            }
            if guardrails_info:
                result["guardrails"] = guardrails_info

            if not request.skip_cache:
                cache_store(query_embedding, tenant, request.question, result)

            return result
        except HTTPException:
            raise
        except Exception as e:
            logger.error(f"[QUERY] Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

