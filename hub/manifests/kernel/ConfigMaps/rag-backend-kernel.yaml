            project = _project_bundle(doc, project_id)
            os_url = OPENSEARCH_URL.rstrip("/")
            sr = requests.post(
                f"{os_url}/{SPAWNS_INDEX}/_search",
                json={
                    "size": 500,
                    "query": {"term": {"project_id": project_id}},
                    "sort": [{"submitted_epoch": {"order": "desc"}}],
                },
                headers={"Content-Type": "application/json"},
                timeout=10,
            )
            spawns = []
            if sr.status_code == 200:
                for hit in sr.json().get("hits", {}).get("hits", []):
                    b = _spawn_bundle(hit.get("_source"), include_result=False)
                    if b:
                        spawns.append(b)
            return {"ok": True, "project": project, "spawns": spawns, "error": None}
        except Exception as e:
            logger.warning(f"[PROJECT] get failed: project_id={project_id}: {e}")
