    # Spawn Framework (v2.0) - async LLM task queue
    # ============================================================
    # spawn (async LLM task) と project (spawn grouping) の永続化と CRUD を担う。
    # task-worker Deployment がここの /core/spawn/pickup を short-polling し、
    # 拾った spawn を実行して結果を書き戻す。 詳細は docs/concepts/spawn.md 参照。
    #
    # 3 層アイデンティティ:
    #   1. 通番 (serial): 01〜99 の循環 2 桁
    #   2. フルユニーク ID (full_id): spawn-{NN}-{hex8}
    #   3. 別名 (alias): 任意

    TASK_PRIORITIES = ("high", "normal", "low")

    SPAWNS_INDEX = "spawns"
    PROJECTS_INDEX = "projects"
    SPAWN_COUNTER_INDEX = "spawn_counter"
    SPAWN_COUNTER_DOC_ID = "global"
    _spawn_indices_ensured = [False]

    def _spawn_now_iso() -> str:
        from datetime import datetime, timezone
        return datetime.now(timezone.utc).isoformat()

    def _spawn_ensure_indices() -> None:
        """spawns / projects / spawn_counter index を idempotent 作成する。 起動後 1 回だけ実 PUT する。"""
        if _spawn_indices_ensured[0]:
            return
        os_url = OPENSEARCH_URL.rstrip("/")
        spawns_mapping = {
            "mappings": {
                "properties": {
                    "full_id": {"type": "keyword"},
                    "serial": {"type": "keyword"},
                    "unique_suffix": {"type": "keyword"},
                    "alias": {"type": "keyword"},
                    "state": {"type": "keyword"},
                    "prompt": {"type": "text"},
                    "label": {"type": "keyword"},
                    "user_id": {"type": "keyword"},
                    "model": {"type": "keyword"},
                    "priority": {"type": "keyword"},
                    "timeout_sec": {"type": "integer"},
                    "submitted_at": {"type": "date"},
                    "submitted_epoch": {"type": "double"},
                    "started_at": {"type": "date"},
                    "finished_at": {"type": "date"},
                    "worker_id": {"type": "keyword"},
                    "project_id": {"type": "keyword"},
                    "is_supervisor": {"type": "boolean"},
                    "parent_supervisor": {"type": "keyword"},
                    "managed_spawns": {"type": "keyword"},
                    "context": {"type": "text"},
                    "question": {"type": "text"},
                    "result": {"type": "text"},
                    "error_body": {"type": "text"},
                    "answer_queue": {"type": "object", "enabled": True},
                    "pickup_lease_at": {"type": "date"},
                }
            }
        }
        projects_mapping = {
            "mappings": {
                "properties": {
                    "project_id": {"type": "keyword"},
                    "name": {"type": "keyword"},
                    "description": {"type": "text"},
                    "status": {"type": "keyword"},
                    "owners": {"type": "keyword"},
                    "members": {"type": "keyword"},
                    "created_at": {"type": "date"},
                    "created_epoch": {"type": "double"},
                    "updated_at": {"type": "date"},
                }
            }
        }
        counter_mapping = {
            "mappings": {
                "properties": {"counter": {"type": "integer"}}
            }
        }
        for name, mapping in [
            (SPAWNS_INDEX, spawns_mapping),
            (PROJECTS_INDEX, projects_mapping),
            (SPAWN_COUNTER_INDEX, counter_mapping),
        ]:
            try:
                h = requests.head(f"{os_url}/{name}", timeout=5)
                if h.status_code == 200:
                    continue
                c = requests.put(
                    f"{os_url}/{name}",
                    json=mapping,
                    headers={"Content-Type": "application/json"},
                    timeout=10,
                )
                if c.status_code in (200, 201):
                    logger.info(f"[SPAWN] created OpenSearch index: {name}")
                elif c.status_code == 400 and "resource_already_exists" in c.text:
                    pass
                else:
                    logger.warning(f"[SPAWN] failed to create index {name}: {c.status_code} {c.text[:200]}")
            except Exception as e:
                logger.warning(f"[SPAWN] ensure_indices error for {name}: {e}")
        _spawn_indices_ensured[0] = True

    def _spawn_next_serial() -> str:
        """spawn_counter を painless で atomic INCR して 01〜99 循環通番を返す。"""
        os_url = OPENSEARCH_URL.rstrip("/")
        script_body = {
            "script": {
                "source": (
                    "if (ctx._source.counter == null) { ctx._source.counter = 1; } "
                    "else { ctx._source.counter = ctx._source.counter + 1; }"
                ),
                "lang": "painless",
            },
            "upsert": {"counter": 1},
        }
        r = requests.post(
            f"{os_url}/{SPAWN_COUNTER_INDEX}/_update/{SPAWN_COUNTER_DOC_ID}",
            json=script_body,
            params={"refresh": "true", "retry_on_conflict": 5},
            headers={"Content-Type": "application/json"},
            timeout=10,
        )
        if r.status_code not in (200, 201):
            raise RuntimeError(f"spawn counter increment failed: {r.status_code} {r.text[:200]}")
        g = requests.get(f"{os_url}/{SPAWN_COUNTER_INDEX}/_doc/{SPAWN_COUNTER_DOC_ID}", timeout=5)
        counter = int(g.json().get("_source", {}).get("counter", 1))
        serial = ((counter - 1) % 99) + 1
        return f"{serial:02d}"

    def _spawn_get_doc(full_id: str):
        os_url = OPENSEARCH_URL.rstrip("/")
        r = requests.get(f"{os_url}/{SPAWNS_INDEX}/_doc/{full_id}", timeout=5)
        if r.status_code == 404:
            return None
        if r.status_code != 200:
            return None
        js = r.json()
        if not js.get("found"):
            return None
        return js.get("_source") or {}

    def _spawn_bundle(doc, include_result: bool = True):
        if not doc:
            return None
        out = dict(doc)
        out.setdefault("project_id", "")
        if not include_result:
            out.pop("result", None)
            out.pop("error_body", None)
        return out

    def _spawn_resolve_ref(spawn_ref: str):
        if not spawn_ref:
            return None
        os_url = OPENSEARCH_URL.rstrip("/")
        if spawn_ref.startswith("spawn-") and spawn_ref.count("-") == 2:
            parts = spawn_ref.split("-")
            if len(parts) == 3 and len(parts[2]) == 8:
                if _spawn_get_doc(spawn_ref) is not None:
                    return spawn_ref
        serial_str = spawn_ref
        if serial_str.startswith("spawn-"):
            serial_str = serial_str[6:]
        if serial_str.isdigit():
            nn = f"{int(serial_str):02d}"
            query = {"size": 1, "query": {"term": {"serial": nn}}, "sort": [{"submitted_epoch": {"order": "desc"}}]}
        else:
            query = {"size": 1, "query": {"term": {"alias": spawn_ref}}, "sort": [{"submitted_epoch": {"order": "desc"}}]}
        try:
            r = requests.post(
                f"{os_url}/{SPAWNS_INDEX}/_search",
                json=query,
                headers={"Content-Type": "application/json"},
                timeout=5,
            )
            if r.status_code != 200:
                return None
            hits = r.json().get("hits", {}).get("hits", [])
            if not hits:
                return None
            return hits[0].get("_id")
        except Exception:
            return None


    @app.post("/core/spawn/submit")
    async def core_spawn_submit(request: dict):
        """Spawn を OpenSearch に投入する (非同期、即時 return)。 worker がショートポーリングで pickup する。"""
        prompt = request.get("prompt") or ""
        if not prompt:
            return {"ok": False, "error": "prompt is required"}
        _spawn_ensure_indices()
        label = str(request.get("label") or "")
        alias = str(request.get("alias") or "")
        user_id = str(request.get("user_id") or "")
        model = str(request.get("model") or CLAUDE_MODEL)
        try:
            timeout_sec = int(request.get("timeout_sec", 1800) or 1800)
        except (TypeError, ValueError):
            timeout_sec = 1800
        priority = str(request.get("priority") or "normal").lower()
        if priority not in TASK_PRIORITIES:
            priority = "normal"
        context_text = str(request.get("context") or "")
        project_id = str(request.get("project_id") or "")
        is_supervisor = bool(request.get("is_supervisor") or False)
        parent_supervisor = str(request.get("parent_supervisor") or "")
        mode = str(request.get("mode") or "claude").lower()
        if mode not in ("claude", "orchestrator"):
            mode = "claude"
        if is_supervisor and timeout_sec < 14400:
            timeout_sec = 14400
        try:
            serial = _spawn_next_serial()
            unique_suffix = uuid4().hex[:8]
            full_id = f"spawn-{serial}-{unique_suffix}"
            submitted = _spawn_now_iso()
            submitted_epoch = time.time()
            doc = {
                "full_id": full_id,
                "state": "queued",
                "prompt": prompt,
                "label": label,
                "alias": alias,
                "user_id": user_id,
                "model": model,
                "serial": serial,
                "unique_suffix": unique_suffix,
                "priority": priority,
                "timeout_sec": timeout_sec,
                "submitted_at": submitted,
                "submitted_epoch": submitted_epoch,
                "started_at": None,
                "finished_at": None,
                "worker_id": "",
                "project_id": project_id,
                "is_supervisor": is_supervisor,
                "parent_supervisor": parent_supervisor,
                "managed_spawns": [],
                "context": context_text,
                "question": "",
                "result": "",
                "error_body": "",
                "answer_queue": [],
                "pickup_lease_at": None,
                "mode": mode,
                "triage_verdict": "",
            }
            os_url = OPENSEARCH_URL.rstrip("/")
            r = requests.put(
                f"{os_url}/{SPAWNS_INDEX}/_doc/{full_id}",
                json=doc,
                params={"refresh": "true"},
                headers={"Content-Type": "application/json"},
                timeout=10,
            )
            if r.status_code not in (200, 201):
                return {"ok": False, "error": f"opensearch put failed: {r.status_code} {r.text[:200]}"}
            if parent_supervisor:
                try:
                    upd = requests.post(
                        f"{os_url}/{SPAWNS_INDEX}/_update/{parent_supervisor}",
                        json={
                            "script": {
                                "source": (
                                    "if (ctx._source.managed_spawns == null) { ctx._source.managed_spawns = []; } "
                                    "if (!ctx._source.managed_spawns.contains(params.child)) { ctx._source.managed_spawns.add(params.child); }"
                                ),
                                "lang": "painless",
                                "params": {"child": full_id},
                            }
                        },
                        params={"refresh": "true", "retry_on_conflict": 3},
                        headers={"Content-Type": "application/json"},
                        timeout=5,
                    )
                    if upd.status_code == 200:
                        logger.info(f"[SPAWN] added {full_id} to parent supervisor {parent_supervisor}")
                except Exception as e:
                    logger.warning(f"[SPAWN] failed to update parent managed_spawns: {e}")
            logger.info(f"[SPAWN] submitted full_id={full_id} serial={serial} alias={alias!r} "
                        f"is_supervisor={is_supervisor} parent={parent_supervisor!r} project_id={project_id!r}")
            return {"ok": True, "full_id": full_id, "serial": serial, "alias": alias, "state": doc, "error": None}
        except Exception as e:
            logger.warning(f"[SPAWN] submit failed: {e}")
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/spawn/list")
    async def core_spawn_list(request: dict):
        _spawn_ensure_indices()
        state_filter = str(request.get("state") or "")
        try:
            limit = min(max(int(request.get("limit", 50) or 50), 1), 500)
        except (TypeError, ValueError):
            limit = 50
        include_result = bool(request.get("include_result", False))
        user_id_filter = str(request.get("user_id") or "")
        try:
            body = {"size": limit, "sort": [{"submitted_epoch": {"order": "desc"}}]}
            must = []
            if state_filter:
                must.append({"term": {"state": state_filter}})
            if user_id_filter:
                must.append({"term": {"user_id": user_id_filter}})
            body["query"] = {"bool": {"must": must}} if must else {"match_all": {}}
            os_url = OPENSEARCH_URL.rstrip("/")
            r = requests.post(
                f"{os_url}/{SPAWNS_INDEX}/_search",
                json=body,
                headers={"Content-Type": "application/json"},
                timeout=10,
            )
            if r.status_code != 200:
                return {"ok": False, "error": f"opensearch search failed: {r.status_code}"}
            hits = r.json().get("hits", {}).get("hits", [])
            spawns = []
            for h in hits:
                b = _spawn_bundle(h.get("_source"), include_result=include_result)
                if b:
                    spawns.append(b)
            return {"ok": True, "count": len(spawns), "spawns": spawns, "error": None}
        except Exception as e:
            logger.warning(f"[SPAWN] list failed: {e}")
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/spawn/get")
    async def core_spawn_get(request: dict):
        spawn_ref = str(request.get("spawn_ref") or "")
        if not spawn_ref:
            return {"ok": False, "error": "spawn_ref is required"}
        _spawn_ensure_indices()
        try:
            full_id = _spawn_resolve_ref(spawn_ref)
            if full_id is None:
                return {"ok": False, "spawn": None, "error": f"spawn not found: {spawn_ref}"}
            doc = _spawn_get_doc(full_id)
            if doc is None:
                return {"ok": False, "spawn": None, "error": f"spawn not found: {spawn_ref}"}
            return {"ok": True, "spawn": _spawn_bundle(doc, include_result=True), "error": None}
        except Exception as e:
            logger.warning(f"[SPAWN] get failed: ref={spawn_ref}: {e}")
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/spawn/cancel")
    async def core_spawn_cancel(request: dict):
        spawn_ref = str(request.get("spawn_ref") or "")
        if not spawn_ref:
            return {"ok": False, "error": "spawn_ref is required"}
        _spawn_ensure_indices()
        try:
            full_id = _spawn_resolve_ref(spawn_ref)
            if full_id is None:
                return {"ok": False, "spawn": None, "error": f"spawn not found: {spawn_ref}"}
            doc = _spawn_get_doc(full_id)
            if doc is None:
                return {"ok": False, "spawn": None, "error": f"spawn not found: {spawn_ref}"}
            current = doc.get("state") or ""
            if current in ("done", "failed", "cancelled"):
                return {"ok": True, "spawn": _spawn_bundle(doc), "error": None}
            new_state = "cancelled" if current == "queued" else "cancel_requested"
            updates = {"state": new_state}
            if new_state == "cancelled":
                updates["finished_at"] = _spawn_now_iso()
            os_url = OPENSEARCH_URL.rstrip("/")
            upd = requests.post(
                f"{os_url}/{SPAWNS_INDEX}/_update/{full_id}",
                json={"doc": updates},
                params={"refresh": "true", "retry_on_conflict": 3},
                headers={"Content-Type": "application/json"},
                timeout=10,
            )
            if upd.status_code != 200:
                return {"ok": False, "error": f"opensearch update failed: {upd.status_code} {upd.text[:200]}"}
            doc.update(updates)
            logger.info(f"[SPAWN] cancel full_id={full_id} from={current} to={new_state}")
            return {"ok": True, "spawn": _spawn_bundle(doc), "error": None}
        except Exception as e:
            logger.warning(f"[SPAWN] cancel failed: ref={spawn_ref}: {e}")
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/spawn/answer")
    async def core_spawn_answer(request: dict):
        spawn_ref = str(request.get("spawn_ref") or "")
        if not spawn_ref:
            return {"ok": False, "error": "spawn_ref is required"}
        answer = request.get("answer")
        if answer is None or (isinstance(answer, str) and not answer):
            return {"ok": False, "error": "answer is required"}
        if not isinstance(answer, str):
            answer = json.dumps(answer, ensure_ascii=False)
        _spawn_ensure_indices()
        try:
            full_id = _spawn_resolve_ref(spawn_ref)
            if full_id is None:
                return {"ok": False, "error": f"spawn not found: {spawn_ref}"}
            doc = _spawn_get_doc(full_id)
            if doc is None:
                return {"ok": False, "error": f"spawn not found: {spawn_ref}"}
            current = doc.get("state") or ""
            if current != "waiting_user":
                return {"ok": False, "error": f"spawn {full_id} is not in waiting_user state (current={current})"}
            answered_at = _spawn_now_iso()
            os_url = OPENSEARCH_URL.rstrip("/")
            upd = requests.post(
                f"{os_url}/{SPAWNS_INDEX}/_update/{full_id}",
                json={
                    "script": {
                        "source": (
                            "if (ctx._source.answer_queue == null) { ctx._source.answer_queue = []; } "
                            "ctx._source.answer_queue.add(params.entry);"
                        ),
                        "lang": "painless",
                        "params": {"entry": {"answer": answer, "answered_at": answered_at}},
                    }
                },
                params={"refresh": "true", "retry_on_conflict": 3},
                headers={"Content-Type": "application/json"},
                timeout=10,
            )
            if upd.status_code != 200:
                return {"ok": False, "error": f"opensearch update failed: {upd.status_code} {upd.text[:200]}"}
            logger.info(f"[SPAWN] answer submitted for full_id={full_id}")
            return {"ok": True, "error": None}
        except Exception as e:
            logger.warning(f"[SPAWN] answer failed: ref={spawn_ref}: {e}")
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/spawn/force_state")
    async def core_spawn_force_state(request: dict):
        spawn_ref = str(request.get("spawn_ref") or "")
        if not spawn_ref:
            return {"ok": False, "error": "spawn_ref is required"}
        new_state = str(request.get("new_state") or "")
        if new_state not in ("cancelled", "failed"):
            return {"ok": False, "error": f"new_state must be 'cancelled' or 'failed', got: {new_state!r}"}
        reason = str(request.get("reason") or "force_state by admin")
        _spawn_ensure_indices()
        try:
            full_id = _spawn_resolve_ref(spawn_ref)
            if full_id is None:
                return {"ok": False, "spawn": None, "error": f"spawn not found: {spawn_ref}"}
            doc = _spawn_get_doc(full_id)
            if doc is None:
                return {"ok": False, "spawn": None, "error": f"spawn not found: {spawn_ref}"}
            current = doc.get("state") or ""
            if current in ("done", "failed", "cancelled"):
                return {"ok": True, "spawn": _spawn_bundle(doc), "error": None}
            updates = {
                "state": new_state,
                "finished_at": _spawn_now_iso(),
                "error_body": reason,
                "question": "",
                "answer_queue": [],
            }
            os_url = OPENSEARCH_URL.rstrip("/")
            upd = requests.post(
                f"{os_url}/{SPAWNS_INDEX}/_update/{full_id}",
                json={"doc": updates},
                params={"refresh": "true", "retry_on_conflict": 3},
                headers={"Content-Type": "application/json"},
                timeout=10,
            )
            if upd.status_code != 200:
                return {"ok": False, "error": f"opensearch update failed: {upd.status_code} {upd.text[:200]}"}
            doc.update(updates)
            logger.info(f"[SPAWN] force_state full_id={full_id} from={current} to={new_state} reason={reason!r}")
            return {"ok": True, "spawn": _spawn_bundle(doc), "error": None}
        except Exception as e:
            logger.warning(f"[SPAWN] force_state failed: ref={spawn_ref}: {e}")
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    # ------------------------------------------------------------
    # Worker 用エンドポイント (task-worker Deployment が使う)
    # ------------------------------------------------------------

    @app.post("/core/spawn/pickup")
    async def core_spawn_pickup(request: dict):
        """queued な spawn を 1 件 pickup して running に遷移させる。 optimistic concurrency で 2 重取り防止。"""
        _spawn_ensure_indices()
        worker_id = str(request.get("worker_id") or "")
        if not worker_id:
            return {"ok": False, "spawn": None, "error": "worker_id is required"}
        os_url = OPENSEARCH_URL.rstrip("/")
        try:
            body = {
                "size": 5,
                "query": {"term": {"state": "queued"}},
                "sort": [
                    {
                        "_script": {
                            "type": "number",
                            "script": {
                                "source": (
                                    "def p = doc['priority'].value; "
                                    "if (p == 'high') { return 0; } "
                                    "if (p == 'normal') { return 1; } "
                                    "return 2;"
                                ),
                                "lang": "painless",
                            },
                            "order": "asc",
                        }
                    },
                    {"submitted_epoch": {"order": "asc"}},
                ],
                "seq_no_primary_term": True,
            }
            r = requests.post(
                f"{os_url}/{SPAWNS_INDEX}/_search",
                json=body,
                headers={"Content-Type": "application/json"},
                timeout=5,
            )
            if r.status_code != 200:
                return {"ok": False, "spawn": None, "error": f"opensearch search failed: {r.status_code}"}
            hits = r.json().get("hits", {}).get("hits", [])
            if not hits:
                return {"ok": True, "spawn": None, "error": None}
            for hit in hits:
                full_id = hit.get("_id")
                seq_no = hit.get("_seq_no")
                prim = hit.get("_primary_term")
                started = _spawn_now_iso()
                updates = {
                    "state": "running",
                    "started_at": started,
                    "worker_id": worker_id,
                    "pickup_lease_at": started,
                }
                upd = requests.post(
                    f"{os_url}/{SPAWNS_INDEX}/_update/{full_id}",
                    json={"doc": updates},
                    params={"if_seq_no": seq_no, "if_primary_term": prim, "refresh": "true"},
                    headers={"Content-Type": "application/json"},
                    timeout=5,
                )
                if upd.status_code == 200:
                    src = hit.get("_source") or {}
                    src.update(updates)
                    src["full_id"] = full_id
                    logger.info(f"[SPAWN] worker={worker_id} picked up {full_id}")
                    return {"ok": True, "spawn": src, "error": None}
                if upd.status_code == 409:
                    continue
                logger.warning(f"[SPAWN] pickup update unexpected: {upd.status_code} {upd.text[:200]}")
            return {"ok": True, "spawn": None, "error": None}
        except Exception as e:
            logger.warning(f"[SPAWN] pickup failed: {e}")
            return {"ok": False, "spawn": None, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/spawn/update_state")
    async def core_spawn_update_state(request: dict):
        """任意フィールドを更新する worker 用エンドポイント。"""
        _spawn_ensure_indices()
        full_id = str(request.get("full_id") or "")
        updates = request.get("updates") or {}
        if not full_id:
            return {"ok": False, "error": "full_id is required"}
        if not isinstance(updates, dict) or not updates:
            return {"ok": False, "error": "updates dict is required"}
        try:
            os_url = OPENSEARCH_URL.rstrip("/")
            upd = requests.post(
                f"{os_url}/{SPAWNS_INDEX}/_update/{full_id}",
                json={"doc": updates},
                params={"refresh": "true", "retry_on_conflict": 5},
                headers={"Content-Type": "application/json"},
                timeout=10,
            )
            if upd.status_code != 200:
                return {"ok": False, "error": f"opensearch update failed: {upd.status_code} {upd.text[:200]}"}
            return {"ok": True, "error": None}
        except Exception as e:
            logger.warning(f"[SPAWN] update_state failed: full_id={full_id}: {e}")
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/spawn/pop_answer")
    async def core_spawn_pop_answer(request: dict):
        """answer_queue から先頭 1 件を optimistic concurrency で取り出す。 空なら {ok:True, entry:None}。 現在 state も返す (worker が cancel_requested を検知するため)。"""
        _spawn_ensure_indices()
        full_id = str(request.get("full_id") or "")
        if not full_id:
            return {"ok": False, "entry": None, "state": None, "error": "full_id is required"}
        try:
            os_url = OPENSEARCH_URL.rstrip("/")
            r = requests.get(f"{os_url}/{SPAWNS_INDEX}/_doc/{full_id}", timeout=5)
            if r.status_code != 200:
                return {"ok": False, "entry": None, "state": None, "error": f"opensearch get failed: {r.status_code}"}
            js = r.json()
            if not js.get("found"):
                return {"ok": False, "entry": None, "state": None, "error": "spawn not found"}
            src = js.get("_source") or {}
            state_now = src.get("state")
            queue = src.get("answer_queue") or []
            if not queue:
                return {"ok": True, "entry": None, "state": state_now, "error": None}
            seq_no = js.get("_seq_no")
            prim = js.get("_primary_term")
            entry = queue[0]
            upd = requests.post(
                f"{os_url}/{SPAWNS_INDEX}/_update/{full_id}",
                json={
                    "script": {
                        "source": (
                            "if (ctx._source.answer_queue != null && ctx._source.answer_queue.size() > 0) { "
                            "  ctx._source.answer_queue.remove(0); "
                            "}"
                        ),
                        "lang": "painless",
                    }
                },
                params={"if_seq_no": seq_no, "if_primary_term": prim, "refresh": "true"},
                headers={"Content-Type": "application/json"},
                timeout=5,
            )
            if upd.status_code == 200:
                return {"ok": True, "entry": entry, "state": state_now, "error": None}
            if upd.status_code == 409:
                return {"ok": True, "entry": None, "state": state_now, "error": None}
            return {"ok": False, "entry": None, "state": state_now, "error": f"opensearch update failed: {upd.status_code}"}
        except Exception as e:
            logger.warning(f"[SPAWN] pop_answer failed: full_id={full_id}: {e}")
            return {"ok": False, "entry": None, "state": None, "error": f"{type(e).__name__}: {str(e)[:200]}"}


