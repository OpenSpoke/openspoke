    def get_reranker():
        """Cross-Encoderモデルを取得（初回のみロード、GPU/CPUフォールバック対応）"""
        global reranker_model
        if reranker_model is not None:
            return reranker_model

        import torch
        force_cpu = os.environ.get("RERANKER_FORCE_CPU", "0") == "1"

        if force_cpu:
            candidate_devices = ['cpu']
        elif hasattr(torch, 'xpu') and torch.xpu.is_available():
            candidate_devices = ['xpu', 'cpu']
        elif torch.cuda.is_available():
            candidate_devices = ['cuda', 'cpu']
        else:
            candidate_devices = ['cpu']

        last_error = None
        for device in candidate_devices:
            try:
                logger.info(f"[RERANKER] Loading Cross-Encoder model BAAI/bge-reranker-base on {device}")
                model = CrossEncoder('BAAI/bge-reranker-base', device=device)
                reranker_model = model
                logger.info(f"[RERANKER] Model loaded successfully on {device}")
                return reranker_model
            except Exception as e:
                last_error = e
                logger.warning(f"[RERANKER] Load failed on {device}: {type(e).__name__}: {str(e)[:200]}")
                continue

        logger.error(f"[RERANKER] All device load attempts failed: {last_error}")
        raise RuntimeError(f"Reranker model could not be loaded on any device: {last_error}")


