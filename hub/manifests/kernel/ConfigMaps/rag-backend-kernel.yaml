    @app.post("/opensearch/sync")
    async def sync_to_opensearch(request: dict):
        """MilvusのデータをOpenSearchに同期（既存データのバックフィル用）"""
        user_id = request.get("user_id")
        if not user_id:
            raise HTTPException(status_code=400, detail="user_id is required")

        if not OPENSEARCH_ENABLED:
            return {"status": "skipped", "reason": "OPENSEARCH_ENABLED is false"}

        collection_name = get_collection_name(user_id)
        if not utility.has_collection(collection_name):
            raise HTTPException(status_code=404, detail=f"User '{user_id}' has no knowledge base.")

        tenant = get_tenant_label(user_id)
        collection = Collection(collection_name)
        collection.load()

        # Milvusから全データを取得（クエリでスキャン）
        results = collection.query(
            expr="id >= 0",
            output_fields=["text"],
            limit=16384
        )

        texts = [r["text"] for r in results if r.get("text")]
        if not texts:
            return {"status": "empty", "synced": 0}

        # ESにバルクインデックス
        opensearch_index_chunks(texts, user_id, tenant, doc_id=f"sync_{int(time.time())}")

        logger.info(f"[OPENSEARCH_SYNC] Synced {len(texts)} chunks for user {user_id}")

        return {
            "status": "success",
            "user_id": user_id,
            "synced": len(texts),
        }


    @app.post("/query/temporal")
    async def query_temporal(request: dict):
        """時系列対応検索: 期間指定・鮮度重視の検索"""
        question = request.get("question", "")
        user_id = request.get("user_id")
        top_k = request.get("top_k", 10)
        since = request.get("since", "")
        until = request.get("until", "")
        recency_boost = request.get("recency_boost", True)

        if not user_id:
            raise HTTPException(status_code=400, detail="user_id is required")

        tenant = get_tenant_label(user_id)

        # Input guard
        if question:
            input_guard = call_guardrails("/guard/input", {
                "text": question,
                "tenant": tenant,
            })
            if input_guard and not input_guard.get("allowed", True):
                reason = input_guard.get("reason", "blocked")
                return {
                    "question": question,
                    "answer": f"この質問は安全上の理由でブロックされました（{reason}）",
                    "results": [],
                    "guardrails": {"input_blocked": True, "reason": reason},
                }

        # 時系列Hybrid検索（Dense + BM25時間フィルタ）
        all_results = []

        # 1. Dense vector検索（Milvus）- 意味的に近いチャンクを取得
        if question:
            collection_name = get_collection_name(user_id)
            if utility.has_collection(collection_name):
                collection = Collection(collection_name)
                collection.load()
                query_embedding = get_embedding(question)
                search_params = {"metric_type": "IP", "params": {"nprobe": 10}}
                milvus_results = collection.search(
                    data=[query_embedding],
                    anns_field="embedding",
                    param=search_params,
                    limit=top_k,
                    output_fields=["text"]
                )
                for hit in milvus_results[0]:
                    all_results.append({
                        "text": hit.entity.get("text"),
                        "score": float(hit.distance),
                        "source": "dense",
                    })
                logger.info(f"[TEMPORAL] Dense search: {len(milvus_results[0])} results")

        # 2. BM25時系列検索（OpenSearch）- 期間フィルタ+鮮度ブースト
        temporal_results = opensearch_search_temporal(
            question=question,
            tenant=tenant,
            top_k=top_k,
            since=since,
            until=until,
            recency_boost=recency_boost
        )

        # 3. RRF統合（Dense=主役、BM25時系列=補助+時間ブースト）
        if all_results and temporal_results:
            results = rrf_merge([all_results, temporal_results], weights=[1.0, 0.5])
            # 時系列情報をマージ
            temporal_map = {r["text"][:200]: r.get("created_at", "") for r in temporal_results}
            for r in results:
                key = r["text"][:200]
                if key in temporal_map:
                    r["created_at"] = temporal_map[key]
            logger.info(f"[TEMPORAL] RRF merged: {len(results)} results")
        elif temporal_results:
            results = temporal_results
        elif all_results:
            results = all_results
        else:
            results = []

        # 期間フィルタが指定された場合、日付なし・範囲外を除外
        if since or until:
            before_count = len(results)
            filtered = []
            for r in results:
                ca = r.get("created_at", "")
                if not ca:
                    continue
                ca_date = ca[:10]
                if since and ca_date < since:
                    continue
                if until and ca_date > until:
                    continue
                filtered.append(r)
            results = filtered
            logger.info(f"[TEMPORAL] Date filter: {before_count} → {len(results)} (since={since}, until={until})")

        results = results[:top_k]

        # Retrieval rails
        if results:
            chunk_guard = call_guardrails("/guard/chunks", {
                "chunks": [{"text": r["text"], "score": r.get("score", 0)} for r in results],
                "tenant": tenant,
            })
            if chunk_guard and chunk_guard.get("masked_count", 0) > 0:
                guarded = chunk_guard["chunks"]
                for i, r in enumerate(results):
                    if i < len(guarded) and guarded[i].get("masked"):
                        r["text"] = guarded[i]["text"]

        return {
            "question": question,
            "results": results,
            "total": len(results),
            "filters": {
                "since": since,
                "until": until,
                "recency_boost": recency_boost,
            }
        }


    @app.post("/schedule/search")
    async def schedule_search(request: dict):
        """スケジュール検索（変更・削除前のプレビュー用）"""
        keyword = request.get("keyword", "")
        user_id = request.get("user_id")
        date = request.get("date", "")
        top_k = request.get("top_k", 5)

        if not user_id:
            raise HTTPException(status_code=400, detail="user_id is required")
        if not keyword:
            raise HTTPException(status_code=400, detail="keyword is required")

        tenant = get_tenant_label(user_id)
        results = []

        # 1. Milvusでベクトル検索（IDを取得）
        collection_name = get_collection_name(user_id)
        if utility.has_collection(collection_name):
            collection = Collection(collection_name)
            collection.load()
            query_embedding = get_embedding(keyword)
            search_params = {"metric_type": "IP", "params": {"nprobe": 10}}
            milvus_results = collection.search(
                data=[query_embedding],
                anns_field="embedding",
                param=search_params,
                limit=top_k * 2,
                output_fields=["text"]
            )
            for hit in milvus_results[0]:
                text = hit.entity.get("text")
                # キーワードの一部がテキストに含まれるかチェック
                keyword_parts = keyword.split()
                if any(part in text for part in keyword_parts) or hit.distance > 0.5:
                    results.append({
                        "milvus_id": hit.id,
                        "text": text,
                        "score": float(hit.distance),
                        "source": "milvus",
                    })

        # 2. ESで検索（日付フィルタ付き）
        if OPENSEARCH_ENABLED:
            try:
                query_body = {
                    "size": top_k * 2,
                    "query": {
                        "bool": {
                            "must": [
                                {"match": {"text": {"query": keyword, "analyzer": "kuromoji_analyzer"}}}
                            ],
                            "filter": [{"term": {"tenant": tenant}}]
                        }
                    }
                }
                if date:
                    query_body["query"]["bool"]["filter"].append(
                        {"range": {"created_at": {"gte": date, "lte": date}}}
                    )
                opensearch_resp = requests.post(f"{OPENSEARCH_URL}/{OPENSEARCH_INDEX}/_search", json=query_body, timeout=10)
                if opensearch_resp.status_code == 200:
                    for hit in opensearch_resp.json().get("hits", {}).get("hits", []):
                        results.append({
                            "opensearch_id": hit["_id"],
                            "text": hit["_source"]["text"],
                            "score": float(hit["_score"]),
                            "created_at": hit["_source"].get("created_at", ""),
                            "source": "opensearch",
                        })
            except Exception as e:
                logger.warning(f"[SCHEDULE] OpenSearch search failed: {e}")

        # 重複除去（テキスト先頭200文字で判定）
        seen = set()
        unique_results = []
        for r in results:
            key = r["text"][:200]
            if key not in seen:
                seen.add(key)
                unique_results.append(r)

        return {
            "keyword": keyword,
            "date": date,
            "results": unique_results[:top_k],
            "total": len(unique_results),
        }


    @app.post("/schedule/delete")
    async def schedule_delete(request: dict):
        """スケジュール削除（Milvus + ES両方から削除）"""
        keyword = request.get("keyword", "")
        user_id = request.get("user_id")
        date = request.get("date", "")

        if not user_id:
            raise HTTPException(status_code=400, detail="user_id is required")
        if not keyword:
            raise HTTPException(status_code=400, detail="keyword is required")

        tenant = get_tenant_label(user_id)
        milvus_deleted = 0
        opensearch_deleted = 0

        # 1. Milvusから削除
        collection_name = get_collection_name(user_id)
        if utility.has_collection(collection_name):
            collection = Collection(collection_name)
            collection.load()
            query_embedding = get_embedding(keyword)
            search_params = {"metric_type": "IP", "params": {"nprobe": 10}}
            milvus_results = collection.search(
                data=[query_embedding],
                anns_field="embedding",
                param=search_params,
                limit=20,
                output_fields=["text"]
            )
            ids_to_delete = []
            for hit in milvus_results[0]:
                text = hit.entity.get("text")
                keyword_parts = keyword.split()
                if any(part in text for part in keyword_parts):
                    ids_to_delete.append(hit.id)

            if ids_to_delete:
                expr = f"id in [{','.join(str(i) for i in ids_to_delete)}]"
                collection.delete(expr)
                collection.flush()
                milvus_deleted = len(ids_to_delete)
                logger.info(f"[SCHEDULE] Milvus deleted {milvus_deleted} chunks: {expr}")

        # 2. ESから削除
        if OPENSEARCH_ENABLED:
            try:
                delete_query = {
                    "query": {
                        "bool": {
                            "must": [
                                {"match": {"text": {"query": keyword, "analyzer": "kuromoji_analyzer"}}}
                            ],
                            "filter": [{"term": {"tenant": tenant}}]
                        }
                    }
                }
                if date:
                    delete_query["query"]["bool"]["filter"].append(
                        {"range": {"created_at": {"gte": date, "lte": date}}}
                    )
                opensearch_resp = requests.post(
                    f"{OPENSEARCH_URL}/{OPENSEARCH_INDEX}/_delete_by_query",
                    json=delete_query, timeout=10
                )
                if opensearch_resp.status_code == 200:
                    opensearch_deleted = opensearch_resp.json().get("deleted", 0)
                    logger.info(f"[SCHEDULE] OpenSearch deleted {opensearch_deleted} documents")
            except Exception as e:
                logger.warning(f"[SCHEDULE] OpenSearch delete failed: {e}")

        # キャッシュクリア（古い回答を無効化）
        if milvus_deleted + opensearch_deleted > 0:
            try:
                requests.delete(f"{CACHE_URL}/cache/clear", timeout=3)
                logger.info("[SCHEDULE] Cache cleared after delete")
            except Exception:
                pass

        return {
            "keyword": keyword,
            "date": date,
            "milvus_deleted": milvus_deleted,
            "opensearch_deleted": opensearch_deleted,
            "status": "success" if (milvus_deleted + opensearch_deleted) > 0 else "not_found",
        }


    @app.post("/schedule/update")
    async def schedule_update(request: dict, background_tasks: BackgroundTasks):
        """スケジュール変更（削除 + 新規登録）"""
        keyword = request.get("keyword", "")
        user_id = request.get("user_id")
        old_date = request.get("old_date", "")
        new_text = request.get("new_text", "")
        new_date = request.get("new_date", "")

        if not user_id:
            raise HTTPException(status_code=400, detail="user_id is required")
        if not keyword:
            raise HTTPException(status_code=400, detail="keyword is required")
        if not new_text:
            raise HTTPException(status_code=400, detail="new_text is required")

        tenant = get_tenant_label(user_id)

        # 1. 古いエントリを削除
        delete_result = await schedule_delete({
            "keyword": keyword,
            "user_id": user_id,
            "date": old_date,
        })
        logger.info(f"[SCHEDULE] Update - deleted: milvus={delete_result['milvus_deleted']}, opensearch={delete_result['opensearch_deleted']}")

        # 2. 新しいエントリを登録
        # new_dateが空なら時間表現を自動解決
        if not new_date:
            new_date = resolve_temporal_expression(new_text)

        collection = create_or_get_collection(user_id)
        embeddings = get_embeddings_parallel([new_text])
        collection.insert([[new_text], embeddings])
        background_tasks.add_task(flush_and_load_collection, get_collection_name(user_id))

        doc_id = f"schedule_{int(time.time())}"
        opensearch_index_chunks([new_text], user_id, tenant, doc_id, event_date=new_date)

        logger.info(f"[SCHEDULE] Update - inserted: '{new_text[:50]}' date={new_date}")

        return {
            "status": "success",
            "deleted": {
                "keyword": keyword,
                "milvus_deleted": delete_result["milvus_deleted"],
                "opensearch_deleted": delete_result["opensearch_deleted"],
            },
            "inserted": {
                "text": new_text,
                "event_date": new_date,
            }
        }


    @app.delete("/user/{user_id}")
    async def delete_user_data(user_id: str):
        try:
            collection_name = get_collection_name(user_id)
            
            milvus_deleted = False
            if utility.has_collection(collection_name):
                utility.drop_collection(collection_name)
                milvus_deleted = True
            
            graph_deleted = False
            if neo4j_driver:
                tenant = get_tenant_label(user_id)
                with neo4j_driver.session() as session:
                    session.run(
                        "MATCH (e:Entity {tenant: $tenant}) DETACH DELETE e",
                        tenant=tenant
                    )
                    session.run(
                        "MATCH (d:Document {tenant: $tenant}) DETACH DELETE d",
                        tenant=tenant
                    )
                graph_deleted = True
            
            if milvus_deleted or graph_deleted:
                return {
                    "status": "success",
                    "milvus_deleted": milvus_deleted,
                    "graph_deleted": graph_deleted
                }
            else:
                raise HTTPException(status_code=404, detail=f"User '{user_id}' not found")
        except HTTPException:
            raise
        except Exception as e:
            raise HTTPException(status_code=500, detail=str(e))


    # ===== Google Drive エンドポイント =====

    def _gdrive_index_job(job_id: str, folder_id: str, user_id: str):

        """Google Driveフォルダを再帰スキャンしてベクトル化（バックグラウンド実行）"""

        def update(**kwargs):

            with _job_lock:

                _job_status[job_id].update(kwargs)

        try:

            start_time = time.time()

            creds = load_gdrive_credentials()

            if not creds:

                update(status="error", error="Not authenticated with Google Drive")

                return

            client = GoogleDriveClient(creds)

            update(status="scanning")

            files = client.list_files_recursive(folder_id)

            logger.info(f"[GDRIVE_JOB:{job_id}] Found {len(files)} files")

            if not files:

                update(status="error", error="No supported files found in folder")

                return

            update(total=len(files), status="downloading")

            collection = create_or_get_collection(user_id)

            all_chunks = []

            processed = 0

            for file_info in files:

                try:

                    file_id = file_info["id"]

                    file_name = file_info["name"]

                    mime_type = file_info["mimeType"]

                    content, effective_mime = client.download_file(file_id, mime_type)

                    if "wordprocessingml" in effective_mime:

                        text_content = extract_text_from_docx(content)

                        chunks = chunk_text(text_content)

                    elif "spreadsheetml" in effective_mime:

                        chunks = extract_chunks_from_xlsx_with_context(content)

                    elif "presentationml" in effective_mime:

                        text_content = extract_text_from_pptx(content)

                        chunks = chunk_text(text_content)

                    elif effective_mime == "application/pdf":

                        text_content = extract_text_from_pdf(content)

                        chunks = chunk_text(text_content)

                    elif effective_mime in ("text/plain", "text/markdown"):

                        text_content = content.decode("utf-8", errors="ignore")

                        chunks = chunk_text(text_content)

                    else:

                        continue

                    # ファイル名をプレフィックスとして付与

                    chunks = [f"[{file_name}]\n{c}" for c in chunks if c.strip()]

                    all_chunks.extend(chunks)

                    processed += 1

                    update(progress=processed, chunks=len(all_chunks), files=processed)

                    logger.info(f"[GDRIVE_JOB:{job_id}] {file_name}: {len(chunks)} chunks")

                except Exception as e:

                    logger.warning(f"[GDRIVE_JOB:{job_id}] Skipping {file_info.get('name')}: {e}")

            if not all_chunks:

                update(status="error", error="No text could be extracted from files")

                return

            update(status="embedding")

            embeddings = get_embeddings_parallel(all_chunks)

            collection.insert([all_chunks, embeddings])

            # OpenSearchにもインデックス（タイムスタンプ付き）
            opensearch_tenant = get_tenant_label(user_id)
            opensearch_index_chunks(all_chunks, user_id, opensearch_tenant, doc_id=f"gdrive_{folder_id}_{int(time.time())}")

            update(status="finalizing")

            collection.flush()

            collection.load()

            elapsed = time.time() - start_time

            with _job_lock:

                _job_status[job_id].update({

                    "status": "done",

                    "progress": processed,

                    "total": processed,

                    "files": processed,

                    "chunks": len(all_chunks),

                    "elapsed_sec": round(elapsed, 1),

                    "total_entities": collection.num_entities

                })

            logger.info(f"[GDRIVE_JOB:{job_id}] Done: {processed} files, {len(all_chunks)} chunks in {elapsed:.1f}s")

        except Exception as e:

            logger.error(f"[GDRIVE_JOB:{job_id}] Failed: {e}")

            with _job_lock:

                _job_status[job_id].update({"status": "error", "error": str(e)})


    @app.get("/gdrive/auth/url")
    async def gdrive_auth_url(redirect_uri: str):

        """OAuth2認証URLを生成して返す"""

        if not GDRIVE_AVAILABLE:

            raise HTTPException(status_code=503, detail="Google Drive packages not installed")

        if not GOOGLE_CLIENT_ID or not GOOGLE_CLIENT_SECRET:

            raise HTTPException(status_code=500, detail="GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET not configured")

        flow = Flow.from_client_config(

            {"web": {

                "client_id": GOOGLE_CLIENT_ID,

                "client_secret": GOOGLE_CLIENT_SECRET,

                "auth_uri": "https://accounts.google.com/o/oauth2/auth",

                "token_uri": "https://oauth2.googleapis.com/token",

            }},

            scopes=GDRIVE_SCOPES,

            redirect_uri=redirect_uri

        )

        auth_url, state = flow.authorization_url(

            access_type="offline",

            include_granted_scopes="true",

            prompt="consent"

        )

        return {"auth_url": auth_url, "state": state}


