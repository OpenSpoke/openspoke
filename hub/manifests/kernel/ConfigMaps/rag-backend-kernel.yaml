    @app.post("/core/swallow/generate-text")
    async def core_swallow_generate_text(request: dict):
        """Swallow vLLM への自由テキスト生成リクエストを kernel Pod に集約する。

        OpenAI 互換 API の messages 形式 (完全形) を受け付け、 結果テキストを返す。
        使用量計測は行わない (Swallow は自社 GPU)。

        Body:
            {
              "messages": [{"role": "user|assistant|system", "content": "..."}, ...],
              "max_tokens": int, "temperature": float, "seed": int | null,
              "top_p": float | null, "stop": list[str] | null, "timeout": float
            }
        Returns:
            {"ok": bool, "text": str, "model": str, "elapsed_sec": float, "error": str | null}
        """
        messages = request.get("messages")
        if not messages or not isinstance(messages, list):
            raise HTTPException(status_code=400, detail="messages (list) is required")
        for m in messages:
            if not isinstance(m, dict) or "role" not in m or "content" not in m:
                raise HTTPException(status_code=400, detail="each message must have role and content")

        payload = {
            "model": LLM_MODEL,
            "messages": messages,
            "max_tokens": int(request.get("max_tokens", 256)),
            "temperature": float(request.get("temperature", 0.1)),
        }
        if request.get("seed") is not None:
            payload["seed"] = int(request["seed"])
        if request.get("top_p") is not None:
            payload["top_p"] = float(request["top_p"])
        if request.get("stop") is not None:
            payload["stop"] = request["stop"]

        timeout = float(request.get("timeout", 60))
        start = time.time()
        try:
            response = await asyncio.to_thread(
                requests.post,
                f"{VLLM_URL}/v1/chat/completions",
                json=payload,
                timeout=timeout,
            )
            response.raise_for_status()
            data = response.json()
            text = data["choices"][0]["message"]["content"]
            elapsed = time.time() - start
            logger.info(f"[SWALLOW_GEN] ok len={len(text)} elapsed={elapsed:.2f}s seed={payload.get('seed')}")
            return {
                "ok": True,
                "text": text,
                "model": LLM_MODEL,
                "elapsed_sec": round(elapsed, 3),
                "error": None,
            }
        except Exception as e:
            elapsed = time.time() - start
            logger.error(f"[SWALLOW_GEN] failed: {type(e).__name__}: {e}")
            return {
                "ok": False,
                "text": "",
                "model": LLM_MODEL,
                "elapsed_sec": round(elapsed, 3),
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }


    @app.post("/core/swallow/generate-text-stream")
    async def core_swallow_generate_text_stream(request: dict):
        """Swallow vLLM のストリーミング応答を NDJSON で配信する。

        vLLM の OpenAI 互換 API は SSE (Server-Sent Events) で chunk を流すので、
        その chunk をパースして {"type":"token","content":"..."} の NDJSON 行に変換する。

        Body (非 stream 版と同じ):
            {"messages": [...], "max_tokens": int, "temperature": float,
             "seed": int|null, "top_p": float|null, "stop": list|null, "timeout": float}
        Returns:
            NDJSON ストリーム:
                {"type":"token","content":"..."}      トークン1つ
                {"type":"done","elapsed_sec":F}        完了
                {"type":"error","error":"..."}         エラー
        """
        messages = request.get("messages")
        if not messages or not isinstance(messages, list):
            raise HTTPException(status_code=400, detail="messages (list) is required")
        for m in messages:
            if not isinstance(m, dict) or "role" not in m or "content" not in m:
                raise HTTPException(status_code=400, detail="each message must have role and content")

        _options = {
            "num_predict": int(request.get("max_tokens", 1024)),
            "temperature": float(request.get("temperature", 0.3)),
            "num_ctx": int(request.get("num_ctx", 2048)),
        }
        if request.get("seed") is not None:
            _options["seed"] = int(request["seed"])
        if request.get("top_p") is not None:
            _options["top_p"] = float(request["top_p"])
        if request.get("stop") is not None:
            _options["stop"] = request["stop"]
        payload = {
            "model": LLM_MODEL,
            "messages": messages,
            "stream": True,
            "options": _options,
        }

        timeout = float(request.get("timeout", 120))

        def _generate_ndjson():
            """Ollama /api/chat の NDJSON を読みながら NDJSON を yield する同期ジェネレータ。"""
            start = time.time()
            try:
                resp = requests.post(
                    f"{VLLM_URL}/api/chat",
                    json=payload,
                    timeout=timeout,
                    stream=True,
                )
                if resp.status_code != 200:
                    # Ollama がエラーを返した場合、 ボディに詳細が入っているのでそれをログに出す。
                    # また、 送信した payload の概要も合わせて出して原因追跡を助ける。
                    err_body = ""
                    try:
                        err_body = resp.text[:1500]
                    except Exception:
                        pass
                    msgs_summary = []
                    for i, m in enumerate(payload.get("messages", [])):
                        msgs_summary.append(f"[{i}]{m.get('role','?')}(len={len(m.get('content','') or '')})")
                    logger.error(
                        f"[SWALLOW_STREAM] Ollama returned {resp.status_code}: body={err_body}; "
                        f"payload msgs=[{', '.join(msgs_summary)}], "
                        f"options={payload.get('options')}"
                    )
                    resp.raise_for_status()
                for raw_line in resp.iter_lines(decode_unicode=True):
                    if not raw_line:
                        continue
                    # Ollama /api/chat: 各行が素の JSON ({"message":{"content":...},"done":bool})
                    try:
                        chunk = json.loads(raw_line)
                    except json.JSONDecodeError:
                        continue
                    content = (chunk.get("message", {}) or {}).get("content", "")
                    if content:
                        yield (json.dumps({"type": "token", "content": content}, ensure_ascii=False) + "\n").encode("utf-8")
                    if chunk.get("done"):
                        break
                elapsed = time.time() - start
                logger.info(f"[SWALLOW_STREAM] done in {elapsed:.2f}s options={payload.get('options')}")
                yield (json.dumps({"type": "done", "elapsed_sec": round(elapsed, 3)}, ensure_ascii=False) + "\n").encode("utf-8")
            except Exception as e:
                elapsed = time.time() - start
                logger.error(f"[SWALLOW_STREAM] failed: {type(e).__name__}: {e}")
                yield (json.dumps({
                    "type": "error",
                    "error": f"{type(e).__name__}: {str(e)[:200]}",
                    "elapsed_sec": round(elapsed, 3),
                }, ensure_ascii=False) + "\n").encode("utf-8")

        return StreamingResponse(_generate_ndjson(), media_type="application/x-ndjson")


    @app.post("/core/claude/generate-text")
    async def core_claude_generate_text(request: dict):
        """generate_claude_text の HTTP ラッパー。

        Anthropic Claude API への自由テキスト生成リクエストを kernel Pod に集約する。
        prompt は文字列または content blocks のリスト (Prompt Caching 対応) を受け付ける。
        system も同様に文字列 or blocks リストを受け付ける。
        kernel 側で record_claude_usage が呼ばれるため、トークン集計は kernel に一元化される。

        Body (全フィールドは generate_claude_text の引数と1対1対応):
            {
              "prompt": str | list[dict],          # 必須
              "max_tokens": int,                    # default 1024
              "temperature": float,                 # default 0.3
              "timeout": float | null,              # default null (=CLAUDE_TIMEOUT)
              "max_retries": int | null,            # default null (=SDK default)
              "system": str | list[dict] | null,    # default null
              "response_schema": dict | null,       # default null
              "use_streaming": bool | null,         # default null (auto)
              "op": str,                            # default "text"
              "session_id": str | null,
              "user_id": str | null
            }
        Returns:
            {"text": "..."}
        """
        if "prompt" not in request:
            raise HTTPException(status_code=400, detail="prompt is required")

        # generate_claude_text のシグネチャに合わせて kwargs を組み立てる
        # 未指定フィールドは元関数のデフォルトに任せる (None で渡しても元関数が判定する)
        kwargs = {
            "prompt": request.get("prompt"),
            "max_tokens": int(request.get("max_tokens", 1024)),
            "temperature": float(request.get("temperature", 0.3)),
            "timeout": request.get("timeout"),
            "max_retries": request.get("max_retries"),
            "system": request.get("system"),
            "response_schema": request.get("response_schema"),
            "use_streaming": request.get("use_streaming"),
            "op": request.get("op", "text"),
            "session_id": request.get("session_id"),
            "user_id": request.get("user_id"),
            "model": request.get("model"),
        }
        # 元関数はエラー時もエラーメッセージ文字列を返す (例外を投げない) 仕様
        # 同期関数を asyncio.to_thread で別スレッドに退避し、 イベントループを
        # ブロックしないようにする。 これで rag-backend が並列に投げてきた
        # 翻訳チャンク等が kernel 内で本当に並列処理される。
        text = await asyncio.to_thread(generate_claude_text, **kwargs)
        return {"text": text}


    @app.post("/core/claude/generate-text-stream")
    async def core_claude_generate_text_stream(request: dict):
        """generate_claude_text の streaming 版 HTTP ラッパー。

        Claude API のストリーミング応答をトークンごとに NDJSON で配信する。
        フロントエンド向けにリアルタイム表示するユースケースで使用。

        Body (generate-text と同じ JSON 構造):
            {"prompt": str|list, "max_tokens": int, "temperature": float,
             "system": str|list|null, "op": str, "session_id": str|null, "user_id": str|null}
        Returns:
            NDJSON ストリーム。各行が以下のいずれかの JSON:
                {"type":"token","content":"..."}        トークン1つ
                {"type":"done","input_tokens":N,
                 "output_tokens":M,"cost_usd":F}        完了 (1ストリームに1回)
                {"type":"error","error":"..."}          エラー
        """
        if "prompt" not in request:
            raise HTTPException(status_code=400, detail="prompt is required")

        prompt = request.get("prompt")
        max_tokens = int(request.get("max_tokens", 4096))
        temperature = float(request.get("temperature", 0.3))
        timeout = request.get("timeout")
        system = request.get("system")
        op = request.get("op", "text_stream")
        session_id = request.get("session_id")
        user_id = request.get("user_id")
        model = request.get("model") or None

        effective_timeout = float(timeout) if timeout is not None else CLAUDE_TIMEOUT
        effective_model = model if model else CLAUDE_MODEL

        # messages.stream の create_kwargs を組み立てる (generate_claude_text の非 streaming 版と同じ流儀)
        if isinstance(prompt, list):
            messages = [{"role": "user", "content": prompt}]
        else:
            messages = [{"role": "user", "content": str(prompt)}]
        create_kwargs = {
            "model": effective_model,
            "max_tokens": max_tokens,
            "temperature": temperature,
            "messages": messages,
        }
        if system is not None:
            create_kwargs["system"] = system

        # Opus 4.7 / 4.8 以降は temperature/top_p/top_k を受け付けないため除外する
        _claude_strip_unsupported_sampling(effective_model, create_kwargs)

        def _generate_ndjson():
            """Anthropic ストリームを読みながら NDJSON 行を yield する同期ジェネレータ。

            FastAPI の StreamingResponse は同期/非同期どちらの generator も受け付け、
            内部で thread pool に委譲してくれる。Anthropic SDK の messages.stream は
            同期コンテキストマネージャなので同期 generator がシンプル。
            """
            input_tokens = 0
            output_tokens = 0
            cache_w = 0
            cache_r = 0
            start_time = time.time()
            try:
                client = get_anthropic_client()
                client_with_options = client.with_options(timeout=effective_timeout)
                with client_with_options.messages.stream(**create_kwargs) as stream:
                    for text_chunk in stream.text_stream:
                        if text_chunk:
                            yield (json.dumps({"type": "token", "content": text_chunk}, ensure_ascii=False) + "\n").encode("utf-8")
                    final = stream.get_final_message()
                    input_tokens = getattr(final.usage, "input_tokens", 0) or 0
                    output_tokens = getattr(final.usage, "output_tokens", 0) or 0
                    # Prompt Caching トークン (存在しないモデル/呼び方では0)
                    cache_w = getattr(final.usage, "cache_creation_input_tokens", 0) or 0
                    cache_r = getattr(final.usage, "cache_read_input_tokens", 0) or 0

                # トークン記録 (kernel 側のメモリカウンタ + OpenSearch claude_usage インデックス)
                record_claude_usage(op, input_tokens, output_tokens, effective_model,
                                    cache_w=cache_w, cache_r=cache_r,
                                    session_id=session_id, user_id=user_id)
                # cost: モデル別単価で計算 (Sonnet/Opus/Haiku 対応)
                if "opus" in effective_model:
                    _p_in_s, _p_cw_s, _p_cr_s, _p_out_s = 15.0, 18.75, 1.50, 75.0
                elif "haiku" in effective_model:
                    _p_in_s, _p_cw_s, _p_cr_s, _p_out_s = 1.0, 1.25, 0.10, 5.0
                else:
                    _p_in_s, _p_cw_s, _p_cr_s, _p_out_s = 3.0, 3.75, 0.30, 15.0
                cost_usd = (
                    (input_tokens * _p_in_s / 1_000_000)
                    + (cache_w * _p_cw_s / 1_000_000)
                    + (cache_r * _p_cr_s / 1_000_000)
                    + (output_tokens * _p_out_s / 1_000_000)
                )
                elapsed = time.time() - start_time
                logger.info(f"[CLAUDE_TEXT_STREAM] OK in {elapsed:.2f}s, model={effective_model}, tokens in={input_tokens} out={output_tokens} cache_w={cache_w} cache_r={cache_r}, cost=${cost_usd:.4f}, op={op}")

                # done メッセージで完了通知
                done = {
                    "type": "done",
                    "input_tokens": input_tokens,
                    "output_tokens": output_tokens,
                    "cache_w": cache_w,
                    "cache_r": cache_r,
                    "cost_usd": cost_usd,
                }
                yield (json.dumps(done, ensure_ascii=False) + "\n").encode("utf-8")
            except Exception as e:
                elapsed = time.time() - start_time
                logger.error(f"[CLAUDE_TEXT_STREAM] Error after {elapsed:.2f}s: {type(e).__name__}: {e}")
                err = {"type": "error", "error": f"{type(e).__name__}: {str(e)[:200]}"}
                yield (json.dumps(err, ensure_ascii=False) + "\n").encode("utf-8")

        return StreamingResponse(_generate_ndjson(), media_type="application/x-ndjson")


    @app.post("/core/claude/stream-with-mcp")
    async def core_claude_stream_with_mcp(request: dict):
        """Claude を stream モードで呼び、 MCP tool ループを回しながら NDJSON で配信する。

        the assistantバックエンド等の上位アプリは、 「Claude を呼びつつ、 必要に応じて MCP tool を
        自律的に呼ばせて記憶検索等を行わせる」ことが kernel_client 経由で完結する。
        これにより上位アプリは Anthropic SDK や MCP プロトコルに直接依存せず、 純粋な
        kernel クライアントとして振る舞える。

        Body:
            {
              "messages": [{"role": "user|assistant", "content": "..."}, ...],   # 必須
              "system": "...",                       # 任意 (system prompt)
              "max_tokens": 2048,                    # 任意 (default 2048)
              "temperature": 0.5,                    # 任意 (default 0.5)
              "max_tool_iterations": 5,              # 任意 (default CLAUDE_MAX_TOOL_ITERATIONS)
              "op": "secretary_chat",                # 任意 (使用量ログのオペレーション識別)
              "user_id": "example"                    # 任意 (使用量ログ用)
            }

        Returns:
            NDJSON ストリーム:
                {"type": "token", "content": "..."}                       text chunk
                {"type": "tool_use", "name": "...", "input": {...}}       tool 呼び出し開始
                {"type": "tool_result", "name": "...", "ok": bool, "error": "..."}  tool 完了通知
                {"type": "done", "elapsed_sec": F, "input_tokens": N, "output_tokens": N, "tool_calls": N}
                {"type": "error", "error": "..."}                         エラー
        """
        messages = request.get("messages")
        if not messages or not isinstance(messages, list):
            raise HTTPException(status_code=400, detail="messages (list) is required")

        system_prompt = request.get("system") or ""
        max_tokens = int(request.get("max_tokens", 2048))
        temperature = float(request.get("temperature", 0.5))
        max_tool_iterations = int(request.get("max_tool_iterations", CLAUDE_MAX_TOOL_ITERATIONS))
        op = request.get("op", "claude_stream_with_mcp")
        user_id = request.get("user_id", "")
        # tool_names_allowlist: list[str] | None
        # 指定があれば MCP の tool 一覧からこの集合のみを Claude に渡す (後方互換: 未指定なら全 tool)。
        # the assistant backend の tool selector (Haiku) で発話に応じて絞り込むのに使う。
        tool_names_allowlist_raw = request.get("tool_names_allowlist")
        if tool_names_allowlist_raw is None:
            tool_names_allowlist = None
        elif isinstance(tool_names_allowlist_raw, list):
            tool_names_allowlist = {str(x) for x in tool_names_allowlist_raw if isinstance(x, str)}
        else:
            raise HTTPException(status_code=400, detail="tool_names_allowlist must be a list of strings or null")

        if not MCP_API_KEY or not MCP_SERVER_URL:
            raise HTTPException(
                status_code=500,
                detail="MCP config missing (MCP_API_KEY/MCP_SERVER_URL not set)",
            )

        def _generate_ndjson():
            """同期ジェネレータ: SimpleMCPClient + Anthropic stream + tool ループ。"""
            start = time.time()
            total_input_tokens = 0
            total_output_tokens = 0
            tool_call_count = 0

            try:
                client = get_anthropic_client()
            except Exception as e:
                err = {"type": "error", "error": f"anthropic client init failed: {type(e).__name__}: {e}"}
                yield (json.dumps(err, ensure_ascii=False) + "\n").encode("utf-8")
                return

            try:
                with SimpleMCPClient(MCP_SERVER_URL, MCP_API_KEY, timeout=MCP_CONNECT_TIMEOUT) as mcp_client:
                    try:
                        all_tools = mcp_client.list_tools()
                    except Exception as e:
                        err = {"type": "error", "error": f"MCP list_tools failed: {type(e).__name__}: {e}"}
                        yield (json.dumps(err, ensure_ascii=False) + "\n").encode("utf-8")
                        return

                    # 全 tool を Claude に公開
                    # prompt caching: 最後の tool に cache_control: ephemeral を付けると
                    # その手前までの全 tool 定義 + system がキャッシュされる (5分 TTL)。
                    # 2 回目以降の呼び出しでは cache_read 扱いになり input token 課金が
                    # 大幅に減る (60+ tools, 約 30k tokens → ほぼ 0)。
                    # allowlist 指定時は MCP 一覧をこの集合で絞り込む (the assistant backend tool selector 用)。
                    tools_for_claude = []
                    skipped_by_allowlist = 0
                    for t in all_tools:
                        tname = t["name"]
                        if tool_names_allowlist is not None and tname not in tool_names_allowlist:
                            skipped_by_allowlist += 1
                            continue
                        tools_for_claude.append({
                            "name": tname,
                            "description": t.get("description", ""),
                            "input_schema": t.get("inputSchema", {"type": "object", "properties": {}}),
                        })
                    if tools_for_claude:
                        tools_for_claude[-1]["cache_control"] = {"type": "ephemeral"}
                    if tool_names_allowlist is not None:
                        logger.info(
                            f"[CLAUDE_MCP_STREAM] Exposing {len(tools_for_claude)} tools "
                            f"(filtered from {len(all_tools)}, skipped={skipped_by_allowlist}, "
                            f"allowlist_size={len(tool_names_allowlist)}, last has cache_control), "
                            f"max_iter={max_tool_iterations}"
                        )
                    else:
                        logger.info(
                            f"[CLAUDE_MCP_STREAM] Exposing {len(tools_for_claude)} tools "
                            f"(no allowlist, last has cache_control), max_iter={max_tool_iterations}"
                        )

                    msgs = list(messages)

                    for iteration in range(max_tool_iterations):
                        logger.info(f"[CLAUDE_MCP_STREAM] Iteration {iteration + 1}/{max_tool_iterations}")

                        create_kwargs = {
                            "model": CLAUDE_MODEL,
                            "max_tokens": max_tokens,
                            "temperature": temperature,
                            "messages": msgs,
                        }
                        if system_prompt:
                            # 構造化形式 + cache_control: ephemeral で system もキャッシュ対象に。
                            # tool 定義側のキャッシュとあわせて、 2 回目以降の呼び出しでは
                            # system + tools が cache_read として扱われる。
                            create_kwargs["system"] = [
                                {
                                    "type": "text",
                                    "text": system_prompt,
                                    "cache_control": {"type": "ephemeral"},
                                }
                            ]
                        if tools_for_claude:
                            create_kwargs["tools"] = tools_for_claude

                        # Opus 4.7 / 4.8 以降は temperature/top_p/top_k を受け付けないため除外する
                        _claude_strip_unsupported_sampling(CLAUDE_MODEL, create_kwargs)

                        try:
                            with client.messages.stream(**create_kwargs) as stream:
                                # text token を逐次配信
                                for text_chunk in stream.text_stream:
                                    if text_chunk:
                                        ev = {"type": "token", "content": text_chunk}
                                        yield (json.dumps(ev, ensure_ascii=False) + "\n").encode("utf-8")
                                final_message = stream.get_final_message()
                        except Exception as e:
                            logger.error(f"[CLAUDE_MCP_STREAM] stream error: {type(e).__name__}: {e}")
                            err = {"type": "error", "error": f"{type(e).__name__}: {str(e)[:200]}"}
                            yield (json.dumps(err, ensure_ascii=False) + "\n").encode("utf-8")
                            return

                        # 使用量を集計
                        try:
                            usage = final_message.usage
                            in_tk = getattr(usage, "input_tokens", 0) or 0
                            out_tk = getattr(usage, "output_tokens", 0) or 0
                            cache_w = getattr(usage, "cache_creation_input_tokens", 0) or 0
                            cache_r = getattr(usage, "cache_read_input_tokens", 0) or 0
                            total_input_tokens += in_tk
                            total_output_tokens += out_tk
                            logger.info(
                                f"[CLAUDE_MCP_STREAM] usage iter={iteration + 1} "
                                f"in={in_tk} out={out_tk} cache_w={cache_w} cache_r={cache_r}"
                            )
                            record_claude_usage(op, in_tk, out_tk, CLAUDE_MODEL,
                                                cache_w=cache_w, cache_r=cache_r,
                                                user_id=user_id)
                        except Exception as e:
                            logger.warning(f"[CLAUDE_MCP_STREAM] usage record failed: {e}")

                        stop_reason = getattr(final_message, "stop_reason", None)
                        logger.info(f"[CLAUDE_MCP_STREAM] stop_reason={stop_reason}")

                        if stop_reason != "tool_use":
                            # 完了
                            elapsed = time.time() - start
                            done = {
                                "type": "done",
                                "elapsed_sec": round(elapsed, 3),
                                "input_tokens": total_input_tokens,
                                "output_tokens": total_output_tokens,
                                "tool_calls": tool_call_count,
                            }
                            yield (json.dumps(done, ensure_ascii=False) + "\n").encode("utf-8")
                            return

                        # tool_use を実行
                        # assistant の content をそのまま履歴に追加
                        assistant_content = []
                        for block in final_message.content:
                            btype = getattr(block, "type", None)
                            if btype == "text":
                                assistant_content.append({"type": "text", "text": block.text})
                            elif btype == "tool_use":
                                assistant_content.append({
                                    "type": "tool_use",
                                    "id": block.id,
                                    "name": block.name,
                                    "input": dict(block.input),
                                })
                        msgs.append({"role": "assistant", "content": assistant_content})

                        # 各 tool_use を順に実行
                        tool_results_content = []
                        for block in final_message.content:
                            if getattr(block, "type", None) != "tool_use":
                                continue
                            tool_call_count += 1
                            tool_name = block.name
                            tool_args = dict(block.input)
                            logger.info(f"[CLAUDE_MCP_STREAM] Tool #{tool_call_count}: {tool_name}({list(tool_args.keys())})")

                            # 開始通知
                            ev_use = {"type": "tool_use", "name": tool_name, "input": tool_args}
                            yield (json.dumps(ev_use, ensure_ascii=False) + "\n").encode("utf-8")

                            try:
                                tool_output = mcp_client.call_tool(tool_name, tool_args)
                                tool_results_content.append({
                                    "type": "tool_result",
                                    "tool_use_id": block.id,
                                    "content": tool_output if tool_output else "(no result)",
                                })
                                ev_result = {"type": "tool_result", "name": tool_name, "ok": True}
                                yield (json.dumps(ev_result, ensure_ascii=False) + "\n").encode("utf-8")
                            except Exception as e:
                                logger.error(f"[CLAUDE_MCP_STREAM] tool {tool_name} failed: {type(e).__name__}: {e}")
                                tool_results_content.append({
                                    "type": "tool_result",
                                    "tool_use_id": block.id,
                                    "content": f"ツール実行エラー: {type(e).__name__}: {str(e)[:120]}",
                                    "is_error": True,
                                })
                                ev_result = {
                                    "type": "tool_result",
                                    "name": tool_name,
                                    "ok": False,
                                    "error": f"{type(e).__name__}",
                                }
                                yield (json.dumps(ev_result, ensure_ascii=False) + "\n").encode("utf-8")

                        msgs.append({"role": "user", "content": tool_results_content})

                    # 反復上限に到達
                    logger.warning("[CLAUDE_MCP_STREAM] max iterations reached")
                    err = {"type": "error", "error": "max tool iterations reached"}
                    yield (json.dumps(err, ensure_ascii=False) + "\n").encode("utf-8")

            except Exception as e:
                logger.error(f"[CLAUDE_MCP_STREAM] outer error: {type(e).__name__}: {e}")
                err = {"type": "error", "error": f"{type(e).__name__}: {str(e)[:200]}"}
                yield (json.dumps(err, ensure_ascii=False) + "\n").encode("utf-8")

        return StreamingResponse(_generate_ndjson(), media_type="application/x-ndjson")


    # tool selector で使う軽量モデル。
