                        auth=(NEO4J_USER, NEO4J_PASSWORD)
                    )
                else:
                    neo4j_driver = GraphDatabase.driver(NEO4J_URI)
                neo4j_driver.verify_connectivity()
                logger.info(f"Connected to Memgraph at {NEO4J_URI}")
            except Exception as e:
