    class CodeChunker:
        """ソースコードをチャンク分割"""
        
        @staticmethod
        def chunk_code(file_path: str, content: str, chunk_lines: int = CODE_CHUNK_LINES) -> list:
            """コードを行数ベースでチャンク分割"""
            lines = content.split('\n')
            chunks = []
            
            for i in range(0, len(lines), chunk_lines):
                chunk_lines_subset = lines[i:i + chunk_lines]
                chunk_text = '\n'.join(chunk_lines_subset)
                
                start_line = i + 1
                end_line = min(i + chunk_lines, len(lines))
                chunk_with_meta = f"[File: {file_path} | Lines: {start_line}-{end_line}]\n{chunk_text}"
                
                chunks.append(chunk_with_meta)
            
            return chunks if chunks else [f"[File: {file_path}]\n{content}"]


    class GoogleDriveClient:

        """Google Drive からファイルを再帰的にスキャン・ダウンロードするクライアント"""

        SUPPORTED_MIME_TYPES = {

            "application/vnd.openxmlformats-officedocument.wordprocessingml.document",

            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",

            "application/vnd.openxmlformats-officedocument.presentationml.presentation",

            "application/pdf",

            "text/plain",

            "text/markdown",

            "application/vnd.google-apps.document",

            "application/vnd.google-apps.spreadsheet",

            "application/vnd.google-apps.presentation",

        }

        GOOGLE_EXPORT_MIME = {

            "application/vnd.google-apps.document": "application/vnd.openxmlformats-officedocument.wordprocessingml.document",

            "application/vnd.google-apps.spreadsheet": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",

            "application/vnd.google-apps.presentation": "application/vnd.openxmlformats-officedocument.presentationml.presentation",

        }

        def __init__(self, credentials):

            self.service = build("drive", "v3", credentials=credentials)

        def list_files_recursive(self, folder_id: str) -> list:

            """フォルダを再帰的にスキャンしてサポート対象ファイル一覧を返す"""

            files = []

            self._scan_folder(folder_id, files, depth=0)

            return files

        def _scan_folder(self, folder_id: str, files: list, depth: int):

            if depth > 10:

                return

            page_token = None

            while True:

                query = f"'{folder_id}' in parents and trashed = false"

                resp = self.service.files().list(

                    q=query,

                    fields="nextPageToken, files(id, name, mimeType, size)",

                    pageToken=page_token,

                    pageSize=100

                ).execute()

                for item in resp.get("files", []):

                    if item["mimeType"] == "application/vnd.google-apps.folder":

                        self._scan_folder(item["id"], files, depth + 1)

                    elif item["mimeType"] in self.SUPPORTED_MIME_TYPES:

                        files.append(item)

                page_token = resp.get("nextPageToken")

                if not page_token:

                    break

        def download_file(self, file_id: str, mime_type: str):

            """ファイルをダウンロード（Google Docs系はエクスポート変換）。(bytes, effective_mime) を返す"""

            export_mime = self.GOOGLE_EXPORT_MIME.get(mime_type)

            if export_mime:

                req = self.service.files().export_media(fileId=file_id, mimeType=export_mime)

                effective_mime = export_mime

            else:

                req = self.service.files().get_media(fileId=file_id)

                effective_mime = mime_type

            buf = io.BytesIO()

            dl = MediaIoBaseDownload(buf, req)

            done = False

            while not done:

                _, done = dl.next_chunk()

            return buf.getvalue(), effective_mime


