    def resolve_temporal_expression(text: str, reference_date: str = "") -> str:
        """テキスト内の時間表現を解決して日付文字列を返す。
        「昨日」「先週」「3月15日」などの表現を絶対日付に変換。
        解決できなければ空文字を返す。
        """
        from datetime import datetime, timedelta, timezone
        if reference_date:
            try:
                ref = datetime.strptime(reference_date[:10], "%Y-%m-%d")
            except Exception:
                ref = datetime.now()
        else:
            ref = datetime.now()

        # 曜日付きの相対表現（先週の土曜日、今週の月曜日、等）
        weekday_map = {
            '月曜': 0, '月曜日': 0,
            '火曜': 1, '火曜日': 1,
            '水曜': 2, '水曜日': 2,
            '木曜': 3, '木曜日': 3,
            '金曜': 4, '金曜日': 4,
            '土曜': 5, '土曜日': 5,
            '日曜': 6, '日曜日': 6,
        }
        weekday_names = '|'.join(sorted(weekday_map.keys(), key=len, reverse=True))
        week_rel_pattern = re.compile(f'(先々週|先週|今週|来週)の({weekday_names})')
        m = week_rel_pattern.search(text)
        if m:
            week_word = m.group(1)
            day_word = m.group(2)
            target_weekday = weekday_map[day_word]
            week_offsets = {'先々週': -2, '先週': -1, '今週': 0, '来週': 1}
            week_offset = week_offsets.get(week_word, 0)
            # 今週の月曜日を基準に計算
            days_since_monday = ref.weekday()
            this_monday = ref - timedelta(days=days_since_monday)
            target_monday = this_monday + timedelta(weeks=week_offset)
            resolved = target_monday + timedelta(days=target_weekday)
            logger.info(f"[TEMPORAL_RESOLVE] '{m.group()}' → {resolved.strftime('%Y-%m-%d')}")
            return resolved.strftime("%Y-%m-%d")

        # 相対表現
        relative_patterns = [
            (re.compile(r'一昨日'), timedelta(days=-2)),
            (re.compile(r'おととい'), timedelta(days=-2)),
            (re.compile(r'昨日'), timedelta(days=-1)),
            (re.compile(r'きのう'), timedelta(days=-1)),
            (re.compile(r'今日'), timedelta(days=0)),
            (re.compile(r'きょう'), timedelta(days=0)),
            (re.compile(r'明後日'), timedelta(days=2)),
            (re.compile(r'あさって'), timedelta(days=2)),
            (re.compile(r'明日'), timedelta(days=1)),
            (re.compile(r'あした'), timedelta(days=1)),
            (re.compile(r'先々週'), timedelta(days=-14)),
            (re.compile(r'先週'), timedelta(days=-7)),
            (re.compile(r'今週'), timedelta(days=0)),
            (re.compile(r'来週'), timedelta(days=7)),
            (re.compile(r'先々月'), timedelta(days=-60)),
            (re.compile(r'先月'), timedelta(days=-30)),
            (re.compile(r'今月'), timedelta(days=0)),
            (re.compile(r'来月'), timedelta(days=30)),
            (re.compile(r'去年'), timedelta(days=-365)),
            (re.compile(r'昨年'), timedelta(days=-365)),
            (re.compile(r'今年'), timedelta(days=0)),
            (re.compile(r'来年'), timedelta(days=365)),
            (re.compile(r'(\d+)日前'), None),
            (re.compile(r'(\d+)週間前'), None),
            (re.compile(r'(\d+)ヶ月前'), None),
            (re.compile(r'(\d+)か月前'), None),
            (re.compile(r'(\d+)年前'), None),
        ]

        for pattern, delta in relative_patterns:
            m = pattern.search(text)
            if m:
                if delta is not None:
                    resolved = ref + delta
                    logger.info(f"[TEMPORAL_RESOLVE] '{m.group()}' → {resolved.strftime('%Y-%m-%d')}")
                    return resolved.strftime("%Y-%m-%d")
                else:
                    # 数値付きパターン
                    n = int(m.group(1))
                    if '日前' in m.group():
                        resolved = ref - timedelta(days=n)
                    elif '週間前' in m.group():
                        resolved = ref - timedelta(weeks=n)
                    elif 'ヶ月前' in m.group() or 'か月前' in m.group():
                        resolved = ref - timedelta(days=n * 30)
                    elif '年前' in m.group():
                        resolved = ref - timedelta(days=n * 365)
                    else:
                        continue
                    logger.info(f"[TEMPORAL_RESOLVE] '{m.group()}' → {resolved.strftime('%Y-%m-%d')}")
                    return resolved.strftime("%Y-%m-%d")

        # 絶対日付表現 ○月○日
        abs_pattern = re.compile(r'(\d{1,2})月(\d{1,2})日')
        m = abs_pattern.search(text)
        if m:
            month = int(m.group(1))
            day = int(m.group(2))
            try:
                resolved = ref.replace(month=month, day=day)
                logger.info(f"[TEMPORAL_RESOLVE] '{m.group()}' → {resolved.strftime('%Y-%m-%d')}")
                return resolved.strftime("%Y-%m-%d")
            except ValueError:
                pass

        # yyyy年mm月dd日
        full_date_pattern = re.compile(r'(\d{4})年(\d{1,2})月(\d{1,2})日')
        m = full_date_pattern.search(text)
        if m:
            try:
                resolved = datetime(int(m.group(1)), int(m.group(2)), int(m.group(3)))
                logger.info(f"[TEMPORAL_RESOLVE] '{m.group()}' → {resolved.strftime('%Y-%m-%d')}")
                return resolved.strftime("%Y-%m-%d")
            except ValueError:
                pass

        return ""


    def resolve_temporal_from_texts(texts: List[str], reference_date: str = "") -> str:
        """複数テキストから時間表現を解決。最初に見つかった日付を返す"""
        for text in texts:
            resolved = resolve_temporal_expression(text, reference_date)
            if resolved:
                return resolved
        return ""


    def opensearch_index_chunks(chunks: List[str], user_id: str, tenant: str, doc_id: str = "", event_date: str = ""):
        """チャンクをOpenSearchにバルクインデックス（時系列対応）"""
        if not OPENSEARCH_ENABLED:
            return
        try:
            from datetime import datetime, timezone
            if event_date:
                created_at = event_date
            else:
                created_at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

            bulk_body = ""
            for i, text in enumerate(chunks):
                meta = json.dumps({"index": {"_index": OPENSEARCH_INDEX}})
                doc = json.dumps({
                    "text": text,
                    "tenant": tenant,
                    "user_id": user_id,
                    "doc_id": doc_id,
                    "source": "document",
                    "created_at": created_at,
                }, ensure_ascii=False)
                bulk_body += meta + "\n" + doc + "\n"

            resp = requests.post(
                f"{OPENSEARCH_URL}/_bulk",
                data=bulk_body.encode("utf-8"),
                headers={"Content-Type": "application/x-ndjson"},
                timeout=30
            )
            if resp.status_code == 200:
                result = resp.json()
                errors = result.get("errors", False)
                items = len(result.get("items", []))
                if errors:
                    logger.warning(f"[OPENSEARCH] Bulk index had errors: {items} items")
                else:
                    logger.info(f"[OPENSEARCH] Indexed {items} chunks for {user_id}")
            else:
                logger.warning(f"[OPENSEARCH] Bulk index returned {resp.status_code}")
        except Exception as e:
            logger.warning(f"[OPENSEARCH] Index failed: {e}")


    def opensearch_search_bm25(question: str, tenant: str, top_k: int = 20) -> List[Dict[str, Any]]:
        """OpenSearchでBM25全文検索"""
        if not OPENSEARCH_ENABLED:
            return []
        try:
            query_body = {
                "size": top_k,
                "query": {
                    "bool": {
                        "must": [
                            {"match": {"text": {"query": question, "analyzer": "kuromoji_analyzer"}}}
                        ],
                        "filter": [
                            {"term": {"tenant": tenant}}
                        ]
                    }
                }
            }
            resp = requests.post(
                f"{OPENSEARCH_URL}/{OPENSEARCH_INDEX}/_search",
                json=query_body,
                timeout=10
            )
            if resp.status_code != 200:
                logger.warning(f"[OPENSEARCH] Search returned {resp.status_code}")
                return []

            hits = resp.json().get("hits", {}).get("hits", [])
            results = []
            for hit in hits:
                results.append({
                    "text": hit["_source"]["text"],
                    "score": float(hit["_score"]),
                    "source": "bm25",
                    "created_at": hit["_source"].get("created_at", ""),
                })
            logger.info(f"[OPENSEARCH] BM25 search returned {len(results)} results")
            return results
        except Exception as e:
            logger.warning(f"[OPENSEARCH] Search failed: {e}")
            return []


    def opensearch_search_temporal(question: str, tenant: str, top_k: int = 20, since: str = "", until: str = "", recency_boost: bool = True) -> List[Dict[str, Any]]:
        """時系列対応のOpenSearch検索。期間フィルタと鮮度ブーストに対応"""
        if not OPENSEARCH_ENABLED:
            return []
        try:
            must_clauses = []
            if question:
                must_clauses.append({"match": {"text": {"query": question, "analyzer": "kuromoji_analyzer"}}})

            filter_clauses = [{"term": {"tenant": tenant}}]

            # 期間フィルタ
            date_range = {}
            if since:
                date_range["gte"] = since
            if until:
                date_range["lte"] = until
            if date_range:
                filter_clauses.append({"range": {"created_at": date_range}})

            query_body = {
                "size": top_k,
                "query": {
                    "bool": {
                        "must": must_clauses if must_clauses else [{"match_all": {}}],
                        "filter": filter_clauses
                    }
                },
                "sort": [
                    {"_score": {"order": "desc"}},
                    {"created_at": {"order": "desc"}}
                ]
            }

            # 鮮度ブースト: 新しいデータほどスコアが高くなる
            if recency_boost:
                query_body["query"] = {
                    "function_score": {
                        "query": query_body["query"],
                        "functions": [
                            {
                                "gauss": {
                                    "created_at": {
                                        "origin": "now",
                                        "scale": "30d",
                                        "decay": 0.5
                                    }
                                }
                            }
                        ],
                        "boost_mode": "multiply"
                    }
                }

            resp = requests.post(
                f"{OPENSEARCH_URL}/{OPENSEARCH_INDEX}/_search",
                json=query_body,
                timeout=10
            )
            if resp.status_code != 200:
                logger.warning(f"[OPENSEARCH] Temporal search returned {resp.status_code}")
                return []

            hits = resp.json().get("hits", {}).get("hits", [])
            results = []
            for hit in hits:
                results.append({
                    "text": hit["_source"]["text"],
                    "score": float(hit["_score"]),
                    "source": "temporal",
                    "created_at": hit["_source"].get("created_at", ""),
                })
            logger.info(f"[OPENSEARCH] Temporal search returned {len(results)} results (since={since}, until={until}, recency_boost={recency_boost})")
            return results
        except Exception as e:
            logger.warning(f"[OPENSEARCH] Temporal search failed: {e}")
            return []


    def rrf_merge(result_lists: List[List[Dict[str, Any]]], k: int = 60, weights: List[float] = None) -> List[Dict[str, Any]]:
        """Reciprocal Rank Fusion: 複数の検索結果リストを重み付きで統合
        weights: 各リストの重み。例: [1.0, 0.3] でDense優先、BM25は補助
        """
        if weights is None:
            weights = [1.0] * len(result_lists)

        scores = {}
        texts = {}
        dates = {}

        for list_idx, result_list in enumerate(result_lists):
            w = weights[list_idx] if list_idx < len(weights) else 1.0
            for rank, doc in enumerate(result_list):
                text_key = doc["text"][:200]
                rrf_score = w / (k + rank + 1)
                if text_key in scores:
                    scores[text_key] += rrf_score
                else:
                    scores[text_key] = rrf_score
                    texts[text_key] = doc
                # created_atがあれば保存（BM25結果から伝播）
                if doc.get("created_at") and text_key not in dates:
                    dates[text_key] = doc["created_at"]

        merged = []
        for text_key in sorted(scores.keys(), key=lambda x: scores[x], reverse=True):
            doc = texts[text_key].copy()
            doc["rrf_score"] = scores[text_key]
            if text_key in dates:
                doc["created_at"] = dates[text_key]
            merged.append(doc)

        return merged


    def apply_recency_boost(results: List[Dict[str, Any]], boost_weight: float = 0.15) -> List[Dict[str, Any]]:
        """スコアに鮮度ブーストを加算。created_atが新しいほどボーナスが大きい。"""
        from datetime import datetime, timezone, timedelta
        import math
        now = datetime.now(timezone.utc)
        boosted = []

        for doc in results:
            doc = doc.copy()
            created_at = doc.get("created_at", "")
            if created_at:
                try:
                    ca = created_at.replace("Z", "+00:00")
                    if len(ca) <= 10:
                        dt = datetime.strptime(ca[:10], "%Y-%m-%d").replace(tzinfo=timezone.utc)
                    else:
                        dt = datetime.fromisoformat(ca)
                        if dt.tzinfo is None:
                            dt = dt.replace(tzinfo=timezone.utc)
                    age_days = (now - dt).total_seconds() / 86400
                    boost = boost_weight * math.exp(-(age_days ** 2) / (2 * 30 ** 2))
                    if "rerank_score" in doc:
                        doc["rerank_score"] = doc["rerank_score"] + boost
                    if "rrf_score" in doc:
                        doc["rrf_score"] = doc["rrf_score"] + boost
                    doc["recency_boost"] = round(boost, 4)
                except Exception as e:
                    logger.debug(f"[RECENCY] Parse failed for '{created_at}': {e}")
            boosted.append(doc)

        def sort_key(x):
            return x.get("rerank_score", x.get("rrf_score", x.get("score", 0)))
        boosted.sort(key=sort_key, reverse=True)
        return boosted


