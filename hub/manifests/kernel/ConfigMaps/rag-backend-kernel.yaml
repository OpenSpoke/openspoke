    @app.post("/analyze")
    async def analyze(request: Query):
        """gemma2が各チャンクをドメイン知識の観点で一次解釈する協調推論用エンドポイント"""
        try:
            start_time = time.time()
            logger.info(f"[ANALYZE] Question: {request.question[:50]}...")

            tenant = get_tenant_label(request.user_id)

            collection_name = get_collection_name(request.user_id)
            if not utility.has_collection(collection_name):
                raise HTTPException(status_code=404, detail=f"User '{request.user_id}' has no knowledge base.")

            collection = Collection(collection_name)
            collection.load()
            query_embedding = get_embedding(request.question)
            search_params = {"metric_type": "IP", "params": {"nprobe": 10}}
            results = collection.search(
                data=[query_embedding],
                anns_field="embedding",
                param=search_params,
                limit=min(request.top_k * 4, 20),
                output_fields=["text"]
            )
            candidates = [
                {"text": hit.entity.get("text"), "score": float(hit.distance), "source": "document"}
                for hit in results[0]
            ]
            retrieved_docs, _ = rerank_with_cross_encoder(
                question=request.question,
                candidates=candidates,
                final_count=request.top_k
            )

            # ── Retrieval Rails: チャンク内PIIマスク ──
            if retrieved_docs:
                chunk_guard = call_guardrails("/guard/chunks", {
                    "chunks": [{"text": doc["text"], "score": doc.get("score", 0)} for doc in retrieved_docs],
                    "tenant": get_tenant_label(request.user_id),
                })
                if chunk_guard and chunk_guard.get("masked_count", 0) > 0:
                    guarded = chunk_guard["chunks"]
                    for i, doc in enumerate(retrieved_docs):
                        if i < len(guarded) and guarded[i].get("masked"):
                            doc["text"] = guarded[i]["text"]
                    logger.info(f"[ANALYZE] Retrieval rails: {chunk_guard['masked_count']} chunks masked")

            analyzed_chunks = []
            for i, doc in enumerate(retrieved_docs):
                prompt = (
                    f"以下のテキストを読んで、質問「{request.question}」に関連する観点から、"
                    "このテキストが示している重要な情報・事実・示唆を簡潔に解釈してください。"
                    f"解釈のみを2-3文で答えてください。\n\nテキスト:\n{doc['text']}\n\n解釈:"
                )
                try:
                    response = requests.post(
                        f"{VLLM_URL}/v1/chat/completions",
                        json={
                            "model": LLM_MODEL,
                            "messages": [{"role": "user", "content": prompt}],
                            "temperature": 0.1,
                            "max_tokens": 200
                        },
                        timeout=LLM_TIMEOUT
                    )
                    interpretation = response.json()["choices"][0]["message"]["content"].strip()
                except Exception as e:
                    logger.warning(f"[ANALYZE] Interpretation failed for chunk {i}: {e}")
                    interpretation = ""

                analyzed_chunks.append({
                    "original_text": doc["text"],
                    "interpretation": interpretation,
                    "score": doc["score"],
                    "source": doc.get("source", "document"),
                })
                logger.info(f"[ANALYZE] Chunk {i+1}/{len(retrieved_docs)} interpreted")

            graph_results = []
            graph_context = ""
            if request.use_graph and neo4j_driver:
                graph_results = search_graph_context(request.question, tenant)
                graph_context = format_graph_context(graph_results)

            elapsed = time.time() - start_time

            return {
                "question": request.question,
                "analyzed_chunks": analyzed_chunks,
                "graph_entities": graph_results,
                "graph_context": graph_context,
                "processing_time_sec": round(elapsed, 2)
            }
        except HTTPException:
            raise
        except Exception as e:
            logger.error(f"[ANALYZE] Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    @app.get("/graph/entities")
    async def get_graph_entities(user_id: str, limit: int = 50):
        """エンティティ一覧取得"""
        if not neo4j_driver:
            return {"entities": [], "message": "Memgraph not connected"}
        
        tenant = get_tenant_label(user_id)
        
        with neo4j_driver.session() as session:
            result = session.run(
                """
                MATCH (e:Entity {tenant: $tenant})
                OPTIONAL MATCH (e)-[r:RELATES_TO|CO_OCCURS]-(related:Entity {tenant: $tenant})
                RETURN e.name as name, e.type as type, e.description as description,
                       count(DISTINCT related) as related_count
                ORDER BY related_count DESC
                LIMIT $limit
                """,
                tenant=tenant, limit=limit
            )
            
            entities = []
            for record in result:
                entities.append({
                    "name": record["name"],
                    "type": record["type"],
                    "description": record["description"],
                    "related_count": record["related_count"]
                })
        
        return {"tenant": tenant, "entities": entities}


    @app.delete("/graph/entities")
    async def delete_graph_entities(user_id: str):
        """グラフデータ削除"""
        if not neo4j_driver:
            return {"status": "skipped", "message": "Memgraph not connected"}
        
        tenant = get_tenant_label(user_id)
        
        with neo4j_driver.session() as session:
            session.run(
                "MATCH (e:Entity {tenant: $tenant}) DETACH DELETE e",
                tenant=tenant
            )
            session.run(
                "MATCH (d:Document {tenant: $tenant}) DETACH DELETE d",
                tenant=tenant
            )
        
        return {"status": "success", "tenant": tenant}


    @app.post("/graph/explore")
    async def explore_graph_entity(request: dict):
        """エンティティを起点にナレッジグラフをマルチホップ探索"""
        entity_name = request.get("entity_name")
        user_id = request.get("user_id")
        hops = request.get("hops", 2)
        include_chunks = request.get("include_chunks", True)

        if not entity_name or not user_id:
            raise HTTPException(status_code=400, detail="entity_name and user_id are required")

        if not neo4j_driver:
            raise HTTPException(status_code=503, detail="Graph database not connected")

        hops = max(1, min(hops, 3))
        tenant = get_tenant_label(user_id)

        logger.info(f"[GRAPH_EXPLORE] entity={entity_name}, tenant={tenant}, hops={hops}")

        with neo4j_driver.session() as session:
            entity_result = session.run(
                """
                MATCH (e:Entity {name: $name, tenant: $tenant})
                RETURN e.name as name, e.type as type, e.description as description
                """,
                name=entity_name, tenant=tenant
            )
            entity_record = entity_result.single()

            if not entity_record:
                raise HTTPException(status_code=404, detail=f"Entity '{entity_name}' not found")

            entity_info = {
                "name": entity_record["name"],
                "type": entity_record["type"],
                "description": entity_record["description"] or "",
            }

            related_result = session.run(
                """
                MATCH (start:Entity {name: $name, tenant: $tenant})
                MATCH (start)-[r:RELATES_TO|CO_OCCURS]-(related:Entity {tenant: $tenant})
                RETURN DISTINCT related.name as name, related.type as type,
                       related.description as description,
                       type(r) as relationship,
                       r.type as rel_subtype,
                       r.description as rel_description
                LIMIT 30
                """,
                name=entity_name, tenant=tenant
            )

            related_entities = []
            for record in related_result:
                rel_type = record["rel_subtype"] or record["relationship"]
                related_entities.append({
                    "name": record["name"],
                    "type": record["type"] or "Other",
                    "description": record["description"] or "",
                    "relationship": rel_type,
                    "rel_description": record["rel_description"] or "",
                })

            hop_queries = {
                1: "MATCH path = (start)-[:RELATES_TO|CO_OCCURS*1]-(end:Entity {tenant: $tenant})",
                2: "MATCH path = (start)-[:RELATES_TO|CO_OCCURS*1..2]-(end:Entity {tenant: $tenant})",
                3: "MATCH path = (start)-[:RELATES_TO|CO_OCCURS*1..3]-(end:Entity {tenant: $tenant})",
            }
            path_query = f"""
                MATCH (start:Entity {{name: $name, tenant: $tenant}})
                {hop_queries[hops]}
                WHERE start <> end
                WITH start, end,
                     [n IN nodes(path) | n.name] as node_names,
                     length(path) as path_hops
                RETURN DISTINCT end.name as end_entity,
                       end.type as end_type,
                       node_names as nodes,
                       path_hops as hops
                ORDER BY path_hops
                LIMIT 30
            """
            path_result = session.run(path_query, name=entity_name, tenant=tenant)

            paths = []
            discovered_entities = set()
            for record in path_result:
                paths.append({
                    "end_entity": record["end_entity"],
                    "end_type": record["end_type"],
                    "nodes": record["nodes"],
                    "hops": record["hops"],
                })
                discovered_entities.add(record["end_entity"])

            chunks = []
            if include_chunks:
                search_entities = [entity_name] + [r["name"] for r in related_entities[:10]]

                chunk_result = session.run(
                    """
                    MATCH (c:Chunk {tenant: $tenant})-[:MENTIONS]->(e:Entity {tenant: $tenant})
                    WHERE e.name IN $entity_names
                    RETURN DISTINCT c.text as text, c.chunk_id as chunk_id,
                           collect(DISTINCT e.name) as mentioned_entities
                    LIMIT 10
                    """,
                    tenant=tenant, entity_names=search_entities
                )

                for record in chunk_result:
                    chunks.append({
                        "text": record["text"],
                        "chunk_id": record["chunk_id"],
                        "mentioned_entities": record["mentioned_entities"],
                    })

                if not chunks:
                    chunk_result = session.run(
                        """
                        MATCH (e:Entity {name: $name, tenant: $tenant})<-[:CONTAINS]-(d:Document {tenant: $tenant})
                        MATCH (d)-[:HAS_CHUNK]->(c:Chunk)
                        RETURN DISTINCT c.text as text, c.chunk_id as chunk_id
                        LIMIT 10
                        """,
                        name=entity_name, tenant=tenant
                    )

                    for record in chunk_result:
                        chunks.append({
                            "text": record["text"],
                            "chunk_id": record["chunk_id"],
                            "mentioned_entities": [],
                        })

        logger.info(
            f"[GRAPH_EXPLORE] Found: {len(related_entities)} related, "
            f"{len(paths)} paths, {len(chunks)} chunks"
        )

        # ── Retrieval Rails: チャンク内PIIマスク ──
        if chunks:
            chunk_guard = call_guardrails("/guard/chunks", {
                "chunks": [{"text": c["text"], "score": 0} for c in chunks],
                "tenant": tenant,
            })
            if chunk_guard and chunk_guard.get("masked_count", 0) > 0:
                guarded = chunk_guard["chunks"]
                for i, c in enumerate(chunks):
                    if i < len(guarded) and guarded[i].get("masked"):
                        c["text"] = guarded[i]["text"]
                logger.info(f"[GRAPH_EXPLORE] Retrieval rails: {chunk_guard['masked_count']} chunks masked")

        return {
            "entity": entity_info,
            "related_entities": related_entities,
            "paths": paths,
            "chunks": chunks,
            "exploration": {
                "start": entity_name,
                "hops": hops,
                "total_discovered": len(discovered_entities),
            }
        }


    def _github_index_job(
        job_id: str, owner: str, repos: List[str], branch: str,
        user_id: str, max_files: int, github_token: str,
        batch_size: int = 50
    ):
        """GitHubインデックスジョブ本体（バックグラウンド実行）。複数リポジトリ対応。"""
        def update(**kwargs):
            with _job_lock:
                _job_status[job_id].update(kwargs)

        file_extensions = [
            '.cpp', '.h', '.c', '.sh', '.yaml', '.yml', '.json',
            '.xml', '.py', '.js', '.ts', '.vue', '.jsx', '.tsx', '.cs',
            '.go', '.rb', '.rs', '.java', '.kt', '.swift', '.md'
        ]

        def truncate_to_bytes(text, max_bytes=60000):
            """マルチバイト文字対応のバイト数切り詰め"""
            encoded = text.encode('utf-8')
            if len(encoded) <= max_bytes:
                return text
            return encoded[:max_bytes].decode('utf-8', errors='ignore')

        # ブランチ候補リストを生成（カンマ区切りを許容）
        branch_candidates = [b.strip() for b in branch.split(",") if b.strip()]

        try:
            start_time = time.time()
            client = GitHubAPIClient(token=github_token)

            # Step1: Milvusコレクション準備（全リポジトリ共通・事前作成）
            collection_name = get_code_collection_name(user_id)
            if not utility.has_collection(collection_name):
                fields = [
                    FieldSchema(name="id", dtype=DataType.INT64, is_primary=True, auto_id=True),
                    FieldSchema(name="text", dtype=DataType.VARCHAR, max_length=65535),
                    FieldSchema(name="filepath", dtype=DataType.VARCHAR, max_length=1000),
                    FieldSchema(name="start_line", dtype=DataType.INT64),
                    FieldSchema(name="end_line", dtype=DataType.INT64),
                    FieldSchema(name="repository", dtype=DataType.VARCHAR, max_length=500),
                    FieldSchema(name="branch", dtype=DataType.VARCHAR, max_length=200),
                    FieldSchema(name="embedding", dtype=DataType.FLOAT_VECTOR, dim=EMBEDDING_DIM)
                ]
                schema = CollectionSchema(fields=fields)
                collection = Collection(name=collection_name, schema=schema)
                index_params = {
                    "metric_type": "IP",
                    "index_type": "IVF_FLAT",
                    "params": {"nlist": 128}
                }
                collection.create_index(field_name="embedding", index_params=index_params)
                logger.info(f"[GITHUB_JOB:{job_id}] Created collection: {collection_name}")
            else:
                collection = Collection(collection_name)

            total_chunks_all = 0
            total_files_all = 0

            # Step2: リポジトリごとに順次処理
            for repo_idx, repo in enumerate(repos):
                logger.info(f"[GITHUB_JOB:{job_id}] Processing repo {repo_idx+1}/{len(repos)}: {repo}")
                update(
                    status="fetching_tree",
                    current_repo=f"{owner}/{repo}",
                    repo_index=repo_idx + 1
                )

                try:
                    resolved_branch = client.resolve_branch(owner, repo, branch_candidates)
                    all_paths = client.get_all_file_paths(owner, repo, resolved_branch, file_extensions)
                except Exception as e:
                    logger.warning(f"[GITHUB_JOB:{job_id}] Skipping {repo}: {e}")
                    with _job_lock:
                        _job_status[job_id]["skipped_repos"].append(f"{owner}/{repo}")
                    continue

                # 1MB超のファイルを除外
                all_paths = [p for p in all_paths if p["size"] < 1_000_000]

                if max_files > 0:
                    all_paths = all_paths[:max_files]

                if not all_paths:
                    logger.warning(f"[GITHUB_JOB:{job_id}] No matching files in {repo}, skipping")
                    continue

                update(total=len(all_paths), status="fetching_files", progress=0)
                logger.info(f"[GITHUB_JOB:{job_id}] {len(all_paths)} files to process in {repo}")

                fetched_files = 0
                repo_chunks = 0

                # Step3: バッチ単位で fetch → embed → insert
                for batch_start in range(0, len(all_paths), batch_size):
                    batch_paths = all_paths[batch_start:batch_start + batch_size]

                    # ファイル内容を8並列取得
                    update(status="fetching_files", progress=fetched_files)
                    batch_files = client.fetch_files_parallel(owner, repo, batch_paths, max_workers=8)
                    fetched_files += len(batch_files)

                    if not batch_files:
                        continue

                    # チャンク生成
                    all_chunks = []
                    for file_info in batch_files:
                        chunks = CodeChunker.chunk_code(file_info["path"], file_info["content"])
                        for chunk in chunks:
                            lines = chunk.split('\n')
                            meta_line = lines[0] if lines else ""
                            start_line = end_line = 0
                            if "Lines:" in meta_line:
                                try:
                                    line_info = meta_line.split("Lines:")[1].split("]")[0].strip()
                                    if "-" in line_info:
                                        start_line, end_line = map(int, line_info.split("-"))
                                except:
                                    pass
                            all_chunks.append({
                                "text": chunk,
                                "filepath": file_info["path"],
                                "start_line": start_line,
                                "end_line": end_line,
                                "repository": f"{owner}/{repo}",
                                "branch": branch
                            })

                    if not all_chunks:
                        continue

                    # Embedding並列生成
                    update(status="embedding", progress=fetched_files, chunks=total_chunks_all)
                    texts = [c["text"] for c in all_chunks]
                    embeddings = get_embeddings_parallel(texts)

                    insert_data = [
                        [truncate_to_bytes(c["text"]) for c in all_chunks],
                        [c["filepath"]                for c in all_chunks],
                        [c["start_line"]              for c in all_chunks],
                        [c["end_line"]                for c in all_chunks],
                        [c["repository"]              for c in all_chunks],
                        [c["branch"]                  for c in all_chunks],
                        embeddings
                    ]
                    collection.insert(insert_data)

                    # OpenSearchにもインデックス（タイムスタンプ付き）
                    opensearch_tenant = get_tenant_label(user_id)
                    opensearch_texts = [c["text"] for c in all_chunks]
                    opensearch_index_chunks(opensearch_texts, user_id, opensearch_tenant, doc_id=f"github_{repo}_{int(time.time())}")

                    repo_chunks += len(all_chunks)
                    total_chunks_all += len(all_chunks)
                    update(
                        progress=fetched_files,
                        chunks=total_chunks_all,
                        files=total_files_all + fetched_files
                    )
                    logger.info(
                        f"[GITHUB_JOB:{job_id}] [{repo}] Batch {batch_start // batch_size + 1}: "
                        f"{len(batch_files)} files, {len(all_chunks)} chunks inserted"
                    )

                total_files_all += fetched_files
                with _job_lock:
                    _job_status[job_id]["completed_repos"].append(f"{owner}/{repo}")
                logger.info(
                    f"[GITHUB_JOB:{job_id}] [{repo}] Done: {fetched_files} files, {repo_chunks} chunks"
                )

            # Step4: flush/load（全リポジトリ処理後に一括）
            update(status="finalizing")
            collection.flush()
            collection.load()

            elapsed = time.time() - start_time
            with _job_lock:
                _job_status[job_id].update({
                    "status": "done",
                    "progress": total_files_all,
                    "total": total_files_all,
                    "files": total_files_all,
                    "chunks": total_chunks_all,
                    "elapsed_sec": round(elapsed, 1),
                    "collection": collection_name,
                    "total_entities": collection.num_entities
                })
            logger.info(
                f"[GITHUB_JOB:{job_id}] All repos completed in {elapsed:.1f}s: "
                f"{total_files_all} files, {total_chunks_all} chunks"
            )

        except Exception as e:
            logger.error(f"[GITHUB_JOB:{job_id}] Failed: {e}")
            with _job_lock:
                _job_status[job_id].update({"status": "error", "error": str(e)})


    @app.get("/core/minio/list")
    async def core_minio_list(prefix: str = "", bucket: str = "", recursive: bool = True, max_keys: int = 1000):
        """MinIO バケット内のオブジェクトを一覧する。
        Query:
            prefix:   先頭一致フィルタ (例: "contract_template_NDA/")
            bucket:   バケット名 (省略時は MINIO_BUCKET=contracts)
            recursive: True ならサブディレクトリも展開 (デフォルト)、 False なら共通プレフィックスまで
            max_keys: 最大返却件数 (デフォルト 1000)
        Returns:
            {"bucket": str, "prefix": str, "count": int, "truncated": bool, "objects": [{"name", "size", "last_modified", "etag", "is_dir"}, ...]}
        """
        if minio_client is None:
            raise HTTPException(status_code=503, detail="MinIO client not initialized")
        target_bucket = (bucket or MINIO_BUCKET or "").strip()
        if not target_bucket:
            raise HTTPException(status_code=400, detail="bucket name is empty (no MINIO_BUCKET configured)")
        if max_keys < 1:
            max_keys = 1
        if max_keys > 10000:
            max_keys = 10000
        try:
            objects = []
            truncated = False
            count = 0
            it = minio_client.list_objects(target_bucket, prefix=prefix or "", recursive=recursive)
            for obj in it:
                if count >= max_keys:
                    truncated = True
                    break
                objects.append({
                    "name": obj.object_name,
                    "size": int(obj.size) if obj.size is not None else None,
                    "last_modified": obj.last_modified.isoformat() if obj.last_modified else None,
                    "etag": obj.etag,
                    "is_dir": bool(obj.is_dir),
                })
                count += 1
            return {
                "bucket": target_bucket,
                "prefix": prefix or "",
                "recursive": recursive,
                "count": count,
                "truncated": truncated,
                "objects": objects,
            }
        except Exception as e:
            logger.exception(f"[MINIO_LIST] failed: bucket={target_bucket} prefix={prefix} err={e}")
            raise HTTPException(status_code=500, detail=f"minio list failed: {e}")


    @app.post("/core/minio/sync-to-opensearch")
    async def core_minio_sync_to_opensearch(request: dict = None):
        """MinIO バケット内のオブジェクト一覧を OpenSearch index=minio_inventory にダンプする。
        Claude (LLM) が opensearch_search 経由で MinIO の中身を確認するための仕掛け。

        Body (optional):
            {"prefix": "...", "bucket": "...", "max_keys": 10000, "clear_first": false}

        - clear_first=true なら、 同期前に index を完全削除して再作成 (古いエントリが残らない)。
          デフォルト false (同じ ID なら上書きされるが、 MinIO 上で削除されたオブジェクトのドキュメントは残る)。
        - index の mapping: name (keyword), bucket (keyword), prefix (keyword),
          size (long), last_modified (date), etag (keyword), is_dir (boolean),
          synced_at (date)。
        - ドキュメント ID: sha1("{bucket}::{name}") の16進数。 同じ bucket+name で上書きされる。

        Returns:
            {"bucket", "prefix", "indexed": int, "errors": int, "index": "minio_inventory"}
        """
        if minio_client is None:
            raise HTTPException(status_code=503, detail="MinIO client not initialized")
        body = request or {}
        prefix = (body.get("prefix") or "").strip()
        bucket = (body.get("bucket") or "").strip()
        max_keys = body.get("max_keys") or 10000
        clear_first = bool(body.get("clear_first", False))

        target_bucket = bucket or MINIO_BUCKET or ""
        if not target_bucket:
            raise HTTPException(status_code=400, detail="bucket name is empty (no MINIO_BUCKET configured)")
        try:
            max_keys = int(max_keys)
        except Exception:
            max_keys = 10000
        if max_keys < 1:
            max_keys = 1
        if max_keys > 100000:
            max_keys = 100000

        index_name = "minio_inventory"
        os_url = OPENSEARCH_URL.rstrip("/")

        # 1. index の作成 (なければ)。 clear_first=true なら削除→再作成
        try:
            if clear_first:
                try:
                    requests.delete(f"{os_url}/{index_name}", timeout=10)
                except Exception:
                    pass
            head = requests.head(f"{os_url}/{index_name}", timeout=5)
            if head.status_code == 404:
                mapping_body = {
                    "settings": {"number_of_shards": 1, "number_of_replicas": 0},
                    "mappings": {
                        "properties": {
                            "name":          {"type": "keyword"},
                            "bucket":        {"type": "keyword"},
                            "prefix":        {"type": "keyword"},
                            "size":          {"type": "long"},
                            "last_modified": {"type": "date"},
                            "etag":          {"type": "keyword"},
                            "is_dir":        {"type": "boolean"},
                            "synced_at":     {"type": "date"},
                        }
                    }
                }
                resp = requests.put(f"{os_url}/{index_name}", json=mapping_body, timeout=10)
                if resp.status_code not in (200, 201):
                    try:
                        err_type = resp.json().get("error", {}).get("type", "")
                    except Exception:
                        err_type = ""
                    if err_type != "resource_already_exists_exception":
                        raise HTTPException(status_code=500, detail=f"index create failed: status={resp.status_code} body={resp.text[:300]}")
        except HTTPException:
            raise
        except Exception as e:
            logger.exception(f"[MINIO_SYNC] index ensure failed: {e}")
            raise HTTPException(status_code=500, detail=f"index ensure failed: {e}")

        # 2. MinIO 一覧→ OpenSearch bulk indexing
        try:
            import hashlib
            import json as _json
            from datetime import datetime, timezone
            synced_at = datetime.now(timezone.utc).isoformat()
            indexed = 0
            errors = 0
            bulk_buf = []
            FLUSH_SIZE = 500  # 500件ごとに bulk flush

            def _flush(buf):
                nonlocal indexed, errors
                if not buf:
                    return
                body_str = "\n".join(buf) + "\n"
                try:
                    bulk_resp = requests.post(
                        f"{os_url}/_bulk",
                        data=body_str.encode("utf-8"),
                        headers={"Content-Type": "application/x-ndjson"},
                        timeout=60,
                    )
                    if bulk_resp.status_code == 200:
                        result = bulk_resp.json()
                        if result.get("errors"):
                            for item in result.get("items", []):
                                op = item.get("index", {})
                                if op.get("status", 200) >= 300:
                                    errors += 1
                                else:
                                    indexed += 1
                        else:
                            indexed += len(result.get("items", []))
                    else:
                        errors += len(buf) // 2  # 失敗推定
                        logger.warning(f"[MINIO_SYNC] bulk failed: status={bulk_resp.status_code} body={bulk_resp.text[:300]}")
                except Exception as _e:
                    errors += len(buf) // 2
                    logger.warning(f"[MINIO_SYNC] bulk exception: {_e}")

            it = minio_client.list_objects(target_bucket, prefix=prefix or "", recursive=True)
            count_seen = 0
            for obj in it:
                if count_seen >= max_keys:
                    break
                count_seen += 1
                name = obj.object_name
                doc_id = hashlib.sha1(f"{target_bucket}::{name}".encode("utf-8")).hexdigest()
                doc = {
                    "name": name,
                    "bucket": target_bucket,
                    "prefix": prefix or "",
                    "size": int(obj.size) if obj.size is not None else None,
                    "last_modified": obj.last_modified.isoformat() if obj.last_modified else None,
                    "etag": obj.etag,
                    "is_dir": bool(obj.is_dir),
                    "synced_at": synced_at,
                }
                bulk_buf.append(_json.dumps({"index": {"_index": index_name, "_id": doc_id}}, ensure_ascii=False))
                bulk_buf.append(_json.dumps(doc, ensure_ascii=False))
                if len(bulk_buf) >= FLUSH_SIZE * 2:
                    _flush(bulk_buf)
                    bulk_buf = []

            _flush(bulk_buf)
            # refresh して検索可能にする
            try:
                requests.post(f"{os_url}/{index_name}/_refresh", timeout=10)
            except Exception:
                pass
            logger.info(f"[MINIO_SYNC] bucket={target_bucket} prefix='{prefix}' indexed={indexed} errors={errors}")
            return {
                "bucket": target_bucket,
                "prefix": prefix or "",
                "indexed": indexed,
                "errors": errors,
                "max_keys": max_keys,
                "index": index_name,
                "synced_at": synced_at,
                "cleared": clear_first,
            }
        except Exception as e:
            logger.exception(f"[MINIO_SYNC] failed: {e}")
            raise HTTPException(status_code=500, detail=f"minio sync failed: {e}")


    @app.post("/core/minio/put")
    async def core_minio_put(request: dict):
        """MinIO にオブジェクトをアップロードする (汎用 API)。
        書き込み後に stat_object で整合性検証する。 失敗時は 5xx を返す (静かなスキップなし)。

        Body:
            {
                "object_name": "feature_request_attachments/rid/aid_name.docx",  // 必須
                "data_base64": "...",  // 必須、 オブジェクト本体の base64
                "content_type": "application/octet-stream",  // 任意
                "bucket": "contracts",  // 任意、 省略時は MINIO_BUCKET (= contracts)
            }
        Returns:
            {"bucket", "object_name", "size", "etag", "verified": true}
        """
        if minio_client is None:
            raise HTTPException(status_code=503, detail="MinIO client not initialized")
        body = request or {}
        object_name = (body.get("object_name") or "").strip()
        data_b64 = body.get("data_base64") or ""
        content_type = body.get("content_type") or "application/octet-stream"
        target_bucket = (body.get("bucket") or "").strip() or MINIO_BUCKET
        if not object_name:
            raise HTTPException(status_code=400, detail="object_name is required")
        if not data_b64:
            raise HTTPException(status_code=400, detail="data_base64 is required")
        if not target_bucket:
            raise HTTPException(status_code=400, detail="bucket name is empty")
        import base64 as _b64
        try:
            data_bytes = _b64.b64decode(data_b64)
        except Exception as e:
            raise HTTPException(status_code=400, detail=f"data_base64 decode failed: {e}")
        try:
            minio_client.put_object(
                target_bucket, object_name,
                io.BytesIO(data_bytes),
                length=len(data_bytes),
                content_type=content_type,
                part_size=10 * 1024 * 1024,
            )
        except Exception as e:
            logger.exception(f"[MINIO_PUT] failed: {target_bucket}/{object_name}: {e}")
            raise HTTPException(status_code=500, detail=f"minio put failed: {type(e).__name__}: {str(e)[:200]}")
        # 書き込み後検証
        try:
            stat = minio_client.stat_object(target_bucket, object_name)
            if stat.size != len(data_bytes):
                raise HTTPException(
                    status_code=500,
                    detail=f"size mismatch after put: expected={len(data_bytes)} got={stat.size}"
                )
            logger.info(f"[MINIO_PUT] verified: {target_bucket}/{object_name} size={stat.size}")
            return {
                "bucket": target_bucket,
                "object_name": object_name,
                "size": int(stat.size),
                "etag": stat.etag,
                "verified": True,
            }
        except HTTPException:
            raise
        except Exception as e:
            logger.exception(f"[MINIO_PUT] stat failed after put: {target_bucket}/{object_name}: {e}")
            raise HTTPException(status_code=500, detail=f"minio stat after put failed: {type(e).__name__}: {str(e)[:200]}")


    @app.get("/core/minio/get")
    async def core_minio_get(object_name: str, bucket: str = ""):
        """MinIO からオブジェクトを取得する。 バイナリは base64 で返す。
        Query:
            object_name: 必須
            bucket:      省略時は MINIO_BUCKET
        Returns:
            {"bucket", "object_name", "size", "content_type", "data_base64"}
        """
        if minio_client is None:
            raise HTTPException(status_code=503, detail="MinIO client not initialized")
        target_bucket = (bucket or MINIO_BUCKET or "").strip()
        if not object_name:
            raise HTTPException(status_code=400, detail="object_name is required")
        if not target_bucket:
            raise HTTPException(status_code=400, detail="bucket name is empty")
        import base64 as _b64
        try:
            resp = minio_client.get_object(target_bucket, object_name)
            try:
                data_bytes = resp.read()
            finally:
                resp.close()
                resp.release_conn()
            try:
                stat = minio_client.stat_object(target_bucket, object_name)
                content_type = stat.content_type or "application/octet-stream"
            except Exception:
                content_type = "application/octet-stream"
            return {
                "bucket": target_bucket,
                "object_name": object_name,
                "size": len(data_bytes),
                "content_type": content_type,
                "data_base64": _b64.b64encode(data_bytes).decode("ascii"),
            }
        except Exception as e:
            err_str = str(e)
            # MinIO の NoSuchKey は 404 として返す
            if "NoSuchKey" in err_str or "does not exist" in err_str.lower():
                raise HTTPException(status_code=404, detail=f"object not found: {object_name}")
            logger.exception(f"[MINIO_GET] failed: {target_bucket}/{object_name}: {e}")
            raise HTTPException(status_code=500, detail=f"minio get failed: {type(e).__name__}: {str(e)[:200]}")


    @app.delete("/core/minio/delete")
    async def core_minio_delete(object_name: str, bucket: str = ""):
        """MinIO からオブジェクトを削除する。 idempotent (存在しなくても 200 を返す)。
        Query:
            object_name: 必須
            bucket:      省略時は MINIO_BUCKET
        Returns:
            {"bucket", "object_name", "deleted": true}
        """
        if minio_client is None:
            raise HTTPException(status_code=503, detail="MinIO client not initialized")
        target_bucket = (bucket or MINIO_BUCKET or "").strip()
        if not object_name:
            raise HTTPException(status_code=400, detail="object_name is required")
        if not target_bucket:
            raise HTTPException(status_code=400, detail="bucket name is empty")
        try:
            minio_client.remove_object(target_bucket, object_name)
            logger.info(f"[MINIO_DELETE] removed: {target_bucket}/{object_name}")
            return {"bucket": target_bucket, "object_name": object_name, "deleted": True}
        except Exception as e:
            err_str = str(e)
            # 存在しない場合も成功扱い (idempotent)
            if "NoSuchKey" in err_str or "does not exist" in err_str.lower():
                logger.info(f"[MINIO_DELETE] already absent: {target_bucket}/{object_name}")
                return {"bucket": target_bucket, "object_name": object_name, "deleted": True, "was_absent": True}
            logger.exception(f"[MINIO_DELETE] failed: {target_bucket}/{object_name}: {e}")
            raise HTTPException(status_code=500, detail=f"minio delete failed: {type(e).__name__}: {str(e)[:200]}")


    @app.get("/core/minio/exists")
    async def core_minio_exists(object_name: str, bucket: str = ""):
        """MinIO 上にオブジェクトが存在するか確認する (軽量、 本体は取得しない)。
        Query:
            object_name: 必須
            bucket:      省略時は MINIO_BUCKET
        Returns:
            {"bucket", "object_name", "exists": bool, "size": int|null, "etag": str|null, "last_modified": str|null, "content_type": str|null}
        """
        if minio_client is None:
            raise HTTPException(status_code=503, detail="MinIO client not initialized")
        target_bucket = (bucket or MINIO_BUCKET or "").strip()
        if not object_name:
            raise HTTPException(status_code=400, detail="object_name is required")
        if not target_bucket:
            raise HTTPException(status_code=400, detail="bucket name is empty")
        try:
            stat = minio_client.stat_object(target_bucket, object_name)
            return {
                "bucket": target_bucket,
                "object_name": object_name,
                "exists": True,
                "size": int(stat.size) if stat.size is not None else None,
                "etag": stat.etag,
                "last_modified": stat.last_modified.isoformat() if stat.last_modified else None,
                "content_type": stat.content_type or None,
            }
        except Exception as e:
            err_str = str(e)
            if "NoSuchKey" in err_str or "does not exist" in err_str.lower() or "code: NoSuchKey" in err_str:
                return {
                    "bucket": target_bucket, "object_name": object_name,
                    "exists": False, "size": None, "etag": None, "last_modified": None, "content_type": None,
                }
            logger.exception(f"[MINIO_EXISTS] failed: {target_bucket}/{object_name}: {e}")
            raise HTTPException(status_code=500, detail=f"minio exists check failed: {type(e).__name__}: {str(e)[:200]}")


