        webhook_url = request.get("webhook_url") or ""
        payload = request.get("payload")
        if not webhook_url:
            return {"ok": False, "error": "webhook_url is required", "status_code": 0}
        if not isinstance(payload, dict):
            return {"ok": False, "error": "payload must be a dict", "status_code": 0}

        try:
            r = requests.post(webhook_url, json=payload, timeout=10)
            status_code = r.status_code
            if status_code == 200:
                logger.info("[SLACK_WEBHOOK] Sent successfully")
                return {"ok": True, "error": None, "status_code": status_code}
            else:
                logger.warning(f"[SLACK_WEBHOOK] HTTP failed: status={status_code} body={r.text[:200]}")
                return {"ok": False, "error": f"HTTP {status_code}: {r.text[:200]}", "status_code": status_code}
        except Exception as e:
            logger.warning(f"[SLACK_WEBHOOK] Exception: {type(e).__name__}: {e}")
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}", "status_code": 0}


    # ----------------------------------------------------------------------
    # 外部サービス中継: Slack (users.lookupByEmail)
    # ----------------------------------------------------------------------
    # email → Slack User ID を引く。 利用者登録時に email から自動取得して
    # 仮パスワード DM 送信先に使う (req_20260521_090836)。
    # Bot Token に users:read.email スコープが必要。

    @app.post("/core/slack/lookup-by-email")
    async def core_slack_lookup_by_email(request: dict):
        """Slack の users.lookupByEmail でメールから User ID を引く。

        Body:
            {"bot_token": "xoxb-...", "email": "..."}
        Returns:
            {"ok": bool, "slack_user_id": str, "error": str | null, "status_code": int}
        """
        bot_token = request.get("bot_token") or ""
        email = (request.get("email") or "").strip()
        if not bot_token:
            return {"ok": False, "slack_user_id": "", "error": "bot_token is required", "status_code": 0}
        if not email:
            return {"ok": False, "slack_user_id": "", "error": "email is required", "status_code": 0}

        try:
            r = requests.get(
                "https://slack.com/api/users.lookupByEmail",
                headers={"Authorization": "Bearer " + bot_token},
                params={"email": email},
                timeout=10,
            )
            status_code = r.status_code
            if status_code != 200:
                logger.warning(f"[SLACK_LOOKUP] HTTP failed: status={status_code} body={r.text[:200]}")
                return {"ok": False, "slack_user_id": "", "error": f"HTTP {status_code}: {r.text[:200]}", "status_code": status_code}
            body = r.json()
            if not body.get("ok"):
                err = str(body.get("error", ""))
                # users_not_found は呼び出し側にとって想定エラー (新規外部メールアドレス等)
                if err != "users_not_found":
                    logger.warning(f"[SLACK_LOOKUP] API failed: {err}")
                return {"ok": False, "slack_user_id": "", "error": err, "status_code": status_code}
            uid = str(((body.get("user") or {}).get("id") or "")).strip()
            return {"ok": True, "slack_user_id": uid, "error": None, "status_code": status_code}
        except Exception as e:
            logger.warning(f"[SLACK_LOOKUP] Exception: {type(e).__name__}: {e}")
            return {"ok": False, "slack_user_id": "", "error": f"{type(e).__name__}: {str(e)[:200]}", "status_code": 0}


    # ----------------------------------------------------------------------
    # 外部サービス中継: Keycloak Admin API
    # ----------------------------------------------------------------------
    # 利用者登録画面 (req_20260521_090836_7bb2ed93) のための Keycloak ユーザー管理。
    # kernel は汎用中継: 認証情報 (issuer / admin client_id / client_secret) は
    # 呼び出し側 (contract_app) が env から読み出して渡す。
    # admin Token は client_credentials grant で取得する想定 (kernel 側で発行はしない、
    # client_secret も保持しない)。

    KEYCLOAK_HTTP_TIMEOUT = float(os.environ.get("KERNEL_KEYCLOAK_HTTP_TIMEOUT", "15"))


    def _kc_admin_base(issuer: str) -> str:
        """issuer (例: https://keycloak.example.com/realms/rag) から Admin API base を導出。

        Admin API は /admin/realms/{realm}/...  にあり、 realm 名は issuer の末尾。
        """
        issuer = (issuer or "").rstrip("/")
        if "/realms/" not in issuer:
            return ""
        host_part, realm = issuer.rsplit("/realms/", 1)
        return host_part + "/admin/realms/" + realm


    @app.post("/core/keycloak/admin-token")
    async def core_keycloak_admin_token(request: dict):
        """Keycloak から Admin API 用のアクセストークンを取得する (client_credentials)。

        Body:
            {
              "issuer": "https://keycloak.example.com/realms/rag",   # 必須
              "client_id": "...",                                  # admin 権限を持つ client
              "client_secret": "...",
            }
        Returns:
            {"ok": bool, "access_token": str, "expires_in": int, "error": str | null}
        """
        issuer = (request.get("issuer") or "").rstrip("/")
        client_id = request.get("client_id") or ""
        client_secret = request.get("client_secret") or ""
        if not issuer or not client_id or not client_secret:
            return {"ok": False, "access_token": "", "expires_in": 0,
                    "error": "issuer/client_id/client_secret are required"}
        try:
            r = requests.post(
                issuer + "/protocol/openid-connect/token",
                data={
                    "grant_type": "client_credentials",
                    "client_id": client_id,
                    "client_secret": client_secret,
                },
                timeout=KEYCLOAK_HTTP_TIMEOUT,
            )
            if r.status_code != 200:
                logger.warning(f"[KC_TOKEN] HTTP failed: status={r.status_code} body={r.text[:200]}")
                return {"ok": False, "access_token": "", "expires_in": 0,
                        "error": f"HTTP {r.status_code}: {r.text[:200]}"}
            body = r.json()
            return {"ok": True,
                    "access_token": str(body.get("access_token") or ""),
                    "expires_in": int(body.get("expires_in") or 0),
                    "error": None}
        except Exception as e:
            logger.warning(f"[KC_TOKEN] Exception: {type(e).__name__}: {e}")
            return {"ok": False, "access_token": "", "expires_in": 0,
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/keycloak/users/create")
    async def core_keycloak_users_create(request: dict):
        """Keycloak にユーザーを 1 件作成する (パスワード強制リセット付き)。

        Body:
            {
              "issuer": "...", "access_token": "...",       # 必須
              "username": "...", "email": "...",            # 通常 email と同じ
              "first_name": "...", "last_name": "...",
              "password": "...",                            # 仮パスワード (一時)
              "slack_user_id": "..."                        # 任意 (Keycloak 属性として保存)
            }
        Returns:
            {"ok": bool, "user_id": str, "error": str | null, "status_code": int}
        """
        issuer = request.get("issuer") or ""
        token = request.get("access_token") or ""
        if not issuer or not token:
            return {"ok": False, "user_id": "", "error": "issuer/access_token required", "status_code": 0}

        admin_base = _kc_admin_base(issuer)
        if not admin_base:
            return {"ok": False, "user_id": "", "error": "invalid issuer (no /realms/)", "status_code": 0}

        username = (request.get("username") or "").strip()
        email = (request.get("email") or "").strip()
        first_name = (request.get("first_name") or "").strip()
        last_name = (request.get("last_name") or "").strip()
        password = request.get("password") or ""
        slack_user_id = (request.get("slack_user_id") or "").strip()

        if not username or not email or not password:
            return {"ok": False, "user_id": "", "error": "username/email/password required", "status_code": 0}

        # 属性 (slack_user_id) は単一値でも配列で渡す (Keycloak の仕様)
        attributes = {}
        if slack_user_id:
            attributes["slack_user_id"] = [slack_user_id]

        body = {
            "username": username,
            "email": email,
            "firstName": first_name,
            "lastName": last_name,
            "enabled": True,
            "emailVerified": True,
            "attributes": attributes,
            "credentials": [{
                "type": "password",
                "value": password,
                "temporary": True,   # 初回ログイン時にパスワード再設定を強制
            }],
            # UPDATE_PASSWORD アクションを必須にしておく (temporary と同等だが明示)
            "requiredActions": ["UPDATE_PASSWORD"],
        }
        try:
            r = requests.post(
                admin_base + "/users",
                headers={"Authorization": "Bearer " + token,
                         "Content-Type": "application/json"},
                json=body,
                timeout=KEYCLOAK_HTTP_TIMEOUT,
            )
            if r.status_code not in (201, 204):
                logger.warning(f"[KC_USER_CREATE] HTTP failed: status={r.status_code} body={r.text[:300]}")
                return {"ok": False, "user_id": "",
                        "error": f"HTTP {r.status_code}: {r.text[:300]}",
                        "status_code": r.status_code}
            # 作成成功時 Keycloak は Location ヘッダで user_id を返す
            loc = r.headers.get("Location", "") or ""
            user_id = loc.rsplit("/", 1)[-1] if loc else ""
            logger.info(f"[KC_USER_CREATE] Created user: {username} ({user_id})")
            return {"ok": True, "user_id": user_id, "error": None, "status_code": r.status_code}
        except Exception as e:
            logger.warning(f"[KC_USER_CREATE] Exception: {type(e).__name__}: {e}")
            return {"ok": False, "user_id": "",
                    "error": f"{type(e).__name__}: {str(e)[:200]}", "status_code": 0}


    @app.post("/core/keycloak/users/search")
    async def core_keycloak_users_search(request: dict):
        """Keycloak でユーザーを email / username で検索する。

        Body:
            {"issuer": "...", "access_token": "...",
             "email": "..." or "username": "..." or "search": "..."}
        Returns:
            {"ok": bool, "users": [...], "error": str | null}
        """
        issuer = request.get("issuer") or ""
        token = request.get("access_token") or ""
        if not issuer or not token:
            return {"ok": False, "users": [], "error": "issuer/access_token required"}
        admin_base = _kc_admin_base(issuer)
        if not admin_base:
            return {"ok": False, "users": [], "error": "invalid issuer"}

        params = {}
        for k in ("email", "username", "search", "first", "max", "exact"):
            v = request.get(k)
            if v not in (None, ""):
                params[k] = v
        # exact match: 呼び出し側が明示してきたらそれを尊重。
        # 未指定なら email/username 指定時のみ exact=true を付ける (search は部分一致が既定)。
        if "exact" not in params and ("email" in params or "username" in params):
            params["exact"] = "true"
        # max 未指定なら一定上限を入れる (UI 用、 全件は別エンドポイントで)
        if "max" not in params:
            params["max"] = 200

        try:
            r = requests.get(
                admin_base + "/users",
                headers={"Authorization": "Bearer " + token},
                params=params,
                timeout=KEYCLOAK_HTTP_TIMEOUT,
            )
            if r.status_code != 200:
                logger.warning(f"[KC_USER_SEARCH] HTTP failed: status={r.status_code} body={r.text[:200]}")
                return {"ok": False, "users": [],
                        "error": f"HTTP {r.status_code}: {r.text[:200]}"}
            return {"ok": True, "users": r.json() or [], "error": None}
        except Exception as e:
            logger.warning(f"[KC_USER_SEARCH] Exception: {type(e).__name__}: {e}")
            return {"ok": False, "users": [],
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


