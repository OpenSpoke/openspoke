        return embedding.tolist()


    def get_embeddings_parallel(texts: List[str], max_workers: int = MAX_WORKERS) -> List[List[float]]:
        """バッチembedding生成（sentence-transformers直接バッチ推論）"""
        import torch
        model = get_embedding_model()
        start_time = time.time()

        if (hasattr(torch, 'xpu') and torch.xpu.is_available()) or torch.cuda.is_available():
            batch_size = 64
        else:
            batch_size = 32

        logger.info(f"[EMBEDDING] Batch encoding {len(texts)} texts (batch_size={batch_size})")

        embeddings = model.encode(
            texts,
            batch_size=batch_size,
            normalize_embeddings=True,
            show_progress_bar=False
        )

        elapsed = time.time() - start_time
        rate = len(texts) / elapsed if elapsed > 0 else 0
        logger.info(f"[EMBEDDING] Completed {len(texts)} embeddings in {elapsed:.1f}s ({rate:.1f} chunks/sec)")

        return [e.tolist() for e in embeddings]


    def extract_entities_with_llm(text: str, doc_id: str) -> Dict[str, Any]:
        """LLMを使ってテキストからエンティティと関係を抽出"""
        prompt = f"""以下のテキストから、重要なエンティティ（人物、組織、技術、製品、場所、日付など）とそれらの関係を抽出してください。

    JSON形式で出力してください:
    {{
      "entities": [
        {{"name": "エンティティ名", "type": "Person|Organization|Technology|Product|Location|Date|Other", "description": "簡潔な説明"}}
      ],
      "relationships": [
        {{"from": "エンティティ名1", "to": "エンティティ名2", "type": "関係の種類", "description": "関係の説明"}}
      ]
    }}

    関係の種類の例: WORKS_FOR, BELONGS_TO, USES, CREATED, LOCATED_IN, RELATED_TO, MENTIONS

    テキスト:
    {text[:2000]}

    JSON:"""

        try:
            response = requests.post(
                f"{VLLM_URL}/v1/chat/completions",
                json={
                    "model": LLM_MODEL,
                    "messages": [{"role": "user", "content": prompt}],
                    "temperature": 0.1,
                    "max_tokens": 1024
                },
                timeout=LLM_TIMEOUT
            )

            resp_json = response.json()
            if "choices" not in resp_json:
                error_msg = resp_json.get("error", {}).get("message", str(resp_json))
                logger.error(f"[ENTITY] vLLM error: {error_msg}")
                return {"entities": [], "relationships": [], "doc_id": doc_id}

            result_text = resp_json["choices"][0]["message"]["content"]
            
            json_match = re.search(r'\{[\s\S]*\}', result_text)
            if json_match:
                extracted = json.loads(json_match.group())
                return {
                    "entities": extracted.get("entities", []),
                    "relationships": extracted.get("relationships", []),
                    "doc_id": doc_id
                }
        except Exception as e:
            logger.error(f"[ENTITY] Extraction failed: {e}")
        
        return {"entities": [], "relationships": [], "doc_id": doc_id}



