    # ============================================================
    # Project (spawn grouping)
    # ============================================================

    _PROJECT_ID_PREFIX = "proj-"

    def _project_new_id() -> str:
        return f"proj-{uuid4().hex[:8]}"

    def _project_now_iso() -> str:
        from datetime import datetime, timezone
        return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

    def _project_get_doc(project_id: str):
        os_url = OPENSEARCH_URL.rstrip("/")
        r = requests.get(f"{os_url}/{PROJECTS_INDEX}/_doc/{project_id}", timeout=5)
        if r.status_code == 404:
            return None
        if r.status_code != 200:
            return None
        js = r.json()
        if not js.get("found"):
            return None
        return js.get("_source") or {}

    def _project_bundle(doc, project_id: str):
        if not doc:
            return None
        out = dict(doc)
        out["project_id"] = project_id
        out.setdefault("owners", [])
        out.setdefault("members", [])
        return out


    @app.post("/core/project/create")
    async def core_project_create(request: dict):
        import json as _json
        name = str(request.get("name") or "").strip()
        if not name:
            return {"ok": False, "project": None, "error": "name is required"}
        _spawn_ensure_indices()
        description = str(request.get("description") or "")
        owners_raw = request.get("owners") or []
        members_raw = request.get("members") or []
        if isinstance(owners_raw, str):
            try:
                owners_raw = _json.loads(owners_raw)
            except Exception:
                owners_raw = [owners_raw] if owners_raw else []
        if isinstance(members_raw, str):
            try:
                members_raw = _json.loads(members_raw)
            except Exception:
                members_raw = [members_raw] if members_raw else []
        owners = [str(x) for x in owners_raw if x]
        members = [str(x) for x in members_raw if x]
        try:
            os_url = OPENSEARCH_URL.rstrip("/")
            s = requests.post(
                f"{os_url}/{PROJECTS_INDEX}/_search",
                json={"size": 1, "query": {"term": {"name": name}}},
                headers={"Content-Type": "application/json"},
                timeout=5,
            )
            if s.status_code == 200:
                hits = s.json().get("hits", {}).get("hits", [])
                if hits:
                    return {"ok": False, "project": None, "error": f"project name already exists: {name!r}"}
            project_id = _project_new_id()
            now = _project_now_iso()
            created_epoch = time.time()
            doc = {
                "project_id": project_id,
                "name": name,
                "description": description,
                "status": "active",
                "owners": owners,
                "members": members,
                "created_at": now,
                "created_epoch": created_epoch,
                "updated_at": now,
            }
            r = requests.put(
                f"{os_url}/{PROJECTS_INDEX}/_doc/{project_id}",
                json=doc,
                params={"refresh": "true"},
                headers={"Content-Type": "application/json"},
                timeout=10,
            )
            if r.status_code not in (200, 201):
                return {"ok": False, "project": None, "error": f"opensearch put failed: {r.status_code} {r.text[:200]}"}
            logger.info(f"[PROJECT] created project_id={project_id} name={name!r}")
            return {"ok": True, "project": _project_bundle(doc, project_id), "error": None}
        except Exception as e:
            logger.warning(f"[PROJECT] create failed: {e}")
            return {"ok": False, "project": None, "error": f"{type(e).__name__}: {str(e)[:200]}"}


