            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/vectorstore/add-field")
    async def core_vs_add_field(request: dict):
        """既存 collection に nullable な field を追加する (Milvus 2.4.10+)。

        既存スキーマを破壊せず、 後方互換にフィールドを増やしたい時に使う。
        追加できる field は nullable=True が必須 (Milvus 制約)。
        既存の行はその field が NULL になる。

        Body:
            {
              "namespace": "...",
              "field": {
                  "name": "is_shared",
                  "dtype": "BOOL",            # BOOL / VARCHAR / INT64 等
                  "nullable": True,           # 省略時は True を強制
                  "max_length": 256,          # VARCHAR のみ
                  "description": "..."        # 省略可
              }
            }
        Returns: {"ok": bool, "added": bool, "error": str | null}
        added=False は「既に同名フィールドが存在する」 を示す (冪等成功)。
        """
        namespace = request.get("namespace") or ""
        field_def = request.get("field") or {}
        if not namespace:
            return {"ok": False, "added": False, "error": "namespace is required"}
        if not isinstance(field_def, dict) or not field_def.get("name"):
            return {"ok": False, "added": False, "error": "field.name is required"}

        name = field_def["name"]
        dtype_name = (field_def.get("dtype") or "").upper()
        if not dtype_name:
            return {"ok": False, "added": False, "error": "field.dtype is required"}
        # DataType マッピング
        dtype_map = {
            "BOOL": DataType.BOOL,
            "INT8": DataType.INT8,
            "INT16": DataType.INT16,
            "INT32": DataType.INT32,
            "INT64": DataType.INT64,
            "FLOAT": DataType.FLOAT,
            "DOUBLE": DataType.DOUBLE,
            "VARCHAR": DataType.VARCHAR,
        }
        if dtype_name not in dtype_map:
            return {"ok": False, "added": False,
                    "error": f"unsupported dtype: {dtype_name} (allowed: {list(dtype_map.keys())})"}

        try:
            if not utility.has_collection(namespace):
                return {"ok": False, "added": False,
                        "error": f"collection {namespace} does not exist"}
            col = Collection(namespace)
            # 既存フィールドにあればスキップ (冪等)
            existing_names = {f.name for f in col.schema.fields}
            if name in existing_names:
                return {"ok": True, "added": False, "error": None}
            kwargs = {"nullable": True}
            if dtype_name == "VARCHAR":
                max_length = int(field_def.get("max_length") or 256)
                kwargs["max_length"] = max_length
            if field_def.get("description"):
                kwargs["description"] = str(field_def["description"])
            new_field = FieldSchema(
                name=name,
                dtype=dtype_map[dtype_name],
                **kwargs,
            )
            col.add_field(new_field)
            logger.info(f"[VS] add_field: {namespace}.{name} ({dtype_name}, nullable=True)")
            return {"ok": True, "added": True, "error": None}
        except Exception as e:
            logger.error(f"[VS] add_field error: {namespace}.{name}: {e}")
            return {"ok": False, "added": False,
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/vectorstore/upsert")
    async def core_vs_upsert(request: dict):
        """namespace にデータを挿入する。flush + load まで実行する。

        Body:
            {
              "namespace": "...",
              "data": [{"vector": [...], "doc_id": "...", "text": "...", ...}, ...]
            }
            data の各要素は dict 形式。pymilvus は実際には list of list (列指向) を要求するので、
            kernel 側で行指向→列指向に変換する。
        Returns: {"ok": bool, "inserted_count": int, "error": str | null}
        """
        namespace = request.get("namespace") or ""
        data_rows = request.get("data") or []
        if not namespace:
            return {"ok": False, "inserted_count": 0, "error": "namespace is required"}
        if not isinstance(data_rows, list) or not data_rows:
            return {"ok": False, "inserted_count": 0, "error": "data must be a non-empty list"}

        try:
            collection = Collection(namespace)
            # スキーマからフィールド名と auto_id を取得
            schema = collection.schema
            field_names = []
            for f in schema.fields:
                # auto_id の primary フィールドはスキップ (Milvus が自動生成)
                if f.auto_id and f.is_primary:
                    continue
                field_names.append(f.name)

            # 行指向 → 列指向に変換
            columns = []
            for fname in field_names:
                col = [row.get(fname) for row in data_rows]
                columns.append(col)

            mr = collection.insert(columns)
            collection.flush()
            collection.load()
            inserted = len(data_rows)
            logger.info(f"[VS] upsert OK: {namespace} {inserted} rows")
            return {"ok": True, "inserted_count": inserted, "error": None}
        except Exception as e:
            logger.error(f"[VS] upsert error: {namespace}: {e}", exc_info=True)
            return {"ok": False, "inserted_count": 0, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/vectorstore/search")
    async def core_vs_search(request: dict):
        """ベクトル類似検索を実行する。事前に collection.load() も行う。

        Body:
            {
              "namespace": "...",
              "query_vectors": [[...], [...]],     # 必須 (1つ以上のクエリベクトル)
              "anns_field": "vector",              # 任意 (default "vector")
              "param": {"metric_type": "COSINE", "params": {"nprobe": 10}},
              "limit": 10,                          # 任意 (default 10)
              "expr": "doc_id == 'xxx'",           # 任意 (フィルタ)
              "output_fields": ["doc_id", "text"]  # 任意
            }
        Returns:
            {
              "ok": bool,
              "results": [
                [{"id": int, "distance": float, "entity": {...}}, ...],   # 1クエリ目の結果
                ...
              ],
              "error": str | null
            }
        """
        namespace = request.get("namespace") or ""
        query_vectors = request.get("query_vectors")
        anns_field = request.get("anns_field", "vector")
        param = request.get("param", {"metric_type": "COSINE", "params": {"nprobe": 10}})
        limit = int(request.get("limit", 10))
        expr = request.get("expr")
        output_fields = request.get("output_fields")

        if not namespace:
            return {"ok": False, "results": [], "error": "namespace is required"}
        if not query_vectors or not isinstance(query_vectors, list):
            return {"ok": False, "results": [], "error": "query_vectors must be a non-empty list"}

        try:
            collection = Collection(namespace)
            collection.load()

            search_kwargs = {
                "data": query_vectors,
                "anns_field": anns_field,
                "param": param,
                "limit": limit,
            }
            if expr:
                search_kwargs["expr"] = expr
            if output_fields:
                search_kwargs["output_fields"] = output_fields

            raw_results = collection.search(**search_kwargs)

            # pymilvus の Hits を JSON シリアライズ可能な形式に変換
            results = []
            for hits in raw_results:
                hit_list = []
                for hit in hits:
                    hit_dict = {
                        "id": hit.id,
                        "distance": float(hit.distance),
                    }
                    if output_fields:
                        entity = {}
                        for fname in output_fields:
                            try:
                                entity[fname] = hit.entity.get(fname)
                            except Exception:
                                entity[fname] = None
                        hit_dict["entity"] = entity
                    hit_list.append(hit_dict)
                results.append(hit_list)

            logger.info(f"[VS] search OK: {namespace} {len(query_vectors)} queries, {sum(len(r) for r in results)} hits")
            return {"ok": True, "results": results, "error": None}
        except Exception as e:
            logger.error(f"[VS] search error: {namespace}: {e}", exc_info=True)
            return {"ok": False, "results": [], "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/vectorstore/query")
    async def core_vs_query(request: dict):
        """属性条件によるレコード取得 (ベクトル検索ではない)。

        Body:
            {
              "namespace": "...",
              "expr": "doc_id == 'xxx'",            # 必須
              "output_fields": ["doc_id", "text"],  # 任意 (省略時は全フィールド)
              "limit": 1000                         # 任意
            }
        Returns: {"ok": bool, "results": [{...}, ...], "error": str | null}
        """
        namespace = request.get("namespace") or ""
        expr = request.get("expr") or ""
        output_fields = request.get("output_fields")
        limit = request.get("limit")

        if not namespace:
            return {"ok": False, "results": [], "error": "namespace is required"}
        if not expr:
            return {"ok": False, "results": [], "error": "expr is required"}

        try:
            collection = Collection(namespace)
            collection.load()
            kwargs = {"expr": expr}
            if output_fields:
                kwargs["output_fields"] = output_fields
            if limit is not None:
                kwargs["limit"] = int(limit)
            raw_results = collection.query(**kwargs)
            # query は通常 list of dict を返すのでそのまま使える
            results = [dict(r) for r in raw_results]
            logger.info(f"[VS] query OK: {namespace} expr={expr[:60]}, {len(results)} rows")
            return {"ok": True, "results": results, "error": None}
        except Exception as e:
            logger.error(f"[VS] query error: {namespace}: {e}", exc_info=True)
            return {"ok": False, "results": [], "error": f"{type(e).__name__}: {str(e)[:200]}"}


