    TOOL_SELECTOR_CATEGORIES_DESC = "\n".join([
        "- mail: メール閲覧・送信・メールアカウント管理 (メール、 届いた、 送って 等)",
        "- person: 人物の追加・削除・検索・統合 (人名、 取引先、 連絡先 等)",
        "- github: GitHub のコード読み書き・Issue 操作 (コード、 リポジトリ、 issue、 コミット 等)",
        "- k8s: Kubernetes の pod 一覧・状態確認・ログ・deployment・メンテナンスモード (ポッド、 pod、 一覧、 状態、 稼働、 動いてる、 元気、 再起動、 ログ、 k8s、 クラスタ、 namespace、 デプロイ 等)",
        "- infra: OpenSearch / Memgraph / MinIO への直接アクセス (インデックス、 グラフクエリ、 バケット 等)",
        "- notify: Slack / Mattermost DM 送信 (通知、 Slack、 Mattermost 等)",
