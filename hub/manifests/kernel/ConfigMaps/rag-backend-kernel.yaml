    def get_embedding_model():
        """sentence-transformersでembeddingモデルを直接ロード（初回のみ、GPU対応）"""
        global embedding_model
        if embedding_model is None:
            import torch
            from sentence_transformers import SentenceTransformer

            force_cpu = os.environ.get("EMBEDDING_FORCE_CPU", "0") == "1"

            if force_cpu:
                device = 'cpu'
                logger.info("[EMBED_MODEL] Using CPU (EMBEDDING_FORCE_CPU=1)")
            elif hasattr(torch, 'xpu') and torch.xpu.is_available():
                device = 'xpu'
                logger.info("[EMBED_MODEL] Using Intel Arc GPU (XPU)")
            elif torch.cuda.is_available():
                device = 'cuda'
                logger.info("[EMBED_MODEL] Using NVIDIA GPU (CUDA)")
            else:
                device = 'cpu'
                logger.info("[EMBED_MODEL] Using CPU")

            # snapshotsディレクトリ配下のパスを直接解決する
            # cache_folder経由だとpytorch_model.binを優先してしまうため
            # TRANSFORMERS_CACHE=/model-cache の場合、hubサブディレクトリも探す
            model_id_path = EMBEDDING_MODEL.replace("/", "--")
            _base = os.environ.get("TRANSFORMERS_CACHE", "/model-cache/hub")
            _candidates = [_base, os.path.join(_base, "hub")]
            snapshots_dir = None
            for _c in _candidates:
                _d = os.path.join(_c, f"models--{model_id_path}", "snapshots")
                if os.path.isdir(_d):
                    snapshots_dir = _d
                    break
            model_path = EMBEDDING_MODEL  # デフォルトはモデル名

            if snapshots_dir:
                snapshots = [
                    d for d in os.listdir(snapshots_dir)
                    if os.path.isdir(os.path.join(snapshots_dir, d))
                ]
                if snapshots:
                    snapshot_path = os.path.join(snapshots_dir, snapshots[0])
                    safetensors_path = os.path.join(snapshot_path, "model.safetensors")
                    if os.path.exists(safetensors_path):
                        model_path = snapshot_path
                        logger.info(f"[EMBED_MODEL] Using snapshot: {model_path}")
                    else:
                        logger.warning(f"[EMBED_MODEL] model.safetensors not found in {snapshot_path}")
            else:
                logger.info(f"[EMBED_MODEL] No cache found for {EMBEDDING_MODEL}, trying direct load")

            logger.info(f"[EMBED_MODEL] Loading on {device}")
            embedding_model = SentenceTransformer(model_path, device=device)
            logger.info("[EMBED_MODEL] Model loaded successfully")
        return embedding_model


    def get_embedding(text: str) -> List[float]:
        """単一テキストのembedding取得（sentence-transformers直接）"""
        model = get_embedding_model()
