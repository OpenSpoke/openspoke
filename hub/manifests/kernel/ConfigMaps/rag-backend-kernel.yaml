    from typing import List, Dict, Optional
    from urllib.parse import urlparse
    from concurrent.futures import ThreadPoolExecutor, as_completed
    import time

    logger = logging.getLogger(__name__)


    class WebContentFetcher:
        """URLからWebコンテンツを並列で取得"""
        
        def __init__(self, timeout: int = 5, max_content_length: int = 800):  # 3000→1500に削減
            """
            Args:
                timeout: リクエストタイムアウト（秒）
                max_content_length: 取得する最大文字数
            """
            self.timeout = timeout
            self.max_content_length = max_content_length
            self.session = requests.Session()
            self.session.headers.update({
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
            })
            logger.info(f"[WEB_FETCH_INIT] timeout={timeout}s, max_length={max_content_length} chars")
        
        def extract_urls(self, text: str) -> List[str]:
            """テキストからURLを抽出（日本語対応）"""
            url_pattern = r'https?://[a-zA-Z0-9\-._~:/?#\[\]@!$&\'()*+,;=%]+'
            urls = re.findall(url_pattern, text)
            
            # URLの末尾から不要な記号を除去
            cleaned_urls = []
            for url in urls:
                url = re.sub(r'[.,;:!?\)\]]+$', '', url)
                cleaned_urls.append(url)
            
            # バリデーションと重複除去
            validated_urls = []
            for url in cleaned_urls:
                try:
                    parsed = urlparse(url)
                    if parsed.scheme and parsed.netloc:
                        validated_urls.append(url)
                except Exception as e:
                    logger.debug(f"[WEB_FETCH] Invalid URL skipped: {url}")
                    continue
            
            return list(dict.fromkeys(validated_urls))
        
        def fetch_content(self, url: str) -> Optional[str]:
            """URL先のWebコンテンツを取得"""
            try:
                logger.info(f"[WEB_FETCH] Fetching: {url}")
                response = self.session.get(url, timeout=self.timeout, allow_redirects=True)
                response.raise_for_status()
                
                # Content-Typeチェック
                content_type = response.headers.get('content-type', '').lower()
                if 'text/html' not in content_type and 'text/plain' not in content_type:
                    logger.warning(f"[WEB_FETCH] Unsupported content type: {content_type}")
                    return None
                
                # 文字エンコーディングを明示的に処理
                if response.encoding is None:
                    response.encoding = 'utf-8'
                
                # HTMLパース
                soup = BeautifulSoup(response.content, 'lxml')
                
                # 不要なタグを除去
                for tag in soup(['script', 'style', 'nav', 'header', 'footer', 'aside', 'iframe', 'noscript']):
                    tag.decompose()
                
                # メインコンテンツ抽出
                text = soup.get_text(separator='\n', strip=True)
                
                # 空行削除と整形
                lines = [line.strip() for line in text.split('\n') if line.strip()]
                text = '\n'.join(lines)
                
                # 制御文字や特殊文字を除去
                text = re.sub(r'[\x00-\x08\x0B-\x0C\x0E-\x1F\x7F-\x9F]', '', text)
                
                # 長さ制限
                original_length = len(text)
                if len(text) > self.max_content_length:
                    text = text[:self.max_content_length] + "\n... (以下省略)"
                
                logger.info(f"[WEB_FETCH] Fetched {original_length} chars (truncated to {len(text)}) from {url}")
                
                # 概算トークン数をログ出力（日本語: 1文字≈2.5トークン、英語: 1単語≈1.3トークン）
                estimated_tokens = int(len(text) * 2.0)  # 保守的な見積もり
                logger.info(f"[WEB_FETCH] Estimated tokens: {estimated_tokens}")
                
                return text
                
            except requests.exceptions.Timeout:
                logger.warning(f"[WEB_FETCH] Timeout ({self.timeout}s): {url}")
                return None
            except requests.exceptions.HTTPError as e:
                logger.warning(f"[WEB_FETCH] HTTP {e.response.status_code}: {url}")
                return None
            except requests.exceptions.RequestException as e:
                logger.warning(f"[WEB_FETCH] Request failed: {url} - {str(e)[:100]}")
                return None
            except Exception as e:
                logger.error(f"[WEB_FETCH] Unexpected error: {url} - {str(e)[:100]}")
                return None
        
        def fetch_urls_parallel(self, urls: List[str], max_workers: int = 2) -> Dict[str, Optional[str]]:  # 3→2に削減
            """複数のURLを並列で取得"""
            results = {}
            
            with ThreadPoolExecutor(max_workers=max_workers) as executor:
                future_to_url = {
                    executor.submit(self.fetch_content, url): url 
                    for url in urls
                }
                
                for future in as_completed(future_to_url):
                    url = future_to_url[future]
                    try:
                        content = future.result()
                        results[url] = content
                    except Exception as e:
                        logger.error(f"[WEB_FETCH] Error processing {url}: {e}")
                        results[url] = None
            
            return results
        
        def enhance_results_with_urls(
            self, 
            search_results: List[Dict], 
            max_urls: int = 2  # 拡張版: 800文字×2URL
        ) -> List[Dict]:
            """検索結果からURLを抽出し、コンテンツを並列で取得して結果に追加"""
            start_time = time.time()
            
            # 検索結果からURL抽出
            all_urls = []
            for result in search_results:
                content = result.get('content', '') or result.get('text', '')
                if content:
                    urls = self.extract_urls(content)
                    all_urls.extend(urls)
            
            # 重複除去と制限
            unique_urls = list(dict.fromkeys(all_urls))[:max_urls]
            
            if not unique_urls:
                logger.info("[WEB_FETCH] No URLs found in search results")
                return search_results
            
            logger.info(f"[WEB_FETCH] Found {len(unique_urls)} unique URLs to fetch (limit: {max_urls})")
            
            # URL先のコンテンツを並列で取得
            url_contents = self.fetch_urls_parallel(unique_urls)
            
            # 結果に追加
            enhanced_results = search_results.copy()
            fetched_count = 0
            total_added_chars = 0
            
            for url, content in url_contents.items():
                if content:
                    enhanced_results.append({
                        'text': f"[URL先の情報: {url}]\n{content}",
                        'score': 0.95,
                        'source': 'web_content',
                        'url': url
                    })
                    fetched_count += 1
                    total_added_chars += len(content)
            
            elapsed = time.time() - start_time
            logger.info(f"[WEB_FETCH] Successfully fetched {fetched_count}/{len(unique_urls)} URLs in {elapsed:.2f}s")
            logger.info(f"[WEB_FETCH] Total added content: {total_added_chars} chars")
            
            return enhanced_results
