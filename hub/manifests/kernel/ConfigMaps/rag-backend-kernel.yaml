    @app.post("/core/project/update")
    async def core_project_update(request: dict):
        project_id = str(request.get("project_id") or "")
        if not project_id:
            return {"ok": False, "project": None, "error": "project_id is required"}
        _spawn_ensure_indices()
        try:
            doc = _project_get_doc(project_id)
            if doc is None:
                return {"ok": False, "project": None, "error": f"project not found: {project_id}"}
            updates = {}
            new_name = request.get("name")
            if new_name is not None:
                new_name = str(new_name).strip()
                if new_name and new_name != doc.get("name"):
                    os_url = OPENSEARCH_URL.rstrip("/")
                    s = requests.post(
                        f"{os_url}/{PROJECTS_INDEX}/_search",
                        json={"size": 1, "query": {"term": {"name": new_name}}},
                        headers={"Content-Type": "application/json"},
                        timeout=5,
                    )
                    if s.status_code == 200:
                        hits = s.json().get("hits", {}).get("hits", [])
                        if hits and hits[0].get("_id") != project_id:
                            return {"ok": False, "project": None, "error": f"project name already exists: {new_name!r}"}
                    updates["name"] = new_name
            if request.get("description") is not None:
                updates["description"] = str(request.get("description") or "")
            if request.get("status") is not None:
                new_status = str(request.get("status") or "").lower()
                if new_status not in ("active", "completed", "archived"):
                    return {"ok": False, "project": None, "error": f"invalid status: {new_status!r}"}
                updates["status"] = new_status
            if not updates:
                return {"ok": True, "project": _project_bundle(doc, project_id), "error": None}
            updates["updated_at"] = _project_now_iso()
            os_url = OPENSEARCH_URL.rstrip("/")
            upd = requests.post(
                f"{os_url}/{PROJECTS_INDEX}/_update/{project_id}",
                json={"doc": updates},
                params={"refresh": "true", "retry_on_conflict": 3},
                headers={"Content-Type": "application/json"},
                timeout=10,
            )
            if upd.status_code != 200:
                return {"ok": False, "project": None, "error": f"opensearch update failed: {upd.status_code} {upd.text[:200]}"}
            doc.update(updates)
            logger.info(f"[PROJECT] updated project_id={project_id} fields={list(updates.keys())}")
            return {"ok": True, "project": _project_bundle(doc, project_id), "error": None}
        except Exception as e:
            logger.warning(f"[PROJECT] update failed: project_id={project_id}: {e}")
            return {"ok": False, "project": None, "error": f"{type(e).__name__}: {str(e)[:200]}"}


