    @app.post("/gdrive/index")
    async def index_gdrive_folder(request: dict, background_tasks: BackgroundTasks):

        """Google Driveフォルダをバックグラウンドでインデックス化（即時job_id返却）"""

        folder_id = request.get("folder_id")

