    def _resolve_tier_name(value: str) -> str:
        """ティア名または実モデル名を受け取り、 ティア名に正規化する。
        不明な値は "" を返す (= 上限指定なし扱い)。
        """
        v = (value or "").strip()
        if not v:
            return ""
        if v in CLAUDE_TIER_ORDER:
            return v
        return CLAUDE_MODEL_TO_TIER.get(v, "")

    def _claude_strip_unsupported_sampling(model: str, kwargs: dict) -> dict:
        """Opus 4.7 / 4.8 以降は adaptive sampling のため temperature/top_p/top_k を受け付けない
        (Anthropic 公式: これらを送ると 400 invalid_request_error)。

        対象モデルでは kwargs から該当キーを除外する。 既存モデル (Sonnet / Haiku / Opus 4.6 以前)
        ではそのまま通す。 in-place で kwargs を変更し、 同じ dict を返す。

        参考: Opus 4.7/4.8 migration guide (2026)。
        """
        _m = (model or "").strip()
        if _m.startswith("claude-opus-4-7") or _m.startswith("claude-opus-4-8"):
            kwargs.pop("temperature", None)
            kwargs.pop("top_p", None)
            kwargs.pop("top_k", None)
        return kwargs

    def _clamp_claude_model_to_max(model: str, max_tier: str) -> str:
        """model (実モデル名) を max_tier (上限) 以下にクランプして返す。

        max_tier が空 / 不明なら model をそのまま返す (上限なし)。
        model が未知なら model をそのまま返す (判断不能なので触らない)。
        例: model=opus(advanced), max_tier=light → haiku(light) に下げる。
            model=haiku(light),  max_tier=advanced → haiku のまま (既に下)。
        """
        cap = _resolve_tier_name(max_tier)
        if not cap:
            return model
        cur_tier = CLAUDE_MODEL_TO_TIER.get((model or "").strip(), "")
        if not cur_tier:
            return model
        cur_idx = CLAUDE_TIER_ORDER.index(cur_tier)
        cap_idx = CLAUDE_TIER_ORDER.index(cap)
        if cur_idx <= cap_idx:
            return model
        return CLAUDE_TIER_TO_MODEL[cap]
