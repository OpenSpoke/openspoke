    @app.post("/core/keycloak/users/reset-password")
    async def core_keycloak_users_reset_password(request: dict):
        """Keycloak ユーザーのパスワードを初期化する (admin が一時パスワードを発行)。

        Admin API:
            PUT /admin/realms/{realm}/users/{user_id}/reset-password
              body: {"type": "password", "value": "...", "temporary": true|false}

        temporary=true のときは、 次回ログイン時に UPDATE_PASSWORD が要求される
        (Keycloak の標準挙動)。 さらに念のため PUT /users/{user_id} で
        requiredActions=["UPDATE_PASSWORD"] も併設する (旧来の create と同じパターン)。

        Body:
            {"issuer": "...", "access_token": "...",
             "user_id": "...", "password": "...",
             "temporary": true (default true)}
        Returns:
            {"ok": bool, "error": str | null, "status_code": int}
        """
        issuer = request.get("issuer") or ""
        token = request.get("access_token") or ""
        user_id = (request.get("user_id") or "").strip()
        password = request.get("password") or ""
        temporary = bool(request.get("temporary", True))
        if not issuer or not token or not user_id or not password:
            return {"ok": False, "error": "issuer/access_token/user_id/password required", "status_code": 0}
        admin_base = _kc_admin_base(issuer)
        if not admin_base:
            return {"ok": False, "error": "invalid issuer", "status_code": 0}

        try:
            r1 = requests.put(
                admin_base + "/users/" + user_id + "/reset-password",
                headers={"Authorization": "Bearer " + token,
                         "Content-Type": "application/json"},
                json={"type": "password", "value": password, "temporary": temporary},
                timeout=KEYCLOAK_HTTP_TIMEOUT,
            )
            if r1.status_code not in (204, 200):
                logger.warning(f"[KC_USER_RESET_PW] reset-password HTTP failed: status={r1.status_code} body={r1.text[:200]}")
                return {"ok": False,
                        "error": f"HTTP {r1.status_code}: {r1.text[:200]}",
                        "status_code": r1.status_code}
            # temporary=true でも requiredActions が空のままになる Keycloak の
            # バージョンがあるため、 明示的に UPDATE_PASSWORD を追加する。
            if temporary:
                try:
                    r2 = requests.put(
                        admin_base + "/users/" + user_id,
                        headers={"Authorization": "Bearer " + token,
                                 "Content-Type": "application/json"},
                        json={"requiredActions": ["UPDATE_PASSWORD"]},
                        timeout=KEYCLOAK_HTTP_TIMEOUT,
                    )
                    if r2.status_code not in (204, 200):
                        # reset 自体は成功しているので警告のみ
                        logger.warning(f"[KC_USER_RESET_PW] set requiredActions failed: status={r2.status_code} body={r2.text[:200]}")
                except Exception as _re:
                    logger.warning(f"[KC_USER_RESET_PW] set requiredActions exception: {_re}")
            logger.info(f"[KC_USER_RESET_PW] user_id={user_id} temporary={temporary}")
            return {"ok": True, "error": None, "status_code": r1.status_code}
        except Exception as e:
            logger.warning(f"[KC_USER_RESET_PW] Exception: {type(e).__name__}: {e}")
            return {"ok": False,
                    "error": f"{type(e).__name__}: {str(e)[:200]}", "status_code": 0}


    @app.post("/core/keycloak/users/realm-roles-get")
    async def core_keycloak_users_realm_roles_get(request: dict):
        """Keycloak ユーザーに割当てられている realm role 一覧を返す。

        Admin API:
            GET /admin/realms/{realm}/users/{user_id}/role-mappings/realm

        Body:
            {"issuer": "...", "access_token": "...", "user_id": "..."}
