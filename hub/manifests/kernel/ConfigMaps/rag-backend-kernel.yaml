    # ============================================================
    # Claude API 使用量サマリエンドポイント群
    # ============================================================
    # OpenSearch (claude_usage インデックス) を集計して返す。
    # 期間指定: today / week / month / all
    # 失敗時は空のレスポンスを返し、500 にはしない。

    def _usage_period_to_range(period: str) -> dict:
        """期間指定文字列を OpenSearch range クエリに変換。"""
        period = (period or "").lower().strip()
        if period == "today":
            return {"range": {"@timestamp": {"gte": "now/d"}}}
        elif period == "week":
            return {"range": {"@timestamp": {"gte": "now-7d/d"}}}
        elif period == "month":
            return {"range": {"@timestamp": {"gte": "now-30d/d"}}}
        else:
            # all: 期間制限なし
            return {"match_all": {}}


    def _usage_search(body: dict) -> dict:
        """OpenSearch /claude_usage/_search を叩いてレスポンスJSONを返す。失敗時は None。"""
        if not OPENSEARCH_ENABLED:
            return None
        try:
            resp = requests.post(
                f"{OPENSEARCH_URL}/{OPENSEARCH_USAGE_INDEX}/_search",
                json=body,
                headers={"Content-Type": "application/json"},
                timeout=10,
            )
            if resp.status_code != 200:
                logger.warning(f"[USAGE_API] OpenSearch returned {resp.status_code}: {resp.text[:200]}")
                return None
            return resp.json()
        except Exception as e:
            logger.warning(f"[USAGE_API] OpenSearch query failed: {type(e).__name__}: {e}")
            return None


    @app.get("/api/usage/summary")
    async def usage_summary(period: str = "today"):
        """Claude API 使用量の合計サマリ。
        period: today (今日), week (過去7日), month (過去30日), all (全期間)
        返却: {period, calls, input_tokens, output_tokens, cache_w, cache_r, cost_usd}
        """
        body = {
            "size": 0,
            "query": _usage_period_to_range(period),
            "aggs": {
                "calls": {"value_count": {"field": "op.keyword"}},
                "input_tokens": {"sum": {"field": "input_tokens"}},
                "output_tokens": {"sum": {"field": "output_tokens"}},
                "cache_w": {"sum": {"field": "cache_w"}},
                "cache_r": {"sum": {"field": "cache_r"}},
                "cost_usd": {"sum": {"field": "cost_usd"}},
            }
        }
        result = _usage_search(body)
        if result is None:
            return {"period": period, "calls": 0, "input_tokens": 0, "output_tokens": 0,
                    "cache_w": 0, "cache_r": 0, "cost_usd": 0.0, "error": "OpenSearch unavailable"}
        aggs = result.get("aggregations", {})
        return {
            "period": period,
            "calls": int(aggs.get("calls", {}).get("value", 0) or 0),
            "input_tokens": int(aggs.get("input_tokens", {}).get("value", 0) or 0),
            "output_tokens": int(aggs.get("output_tokens", {}).get("value", 0) or 0),
            "cache_w": int(aggs.get("cache_w", {}).get("value", 0) or 0),
            "cache_r": int(aggs.get("cache_r", {}).get("value", 0) or 0),
            "cost_usd": round(float(aggs.get("cost_usd", {}).get("value", 0.0) or 0.0), 6),
        }


    @app.get("/api/usage/by_op")
    async def usage_by_op(period: str = "today"):
        """Claude API 使用量を op 別に集計。
        period: today / week / month / all
        返却: {period, by_op: [{op, calls, input_tokens, output_tokens, cache_w, cache_r, cost_usd}, ...]}
        """
        body = {
            "size": 0,
            "query": _usage_period_to_range(period),
            "aggs": {
                "by_op": {
                    "terms": {"field": "op.keyword", "size": 50},
                    "aggs": {
                        "input_tokens": {"sum": {"field": "input_tokens"}},
                        "output_tokens": {"sum": {"field": "output_tokens"}},
                        "cache_w": {"sum": {"field": "cache_w"}},
                        "cache_r": {"sum": {"field": "cache_r"}},
                        "cost_usd": {"sum": {"field": "cost_usd"}},
                    }
                }
            }
        }
        result = _usage_search(body)
        if result is None:
            return {"period": period, "by_op": [], "error": "OpenSearch unavailable"}
        buckets = result.get("aggregations", {}).get("by_op", {}).get("buckets", [])
        by_op = []
        for b in buckets:
            by_op.append({
                "op": b.get("key", ""),
                "calls": int(b.get("doc_count", 0) or 0),
                "input_tokens": int(b.get("input_tokens", {}).get("value", 0) or 0),
                "output_tokens": int(b.get("output_tokens", {}).get("value", 0) or 0),
                "cache_w": int(b.get("cache_w", {}).get("value", 0) or 0),
                "cache_r": int(b.get("cache_r", {}).get("value", 0) or 0),
                "cost_usd": round(float(b.get("cost_usd", {}).get("value", 0.0) or 0.0), 6),
            })
        # コスト降順でソート
        by_op.sort(key=lambda x: x["cost_usd"], reverse=True)
        return {"period": period, "by_op": by_op}


    @app.get("/api/usage/daily")
    async def usage_daily(days: int = 30):
        """Claude API 使用量の日別推移。
        days: 過去 N 日 (1-365、デフォルト 30)
        返却: {days, daily: [{date, calls, cost_usd, input_tokens, output_tokens}, ...]}
        """
        try:
            days = int(days)
        except (TypeError, ValueError):
            days = 30
        days = max(1, min(days, 365))
        body = {
            "size": 0,
            "query": {"range": {"@timestamp": {"gte": f"now-{days}d/d"}}},
            "aggs": {
                "daily": {
                    "date_histogram": {
                        "field": "@timestamp",
                        "calendar_interval": "day",
                        "format": "yyyy-MM-dd",
                        "min_doc_count": 0,
                    },
                    "aggs": {
                        "input_tokens": {"sum": {"field": "input_tokens"}},
                        "output_tokens": {"sum": {"field": "output_tokens"}},
                        "cost_usd": {"sum": {"field": "cost_usd"}},
                    }
                }
            }
        }
        result = _usage_search(body)
        if result is None:
            return {"days": days, "daily": [], "error": "OpenSearch unavailable"}
        buckets = result.get("aggregations", {}).get("daily", {}).get("buckets", [])
        daily = []
        for b in buckets:
            daily.append({
                "date": b.get("key_as_string", ""),
                "calls": int(b.get("doc_count", 0) or 0),
                "input_tokens": int(b.get("input_tokens", {}).get("value", 0) or 0),
                "output_tokens": int(b.get("output_tokens", {}).get("value", 0) or 0),
                "cost_usd": round(float(b.get("cost_usd", {}).get("value", 0.0) or 0.0), 6),
            })
        return {"days": days, "daily": daily}


    # ========================================================================
    # スケジューラ (汎用「定期タスク」抽象機構)
    # ========================================================================
    # 「N秒/N分ごとにこの URL を POST で叩く」という抽象機能を提供する。
    # 実際のタスク処理 (メール取得、 リマインダー、 日次集計等) は呼び出し側 (the assistant backend 等)
    # が HTTP endpoint として実装する。 kernel は時刻管理と発火だけを担う。
    #
    # タスク保存先: OpenSearch index "scheduled_tasks" (動的 mapping)
    # 重複実行防止: optimistic concurrency control (if_seq_no / if_primary_term)
    # スケジューラループ: kernel startup で asyncio.create_task 起動、 1秒おきに発火チェック

    SCHEDULED_TASKS_INDEX = "scheduled_tasks"
    SCHEDULER_TICK_SEC = float(os.environ.get("SCHEDULER_TICK_SEC", "1.0"))
    SCHEDULER_FETCH_LIMIT = int(os.environ.get("SCHEDULER_FETCH_LIMIT", "50"))
    SCHEDULER_HTTP_TIMEOUT = float(os.environ.get("SCHEDULER_HTTP_TIMEOUT", "60"))
    # スケジューラループのグローバル制御
    _scheduler_task = None  # asyncio.Task, startup で起動
    _scheduler_stop = False  # shutdown で True にすると次の tick で抜ける


    def _scheduler_now_iso() -> str:
        """現在時刻を ISO8601 (UTC、 ミリ秒精度) で返す。 OpenSearch date 型と互換。"""
        from datetime import datetime, timezone
        return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%f")[:-3] + "Z"


    def _scheduler_compute_next_run(schedule: dict, base_iso: str = None) -> str:
        """schedule 定義から次回実行時刻 (ISO8601 UTC) を計算する。

        type=interval: base_iso + interval_sec
        type=once:     run_at をそのまま (発火後は enabled=false にすることで二度実行を防ぐ)
        type=cron:     未対応 (croniter 依存追加が必要、 Phase 0 では interval/once のみ)

        失敗時は遠い未来 ("9999-12-31T23:59:59Z") を返してタスクを事実上停止させる。
        """
        from datetime import datetime, timezone, timedelta
        try:
            stype = (schedule or {}).get("type", "interval")
            if stype == "interval":
                interval = int(schedule.get("interval_sec", 60))
                if interval < 1:
                    interval = 1
                if base_iso:
                    # base_iso をパース (Z 終端 or +00:00)
                    base = base_iso.replace("Z", "+00:00")
                    dt = datetime.fromisoformat(base)
                else:
                    dt = datetime.now(timezone.utc)
                nxt = dt + timedelta(seconds=interval)
                return nxt.strftime("%Y-%m-%dT%H:%M:%S.%f")[:-3] + "Z"
            elif stype == "once":
                return str(schedule.get("run_at") or _scheduler_now_iso())
            elif stype == "cron":
                logger.warning("[SCHEDULER] cron type not supported in Phase 0 (interval/once only)")
                return "9999-12-31T23:59:59.000Z"
            else:
                logger.warning(f"[SCHEDULER] unknown schedule type: {stype}")
                return "9999-12-31T23:59:59.000Z"
        except Exception as e:
            logger.error(f"[SCHEDULER] compute_next_run failed: {e}")
            return "9999-12-31T23:59:59.000Z"


    def _scheduler_validate_task(task: dict) -> str:
        """タスク定義を検証する。 エラー文字列を返す (空なら OK)。"""
        if not isinstance(task, dict):
            return "task must be a dict"
        if not task.get("task_type"):
            return "task_type is required"
        if not task.get("owner"):
            return "owner is required"
        schedule = task.get("schedule")
        if not isinstance(schedule, dict):
            return "schedule (dict) is required"
        stype = schedule.get("type")
        if stype not in ("interval", "once", "cron"):
            return f"schedule.type must be 'interval' / 'once' / 'cron' (got: {stype})"
        if stype == "interval" and not schedule.get("interval_sec"):
            return "schedule.interval_sec is required for type=interval"
        if stype == "once" and not schedule.get("run_at"):
            return "schedule.run_at is required for type=once"
        handler = task.get("handler")
        if not isinstance(handler, dict):
            return "handler (dict) is required"
        if handler.get("type") != "http":
            return "handler.type must be 'http' (only HTTP callback supported)"
        if not handler.get("url"):
            return "handler.url is required"
        return ""


    def _scheduler_index_task(task_id: str, doc: dict, refresh: str = "false") -> tuple:
        """タスクドキュメントを OpenSearch に PUT する。 (status_code, response_json) を返す。"""
        try:
            url = f"{OPENSEARCH_URL}/{SCHEDULED_TASKS_INDEX}/_doc/{task_id}"
            params = {"refresh": refresh}
            resp = requests.put(url, json=doc, params=params, timeout=10)
            try:
                rj = resp.json()
            except Exception:
                rj = {}
            return resp.status_code, rj
        except Exception as e:
            logger.error(f"[SCHEDULER] index_task failed: {e}")
            return 0, {}


    def _scheduler_get_task(task_id: str) -> dict:
        """OpenSearch からタスクを取得。 _seq_no / _primary_term も含めた dict を返す。"""
        try:
            url = f"{OPENSEARCH_URL}/{SCHEDULED_TASKS_INDEX}/_doc/{task_id}"
            resp = requests.get(url, timeout=10)
            if resp.status_code != 200:
                return None
            data = resp.json()
            src = data.get("_source", {}) or {}
            src["_id"] = data.get("_id")
            src["_seq_no"] = data.get("_seq_no")
            src["_primary_term"] = data.get("_primary_term")
            return src
        except Exception as e:
            logger.warning(f"[SCHEDULER] get_task failed: {task_id}: {e}")
            return None


    def _scheduler_optimistic_advance(task: dict, new_next_run_at: str) -> bool:
        """タスクの next_run_at を optimistic concurrency control で進める。
        成功すれば True (このインスタンスがハンドラ実行する権利を取得)、
        失敗すれば False (他インスタンスが先に進めた、 or タスクが消えた等)。
        """
        try:
            seq_no = task.get("_seq_no")
            prim = task.get("_primary_term")
            if seq_no is None or prim is None:
                return False
            update_body = {
                "doc": {"next_run_at": new_next_run_at}
            }
            url = f"{OPENSEARCH_URL}/{SCHEDULED_TASKS_INDEX}/_update/{task['_id']}"
            params = {"if_seq_no": seq_no, "if_primary_term": prim}
            resp = requests.post(url, json=update_body, params=params, timeout=10)
            return resp.status_code in (200, 201)
        except Exception as e:
            logger.warning(f"[SCHEDULER] optimistic_advance failed: {e}")
            return False


    def _scheduler_record_run(task_id: str, status: str, error: str = "",
                              completed_at: str = "", next_run_at: str = "",
                              enabled: bool = None) -> bool:
        """タスク実行結果を OpenSearch に書き戻す (last_run_*, next_run_at 更新)。"""
        try:
            doc = {
                "last_run_at": completed_at or _scheduler_now_iso(),
                "last_run_status": status,
                "last_run_error": error[:500] if error else "",
            }
            if next_run_at:
                doc["next_run_at"] = next_run_at
            if enabled is not None:
                doc["enabled"] = bool(enabled)
            update_body = {"doc": doc}
            url = f"{OPENSEARCH_URL}/{SCHEDULED_TASKS_INDEX}/_update/{task_id}"
            resp = requests.post(url, json=update_body, params={"refresh": "false"}, timeout=10)
            return resp.status_code in (200, 201)
        except Exception as e:
            logger.warning(f"[SCHEDULER] record_run failed: {task_id}: {e}")
            return False


    async def _scheduler_call_handler(task: dict) -> dict:
        """タスクの handler URL を HTTP POST で叩く。 結果を {ok, summary, error} で返す。"""
        handler = task.get("handler", {}) or {}
        url = handler.get("url", "")
        method = (handler.get("method") or "POST").upper()
        timeout = float(handler.get("timeout_sec") or SCHEDULER_HTTP_TIMEOUT)
        body = {
            "task_id": task.get("_id"),
            "task_type": task.get("task_type"),
            "owner": task.get("owner"),
            "user_id": task.get("user_id", ""),
            "params": task.get("params", {}) or {},
        }

        def _do_request():
            return requests.request(method, url, json=body, timeout=timeout)

        try:
            resp = await asyncio.to_thread(_do_request)
            if resp.status_code in (200, 201, 202, 204):
                try:
                    rj = resp.json()
                except Exception:
                    rj = {}
                return {
                    "ok": bool(rj.get("ok", True)),
                    "summary": str(rj.get("summary", ""))[:500],
                    "error": str(rj.get("error", ""))[:500] if not rj.get("ok", True) else "",
                }
            return {
                "ok": False,
                "summary": "",
                "error": f"HTTP {resp.status_code}: {resp.text[:200]}",
            }
        except Exception as e:
            return {
                "ok": False,
                "summary": "",
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }


    async def _scheduler_execute_one(task: dict):
        """1 タスクを実行する: handler 呼び出し → next_run_at 計算 → 結果記録。"""
        task_id = task.get("_id")
        try:
            result = await _scheduler_call_handler(task)
            schedule = task.get("schedule", {}) or {}
            stype = schedule.get("type", "interval")
            now_iso = _scheduler_now_iso()

            new_enabled = None
            new_next_run_at = ""
            if stype == "once":
                new_enabled = False  # 一回限り → 無効化
                new_next_run_at = "9999-12-31T23:59:59.000Z"
            else:
                new_next_run_at = _scheduler_compute_next_run(schedule, base_iso=now_iso)

            status = "success" if result.get("ok") else "failure"
            _scheduler_record_run(
                task_id, status,
                error=result.get("error", ""),
                completed_at=now_iso,
                next_run_at=new_next_run_at,
                enabled=new_enabled,
            )
            logger.info(
                f"[SCHEDULER] executed task_id={task_id} type={task.get('task_type')} "
                f"status={status} summary={result.get('summary', '')[:60]}"
            )
        except Exception as e:
            logger.error(f"[SCHEDULER] execute_one error: {task_id}: {e}", exc_info=True)
            _scheduler_record_run(
                task_id, "failure",
                error=f"{type(e).__name__}: {str(e)[:200]}",
                completed_at=_scheduler_now_iso(),
            )


    async def _scheduler_loop():
        """常駐スケジューラループ。 startup で asyncio.create_task 起動。"""
        logger.info(f"[SCHEDULER] loop started (tick={SCHEDULER_TICK_SEC}s)")
        global _scheduler_stop
        while not _scheduler_stop:
            try:
                if not OPENSEARCH_ENABLED:
                    await asyncio.sleep(SCHEDULER_TICK_SEC)
                    continue

                now_iso = _scheduler_now_iso()
                # enabled=true かつ next_run_at <= 現在 のタスクを引く
                query_body = {
                    "size": SCHEDULER_FETCH_LIMIT,
                    "query": {
                        "bool": {
                            "filter": [
                                {"term": {"enabled": True}},
                                {"range": {"next_run_at": {"lte": now_iso}}},
                            ]
                        }
                    },
                    "sort": [{"next_run_at": {"order": "asc"}}],
                    "seq_no_primary_term": True,  # optimistic concurrency control 用
                }
                try:
                    resp = await asyncio.to_thread(
                        requests.post,
                        f"{OPENSEARCH_URL}/{SCHEDULED_TASKS_INDEX}/_search",
                        json=query_body,
                        timeout=10,
                    )
                except Exception as e:
                    # OpenSearch 一時障害は次の tick で再試行
                    logger.warning(f"[SCHEDULER] search failed: {e}")
                    await asyncio.sleep(SCHEDULER_TICK_SEC)
                    continue

                if resp.status_code == 404:
                    # index 未作成 → 何もしない
                    await asyncio.sleep(SCHEDULER_TICK_SEC)
                    continue
                if resp.status_code != 200:
                    logger.warning(f"[SCHEDULER] search status={resp.status_code}: {resp.text[:200]}")
                    await asyncio.sleep(SCHEDULER_TICK_SEC)
                    continue

                hits = resp.json().get("hits", {}).get("hits", []) or []
                if not hits:
                    await asyncio.sleep(SCHEDULER_TICK_SEC)
                    continue

                # 各タスクに対して、 optimistic advance で「自分が実行する権利」を取得 → 並行実行
                exec_tasks = []
                for h in hits:
                    src = h.get("_source", {}) or {}
                    src["_id"] = h.get("_id")
                    src["_seq_no"] = h.get("_seq_no")
                    src["_primary_term"] = h.get("_primary_term")

                    schedule = src.get("schedule", {}) or {}
                    # 重複実行防止: next_run_at を未来に進めて他インスタンスを排除
                    # (ここでは仮に +1分 進める。 実際の next_run_at は実行完了後に再計算)
                    from datetime import datetime, timezone, timedelta
                    advance_to = (datetime.now(timezone.utc) + timedelta(minutes=1)).strftime(
                        "%Y-%m-%dT%H:%M:%S.%f"
                    )[:-3] + "Z"
                    if not _scheduler_optimistic_advance(src, advance_to):
                        # 他インスタンスが先に取得した、 もしくはタスクが削除された → スキップ
                        continue
                    exec_tasks.append(_scheduler_execute_one(src))

                if exec_tasks:
                    # 並行実行 (handler の遅延が他タスクをブロックしないため)
                    await asyncio.gather(*exec_tasks, return_exceptions=True)

                await asyncio.sleep(SCHEDULER_TICK_SEC)
            except asyncio.CancelledError:
                logger.info("[SCHEDULER] loop cancelled")
                break
            except Exception as e:
                logger.error(f"[SCHEDULER] loop iteration error: {e}", exc_info=True)
                await asyncio.sleep(SCHEDULER_TICK_SEC)
        logger.info("[SCHEDULER] loop stopped")


