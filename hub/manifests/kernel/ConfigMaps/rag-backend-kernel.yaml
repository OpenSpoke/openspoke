    @app.post("/core/scheduler/tasks")
    async def core_scheduler_create_task(request: dict):
        """新規タスクを登録する。

        Body:
            {
              "task_id": "...",          # 任意 (省略時は uuid 生成)
              "task_type": "imap_fetch", # 必須
              "owner": "secretary",      # 必須 (持ち主アプリの識別: secretary, rag-backend 等)
              "user_id": "...",          # 任意 (system タスクなら空)
              "enabled": true,           # 任意 (default true)
              "schedule": {              # 必須
                "type": "interval"|"once",
                "interval_sec": 300,     # type=interval の場合
                "run_at": "..."          # type=once の場合 (ISO8601 UTC)
              },
              "handler": {               # 必須
                "type": "http",
                "url": "http://...",     # 必須
                "method": "POST",        # 任意 (default POST)
                "timeout_sec": 60        # 任意 (default 60)
              },
              "params": {...}            # 任意 (handler に渡される引数)
            }
        Returns:
            {"ok": bool, "task_id": "...", "task": {...}, "error": str | null}
        """
        if not OPENSEARCH_ENABLED:
            return {"ok": False, "error": "OpenSearch is not enabled"}

        err = _scheduler_validate_task(request)
        if err:
            return {"ok": False, "error": err}

        task_id = request.get("task_id") or str(uuid4())
        now_iso = _scheduler_now_iso()
        schedule = request.get("schedule", {})
        # 初回 next_run_at: type=interval なら now (即時発火可)、 type=once なら run_at
        if schedule.get("type") == "once":
            initial_next = schedule.get("run_at")
        else:
            initial_next = now_iso

        doc = {
            "task_type": request.get("task_type"),
            "owner": request.get("owner"),
            "user_id": request.get("user_id", "") or "",
            "enabled": bool(request.get("enabled", True)),
            "schedule": schedule,
            "handler": request.get("handler"),
            "params": request.get("params", {}) or {},
            "last_run_at": "",
            "last_run_status": "",
            "last_run_error": "",
            "next_run_at": initial_next,
            "created_at": now_iso,
            "updated_at": now_iso,
        }
        status_code, _ = _scheduler_index_task(task_id, doc, refresh="wait_for")
        if status_code in (200, 201):
            doc["task_id"] = task_id
            logger.info(f"[SCHEDULER] task created: id={task_id} type={doc['task_type']} owner={doc['owner']}")
            return {"ok": True, "task_id": task_id, "task": doc, "error": None}
        return {"ok": False, "error": f"OpenSearch index returned {status_code}"}


    @app.get("/core/scheduler/tasks/{task_id}")
    async def core_scheduler_get_task(task_id: str):
        """タスク 1 件を取得。"""
        if not OPENSEARCH_ENABLED:
            return {"ok": False, "error": "OpenSearch is not enabled"}
        task = _scheduler_get_task(task_id)
        if task is None:
            raise HTTPException(status_code=404, detail=f"task not found: {task_id}")
        # 内部フィールドは隠す
        task.pop("_seq_no", None)
        task.pop("_primary_term", None)
        task["task_id"] = task.pop("_id")
        return {"ok": True, "task": task, "error": None}


    @app.get("/core/scheduler/tasks")
    async def core_scheduler_list_tasks(owner: str = "", user_id: str = "",
                                       enabled: str = "", task_type: str = "",
                                       size: int = 100):
        """タスク一覧を取得。 owner/user_id/enabled/task_type で絞り込み可能。"""
        if not OPENSEARCH_ENABLED:
            return {"ok": False, "tasks": [], "error": "OpenSearch is not enabled"}

        filters = []
        if owner:
            filters.append({"term": {"owner.keyword": owner}})
        if user_id:
            filters.append({"term": {"user_id.keyword": user_id}})
        if task_type:
            filters.append({"term": {"task_type.keyword": task_type}})
        if enabled in ("true", "false"):
            filters.append({"term": {"enabled": enabled == "true"}})

        query = {"match_all": {}} if not filters else {"bool": {"filter": filters}}
        body = {
            "size": min(max(int(size), 1), 1000),
            "query": query,
            "sort": [{"created_at": {"order": "desc"}}],
        }
        try:
            resp = requests.post(
                f"{OPENSEARCH_URL}/{SCHEDULED_TASKS_INDEX}/_search",
                json=body, timeout=10,
            )
            if resp.status_code == 404:
                return {"ok": True, "tasks": [], "error": None}
            if resp.status_code != 200:
                return {"ok": False, "tasks": [], "error": f"OpenSearch returned {resp.status_code}"}
            hits = resp.json().get("hits", {}).get("hits", []) or []
            tasks = []
            for h in hits:
                src = h.get("_source", {}) or {}
                src["task_id"] = h.get("_id")
                tasks.append(src)
            return {"ok": True, "tasks": tasks, "total": len(tasks), "error": None}
        except Exception as e:
            logger.error(f"[SCHEDULER] list_tasks failed: {e}")
            return {"ok": False, "tasks": [], "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.put("/core/scheduler/tasks/{task_id}")
    async def core_scheduler_update_task(task_id: str, request: dict):
        """タスクを更新する。 部分更新可 (指定したフィールドのみ書き換え)。

        更新可能フィールド: enabled, schedule, handler, params, task_type, user_id
        Body 例: {"enabled": false} で一時停止、 {"schedule": {...}} で間隔変更
        """
        if not OPENSEARCH_ENABLED:
            return {"ok": False, "error": "OpenSearch is not enabled"}
        existing = _scheduler_get_task(task_id)
        if existing is None:
            raise HTTPException(status_code=404, detail=f"task not found: {task_id}")

        allowed_fields = ("enabled", "schedule", "handler", "params", "task_type", "user_id")
        doc = {}
        for f in allowed_fields:
            if f in request:
                doc[f] = request[f]
        if not doc:
            return {"ok": False, "error": "no updatable fields provided"}

        # schedule が変わったら next_run_at も再計算 (即時発火可にする)
        if "schedule" in doc:
            schedule = doc["schedule"]
            if isinstance(schedule, dict):
                if schedule.get("type") == "once":
                    doc["next_run_at"] = schedule.get("run_at") or _scheduler_now_iso()
                else:
                    doc["next_run_at"] = _scheduler_now_iso()
        doc["updated_at"] = _scheduler_now_iso()

        try:
            url = f"{OPENSEARCH_URL}/{SCHEDULED_TASKS_INDEX}/_update/{task_id}"
            resp = requests.post(url, json={"doc": doc},
                                 params={"refresh": "wait_for"}, timeout=10)
            if resp.status_code in (200, 201):
                logger.info(f"[SCHEDULER] task updated: id={task_id} fields={list(doc.keys())}")
                return {"ok": True, "task_id": task_id, "updated": list(doc.keys()), "error": None}
            return {"ok": False, "error": f"OpenSearch update returned {resp.status_code}: {resp.text[:200]}"}
        except Exception as e:
            logger.error(f"[SCHEDULER] update_task failed: {e}")
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.delete("/core/scheduler/tasks/{task_id}")
    async def core_scheduler_delete_task(task_id: str):
        """タスクを削除する。"""
        if not OPENSEARCH_ENABLED:
            return {"ok": False, "error": "OpenSearch is not enabled"}
        try:
            url = f"{OPENSEARCH_URL}/{SCHEDULED_TASKS_INDEX}/_doc/{task_id}"
            resp = requests.delete(url, params={"refresh": "wait_for"}, timeout=10)
            if resp.status_code in (200, 201):
                logger.info(f"[SCHEDULER] task deleted: id={task_id}")
                return {"ok": True, "task_id": task_id, "deleted": True, "error": None}
            if resp.status_code == 404:
                return {"ok": True, "task_id": task_id, "deleted": False, "error": None}
            return {"ok": False, "error": f"OpenSearch delete returned {resp.status_code}"}
        except Exception as e:
            logger.error(f"[SCHEDULER] delete_task failed: {e}")
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @app.post("/core/scheduler/tasks/{task_id}/run-now")
    async def core_scheduler_run_now(task_id: str):
        """指定タスクを即時実行する (デバッグ・手動再実行用)。
        next_run_at は更新せず、 last_run_* のみ書き戻す。
        """
        if not OPENSEARCH_ENABLED:
            return {"ok": False, "error": "OpenSearch is not enabled"}
        task = _scheduler_get_task(task_id)
        if task is None:
            raise HTTPException(status_code=404, detail=f"task not found: {task_id}")

        result = await _scheduler_call_handler(task)
        now_iso = _scheduler_now_iso()
        status = "success" if result.get("ok") else "failure"
        _scheduler_record_run(
            task_id, status,
            error=result.get("error", ""),
            completed_at=now_iso,
        )
        return {
            "ok": result.get("ok"),
            "task_id": task_id,
            "status": status,
            "summary": result.get("summary", ""),
            "error": result.get("error", "") or None,
        }


