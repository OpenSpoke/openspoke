        if not issuer or not token or not user_id:
            return {"ok": False, "error": "issuer/access_token/user_id required", "status_code": 0}
        admin_base = _kc_admin_base(issuer)
        if not admin_base:
            return {"ok": False, "error": "invalid issuer", "status_code": 0}

        try:
            r = requests.post(
                admin_base + "/users/" + user_id + "/logout",
