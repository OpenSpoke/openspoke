    @app.post("/core/claude/select-tools")
    async def core_claude_select_tools(request: dict):
        """ユーザー発話から必要な tool 名リストを返す (Haiku によるカテゴリ選別)。

        the assistant backend が /core/claude/stream-with-mcp を呼ぶ前に、 発話に応じて
        必要な tool だけを絞り込むための補助エンドポイント。 全 tool (60+) を
        毎回 Claude (Sonnet) に渡すと 30k input tokens/分のレート制限に当たるため、
        Haiku で粗く分類して 15-25 個に絞る。

        Body:
            {
              "user_message": "...",   # 必須。 ユーザー発話
              "max_tokens": 64         # 任意 (default 64、 selector は短い JSON しか返さない)
            }

        Returns:
            {
              "tool_names": ["upsert_knowledge", "list_recent_human_mails", ...],
              "categories": ["_always", "mail"],
              "input_tokens": N,
              "output_tokens": N
            }

        本エンドポイントは tools パラメータを使わないので、 Sonnet のレート制限
        (30k ITPM) には影響しない。 Haiku 側のレート制限は別カウンタ。
        """
        user_message = request.get("user_message")
        if not user_message or not isinstance(user_message, str):
            raise HTTPException(status_code=400, detail="user_message (string) is required")
        max_tokens = int(request.get("max_tokens", 64))

        category_names = [k for k in TOOL_CATEGORY_MAP.keys() if k != "_always"]

        # --- 未分類ツールの動的検出 -----------------------------------------
        # TOOL_CATEGORY_MAP はハードコードのため、 MCP に新ツールが追加されても
        # どのカテゴリにも属さず Claude に永遠に公開されない (死蔵) 問題があった。
        # ここで MCP 実ツール一覧を取得し、 マップに無いツールを _uncategorized
        # カテゴリとして動的に組み立て、 selector の判断対象に含める。
        # MCP 取得失敗時は従来挙動 (静的カテゴリのみ) にフォールバックする。
        categorized_tool_names = set()
        for _cat, _tns in TOOL_CATEGORY_MAP.items():
            categorized_tool_names.update(_tns)

        uncategorized_tools: list[str] = []
        try:
            if MCP_API_KEY and MCP_SERVER_URL:
                def _list_mcp_tool_names():
                    with SimpleMCPClient(MCP_SERVER_URL, MCP_API_KEY,
                                         timeout=MCP_CONNECT_TIMEOUT) as _mc:
                        return [t["name"] for t in _mc.list_tools()]
                _all_names = await asyncio.to_thread(_list_mcp_tool_names)
                uncategorized_tools = [
                    n for n in _all_names if n not in categorized_tool_names
                ]
        except Exception as e:
            logger.warning(
                f"[CLAUDE_SELECT_TOOLS] MCP list_tools failed, "
                f"uncategorized detection skipped: {type(e).__name__}: {e}"
            )
            uncategorized_tools = []

        selector_categories_desc = TOOL_SELECTOR_CATEGORIES_DESC
        if uncategorized_tools:
            selector_categories_desc = (
                TOOL_SELECTOR_CATEGORIES_DESC + "\n"
                "- other: 上記のどのカテゴリにも当てはまらない新規・特殊な操作。\n"
                f"  含まれるツール例: {', '.join(uncategorized_tools[:30])}"
            )

        selector_prompt = (
            "あなたはツールカテゴリ選択器です。 ユーザー発話に応答するために必要な\n"
            "カテゴリを下記の中から 0 個以上選び、 JSON 配列のみ出力してください。\n"
            "他のテキスト・前置き・コードブロックは禁止です。\n\n"
            "利用可能なカテゴリと該当する話題:\n"
            f"{selector_categories_desc}\n"
            f"出力例: [\"mail\"]  または  [\"github\", \"code_search\"]  または  []\n\n"
            f"発話: {user_message}\n\n"
            "JSON のみ:"
        )

        def _select_sync():
            client = get_anthropic_client()
            _select_kwargs = {
                "model": CLAUDE_TOOL_SELECTOR_MODEL,
                "max_tokens": max_tokens,
                "temperature": 0.0,
                "messages": [{"role": "user", "content": selector_prompt}],
            }
            # Opus 4.7 / 4.8 以降は temperature を受け付けないため除外する (future-proof)
            _claude_strip_unsupported_sampling(CLAUDE_TOOL_SELECTOR_MODEL, _select_kwargs)
            resp = client.messages.create(**_select_kwargs)
            text = ""
            for block in resp.content:
                if getattr(block, "type", None) == "text":
                    text += block.text
            usage = resp.usage
            in_tk = getattr(usage, "input_tokens", 0) or 0
            out_tk = getattr(usage, "output_tokens", 0) or 0
            return text.strip(), in_tk, out_tk

        try:
            raw_text, in_tk, out_tk = await asyncio.to_thread(_select_sync)
        except Exception as e:
            logger.error(f"[CLAUDE_SELECT_TOOLS] Haiku call failed: {type(e).__name__}: {e}")
            # fail-open: 失敗時は全カテゴリ採用 (= フィルタなし)、 _always のみ返してもよいが、
            # 通信失敗で会話自体が壊れるのを避けるため、 呼び出し側に判断を委ねる。
            # 空 categories を返せば呼び出し側で「allowlist なし」扱いにできる。
            raise HTTPException(status_code=502, detail=f"selector failed: {type(e).__name__}: {str(e)[:120]}")

        # JSON 配列のみ受け付ける。 前後に余計な文字があれば抽出。
        selected_categories = []
        try:
            # 最初の [ から最後の ] までを切り出し
            lb = raw_text.find("[")
            rb = raw_text.rfind("]")
            if lb >= 0 and rb > lb:
                parsed = json.loads(raw_text[lb:rb + 1])
                if isinstance(parsed, list):
                    selected_categories = [str(c) for c in parsed if isinstance(c, str)]
        except Exception as e:
            logger.warning(f"[CLAUDE_SELECT_TOOLS] JSON parse failed: {e}; raw={raw_text[:120]}")
            selected_categories = []

        # 不明カテゴリは無視。 ただし "other" は未分類ツール用の動的カテゴリとして許可。
        valid_categories = ["_always"] + [
            c for c in selected_categories
            if (c in TOOL_CATEGORY_MAP and c != "_always")
            or (c == "other" and uncategorized_tools)
        ]
        # 重複排除しつつ tool 名を集める (順序保持)
        seen = set()
        tool_names = []
        for cat in valid_categories:
            if cat == "other":
                cat_tools = uncategorized_tools
            else:
                cat_tools = TOOL_CATEGORY_MAP.get(cat, [])
            for tn in cat_tools:
                if tn not in seen:
                    seen.add(tn)
                    tool_names.append(tn)

        logger.info(
            f"[CLAUDE_SELECT_TOOLS] msg='{user_message[:40]}...' "
            f"raw='{raw_text[:60]}' categories={valid_categories} tools={len(tool_names)} "
            f"uncategorized_available={len(uncategorized_tools)} "
            f"in={in_tk} out={out_tk}"
        )

        # selector の使用量も記録 (op=tool_select で集計可能に)
        try:
            record_claude_usage("tool_select", in_tk, out_tk, CLAUDE_TOOL_SELECTOR_MODEL,
                                cache_w=0, cache_r=0, user_id="")
        except Exception as e:
            logger.warning(f"[CLAUDE_SELECT_TOOLS] usage record failed: {e}")

        return {
            "tool_names": tool_names,
            "categories": valid_categories,
            "input_tokens": in_tk,
            "output_tokens": out_tk,
        }


    @app.post("/core/embedding/single")
    async def core_embedding_single(request: dict):
        """get_embedding の HTTP ラッパー。単一テキストの embedding を返す。

        sentence-transformers (paraphrase-multilingual-MiniLM-L12-v2) を kernel に集約。
        ステートレス: 同じ text に対して同じ embedding を返す決定的処理。

        Body:
            {"text": "..."}
        Returns:
            {"embedding": [float, ...]}  # 384次元
        """
        text = request.get("text")
        if text is None:
            raise HTTPException(status_code=400, detail="text is required")
        if not isinstance(text, str):
            raise HTTPException(status_code=400, detail="text must be a string")
        embedding = get_embedding(text)
        return {"embedding": embedding}


    @app.post("/core/embedding/batch")
    async def core_embedding_batch(request: dict):
        """get_embeddings_parallel の HTTP ラッパー。複数テキストの embedding をバッチで返す。

        kernel 側で sentence-transformers のバッチ推論を実行する。
        GPU が kernel Pod 側にあればここで使われる。

        Body:
            {"texts": ["...", ...], "max_workers": int (optional)}
        Returns:
            {"embeddings": [[float, ...], ...]}
        """
        texts = request.get("texts")
        if texts is None:
            raise HTTPException(status_code=400, detail="texts is required")
        if not isinstance(texts, list):
            raise HTTPException(status_code=400, detail="texts must be a list")
        if not all(isinstance(t, str) for t in texts):
            raise HTTPException(status_code=400, detail="all texts must be strings")
        # 空リストは空リストを返す (元関数の挙動と一致)
        if not texts:
            return {"embeddings": []}

        max_workers = request.get("max_workers")
        if max_workers is not None:
            embeddings = get_embeddings_parallel(texts, max_workers=int(max_workers))
        else:
            embeddings = get_embeddings_parallel(texts)
        return {"embeddings": embeddings}


    # ----------------------------------------------------------------------
    # 外部サービス中継: Slack
    # ----------------------------------------------------------------------
    # 認証情報 (Bot Token, Webhook URL) は呼び出し側 (アプリケーション backend) が保持し、
    # 各リクエストごとに渡す。kernel は汎用的なトランスポート役のみを担う。
    # これにより別アプリ Pod が異なる Slack ワークスペースに通知することも可能。

    @app.post("/core/slack/send-dm")
    async def core_slack_send_dm(request: dict):
        """Slack Bot Token を使って指定ユーザーに DM を送る。

        Body:
            {
              "bot_token": "xoxb-...",        # 必須
              "slack_user_id": "U...",        # 必須 (Slack User ID)
              "text": "..."                   # 必須 (本文)
            }
        Returns:
            {"ok": bool, "error": str | null, "status_code": int}
        失敗時も例外は投げず ok=false と error を返す (元関数の挙動と同じ)。
        """
        bot_token = request.get("bot_token") or ""
        slack_user_id = request.get("slack_user_id") or ""
        text = request.get("text") or ""
        if not bot_token:
            return {"ok": False, "error": "bot_token is required", "status_code": 0}
        if not slack_user_id:
            return {"ok": False, "error": "slack_user_id is required", "status_code": 0}
        if not text:
            return {"ok": False, "error": "text is required", "status_code": 0}

        try:
            r = requests.post(
                "https://slack.com/api/chat.postMessage",
                headers={
                    "Authorization": "Bearer " + bot_token,
                    "Content-Type": "application/json; charset=utf-8",
                },
                json={"channel": slack_user_id, "text": text},
                timeout=10,
            )
            status_code = r.status_code
            if status_code != 200:
                logger.warning(f"[SLACK_DM] HTTP failed: status={status_code} body={r.text[:200]}")
                return {"ok": False, "error": f"HTTP {status_code}: {r.text[:200]}", "status_code": status_code}
            body = r.json()
            if not body.get("ok"):
                err = str(body.get("error", ""))
                logger.warning(f"[SLACK_DM] API failed: {err}")
                return {"ok": False, "error": err, "status_code": status_code}
            logger.info(f"[SLACK_DM] Sent to {slack_user_id}")
            return {"ok": True, "error": None, "status_code": status_code}
        except Exception as e:
            logger.warning(f"[SLACK_DM] Exception: {type(e).__name__}: {e}")
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}", "status_code": 0}


    @app.post("/core/slack/post-webhook")
    async def core_slack_post_webhook(request: dict):
        """Slack Incoming Webhook URL に整形済みペイロードを POST する。

        メッセージ整形は呼び出し側 (アプリケーション backend) で行い、kernel は素のトランスポートのみ。

        Body:
            {
              "webhook_url": "https://hooks.slack.com/...",   # 必須
              "payload": {...}                                # 必須 (Slack の incoming-webhook 仕様の dict)
            }
        Returns:
            {"ok": bool, "error": str | null, "status_code": int}
