                neo4j_status = "connected"
            except:
                neo4j_status = "error"

        # OpenSearch(全文検索)の状態チェック: クラスタ疎通 + rag_chunks の件数
        opensearch_status = "disabled"
        opensearch_count = 0
        if OPENSEARCH_ENABLED:
            try:
                # クラスタ疎通
                health_resp = requests.get(f"{OPENSEARCH_URL}/_cluster/health", timeout=3)
                if health_resp.status_code == 200:
                    opensearch_status = "connected"
                    # rag_chunks index の件数(なければ 0)
                    try:
                        count_resp = requests.get(f"{OPENSEARCH_URL}/{OPENSEARCH_INDEX}/_count", timeout=3)
                        if count_resp.status_code == 200:
                            opensearch_count = count_resp.json().get("count", 0)
                    except Exception:
                        pass
                else:
                    opensearch_status = "error"
            except Exception:
                opensearch_status = "error"

        return {
            "status": "healthy",
            "organization": ORGANIZATION_ID,
            "embedding_model": EMBEDDING_MODEL,
            "llm_model": LLM_MODEL,
            "neo4j": neo4j_status,
            "minio": "connected" if minio_client else "disabled",
            "opensearch": {
                "status": opensearch_status,
                "url": OPENSEARCH_URL,
                "index": OPENSEARCH_INDEX,
                "count": opensearch_count,
            },
            "file_support": {
                "docx": Document is not None,
                "xlsx": load_workbook is not None,
                "pptx": Presentation is not None,
                "pdf": PYPDF_AVAILABLE
            },
            "claude_usage": _claude_usage,
        }


    # スケジュール変更/削除の意図検出キーワード
    def detect_schedule_intent(text: str) -> Optional[str]:
        """テキストにスケジュール変更/削除の意図があるか検出"""
        logger.info(f"[SCHEDULE_DETECT] Checking text: '{text[:60]}'")
        change_kw = ['変更になりました', '変更されました', '変わりました', 'に変更', 'に変わった', '延期', '前倒し', 'に移動', 'にずれ', 'に繰り上げ', 'に繰り下げ']
        cancel_kw = ['キャンセル', '中止', '取り消し', 'なくなりました', '取りやめ', 'やめました', 'やめになりました', 'はなくなりました']
        for kw in change_kw:
            if kw in text:
                logger.info(f"[SCHEDULE_DETECT] Keyword hit: '{kw}'")
                return "update"
        for kw in cancel_kw:
            if kw in text:
                logger.info(f"[SCHEDULE_DETECT] Cancel keyword hit: '{kw}'")
                return "delete"

        # 時間表現が2つ以上 + 「になりました」→ スケジュール変更と判断
        tp = re.compile(r'今日|昨日|一昨日|明日|明後日|先々?週|今週|来週|先々?月|今月|来月|去年|昨年|今年|来年|\d+日前|\d+週間前|\d+[ヶか]月前|\d+年前|\d{1,2}月\d{1,2}日|月曜|火曜|水曜|木曜|金曜|土曜|日曜')
        time_matches = tp.findall(text)
        has_narimashita = 'になりました' in text
        logger.info(f"[SCHEDULE_DETECT] time_matches={time_matches} になりました={has_narimashita}")
        if len(time_matches) >= 2 and has_narimashita:
            logger.info(f"[SCHEDULE_DETECT] Detected via dual-time pattern: {time_matches}")
            return "update"

        logger.info("[SCHEDULE_DETECT] No intent detected")
        return None


    def parse_schedule_change_with_vllm(text: str) -> Optional[Dict[str, str]]:
        """vLLM(Swallow)でスケジュール変更/削除の意図を構造化データに変換"""
        intent = detect_schedule_intent(text)
        if not intent:
            return None

        if intent == "update":
            messages = [
                {"role": "system", "content": "あなたはJSON抽出エンジンです。JSONのみを出力してください。"},
                {"role": "user", "content": f'以下のテキストからスケジュール変更を抽出してください。\n\nテキスト: {text}\n\nJSON形式:\n{{"intent": "update", "keyword": "予定名(例: ピアノの発表会)", "old_date_hint": "元の日時表現(そのまま)", "new_text": "変更後の事実を1文で書く。「変更」「になりました」は使わず、新しい予定として書く(例: たお君は来週の月曜日にピアノの発表会があります)", "new_date_hint": "新しい日時表現(そのまま)"}}'}
            ]
        else:
            messages = [
                {"role": "system", "content": "あなたはJSON抽出エンジンです。JSONのみを出力してください。"},
                {"role": "user", "content": f'以下のテキストからキャンセル/削除の情報を抽出してください。\n\nテキスト: {text}\n\nJSON形式:\n{{"intent": "delete", "keyword": "削除対象の予定名", "date_hint": "日時表現(あれば)"}}'}
            ]

        try:
            response = requests.post(f"{VLLM_URL}/v1/chat/completions", json={"model": LLM_MODEL, "messages": messages, "temperature": 0.1, "max_tokens": 300}, timeout=LLM_TIMEOUT)
            result_text = response.json()["choices"][0]["message"]["content"]
            json_match = re.search(r'\{[\s\S]*?\}', result_text)
            if json_match:
                parsed = json.loads(json_match.group())
                logger.info(f"[SCHEDULE_PARSE] vLLM parsed: {json.dumps(parsed, ensure_ascii=False)}")
                return parsed
            else:
                logger.warning(f"[SCHEDULE_PARSE] No JSON in vLLM response: {result_text[:100]}")
        except Exception as e:
            logger.error(f"[SCHEDULE_PARSE] vLLM parse failed: {e}")

        logger.info("[SCHEDULE_PARSE] Falling back to rule-based parser")
        return parse_schedule_change_rule(text)


    def parse_schedule_change_rule(text: str) -> Optional[Dict[str, str]]:
        """ルールベースでスケジュール変更/削除の意図を構造化データに変換"""
        intent = detect_schedule_intent(text)
        if not intent:
            return None

        tp = re.compile(r'先々?週の[月火水木金土日]曜日?|今週の[月火水木金土日]曜日?|来週の[月火水木金土日]曜日?|先々?週|今週|来週|一昨日|昨日|今日|明後日|明日|先々?月|今月|来月|去年|昨年|今年|来年|\d+日前|\d+週間前|\d+[ヶか]月前|\d+年前|\d{1,2}月\d{1,2}日|[月火水木金土日]曜日?')

        if intent == "update":
            # 時間表現を位置付きで取得
            matches = list(tp.finditer(text))
            if len(matches) < 2:
                logger.warning(f"[SCHEDULE_PARSE] Not enough time expressions: {[m.group() for m in matches]}")
                return None

            # 最初の時間表現が旧日時、最後の時間表現が新日時
            old_time = matches[0].group()
            new_time = matches[-1].group()

            # 「は」「、」で分割してイベント名を抽出
            # パターン: [主語]の[旧日時]の[イベント]は、[新日時]になりました
            split_pattern = re.compile(r'は[、,]|は$')
            parts = split_pattern.split(text, maxsplit=1)

            if len(parts) >= 1:
                before_ha = parts[0]
                # 旧日時より後ろの部分がイベント名
                old_time_end = matches[0].end()
                event_part = before_ha[old_time_end:]
                # 助詞を除去してキーワードに
                keyword = re.sub(r'^[のはがを、]+|[のはがを、]+$', '', event_part).strip()
            else:
                keyword = ""

            if not keyword:
                # フォールバック: 時間表現と変更キーワードを除去してキーワード抽出
                temp = text
                for m in matches:
                    temp = temp.replace(m.group(), ' ')
                temp = re.sub(r'になりました|変更になりました|変更されました|変わりました|に変更|は[、,]?|の', ' ', temp)
                keyword = ' '.join([w for w in temp.split() if len(w) >= 2])[:30]

            # new_textを構成
            # before_haから主語を取得
            subject_match = re.match(r'(.+?)の' + re.escape(old_time), before_ha)
            subject = subject_match.group(1) if subject_match else ""
            new_text = f"{subject}は{new_time}に{keyword}があります" if subject else f"{new_time}に{keyword}があります"

            result = {
                "intent": "update",
                "keyword": keyword,
                "old_date_hint": old_time,
                "new_text": new_text,
                "new_date_hint": new_time,
            }
            logger.info(f"[SCHEDULE_PARSE] Rule-based parsed: {json.dumps(result, ensure_ascii=False)}")
            return result

        elif intent == "delete":
            matches = list(tp.finditer(text))
            date_hint = matches[0].group() if matches else ""
            # キーワード抽出: 時間表現とキャンセル関連語を除去
            temp = text
            for m in matches:
                temp = temp.replace(m.group(), ' ')
            temp = re.sub(r'キャンセル|中止|取り消し|なくなりました|取りやめ|やめました|は[、,]?|の|が|を', ' ', temp)
            keyword = ' '.join([w for w in temp.split() if len(w) >= 2])[:30]

            result = {
                "intent": "delete",
                "keyword": keyword,
                "date_hint": date_hint,
            }
            logger.info(f"[SCHEDULE_PARSE] Rule-based parsed: {json.dumps(result, ensure_ascii=False)}")
            return result

        return None


    @app.post("/index")
    async def index_documents(request: IndexRequest, background_tasks: BackgroundTasks):
        """テキスト直接インデックス化（スケジュール変更/削除の自動検出付き）"""
        try:
            start_time = time.time()

            # ── スケジュール変更/削除の自動検出 ──
            if len(request.texts) == 1:
                text = request.texts[0]
                intent = detect_schedule_intent(text)
                if intent:
                    logger.info(f"[INDEX] Schedule intent detected: {intent}")
                    parsed = parse_schedule_change_with_vllm(text)

                    if parsed and parsed.get("intent") == "update":
                        keyword = parsed.get("keyword", "")
                        old_date_hint = parsed.get("old_date_hint", "")
                        new_text = parsed.get("new_text", "")
                        new_date_hint = parsed.get("new_date_hint", "")

                        old_date = resolve_temporal_expression(old_date_hint) if old_date_hint else ""
                        new_date = resolve_temporal_expression(new_date_hint) if new_date_hint else ""
                        if not new_date and new_text:
                            new_date = resolve_temporal_expression(new_text)

                        logger.info(f"[SCHEDULE_DETECT] Update: keyword='{keyword}' old_date={old_date} new_text='{new_text}' new_date={new_date}")

                        if keyword and new_text:
                            result = await schedule_update({
                                "keyword": keyword,
                                "user_id": request.user_id,
                                "old_date": old_date,
                                "new_text": new_text,
                                "new_date": new_date,
                            }, background_tasks)
                            elapsed = time.time() - start_time
                            return {
                                "status": "schedule_updated",
                                "schedule_action": result,
                                "processing_time_sec": round(elapsed, 2),
                            }

                    elif parsed and parsed.get("intent") == "delete":
                        keyword = parsed.get("keyword", "")
                        date_hint = parsed.get("date_hint", "")
                        date = resolve_temporal_expression(date_hint) if date_hint else ""

                        logger.info(f"[SCHEDULE_DETECT] Delete: keyword='{keyword}' date={date}")

                        if keyword:
                            result = await schedule_delete({
                                "keyword": keyword,
                                "user_id": request.user_id,
                                "date": date,
                            })
                            elapsed = time.time() - start_time
                            return {
                                "status": "schedule_deleted",
                                "schedule_action": result,
                                "processing_time_sec": round(elapsed, 2),
                            }

                    logger.info(f"[SCHEDULE_DETECT] Parse incomplete, falling back to normal indexing")

            logger.info(f"[INDEX] Indexing {len(request.texts)} texts for user: {request.user_id}")
            
            # 1. Embedding生成とMilvus保存（高速処理のみ）
            collection = create_or_get_collection(request.user_id)
            embeddings = get_embeddings_parallel(request.texts)
            
            entities = [request.texts, embeddings]
            collection.insert(entities)
            
            # flush/loadはバックグラウンドで実行
            collection_name = get_collection_name(request.user_id)
            background_tasks.add_task(flush_and_load_collection, collection_name)
            logger.info(f"[INDEX] Milvus flush/load scheduled in background")
            
            # OpenSearchにもインデックス
            tenant = get_tenant_label(request.user_id)
            doc_id = f"text_{int(time.time())}"
            if request.event_date:
                # 明示的に指定された日付を全テキストに適用
                opensearch_index_chunks(request.texts, request.user_id, tenant, doc_id, event_date=request.event_date)
            else:
                # テキストごとに時間表現を自動解決して個別にインデックス
                for i, text in enumerate(request.texts):
                    resolved = resolve_temporal_expression(text)
                    if resolved:
                        logger.info(f"[INDEX] Auto-resolved event_date for text {i+1}: {resolved}")
                    opensearch_index_chunks([text], request.user_id, tenant, f"{doc_id}_{i}", event_date=resolved)
            
            elapsed = time.time() - start_time
            
            # 2. エンティティ抽出をバックグラウンドで実行（オプション）
            if neo4j_driver and request.extract_entities:
                doc_id = f"text_{int(time.time())}"
                background_tasks.add_task(
                    process_entities_background,
                    request.texts,
                    request.user_id,
                    doc_id
                )
                logger.info(f"[INDEX] Entity extraction scheduled in background for doc: {doc_id}")
            elif not request.extract_entities:
                logger.info(f"[INDEX] Entity extraction skipped (extract_entities=False)")
            
            return {
                "status": "success",
                "indexed": len(request.texts),
                "total_entities": collection.num_entities,
                "graph_entities": 0,
                "processing_time_sec": round(elapsed, 2)
            }
        except Exception as e:
            logger.error(f"[INDEX] Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))


