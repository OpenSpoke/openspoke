            {"ok": bool, "roles": [{"id": "...", "name": "..."}], "error": str | null, "status_code": int}
        """
        issuer = request.get("issuer") or ""
        token = request.get("access_token") or ""
        user_id = (request.get("user_id") or "").strip()
        if not issuer or not token or not user_id:
            return {"ok": False, "roles": [], "error": "issuer/access_token/user_id required", "status_code": 0}
        admin_base = _kc_admin_base(issuer)
        if not admin_base:
            return {"ok": False, "roles": [], "error": "invalid issuer", "status_code": 0}
        try:
            r = requests.get(
                admin_base + "/users/" + user_id + "/role-mappings/realm",
                headers={"Authorization": "Bearer " + token},
                timeout=KEYCLOAK_HTTP_TIMEOUT,
            )
            if r.status_code != 200:
                logger.warning(f"[KC_ROLES_GET] HTTP failed: status={r.status_code} body={r.text[:200]}")
                return {"ok": False, "roles": [],
                        "error": f"HTTP {r.status_code}: {r.text[:200]}",
                        "status_code": r.status_code}
            raw = r.json() or []
            roles = [{"id": str(x.get("id") or ""), "name": str(x.get("name") or "")}
                     for x in raw if isinstance(x, dict)]
            return {"ok": True, "roles": roles, "error": None, "status_code": r.status_code}
        except Exception as e:
            logger.warning(f"[KC_ROLES_GET] Exception: {type(e).__name__}: {e}")
            return {"ok": False, "roles": [],
                    "error": f"{type(e).__name__}: {str(e)[:200]}", "status_code": 0}


    @app.post("/core/keycloak/users/realm-role-set")
    async def core_keycloak_users_realm_role_set(request: dict):
        """Keycloak ユーザーに realm role を 1 つ付与 / 剥奪する。

        Admin API:
            GET    /admin/realms/{realm}/users/{user_id}/role-mappings/realm           (現在の割当)
            GET    /admin/realms/{realm}/users/{user_id}/role-mappings/realm/available (付与可能な realm role 一覧)
            POST   /admin/realms/{realm}/users/{user_id}/role-mappings/realm           (付与)
            DELETE /admin/realms/{realm}/users/{user_id}/role-mappings/realm           (剥奪)

        設計上のポイント (req_20260608):
            グローバルな GET /admin/realms/{realm}/roles/{role_name} は admin client に
            view-realm 権限を要求するが、 ここでは敢えて使わない。 代わりに
            user 個別の role-mappings endpoint (manage-users で読み書き可能) だけで
            role rep の id を解決する。 これにより、 admin client に manage-users が
            付いていれば追加の権限設定なしに動く。

        Body:
            {"issuer": "...", "access_token": "...",
             "user_id": "...", "role_name": "...", "enabled": bool}
        Returns:
            {"ok": bool, "error": str | null, "status_code": int}
        """
        issuer = request.get("issuer") or ""
        token = request.get("access_token") or ""
        user_id = (request.get("user_id") or "").strip()
        role_name = (request.get("role_name") or "").strip()
        enabled = bool(request.get("enabled", False))
        if not issuer or not token or not user_id or not role_name:
            return {"ok": False, "error": "issuer/access_token/user_id/role_name required", "status_code": 0}
        admin_base = _kc_admin_base(issuer)
        if not admin_base:
            return {"ok": False, "error": "invalid issuer", "status_code": 0}
        auth_headers = {"Authorization": "Bearer " + token}
        json_headers = {"Authorization": "Bearer " + token, "Content-Type": "application/json"}

        # 1. role rep (id + name) を解決する。
        #    enabled=True (付与) → /role-mappings/realm/available から探す (まだ持っていない role 一覧)。
        #      ただし「既に持っている」 場合は available に出てこないので、 current にもフォールバック検索。
        #    enabled=False (剥奪) → /role-mappings/realm から探す (現在持っている role 一覧)。
        #      持っていない role を剥奪要求された場合は no-op で成功扱い。
        role_rep = None
        try:
            if enabled:
                r_avail = requests.get(
                    admin_base + "/users/" + user_id + "/role-mappings/realm/available",
                    headers=auth_headers,
                    timeout=KEYCLOAK_HTTP_TIMEOUT,
                )
                if r_avail.status_code != 200:
                    logger.warning(f"[KC_ROLE_SET] available lookup HTTP failed: status={r_avail.status_code} body={r_avail.text[:200]}")
                    return {"ok": False,
                            "error": f"available lookup HTTP {r_avail.status_code}: {r_avail.text[:200]}",
                            "status_code": r_avail.status_code}
                for _r in (r_avail.json() or []):
                    if isinstance(_r, dict) and str(_r.get("name") or "") == role_name:
                        role_rep = {"id": str(_r.get("id") or ""), "name": role_name}
                        break
                if role_rep is None:
                    # 既に持っている可能性をチェック (current にあるなら no-op 成功)
                    r_cur = requests.get(
                        admin_base + "/users/" + user_id + "/role-mappings/realm",
                        headers=auth_headers,
                        timeout=KEYCLOAK_HTTP_TIMEOUT,
                    )
                    if r_cur.status_code == 200:
                        for _r in (r_cur.json() or []):
                            if isinstance(_r, dict) and str(_r.get("name") or "") == role_name:
                                logger.info(f"[KC_ROLE_SET] already has role: user_id={user_id} role={role_name} (no-op)")
                                return {"ok": True, "error": None, "status_code": 204}
                    return {"ok": False,
                            "error": f"role '{role_name}' not found in realm (available + current で見つからない)",
                            "status_code": 404}
            else:
                r_cur = requests.get(
                    admin_base + "/users/" + user_id + "/role-mappings/realm",
                    headers=auth_headers,
                    timeout=KEYCLOAK_HTTP_TIMEOUT,
                )
                if r_cur.status_code != 200:
                    logger.warning(f"[KC_ROLE_SET] current lookup HTTP failed: status={r_cur.status_code} body={r_cur.text[:200]}")
                    return {"ok": False,
                            "error": f"current lookup HTTP {r_cur.status_code}: {r_cur.text[:200]}",
                            "status_code": r_cur.status_code}
                for _r in (r_cur.json() or []):
                    if isinstance(_r, dict) and str(_r.get("name") or "") == role_name:
                        role_rep = {"id": str(_r.get("id") or ""), "name": role_name}
                        break
                if role_rep is None:
                    # そもそも持っていないので剥奪要求は no-op 成功扱い
                    logger.info(f"[KC_ROLE_SET] role not currently assigned (no-op delete): user_id={user_id} role={role_name}")
                    return {"ok": True, "error": None, "status_code": 204}
            if not role_rep.get("id"):
                return {"ok": False, "error": "role rep has no id", "status_code": 0}
        except Exception as e:
            logger.warning(f"[KC_ROLE_SET] role lookup exception: {type(e).__name__}: {e}")
            return {"ok": False,
                    "error": f"role lookup {type(e).__name__}: {str(e)[:200]}", "status_code": 0}

        # 2. POST (付与) or DELETE (剥奪)
        url = admin_base + "/users/" + user_id + "/role-mappings/realm"
        body = [role_rep]
        try:
            if enabled:
                r = requests.post(url, headers=json_headers, json=body, timeout=KEYCLOAK_HTTP_TIMEOUT)
            else:
                r = requests.delete(url, headers=json_headers, json=body, timeout=KEYCLOAK_HTTP_TIMEOUT)
            if r.status_code not in (204, 200):
                logger.warning(f"[KC_ROLE_SET] apply HTTP failed: user={user_id} role={role_name} enabled={enabled} status={r.status_code} body={r.text[:200]}")
                return {"ok": False,
                        "error": f"HTTP {r.status_code}: {r.text[:200]}",
                        "status_code": r.status_code}
            logger.info(f"[KC_ROLE_SET] user_id={user_id} role={role_name} enabled={enabled}")
            return {"ok": True, "error": None, "status_code": r.status_code}
        except Exception as e:
            logger.warning(f"[KC_ROLE_SET] apply exception: {type(e).__name__}: {e}")
            return {"ok": False,
                    "error": f"{type(e).__name__}: {str(e)[:200]}", "status_code": 0}


    # ----------------------------------------------------------------------
    # 外部サービス中継: Mattermost
    # ----------------------------------------------------------------------
    # Slack 同様、 認証情報 (Bot Token, Bot User ID) は呼び出し側が保持し、
    # 各リクエストごとに渡す。 base_url も明示で渡してもらう (self-hosted で
    # 複数サーバー存在しうるため)。

    @app.post("/core/mattermost/send-dm")
    async def core_mattermost_send_dm(request: dict):
        """Mattermost Bot Token を使って指定ユーザーに DM を送る。

        Mattermost の DM 送信は 2 段階:
            1. POST /api/v4/channels/direct で bot と相手の DM チャンネルを開く
               (既存ならそのまま channel_id を返す。 冪等)
            2. POST /api/v4/posts で channel_id に message を投稿

        Body:
            {
              "base_url": "https://chat.example.com",   # 必須 (末尾スラッシュ無し)
              "bot_token": "...",                           # 必須 (Bot Personal Access Token)
              "bot_user_id": "...",                         # 必須 (26 文字の bot user id)
              "recipient_user_id": "...",                   # 必須 (26 文字の人間 user id)
              "text": "..."                                  # 必須 (本文)
            }
        Returns:
            {"ok": bool, "error": str | null, "status_code": int, "post_id": str | null}
        失敗時も例外は投げず ok=false と error を返す (Slack 同様の挙動)。
        """
        base_url = (request.get("base_url") or "").rstrip("/")
        bot_token = request.get("bot_token") or ""
        bot_user_id = request.get("bot_user_id") or ""
        recipient_user_id = request.get("recipient_user_id") or ""
        text = request.get("text") or ""
        if not base_url:
            return {"ok": False, "error": "base_url is required", "status_code": 0, "post_id": None}
        if not bot_token:
            return {"ok": False, "error": "bot_token is required", "status_code": 0, "post_id": None}
        if not bot_user_id:
            return {"ok": False, "error": "bot_user_id is required", "status_code": 0, "post_id": None}
        if not recipient_user_id:
            return {"ok": False, "error": "recipient_user_id is required", "status_code": 0, "post_id": None}
        if not text:
            return {"ok": False, "error": "text is required", "status_code": 0, "post_id": None}

        headers = {
            "Authorization": "Bearer " + bot_token,
            "Content-Type": "application/json",
        }

        try:
            # 1. DM チャンネルを開く (両者の user_id を JSON 配列で POST)
            r1 = requests.post(
                f"{base_url}/api/v4/channels/direct",
                headers=headers,
                json=[bot_user_id, recipient_user_id],
                timeout=10,
            )
            if r1.status_code != 201 and r1.status_code != 200:
                logger.warning(f"[MATTERMOST_DM] open channel failed: status={r1.status_code} body={r1.text[:200]}")
                return {"ok": False, "error": f"open channel HTTP {r1.status_code}: {r1.text[:200]}", "status_code": r1.status_code, "post_id": None}
            ch = r1.json()
            channel_id = ch.get("id")
            if not channel_id:
                return {"ok": False, "error": "channel id missing in response", "status_code": r1.status_code, "post_id": None}

            # 2. その channel に投稿
            r2 = requests.post(
                f"{base_url}/api/v4/posts",
                headers=headers,
                json={"channel_id": channel_id, "message": text},
                timeout=10,
            )
            if r2.status_code != 201 and r2.status_code != 200:
                logger.warning(f"[MATTERMOST_DM] post failed: status={r2.status_code} body={r2.text[:200]}")
                return {"ok": False, "error": f"post HTTP {r2.status_code}: {r2.text[:200]}", "status_code": r2.status_code, "post_id": None}
            post = r2.json()
            post_id = post.get("id")
            logger.info(f"[MATTERMOST_DM] Sent to {recipient_user_id} (post_id={post_id})")
            return {"ok": True, "error": None, "status_code": r2.status_code, "post_id": post_id}
        except Exception as e:
            logger.warning(f"[MATTERMOST_DM] Exception: {type(e).__name__}: {e}")
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}", "status_code": 0, "post_id": None}


    # ----------------------------------------------------------------------
    # PDF 変換 (Office ファイル等を PDF に変換するサービス)
    # ----------------------------------------------------------------------
    # 「PDF が欲しい」という抽象機能を kernel が提供する。実装 (現在は pdf-converter Pod
    # への HTTP) は kernel に隠蔽し、呼び出し元アプリは URL も実装方式も知る必要がない。

    PDF_CONVERTER_URL = os.environ.get(
        "PDF_CONVERTER_URL",
        "http://pdf-converter.pdf-converter.svc.cluster.local:8000",
    )

    @app.post("/core/pdf/convert")
    async def core_pdf_convert(request: dict):
        """Office/DOCX 等のファイルを PDF に変換する。

        実装は pdf-converter Pod への multipart/form-data 転送。
        呼び出し元アプリはこの実装詳細を知る必要がない (kernel の抽象機能)。

        Body:
            {
              "filename": "input.docx",                           # 必須
              "content_base64": "JVBERi0...",                     # 必須 (元ファイルを base64 化したもの)
              "mime_type": "application/...",                     # 任意 (省略時は application/octet-stream)
              "timeout": 120                                      # 任意 (秒、省略時 180)
            }
        Returns:
            {
              "ok": bool,
              "pdf_base64": str | null,
              "error": str | null,
              "status_code": int
            }
        失敗時も例外は投げない (ok=false で返す、呼び出し側で扱いやすい)。
        """
        filename = request.get("filename") or ""
        content_b64 = request.get("content_base64") or ""
        mime_type = request.get("mime_type") or "application/octet-stream"
        timeout = float(request.get("timeout", 180))

        if not filename:
            return {"ok": False, "pdf_base64": None, "error": "filename is required", "status_code": 0}
        if not content_b64:
            return {"ok": False, "pdf_base64": None, "error": "content_base64 is required", "status_code": 0}

        try:
            content = base64.b64decode(content_b64)
        except Exception as e:
            return {"ok": False, "pdf_base64": None, "error": f"base64 decode failed: {e}", "status_code": 0}

        try:
            files = {"file": (filename, content, mime_type)}
            r = requests.post(f"{PDF_CONVERTER_URL}/convert", files=files, timeout=timeout)
            status_code = r.status_code
            if status_code != 200:
                detail = ""
                try:
                    detail = r.json().get("detail", "")
                except Exception:
                    detail = r.text[:300]
                logger.error(f"[PDF_CONVERT] failed: status={status_code} filename={filename} detail={detail}")
                return {"ok": False, "pdf_base64": None, "error": f"HTTP {status_code}: {detail[:300]}", "status_code": status_code}

            pdf_bytes = r.content
            logger.info(f"[PDF_CONVERT] OK: {filename} {len(content)} bytes -> {len(pdf_bytes)} bytes")
            return {
                "ok": True,
                "pdf_base64": base64.b64encode(pdf_bytes).decode("ascii"),
                "error": None,
                "status_code": status_code,
            }
        except requests.exceptions.RequestException as e:
            logger.error(f"[PDF_CONVERT] network error: {e}")
            return {"ok": False, "pdf_base64": None, "error": f"network error: {str(e)[:200]}", "status_code": 0}
        except Exception as e:
            logger.error(f"[PDF_CONVERT] unexpected error: {e}", exc_info=True)
            return {"ok": False, "pdf_base64": None, "error": f"{type(e).__name__}: {str(e)[:200]}", "status_code": 0}


