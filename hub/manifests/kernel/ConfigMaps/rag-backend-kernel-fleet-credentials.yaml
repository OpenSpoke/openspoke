apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-backend-kernel-fleet-credentials
  namespace: rag-company1
data:
  fleet_credentials.py: |
    """
    fleet_credentials.py
    ====================================================================
    Fleet が Git を引くときに使う Secret を、kernel の保管庫
    (git_credentials index) の鍵に合わせる。

    なぜ要るか
    --------------------------------------------------------------------
    Fleet は GitRepo の clientSecretName で Kubernetes Secret を指す
    仕様なので、保管庫を直に読ませることができない。そのため鍵を
    入れ替えるたびに保管庫と Secret の両方を直す運用になっていて、
    Secret 側が取り残されて GitOps が全停止する事故が起きている
    (topic fleet_git_credentials_rotation_20260915 /
     fleet_local_secret_stale_pat_incident_20260918 /
     fleet_github_pat_expired_all_gitrepos_20261020)。

    ここでやること
    --------------------------------------------------------------------
    保管庫の鍵を読み、fleetCluster の Secret の password だけを
    書き換える。username は触らない。値が同じなら何もしない。

    鍵の扱い
    --------------------------------------------------------------------
    - 鍵は kernel のプロセスの中だけを通る。
    - kubectl の引数には乗せない (--patch-file で渡す)。
      /core/kubectl/execute は引数を kubectl_audit に残すので、
      あの口は使わない。
    - 応答にも、ログにも鍵は出さない。出すのは入れ替えたかどうかと
      鍵の長さだけ。
    - kubeconfig と patch は tempfile に書き、必ず消す。

    エンドポイント
    --------------------------------------------------------------------
    POST /core/fleet_credentials/sync     … 同期する
    GET  /core/fleet_credentials/status   … 保管庫と Secret が
                                            合っているかだけ見る

    CronJob からは sync を叩くだけでよい。
    """
    from __future__ import annotations

    import base64
    import hashlib
    import json
    import logging
    import os
    import subprocess
    import tempfile
    from datetime import datetime, timezone
    from typing import Any, Dict, List, Optional

    import requests
    from fastapi import APIRouter, HTTPException
    from fastapi.concurrency import run_in_threadpool

    logger = logging.getLogger("fleet_credentials")
    router = APIRouter()

    _OPENSEARCH_URL = os.environ.get(
        "OPENSEARCH_URL", "http://opensearch.opensearch.svc.cluster.local:9200"
    ).rstrip("/")

    _KUBECONFIG_INDEX = "kubeconfigs"

    #  Fleet が動いているクラスター
    _FLEET_CLUSTER = os.environ.get("FLEET_CLUSTER_NAME", "fleetCluster")

    #  kubectl バイナリの置き場。kubectl_endpoints.py と同じ emptyDir を
    #  共有するので、たいていは既に落ちている。
    _KUBECTL_CACHE_DIR = os.environ.get("KUBECTL_CACHE_DIR", "/opt/kubectl-cache")
    _KUBECTL_DL_URL = "https://dl.k8s.io/release/{version}/bin/linux/amd64/kubectl"

    _EXEC_TIMEOUT = int(os.environ.get("FLEET_CREDENTIALS_TIMEOUT", "60"))

    #  どの Secret をどの保管庫の鍵に合わせるか。
    #
    #  username は Secret が無いときに作るためだけに使う。
    #  既にある Secret の username には触らない。
    #  Git にも Helm にも記録が残っていないので、この表が
    #  作り直しのときの唯一の手がかりになる。
    #
    #  provider / scope_id は git_credentials の doc id の一部。
    #  GitHub は 1 本の PAT で複数の org を引く構成にも対応する。
    #  その場合は代表の org を登録して、他 org 向けは不要。
    #  org の登録 note に「同一 PAT」と書いておけば経緯が追える。
    _TARGETS: List[Dict[str, str]] = [
        {
            "namespace": "fleet-default",
            "secret": "fleet-git-credentials",
            "provider": "github",
            "scope_id": "your-github-org",
            "username": "your-github-user",
            "note": "GitHub を引く GitRepo (大半)",
        },
        {
            "namespace": "fleet-local",
            "secret": "fleet-git-credentials",
            "provider": "github",
            "scope_id": "your-github-org",
            "username": "your-github-user",
            "note": "self-managed-fleet 自身",
        },
        {
            "namespace": "fleet-default",
            "secret": "fleet-git-credentials-gitlab",
            "provider": "gitlab",
            "scope_id": "gitlab.example.com:your-gitlab-group",
            "username": "your-gitlab-user",
            "note": "GitLab を引く GitRepo",
        },
    ]


    def _now_iso() -> str:
        return datetime.now(timezone.utc).isoformat()


    def _fingerprint(value: str) -> str:
        """鍵そのものを出さずに同じかどうかを言うための短い指紋。"""
        if not value:
            return ""
        return hashlib.sha256(value.encode("utf-8")).hexdigest()[:12]


    # ================================================================
    # 保管庫から鍵を取る
    # ================================================================

    def _token_from_store(provider: str, scope_id: str) -> Optional[str]:
        """git_credentials.py の解決関数をそのまま使う。

        HTTP で localhost を叩くと、spawn / pickup で Uvicorn の worker が
        塞がっているときに詰まるため、プロセス内で呼ぶ
        (topic jev_external_brain_direct_call_root_cause_fix_20260921)。
        """
        try:
            if provider == "github":
                from git_credentials import resolve_github_token_for_org
                return resolve_github_token_for_org(scope_id)
            if provider == "gitlab":
                from git_credentials import resolve_gitlab_token_for_org
                #  scope_id は "{host}:{group}" の形
                if ":" not in scope_id:
                    return None
                host, owner = scope_id.split(":", 1)
                return resolve_gitlab_token_for_org(host, owner)
        except Exception as e:
            logger.warning(
                f"[FLEET_CREDENTIALS] token 取得に失敗 "
                f"{provider}:{scope_id}: {type(e).__name__}: {e}"
            )
            return None
        return None


    # ================================================================
    # kubectl (kubeconfig は標準入力、patch は --patch-file)
    # ================================================================

    def _load_kubeconfig() -> Dict[str, Any]:
        url = f"{_OPENSEARCH_URL}/{_KUBECONFIG_INDEX}/_doc/{_FLEET_CLUSTER}"
        resp = requests.get(url, timeout=10)
        if resp.status_code == 404:
            raise HTTPException(
                status_code=404,
                detail=f"kubeconfig が登録されていません: {_FLEET_CLUSTER}",
            )
        if resp.status_code != 200:
            raise HTTPException(
                status_code=500,
                detail=f"kubeconfig の取得に失敗: {resp.status_code}",
            )
        src = resp.json().get("_source") or {}
        if not src.get("kubeconfig_yaml"):
            raise HTTPException(
                status_code=500,
                detail=f"kubeconfig が空です: {_FLEET_CLUSTER}",
            )
        return src


    def _resolve_version(version: str) -> str:
        parts = (version or "v1.32").lstrip("v").split(".")
        if len(parts) >= 3:
            return version
        minor = f"{parts[0]}.{parts[1]}"
        resp = requests.get(
            f"https://dl.k8s.io/release/stable-{minor}.txt", timeout=30
        )
        resp.raise_for_status()
        return resp.text.strip()


    def _ensure_kubectl(version: str) -> str:
        os.makedirs(_KUBECTL_CACHE_DIR, exist_ok=True)
        resolved = _resolve_version(version)
        path = os.path.join(_KUBECTL_CACHE_DIR, f"kubectl-{resolved}")
        if os.path.exists(path) and os.access(path, os.X_OK):
            return path
        url = _KUBECTL_DL_URL.format(version=resolved)
        fd, tmp = tempfile.mkstemp(prefix="kubectl-", dir=_KUBECTL_CACHE_DIR)
        try:
            with os.fdopen(fd, "wb") as f:
                with requests.get(url, timeout=60, stream=True) as r:
                    r.raise_for_status()
                    for chunk in r.iter_content(chunk_size=65536):
                        if chunk:
                            f.write(chunk)
            os.chmod(tmp, 0o755)
            os.replace(tmp, path)
            return path
        except Exception:
            try:
                os.unlink(tmp)
            except FileNotFoundError:
                pass
            raise


    def _kubectl(
        binary: str, kubeconfig_yaml: str, args: List[str]
    ) -> subprocess.CompletedProcess:
        """kubeconfig は標準入力で渡す。ファイルには書かない。"""
        return subprocess.run(
            [binary, "--kubeconfig=/dev/stdin", *args],
            input=kubeconfig_yaml,
            capture_output=True,
            text=True,
            timeout=_EXEC_TIMEOUT,
        )


    def _read_password(
        binary: str, kubeconfig_yaml: str, namespace: str, secret: str
    ) -> Optional[str]:
        """Secret の password を取り出す。無ければ None。"""
        proc = _kubectl(
            binary,
            kubeconfig_yaml,
            [
                "get", "secret", secret, "-n", namespace,
                "-o", "jsonpath={.data.password}",
            ],
        )
        if proc.returncode != 0:
            return None
        raw = (proc.stdout or "").strip()
        if not raw:
            return None
        try:
            return base64.b64decode(raw).decode("utf-8")
        except Exception:
            return None


    def _write_password(
        binary: str,
        kubeconfig_yaml: str,
        namespace: str,
        secret: str,
        token: str,
    ) -> subprocess.CompletedProcess:
        """password を書き換える。

        鍵を引数に乗せないため、patch は tempfile に書いて
        --patch-file で渡す。ファイルは必ず消す。
        """
        encoded = base64.b64encode(token.encode("utf-8")).decode("ascii")
        patch = json.dumps({"data": {"password": encoded}})
        fd, path = tempfile.mkstemp(prefix="fleet-cred-", suffix=".json")
        try:
            with os.fdopen(fd, "w") as f:
                f.write(patch)
            os.chmod(path, 0o600)
            return _kubectl(
                binary,
                kubeconfig_yaml,
                [
                    "patch", "secret", secret, "-n", namespace,
                    "--type", "merge", "--patch-file", path,
                ],
            )
        finally:
            try:
                os.unlink(path)
            except FileNotFoundError:
                pass


    def _create_secret(
        binary: str,
        kubeconfig_yaml: str,
        namespace: str,
        secret: str,
        username: str,
        token: str,
    ) -> subprocess.CompletedProcess:
        """Secret が無いときに作る。

        Helm に持っていかれたときや、クラスターを作り直したときに
        ここが復旧経路になる。鍵を引数に乗せないため、manifest を
        一時ファイルに書いて apply する。
        """
        manifest = json.dumps({
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": secret, "namespace": namespace},
            "type": "kubernetes.io/basic-auth",
            "stringData": {"username": username, "password": token},
        })
        fd, path = tempfile.mkstemp(prefix="fleet-cred-new-", suffix=".json")
        try:
            with os.fdopen(fd, "w") as f:
                f.write(manifest)
            os.chmod(path, 0o600)
            return _kubectl(binary, kubeconfig_yaml, ["apply", "-f", path])
        finally:
            try:
                os.unlink(path)
            except FileNotFoundError:
                pass


    # ================================================================
    # 本体
    # ================================================================

    def _run(dry_run: bool) -> Dict[str, Any]:
        entry = _load_kubeconfig()
        kubeconfig_yaml = entry["kubeconfig_yaml"]
        override = entry.get("server_url_override") or ""
        if override:
            import re
            kubeconfig_yaml = re.sub(
                r"^(\s*server:\s*).*$",
                lambda m: m.group(1) + override,
                kubeconfig_yaml,
                flags=re.MULTILINE,
            )
        binary = _ensure_kubectl(entry.get("k8s_version") or "v1.32")

        results: List[Dict[str, Any]] = []
        changed = 0
        failed = 0

        for target in _TARGETS:
            name = f"{target['namespace']}/{target['secret']}"
            token = _token_from_store(target["provider"], target["scope_id"])
            if not token:
                failed += 1
                results.append({
                    "secret": name,
                    "status": "no_token",
                    "detail": (
                        f"保管庫に鍵がありません "
                        f"(org:{target['provider']}:{target['scope_id']})"
                    ),
                })
                continue

            current = _read_password(
                binary, kubeconfig_yaml, target["namespace"], target["secret"]
            )
            if current is None:
                #  Secret が無い (Helm に持っていかれた、クラスターを
                #  作り直した等)。作って終わる。
                username = target.get("username") or ""
                if not username:
                    failed += 1
                    results.append({
                        "secret": name,
                        "status": "no_username",
                        "detail": "対象表に username が無いため作れません",
                    })
                    continue
                if dry_run:
                    changed += 1
                    results.append({
                        "secret": name,
                        "status": "would_create",
                        "to": _fingerprint(token),
                    })
                    continue
                proc = _create_secret(
                    binary, kubeconfig_yaml, target["namespace"],
                    target["secret"], username, token,
                )
                if proc.returncode != 0:
                    failed += 1
                    results.append({
                        "secret": name,
                        "status": "create_failed",
                        "detail": (proc.stderr or "")[:300],
                    })
                    continue
                changed += 1
                results.append({
                    "secret": name,
                    "status": "created",
                    "to": _fingerprint(token),
                })
                logger.info(
                    f"[FLEET_CREDENTIALS] {name} が無かったので作りました "
                    f"({_fingerprint(token)})"
                )
                continue

            if current == token:
                results.append({
                    "secret": name,
                    "status": "same",
                    "fingerprint": _fingerprint(token),
                })
                continue

            if dry_run:
                changed += 1
                results.append({
                    "secret": name,
                    "status": "would_update",
                    "from": _fingerprint(current),
                    "to": _fingerprint(token),
                })
                continue

            proc = _write_password(
                binary,
                kubeconfig_yaml,
                target["namespace"],
                target["secret"],
                token,
            )
            if proc.returncode != 0:
                failed += 1
                results.append({
                    "secret": name,
                    "status": "patch_failed",
                    "detail": (proc.stderr or "")[:300],
                })
                continue

            changed += 1
            results.append({
                "secret": name,
                "status": "updated",
                "from": _fingerprint(current),
                "to": _fingerprint(token),
            })
            logger.info(
                f"[FLEET_CREDENTIALS] {name} を入れ替えました "
                f"({_fingerprint(current)} → {_fingerprint(token)})"
            )

        return {
            "ok": failed == 0,
            "cluster": _FLEET_CLUSTER,
            "dry_run": dry_run,
            "changed": changed,
            "failed": failed,
            "checked_at": _now_iso(),
            "results": results,
        }


    @router.post("/core/fleet_credentials/sync")
    async def sync() -> Dict[str, Any]:
        """保管庫の鍵を Fleet の Secret に写す。

        入れ替えが起きた Secret の数を返す。鍵そのものは返さない。
        """
        return await run_in_threadpool(lambda: _run(dry_run=False))


    @router.get("/core/fleet_credentials/status")
    async def status() -> Dict[str, Any]:
        """合っているかだけ見る。書き換えない。"""
        return await run_in_threadpool(lambda: _run(dry_run=True))
