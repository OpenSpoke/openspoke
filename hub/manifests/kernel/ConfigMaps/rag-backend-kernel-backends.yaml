apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-backend-kernel-backends
  namespace: rag-company1
data:
  backends.py: |
    """backends.py — the kernel's pluggable backend abstraction (v3.0).

    ============================================================================
    Purpose
    ----------------------------------------------------------------------------
    Whatever store the kernel is backed by — Milvus / Memgraph / OpenSearch /
    Ladybug — the callers above (`mcp`, `rag-hub`, the frontend) should not
    have to care. This file defines three abstract interfaces —
    `VectorStore`, `GraphStore`, `HandoffStore` — and concrete adapters for
    Milvus, Memgraph, and Ladybug that plug in behind them.

    OpenSearch stays out of the abstraction for now. Its consumers (fleet
    state, node inventory, chat history) are heterogeneous enough that a
    single interface would either lose fidelity or grow into a leaky one.

    Ladybug (see docs/concepts/ladybug.md) is shipped alongside Milvus +
    Memgraph, off by default. Set the `BACKEND_VECTOR`, `BACKEND_GRAPH`, or
    `BACKEND_HANDOFF` environment variables on the kernel Deployment to
    `ladybug` to route the corresponding concern through the Ladybug adapter
    instead.

    ============================================================================
    Scope of this file
    ----------------------------------------------------------------------------
    - Abstract base classes: `VectorStore`, `GraphStore`, `HandoffStore`.
    - `MilvusVectorStore`: the pre-v3.0 implementation, faithful to the
      existing `/core/vectorstore/*` endpoint semantics.
    - `MemgraphGraphStore` + `MemgraphHandoffStore`: the current Memgraph
      implementation.
    - `LadybugVectorStore` + `LadybugGraphStore` + `LadybugHandoffStore`:
      the Cypher-based Ladybug implementation.
    - `get_vector_store()` / `get_graph_store()` / `get_handoff_store()`
      factories, driven by the three environment variables above.

    Kernel endpoints continue to talk to the concrete Milvus/Memgraph
    clients directly for now; the switch to the abstraction layer happens
    behind the endpoint in a separate change.
    ============================================================================
    """

    from abc import ABC, abstractmethod
    from typing import Any, Dict, List, Optional
    import os
    import logging

    logger = logging.getLogger(__name__)

    # =========================================================================
    # VectorStore Interface
    # =========================================================================

    class VectorStore(ABC):
        """Vector store abstract base class.

        Mirrors the eleven `/core/vectorstore/*` endpoints (has-namespace,
        init-namespace, drop-namespace, add-field, upsert, search, query,
        delete, flush, load, count) as methods.

        `namespace` maps to a Milvus collection or a Ladybug node table.
        """

        @abstractmethod
        def has_namespace(self, namespace: str) -> bool:
            """Return True if the namespace already exists."""

        @abstractmethod
        def init_namespace(
            self,
            namespace: str,
            vector_dim: int,
            extra_fields: Optional[List[Dict[str, Any]]] = None,
        ) -> None:
            """Create the namespace with a schema and a vector index."""

        @abstractmethod
        def drop_namespace(self, namespace: str) -> None:
            """Drop the namespace and everything in it."""

        @abstractmethod
        def add_field(self, namespace: str, field: Dict[str, Any]) -> None:
            """Add a field to an existing namespace."""

        @abstractmethod
        def upsert(
            self, namespace: str, records: List[Dict[str, Any]]
        ) -> Dict[str, Any]:
            """Insert or update records."""

        @abstractmethod
        def search(
            self,
            namespace: str,
            vector: List[float],
            top_k: int,
            filter_expr: Optional[str] = None,
            output_fields: Optional[List[str]] = None,
        ) -> List[Dict[str, Any]]:
            """Nearest-neighbour vector search."""

        @abstractmethod
        def query(
            self,
            namespace: str,
            filter_expr: str,
            output_fields: Optional[List[str]] = None,
            limit: Optional[int] = None,
        ) -> List[Dict[str, Any]]:
            """Metadata-only filter query (no vector)."""

        @abstractmethod
        def delete(self, namespace: str, filter_expr: str) -> Dict[str, Any]:
            """Delete records matching a filter."""

        @abstractmethod
        def flush(self, namespace: str) -> None:
            """Flush pending writes for the namespace."""

        @abstractmethod
        def load(self, namespace: str) -> None:
            """Make the namespace searchable."""

        @abstractmethod
        def count(
            self, namespace: str, filter_expr: Optional[str] = None
        ) -> int:
            """Return the number of records in the namespace."""

    # =========================================================================
    # GraphStore Interface
    # =========================================================================

    class GraphStore(ABC):
        """Graph store abstract base class.

        Backs `/core/graph/run` and `/core/graph/format-context`: raw Cypher
        execution and the higher-level "grow a subgraph around these
        entities and render it for an LLM" helper.
        """

        @abstractmethod
        def run_cypher(
            self,
            query: str,
            params: Optional[Dict[str, Any]] = None,
        ) -> List[Dict[str, Any]]:
            """Run a Cypher query and return records as dicts."""

        @abstractmethod
        def format_context(
            self,
            entity_names: List[str],
            max_relations: int = 20,
        ) -> str:
            """Render a subgraph around the given entities as a string
            suitable for an LLM prompt."""

    # =========================================================================
    # HandoffStore Interface
    # =========================================================================

    class HandoffStore(ABC):
        """Handoff (brief + topics + tags) store abstract base class.

        Backs the seven `/core/handoff/*` endpoints (brief/get, brief/upsert,
        topics/list, topic/get, topic/upsert, topic/delete, migrate) and the
        `topic_set_tags` write path used by the automatic classifier.

        The Memgraph implementation follows the v3.0 schema:
            (:Brief {id:"brief", content, updated_at})
            (:Topic {id, title, summary, content, category, tags,
                     created_at, updated_at})
            (:Tag {name})
            (:Topic)-[:HAS_TAG]->(:Tag)
        """

        @abstractmethod
        def brief_get(self) -> Optional[Dict[str, Any]]:
            """Return the Brief node, or None if none exists yet."""

        @abstractmethod
        def brief_upsert(self, content: str) -> Dict[str, Any]:
            """Create or update the Brief. Returns {created_at, updated_at}."""

        @abstractmethod
        def topics_list(self) -> List[Dict[str, Any]]:
            """Return every topic as {id, title, summary, category, tags,
            updated_at}. Content is intentionally omitted."""

        @abstractmethod
        def topic_get(self, topic_id: str) -> Optional[Dict[str, Any]]:
            """Return the full record for one topic, or None."""

        @abstractmethod
        def topic_upsert(
            self,
            topic_id: str,
            title: Optional[str] = None,
            summary: Optional[str] = None,
            content: Optional[str] = None,
            category: Optional[str] = None,
        ) -> Dict[str, Any]:
            """Create or update a topic. Only the fields you pass are
            written; omitted fields keep their existing value. Returns
            {action: 'created'|'updated', created_at, updated_at}."""

        @abstractmethod
        def topic_delete(self, topic_id: str) -> Dict[str, Any]:
            """Delete a topic. Idempotent. Returns {deleted: bool}."""

        @abstractmethod
        def topic_set_tags(
            self, topic_id: str, tags: List[str]
        ) -> Dict[str, Any]:
            """Overwrite the topic's tag set (both `tags` property and
            outgoing `HAS_TAG` edges). Returns {ok: bool, tags: [...],
            error: str | null}."""

    # =========================================================================
    # Milvus Adapter (VectorStore implementation)
    # =========================================================================

    class MilvusVectorStore(VectorStore):
        """VectorStore backed by pymilvus.

        Assumes `pymilvus.connections.connect(alias='default', host=..., port=...)`
        has already been called at kernel startup (in main.py).
        """

        def __init__(self):
            from pymilvus import (
                Collection,
                utility,
                FieldSchema,
                CollectionSchema,
                DataType,
            )
            self._utility = utility
            self._Collection = Collection
            self._FieldSchema = FieldSchema
            self._CollectionSchema = CollectionSchema
            self._DataType = DataType

        def has_namespace(self, namespace: str) -> bool:
            return self._utility.has_collection(namespace)

        def init_namespace(
            self,
            namespace: str,
            vector_dim: int,
            extra_fields: Optional[List[Dict[str, Any]]] = None,
        ) -> None:
            fields = [
                self._FieldSchema(
                    name="id",
                    dtype=self._DataType.INT64,
                    is_primary=True,
                    auto_id=True,
                ),
                self._FieldSchema(
                    name="text",
                    dtype=self._DataType.VARCHAR,
                    max_length=5000,
                ),
                self._FieldSchema(
                    name="embedding",
                    dtype=self._DataType.FLOAT_VECTOR,
                    dim=vector_dim,
                ),
            ]
            if extra_fields:
                for f in extra_fields:
                    fields.append(self._make_field(f))
            schema = self._CollectionSchema(fields=fields)
            collection = self._Collection(name=namespace, schema=schema)
            index_params = {
                "metric_type": "IP",
                "index_type": "IVF_FLAT",
                "params": {"nlist": 128},
            }
            collection.create_index(
                field_name="embedding", index_params=index_params
            )

        def _make_field(self, spec: Dict[str, Any]):
            # spec example: {"name": "category", "dtype": "VARCHAR", "max_length": 128}
            name = spec["name"]
            dtype = getattr(self._DataType, spec["dtype"])
            kwargs = {"name": name, "dtype": dtype}
            for k in ("max_length", "dim", "is_partition_key"):
                if k in spec:
                    kwargs[k] = spec[k]
            return self._FieldSchema(**kwargs)

        def drop_namespace(self, namespace: str) -> None:
            if self._utility.has_collection(namespace):
                self._utility.drop_collection(namespace)

        def add_field(self, namespace: str, field: Dict[str, Any]) -> None:
            # The pre-v3.0 kernel implements this inline in each endpoint;
            # it will be lifted into this adapter in a follow-up change.
            raise NotImplementedError(
                "add_field: not yet lifted from the kernel endpoint code"
            )

        def upsert(
            self, namespace: str, records: List[Dict[str, Any]]
        ) -> Dict[str, Any]:
            if not records:
                return {"inserted": 0}
            collection = self._Collection(namespace)
            columns = self._records_to_columns(collection, records)
            result = collection.upsert(columns)
            return {
                "inserted": len(records),
                "upsert_count": getattr(result, "upsert_count", None),
            }

        def _records_to_columns(self, collection, records):
            cols = []
            for f in collection.schema.fields:
                if f.auto_id:
                    continue
                cols.append([r.get(f.name) for r in records])
            return cols

        def search(
            self,
            namespace: str,
            vector: List[float],
            top_k: int,
            filter_expr: Optional[str] = None,
            output_fields: Optional[List[str]] = None,
        ) -> List[Dict[str, Any]]:
            collection = self._Collection(namespace)
            collection.load()
            results = collection.search(
                data=[vector],
                anns_field="embedding",
                param={"metric_type": "IP", "params": {"nprobe": 10}},
                limit=top_k,
                expr=filter_expr,
                output_fields=output_fields or ["text"],
            )
            out: List[Dict[str, Any]] = []
            for hits in results:
                for hit in hits:
                    item = {"id": hit.id, "distance": hit.distance}
                    for f in output_fields or ["text"]:
                        item[f] = hit.entity.get(f)
                    out.append(item)
            return out

        def query(
            self,
            namespace: str,
            filter_expr: str,
            output_fields: Optional[List[str]] = None,
            limit: Optional[int] = None,
        ) -> List[Dict[str, Any]]:
            collection = self._Collection(namespace)
            collection.load()
            kwargs = {
                "expr": filter_expr,
                "output_fields": output_fields or ["*"],
            }
            if limit:
                kwargs["limit"] = limit
            return collection.query(**kwargs)

        def delete(self, namespace: str, filter_expr: str) -> Dict[str, Any]:
            collection = self._Collection(namespace)
            result = collection.delete(filter_expr)
            return {"delete_count": getattr(result, "delete_count", None)}

        def flush(self, namespace: str) -> None:
            collection = self._Collection(namespace)
            collection.flush()

        def load(self, namespace: str) -> None:
            collection = self._Collection(namespace)
            collection.load()

        def count(
            self, namespace: str, filter_expr: Optional[str] = None
        ) -> int:
            collection = self._Collection(namespace)
            collection.load()
            if filter_expr:
                rows = collection.query(
                    expr=filter_expr, output_fields=["count(*)"]
                )
                if rows and isinstance(rows[0], dict):
                    return int(rows[0].get("count(*)", 0))
                return len(rows)
            return collection.num_entities

    # =========================================================================
    # Memgraph Adapter (GraphStore + HandoffStore)
    # =========================================================================

    class MemgraphGraphStore(GraphStore):
        """GraphStore backed by Memgraph (neo4j-driver over Bolt).

        The driver is created once at kernel startup and shared via
        `main.py`'s module-level `neo4j_driver`.
        """

        def __init__(self, driver):
            if driver is None:
                raise RuntimeError(
                    "MemgraphGraphStore: neo4j driver is None"
                )
            self._driver = driver

        def run_cypher(
            self,
            query: str,
            params: Optional[Dict[str, Any]] = None,
        ) -> List[Dict[str, Any]]:
            with self._driver.session() as session:
                result = session.run(query, params or {})
                return [dict(r) for r in result]

        def format_context(
            self,
            entity_names: List[str],
            max_relations: int = 20,
        ) -> str:
            # 1-hop neighbourhood concatenated as "src -[rel]-> dst" lines.
            if not entity_names:
                return ""
            query = (
                "MATCH (n)-[r]-(m) "
                "WHERE n.name IN $names "
                "RETURN n.name AS src, type(r) AS rel, m.name AS dst "
                "LIMIT $limit"
            )
            rows = self.run_cypher(
                query, {"names": entity_names, "limit": max_relations}
            )
            lines = [
                f"{r.get('src')} -[{r.get('rel')}]-> {r.get('dst')}"
                for r in rows
            ]
            return "\n".join(lines)

    class MemgraphHandoffStore(HandoffStore):
        """HandoffStore backed by Memgraph.

        Schema (see docs/concepts/knowledge-base.md):
            (:Brief {id:"brief", content, updated_at})
            (:Topic {id, title, summary, content, category, tags,
                     created_at, updated_at})
            (:Tag {name})
            (:Topic)-[:HAS_TAG]->(:Tag)
        """

        def __init__(self, driver):
            if driver is None:
                raise RuntimeError(
                    "MemgraphHandoffStore: neo4j driver is None"
                )
            self._driver = driver

        def brief_get(self) -> Optional[Dict[str, Any]]:
            with self._driver.session() as session:
                row = session.run(
                    "MATCH (b:Brief {id:'brief'}) "
                    "RETURN b.content AS content, "
                    "b.title AS title, "
                    "b.created_at AS created_at, "
                    "b.updated_at AS updated_at"
                ).single()
                if not row:
                    return None
                return dict(row)

        def brief_upsert(self, content: str) -> Dict[str, Any]:
            from datetime import datetime, timezone
            now_iso = datetime.now(timezone.utc).isoformat(timespec="seconds")
            with self._driver.session() as session:
                row = session.run(
                    "MERGE (b:Brief {id:'brief'}) "
                    "ON CREATE SET b.created_at = $now "
                    "SET b.content = $content, b.updated_at = $now "
                    "RETURN b.created_at AS created_at",
                    {"content": content, "now": now_iso},
                ).single()
                created_at = row["created_at"] if row else now_iso
            return {"created_at": created_at, "updated_at": now_iso}

        def topics_list(self) -> List[Dict[str, Any]]:
            with self._driver.session() as session:
                result = session.run(
                    "MATCH (t:Topic) "
                    "RETURN t.id AS id, t.title AS title, "
                    "t.summary AS summary, t.category AS category, "
                    "t.tags AS tags, "
                    "t.updated_at AS updated_at "
                    "ORDER BY t.id ASC"
                )
                return [dict(r) for r in result]

        def topic_get(self, topic_id: str) -> Optional[Dict[str, Any]]:
            with self._driver.session() as session:
                row = session.run(
                    "MATCH (t:Topic {id:$id}) "
                    "RETURN t.id AS id, t.title AS title, "
                    "t.summary AS summary, t.content AS content, "
                    "t.category AS category, "
                    "t.tags AS tags, "
                    "t.created_at AS created_at, "
                    "t.updated_at AS updated_at",
                    {"id": topic_id},
                ).single()
                if not row:
                    return None
                return dict(row)

        def topic_upsert(
            self,
            topic_id: str,
            title: Optional[str] = None,
            summary: Optional[str] = None,
            content: Optional[str] = None,
            category: Optional[str] = None,
        ) -> Dict[str, Any]:
            from datetime import datetime, timezone
            now_iso = datetime.now(timezone.utc).isoformat(timespec="seconds")
            set_clauses = ["t.updated_at = $now"]
            params: Dict[str, Any] = {"id": topic_id, "now": now_iso}
            for field, value in (
                ("title", title),
                ("summary", summary),
                ("content", content),
                ("category", category),
            ):
                if value is not None:
                    set_clauses.append(f"t.{field} = ${field}")
                    params[field] = value
            set_expr = ", ".join(set_clauses)
            cypher = (
                "MERGE (t:Topic {id: $id}) "
                "ON CREATE SET t.created_at = $now "
                f"SET {set_expr} "
                "RETURN t.created_at AS created_at, "
                "CASE WHEN t.created_at = $now "
                "THEN 'created' ELSE 'updated' END AS action"
            )
            with self._driver.session() as session:
                row = session.run(cypher, params).single()
                action = row["action"] if row else "unknown"
                created_at = row["created_at"] if row else now_iso
            return {
                "action": action,
                "created_at": created_at,
                "updated_at": now_iso,
            }

        def topic_delete(self, topic_id: str) -> Dict[str, Any]:
            with self._driver.session() as session:
                row = session.run(
                    "MATCH (t:Topic {id:$id}) "
                    "WITH t, count(t) AS c "
                    "DETACH DELETE t RETURN c AS deleted_count",
                    {"id": topic_id},
                ).single()
                deleted_count = row["deleted_count"] if row else 0
            return {"deleted": deleted_count > 0}

        def topic_set_tags(self, topic_id: str, tags: List[str]) -> Dict[str, Any]:
            """Overwrite `tags` and `HAS_TAG` edges.

            Normalisation: lowercase, spaces and hyphens to underscore.
            Tokens starting with 'error' and empty tokens are dropped.
            Duplicates are removed (first occurrence wins).
            """
            cleaned: List[str] = []
            for raw in tags or []:
                s = str(raw).strip().lower().replace(" ", "_").replace("-", "_")
                if s and not s.startswith("error"):
                    cleaned.append(s)
            cleaned = list(dict.fromkeys(cleaned))

            with self._driver.session() as session:
                row = session.run(
                    "MATCH (t:Topic {id:$id}) "
                    "OPTIONAL MATCH (t)-[r:HAS_TAG]->() "
                    "DELETE r "
                    "SET t.tags = $tags "
                    "RETURN t.id AS id",
                    {"id": topic_id, "tags": cleaned},
                ).single()
                if not row:
                    return {"ok": False, "tags": [], "error": "topic not found"}
                if cleaned:
                    session.run(
                        "MATCH (t:Topic {id:$id}) "
                        "UNWIND $tags AS tag_name "
                        "MERGE (tag:Tag {name: tag_name}) "
                        "MERGE (t)-[:HAS_TAG]->(tag)",
                        {"id": topic_id, "tags": cleaned},
                    )
            return {"ok": True, "tags": cleaned}

    # =========================================================================
    # Ladybug Adapter (VectorStore + GraphStore + HandoffStore)
    # =========================================================================

    class LadybugClient:
        """Ladybug REST API client (httpx-based)."""

        def __init__(self, base_url: str):
            import httpx
            self._httpx = httpx
            self._base_url = base_url.rstrip("/")
            self._client = self._httpx.Client(
                base_url=self._base_url, timeout=30.0
            )

        def health(self) -> Dict[str, Any]:
            r = self._client.get("/")
            r.raise_for_status()
            return r.json()

        def schema(self) -> Dict[str, Any]:
            r = self._client.get("/schema")
            r.raise_for_status()
            return r.json()

        def cypher(
            self, query: str, params: Optional[Dict[str, Any]] = None
        ) -> Dict[str, Any]:
            r = self._client.post(
                "/cypher",
                json={"query": query, "params": params or {}},
            )
            r.raise_for_status()
            return r.json()

    class LadybugVectorStore(VectorStore):
        """VectorStore backed by Ladybug (kùzu-based).

        `namespace` maps to a node table. Schema convention:
            CREATE NODE TABLE {namespace}(
                id SERIAL PRIMARY KEY,
                text STRING,
                embedding FLOAT[<dim>],
                ...extra_fields
            );

        Vector search uses `CALL QUERY_VECTOR_INDEX(...)` when a vector index
        exists; on failure it falls back to a full scan with
        `array_cosine_similarity`.
        """

        def __init__(self, client: LadybugClient):
            self._client = client

        def has_namespace(self, namespace: str) -> bool:
            schema = self._client.schema()
            names = [t["name"] for t in schema.get("nodeTables", [])]
            return namespace in names

        def _map_dtype(self, spec: Dict[str, Any]) -> str:
            dt = spec["dtype"].upper()
            if dt == "VARCHAR":
                return "STRING"
            return dt

        def init_namespace(
            self,
            namespace: str,
            vector_dim: int,
            extra_fields: Optional[List[Dict[str, Any]]] = None,
        ) -> None:
            cols = [
                "id SERIAL PRIMARY KEY",
                "text STRING",
                f"embedding FLOAT[{vector_dim}]",
            ]
            if extra_fields:
                for f in extra_fields:
                    cols.append(f"{f['name']} {self._map_dtype(f)}")
            self._client.cypher(
                f"CREATE NODE TABLE {namespace}({', '.join(cols)});"
            )

            try:
                self._client.cypher(
                    f"CALL CREATE_VECTOR_INDEX('{namespace}', "
                    f"'embedding_idx', 'embedding');"
                )
            except Exception as e:
                logger.warning(
                    f"[LadybugVectorStore] vector index creation "
                    f"failed (fallback to brute-force scan): {e}"
                )

        def drop_namespace(self, namespace: str) -> None:
            self._client.cypher(f"DROP TABLE {namespace};")

        def add_field(
            self, namespace: str, field: Dict[str, Any]
        ) -> None:
            self._client.cypher(
                f"ALTER TABLE {namespace} ADD "
                f"{field['name']} {self._map_dtype(field)};"
            )

        def upsert(
            self, namespace: str, records: List[Dict[str, Any]]
        ) -> Dict[str, Any]:
            if not records:
                return {"inserted": 0}
            inserted = 0
            for r in records:
                keys = list(r.keys())
                if "id" in r:
                    sets = ", ".join(
                        f"n.{k} = ${k}" for k in keys if k != "id"
                    )
                    cyp = (
                        f"MERGE (n:{namespace} {{id: $id}}) "
                        f"SET {sets}" if sets else
                        f"MERGE (n:{namespace} {{id: $id}})"
                    )
                else:
                    fields_str = ", ".join(f"{k}: ${k}" for k in keys)
                    cyp = f"CREATE (n:{namespace} {{{fields_str}}})"
                self._client.cypher(cyp, r)
                inserted += 1
            return {"inserted": inserted}

        def search(
            self,
            namespace: str,
            vector: List[float],
            top_k: int,
            filter_expr: Optional[str] = None,
            output_fields: Optional[List[str]] = None,
        ) -> List[Dict[str, Any]]:
            fields = ", ".join(
                f"n.{f} AS {f}"
                for f in (output_fields or ["text"])
            )
            try:
                cyp = (
                    f"CALL QUERY_VECTOR_INDEX('{namespace}', "
                    f"'embedding_idx', $vec, {top_k}) "
                    f"YIELD node AS n, distance "
                    f"RETURN n.id AS id, {fields}, distance"
                )
                result = self._client.cypher(cyp, {"vec": vector})
                return result.get("rows", [])
            except Exception:
                cyp = (
                    f"MATCH (n:{namespace}) "
                    f"RETURN n.id AS id, {fields}, "
                    f"array_cosine_similarity(n.embedding, $vec) "
                    f"AS distance "
                    f"ORDER BY distance DESC LIMIT {top_k}"
                )
                result = self._client.cypher(cyp, {"vec": vector})
                return result.get("rows", [])

        def query(
            self,
            namespace: str,
            filter_expr: str,
            output_fields: Optional[List[str]] = None,
            limit: Optional[int] = None,
        ) -> List[Dict[str, Any]]:
            fields = ", ".join(
                f"n.{f} AS {f}"
                for f in (output_fields or ["text"])
            )
            cyp = (
                f"MATCH (n:{namespace}) WHERE {filter_expr} "
                f"RETURN {fields}"
            )
            if limit:
                cyp += f" LIMIT {limit}"
            result = self._client.cypher(cyp)
            return result.get("rows", [])

        def delete(
            self, namespace: str, filter_expr: str
        ) -> Dict[str, Any]:
            cyp = (
                f"MATCH (n:{namespace}) WHERE {filter_expr} "
                f"WITH count(n) AS c, collect(n) AS ns "
                f"FOREACH (x IN ns | DETACH DELETE x) "
                f"RETURN c"
            )
            result = self._client.cypher(cyp)
            rows = result.get("rows", [])
            c = rows[0].get("c") if rows else 0
            return {"delete_count": c}

        def flush(self, namespace: str) -> None:
            # Ladybug is disk-backed; there is no explicit flush API.
            pass

        def load(self, namespace: str) -> None:
            # Ladybug is memory-mapped and always ready; no-op.
            pass

        def count(
            self, namespace: str, filter_expr: Optional[str] = None
        ) -> int:
            if filter_expr:
                cyp = (
                    f"MATCH (n:{namespace}) WHERE {filter_expr} "
                    f"RETURN count(n) AS c"
                )
            else:
                cyp = f"MATCH (n:{namespace}) RETURN count(n) AS c"
            result = self._client.cypher(cyp)
            rows = result.get("rows", [])
            return int(rows[0].get("c", 0)) if rows else 0

    class LadybugGraphStore(GraphStore):
        """GraphStore backed by Ladybug."""

        def __init__(self, client: LadybugClient):
            self._client = client

        def run_cypher(
            self,
            query: str,
            params: Optional[Dict[str, Any]] = None,
        ) -> List[Dict[str, Any]]:
            result = self._client.cypher(query, params)
            return result.get("rows", [])

        def format_context(
            self,
            entity_names: List[str],
            max_relations: int = 20,
        ) -> str:
            if not entity_names:
                return ""
            cyp = (
                "MATCH (n)-[r]-(m) "
                "WHERE n.name IN $names "
                "RETURN n.name AS src, label(r) AS rel, "
                "m.name AS dst "
                "LIMIT $limit"
            )
            rows = self.run_cypher(
                cyp,
                {"names": entity_names, "limit": max_relations},
            )
            lines = [
                f"{r.get('src')} -[{r.get('rel')}]-> {r.get('dst')}"
                for r in rows
            ]
            return "\n".join(lines)

    # =========================================================================
    # Factory / Selector
    # =========================================================================

    # Backend selection driven by three env vars. Defaults match the
    # pre-v3.0 topology (Milvus + Memgraph) so an installation upgrading to
    # v3.0 without setting anything sees no behaviour change.
    BACKEND_VECTOR = os.environ.get("BACKEND_VECTOR", "milvus")
    BACKEND_GRAPH = os.environ.get("BACKEND_GRAPH", "memgraph")
    BACKEND_HANDOFF = os.environ.get("BACKEND_HANDOFF", "memgraph")

    LADYBUG_URL = os.environ.get(
        "LADYBUG_URL",
        "http://ladybug.ladybug.svc.cluster.local:8000",
    )

    _vector_store: Optional[VectorStore] = None
    _graph_store: Optional[GraphStore] = None
    _handoff_store: Optional[HandoffStore] = None
    _ladybug_client: Optional[LadybugClient] = None

    def _get_ladybug_client() -> LadybugClient:
        global _ladybug_client
        if _ladybug_client is None:
            _ladybug_client = LadybugClient(LADYBUG_URL)
        return _ladybug_client

    def get_vector_store() -> VectorStore:
        """Return the singleton VectorStore chosen by BACKEND_VECTOR."""
        global _vector_store
        if _vector_store is None:
            if BACKEND_VECTOR == "milvus":
                _vector_store = MilvusVectorStore()
            elif BACKEND_VECTOR == "ladybug":
                _vector_store = LadybugVectorStore(_get_ladybug_client())
            else:
                raise ValueError(
                    f"Unknown BACKEND_VECTOR: {BACKEND_VECTOR}"
                )
            logger.info(f"[backends] VectorStore = {BACKEND_VECTOR}")
        return _vector_store

    def get_graph_store(neo4j_driver=None) -> GraphStore:
        """Return the singleton GraphStore chosen by BACKEND_GRAPH.

        Memgraph mode expects the shared `neo4j_driver` created at kernel
        startup to be passed in.
        """
        global _graph_store
        if _graph_store is None:
            if BACKEND_GRAPH == "memgraph":
                _graph_store = MemgraphGraphStore(neo4j_driver)
            elif BACKEND_GRAPH == "ladybug":
                _graph_store = LadybugGraphStore(_get_ladybug_client())
            else:
                raise ValueError(
                    f"Unknown BACKEND_GRAPH: {BACKEND_GRAPH}"
                )
            logger.info(f"[backends] GraphStore = {BACKEND_GRAPH}")
        return _graph_store

    def get_handoff_store(neo4j_driver=None) -> HandoffStore:
        """Return the singleton HandoffStore chosen by BACKEND_HANDOFF.

        Only Memgraph is supported today. Ladybug support is on the
        roadmap and would land as `LadybugHandoffStore` here.
        """
        global _handoff_store
        if _handoff_store is None:
            if BACKEND_HANDOFF == "memgraph":
                _handoff_store = MemgraphHandoffStore(neo4j_driver)
            else:
                raise ValueError(
                    f"Unknown BACKEND_HANDOFF: {BACKEND_HANDOFF} "
                    "(supported: memgraph)"
                )
            logger.info(f"[backends] HandoffStore = {BACKEND_HANDOFF}")
        return _handoff_store

    def reset_singletons() -> None:
        """Reset the singletons — useful in tests or after env changes."""
        global _vector_store, _graph_store, _handoff_store, _ladybug_client
        _vector_store = None
        _graph_store = None
        _handoff_store = None
        _ladybug_client = None
