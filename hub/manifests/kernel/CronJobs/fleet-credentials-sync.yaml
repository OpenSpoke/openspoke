---
#  Fleet の Git 認証情報を保管庫に合わせる定期実行。
#
#  やっているのは kernel の /core/fleet_credentials/sync を叩くだけ。
#  鍵を読んで Secret を書き換える処理は kernel の中にある
#  (manifests/kernel/ConfigMaps/rag-backend-kernel-fleet-credentials.yaml)。
#  ここに鍵は一切出てこない。
#
#  なぜ定期なのか:
#    - 保管庫の鍵を入れ替えたあと、人が Secret を直すのを忘れても
#      次の実行で揃う。GitOps が全停止する事故を 3 回起こしている
#      (2026-09-15 / 09-18 / 10-20)
#    - 入れ替えた直後に待てないときは、下のコマンドで即座に回せる
#    - GitLab の Secret は Helm の管理下にあるため、Helm が古い値を
#      書き戻すことがある。定期実行なら戻されても次で直る
#
#  すぐ反映したいときは手でも叩ける:
#    kubectl -n rag-company1 create job --from=cronjob/fleet-credentials-sync \
#      fleet-credentials-sync-now
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fleet-credentials-sync
  namespace: rag-company1
  labels:
    app: fleet-credentials-sync
spec:
  #  1 時間ごと。鍵の入れ替えは年に数回なので、これで十分早い。
  #  毎時 37 分なのは、毎時 0 分に起きる他の仕事と重ならないようにするため。
  schedule: "37 * * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: fleet-credentials-sync
        spec:
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: purpose
                        operator: In
                        values:
                          - general
          containers:
            - name: sync
              image: curlimages/curl:8.11.1
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: Asia/Tokyo
                - name: KERNEL_URL
                  value: http://rag-backend-kernel.rag-company1.svc.cluster.local:8000
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  #  応答に鍵は含まれない (入れ替えの有無と指紋だけ)。
                  #  そのまま出してよい。
                  out="$(curl -sS -w '\n%{http_code}' -X POST \
                        "${KERNEL_URL}/core/fleet_credentials/sync")"
                  code="$(printf '%s' "${out}" | tail -n 1)"
                  body="$(printf '%s' "${out}" | sed '$d')"
                  echo "${body}"
                  if [ "${code}" != "200" ]; then
                    echo "kernel が ${code} を返しました" >&2
                    exit 1
                  fi
                  #  ok=false のときは失敗として扱う。
                  #  (保管庫に鍵が無い / Secret が無い / patch 失敗)
                  case "${body}" in
                    *'"ok":true'*) echo "同期しました" ;;
                    *) echo "同期しきれていません" >&2; exit 1 ;;
                  esac
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
