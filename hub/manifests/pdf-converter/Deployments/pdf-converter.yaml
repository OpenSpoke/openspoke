apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-converter
  namespace: pdf-converter
  labels:
    app: pdf-converter
spec:
  replicas: 0
  selector:
    matchLabels:
      app: pdf-converter
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pdf-converter
      annotations:
        restarted-at: "2026-05-30T23:55:00Z"
    spec:
      containers:
      - name: pdf-converter
        image: pdf-converter:0.3.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: TZ
          value: "Asia/Tokyo"
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "2"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        # /tmp と LibreOffice 用ディレクトリは書き込み可能にしておく
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
