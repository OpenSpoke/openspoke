apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: rag-company1
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: rag-frontend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        restarted-at: "2026-06-21T14:45:00Z"
      labels:
        app: rag-frontend
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: purpose
                    operator: In
                    values:
                      - general
      containers:
        - name: frontend
          image: rag-frontend-offline:v1.0.3
          imagePullPolicy: IfNotPresent
          env:
            - name: KEYCLOAK_URL
              value: https://keycloak.example.com
            - name: KEYCLOAK_REALM
              value: rag
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: openspoke-admin-api
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-api-secret
                  key: client-secret
          command:
            - /bin/bash
            - "-c"
            - >
              streamlit run /app/app.py --server.port=8501
              --server.address=0.0.0.0
          ports:
            - containerPort: 8501
              name: 8501tcp
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /app
              name: code
            - mountPath: /root/.streamlit
              name: streamlit-home
            - mountPath: /root/.streamlit/config.toml
              name: streamlit-config
              subPath: config.toml
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: code
          projected:
            defaultMode: 420
            sources:
              - configMap:
                  name: rag-frontend-code-dashboard-main
                  items:
                    - key: app.py
                      path: app.py
              - configMap:
                  name: rag-frontend-code-dashboard-api
                  items:
                    - key: kernel_api.py
                      path: kernel_api.py
              - configMap:
                  name: rag-frontend-code-dashboard-topology
                  items:
                    - key: view_topology.py
                      path: view_topology.py
              - configMap:
                  name: rag-frontend-code-dashboard-fleet
                  items:
                    - key: view_fleet.py
                      path: view_fleet.py
              - configMap:
                  name: rag-frontend-code-dashboard-clusters
                  items:
                    - key: view_clusters.py
                      path: view_clusters.py
              - configMap:
                  name: rag-frontend-code-dashboard-nodes
                  items:
                    - key: view_nodes.py
                      path: view_nodes.py
              - configMap:
                  name: rag-frontend-code-dashboard-modules
                  items:
                    - key: view_modules.py
                      path: view_modules.py
              - configMap:
                  name: rag-frontend-code-dashboard-users
                  items:
                    - key: view_users.py
                      path: view_users.py
              - configMap:
                  name: rag-frontend-code-dashboard-scope
                  items:
                    - key: user_scope.py
                      path: user_scope.py
        - name: streamlit-home
          emptyDir: {}
        - name: streamlit-config
          configMap:
            defaultMode: 420
            name: rag-frontend-code-dashboard-main
            items:
              - key: .streamlit-config.toml
                path: config.toml
