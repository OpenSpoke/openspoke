apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: rag-company1
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 4180
      protocol: TCP
      targetPort: 4180
  selector:
    app: oauth2-proxy
  sessionAffinity: None
  type: ClusterIP
