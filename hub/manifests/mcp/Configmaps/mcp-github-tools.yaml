                lines.append("")
                total_issues = (int(m.get("open_issues") or 0)
                                + int(m.get("closed_issues") or 0))
                progress = ""
                if total_issues > 0:
                    progress = (" ["
                                + str(m.get("closed_issues") or 0) + "/"
                                + str(total_issues) + " closed]")
                lines.append(
                    "### #" + str(m.get("number"))
                    + " " + str(m.get("title") or "")
                    + " [" + str(m.get("state") or "") + "]"
                    + progress
                )
                if m.get("description"):
                    lines.append(str(m.get("description")))
                lines.append("- creator: @" + str(m.get("creator") or "")
                             + " / created: " + str(m.get("created_at") or ""))
                lines.append("- due_on: " + str(m.get("due_on") or "(なし)")
                             + " / closed_at: " + str(m.get("closed_at") or "(未)"))
                if m.get("html_url"):
                    lines.append("- url: " + str(m.get("html_url")))
            return "\n".join(lines)

