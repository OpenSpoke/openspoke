apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-github-tools
  namespace: mcp
data:
  github_tools.py: |
    """
    GitHub 関連 MCP ツール (分離モジュール 第1弾)。

    mcp_server.py から register_github_tools(mcp, ensure_kernel_url) を
    呼ぶことでツールが登録される。 mcp インスタンスと kernel URL 取得関数を
    引数で受け取り、 mcp_server.py 側のグローバルに依存しない。

    httpx クライアントはモジュールグローバルにせず毎回 async with で
    生成する (mcp_server の _client が rollout 後に stale keep-alive を
    抱える既知問題を避けるため。 重要パスは都度生成が安全)。

    typing.Dict / List / Optional は使わない (mcp_server.py と同じ規約。
    builtin dict / list / "X | None" を使う)。
    """

    import re as _re
    import httpx as _httpx


    def register_github_tools(mcp, ensure_kernel_url):
        """GitHub 系ツールを mcp に登録する。

        Args:
            mcp: FastMCP インスタンス
            ensure_kernel_url: () -> str。 KERNEL_URL を検証して返す関数
                               (未設定なら例外を投げる)。 mcp_server.py の
                               _ensure_kernel_url をそのまま渡す。
        """

        async def _gh_get_file(kernel, owner, repo, path, branch, user_id):
            """kernel 経由でファイル全文を取得。 (ok, content_or_errmsg) を返す。"""
            async with _httpx.AsyncClient(timeout=60.0) as client:
                r = await client.post(
                    kernel + "/core/github/get-file",
                    json={"owner": owner, "repo": repo, "path": path,
                          "branch": branch if branch else None,
                          "user_id": user_id},
                )
            r.raise_for_status()
            d = r.json()
            if not d.get("ok"):
                return False, "取得失敗: " + str(d.get("error", "unknown"))
            if not d.get("exists"):
                return False, "ファイルが存在しません: " + owner + "/" + repo + "/" + path
            return True, d.get("content") or ""

        async def _gh_put_file(kernel, owner, repo, path, content, message,
                               branch, user_id):
            """kernel 経由でファイルを push。 (ok, info_dict_or_errmsg) を返す。"""
            async with _httpx.AsyncClient(timeout=120.0) as client:
                r = await client.post(
                    kernel + "/core/github/put-file",
                    json={"owner": owner, "repo": repo, "path": path,
                          "content": content, "message": message,
                          "branch": branch if branch else None,
                          "user_id": user_id},
                )
            r.raise_for_status()
            d = r.json()
            if not d.get("ok"):
                return False, "push 失敗: " + str(d.get("error", "unknown"))
            return True, d

        @mcp.tool()
        async def github_move_block(
            src_owner: str,
            src_repo: str,
            src_path: str,
            dst_owner: str,
            dst_repo: str,
            dst_path: str,
            message: str,
            start_line: int = 0,
            end_line: int = 0,
            start_pattern: str = "",
            end_pattern: str = "",
            dst_anchor_pattern: str = "",
            dst_insert: str = "end",
            branch: str = "",
            user_id: str = "",
        ) -> str:
            """大きなファイルの一部 (連続ブロック) を別ファイルへ移動する。

            抽出 → 移動先へ挿入 → 元ファイルから削除 を MCP server 内で
            完結させる。 コード本文は LLM の応答を一切経由しないため、
            応答 token 制約を受けずに数百行規模のブロックも移動できる。

            抽出範囲の指定 (どちらか一方を使う):
              A) 行範囲: start_line / end_line (1-indexed、 両端含む)
              B) 正規表現アンカー: start_pattern / end_pattern
                 - start_pattern にマッチする最初の行から、 その行以降で
                   end_pattern に最初にマッチする行まで (両端の行を含む)
                 - 関数全体の移動など、 行ずれに強い指定に向く
              両方与えた場合は行範囲 (A) を優先する。

            移動先への挿入位置:
              - dst_anchor_pattern 指定あり: その正規表現に最初にマッチする
                行の直後に挿入
              - dst_anchor_pattern 未指定: dst_insert="end" で末尾、
                dst_insert="start" で先頭に挿入
              - 移動先ファイルが存在しない場合は新規作成し、 ブロックのみを内容とする

            元ファイルからは抽出した行が削除される (前後の改行を保つ)。
            元ファイルへの削除コミットと移動先への追加コミットは別コミット。
            同一リポジトリ / 別リポジトリ、 同一パス不可 (src と dst が
            完全一致する場合はエラー)。

            Args:
              src_owner/src_repo/src_path: 抽出元
              dst_owner/dst_repo/dst_path: 移動先
              message: commit message (必須)。 元削除側は "(remove block) " を
                       前置し、 追加側は "(add block) " を前置して使用する
              start_line/end_line: 行範囲指定 (1-indexed、 両端含む)
              start_pattern/end_pattern: 正規表現アンカー指定 (re.MULTILINE)
              dst_anchor_pattern: 移動先の挿入位置アンカー (正規表現)
              dst_insert: "end" (既定) または "start"。 dst_anchor 未指定時のみ有効
              branch: ブランチ名 (省略時は default branch)。 src/dst 共通
              user_id: the assistant system利用者 ID (任意)。 登録済み PAT を使う
            """
            kernel = ensure_kernel_url()
            if not src_owner or not src_repo or not src_path:
                return "エラー: src_owner / src_repo / src_path は必須です。"
            if not dst_owner or not dst_repo or not dst_path:
                return "エラー: dst_owner / dst_repo / dst_path は必須です。"
            if not message:
                return "エラー: message (commit message) が必須です。"
            if (src_owner, src_repo, src_path) == (dst_owner, dst_repo, dst_path):
                return "エラー: 移動元と移動先が同一ファイルです。別パスを指定してください。"

            use_line_range = bool(start_line and end_line)
            use_pattern = bool(start_pattern and end_pattern)
            if not use_line_range and not use_pattern:
                return ("エラー: 抽出範囲を指定してください。"
                        "start_line+end_line か start_pattern+end_pattern のどちらか。")

            # 1. 元ファイル取得
            try:
                ok, src_content = await _gh_get_file(
                    kernel, src_owner, src_repo, src_path, branch, user_id)
            except Exception as e:
                return "元ファイル取得失敗: " + type(e).__name__ + ": " + str(e)[:200]
            if not ok:
                return src_content  # エラーメッセージ

            src_lines = src_content.split("\n")
            n = len(src_lines)

            # 2. 抽出範囲の決定 (0-indexed の [bi, ei] 両端含む)
            if use_line_range:
                if start_line < 1 or end_line < 1 or start_line > end_line:
                    return ("エラー: 行範囲が不正です "
                            "(1<=start_line<=end_line)。"
                            " start_line=" + str(start_line)
                            + " end_line=" + str(end_line))
                if end_line > n:
                    return ("エラー: end_line がファイル行数を超えています "
                            "(end_line=" + str(end_line)
                            + ", ファイル行数=" + str(n) + ")。")
                bi = start_line - 1
                ei = end_line - 1
            else:
                try:
                    sp = _re.compile(start_pattern)
                    ep = _re.compile(end_pattern)
                except _re.error as e:
                    return "エラー: 正規表現が不正です: " + str(e)
                bi = -1
                for i in range(n):
                    if sp.search(src_lines[i]):
                        bi = i
                        break
                if bi < 0:
                    return ("エラー: start_pattern にマッチする行がありません: "
                            + start_pattern)
                ei = -1
                for i in range(bi, n):
                    if ep.search(src_lines[i]):
                        ei = i
                        break
                if ei < 0:
                    return ("エラー: start_pattern 以降に end_pattern が"
                            "見つかりません: " + end_pattern)

            block_lines = src_lines[bi:ei + 1]
            block_text = "\n".join(block_lines)
            if not block_text.strip():
                return "エラー: 抽出範囲が空白のみです。範囲指定を見直してください。"

            # 3. 移動先ファイル取得 (無ければ新規作成扱い)
            try:
                dst_ok, dst_content = await _gh_get_file(
                    kernel, dst_owner, dst_repo, dst_path, branch, user_id)
            except Exception as e:
                return "移動先取得失敗: " + type(e).__name__ + ": " + str(e)[:200]
            dst_is_new = False
            if not dst_ok:
                if dst_content.startswith("ファイルが存在しません"):
                    dst_is_new = True
                    dst_content = ""
                else:
                    return dst_content  # 取得エラー

            # 4. 移動先へ挿入した新内容を構築
            if dst_is_new or dst_content == "":
                new_dst = block_text + "\n"
            else:
                dst_lines = dst_content.split("\n")
                if dst_anchor_pattern:
                    try:
                        ap = _re.compile(dst_anchor_pattern)
                    except _re.error as e:
                        return "エラー: dst_anchor_pattern が不正です: " + str(e)
                    ai = -1
                    for i in range(len(dst_lines)):
                        if ap.search(dst_lines[i]):
                            ai = i
                            break
                    if ai < 0:
                        return ("エラー: dst_anchor_pattern にマッチする行が"
                                "移動先にありません: " + dst_anchor_pattern)
                    new_dst_lines = (dst_lines[:ai + 1] + block_lines
                                     + dst_lines[ai + 1:])
                elif dst_insert == "start":
                    new_dst_lines = block_lines + dst_lines
                else:
                    # end: 末尾に挿入 (末尾の空行を1つに整える)
                    while dst_lines and dst_lines[-1] == "":
                        dst_lines.pop()
                    new_dst_lines = dst_lines + [""] + block_lines
                new_dst = "\n".join(new_dst_lines)
                if not new_dst.endswith("\n"):
                    new_dst = new_dst + "\n"

            # 5. 元ファイルから抽出ブロックを削除した新内容を構築
            new_src_lines = src_lines[:bi] + src_lines[ei + 1:]
            new_src = "\n".join(new_src_lines)

            # 6. 移動先へ push (先に追加、 失敗時は元を壊さない)
            try:
                p_ok, p_info = await _gh_put_file(
                    kernel, dst_owner, dst_repo, dst_path, new_dst,
                    "(add block) " + message, branch, user_id)
            except Exception as e:
                return "移動先 push 失敗: " + type(e).__name__ + ": " + str(e)[:200]
            if not p_ok:
                return p_info  # エラーメッセージ
            dst_commit = (p_info.get("commit_sha") or "")[:7]
            dst_url = p_info.get("html_url") or ""

            # 7. 元ファイルを push (削除反映)
            try:
                s_ok, s_info = await _gh_put_file(
                    kernel, src_owner, src_repo, src_path, new_src,
                    "(remove block) " + message, branch, user_id)
            except Exception as e:
                return ("移動先には追加済みですが、元ファイルの更新に失敗しました"
                        " (要手動確認): " + type(e).__name__ + ": " + str(e)[:200]
                        + "\n移動先 commit=" + dst_commit)
            if not s_ok:
                return ("移動先には追加済みですが、元ファイルの更新に失敗しました"
                        " (要手動確認): " + s_info
                        + "\n移動先 commit=" + dst_commit)
            src_commit = (s_info.get("commit_sha") or "")[:7]
            src_url = s_info.get("html_url") or ""

            moved = len(block_lines)
            return (
                "ブロック移動を完了しました。\n"
                "- 移動行数: " + str(moved) + " 行\n"
                "- 移動元: " + src_owner + "/" + src_repo + "/" + src_path
                + " (commit " + src_commit + ")\n"
                "- 移動先: " + dst_owner + "/" + dst_repo + "/" + dst_path
                + (" [新規作成]" if dst_is_new else "")
                + " (commit " + dst_commit + ")\n"
                "- 移動元 URL: " + src_url + "\n"
                "- 移動先 URL: " + dst_url
            )

        @mcp.tool()
        async def github_list_workflows(
            owner: str,
            repo: str,
            per_page: int = 50,
            page: int = 1,
            user_id: str = "",
        ) -> str:
            """GitHub Actions のワークフロー定義一覧を取得する。

            .github/workflows/ 配下に置かれているワークフロー YAML ごとに
            id / name / path / state (active|disabled_manually|disabled_inactivity)
            などを返す。

            Args:
                owner:    リポジトリオーナー
                repo:     リポジトリ名
                per_page: 1 ページ件数 (1-100、 default 50)
                page:     ページ番号 (default 1)
                user_id:  the assistant system利用者 ID (任意)。 登録済み PAT を使う
            """
            kernel = ensure_kernel_url()
            if not owner or not repo:
                return "エラー: owner と repo は必須です。"
            try:
                async with _httpx.AsyncClient(timeout=60.0) as client:
                    r = await client.post(
                        kernel + "/core/github/list-workflows",
                        json={"owner": owner, "repo": repo,
                              "per_page": per_page, "page": page,
                              "user_id": user_id},
                    )
                r.raise_for_status()
                d = r.json()
            except Exception as e:
                return "ワークフロー一覧取得失敗: " + type(e).__name__ + ": " + str(e)[:200]
            if not d.get("ok"):
                return "取得失敗: " + str(d.get("error", "unknown"))
            wfs = d.get("workflows") or []
            if not wfs:
                return ("ワークフローはありません: " + owner + "/" + repo
                        + " (total=" + str(d.get("total_count", 0)) + ")")
            lines = ["## " + owner + "/" + repo + " のワークフロー ("
                     + str(d.get("total_count", 0)) + " 件)"]
            for w in wfs:
                lines.append(
                    "- [" + str(w.get("id")) + "] "
                    + str(w.get("name") or "")
                    + " (" + str(w.get("path") or "") + ")"
                    + " state=" + str(w.get("state") or "")
                )
            return "\n".join(lines)

        @mcp.tool()
        async def github_list_workflow_runs(
            owner: str,
            repo: str,
            workflow: str = "",
            branch: str = "",
            event: str = "",
            status: str = "",
            actor: str = "",
            per_page: int = 20,
            page: int = 1,
            user_id: str = "",
        ) -> str:
            """GitHub Actions の実行 (run) 一覧を取得する。

            workflow を指定しない場合はリポジトリ全体の実行一覧。
            workflow を指定する場合はそのワークフローの実行のみ。
            workflow はファイル名 (例: "build.yml") でも id でも可。

            status はビルド状態の絞り込み:
              queued / in_progress / completed / waiting / pending /
              success / failure / cancelled / skipped / timed_out /
              action_required / neutral / stale / requested
            event は workflow_dispatch / push / pull_request / schedule など。

            戻り値は run の主要メタデータ (id / status / conclusion /
            head_branch / head_sha / actor / created_at / html_url 等)。

            Args:
                owner:    リポジトリオーナー
                repo:     リポジトリ名
                workflow: ワークフローファイル名 or id (省略時はリポジトリ全体)
                branch:   ブランチ名で絞り込み (任意)
                event:    イベント種別で絞り込み (任意)
                status:   ステータスで絞り込み (任意)
                actor:    実行者 GitHub ログイン名で絞り込み (任意)
                per_page: 1 ページ件数 (1-100、 default 20)
                page:     ページ番号 (default 1)
                user_id:  the assistant system利用者 ID (任意)
            """
            kernel = ensure_kernel_url()
            if not owner or not repo:
                return "エラー: owner と repo は必須です。"
            payload: dict = {"owner": owner, "repo": repo,
                             "per_page": per_page, "page": page,
                             "user_id": user_id}
            if workflow:
                payload["workflow"] = workflow
            if branch:
                payload["branch"] = branch
            if event:
                payload["event"] = event
            if status:
                payload["status"] = status
            if actor:
                payload["actor"] = actor
            try:
                async with _httpx.AsyncClient(timeout=60.0) as client:
                    r = await client.post(
                        kernel + "/core/github/list-workflow-runs",
                        json=payload,
                    )
                r.raise_for_status()
                d = r.json()
            except Exception as e:
                return "実行一覧取得失敗: " + type(e).__name__ + ": " + str(e)[:200]
            if not d.get("ok"):
                return "取得失敗: " + str(d.get("error", "unknown"))
            runs = d.get("workflow_runs") or []
            total = d.get("total_count", 0)
            header = ("## " + owner + "/" + repo + " のワークフロー実行 "
                      + "(total=" + str(total) + ", 取得=" + str(len(runs)) + " 件"
                      + (", workflow=" + workflow if workflow else "")
                      + (", branch=" + branch if branch else "")
                      + (", status=" + status if status else "")
                      + ")")
            if not runs:
                return header + "\n\n該当する実行はありません。"
            lines = [header, ""]
            for run in runs:
                lines.append(
                    "- run_id=" + str(run.get("id"))
                    + " #" + str(run.get("run_number"))
                    + "." + str(run.get("run_attempt"))
                    + " [" + str(run.get("status") or "")
                    + (" / " + str(run.get("conclusion")) if run.get("conclusion") else "")
                    + "] "
                    + str(run.get("name") or "")
                    + " (" + str(run.get("event") or "") + ", "
                    + str(run.get("head_branch") or "") + "@"
                    + str(run.get("head_sha") or "")
                    + ", by " + str(run.get("actor") or "") + ")"
                )
                if run.get("display_title"):
                    lines.append("    title: " + str(run.get("display_title")))
                lines.append("    started: " + str(run.get("run_started_at") or "")
                             + " updated: " + str(run.get("updated_at") or ""))
                if run.get("html_url"):
                    lines.append("    url: " + str(run.get("html_url")))
            return "\n".join(lines)

        @mcp.tool()
        async def github_get_workflow_run(
            owner: str,
            repo: str,
            run_id: int,
            user_id: str = "",
        ) -> str:
            """ワークフロー実行 1 件の詳細を取得する。

            run_id は github_list_workflow_runs の結果の id を渡す。

            Args:
                owner:   リポジトリオーナー
                repo:    リポジトリ名
                run_id:  実行 ID
                user_id: the assistant system利用者 ID (任意)
            """
            kernel = ensure_kernel_url()
            if not owner or not repo:
                return "エラー: owner と repo は必須です。"
            if not run_id:
                return "エラー: run_id は必須です。"
            try:
                async with _httpx.AsyncClient(timeout=60.0) as client:
                    r = await client.post(
                        kernel + "/core/github/get-workflow-run",
                        json={"owner": owner, "repo": repo,
                              "run_id": int(run_id), "user_id": user_id},
                    )
                r.raise_for_status()
                d = r.json()
            except Exception as e:
                return "実行取得失敗: " + type(e).__name__ + ": " + str(e)[:200]
            if not d.get("ok"):
                return "取得失敗: " + str(d.get("error", "unknown"))
            run = d.get("run") or {}
            lines = [
                "## ワークフロー実行 " + owner + "/" + repo
                + " run_id=" + str(run.get("id")),
                "- name: " + str(run.get("name") or ""),
                "- display_title: " + str(run.get("display_title") or ""),
                "- status: " + str(run.get("status") or "")
                + " / conclusion: " + str(run.get("conclusion") or ""),
                "- event: " + str(run.get("event") or "")
                + " / actor: " + str(run.get("actor") or "")
                + " / triggering_actor: " + str(run.get("triggering_actor") or ""),
                "- head: " + str(run.get("head_branch") or "")
                + "@" + str(run.get("head_sha") or ""),
                "- run_number: " + str(run.get("run_number"))
                + "." + str(run.get("run_attempt")),
                "- created_at: " + str(run.get("created_at") or ""),
                "- run_started_at: " + str(run.get("run_started_at") or ""),
                "- updated_at: " + str(run.get("updated_at") or ""),
                "- workflow_id: " + str(run.get("workflow_id") or ""),
                "- html_url: " + str(run.get("html_url") or ""),
                "- jobs_url: " + str(run.get("jobs_url") or ""),
                "- logs_url: " + str(run.get("logs_url") or ""),
            ]
            return "\n".join(lines)

        @mcp.tool()
        async def github_list_workflow_run_jobs(
            owner: str,
            repo: str,
            run_id: int,
            filter: str = "latest",
            per_page: int = 30,
            page: int = 1,
            user_id: str = "",
        ) -> str:
            """ワークフロー実行内の job 一覧を取得する (各 step の状態を含む)。

            ビルドが失敗したときどのステップで落ちたかを確認するのに使う。

            Args:
                owner:    リポジトリオーナー
                repo:     リポジトリ名
                run_id:   実行 ID
                filter:   "latest" (default) なら最新試行のみ、 "all" は全試行
                per_page: 1 ページ件数 (1-100、 default 30)
                page:     ページ番号 (default 1)
                user_id:  the assistant system利用者 ID (任意)
            """
            kernel = ensure_kernel_url()
            if not owner or not repo:
                return "エラー: owner と repo は必須です。"
            if not run_id:
                return "エラー: run_id は必須です。"
            try:
                async with _httpx.AsyncClient(timeout=60.0) as client:
                    r = await client.post(
                        kernel + "/core/github/list-workflow-run-jobs",
                        json={"owner": owner, "repo": repo,
                              "run_id": int(run_id), "filter": filter,
                              "per_page": per_page, "page": page,
                              "user_id": user_id},
                    )
                r.raise_for_status()
                d = r.json()
            except Exception as e:
                return "job 一覧取得失敗: " + type(e).__name__ + ": " + str(e)[:200]
            if not d.get("ok"):
                return "取得失敗: " + str(d.get("error", "unknown"))
            jobs = d.get("jobs") or []
            total = d.get("total_count", 0)
            header = ("## run_id=" + str(run_id) + " の job 一覧 "
                      + "(total=" + str(total) + ", filter=" + filter + ")")
            if not jobs:
                return header + "\n\njob はありません。"
            lines = [header]
            for j in jobs:
                lines.append("")
                lines.append(
                    "### job " + str(j.get("id"))
                    + ": " + str(j.get("name") or "")
                    + " [" + str(j.get("status") or "")
                    + (" / " + str(j.get("conclusion")) if j.get("conclusion") else "")
                    + "]"
                )
                lines.append("- started: " + str(j.get("started_at") or "")
                             + " completed: " + str(j.get("completed_at") or ""))
                lines.append("- runner: " + str(j.get("runner_name") or "")
                             + " labels=" + str(j.get("labels") or []))
                if j.get("html_url"):
                    lines.append("- url: " + str(j.get("html_url")))
                steps = j.get("steps") or []
                if steps:
                    lines.append("- steps:")
                    for s in steps:
                        lines.append(
                            "  " + str(s.get("number") or "?") + ". "
                            + str(s.get("name") or "")
                            + " [" + str(s.get("status") or "")
                            + (" / " + str(s.get("conclusion")) if s.get("conclusion") else "")
                            + "]"
                        )
            return "\n".join(lines)

        @mcp.tool()
        async def github_dispatch_workflow(
            owner: str,
            repo: str,
            workflow: str,
            ref: str,
            inputs: dict | None = None,
            user_id: str = "",
        ) -> str:
            """GitHub Actions ワークフローを手動トリガーする (workflow_dispatch)。

            コンテナビルド & レジストリ push 等を kick するのが代表的用途。
            対象ワークフローには `on: workflow_dispatch:` トリガーが
            定義されている必要がある (定義されていないと 422 が返る)。

            GitHub 仕様により 204 No Content の応答に run_id は含まれない。
            トリガー直後 1-2 秒後に github_list_workflow_runs で
            workflow + branch を絞って最新 run を特定すること。

            Args:
                owner:    リポジトリオーナー
                repo:     リポジトリ名
                workflow: ワークフローファイル名 (例: "build.yml") または id
                ref:      branch 名 / tag 名 / commit SHA
                inputs:   workflow_dispatch.inputs に渡す引数 (任意)。
                          値は文字列化されて送られる
                user_id:  the assistant system利用者 ID (任意)
            """
            kernel = ensure_kernel_url()
            if not owner or not repo:
                return "エラー: owner と repo は必須です。"
            if not workflow:
                return "エラー: workflow は必須です。"
            if not ref:
                return "エラー: ref は必須です。"
            payload: dict = {"owner": owner, "repo": repo,
                             "workflow": workflow, "ref": ref,
                             "user_id": user_id}
            if inputs:
                payload["inputs"] = dict(inputs)
            try:
                async with _httpx.AsyncClient(timeout=60.0) as client:
                    r = await client.post(
                        kernel + "/core/github/dispatch-workflow",
                        json=payload,
                    )
                r.raise_for_status()
                d = r.json()
            except Exception as e:
                return "dispatch 失敗: " + type(e).__name__ + ": " + str(e)[:200]
            if not d.get("ok"):
                return "dispatch 失敗: " + str(d.get("error", "unknown"))
            return (
                "ワークフローを起動しました。\n"
                "- workflow: " + str(d.get("workflow") or "") + "\n"
                "- ref: " + str(d.get("ref") or "") + "\n"
                "- inputs: " + str(d.get("inputs") or {}) + "\n"
                "- 注: " + str(d.get("note") or "")
            )

