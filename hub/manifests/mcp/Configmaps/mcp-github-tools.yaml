            lines.append("- id: " + str(p.get("id") or ""))
            lines.append("- title: " + str(p.get("title") or ""))
            lines.append("- url: " + str(p.get("url") or ""))
            lines.append("- closed: " + str(bool(p.get("closed"))))
            return "\n".join(lines)


        @mcp.tool()
        async def github_project_get_fields(
            org: str,
            number: int,
            user_id: str = "",
        ) -> str:
            """ProjectV2 のフィールド定義一覧を取得する。

            Status のような SingleSelect field は options (= カンバンの
            カラム名) も併せて返す。 update-item-field でカラム移動する
            ときに必要な field_id / option_id をここで確認する。
            """
            kernel = ensure_kernel_url()
            try:
                async with _httpx.AsyncClient(timeout=30.0) as client:
                    r = await client.post(
                        kernel + "/core/github/project/get-fields",
                        json={"org": org, "number": int(number),
                              "user_id": user_id},
                    )
                r.raise_for_status()
                d = r.json()
            except Exception as e:
                return ("project fields 取得失敗: " + type(e).__name__ + ": "
                        + str(e)[:200])
            if not d.get("ok"):
                return "取得失敗: " + str(d.get("error", "unknown"))
            fields = d.get("fields") or []
            header = ("## ProjectV2: " + org + "/projects/" + str(number)
                      + ' "' + str(d.get("project_title") or "") + '"'
                      + " (id=" + str(d.get("project_id") or "") + ")")
            lines = [header, "fields=" + str(len(fields)), ""]
            for f in fields:
                lines.append("- [" + str(f.get("id") or "") + '] "'
                             + str(f.get("name") or "") + '" ('
                             + str(f.get("data_type") or "") + ", "
                             + str(f.get("typename") or "") + ")")
                opts = f.get("options") or []
                if opts:
                    lines.append("    options:")
                    for o in opts:
                        lines.append('      - [' + str(o.get("id") or "")
                                     + '] "' + str(o.get("name") or "") + '"')
                its = f.get("iterations") or []
                if its:
                    lines.append("    iterations:")
                    for it in its:
                        lines.append('      - [' + str(it.get("id") or "")
                                     + '] "' + str(it.get("title") or "")
                                     + '" (' + str(it.get("startDate") or "")
                                     + ", " + str(it.get("duration") or "")
                                     + "d)")
                cits = f.get("completed_iterations") or []
                if cits:
                    lines.append("    completed_iterations: "
                                 + str(len(cits)) + " 件")
            return "\n".join(lines)


        @mcp.tool()
        async def github_project_list_items(
            org: str,
            number: int,
            first: int = 50,
            after: str = "",
            user_id: str = "",
        ) -> str:
            """ProjectV2 の Item 一覧 (Issue/PR + フィールド値) を取得する。

            ページングは has_next=True が返ってきたら次回呼び出しで
            after=<前回の next_cursor> を渡す。 first は 1-100。

            Args:
                org: organization 名
                number: project 番号
                first: 1 ページ件数 (1-100、 default 50)
                after: ページング cursor
                user_id: the assistant system利用者 ID (任意)
            """
            kernel = ensure_kernel_url()
            try:
                async with _httpx.AsyncClient(timeout=60.0) as client:
                    r = await client.post(
                        kernel + "/core/github/project/list-items",
                        json={"org": org, "number": int(number),
                              "first": int(first), "after": after,
                              "user_id": user_id},
                    )
                r.raise_for_status()
                d = r.json()
            except Exception as e:
                return ("project items 取得失敗: " + type(e).__name__ + ": "
                        + str(e)[:200])
            if not d.get("ok"):
                return "取得失敗: " + str(d.get("error", "unknown"))
            items = d.get("items") or []

            # Status 集計
            status_counts = {}
            for it in items:
                fmap = it.get("fields") or {}
                s = fmap.get("Status")
                key = str(s) if s is not None else "(none)"
                status_counts[key] = status_counts.get(key, 0) + 1

            lines = []
            lines.append("## ProjectV2: " + org + "/projects/" + str(number)
                         + " (id=" + str(d.get("project_id") or "") + ")")
            lines.append("items=" + str(len(items))
                         + ", has_next=" + str(bool(d.get("has_next")))
                         + ", next_cursor="
                         + str(d.get("next_cursor") or "null"))
            if status_counts:
                lines.append("")
                lines.append("### Status breakdown")
                for k in sorted(status_counts.keys()):
                    lines.append("- " + k + ": " + str(status_counts[k]))
            lines.append("")
            lines.append("### Items")
            for it in items:
                c = it.get("content") or {}
                fmap = it.get("fields") or {}
                repo_full = c.get("repository") or ""
                num = c.get("number")
                ref = ""
                if repo_full and num:
                    ref = repo_full + "#" + str(num)
                elif c.get("title"):
                    ref = "(draft)"
                type_str = str(it.get("type") or "?")
                state_str = str(c.get("state") or "")
                head = ("- [" + str(it.get("item_id") or "") + "] "
                        + ref + " [" + type_str
                        + (("," + state_str) if state_str else "") + "]")
                fv_parts = []
                for k in fmap:
                    v = fmap[k]
                    if v is None or v == "":
                        continue
                    fv_parts.append(str(k) + '="' + str(v) + '"')
                if fv_parts:
                    head += " | " + " | ".join(fv_parts)
                lines.append(head)
                title = c.get("title") or ""
                if title:
                    lines.append("    " + title)
            return "\n".join(lines)


        @mcp.tool()
        async def github_project_update_item_field(
            item_id: str,
            org: str = "",
            number: int = 0,
            field_name: str = "",
            option_name: str = "",
            project_id: str = "",
            field_id: str = "",
            value_type: str = "",
            value: str = "",
            user_id: str = "",
        ) -> str:
            """ProjectV2 Item のフィールド値を更新する (カラム移動など)。

            2 通りの呼び方:

            A) 名前ベース (おすすめ、 SingleSelect 用):
               item_id, org, number, field_name, option_name を指定。
               例: org="example-org", number=11, field_name="Status",
                   option_name="画面機能"

            B) ID 全指定 (text/number/date/iteration 用):
               item_id, project_id, field_id, value_type, value を指定。
               value_type: "single_select" | "text" | "number" | "date"
                           | "iteration"

            field のクリア (値を空にする) は未サポート。

            Args:
                item_id: 対象 Item の Node ID (PVTI_xxx)
                org, number: 名前ベース呼び出し時の project 識別子
                field_name, option_name: 名前ベース呼び出し時
                project_id, field_id, value_type, value: ID ベース呼び出し時
                user_id: the assistant system利用者 ID (任意)
            """
            kernel = ensure_kernel_url()
            body = {
                "item_id": item_id,
                "org": org,
                "number": int(number),
                "field_name": field_name,
                "option_name": option_name,
                "project_id": project_id,
                "field_id": field_id,
                "value_type": value_type,
                "value": value,
                "user_id": user_id,
            }
            try:
                async with _httpx.AsyncClient(timeout=30.0) as client:
                    r = await client.post(
                        kernel + "/core/github/project/update-item-field",
                        json=body,
                    )
                r.raise_for_status()
                d = r.json()
            except Exception as e:
                return ("update-item-field 失敗: " + type(e).__name__ + ": "
                        + str(e)[:200])
            if not d.get("ok"):
                return "更新失敗: " + str(d.get("error", "unknown"))
            return ("OK: item_id=" + str(d.get("item_id") or item_id)
                    + " を更新しました")


