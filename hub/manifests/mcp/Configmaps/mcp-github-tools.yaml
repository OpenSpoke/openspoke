        @mcp.tool()
        async def github_search_issues(
            q: str,
            sort: str = "",
            order: str = "desc",
            per_page: int = 30,
            page: int = 1,
            user_id: str = "",
        ) -> str:
            """GitHub の検索 API で Issue / PR を横断検索する。

            q には GitHub の検索構文をそのまま渡す (kernel 側で解釈しない
            透過プロキシ)。 構文の代表例:

              - リポジトリ指定: "repo:your-org/your-repo"
              - 種別: "is:issue" / "is:pr" / "is:open" / "is:closed" /
                      "is:merged" / "is:draft"
              - 担当: "author:your-user" / "assignee:your-user" /
                      "mentions:your-user" / "involves:your-user" /
                      "review-requested:your-user"
              - ラベル: "label:bug" / 'label:"good first issue"' /
                       "-label:wontfix" (除外)
              - 日付: "created:>=2026-01-01" / "updated:>=2026-01-01" /
                      "closed:<2025-12-31"
              - ソート: "sort:updated-desc" (q 内に書くか sort 引数で)

            複合例:
              "repo:your-org/your-repo is:open is:issue label:bug"
              "is:pr review-requested:your-user is:open"
              "author:your-user is:closed closed:>=2026-05-01"

            並び替え:
              sort: comments / reactions / reactions-+1 / interactions /
                    created / updated。 空文字なら best match (関連度順)。
              order: asc / desc (default desc)。

            注意: GitHub の検索 API は 1 リクエストあたり 1000 件まで
            (per_page * page <= 1000)。 古いデータが必要なら絞り込みを
            厳しくする。 認証ありで毎分 30 リクエストのレート制限あり。

            Args:
                q:        GitHub 検索構文 (必須)
                sort:     並び替え軸 (任意、 空文字で best match)
                order:    asc / desc (default desc)
                per_page: 1 ページ件数 (1-100、 default 30)
                page:     ページ番号 (default 1)
                user_id:  the assistant system利用者 ID (任意)
            """
            kernel = ensure_kernel_url()
            if not q or not q.strip():
                return "エラー: q (検索クエリ) は必須です。"
            payload: dict = {"q": q, "order": order,
                             "per_page": per_page, "page": page,
                             "user_id": user_id}
            if sort:
                payload["sort"] = sort
            try:
                async with _httpx.AsyncClient(timeout=60.0) as client:
                    r = await client.post(
                        kernel + "/core/github/search-issues",
                        json=payload,
                    )
                r.raise_for_status()
                d = r.json()
            except Exception as e:
                return ("検索失敗: " + type(e).__name__ + ": "
                        + str(e)[:200])
            if not d.get("ok"):
                return "検索失敗: " + str(d.get("error", "unknown"))
            items = d.get("items") or []
            total = d.get("total_count", 0)
            incomplete = d.get("incomplete_results")
            header = ("## 検索結果 q=`" + q + "` "
                      + "(total=" + str(total)
                      + ", 取得=" + str(len(items)) + " 件"
                      + (", incomplete" if incomplete else "")
                      + ")")
            if not items:
                return header + "\n\n該当なし。"
            lines = [header, ""]
            for it in items:
                kind = "PR" if it.get("is_pr") else "Issue"
                if it.get("draft"):
                    kind = "PR(draft)"
                lines.append(
                    "- [" + kind + "] "
                    + str(it.get("repository_url") or "").replace(
                        "https://api.github.com/repos/", "")
                    + "#" + str(it.get("number"))
                    + " [" + str(it.get("state") or "")
                    + (" / " + str(it.get("state_reason"))
                       if it.get("state_reason") else "")
                    + "] " + str(it.get("title") or "")
                )
                meta = []
                if it.get("user"):
                    meta.append("by @" + str(it.get("user")))
                if it.get("assignees"):
                    meta.append("assignees=" + ",".join(it.get("assignees")))
                if it.get("labels"):
                    meta.append("labels=" + ",".join(it.get("labels")))
                if it.get("comments") is not None:
                    meta.append("comments=" + str(it.get("comments")))
                if meta:
                    lines.append("    " + " | ".join(meta))
                lines.append("    created=" + str(it.get("created_at") or "")
                             + " updated=" + str(it.get("updated_at") or ""))
                if it.get("html_url"):
                    lines.append("    url: " + str(it.get("html_url")))
            return "\n".join(lines)

