        # ========================================================
        # システム全容ブリーフィング (Claude 横断セッション継続用)
        # ========================================================
        #
        # 目的: 別プロジェクト・別スレッドの Claude が、the operator's
        # システム全体を即座に理解して仕事を始められるようにする。
        # ツール一覧の説明文に「最初に必ず呼ぶ」と書いておくことで
        # Claude の自発的呼び出しを誘発する。
        #
        # 構成: 3 つのツール
        #   system_brief()        — 全体像の一発配信 (引数なし)
        #   system_lookup(topic)  — 詳細トピックの引き出し
        #   system_topics()       — 利用可能 topic 一覧 (動的)
        #
        # データの在処 (2026-05-25 移行):
        #   既存の知識ベース (Milvus) に格納している。
        #   namespace: "your-user" (= collection: secretary_knowledge_your_user)
        #   id 規約:
        #     - _handoff_brief                 : system_brief 本文
        #     - _handoff_topic_<トピック名>     : system_lookup 各トピック本文
        #     - _handoff_summary_<トピック名>   : system_topics 用の短い説明
        #
        # 更新方法:
        #   Claude は upsert_knowledge ツールを呼ぶだけ。
        #   Pod 再起動・コネクター再接続いずれも不要。
        #   次の呼び出しから新内容が反映される。
        #
        # フォールバック:
        #   knowledge 取得に失敗した場合は、 その旨をエラーメッセージで返す。
        #   knowledge 不在時は「初期投入が必要」 と案内する。

        _HANDOFF_NAMESPACE = "your-user"
        _HANDOFF_COLLECTION = "secretary_knowledge_your_user"
        _HANDOFF_BRIEF_ID = "_handoff_brief"
        _HANDOFF_TOPIC_PREFIX = "_handoff_topic_"
        _HANDOFF_SUMMARY_PREFIX = "_handoff_summary_"

        # kernel URL は hub_tools.py 冒頭で _KERNEL_URL として定義済み

        async def _handoff_fetch_one(entry_id: str) -> str | None:
            """knowledge から 1 エントリの content を取得する。
            存在しないか取得失敗時は None を返す。
            """
            try:
                async with httpx.AsyncClient(timeout=30.0) as c:
                    r = await c.post(
                        f"{_KERNEL_URL}/core/vectorstore/query",
                        json={
                            "namespace": _HANDOFF_COLLECTION,
                            "expr": f'id == "{entry_id}"',
                            "output_fields": ["id", "title", "content"],
                            "limit": 1,
                        },
                    )
                if r.status_code != 200:
                    logger.warning(
                        "[handoff] kernel http=%s body=%s",
                        r.status_code, r.text[:200]
                    )
                    return None
                data = r.json()
                if not data.get("ok"):
                    return None
                results = data.get("results") or []
                if not results:
                    return None
                return results[0].get("content") or ""
            except Exception as e:
                logger.error("[handoff] fetch error: %s", e)
                return None

        async def _handoff_fetch_all_topics() -> list:
            """_handoff_topic_* の全エントリを取得して
            [(topic_name, title), ...] を返す (本文は含まない、 一覧用)。
            """
            try:
                # Milvus は LIKE がないので、 prefix で expr を組めない。
                # 代わりに id field の中身を全件取得して filter する。
                # secretary_knowledge_your_user 全体の件数を考えると、
                # limit=1000 で十分カバーできる。
                async with httpx.AsyncClient(timeout=30.0) as c:
                    r = await c.post(
                        f"{_KERNEL_URL}/core/vectorstore/query",
                        json={
                            "namespace": _HANDOFF_COLLECTION,
                            "expr": 'id != ""',
                            "output_fields": ["id", "title"],
                            "limit": 1000,
                        },
                    )
                if r.status_code != 200:
                    logger.warning(
                        "[handoff] kernel list http=%s body=%s",
                        r.status_code, r.text[:200]
                    )
                    return []
                data = r.json()
                if not data.get("ok"):
                    return []
                results = data.get("results") or []
                topics = []
                for it in results:
                    eid = it.get("id") or ""
                    if eid.startswith(_HANDOFF_TOPIC_PREFIX):
                        name = eid[len(_HANDOFF_TOPIC_PREFIX):]
                        topics.append((name, it.get("title") or ""))
                topics.sort(key=lambda x: x[0])
                return topics
            except Exception as e:
                logger.error("[handoff] list error: %s", e)
                return []

        async def _handoff_fetch_summary(topic_name: str) -> str:
            """_handoff_summary_<name> エントリから短い説明を取得する。
            存在しなければ空文字を返す。
            """
            entry_id = f"{_HANDOFF_SUMMARY_PREFIX}{topic_name}"
            content = await _handoff_fetch_one(entry_id)
            return content or ""

        _HANDOFF_BOOTSTRAP_MESSAGE = (
            "# system_brief 本文が未投入です\n"
            "\n"
            "knowledge base (namespace='your-user', id='_handoff_brief')\n"
            "に system_brief 本文が格納されていません。\n"
            "\n"
            "To the operator: 初期データ投入が必要です。 Claude に\n"
            "「system_brief の初期データを投入して」 と頼んでください。\n"
            "Claude が upsert_knowledge ツールで全コンテンツを\n"
            "投入します。\n"
        )

        @mcp.tool()
        async def system_brief() -> str:
            """**最初に必ずこのツールを呼んでください。**

            the operator (your-user) のシステム全体の地図を一発で返します。
            別プロジェクト・別スレッドの Claude がこのシステムを触る前に
            読むべき必須情報 (Standalone Fleet マルチクラスター GitOps、
            ハブ&スポーク構成、リポジトリ構造、絶対禁則、命名規則、
            この MCP サーバ自身の在処、主要トピックの索引) を含みます。

            詳細トピックは system_lookup(topic=...) で引いてください。
            利用可能トピックの一覧は system_topics() で取得できます。

            Args: なし
            """
            notice = await _acl_scope_notice()
            # 非 admin には本文を返さない (handoff_brief には全モジュール / 全クラスタの
            # カタログが含まれており、 非 admin に渡すと Claude がそれを情報源にして
            # 範囲外リソース名を列挙してしまうため)。
            acl = None
            if _get_current_acl_async is not None:
                try:
                    acl = await _get_current_acl_async()
                except Exception:
                    pass
            is_admin = bool(acl and acl.get("is_admin"))
            if not is_admin:
                stub = (
                    "## 使えるツール\n\n"
                    "- `my_acl()` — 利用可能なリソースを確認\n"
                    "- `ledger_overview()` — モジュール台帳\n"
                    "- `ledger_module(name=...)` — 個別モジュールの詳細\n"
                    "- `cluster_*` 系ツール — クラスタへの操作\n\n"
                    "各ツールの詳細は docstring を参照してください。\n"
                )
                return notice + stub
            content = await _handoff_fetch_one(_HANDOFF_BRIEF_ID)
            if content is None:
                return notice + _HANDOFF_BOOTSTRAP_MESSAGE
            return notice + content

        @mcp.tool()
        async def system_lookup(topic: str) -> str:
            """system_brief で示されたトピックの詳細を返します。

            利用可能な topic 値の最新一覧は system_topics() を呼んで
            取得してください。トピックは随時追加されるため、この docstring
            には個別の topic 名を列挙しません (列挙すると新トピック追加の
            たびにコネクター再接続が必要になるため)。

            このツールは knowledge base から都度取得するため、 知識更新は
            Pod 再起動・コネクター再接続いずれも不要で反映されます。

            Args:
                topic: system_topics() で得た topic 名のいずれか。
                       先頭に '#' は付けない。
            """
            # 非 admin はアクセス全拒否 (topic 本文はシステム全体の俯瞰情報を含むため)。
            acl = None
            if _get_current_acl_async is not None:
                try:
                    acl = await _get_current_acl_async()
                except Exception:
                    pass
            is_admin = bool(acl and acl.get("is_admin"))
            if not is_admin:
                return "該当する情報はありません。"
            t = (topic or "").strip().lstrip("#").lower()
            if not t:
                return ("topic を指定してください。利用可能トピックは "
                        "system_topics() で取得できます。")
            # Milvus id 規約により knowledge base 側はアンダースコア区切り。
            # ユーザー入力は `-` でも `_` でも受け付け、内部で `_` に正規化する。
            t = t.replace("-", "_")
            entry_id = f"{_HANDOFF_TOPIC_PREFIX}{t}"
            content = await _handoff_fetch_one(entry_id)
            if content is None:
                topics = await _handoff_fetch_all_topics()
                if not topics:
                    return _HANDOFF_BOOTSTRAP_MESSAGE
                names = ", ".join(name for name, _ in topics)
                return (f"未知の topic '{topic}'。利用可能: {names}")
            return content

        @mcp.tool()
        async def system_topics() -> str:
            """system_lookup で引ける topic 値の最新一覧を返します。

            system_brief を呼んだ後、詳細を引きたいときに使ってください。
            このツール自体の説明文 (docstring) は不変なので、新トピックが
            追加されてもコネクター再接続なしで最新一覧を取得できます。

            データは knowledge base から都度取得するため、 トピック追加・
            削除も Pod 再起動なしで反映されます。

            Args: なし
            """
            notice = await _acl_scope_notice()
            # 非 admin にはトピック一覧を返さない (トピック名自体が範囲外モジュール /
            # クラスタの存在を示唆する情報源になりうるため)。
            acl = None
            if _get_current_acl_async is not None:
                try:
                    acl = await _get_current_acl_async()
                except Exception:
                    pass
            is_admin = bool(acl and acl.get("is_admin"))
            if not is_admin:
                stub = (
                    "## topic 一覧\n\n"
                    "現在利用可能な topic はありません。\n"
                    "利用可能なリソースは `my_acl()` / `ledger_overview()` で取得してください。"
                )
                return notice + stub
            topics = await _handoff_fetch_all_topics()
            if not topics:
                return notice + _HANDOFF_BOOTSTRAP_MESSAGE
            lines = [f"## system_lookup の topic 一覧 ({len(topics)} 件)\n"]
            for name, _title in topics:
                summary = await _handoff_fetch_summary(name)
                if summary:
                    lines.append(f"- `{name}` — {summary}")
                else:
                    lines.append(f"- `{name}`")
            lines.append("")
            lines.append("使い方: system_lookup(topic='<上記のいずれか>')")
            return notice + "\n".join(lines)

        @mcp.tool()
        async def spawn(
            prompt: str,
            alias: str = "",
            label: str = "",
            model: str = "",
            timeout_sec: int = 1800,
            priority: str = "normal",
            context: str = "",
            user_id: str = "",
            project_id: str = "",
            is_supervisor: bool = False,
            parent_supervisor: str = "",
            mode: str = "claude",
        ) -> str:
            """並列スポーンで作業を非同期投入する。 対話 Claude はこの tool を叩いた直後に次の会話に戻れる。

            worker Claude が別プロセスで作業を進め、結果を確認するには get_spawn_result で照会。
            進行中の spawn は list_spawns、 相談待ちは list_spawn_questions で見られる。

            **管理スポーン (supervisor spawn)**: is_supervisor=True で起動すると、system prompt が
            supervisor 用に切り替わり、MAX_TURNS=20 / MAX_TOOL_ITERATIONS=50、 timeout 最小 4 時間で
            長時間動作するモードになる。 supervisor 自身が spawn tool で子スポーンを起票し、
            parent_supervisor に自分の full_id を指定することで managed_spawns 関係が記録される。

            Args:
                prompt: worker Claude に渡す作業指示 (必須)
                alias: 別名 (例: "並列スポーン開発")。 会話で spawn を短く指せる
                label: 対話スレッドで参照する短い名前 (alias とほぼ同義、内部識別用)
                model: 使用モデル (省略時は kernel の CLAUDE_MODEL)
                timeout_sec: 全体タイムアウト秒 (default 1800、 supervisor は最小 14400 に自動延長)
                priority: high / normal / low
                context: worker に渡す背景情報 (関連 topic 名、参考 path 等)
                user_id: 投入者 (省略時は OAuth session から自動取得)
                project_id: 所属プロジェクト ID (proj-hex8)。 省略時は未所属
                is_supervisor: True で管理スポーンとして起動 (default False)
                parent_supervisor: 親管理スポーンの full_id。 supervisor が子を起票する際に指定すると、
                                    親の managed_spawns に自動追加される
                mode: 処理モード。 "claude" (default) は Claude Sonnet 直行、
                      "orchestrator" は gemma2 で triage 判定してから
                      simple なら gemma2 単独回答、 complex なら Claude tier (light/standard/advanced) を
                      自動選択して実行。 simple な質問は gemma2 単独回答なので Claude API コストゼロ。
            Returns:
                "OK: full_id=spawn-NN-hex8 serial=NN alias=... state=queued" または "エラー: ..."
            """
            if not user_id:
                try:
                    acl = await _get_current_acl_async()
                    user_id = (acl or {}).get("username") or ""
                except Exception:
                    user_id = ""

            payload = {
                "prompt": prompt,
                "alias": alias,
                "label": label,
                "model": model,
                "timeout_sec": timeout_sec,
                "priority": priority,
                "context": context,
                "user_id": user_id,
                "project_id": project_id,
                "is_supervisor": is_supervisor,
                "parent_supervisor": parent_supervisor,
                "mode": mode,
            }
            try:
                async with httpx.AsyncClient(timeout=15.0) as c:
                    r = await c.post(f"{_KERNEL_URL}/core/spawn/submit", json=payload)
                if r.status_code != 200:
                    return f"エラー: kernel http={r.status_code} {r.text[:200]}"
                res = r.json()
                if not res.get("ok"):
                    return f"エラー: {res.get('error') or '未知のエラー'}"
                return (
                    f"OK: full_id={res.get('full_id')} serial=spawn-{res.get('serial')} "
                    f"alias={res.get('alias')!r} state=queued user_id={user_id!r}"
                )
            except Exception as e:
                logger.warning(f"[spawn] failed: {e}")
                return f"エラー: {type(e).__name__}: {str(e)[:200]}"

        @mcp.tool()
        async def list_spawns(
            state: str = "",
            limit: int = 50,
            include_result: bool = False,
            user_id: str = "",
        ) -> str:
            """投入済み spawn の一覧を新しい順に返す。

            Args:
                state: フィルタ (queued / running / waiting_user / done / failed / cancel_requested / cancelled)。 空なら全部
                limit: 最大件数 (default 50, max 500)
                include_result: True なら done/failed の本文も含める
                user_id: 特定ユーザーで絞る (空なら全ユーザー)
            Returns:
                複数行テキスト
            """
            payload = {"state": state, "limit": limit, "include_result": include_result, "user_id": user_id}
            try:
                async with httpx.AsyncClient(timeout=15.0) as c:
                    r = await c.post(f"{_KERNEL_URL}/core/spawn/list", json=payload)
                if r.status_code != 200:
                    return f"エラー: kernel http={r.status_code} {r.text[:200]}"
                res = r.json()
                if not res.get("ok"):
                    return f"エラー: {res.get('error') or '未知のエラー'}"
                spawns = res.get("spawns") or []
                if not spawns:
                    return "spawn は 0 件です。"
                lines = [f"合計 {res.get('count', len(spawns))} 件:"]
                for s in spawns:
                    serial = s.get('serial') or '??'
                    alias = s.get('alias') or ''
                    alias_str = f" [{alias}]" if alias else ""
                    lines.append(
                        f"- spawn-{serial}{alias_str} state={s.get('state')} "
                        f"user={s.get('user_id')!r} priority={s.get('priority')} "
                        f"submitted={s.get('submitted_at')} full_id={s.get('full_id')}"
                    )
                return "\n".join(lines)
            except Exception as e:
                logger.warning(f"[list_spawns] failed: {e}")
                return f"エラー: {type(e).__name__}: {str(e)[:200]}"

        @mcp.tool()
        async def get_spawn_result(spawn_ref: str) -> str:
            """指定 spawn の state と結果 (done なら本文、 failed ならエラー) を返す。

            Args:
                spawn_ref: 通番 (例: "04" or "spawn-04") / フル ID (spawn-04-a3f1c9e2) / 別名 のいずれか
            Returns:
                複数行テキスト
            """
            if not spawn_ref:
                return "エラー: spawn_ref が空です"
            payload = {"spawn_ref": spawn_ref}
            try:
                async with httpx.AsyncClient(timeout=15.0) as c:
                    r = await c.post(f"{_KERNEL_URL}/core/spawn/get", json=payload)
                if r.status_code != 200:
                    return f"エラー: kernel http={r.status_code} {r.text[:200]}"
                res = r.json()
                if not res.get("ok"):
                    return f"エラー: {res.get('error') or '未知のエラー'}"
                s = res.get("spawn") or {}
                serial = s.get('serial') or '??'
                alias = s.get('alias') or ''
                alias_str = f" [{alias}]" if alias else ""
                lines = [
                    f"spawn-{serial}{alias_str}",
                    f"full_id: {s.get('full_id')}",
                    f"state: {s.get('state')}",
                    f"user_id: {s.get('user_id')}",
                    f"label: {s.get('label')!r}",
                    f"model: {s.get('model')}",
                    f"priority: {s.get('priority')}",
                    f"submitted_at: {s.get('submitted_at')}",
                    f"started_at: {s.get('started_at')}",
                    f"finished_at: {s.get('finished_at')}",
                    f"worker_id: {s.get('worker_id')}",
                ]
                if s.get("state") == "done" and s.get("result"):
                    lines.append("--- result ---")
                    lines.append(str(s.get("result")))
                if s.get("state") == "failed" and s.get("error_body"):
                    lines.append("--- error ---")
                    lines.append(str(s.get("error_body")))
                return "\n".join(lines)
            except Exception as e:
                logger.warning(f"[get_spawn_result] failed: {e}")
                return f"エラー: {type(e).__name__}: {str(e)[:200]}"

        @mcp.tool()
        async def cancel_spawn(spawn_ref: str) -> str:
            """指定 spawn を cancel する。 queued 中なら即 cancelled、 running 中なら cancel_requested を書く。

            Args:
