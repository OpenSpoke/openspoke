        @mcp.tool()
        async def cluster_fleet_agent_install(
            cluster: str,
            values_yaml: str,
        ) -> str:
            """指定クラスタに fleet-agent をインストールし、 新 Fleet サーバ
            (fleet-api.example.com) の管理下に置く。

            中央ハブが cluster で指定されたスポーク MCP の fleet_agent_install を
            MCP プロトコル経由で呼び出す。 スポーク MCP の Pod は cluster-admin
            権限を持つので、 fleet-agent の ServiceAccount や ClusterRoleBinding を
            含む一式を downstream クラスタ内で apply できる。

            既存 fleet-agent (旧 Rancher 内蔵 Fleet 由来) があれば削除してから
            新規 fleet-agent を作成する。

            Args:
                cluster:     対象クラスタ名 (list_clusters で確認)
                values_yaml: Fleet サーバで発行された ClusterRegistrationToken の
                             Secret から取り出した values.yaml の中身。
                             必須キー: apiServerURL, token, clusterNamespace,
                             systemRegistrationNamespace。 apiServerCA は空文字可。
            """
            result = await _spoke_call(cluster, "fleet_agent_install", {
                "values_yaml": values_yaml,
            })

            # 成功時のみ DB 更新 (best-effort)
            try:
                from datetime import datetime as _dt_a, timezone as _tz_a
                if isinstance(result, str) and "ERROR" not in result.upper():
                    fields = {
                        "agent_installed_at": _dt_a.now(_tz_a.utc).isoformat(),
                        "migration_status": "agent-installed",
                    }
                    # 旧 helm release が削除されたかも記録 (旧 Rancher 内蔵
                    # Fleet 由来の状態が一掃された証拠として)
                    if "helm release secrets removed" in result:
                        fields["legacy_fleet_cleaned_up_at"] = (
                            _dt_a.now(_tz_a.utc).isoformat())
                    _update_cluster_doc(cluster, **fields)
            except Exception as _e:
                logger.error("[hub_tools] fleet_state auto-update failed "
                             "(agent_install): %s", _e)

            return result

        @mcp.tool()
        async def cluster_fleet_token_create(
            cluster: str,
            target_cluster_name: str,
            ttl: str = "1h",
            fleet_namespace: str = "fleet-default",
        ) -> str:
            """Fleet サーバが乗っているクラスタで、 新規スポーククラスタ用の
            ClusterRegistrationToken を発行し、 values.yaml と clientID を返す。

            中央ハブが cluster (= Fleet manager が乗っているクラスタ、 現状 "rancher")
            のスポーク MCP の fleet_token_create を MCP プロトコル経由で呼び出す。

            戻り値には:
              - values_yaml: そのまま cluster_fleet_agent_install に渡すべき YAML
              - client_id:   後続の cluster_fleet_cluster_label に渡すべき ID
            が含まれる。

            Args:
                cluster:             Fleet manager が乗っているクラスタ名
                                     (現状 "rancher"。 将来別クラスタに移動可能)
                target_cluster_name: ClusterRegistrationToken の name
                                     (例: "example-cluster"。 Secret 名も同じになる)
                ttl:                 token の TTL (default "1h")
                fleet_namespace:     通常 "fleet-default"
            """
            result = await _spoke_call(cluster, "fleet_token_create", {
                "target_cluster_name": target_cluster_name,
                "ttl": ttl,
                "fleet_namespace": fleet_namespace,
            })

            # 成功時のみ DB 更新 (best-effort、 失敗してもツール本体は成功扱い)。
            # client_id はスポークのレスポンス本文から取り出す (失敗しても
            # 致命的ではない)。
            try:
                from datetime import datetime as _dt_t, timezone as _tz_t
                if isinstance(result, str) and "ERROR" not in result.upper():
                    cid = ""
                    for line in result.splitlines():
                        if line.startswith("client_id:"):
                            cid = line.split(":", 1)[1].strip()
                            break
                    fields = {
                        "token_issued_at": _dt_t.now(_tz_t.utc).isoformat(),
                        "fleet_manager_cluster": cluster,
                        "migration_status": "in-progress",
                    }
                    if cid:
                        fields["client_id"] = cid
                    _update_cluster_doc(target_cluster_name, **fields)
            except Exception as _e:
                logger.error("[hub_tools] fleet_state auto-update failed "
                             "(token_create): %s", _e)

            return result

        @mcp.tool()
        async def cluster_fleet_cluster_label(
            cluster: str,
            client_id: str,
            cluster_name_label: str,
            fleet_namespace: str = "fleet-default",
            timeout_seconds: int = 60,
        ) -> str:
            """Fleet サーバが乗っているクラスタで、 指定 clientID の Cluster CR に
            label `cluster-name=<value>` を付与する。

            中央ハブが cluster (= Fleet manager が乗っているクラスタ) のスポーク
            MCP の fleet_cluster_label を MCP プロトコル経由で呼び出す。

            cluster_fleet_agent_install で downstream クラスタが新 Fleet に登録された
            後、 その Cluster CR にラベルを付けて GitRepo の clusterSelector で
            ターゲットできるようにする。 fleet_agent が Cluster CR を作成するまで
            少し時間がかかるため、 timeout_seconds 以内でリトライする。

            Args:
                cluster:             Fleet manager が乗っているクラスタ名
                client_id:           cluster_fleet_token_create が返した clientID
                cluster_name_label:  ラベル値 (例: "example-cluster")
                fleet_namespace:     通常 "fleet-default"
                timeout_seconds:     Cluster CR が現れるのを待つ秒数 (default 60)
            """
            result = await _spoke_call(cluster, "fleet_cluster_label", {
                "client_id": client_id,
                "cluster_name_label": cluster_name_label,
                "fleet_namespace": fleet_namespace,
                "timeout_seconds": timeout_seconds,
            })

            # 成功時のみ DB 更新 (best-effort)
            try:
                from datetime import datetime as _dt_l, timezone as _tz_l
                if isinstance(result, str) and "ERROR" not in result.upper():
                    # スポークの戻り値 "cluster/<crname> labeled cluster-name=..."
                    # から Cluster CR 名を抽出
                    fleet_cr = ""
                    if result.startswith("cluster/"):
                        try:
                            fleet_cr = result.split(" ", 1)[0][len("cluster/"):]
                        except Exception:
                            fleet_cr = ""
                    fields = {
                        "labeled_at": _dt_l.now(_tz_l.utc).isoformat(),
                        "client_id": client_id,
                        "cluster_name_label": cluster_name_label,
                        "migration_status": "labeled",
                    }
                    if fleet_cr:
                        fields["fleet_cluster_cr"] = fleet_cr
                    _update_cluster_doc(cluster_name_label, **fields)
            except Exception as _e:
                logger.error("[hub_tools] fleet_state auto-update failed "
                             "(cluster_label): %s", _e)

            return result

        @mcp.tool()
        async def cluster_fleet_cluster_delete(
            cluster: str,
            name: str = "",
            client_id: str = "",
            cluster_name_label: str = "",
            fleet_namespace: str = "fleet-default",
        ) -> str:
            """Fleet サーバが乗っているクラスタで、 指定された Cluster CR を削除する
            (kubectl delete cluster.fleet.cattle.io 相当)。

            中央ハブが cluster (= Fleet manager が乗っているクラスタ) のスポーク
            MCP の fleet_cluster_delete を MCP プロトコル経由で呼び出す。

            主な用途は移行作業時の片付け:
              - 過去に登録された Cluster CR で、 downstream の fleet-agent が
                既に切り離されてしまったもの (Last Seen が古いまま停止)
              - cluster_fleet_agent_install で再登録した結果生まれる「孤児に
                なった旧 Cluster CR」 (新 Cluster CR が別 ID で作られるため)

            Cluster CR を削除すると ownerReference 経由で以下も連動削除される:
              - cluster-fleet-default-cluster-XXX namespace
              - 中の BundleDeployment 群
              - 中の Helm release Secret 群

            downstream クラスタへの影響:
              - downstream の fleet-agent が動いていない場合: 影響なし (主用途)
              - 動いている場合: keepResources: true の Bundle ならリソース保護、
                それ以外は downstream のリソースも削除される可能性があるので注意。

            特定方法 (優先順位: name > client_id > cluster_name_label):
              - name: Cluster CR の metadata.name で直接指定
                       (例: "cluster-xxxxxxxxxxxx")
              - client_id: spec.clientID で検索
              - cluster_name_label: metadata.labels."cluster-name" で検索

            cluster_name_label で複数の Cluster CR がマッチした場合は、
            マッチした全 name を返してエラーで停止する (安全装置)。

            Args:
                cluster:             Fleet manager が乗っているクラスタ名
                name:                Cluster CR の metadata.name
                client_id:           Cluster CR の spec.clientID
                cluster_name_label:  metadata.labels."cluster-name" の値
                fleet_namespace:     通常 "fleet-default"
            """
            result = await _spoke_call(cluster, "fleet_cluster_delete", {
                "name": name,
                "client_id": client_id,
                "cluster_name_label": cluster_name_label,
                "fleet_namespace": fleet_namespace,
            })

            # 成功時のみ DB 更新 (best-effort)
            try:
                from datetime import datetime as _dt_l, timezone as _tz_l
                if isinstance(result, str) and "ERROR" not in result.upper():
                    # スポークの戻り値 "cluster/<crname> deleted from <ns>"
                    # から Cluster CR 名を抽出
                    deleted_cr = ""
                    if result.startswith("cluster/"):
                        try:
                            deleted_cr = result.split(" ", 1)[0][len("cluster/"):]
                        except Exception:
                            deleted_cr = ""
                    # cluster_name_label が指定されていればそれをキーに、
                    # そうでなければ Cluster CR 名をキーに DB を更新する。
                    doc_key = cluster_name_label or deleted_cr
                    if doc_key:
                        fields = {
                            "cluster_cr_deleted_at": _dt_l.now(_tz_l.utc).isoformat(),
                            "migration_status": "cluster_cr_deleted",
                        }
                        if deleted_cr:
                            fields["last_deleted_fleet_cluster_cr"] = deleted_cr
                        _update_cluster_doc(doc_key, **fields)
            except Exception as _e:
                logger.error("[hub_tools] fleet_state auto-update failed "
                             "(cluster_delete): %s", _e)

            return result

        @mcp.tool()
        async def cluster_k8s_get(
            cluster: str,
            api_version: str,
            kind: str,
            name: str = "",
            namespace: str = "",
            label_selector: str = "",
            field_selector: str = "",
        ) -> str:
            """指定クラスタから任意の K8s リソースを取得する汎用ツール (read-only)。

            中央ハブが cluster で指定されたスポーク MCP の k8s_get を MCP
            プロトコル経由で呼び出す。 標準 API (Pod、 Deployment、
            ConfigMap、 Secret) と CustomResource (fleet.cattle.io 系等)
            の両方に対応する。 内部実装は dynamic.DynamicClient を使い、
            kind と api_version から正しい resource を自動解決する。

            用途例:
              - rancher クラスタの Cluster CR 一覧:
                cluster_k8s_get(cluster="rancher",
                                api_version="fleet.cattle.io/v1alpha1",
                                kind="Cluster", namespace="fleet-default")
              - rancher クラスタの GitRepo 一覧 (同上、 kind="GitRepo")
              - rag クラスタの fleet-agent Secret 取得:
                cluster_k8s_get(cluster="rag", api_version="v1",
                                kind="Secret", name="fleet-agent",
                                namespace="cattle-fleet-system")

            Secret の data は base64 のまま返るため、 機密値は base64
            デコードしない限り画面に直接出ない。 ただし base64 はマスキング
            ではないので扱い注意。

            Args:
                cluster:        対象クラスタ名 (list_clusters で確認)
                api_version:    例: "v1"、 "apps/v1"、
                                "fleet.cattle.io/v1alpha1"
                kind:           例: "Pod"、 "Deployment"、 "Cluster"、
                                "GitRepo"、 "BundleDeployment"
                name:           リソース名 (省略時は list)
                namespace:      名前空間 (cluster-scoped なら省略)
                label_selector: list 時の label セレクタ
                field_selector: list 時の field セレクタ
            """
            return await _spoke_call(cluster, "cluster_k8s_get", {
                "api_version": api_version,
                "kind": kind,
                "name": name,
                "namespace": namespace,
                "label_selector": label_selector,
                "field_selector": field_selector,
            })

        # ── Fleet 管理の永続化 (OpenSearch index=fleet_state) ──
        # 中央ハブが全システムの統括として、 Fleet manager の状態を
        # 一元管理する。 Fleet サーバが将来別クラスタへ移動しても、
        # この index は中央ハブに残るため連続性が保たれる。

        import json as _json
        from datetime import datetime as _dt, timezone as _tz

        @mcp.tool()
        async def fleet_state_upsert(
            doc_id: str,
            title: str,
            content: str,
            doc_kind: str = "note",
            extra: dict = None,
        ) -> str:
            """Fleet 管理に関するドキュメントを OpenSearch index=fleet_state に
            保存/更新する (冪等)。 中央ハブ MCP が全システムの統括として
            Fleet 状態を保持する用途。

            doc_id 規約 (推奨):
              - "server"           (1 件、 Fleet サーバ全体の情報)
              - "cluster:<name>"   (移行済 downstream クラスタの情報)
              - "gitrepo:<name>"   (新 Fleet 側 GitRepo の設定)
              - "note:<topic>"     (運用ノウハウ・ トラブル対処手順 等)

            Args:
                doc_id:   一意の識別子 (上記規約に従う)
                title:    1 行タイトル
                content:  本文 (Markdown 可。 構造化情報も含めて自由記述)
                doc_kind: "server" / "cluster" / "gitrepo" / "note" 等。
                          OpenSearch keyword で絞り込み可
                extra:    title/content/doc_kind 以外の任意フィールド (dict)。
                          OpenSearch の dynamic mapping で型自動推論される
            """
            now = _dt.now(_tz.utc).isoformat()
            doc = {
                "doc_id": doc_id,
                "doc_kind": doc_kind,
                "title": title,
                "content": content,
                "updated_at": now,
            }
            if extra:
                doc.update(extra)

            # 既存の created_at は保持
            existing = _os_request("GET", f"/{_FLEET_STATE_INDEX}/_doc/{doc_id}")
            if existing.get("status_code") == 200:
                src = (existing.get("json") or {}).get("_source") or {}
                if src.get("created_at"):
                    doc["created_at"] = src["created_at"]
                else:
                    doc["created_at"] = now
            else:
                doc["created_at"] = now

            res = _os_request("PUT",
                f"/{_FLEET_STATE_INDEX}/_doc/{doc_id}",
                body=doc, params={"refresh": "true"})
            if res.get("status_code") in (200, 201):
                action = "updated" if res.get("json", {}).get("result") == "updated" else "created"
                return f"fleet_state/{doc_id} {action}"
            return f"ERROR: fleet_state_upsert failed: {_json.dumps(res)[:300]}"

        @mcp.tool()
        async def fleet_state_get(doc_id: str) -> str:
            """OpenSearch index=fleet_state から 1 件取得する。
            存在しなければ "not found" を返す。
            """
            res = _os_request("GET", f"/{_FLEET_STATE_INDEX}/_doc/{doc_id}")
            if res.get("status_code") == 404:
                return f"fleet_state/{doc_id} not found"
            if res.get("status_code") == 200:
                src = (res.get("json") or {}).get("_source") or {}
                return _json.dumps(src, ensure_ascii=False, indent=2)
            return f"ERROR: fleet_state_get failed: {_json.dumps(res)[:300]}"

        @mcp.tool()
        async def fleet_state_list(
            prefix: str = "",
            doc_kind: str = "",
            size: int = 100,
        ) -> str:
            """OpenSearch index=fleet_state からドキュメント一覧を返す。
            prefix で doc_id の前方一致絞り込み (例: "cluster:" で全 cluster
            ドキュメント)、 doc_kind で kind フィルタも可。 両方指定可。

            戻り値: doc_id ごとに 1 行サマリ (title + updated_at)。
            詳細は fleet_state_get で個別取得する。
            """
            must = []
            if prefix:
                must.append({"prefix": {"doc_id": prefix}})
            if doc_kind:
                must.append({"term": {"doc_kind": doc_kind}})
            query = {"match_all": {}} if not must else {"bool": {"must": must}}
            body = {
                "size": min(max(size, 1), 1000),
                "_source": ["doc_id", "doc_kind", "title", "updated_at"],
                "sort": [{"doc_id": "asc"}],
                "query": query,
            }
            res = _os_request("POST",
                f"/{_FLEET_STATE_INDEX}/_search", body=body)
            if res.get("status_code") != 200:
                return f"ERROR: fleet_state_list failed: {_json.dumps(res)[:300]}"
            hits = (res.get("json") or {}).get("hits", {}).get("hits", [])
            if not hits:
                return "fleet_state: no documents matched"
            lines = []
            for h in hits:
                s = h.get("_source") or {}
                lines.append(
                    f"  - {s.get('doc_id')}  "
                    f"[{s.get('doc_kind', '?')}]  "
                    f"{s.get('title', '')}  "
                    f"(updated_at={s.get('updated_at', '?')})"
                )
            return f"fleet_state documents ({len(hits)}):\n" + "\n".join(lines)

        @mcp.tool()
        async def fleet_state_delete(doc_id: str) -> str:
            """OpenSearch index=fleet_state から 1 件削除する。
            存在しなければ "not present" を返す。
            """
            res = _os_request("DELETE",
                f"/{_FLEET_STATE_INDEX}/_doc/{doc_id}",
                params={"refresh": "true"})
            if res.get("status_code") == 404:
                return f"fleet_state/{doc_id} not present"
            if res.get("status_code") == 200:
                return f"fleet_state/{doc_id} deleted"
            return f"ERROR: fleet_state_delete failed: {_json.dumps(res)[:300]}"

        # ====== OpenSpoke 運用台帳 (ledger) 系 ======
        # 台帳本体は fleet_state index の doc_id="ledger" に保存。
        # Phase 3 で追加。 Claude が編集前のチェックや全体把握に使う read-only。

        def _ledger_fetch():
            """fleet_state index から ledger doc を取得して dict を返す。
            存在しなければ None。
            """
            res = _os_request("GET", f"/{_FLEET_STATE_INDEX}/_doc/ledger")
            if res.get("status_code") != 200:
                return None
            return (res.get("json") or {}).get("_source") or {}

        def _ledger_format_policy(policy):
            """policy dict を 1 行に整形。 未設定なら警告マーカー。"""
            if not policy:
                return "⚠️ 方針層未設定 (編集前に the operator要確認)"
            parts = []
            for key, label in (
                ("restart_safety", "再起動"),
                ("edit_safety", "編集"),
                ("desired_state", "あるべき状態"),
                ("notes", "備考"),
            ):
                v = policy.get(key)
                if v:
                    parts.append(f"{label}={v}")
            return " / ".join(parts) if parts else "(policy 空)"

        def _ledger_normalize_bundle_name(value):
            """`<bundle>@<cluster>` 表記から bundle 名部分だけを返す."""
            if not isinstance(value, str):
                return ""
            return value.split("@", 1)[0]

        def _ledger_effective_policy(module_node, bundle_name):
            """指定 bundle に対して effective な方針と継承元を返す.

            bundle_policies に該当 bundle の個別指定があればそれを返す
            (source="bundle")。 無ければモジュール既定 (mod.policy) を返す
            (source="module")。 どちらも無ければ (None, None) を返す。
            """
            mod = module_node or {}
            bps = mod.get("bundle_policies") or {}
            bp = bps.get(bundle_name)
            if bp:
                return bp, "bundle"
            mp = mod.get("policy")
            if mp:
                return mp, "module"
            return None, None

        def _fleet_gitrepos_fetch():
            """fleet_state index から kind=GitRepo の全ドキュメントを取得.

            アグリゲータが書き込んだ集約データ。 各要素は name / paths /
            ready_clusters / desired_ready_clusters /
            ready_bundle_deployments / conditions_kv 等を持つ。
            ネットワーク異常時は空リストを返す.
            """
            body = {
                "size": 1000,
                "query": {"term": {"kind.keyword": "GitRepo"}},
                "sort": [{"_id": "asc"}],
            }
            res = _os_request(
                "POST",
                f"/{_FLEET_STATE_INDEX}/_search",
                body=body,
            )
            if res.get("status_code") != 200:
                return []
            hits = ((res.get("json") or {}).get("hits") or {}).get("hits") or []
            out = []
            for h in hits:
                src = h.get("_source") or {}
                src["_id"] = h.get("_id")
                out.append(src)
            return out

        def _derive_module_bundles(ledger, gitrepos):
            """Fleet GitRepo の spec.paths と ledger の module.path を前方一致照合し、
            モジュール → 所属 bundle 一覧 を機械的に導出する.

            kernel_api.derive_module_bundles と論理は同じだが、 MCP 側は
            kernel_api を import できないので独立に実装する。 Fleet を
            真実源とし、 ledger の手書き静的フィールド (components / bundles /
            fanout_bundles / per_cluster_registration) は参照しない.

            Returns:
                {(cat_name, mod_name): [{
                    "bundle_name", "matched_path", "all_paths",
                    "relative_path", "ready_clusters",
                    "desired_ready_clusters", "ready_bundle_deployments",
                    "conditions_kv"
                }, ...]}
            """
            if not ledger or not gitrepos:
                return {}
            modpath_index = []
            for cat_name, cat in (ledger.get("categories") or {}).items():
                for mod_name, mod in cat.items():
                    mp = ((mod or {}).get("path") or "").rstrip("/")
                    if mp:
                        modpath_index.append((mp, (cat_name, mod_name)))
            modpath_index.sort(key=lambda x: len(x[0]), reverse=True)
            out = {}
            for gr in gitrepos:
                name = gr.get("name") or gr.get("_id", "")
                paths = gr.get("paths") or []
                ready_clusters = gr.get("ready_clusters", 0)
                desired = gr.get("desired_ready_clusters", 0)
                ready_bds = gr.get("ready_bundle_deployments", "")
                conds = gr.get("conditions_kv") or {}
                for p in paths:
                    pn = (p or "").rstrip("/")
                    matched = None
                    for mp, key in modpath_index:
                        prefix = mp + "/manifests"
                        if pn == prefix or pn.startswith(prefix + "/"):
                            relative = pn[len(prefix):].lstrip("/")
                            matched = (key, relative)
                            break
                    if matched is None:
                        continue
                    key, relative = matched
                    out.setdefault(key, []).append({
                        "bundle_name": name,
                        "matched_path": pn,
                        "all_paths": list(paths),
                        "relative_path": relative,
                        "ready_clusters": ready_clusters,
                        "desired_ready_clusters": desired,
                        "ready_bundle_deployments": ready_bds,
                        "conditions_kv": dict(conds),
                    })
            for key, items in out.items():
                seen = set()
                unique = []
                for it in items:
                    k = (it["bundle_name"], it["matched_path"])
                    if k in seen:
                        continue
                    seen.add(k)
                    unique.append(it)
                unique.sort(key=lambda x: (x["relative_path"], x["bundle_name"]))
                out[key] = unique
            return out

        @mcp.tool()
        async def ledger_overview() -> str:
            """OpenSpoke 運用台帳の全体地図 (Core / Application 配下の
            モジュール一覧) を 1 ページで返す。 各モジュールについて
            live_cluster / canonical_production_hub / fleet 有無 /
            depends_on / Fleet GitRepo から導出した bundle 件数 /
            policy 設定有無を 1 段で要約する。 詳細は ledger_module(name=...)
            で深掘り、 個別バンドルやコンポーネントキーの所属は
            ledger_bundle(name=...) で逆引きする。 編集前の最初の一手として
            呼ぶことを想定。
            """
            doc = _ledger_fetch()
            if doc is None:
                return "ERROR: ledger doc not found in fleet_state index"
            gitrepos = _fleet_gitrepos_fetch()
            derived = _derive_module_bundles(doc, gitrepos)
            cats = doc.get("categories") or {}
            lines = []
            lines.append(f"# OpenSpoke 運用台帳 v{doc.get('schema_version','?')}")
            lines.append(f"  title={doc.get('title','')}")
            lines.append(f"  updated_at={doc.get('updated_at','?')}")
            lines.append(
                f"  (bundle 一覧は Fleet GitRepo から動的導出、 "
                f"GitRepo 総数={len(gitrepos)})"
            )
            lines.append("")
            for cat_name in ("Core", "Application"):
                cat = cats.get(cat_name) or {}
                if not cat:
                    continue
                # ACL フィルタ (admin auto-bypass)
                cat = await _filter_modules_by_acl(cat_name, cat)
                if not cat:
                    continue
                lines.append(f"## {cat_name}")
                for mod_name, mod in cat.items():
                    live = mod.get("live_cluster", "-")
                    fleet_tag = "Fleet" if mod.get("fleet") else "手動/未登録"
                    canonical = " ★本番ハブ" if mod.get("canonical_production_hub") else ""
                    role = mod.get("role")
                    dep = mod.get("depends_on")
                    bundles_here = derived.get((cat_name, mod_name)) or []
                    bundle_count = len(bundles_here)
                    pol = _ledger_format_policy(mod.get("policy"))
                    bps = mod.get("bundle_policies") or {}
                    # 孤児 bundle_policies の検出
                    known_bnames = {b["bundle_name"] for b in bundles_here}
                    orphans = [bn for bn in bps if bn not in known_bnames]
                    lines.append(f"  - {mod_name}{canonical}")
                    lines.append(
                        f"      live={live}  type={fleet_tag}  "
                        f"bundle件数(Fleet導出)={bundle_count}"
                    )
                    if role:
                        lines.append(f"      role={role}")
                    if dep:
                        lines.append(f"      depends_on={dep}")
                    lines.append(f"      policy: {pol}")
                    if bps:
                        lines.append(
                            f"      bundle個別方針: {len(bps)} 件 "
                            f"({', '.join(sorted(bps.keys()))})"
                        )
                    if orphans:
                        lines.append(
                            f"      ⚠️ 孤児 bundle個別方針 "
                            f"(該当 bundle が Fleet に無し): "
                            f"{', '.join(sorted(orphans))}"
                        )
                lines.append("")
            return "\n".join(lines)

        @mcp.tool()
        async def ledger_module(name: str) -> str:
            """OpenSpoke 運用台帳から 1 モジュールの詳細を返す。

            name はカテゴリ配下のモジュール名 (例: "Hub", "example-tier",
            "example-app")。 Core / Application の両方を
            横断検索し、 見つかれば全フィールドを JSON で返す。 配下の
            bundle 一覧は Fleet GitRepo を真実源として動的に導出する
            (ledger の手書き静的フィールドは見ない)。 policy 未設定なら
            その旨を明示する。 同名が複数カテゴリにある場合は全て返す。
            該当無しなら "not found" を返す。
            """
            doc = _ledger_fetch()
            if doc is None:
                return "ERROR: ledger doc not found"
            gitrepos = _fleet_gitrepos_fetch()
            derived = _derive_module_bundles(doc, gitrepos)
            cats = doc.get("categories") or {}
            results = []
            for cat_name, cat in cats.items():
                if name in cat:
                    # ACL チェック: 未許可ならスキップ (admin auto-bypass)
                    deny = await _check_module_allowed(cat_name, name)
                    if deny:
                        continue
                    mod = cat[name]
                    results.append({
                        "category": cat_name,
                        "name": name,
                        "data": mod,
                        "policy_summary": _ledger_format_policy(mod.get("policy")),
                        "derived_bundles": derived.get((cat_name, name)) or [],
                    })
            if not results:
                return f"ledger: module '{name}' not found"
            out = []
            for r in results:
                out.append(f"## {r['category']}/{r['name']}")
                out.append(f"module 既定方針: {r['policy_summary']}")
                mod_data = r["data"]
                bundles_here = r["derived_bundles"]
                if bundles_here:
                    out.append(
                        f"Fleet GitRepo から導出した bundle "
                        f"({len(bundles_here)} 件):"
                    )
                    for b in bundles_here:
                        bn = b["bundle_name"]
                        rel = b["relative_path"] or "(top)"
                        ready = b.get("ready_bundle_deployments", "")
                        eff, src = _ledger_effective_policy(mod_data, bn)
                        src_tag = ("個別指定" if src == "bundle"
                                   else ("モジュール継承" if src == "module"
                                         else "未設定"))
                        out.append(
                            f"  - {bn}  rel={rel}  ready={ready}  "
                            f"方針[{src_tag}]: "
                            f"{_ledger_format_policy(eff)}"
                        )
                else:
                    out.append("Fleet GitRepo から導出した bundle: 0 件")
                bps = mod_data.get("bundle_policies") or {}
                known_bnames = {b["bundle_name"] for b in bundles_here}
                orphans = [bn for bn in bps if bn not in known_bnames]
                if orphans:
                    out.append("")
                    out.append(
                        f"⚠️ 孤児 bundle個別方針 "
                        f"(該当 bundle が Fleet に無し): "
                        f"{', '.join(sorted(orphans))}"
                    )
                out.append("---")
                out.append(_json.dumps(r["data"], ensure_ascii=False, indent=2))
                out.append("")
            return "\n".join(out)

        @mcp.tool()
        async def ledger_bundle(name: str) -> str:
            """OpenSpoke 運用台帳 + Fleet GitRepo から bundle 名 を逆引きする。

            name は Fleet GitRepo 名 (= Fleet bundle 名)。 真実源は Fleet
            GitRepo なので、 ledger の手書き静的フィールドは見ない。
            GitRepo の spec.paths を ledger.categories.<cat>.<mod>.path と
            前方一致照合して所属モジュールを特定し、 module 既定方針 /
            bundle 個別方針 / effective 方針 (個別指定 or 継承) を全て返す。
            複数モジュール跨ぎなら全件返す。 Fleet には存在するが
            module.path に当てはまらない bundle はその旨を返す。 該当無しなら
            "not found" を返す。
            """
            doc = _ledger_fetch()
            if doc is None:
                return "ERROR: ledger doc not found"
            gitrepos = _fleet_gitrepos_fetch()
            derived = _derive_module_bundles(doc, gitrepos)
            cats = doc.get("categories") or {}
            hits = []
            for (cat_name, mod_name), bundles_here in derived.items():
                for b in bundles_here:
                    if b["bundle_name"] != name:
                        continue
                    # ACL チェック: 未許可モジュール所属の bundle は隠す (admin auto-bypass)
                    deny = await _check_module_allowed(cat_name, mod_name)
                    if deny:
                        continue
                    mod = (cats.get(cat_name) or {}).get(mod_name) or {}
                    eff_pol, eff_src = _ledger_effective_policy(mod, name)
                    bp = (mod.get("bundle_policies") or {}).get(name)
                    hits.append({
                        "category": cat_name,
                        "module": mod_name,
                        "bundle_name": name,
                        "matched_path": b["matched_path"],
                        "relative_path": b["relative_path"],
                        "all_paths": b["all_paths"],
                        "ready_clusters": b["ready_clusters"],
                        "ready_bundle_deployments": b["ready_bundle_deployments"],
                        "live_cluster": mod.get("live_cluster"),
                        "canonical_production_hub": mod.get(
                            "canonical_production_hub", False),
                        "depends_on": mod.get("depends_on"),
                        "module_policy": mod.get("policy"),
                        "bundle_policy": bp,
                        "effective_policy": eff_pol,
                        "effective_source": eff_src,
                    })
            if not hits:
                # 念のため未分類 GitRepo にも該当が無いか確認
                for gr in gitrepos:
                    if gr.get("name") == name:
                        paths = gr.get("paths") or []
                        return (
                            f"ledger: bundle '{name}' は Fleet GitRepo に存在しますが、"
                            f" どの module.path にも前方一致しません.\n"
                            f"  spec.paths={paths}\n"
                            f"  module 側に該当 path のモジュールが未登録の可能性、"
                            f" または旧パス (OpenSpoke/ 配下に未移行)"
                        )
                return f"ledger: bundle '{name}' not found in Fleet"
            out = [f"ledger: '{name}' found in {len(hits)} location(s):", ""]
            for h in hits:
                mod_pol = _ledger_format_policy(h.get("module_policy"))
                out.append(
                    f"  - {h['category']}/{h['module']} "
                    f"(relative={h['relative_path'] or '(top)'})"
                )
                out.append(f"      path={h['matched_path']}")
                out.append(f"      live_cluster={h.get('live_cluster')}")
                if h.get("canonical_production_hub"):
                    out.append("      ★ canonical production hub")
                if h.get("depends_on"):
                    out.append(f"      depends_on={h['depends_on']}")
                out.append(
                    f"      ready={h.get('ready_bundle_deployments', '')}  "
                    f"ready_clusters={h.get('ready_clusters', 0)}"
                )
                out.append(f"      module 既定方針: {mod_pol}")
                bp = h.get("bundle_policy")
                if bp:
                    out.append(
                        f"      bundle 個別方針: {_ledger_format_policy(bp)}"
                    )
                eff_src = h.get("effective_source")
                src_tag = ("個別指定" if eff_src == "bundle"
                           else ("モジュール継承" if eff_src == "module"
                                 else "未設定"))
                out.append(
                    f"      effective 方針 [{src_tag}]: "
                    f"{_ledger_format_policy(h.get('effective_policy'))}"
                )
                out.append("")
            return "\n".join(out)

        @mcp.tool()
