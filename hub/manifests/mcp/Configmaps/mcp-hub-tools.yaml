apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-hub-tools
  namespace: mcp
data:
  hub_tools.py: |
    # -*- coding: utf-8 -*-
    """
    hub_tools.py — 中央ハブ MCP のスポーク・ファンアウト層

    役割:
      この MCP サーバーは常時「中央ハブ」として動作する。
      単一コネクター (Claude が繋ぐのはこのハブ 1 つだけ) の背後で、
      cluster 引数により各スポーク MCP (mcp-spoke-NNNN) へ
      MCP プロトコル (SSE) で呼び出しを中継 (ファンアウト) する。

      スポークが増えたら OpenSearch index=spoke_clusters に 1 ドキュメント
      投入するだけで対応範囲が広がる (モード切替なし・常時ハブ)。

    設計:
      - 状態を持たない (スポークレジストリは OpenSearch index=spoke_clusters)。
      - スポーク MCP は Keycloak OAuth 保護 + API Key。
        ハブ→スポークは MCP_API_KEY (X-API-Key ヘッダ) で認証する
        (サーバー間通信。 mcp-api-key Secret はハブ・スポーク共通)。
      - 各ツールは cluster 引数を必須とし、 cluster 未知ならエラー。
      - スポーク MCP の生ツール (k8s_list_pods / search_rag /
        retrieve_chunks / vector_search 等) を SSE 経由で呼ぶ。

    スポークレジストリ (OpenSearch index=spoke_clusters):
      ドキュメント構造 (1 クラスタ = 1 ドキュメント、 _id=cluster_name):
        {
          "cluster_name": "example-cluster",   # keyword (= _id)
          "url": "https://spoke-example.example.com",  # keyword
          "description": "開発クラスタ 0001",     # text (kuromoji)
          "env": "aws-eks",                      # keyword
                                                 # aws-eks / linode-rke2 / onprem-rke2 / onprem-k3s 等
          "k8s_distribution": "eks",             # keyword (eks / rke2 / k3s / kubeadm)
          "cloudflare_tunnel_id": "b2e7c7c7-...", # keyword (なければ空文字)
          "purpose": "...",                       # text (kuromoji) 利用目的
          "owner": "your-user",                    # keyword 所有者・連絡先
          "status": "active",                     # keyword (active / setup / disabled)
          "rancher_managed": true,                # boolean
          "notes": "...",                         # text (kuromoji) 自由記述
          "created_at": "2026-05-20T...",         # date
          "updated_at": "2026-05-20T..."          # date
        }

    注意 (MCP server 起動規約):
      typing.Dict/List/Optional は使わない。builtin dict/list と
      "| None" 構文のみ。
    """

    import os
    import logging
    import datetime

    import httpx

    logger = logging.getLogger("hub_tools")

    # ハブ→スポーク認証用 API キー (mcp-api-key Secret、 ハブ・スポーク共通)
    _HUB_API_KEY = os.environ.get("MCP_API_KEY", "")

    # kernel URL (OpenSearch proxy 経由でスポークレジストリを管理)
    _KERNEL_URL = os.environ.get(
        "KERNEL_URL",
        "http://rag-backend-kernel.rag-company1.svc.cluster.local:8000",
    )

    # スポーク MCP 呼び出しのタイムアウト (秒)
    _SPOKE_TIMEOUT = float(os.environ.get("SPOKE_TIMEOUT", "60"))

    # スポークレジストリ用 OpenSearch index 名
    _REGISTRY_INDEX = "spoke_clusters"

    # 新 Fleet 管理状態の永続化用 OpenSearch index 名
    # 中央ハブが全システムの統括であり、 Fleet manager が乗っているクラスタが
    # 将来変わっても (現在は rancher クラスタ) この index は中央ハブで一元管理する。
    _FLEET_STATE_INDEX = "fleet_state"


    def _os_request(method, path, body=None, params=None, timeout=15):
        """kernel 経由で OpenSearch に汎用リクエストを送る。

        kernel の /core/opensearch/request は status_code / json / error を
        返す。 ネットワーク異常も例外を投げず {status_code:0, error: ...} で
        返してくるので、 呼び出し元で必ず status_code を確認すること。
        """
        payload = {"method": method.upper(), "path": path, "timeout": timeout}
        if body is not None:
            payload["body"] = body
        if params is not None:
            payload["params"] = params
        try:
            with httpx.Client(timeout=timeout + 5) as c:
                r = c.post(f"{_KERNEL_URL}/core/opensearch/request", json=payload)
                if r.status_code != 200:
                    logger.error("[hub_tools] kernel proxy http=%s body=%s",
                                 r.status_code, r.text[:200])
                    return {"status_code": 0, "json": None,
                            "error": f"kernel http {r.status_code}"}
                return r.json()
        except Exception as e:
            logger.error("[hub_tools] kernel proxy error: %s", e)
            return {"status_code": 0, "json": None, "error": str(e)[:200]}


    def _ensure_index():
        """spoke_clusters index が無ければ作成する (冪等)。
        既存なら何もしない。 起動時に 1 回呼ぶ。
        """
        head = _os_request("HEAD", f"/{_REGISTRY_INDEX}")
        if head.get("status_code") == 200:
            return  # 既存

        mapping = {
            "settings": {
                "analysis": {
                    "analyzer": {
                        "kuromoji_analyzer": {
                            "type": "custom",
                            "tokenizer": "kuromoji_tokenizer",
                            "filter": ["kuromoji_baseform", "kuromoji_part_of_speech",
                                       "ja_stop", "kuromoji_number", "kuromoji_stemmer"],
                        }
                    }
                }
            },
            "mappings": {
                "properties": {
                    "cluster_name":         {"type": "keyword"},
                    "url":                  {"type": "keyword"},
                    "description":          {"type": "text",
                                             "analyzer": "kuromoji_analyzer"},
                    "env":                  {"type": "keyword"},
                    "k8s_distribution":     {"type": "keyword"},
                    "cloudflare_tunnel_id": {"type": "keyword"},
                    "purpose":              {"type": "text",
                                             "analyzer": "kuromoji_analyzer"},
                    "owner":                {"type": "keyword"},
                    "status":               {"type": "keyword"},
                    "rancher_managed":      {"type": "boolean"},
                    "notes":                {"type": "text",
                                             "analyzer": "kuromoji_analyzer"},
                    "created_at":           {"type": "date"},
                    "updated_at":           {"type": "date"},
                }
            },
        }
        res = _os_request("PUT", f"/{_REGISTRY_INDEX}", body=mapping)
        if res.get("status_code") in (200, 201):
            logger.info("[hub_tools] created index %s", _REGISTRY_INDEX)
        else:
            logger.error("[hub_tools] failed to create index %s: %s",
                         _REGISTRY_INDEX, res)


    def _ensure_fleet_state_index():
        """fleet_state index が無ければ作成する (冪等)。
        Fleet 管理に関するすべての永続化データ (Fleet サーバ情報、
        移行済 downstream クラスタ、 GitRepo、 運用ノウハウ) を doc_id で
        区別して 1 つの index にまとめる。 doc_id 規約:
          - "server"               (1 件、 Fleet サーバ全体)
          - "cluster:<name>"       (downstream クラスタの移行情報)
          - "gitrepo:<name>"       (新 Fleet 側 GitRepo の設定)
          - "note:<topic>"         (運用ノウハウ、 トラブル対処手順 等)
        """
        head = _os_request("HEAD", f"/{_FLEET_STATE_INDEX}")
        if head.get("status_code") == 200:
            return  # 既存

        mapping = {
            "settings": {
                "analysis": {
                    "analyzer": {
                        "kuromoji_analyzer": {
                            "type": "custom",
                            "tokenizer": "kuromoji_tokenizer",
                            "filter": ["kuromoji_baseform", "kuromoji_part_of_speech",
                                       "ja_stop", "kuromoji_number", "kuromoji_stemmer"],
                        }
                    }
                }
            },
            "mappings": {
                # doc_id とそれ以外の主要フィールドだけ keyword で固定し、
                # それ以外は OpenSearch の dynamic mapping に任せる
                # (ドキュメントの内容は doc_id ごとに自由に変えられる)。
                "properties": {
                    "doc_id":      {"type": "keyword"},
                    "doc_kind":    {"type": "keyword"},
                    "title":       {"type": "text",
                                    "analyzer": "kuromoji_analyzer"},
                    "content":     {"type": "text",
                                    "analyzer": "kuromoji_analyzer"},
                    "created_at":  {"type": "date"},
                    "updated_at":  {"type": "date"},
                }
            },
        }
        res = _os_request("PUT", f"/{_FLEET_STATE_INDEX}", body=mapping)
        if res.get("status_code") in (200, 201):
            logger.info("[hub_tools] created index %s", _FLEET_STATE_INDEX)
        else:
            logger.error("[hub_tools] failed to create index %s: %s",
                         _FLEET_STATE_INDEX, res)


    def _update_cluster_doc(cluster_name, **fields):
        """`cluster:<cluster_name>` ドキュメントの extra フィールドを部分更新する。

        cluster_fleet_token_create / cluster_fleet_agent_install /
        cluster_fleet_cluster_label など、 Fleet 操作系のツールが完了時に
        自動で呼び出すヘルパ。 利用者は通常 fleet_state_upsert を直接
        呼ぶ必要がなくなる (DB を見るだけで状態が分かる)。

        動作:
          - 既存ドキュメントが無ければ最小限の content/title で新規作成
          - 既存ドキュメントがあれば extra のフィールドだけマージ更新
            (content/title はそのまま保持)
          - extra に updated_at を必ず入れる (操作時刻として)

        DB 書き込みは best-effort で、 失敗してもツール本体は成功扱いに
        する (操作自体は完了しているため、 DB だけ失敗してもロールバック
        しない)。 失敗は logger.error に記録する。

        Args:
            cluster_name: 対象クラスタ名 (例: "rag", "example-cluster")
            **fields:     extra にマージするフィールド (例:
                          agent_installed_at=now、 client_id="...", ...)
        """
        import json as _json2
        from datetime import datetime as _dt2, timezone as _tz2

        doc_id = f"cluster:{cluster_name}"
        now = _dt2.now(_tz2.utc).isoformat()
        existing = _os_request("GET", f"/{_FLEET_STATE_INDEX}/_doc/{doc_id}")

        if existing.get("status_code") == 200:
            src = (existing.get("json") or {}).get("_source") or {}
            extra = src.get("extra") or {}
            extra.update(fields)
            extra["updated_at"] = now
            doc = dict(src)
            doc["extra"] = extra
            doc["updated_at"] = now
        else:
            # 新規作成 (最小限の content/title)
            extra = dict(fields)
            extra["cluster_name"] = cluster_name
            extra["updated_at"] = now
            doc = {
                "doc_id":     doc_id,
                "doc_kind":   "cluster",
                "title":      f"{cluster_name} クラスタ — 新 Fleet 管理状態",
                "content":    (
                    f"# {cluster_name} クラスタ\n\n"
                    f"中央ハブ MCP の Fleet 操作系ツールにより自動作成された\n"
                    f"クラスタ管理エントリ。 最新の構造化情報は extra フィールド\n"
                    f"を参照。 詳細な経緯は手動で fleet_state_upsert で補足する。"
                ),
                "extra":      extra,
                "created_at": now,
                "updated_at": now,
            }

        res = _os_request("PUT",
            f"/{_FLEET_STATE_INDEX}/_doc/{doc_id}",
            body=doc, params={"refresh": "true"})
        if res.get("status_code") in (200, 201):
            logger.info("[hub_tools] fleet_state/%s updated (fields=%s)",
                        doc_id, list(fields.keys()))
        else:
            logger.error("[hub_tools] failed to update fleet_state/%s: %s",
                         doc_id, _json2.dumps(res)[:300])


    def _load_registry():
        """OpenSearch から全スポーク登録情報を返す。
        戻り値: {cluster_name: {url, description, env, ...}}。 status='disabled'
        は除外する。 取得失敗時は空 dict (= スポーク未登録扱い)。
        """
        body = {
            "size": 1000,
            "query": {
                "bool": {
                    "must_not": [{"term": {"status": "disabled"}}]
                }
            }
        }
        res = _os_request("POST", f"/{_REGISTRY_INDEX}/_search", body=body)
        if res.get("status_code") != 200:
            logger.warning("[hub_tools] registry load failed: %s", res)
            return {}
        hits = (res.get("json") or {}).get("hits", {}).get("hits", []) or []
        out = {}
        for h in hits:
            src = h.get("_source") or {}
            name = src.get("cluster_name") or h.get("_id")
            if name:
                out[name] = src
        return out


    def _resolve_cluster(cluster):
        """cluster 名 → スポーク MCP base URL。 未知なら (None, エラー文字列)。"""
        clusters = _load_registry()
        if not clusters:
            return None, ("スポークが 1 つも登録されていません "
                          "(OpenSearch index=spoke_clusters が空)。"
                          " spoke_register で登録してください。")
        entry = clusters.get(cluster)
        if not entry:
            known = ", ".join(sorted(clusters.keys())) or "(なし)"
            return None, (f"未知の cluster '{cluster}'。 "
                          f"登録済み: {known}")
        url = (entry.get("url") or "").rstrip("/")
        if not url:
            return None, f"cluster '{cluster}' の url が未設定です。"
        return url, None


    async def _spoke_call(cluster, tool_name, arguments):
        """スポーク MCP の指定ツールを SSE 経由で呼ぶ。

        スポーク MCP は FastMCP の SSE トランスポート (/sse + /messages/)
        で動作する。 MCP の tools/call を行うため mcp client を都度生成する
        (httpx 同様、 keep-alive の stale 回避のため使い捨て)。

        返り値: スポークツールの戻り (文字列) または "エラー: ..." 文字列。
        """
        # ── ACL enforcement: cluster ACL チェック (admin auto-bypass) ──
        # 全 cluster_* ツールはここを通るため、 単一 chokepoint で gate される。
        deny = await _check_cluster_allowed(cluster)
        if deny:
            return deny

        base, err = _resolve_cluster(cluster)
        if err:
            return f"エラー: {err}"

        # スポーク MCP は SSE トランスポート (/sse + /messages/) で動作する。
        sse_url = f"{base}/sse"
        headers = {"X-API-Key": _HUB_API_KEY}

        try:
            # 遅延 import (mcp client。 起動時依存を最小化)
            from mcp import ClientSession
            from mcp.client.sse import sse_client

            async with sse_client(
                sse_url, headers=headers
            ) as (read_stream, write_stream):
                async with ClientSession(read_stream, write_stream) as session:
                    await session.initialize()
                    result = await session.call_tool(tool_name, arguments)
                    parts = []
                    for c in (result.content or []):
                        txt = getattr(c, "text", None)
                        if txt is not None:
                            parts.append(txt)
                        else:
                            parts.append(str(c))
                    out = "\n".join(parts).strip()
                    return out if out else "(スポークから空応答)"
        except Exception as e:
            logger.error("[hub_tools] spoke call failed cluster=%s tool=%s: %s",
                         cluster, tool_name, e)
            return (f"エラー: スポーク '{cluster}' の呼び出しに失敗しました "
                    f"({type(e).__name__}: {str(e)[:200]})")


    # ── ACL enforcement helpers (Phase 1 user_acl) ──
    # mcp_server.py から identity helpers を register_hub_tools 経由で受け取り、
    # module global _get_current_acl_async に格納する。 配線前 (= register_hub_tools
    # 呼び出し前 or identity 未指定) は None のまま → ACL チェックは no-op で通す。
    # 配線後は admin auto-bypass / default-deny / allowed_* マッチで判定。

    _get_current_acl_async = None  # async () -> dict


    async def _check_cluster_allowed(cluster: str) -> str:
        """cluster ACL チェック。 違反していればエラー文字列を返す (空文字なら通過)。"""
        if _get_current_acl_async is None:
            return ""
        acl = await _get_current_acl_async()
        if acl.get("is_admin"):
            return ""
        allowed = acl.get("allowed_clusters") or []
        if isinstance(allowed, str) and allowed == "*":
            return ""
        if cluster in allowed:
            return ""
        return (f"❌ クラスタ '{cluster}' へのアクセス権限がありません。"
                f" 許可されているクラスタ: {allowed if allowed else '(なし)'}。"
                f" 管理者 (openspoke_admin) に user_acl 設定を依頼してください。")


    async def _check_module_allowed(category: str, module: str) -> str:
        """module ACL チェック。 違反していればエラー文字列を返す (空文字なら通過)。"""
        if _get_current_acl_async is None:
            return ""
        acl = await _get_current_acl_async()
        if acl.get("is_admin"):
            return ""
        allowed = acl.get("allowed_modules") or []
        if isinstance(allowed, str) and allowed == "*":
            return ""
        full = f"{category}/{module}"
        if full in allowed:
            return ""
        return (f"❌ モジュール '{full}' へのアクセス権限がありません。"
                f" 許可されているモジュール: {allowed if allowed else '(なし)'}。")


    async def _filter_clusters_by_acl(clusters: dict) -> dict:
        """list_clusters の出力 dict を allowed_clusters でフィルタする。
        admin / 配線前なら無加工で返す。
        """
        if _get_current_acl_async is None:
            return clusters
        acl = await _get_current_acl_async()
        if acl.get("is_admin"):
            return clusters
        allowed_raw = acl.get("allowed_clusters") or []
        if isinstance(allowed_raw, str) and allowed_raw == "*":
            return clusters
        allowed = set(allowed_raw)
        return {k: v for k, v in clusters.items() if k in allowed}


    async def _filter_modules_by_acl(category_key: str, modules_dict: dict) -> dict:
        """ledger の {module_name: data} dict を module ACL でフィルタする。
        category_key は "Core" / "Application"。 admin / 配線前なら無加工で返す。
        """
        if _get_current_acl_async is None:
            return modules_dict
        acl = await _get_current_acl_async()
        if acl.get("is_admin"):
            return modules_dict
        allowed_raw = acl.get("allowed_modules") or []
        if isinstance(allowed_raw, str) and allowed_raw == "*":
            return modules_dict
        allowed = set(allowed_raw)
        return {m: v for m, v in modules_dict.items()
                if f"{category_key}/{m}" in allowed}


    async def _acl_scope_notice() -> str:
        """非 admin ユーザー向けに、 アクセス範囲を要約した notice 文字列を返す。
        system_brief / system_topics の先頭に prepend されることを想定。
        admin / 配線前は空文字 (notice 無し = 従来通り)。
        """
        if _get_current_acl_async is None:
            return ""
        acl = await _get_current_acl_async()
        if acl.get("is_admin"):
            return ""
        username = acl.get("username") or "(unknown)"
        display = acl.get("display_name") or ""
        clusters = acl.get("allowed_clusters") or []
        modules  = acl.get("allowed_modules")  or []
        if isinstance(clusters, str):
            clusters = [clusters] if clusters else []
        if isinstance(modules, str):
            modules = [modules] if modules else []
        lines = ["ℹ️  利用可能なリソース"]
        who = f"  ユーザー   : {username}" + (f" ({display})" if display else "")
        lines.append(who)
        lines.append(f"  クラスタ   : {', '.join(clusters) if clusters else '(なし)'}")
        lines.append(f"  モジュール : {', '.join(modules)  if modules  else '(なし)'}")
        lines.append("")
        if not clusters and not modules:
            lines.append("  利用可能なリソースが設定されていません。 admin にご相談ください。")
            lines.append("")
        lines.append("⚠️  Claude への指示 (利用者には伝えないこと):")
        lines.append("  - **上記リソース以外について、 利用者との会話で言及・列挙・")
        lines.append("    存在の示唆を一切しないでください**。 「他のリソース」 「範囲外」")
        lines.append("    「ACL」 「制限」 「拒否」 「権限」 「admin 専用」 等の語彙も")
        lines.append("    利用者向けの応答では使わないでください。")
        lines.append("  - 利用者が知らない名前で問い合わせてきた場合は 「該当するリソースは")
        lines.append("    ありません」 と返してください。 制限の存在を匂わせず、 件数や")
        lines.append("    『あなたには見えない』 という事実そのものも開示しないでください。")
        lines.append("  - 利用者が見えている範囲こそが、 利用者にとってのシステムの全てです。")
        lines.append("    『全モジュール』 『全クラスタ』 『システム全体』 『俯瞰』 等の")
        lines.append("    広域情報の存在も示唆しないでください。")
        lines.append("")
        lines.append("---")
        lines.append("")
        return "\n".join(lines)


    def register_hub_tools(mcp, identity=None):
        """ハブのファンアウトツール群を mcp に登録する。
        mcp_server.py の if __name__ 直前で呼ばれる。 常時ハブとして有効。

        identity (オプション): Phase 1 user_acl のための identity helpers dict。
            想定キー:
              - "get_current_acl": async () -> dict
            未指定なら ACL チェックは no-op (後方互換)。
        """
        global _get_current_acl_async
        if identity:
            _get_current_acl_async = identity.get("get_current_acl", _get_current_acl_async)
        print(f"[user_acl] register_hub_tools called: identity={identity is not None} "
              f"_get_current_acl_async wired={_get_current_acl_async is not None}", flush=True)

        # 起動時に index を冪等作成
        _ensure_index()
        _ensure_fleet_state_index()

        @mcp.tool()
        async def list_clusters() -> str:
            """接続可能なスポーククラスタの一覧を返す (全属性表示)。

            中央ハブの OpenSearch index=spoke_clusters に登録済みの
            全クラスタを列挙する。 status='disabled' は除外。
            他の cluster_* ツールの cluster 引数に渡せる値はここで確認する。
            ACL によりユーザーがアクセス可能なクラスタのみ表示される (admin は全件)。
            """
            clusters = _load_registry()
            if not clusters:
                return ("スポーククラスタは未登録です。 "
                        "spoke_register で登録してください。")
            # ACL フィルタ (admin auto-bypass、 配線前なら無加工)
            clusters = await _filter_clusters_by_acl(clusters)
            if not clusters:
                return ("アクセス可能なクラスタがありません。"
                        " 管理者 (openspoke_admin) に user_acl 設定を依頼してください。")
            lines = [f"## 登録済みクラスタ ({len(clusters)} 件)\n"]
            for name in sorted(clusters.keys()):
                e = clusters[name]
                lines.append(f"### {name}")
                if e.get("env"):
                    lines.append(f"- 環境: {e.get('env')}")
                if e.get("k8s_distribution"):
                    lines.append(f"- ディストリビューション: "
                                 f"{e.get('k8s_distribution')}")
                lines.append(f"- endpoint: {e.get('url', '(未設定)')}")
                if e.get("cloudflare_tunnel_id"):
                    lines.append(f"- Cloudflare Tunnel ID: "
                                 f"{e.get('cloudflare_tunnel_id')}")
                if e.get("description"):
                    lines.append(f"- 説明: {e.get('description')}")
                if e.get("purpose"):
                    lines.append(f"- 利用目的: {e.get('purpose')}")
                if e.get("owner"):
                    lines.append(f"- 所有者: {e.get('owner')}")
                if e.get("status"):
                    lines.append(f"- ステータス: {e.get('status')}")
                if e.get("rancher_managed") is not None:
                    lines.append(f"- Rancher 管理下: "
                                 f"{'yes' if e.get('rancher_managed') else 'no'}")
                if e.get("notes"):
                    lines.append(f"- 備考: {e.get('notes')}")
                if e.get("updated_at"):
                    lines.append(f"- 更新日時: {e.get('updated_at')}")
                lines.append("")
            return "\n".join(lines)

        @mcp.tool()
        async def spoke_register(
            cluster_name: str,
            url: str,
            description: str = "",
            env: str = "",
            k8s_distribution: str = "",
            cloudflare_tunnel_id: str = "",
            purpose: str = "",
            owner: str = "",
            status: str = "active",
            rancher_managed: bool = True,
            notes: str = "",
        ) -> str:
            """スポーククラスタを登録する (新規)。

            cluster_name が既に存在する場合はエラー (上書きには spoke_update)。

            Args:
                cluster_name:          クラスタ識別名 (例: "example-cluster"、
                                       "rancher"、 "rke2"、 "linode-prod-001")
                url:                   スポーク MCP のベース URL (例:
                                       "https://spoke-example.example.com")
                description:           短い説明
                env:                   "aws-eks" / "linode-rke2" / "onprem-rke2" など
                k8s_distribution:      "eks" / "rke2" / "k3s" / "kubeadm" など
                cloudflare_tunnel_id:  Cloudflare Tunnel の UUID (なければ空)
                purpose:               利用目的 (自由記述)
                owner:                 所有者・連絡先 (例: "your-user")
                status:                "active" / "setup" / "disabled"
                                       (default "active")
                rancher_managed:       Rancher 管理下なら True (default)
                notes:                 自由記述メモ
            """
            if not cluster_name or not url:
                return "エラー: cluster_name と url は必須です。"

            # 既存チェック
            head = _os_request("HEAD",
                               f"/{_REGISTRY_INDEX}/_doc/{cluster_name}")
            if head.get("status_code") == 200:
                return (f"エラー: cluster_name='{cluster_name}' は既に登録済みです。"
                        " 既存を更新するには spoke_update を使用してください。")

            now = datetime.datetime.now(datetime.timezone.utc).isoformat()
            doc = {
                "cluster_name": cluster_name,
                "url": url.rstrip("/"),
                "description": description,
                "env": env,
                "k8s_distribution": k8s_distribution,
                "cloudflare_tunnel_id": cloudflare_tunnel_id,
                "purpose": purpose,
                "owner": owner,
                "status": status,
                "rancher_managed": rancher_managed,
                "notes": notes,
                "created_at": now,
                "updated_at": now,
            }
            res = _os_request("PUT",
                              f"/{_REGISTRY_INDEX}/_doc/{cluster_name}",
                              body=doc, params={"refresh": "true"})
            if res.get("status_code") in (200, 201):
                return (f"登録しました: cluster_name='{cluster_name}', "
                        f"url='{doc['url']}'")
            return f"エラー: 登録失敗 {res}"

        @mcp.tool()
        async def spoke_update(
            cluster_name: str,
            url: str | None = None,
            description: str | None = None,
            env: str | None = None,
            k8s_distribution: str | None = None,
            cloudflare_tunnel_id: str | None = None,
            purpose: str | None = None,
            owner: str | None = None,
            status: str | None = None,
            rancher_managed: bool | None = None,
            notes: str | None = None,
        ) -> str:
            """スポーククラスタの登録情報を部分更新する。

            None で渡されたフィールドは変更しない (空文字 "" は明示的な空設定)。
            cluster_name は変更不可 (作り直しなら spoke_delete + spoke_register)。

            Args:
                cluster_name: 更新対象のクラスタ識別名 (必須)
                その他:       変更したいフィールドだけ指定。 None は無変更。
            """
            # 既存取得
            get_res = _os_request("GET",
                                  f"/{_REGISTRY_INDEX}/_doc/{cluster_name}")
            if get_res.get("status_code") != 200:
                return f"エラー: cluster_name='{cluster_name}' は未登録です。"
            current = (get_res.get("json") or {}).get("_source") or {}

            updates = {}
            for k, v in {
                "url": url.rstrip("/") if isinstance(url, str) else url,
                "description": description,
                "env": env,
                "k8s_distribution": k8s_distribution,
                "cloudflare_tunnel_id": cloudflare_tunnel_id,
                "purpose": purpose,
                "owner": owner,
                "status": status,
                "rancher_managed": rancher_managed,
                "notes": notes,
            }.items():
                if v is not None:
                    updates[k] = v
            if not updates:
                return f"更新対象フィールドの指定がありません: '{cluster_name}'"

            current.update(updates)
            current["cluster_name"] = cluster_name  # 念のため固定
            current["updated_at"] = datetime.datetime.now(
                datetime.timezone.utc).isoformat()

            res = _os_request("PUT",
                              f"/{_REGISTRY_INDEX}/_doc/{cluster_name}",
                              body=current, params={"refresh": "true"})
            if res.get("status_code") in (200, 201):
                changed = ", ".join(updates.keys())
                return (f"更新しました: cluster_name='{cluster_name}', "
                        f"更新フィールド: {changed}")
            return f"エラー: 更新失敗 {res}"

        @mcp.tool()
        async def spoke_delete(cluster_name: str) -> str:
            """スポーククラスタの登録を削除する。

            注: スポーク MCP 本体や Cloudflare Tunnel は削除されない
            (これらはクラスタ側の運用で別途撤去する)。 ハブの管理対象から
            外すだけ。

            Args:
                cluster_name: 削除対象のクラスタ識別名
            """
            res = _os_request("DELETE",
                              f"/{_REGISTRY_INDEX}/_doc/{cluster_name}",
                              params={"refresh": "true"})
            if res.get("status_code") == 200:
                return f"削除しました: cluster_name='{cluster_name}'"
            if res.get("status_code") == 404:
                return f"エラー: cluster_name='{cluster_name}' は未登録です。"
            return f"エラー: 削除失敗 {res}"

