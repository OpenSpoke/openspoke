        @mcp.tool()
        async def delete_project(
            project_id: str,
            cascade: bool = True,
        ) -> str:
            """プロジェクトを削除する。

            cascade=True (default) の場合、 所属する live spawn を含めて連鎖削除する。
            confirm なしで即実行される。

            Args:
                project_id: 削除対象プロジェクト ID (proj-{hex8})
                cascade:    True なら所属 spawn も連鎖削除 (default True)
            Returns:
                "OK: ..." または "エラー: ..."
            """
            if not project_id:
                return "エラー: project_id が空です"
            payload: dict = {"project_id": project_id, "cascade": cascade}
            try:
                async with httpx.AsyncClient(timeout=15.0) as c:
                    r = await c.post(f"{_KERNEL_URL}/core/project/delete", json=payload)
                if r.status_code != 200:
                    return f"エラー: kernel http={r.status_code} {r.text[:200]}"
                res = r.json()
                if not res.get("ok"):
                    return f"エラー: {res.get('error') or '未知のエラー'}"
                deleted_spawns = res.get("deleted_spawns", 0)
                return (
                    f"OK: project_id={project_id} deleted. "
                    f"deleted_spawns={deleted_spawns}"
                )
            except Exception as e:
                logger.warning(f"[delete_project] failed: {e}")
                return f"エラー: {type(e).__name__}: {str(e)[:200]}"

        @mcp.tool()
        async def add_project_member(
            project_id: str,
            user_id: str,
            role: str = "member",
        ) -> str:
            """プロジェクトにメンバーを追加する。

            Args:
                project_id: 対象プロジェクト ID (proj-{hex8})
                user_id:    追加するユーザーの user_id (email 形式)
                role:       "owner" または "member" (default "member")
            Returns:
                "OK: ..." または "エラー: ..."
            """
            if not project_id:
                return "エラー: project_id が空です"
            if not user_id:
                return "エラー: user_id が空です"
            if role not in ("owner", "member"):
                return f"エラー: role は 'owner' または 'member' のみ指定可能です (got: {role!r})"
            payload: dict = {"project_id": project_id, "user_id": user_id, "role": role}
            try:
                async with httpx.AsyncClient(timeout=15.0) as c:
                    r = await c.post(f"{_KERNEL_URL}/core/project/add_member", json=payload)
                if r.status_code != 200:
                    return f"エラー: kernel http={r.status_code} {r.text[:200]}"
                res = r.json()
                if not res.get("ok"):
                    return f"エラー: {res.get('error') or '未知のエラー'}"
                p = res.get("project") or {}
                return (
                    f"OK: user_id={user_id!r} を project_id={project_id} に "
                    f"role={role} で追加しました。 updated_at={p.get('updated_at')}"
                )
            except Exception as e:
                logger.warning(f"[add_project_member] failed: {e}")
                return f"エラー: {type(e).__name__}: {str(e)[:200]}"

