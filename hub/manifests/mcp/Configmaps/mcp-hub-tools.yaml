        @mcp.tool()
        async def list_spawn_questions() -> str:
            """worker が [BLOCKING] で停止して回答待ちの spawn 一覧を、質問本文つきで返す。

            対話 Claude はこの tool で溜まっている blocking 質問を一括取得し、
            answer_spawn で個別に回答すると worker が作業を再開する。

            Returns:
                複数行テキスト
            """
            payload = {"state": "waiting_user", "limit": 100, "include_result": False}
            try:
                async with httpx.AsyncClient(timeout=15.0) as c:
                    r = await c.post(f"{_KERNEL_URL}/core/spawn/list", json=payload)
                if r.status_code != 200:
                    return f"エラー: kernel http={r.status_code} {r.text[:200]}"
                res = r.json()
                if not res.get("ok"):
                    return f"エラー: {res.get('error') or '未知のエラー'}"
                spawns = res.get("spawns") or []
                if not spawns:
                    return "回答待ちの質問はありません。"
                lines = [f"回答待ち {len(spawns)} 件:"]
                for s in spawns:
                    question = s.get("question") or "(質問本文が取得できませんでした)"
                    serial = s.get('serial') or '??'
                    alias = s.get('alias') or ''
                    alias_str = f" [{alias}]" if alias else ""
                    lines.append("")
                    lines.append(
                        f"=== spawn-{serial}{alias_str} full_id={s.get('full_id')} "
                        f"user={s.get('user_id')!r} priority={s.get('priority')} "
                        f"submitted={s.get('submitted_at')} ==="
                    )
                    lines.append(question)
                return "\n".join(lines)
            except Exception as e:
                logger.warning(f"[list_spawn_questions] failed: {e}")
                return f"エラー: {type(e).__name__}: {str(e)[:200]}"

        @mcp.tool()
        async def answer_spawn(spawn_ref: str, answer: str) -> str:
            """waiting_user 状態の spawn に回答を送る。 worker はこれを受けて作業を続ける。

            Args:
                spawn_ref: 通番 / フル ID / 別名 のいずれか
                answer: 対話 Claude から worker への回答本文
            Returns:
                "OK: ..." または "エラー: ..."
            """
            if not spawn_ref:
                return "エラー: spawn_ref が空です"
            if not answer:
                return "エラー: answer が空です"
            payload = {"spawn_ref": spawn_ref, "answer": answer}
            try:
                async with httpx.AsyncClient(timeout=15.0) as c:
                    r = await c.post(f"{_KERNEL_URL}/core/spawn/answer", json=payload)
                if r.status_code != 200:
                    return f"エラー: kernel http={r.status_code} {r.text[:200]}"
                res = r.json()
                if not res.get("ok"):
                    return f"エラー: {res.get('error') or '未知のエラー'}"
                return f"OK: spawn_ref={spawn_ref} に回答を送信しました。 worker が続きから作業を再開します。"
            except Exception as e:
                logger.warning(f"[answer_spawn] failed: {e}")
                return f"エラー: {type(e).__name__}: {str(e)[:200]}"

        @mcp.tool()
        async def force_spawn_state(spawn_ref: str, new_state: str, reason: str = "") -> str:
            """orphan spawn (worker が SIGKILL された後に waiting_user のまま残る spawn) を
            強制的に cancelled または failed に遷移させる。 admin 専用。

            副作用として spawn:question / spawn:answer_queue も cleanup する。
            現在 state が done / failed / cancelled の場合は no-op で成功扱い。

            Args:
                spawn_ref: 対象 spawn の 通番 / フル ID / 別名
                new_state: 遷移先 state。 "cancelled" または "failed" のみ許容
                reason:    cleanup 理由 (省略時は "force_state by admin")
            Returns:
                "OK: ..." または "エラー: ..."
            """
            if not spawn_ref:
                return "エラー: spawn_ref が空です"
            if new_state not in ("cancelled", "failed"):
                return f"エラー: new_state は 'cancelled' または 'failed' のみ指定可能です (got: {new_state!r})"
            payload: dict = {"spawn_ref": spawn_ref, "new_state": new_state}
            if reason:
                payload["reason"] = reason
            try:
                async with httpx.AsyncClient(timeout=15.0) as c:
                    r = await c.post(f"{_KERNEL_URL}/core/spawn/force_state", json=payload)
                if r.status_code != 200:
                    return f"エラー: kernel http={r.status_code} {r.text[:200]}"
                res = r.json()
                if not res.get("ok"):
                    return f"エラー: {res.get('error') or '未知のエラー'}"
                s = res.get("spawn") or {}
                return (f"OK: spawn_ref={spawn_ref} を {new_state} に遷移しました。 "
                        f"state={s.get('state')} finished_at={s.get('finished_at')}")
            except Exception as e:
                logger.warning(f"[force_spawn_state] failed: {e}")
                return f"エラー: {type(e).__name__}: {str(e)[:200]}"

        # ========================================================
        # プロジェクト管理 (kernel /core/project/* 系)
        # ========================================================

        @mcp.tool()
        async def create_project(
            name: str,
            description: str = "",
            owners: list | None = None,
            members: list | None = None,
        ) -> str:
            """プロジェクトを新規作成する。

            プロジェクト ID は kernel が自動生成する (形式: proj-{hex8})。
            owners / members は user_id (email 形式) の配列。

            Args:
                name:        プロジェクト名 (必須)
                description: 説明 (省略可)
                owners:      共同オーナーの user_id 配列 (省略時は空)
                members:     メンバーの user_id 配列 (省略時は空)
            Returns:
                "OK: project_id=proj-XXXXXXXX name=..." または "エラー: ..."
            """
            if not name:
                return "エラー: name が空です"
            payload: dict = {
                "name": name,
                "description": description,
                "owners": owners or [],
                "members": members or [],
            }
            try:
                async with httpx.AsyncClient(timeout=15.0) as c:
                    r = await c.post(f"{_KERNEL_URL}/core/project/create", json=payload)
                if r.status_code != 200:
                    return f"エラー: kernel http={r.status_code} {r.text[:200]}"
                res = r.json()
                if not res.get("ok"):
                    return f"エラー: {res.get('error') or '未知のエラー'}"
                p = res.get("project") or {}
                return (
                    f"OK: project_id={p.get('project_id')} name={p.get('name')!r} "
                    f"status={p.get('status')} created_at={p.get('created_at')}"
                )
            except Exception as e:
                logger.warning(f"[create_project] failed: {e}")
                return f"エラー: {type(e).__name__}: {str(e)[:200]}"

        @mcp.tool()
        async def list_projects(
            status: str = "",
            user_id: str = "",
            limit: int = 50,
        ) -> str:
            """プロジェクト一覧を返す。

            Args:
                status:  絞り込み (active / completed / archived)。 空なら全件
                user_id: 特定ユーザーが owner または member のプロジェクトに絞る (空なら全件)
                limit:   最大件数 (default 50)
            Returns:
                複数行テキスト
            """
            payload: dict = {"status": status, "user_id": user_id, "limit": limit}
            try:
                async with httpx.AsyncClient(timeout=15.0) as c:
                    r = await c.post(f"{_KERNEL_URL}/core/project/list", json=payload)
                if r.status_code != 200:
                    return f"エラー: kernel http={r.status_code} {r.text[:200]}"
                res = r.json()
                if not res.get("ok"):
                    return f"エラー: {res.get('error') or '未知のエラー'}"
                projects = res.get("projects") or []
                if not projects:
                    return "プロジェクトは 0 件です。"
                lines = [f"合計 {res.get('count', len(projects))} 件:"]
                for p in projects:
                    owners_str = ", ".join(p.get("owners") or []) or "(なし)"
                    members_str = ", ".join(p.get("members") or []) or "(なし)"
                    lines.append(
                        f"- {p.get('project_id')} [{p.get('status')}] "
                        f"{p.get('name')!r}  owners={owners_str}  members={members_str}"
                    )
                return "\n".join(lines)
            except Exception as e:
                logger.warning(f"[list_projects] failed: {e}")
                return f"エラー: {type(e).__name__}: {str(e)[:200]}"

        @mcp.tool()
        async def get_project(project_id: str) -> str:
            """プロジェクト 1 件の詳細を返す。

            Args:
                project_id: 対象プロジェクト ID (proj-{hex8})
            Returns:
                プロジェクト詳細テキスト
            """
            if not project_id:
                return "エラー: project_id が空です"
            payload: dict = {"project_id": project_id}
            try:
                async with httpx.AsyncClient(timeout=15.0) as c:
                    r = await c.post(f"{_KERNEL_URL}/core/project/get", json=payload)
                if r.status_code != 200:
                    return f"エラー: kernel http={r.status_code} {r.text[:200]}"
                res = r.json()
                if not res.get("ok"):
                    return f"エラー: {res.get('error') or '未知のエラー'}"
                p = res.get("project") or {}
                owners_str = ", ".join(p.get("owners") or []) or "(なし)"
                members_str = ", ".join(p.get("members") or []) or "(なし)"
                lines = [
                    f"project_id: {p.get('project_id')}",
