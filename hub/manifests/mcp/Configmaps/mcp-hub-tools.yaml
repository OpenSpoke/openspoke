        @mcp.tool()
        async def update_project(
            project_id: str,
            name: str | None = None,
            description: str | None = None,
            status: str | None = None,
        ) -> str:
            """プロジェクトの情報を更新する。

            None で渡したフィールドは変更されない。
            status は active / completed / archived の 3 値のみ有効。

            Args:
                project_id:  更新対象プロジェクト ID (必須)
                name:        新しい名前 (省略時は変更なし)
                description: 新しい説明 (省略時は変更なし)
                status:      新しいステータス (active / completed / archived)
            Returns:
                "OK: ..." または "エラー: ..."
            """
            if not project_id:
                return "エラー: project_id が空です"
            payload: dict = {"project_id": project_id}
            if name is not None:
                payload["name"] = name
            if description is not None:
                payload["description"] = description
            if status is not None:
                payload["status"] = status
            try:
                async with httpx.AsyncClient(timeout=15.0) as c:
                    r = await c.post(f"{_KERNEL_URL}/core/project/update", json=payload)
                if r.status_code != 200:
                    return f"エラー: kernel http={r.status_code} {r.text[:200]}"
                res = r.json()
                if not res.get("ok"):
                    return f"エラー: {res.get('error') or '未知のエラー'}"
                p = res.get("project") or {}
                return (
                    f"OK: project_id={p.get('project_id')} name={p.get('name')!r} "
                    f"status={p.get('status')} updated_at={p.get('updated_at')}"
                )
            except Exception as e:
                logger.warning(f"[update_project] failed: {e}")
                return f"エラー: {type(e).__name__}: {str(e)[:200]}"

