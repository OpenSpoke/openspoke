        @mcp.tool()
        async def cluster_local_mcp_call(
            cluster: str,
            service: str,
            namespace: str,
            tool_name: str,
            arguments: dict = None,
            port: int = 8000,
        ) -> str:
            """指定クラスタのスポーク MCP から、 同一クラスタ内の別 MCP のツールを呼ぶ。

            中央ハブが cluster で指定されたスポーク MCP の local_mcp_call を MCP
            プロトコル経由で呼び出す。 スポーク MCP は K8s 内部 Service DNS を使い、
            同一クラスタ内の他 MCP に SSE で接続して tool_name を実行する。 ハブから
            スポークの先にある「もう一段奥の MCP」 までリーチするためのファンアウト。

            用途例 (アプリケーション本体の OpenSearch アクセス):
                cluster_local_mcp_call(
                    cluster="cluster-name",
                    service="mcp-application",
                    namespace="mcp",
                    tool_name="opensearch_search",
                    arguments={"index": "some_index",
                               "query_dsl": {"term": {"key": "..."}}}
                )
            この経路: ハブ → スポーク MCP (rag-spoke namespace) → アプリケーション MCP
            (mcp namespace) → アプリケーション kernel → アプリケーション OpenSearch。

            重要: cluster_opensearch_search / cluster_opensearch_update_document は
            スポーク自身の OpenSearch (rag-spoke の opensearch インスタンス) にしか
            届かない。 アプリケーション本体の OpenSearch (opensearch namespace の別
            インスタンス) に届けるには本ツール経由でアプリケーション MCP (mcp namespace)
            の同名ツールを呼ぶこと。 OpenSearch インスタンスが複数あるので混同しないよう
            に注意。

            Args:
                cluster:   対象クラスタ名 (list_clusters で確認)
                service:   対象 MCP の Service 名 (例: "mcp-company1")
                namespace: 対象 Service の namespace (例: "mcp")
                tool_name: 対象 MCP のツール名 (例: "opensearch_search")
                arguments: ツール引数辞書 (省略時は空)
                port:      Service ポート (default 8000)
            """
            return await _spoke_call(cluster, "local_mcp_call", {
                "service": service,
                "namespace": namespace,
                "tool_name": tool_name,
                "arguments": arguments or {},
                "port": port,
            })

