apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-knowledge-migrate
  namespace: mcp
data:
  knowledge_migrate_tool.py: |
    """knowledge 移行の制御ツール (ハブ / 検証 MCP 用)。

    target kernel の /core/knowledge/migrate_pull を Cloudflare 経由で叩く。
    target が source の migrate_export を pull して自分に upsert する。
    content は kernel 間を直接流れ、 MCP / Claude のコンテキストには載らない
    (summary のみ返る)。

    mcp-server-code.py から
      import knowledge_migrate_tool as _km
      _km.register_knowledge_migrate_tools(mcp)
    で取り込む (github_tools / hub_tools と同じ流儀)。

    NOTE: mcp_server には typing が import されていないため、 型注釈は builtin
    (dict / list / str / bool) のみ使用する。
    """
    import os
    import httpx


    # kernel の公開エンドポイント (Cloudflare Tunnel、 path 限定公開)
    _KERNELS = {
        "aws": "https://kernel-0001.example.com",
        "aws2": "https://kernel-0002.example.com",
        "rag": "https://kernel-9001.example.com",
    }


    def register_knowledge_migrate_tools(mcp):
        _token = os.environ.get("KNOWLEDGE_MIGRATE_TOKEN", "")

        @mcp.tool()
        async def migrate_knowledge(target: str, source: str, collections: list,
                                    mode: str = "upsert", dry_run: bool = False) -> dict:
            """knowledge collection を source kernel から target kernel に移行 (pull) する。

            target / source は "aws" | "aws2" | "rag"。 target kernel の migrate_pull を
            起動し、 target が source の migrate_export を pull して mode で自分に投入する。
            mode="upsert" なら target 既存データは消えず追記される (同 id は上書き、 無い id は追加)。
            dry_run=True なら取得件数のみ確認し、 投入はしない。

            Args:
                target:      投入先クラスタ "aws" | "aws2" | "rag"
                source:      取得元クラスタ "aws" | "aws2" | "rag"
                collections: 移行対象 collection 名のリスト (例: ["secretary_knowledge_your_user"])
                mode:        "upsert" (既定、 追記) | "create" | "update"
                dry_run:     True で件数のみ確認 (非破壊)
            Returns:
                target kernel の migrate_pull の結果 (collection ごとの fetched/upserted/failed を含む dict)。
            """
            if not _token:
                return {"ok": False, "error": "KNOWLEDGE_MIGRATE_TOKEN not configured on this MCP"}
            if target not in _KERNELS or source not in _KERNELS:
                return {"ok": False, "error": f"target/source must be one of {list(_KERNELS.keys())}"}
            if target == source:
                return {"ok": False, "error": "target and source must differ"}
            if not isinstance(collections, list) or not collections:
                return {"ok": False, "error": "collections must be a non-empty list"}

            target_url = _KERNELS[target]
            source_url = _KERNELS[source]
            try:
                async with httpx.AsyncClient(timeout=180.0) as c:
                    r = await c.post(
                        f"{target_url}/core/knowledge/migrate_pull",
                        json={
                            "source_base_url": source_url,
                            "source_token": _token,
                            "collections": collections,
                            "mode": mode,
                            "dry_run": dry_run,
                        },
                        headers={"Authorization": f"Bearer {_token}"},
                    )
                try:
                    return r.json()
                except Exception:
                    return {"ok": False,
                            "error": f"non-JSON response (status {r.status_code}): {r.text[:300]}"}
            except Exception as e:
                return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}
