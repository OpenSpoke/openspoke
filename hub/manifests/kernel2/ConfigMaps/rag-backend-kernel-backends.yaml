apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-backend-kernel-backends
  namespace: rag-company1
data:
  backends.py: |
    """backends.py - kernel の backend 抽象化層

    ============================================================================
    目的
    ----------------------------------------------------------------------------
    kernel が使う backend が Milvus / Memgraph / OpenSearch のどれに
    置き換わっても、 上位 (mcp / rag-hub / frontend) の変更は不要にする。
    kernel 内に VectorStore / GraphStore / HandoffStore の 3 抽象を定義し、
    実装 (Milvus adapter / Memgraph adapter) を差し替え可能にする。

    抽象対象は vectorstore + graph + handoff。
    OpenSearch は当面 3 者体制のまま抽象化外 (fleet_state 等の実運用があり
    抽象化で失敗すると影響が大きい)。

    ============================================================================
    実装範囲 (本 file)
    ----------------------------------------------------------------------------
    - abstract base class の定義 (VectorStore / GraphStore / HandoffStore)
    - Milvus adapter (VectorStore 実装)
    - Memgraph adapter (GraphStore + HandoffStore 実装)
    - factory (BACKEND_VECTOR / BACKEND_GRAPH / BACKEND_HANDOFF env で切替)

    ============================================================================
    """

    from abc import ABC, abstractmethod
    from typing import Any, Dict, List, Optional
    import os
    import logging

    logger = logging.getLogger(__name__)

    # =========================================================================
    # VectorStore Interface
    # =========================================================================

    class VectorStore(ABC):
        """Vector store abstract base class.

        kernel の /core/vectorstore/* 11 endpoint (has-namespace,
        init-namespace, drop-namespace, add-field, upsert, search, query,
        delete, flush, load, count) を method として持つ。

        namespace は Milvus の collection に相当。
        """

        @abstractmethod
        def has_namespace(self, namespace: str) -> bool:
            """指定 namespace が存在するか"""

        @abstractmethod
        def init_namespace(
            self,
            namespace: str,
            vector_dim: int,
            extra_fields: Optional[List[Dict[str, Any]]] = None,
        ) -> None:
            """namespace 作成 (schema 定義 + vector index 作成)"""

        @abstractmethod
        def drop_namespace(self, namespace: str) -> None:
            """namespace 削除"""

        @abstractmethod
        def add_field(self, namespace: str, field: Dict[str, Any]) -> None:
            """既存 namespace にフィールドを追加"""

        @abstractmethod
        def upsert(
            self, namespace: str, records: List[Dict[str, Any]]
        ) -> Dict[str, Any]:
            """レコード投入 (新規 / 更新)"""

        @abstractmethod
        def search(
            self,
            namespace: str,
            vector: List[float],
            top_k: int,
            filter_expr: Optional[str] = None,
            output_fields: Optional[List[str]] = None,
        ) -> List[Dict[str, Any]]:
            """ベクトル類似検索"""

        @abstractmethod
        def query(
            self,
            namespace: str,
            filter_expr: str,
            output_fields: Optional[List[str]] = None,
            limit: Optional[int] = None,
        ) -> List[Dict[str, Any]]:
            """メタデータ絞り込みクエリ (ベクトル非使用)"""

        @abstractmethod
        def delete(self, namespace: str, filter_expr: str) -> Dict[str, Any]:
            """フィルタ一致レコード削除"""

        @abstractmethod
        def flush(self, namespace: str) -> None:
            """namespace の書き込み確定"""

        @abstractmethod
        def load(self, namespace: str) -> None:
            """namespace を検索可能状態にする"""

        @abstractmethod
        def count(
            self, namespace: str, filter_expr: Optional[str] = None
        ) -> int:
            """namespace 内のレコード数"""

    # =========================================================================
    # GraphStore Interface
    # =========================================================================

    class GraphStore(ABC):
        """Graph store abstract base class.

        kernel の /core/graph/run と /core/graph/format-context に対応。
        Cypher 実行と、 検索で得たエンティティ群の周辺グラフを LLM 用に
        整形する高位 API。
        """

        @abstractmethod
        def run_cypher(
            self,
            query: str,
            params: Optional[Dict[str, Any]] = None,
        ) -> List[Dict[str, Any]]:
            """Cypher クエリを実行、 結果を dict のリストで返す"""

        @abstractmethod
        def format_context(
            self,
            entity_names: List[str],
            max_relations: int = 20,
        ) -> str:
            """指定エンティティ群の周辺グラフを LLM 用 context 文字列に整形"""

    # =========================================================================
    # HandoffStore Interface (system_brief / topics 専用の高位 API)
    # =========================================================================

    class HandoffStore(ABC):
        """Handoff (brief / topic) store abstract base class.

        kernel の /core/handoff/* 7 endpoint (brief/get, brief/upsert,
        topics/list, topic/get, topic/upsert, topic/delete, migrate) に対応。

        Memgraph 実装のスキーマ:
          (:Brief {id:"brief", content, title, updated_at})
          (:Topic {id:<X>, title, content, summary, updated_at})
        """

        @abstractmethod
        def brief_get(self) -> Optional[Dict[str, Any]]:
            """brief (単一) を取得"""

        @abstractmethod
        def brief_upsert(self, content: str) -> Dict[str, Any]:
            """brief を upsert。 戻り値 {created_at, updated_at}"""

        @abstractmethod
        def topics_list(
            self,
            allowed_modules: Optional[List[str]] = None,
        ) -> List[Dict[str, Any]]:
            """全 topic の {id, title, summary, category, module, updated_at} 一覧。
            allowed_modules は module ACL 絞り込み。 None or ["*"] を含む なら
            admin 相当 (全返し + module=null 含む)、 それ以外は allowed_modules に
            含まれる module の topic のみ (module=null は除外)。"""

        @abstractmethod
        def topic_get(self, topic_id: str) -> Optional[Dict[str, Any]]:
            """指定 topic の本文取得"""

        @abstractmethod
        def topic_upsert(
            self,
            topic_id: str,
            title: Optional[str] = None,
            summary: Optional[str] = None,
            content: Optional[str] = None,
            category: Optional[str] = None,
            module: Optional[str] = None,
        ) -> Dict[str, Any]:
            """topic を upsert。 指定された field のみ更新。
            戻り値 {action: 'created'|'updated', created_at, updated_at}"""

        @abstractmethod
        def topic_delete(self, topic_id: str) -> Dict[str, Any]:
            """topic を削除。 戻り値 {deleted: bool} (存在しない id は deleted=False)"""

        @abstractmethod
        def topic_set_tags(self, topic_id: str, tags: List[str]) -> Dict[str, Any]:
            """topic の tags property と HAS_TAG 関係を全置換する。
            tags は文字列 list (正規化前でも可、 実装側で lowercase + snake_case 化)。
            戻り値 {ok: bool, tags: List[str], error: str | None (省略可)}"""

        @abstractmethod
        def migrate(self, source: str) -> Dict[str, Any]:
            """外部 source から topic を pull して自身に取り込む"""

    # =========================================================================
    # Milvus Adapter (VectorStore 実装)
    # =========================================================================

    class MilvusVectorStore(VectorStore):
        """Milvus (pymilvus) を使った VectorStore 実装。

        前提: kernel 起動時 (main.py の startup) で
              pymilvus.connections.connect(alias="default", host=..., port=...)
              が既に呼ばれている。
        """

        def __init__(self):
            from pymilvus import (
                Collection,
                utility,
                FieldSchema,
                CollectionSchema,
                DataType,
            )
            self._utility = utility
            self._Collection = Collection
            self._FieldSchema = FieldSchema
            self._CollectionSchema = CollectionSchema
            self._DataType = DataType

        def has_namespace(self, namespace: str) -> bool:
            return self._utility.has_collection(namespace)

        def init_namespace(
            self,
            namespace: str,
            vector_dim: int,
            extra_fields: Optional[List[Dict[str, Any]]] = None,
        ) -> None:
            fields = [
                self._FieldSchema(
                    name="id",
                    dtype=self._DataType.INT64,
                    is_primary=True,
                    auto_id=True,
                ),
                self._FieldSchema(
                    name="text",
                    dtype=self._DataType.VARCHAR,
                    max_length=5000,
                ),
                self._FieldSchema(
                    name="embedding",
                    dtype=self._DataType.FLOAT_VECTOR,
                    dim=vector_dim,
                ),
            ]
            if extra_fields:
                for f in extra_fields:
                    fields.append(self._make_field(f))
            schema = self._CollectionSchema(fields=fields)
            collection = self._Collection(name=namespace, schema=schema)
            index_params = {
                "metric_type": "IP",
                "index_type": "IVF_FLAT",
                "params": {"nlist": 128},
            }
            collection.create_index(
                field_name="embedding", index_params=index_params
            )

        def _make_field(self, spec: Dict[str, Any]):
            # spec 例: {"name": "category", "dtype": "VARCHAR", "max_length": 128}
            name = spec["name"]
            dtype = getattr(self._DataType, spec["dtype"])
            kwargs = {"name": name, "dtype": dtype}
            for k in ("max_length", "dim", "is_partition_key"):
                if k in spec:
                    kwargs[k] = spec[k]
            return self._FieldSchema(**kwargs)

        def drop_namespace(self, namespace: str) -> None:
            if self._utility.has_collection(namespace):
                self._utility.drop_collection(namespace)

        def add_field(self, namespace: str, field: Dict[str, Any]) -> None:
            raise NotImplementedError(
                "add_field: kernel endpoint 側に本実装がある"
            )

        def upsert(
            self, namespace: str, records: List[Dict[str, Any]]
        ) -> Dict[str, Any]:
            if not records:
                return {"inserted": 0}
            collection = self._Collection(namespace)
            columns = self._records_to_columns(collection, records)
            result = collection.upsert(columns)
            return {
                "inserted": len(records),
                "upsert_count": getattr(result, "upsert_count", None),
            }

        def _records_to_columns(self, collection, records):
            cols = []
            for f in collection.schema.fields:
                if f.auto_id:
                    continue
                cols.append([r.get(f.name) for r in records])
            return cols

        def search(
            self,
            namespace: str,
            vector: List[float],
            top_k: int,
            filter_expr: Optional[str] = None,
            output_fields: Optional[List[str]] = None,
        ) -> List[Dict[str, Any]]:
            collection = self._Collection(namespace)
            collection.load()
            results = collection.search(
                data=[vector],
                anns_field="embedding",
                param={"metric_type": "IP", "params": {"nprobe": 10}},
                limit=top_k,
                expr=filter_expr,
                output_fields=output_fields or ["text"],
            )
            out: List[Dict[str, Any]] = []
            for hits in results:
                for hit in hits:
                    item = {"id": hit.id, "distance": hit.distance}
                    for f in output_fields or ["text"]:
                        item[f] = hit.entity.get(f)
                    out.append(item)
            return out

        def query(
            self,
            namespace: str,
            filter_expr: str,
            output_fields: Optional[List[str]] = None,
            limit: Optional[int] = None,
        ) -> List[Dict[str, Any]]:
            collection = self._Collection(namespace)
            collection.load()
            kwargs = {
                "expr": filter_expr,
                "output_fields": output_fields or ["*"],
            }
            if limit:
                kwargs["limit"] = limit
            return collection.query(**kwargs)

        def delete(self, namespace: str, filter_expr: str) -> Dict[str, Any]:
            collection = self._Collection(namespace)
            result = collection.delete(filter_expr)
            return {"delete_count": getattr(result, "delete_count", None)}

        def flush(self, namespace: str) -> None:
            collection = self._Collection(namespace)
            collection.flush()

        def load(self, namespace: str) -> None:
            collection = self._Collection(namespace)
            collection.load()

        def count(
            self, namespace: str, filter_expr: Optional[str] = None
        ) -> int:
            collection = self._Collection(namespace)
            collection.load()
            if filter_expr:
                rows = collection.query(
                    expr=filter_expr, output_fields=["count(*)"]
                )
                if rows and isinstance(rows[0], dict):
                    return int(rows[0].get("count(*)", 0))
                return len(rows)
            return collection.num_entities

    # =========================================================================
    # Memgraph Adapter (GraphStore + HandoffStore 実装)
    # =========================================================================

    class MemgraphGraphStore(GraphStore):
        """Memgraph (neo4j-driver, Bolt) を使った GraphStore 実装。

        driver は kernel 起動時に GraphDatabase.driver() で作成された共有
        インスタンスを注入する。 kernel 側の global 変数 neo4j_driver。
        """

        def __init__(self, driver):
            if driver is None:
                raise RuntimeError(
                    "MemgraphGraphStore: neo4j driver is None"
                )
            self._driver = driver

        def run_cypher(
            self,
            query: str,
            params: Optional[Dict[str, Any]] = None,
        ) -> List[Dict[str, Any]]:
            with self._driver.session() as session:
                result = session.run(query, params or {})
                return [dict(r) for r in result]

        def format_context(
            self,
            entity_names: List[str],
            max_relations: int = 20,
        ) -> str:
            if not entity_names:
                return ""
            query = (
                "MATCH (n)-[r]-(m) "
                "WHERE n.name IN $names "
                "RETURN n.name AS src, type(r) AS rel, m.name AS dst "
                "LIMIT $limit"
            )
            rows = self.run_cypher(
                query, {"names": entity_names, "limit": max_relations}
            )
            lines = [
                f"{r.get('src')} -[{r.get('rel')}]-> {r.get('dst')}"
                for r in rows
            ]
            return "\n".join(lines)

    # =========================================================================
    # 知識ベースの書き方の強制: SysML v2
    # =========================================================================
    # topic の本文を書き込む直前に sysml-validator (構文チェッカー sysml2 と
    # バリデーター mercurio-sysml) を呼び、合格しない本文は書き込まない。
    # MemgraphHandoffStore.topic_upsert の先頭で必ず通るので、
    # upsert_knowledge / jev_record_turn / 画面のどこから書いても同じに効く。
    #
    # 対象:
    #   - 新しく作る topic
    #   - SYSML_KB_CUTOFF 以降に作られた既存 topic の本文の更新
    # 対象外:
    #   - それより前に作られた topic (Markdown のまま更新してよい)
    #   - 本文を変えない更新 (title / summary だけ等、content=None)
    #
    # バリデーターに届かないときは書き込まない (止まったまま通すことはしない)。
    #
    # 環境変数:
    #   SYSML_KB_ENFORCE     strict (既定) / off (緊急時の逃げ道。普段は触らない)
    #   SYSML_KB_CUTOFF      方針の切り替え時刻 (ISO 8601)
    #   SYSML_VALIDATOR_URL  sysml-validator の口
    #
    # バリデーターのソースは hub/images/sysml-validator、
    # 配置は hub/manifests/sysml-validator。

    SYSML_KB_ENFORCE = os.getenv("SYSML_KB_ENFORCE", "strict").strip().lower()
    SYSML_KB_CUTOFF = os.getenv("SYSML_KB_CUTOFF", "2026-10-30T08:15:00+00:00")
    SYSML_VALIDATOR_URL = os.getenv(
        "SYSML_VALIDATOR_URL",
        "http://sysml-validator.rag-company1.svc.cluster.local:8080",
    )

    class SysmlPolicyError(ValueError):
        """本文が SysML v2 の方針に合わない (または調べられない)。

        上位の endpoint が str(e)[:200] で切るので、message は 200 字に収める。
        """

    def _parse_iso(value):
        from datetime import datetime
        try:
            return datetime.fromisoformat(str(value))
        except Exception:
            return None

    def sysml_validate(content: str) -> Dict[str, Any]:
        """sysml-validator の /validate を呼んで結果をそのまま返す。"""
        import json
        import urllib.request
        req = urllib.request.Request(
            SYSML_VALIDATOR_URL.rstrip("/") + "/validate",
            data=json.dumps({"content": content}).encode("utf-8"),
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=15) as resp:
            return json.loads(resp.read().decode("utf-8"))

    def enforce_sysml_policy(driver, topic_id: str, content: Optional[str]) -> Optional[Dict[str, Any]]:
        """書き込みの前に呼ぶ。対象外なら None、合格なら検証結果を返し、不合格なら例外。"""
        if content is None or SYSML_KB_ENFORCE == "off":
            return None
        with driver.session() as session:
            row = session.run(
                "MATCH (t:Topic {id:$id}) RETURN t.created_at AS created_at",
                {"id": topic_id},
            ).single()
        if row is not None:
            created = _parse_iso(row["created_at"])
            cutoff = _parse_iso(SYSML_KB_CUTOFF)
            if created is None or cutoff is None or created < cutoff:
                return None
        try:
            result = sysml_validate(content)
        except Exception as e:
            logger.error(f"[SYSML] validator unreachable id={topic_id}: {e}")
            raise SysmlPolicyError(
                f"SysML v2 のバリデーターに届かないため書き込みません ({type(e).__name__})"
            )
        if result.get("ok"):
            logger.info(
                f"[SYSML] ok id={topic_id} elements={result.get('elements')} "
                f"ms={result.get('elapsed_ms')}"
            )
            return result
        stage, diags = "構文", (result.get("syntax") or {}).get("diagnostics") or []
        if not diags:
            stage, diags = "参照", (result.get("semantic") or {}).get("diagnostics") or []
        d = diags[0] if diags else {}
        logger.info(f"[SYSML] rejected id={topic_id} stage={stage} diag={d}")
        message = (
            f"本文が SysML v2 として不合格 ({stage}、{d.get('line', '?')} 行 "
            f"{d.get('column', '?')} 桁): {d.get('message', '')}"
        )
        raise SysmlPolicyError(message[:190])

    class MemgraphHandoffStore(HandoffStore):
        """Memgraph 上の Brief / Topic node を扱う HandoffStore 実装。

        スキーマ:
          (:Brief {id:"brief", content, title, updated_at})
          (:Topic {id:<X>, title, content, summary, updated_at})
        """

        def __init__(self, driver):
            if driver is None:
                raise RuntimeError(
                    "MemgraphHandoffStore: neo4j driver is None"
                )
            self._driver = driver

        def brief_get(self) -> Optional[Dict[str, Any]]:
            with self._driver.session() as session:
                row = session.run(
                    "MATCH (b:Brief {id:'brief'}) "
                    "RETURN b.content AS content, "
                    "b.title AS title, "
                    "b.created_at AS created_at, "
                    "b.updated_at AS updated_at"
                ).single()
                if not row:
                    return None
                return dict(row)

        def brief_upsert(self, content: str) -> Dict[str, Any]:
            from datetime import datetime, timezone
            now_iso = datetime.now(timezone.utc).isoformat(timespec="seconds")
            with self._driver.session() as session:
                row = session.run(
                    "MERGE (b:Brief {id:'brief'}) "
                    "ON CREATE SET b.created_at = $now "
                    "SET b.content = $content, b.updated_at = $now "
                    "RETURN b.created_at AS created_at",
                    {"content": content, "now": now_iso},
                ).single()
                created_at = row["created_at"] if row else now_iso
            return {"created_at": created_at, "updated_at": now_iso}

        def topics_list(
            self,
            allowed_modules: Optional[List[str]] = None,
        ) -> List[Dict[str, Any]]:
            with self._driver.session() as session:
                if allowed_modules is None or (
                    isinstance(allowed_modules, list) and "*" in allowed_modules
                ):
                    # admin 相当: 全返し (module=null 含む)
                    result = session.run(
                        "MATCH (t:Topic) "
                        "RETURN t.id AS id, t.title AS title, "
                        "t.summary AS summary, t.category AS category, "
                        "t.module AS module, "
                        "t.updated_at AS updated_at "
                        "ORDER BY t.id ASC"
                    )
                else:
                    # 非 admin: allowed_modules 絞り込み (module=null は除外)
                    result = session.run(
                        "MATCH (t:Topic) "
                        "WHERE t.module IN $allowed "
                        "RETURN t.id AS id, t.title AS title, "
                        "t.summary AS summary, t.category AS category, "
                        "t.module AS module, "
                        "t.updated_at AS updated_at "
                        "ORDER BY t.id ASC",
                        {"allowed": allowed_modules},
                    )
                return [dict(r) for r in result]

        def topic_get(self, topic_id: str) -> Optional[Dict[str, Any]]:
            with self._driver.session() as session:
                row = session.run(
                    "MATCH (t:Topic {id:$id}) "
                    "RETURN t.id AS id, t.title AS title, "
                    "t.summary AS summary, t.content AS content, "
                    "t.category AS category, "
                    "t.module AS module, "
                    "t.created_at AS created_at, "
                    "t.updated_at AS updated_at",
                    {"id": topic_id},
                ).single()
                if not row:
                    return None
                return dict(row)

        def topic_upsert(
            self,
            topic_id: str,
            title: Optional[str] = None,
            summary: Optional[str] = None,
            content: Optional[str] = None,
            category: Optional[str] = None,
            module: Optional[str] = None,
        ) -> Dict[str, Any]:
            # SYSML_KB_CUTOFF 以降の知見は SysML v2。不合格なら SysmlPolicyError で書き込まない。
            enforce_sysml_policy(self._driver, topic_id, content)
            from datetime import datetime, timezone
            now_iso = datetime.now(timezone.utc).isoformat(timespec="seconds")
            set_clauses = ["t.updated_at = $now"]
            params: Dict[str, Any] = {"id": topic_id, "now": now_iso}
            for field, value in (
                ("title", title),
                ("summary", summary),
                ("content", content),
                ("category", category),
                ("module", module),
            ):
                if value is not None:
                    set_clauses.append(f"t.{field} = ${field}")
                    params[field] = value
            set_expr = ", ".join(set_clauses)
            cypher = (
                "MERGE (t:Topic {id: $id}) "
                "ON CREATE SET t.created_at = $now "
                f"SET {set_expr} "
                "RETURN t.created_at AS created_at, "
                "CASE WHEN t.created_at = $now "
                "THEN 'created' ELSE 'updated' END AS action"
            )
            with self._driver.session() as session:
                row = session.run(cypher, params).single()
                action = row["action"] if row else "unknown"
                created_at = row["created_at"] if row else now_iso
            return {
                "action": action,
                "created_at": created_at,
                "updated_at": now_iso,
            }

        def topic_delete(self, topic_id: str) -> Dict[str, Any]:
            with self._driver.session() as session:
                row = session.run(
                    "MATCH (t:Topic {id:$id}) "
                    "WITH t, count(t) AS c "
                    "DETACH DELETE t RETURN c AS deleted_count",
                    {"id": topic_id},
                ).single()
                deleted_count = row["deleted_count"] if row else 0
            return {"deleted": deleted_count > 0}

        def topic_set_tags(self, topic_id: str, tags: List[str]) -> Dict[str, Any]:
            """tags property と HAS_TAG 関係を全置換する。

            正規化: lowercase / スペース → アンダースコア / ハイフン → アンダースコア。
            "error" で始まる token と空文字は除外。 重複は先勝ちで排除。
            """
            cleaned: List[str] = []
            for raw in tags or []:
                s = str(raw).strip().lower().replace(" ", "_").replace("-", "_")
                if s and not s.startswith("error"):
                    cleaned.append(s)
            cleaned = list(dict.fromkeys(cleaned))

            with self._driver.session() as session:
                row = session.run(
                    "MATCH (t:Topic {id:$id}) "
                    "OPTIONAL MATCH (t)-[r:HAS_TAG]->() "
                    "DELETE r "
                    "SET t.tags = $tags "
                    "RETURN t.id AS id",
                    {"id": topic_id, "tags": cleaned},
                ).single()
                if not row:
                    return {"ok": False, "tags": [], "error": "topic not found"}
                if cleaned:
                    session.run(
                        "MATCH (t:Topic {id:$id}) "
                        "UNWIND $tags AS tag_name "
                        "MERGE (tag:Tag {name: tag_name}) "
                        "MERGE (t)-[:HAS_TAG]->(tag)",
                        {"id": topic_id, "tags": cleaned},
                    )
            return {"ok": True, "tags": cleaned}

        def migrate(self, source: str) -> Dict[str, Any]:
            raise NotImplementedError(
                "migrate: memgraph-migrate モジュールを adapter 化予定"
            )

    # =========================================================================
    # Factory / Selector
    # =========================================================================

    BACKEND_VECTOR = os.environ.get("BACKEND_VECTOR", "milvus")
    BACKEND_GRAPH = os.environ.get("BACKEND_GRAPH", "memgraph")
    BACKEND_HANDOFF = os.environ.get("BACKEND_HANDOFF", "memgraph")

    _vector_store: Optional[VectorStore] = None
    _graph_store: Optional[GraphStore] = None
    _handoff_store: Optional[HandoffStore] = None

    def get_vector_store() -> VectorStore:
        """VectorStore の singleton を返す。 BACKEND_VECTOR で切替。"""
        global _vector_store
        if _vector_store is None:
            if BACKEND_VECTOR == "milvus":
                _vector_store = MilvusVectorStore()
            else:
                raise ValueError(
                    f"Unknown BACKEND_VECTOR: {BACKEND_VECTOR} "
                    "(supported: milvus)"
                )
            logger.info(f"[backends] VectorStore = {BACKEND_VECTOR}")
        return _vector_store

    def get_graph_store(neo4j_driver=None) -> GraphStore:
        """GraphStore の singleton を返す。 BACKEND_GRAPH で切替。

        Memgraph 選択時は kernel の startup で確立済みの driver を渡す。
        """
        global _graph_store
        if _graph_store is None:
            if BACKEND_GRAPH == "memgraph":
                _graph_store = MemgraphGraphStore(neo4j_driver)
            else:
                raise ValueError(
                    f"Unknown BACKEND_GRAPH: {BACKEND_GRAPH} "
                    "(supported: memgraph)"
                )
            logger.info(f"[backends] GraphStore = {BACKEND_GRAPH}")
        return _graph_store

    def get_handoff_store(neo4j_driver=None) -> HandoffStore:
        """HandoffStore の singleton を返す。 BACKEND_HANDOFF で切替。"""
        global _handoff_store
        if _handoff_store is None:
            if BACKEND_HANDOFF == "memgraph":
                _handoff_store = MemgraphHandoffStore(neo4j_driver)
            else:
                raise ValueError(
                    f"Unknown BACKEND_HANDOFF: {BACKEND_HANDOFF} "
                    "(supported: memgraph)"
                )
            logger.info(f"[backends] HandoffStore = {BACKEND_HANDOFF}")
        return _handoff_store

    def reset_singletons() -> None:
        """テスト / 環境変数変更時に singleton をリセット。"""
        global _vector_store, _graph_store, _handoff_store
        _vector_store = None
        _graph_store = None
        _handoff_store = None
