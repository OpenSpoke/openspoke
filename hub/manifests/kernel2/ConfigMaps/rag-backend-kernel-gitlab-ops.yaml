    # ==================================================================
    @router.post("/list-tree")
    async def core_gitlab_list_tree(request: dict):
        """リポジトリの木構造を一度に返す (再帰)。

        Body:
          owner / repo (必須)
          path (任意): この配下だけを返す
          ref (任意): 省略時 default branch
          max_entries (任意): 既定 5000、 上限 20000
          user_id / gitlab_host (任意)

        GitLab の Tree API は blob のバイト数を返さないので size は出ない。
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip().strip("/")
        ref = request.get("ref") or None
        try:
            max_entries = int(request.get("max_entries") or 5000)
        except Exception:
            max_entries = 5000
        max_entries = max(1, min(max_entries, 20000))

        if not owner or not repo:
            return {"ok": False, "error": "owner, repo are required"}

        client = _get_client(request)
        try:
            project = client.encode_project(owner, repo)
            branch = ref or client.resolve_default_branch(owner, repo)
            url = (
                f"{client.base_url}/projects/{project}/repository/tree"
            )
            entries = []
            page = 1
            truncated = False
            while True:
                resp = requests.get(
                    url,
                    headers=client.headers,
                    params={
                        "path": path,
                        "ref": branch,
                        "recursive": "true",
                        "per_page": 100,
                        "page": page,
                    },
                    timeout=_GITLAB_API_TIMEOUT,
                )
                if resp.status_code == 404:
                    return {
                        "ok": False,
                        "error": (
                            f"path not found: {owner}/{repo}:"
                            f"{path or '(root)'}@{branch}"
                        ),
                    }
                if resp.status_code >= 400:
                    return {
                        "ok": False,
                        "error": (
                            f"HTTP {resp.status_code}: "
                            f"{resp.text[:300]}"
                        ),
                    }
                for e in (resp.json() or []):
                    entries.append({
                        "path": e.get("path", ""),
                        "name": e.get("name", ""),
                        "type": (
                            "file" if e.get("type") == "blob" else "dir"
                        ),
                        "sha": e.get("id", ""),
                    })
                    if len(entries) >= max_entries:
                        truncated = True
                        break
                if truncated:
                    break
                next_page = resp.headers.get("X-Next-Page", "")
                if not next_page:
                    break
                try:
                    page = int(next_page)
                except ValueError:
                    break

            files = [e for e in entries if e["type"] == "file"]
            return {
                "ok": True,
                "ref": branch,
                "root": path,
                "total": len(entries),
                "file_count": len(files),
                "dir_count": len(entries) - len(files),
                "truncated": truncated,
                "entries": entries,
            }
        except Exception as e:
            logger.error(
                f"[GITLAB_LIST_TREE] unexpected error: {e}",
                exc_info=True,
            )
            return {
                "ok": False,
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }


    # ==================================================================
    # Endpoint: grep_tree
    # ==================================================================
    @router.post("/grep-tree")
    async def core_gitlab_grep_tree(request: dict):
        """リポジトリ全体を一度に取って正規表現で横断検索する。

        archive.tar.gz を 1 回だけ取得して展開せずに読むので、
        ファイルごとに API を叩くより遥かに速い。

        Body:
          owner / repo / pattern (必須)
          path (任意): この配下だけを対象にする
          ref (任意)
          glob (任意): 対象にするファイル名の形 (例 "*.py")
          exclude_glob (任意)
          ignore_case (任意、 既定 False)
          context (任意、 既定 2、 上限 20)
          max_matches (任意、 既定 50、 上限 500)
          max_file_bytes (任意、 既定 1048576)
          user_id / gitlab_host (任意)
        """
        import fnmatch as _fnmatch
        import io as _io
        import re as _re
        import tarfile as _tarfile

        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        pattern = request.get("pattern") or ""
        path = (request.get("path") or "").strip().strip("/")
        ref = request.get("ref") or None
        glob = (request.get("glob") or "").strip()
        exclude_glob = (request.get("exclude_glob") or "").strip()
        ignore_case = bool(request.get("ignore_case", False))
        try:
            context = int(request.get("context") or 2)
        except Exception:
            context = 2
        context = max(0, min(context, 20))
        try:
            max_matches = int(request.get("max_matches") or 50)
        except Exception:
            max_matches = 50
        max_matches = max(1, min(max_matches, 500))
        try:
            max_file_bytes = int(
                request.get("max_file_bytes") or 1048576
            )
        except Exception:
            max_file_bytes = 1048576

        if not owner or not repo or not pattern:
            return {
                "ok": False,
                "error": "owner, repo, pattern are required",
            }

        try:
            flags = _re.MULTILINE | (_re.IGNORECASE if ignore_case else 0)
            rx = _re.compile(pattern, flags)
        except Exception as e:
            return {"ok": False, "error": f"invalid pattern: {e}"}

        client = _get_client(request)
        try:
            project = client.encode_project(owner, repo)
            branch = ref or client.resolve_default_branch(owner, repo)
            url = (
                f"{client.base_url}/projects/{project}"
                f"/repository/archive.tar.gz"
            )
            resp = requests.get(
                url,
                headers=client.headers,
                params={"sha": branch},
                timeout=300,
            )
            if resp.status_code >= 400:
                return {
                    "ok": False,
                    "error": (
                        f"archive HTTP {resp.status_code}: "
                        f"{resp.text[:200]}"
                    ),
                }

            tar = _tarfile.open(
                fileobj=_io.BytesIO(resp.content), mode="r:gz",
            )
            results = []
            scanned = 0
            matched_files = 0
            truncated = False

            for member in tar:
                if not member.isfile():
                    continue
                # 先頭のディレクトリ名 (repo-branch-sha/) を落とす
                parts = member.name.split("/", 1)
                rel = parts[1] if len(parts) == 2 else member.name
                if not rel:
                    continue
                if path and not (
                    rel == path or rel.startswith(path + "/")
                ):
                    continue
                base = rel.rsplit("/", 1)[-1]
                if glob and not (
                    _fnmatch.fnmatch(rel, glob)
                    or _fnmatch.fnmatch(base, glob)
                ):
                    continue
                if exclude_glob and (
                    _fnmatch.fnmatch(rel, exclude_glob)
                    or _fnmatch.fnmatch(base, exclude_glob)
                ):
                    continue
                if member.size > max_file_bytes:
                    continue

                f = tar.extractfile(member)
                if f is None:
                    continue
                raw = f.read()
                if b"\x00" in raw[:8000]:
                    continue  # バイナリは飛ばす
                scanned += 1
                text = raw.decode("utf-8", errors="replace")
                lines = text.split("\n")
                hits = []
                for i, line in enumerate(lines):
                    if not rx.search(line):
                        continue
                    lo = max(0, i - context)
                    hi = min(len(lines), i + context + 1)
                    hits.append({
                        "line": i + 1,
                        "text": line[:500],
                        "context": "\n".join(lines[lo:hi])[:3000],
                    })
                    if len(results) + len(hits) >= max_matches:
                        truncated = True
                        break
                if hits:
                    matched_files += 1
                    results.append({"path": rel, "matches": hits})
                if truncated:
                    break

            tar.close()
            total = sum(len(r["matches"]) for r in results)
            return {
                "ok": True,
                "ref": branch,
                "pattern": pattern,
                "scanned_files": scanned,
                "matched_files": matched_files,
                "total_matches": total,
                "truncated": truncated,
                "results": results,
            }
        except Exception as e:
            logger.error(
                f"[GITLAB_GREP_TREE] unexpected error: {e}",
                exc_info=True,
            )
            return {
                "ok": False,
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }


