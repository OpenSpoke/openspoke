    # ==================================================================
    @router.post("/apply-str-replace")
    async def core_gitlab_apply_str_replace(request: dict):
        """ファイルを取得 → 文字列置換 → push (1 commit)。

        Body:
          owner, repo, path (必須)
          old_str, new_str (必須): 置換 (new_str 空文字なら削除)
          message (必須): commit message
          count (任意, default=1): 期待する old_str の出現回数
          branch (任意)
          user_id, gitlab_host (任意)
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        old_str = request.get("old_str", "")
        new_str = request.get("new_str", "")
        message = (request.get("message") or "").strip()
        count = int(request.get("count", 1) or 1)
        branch = request.get("branch") or None

        if not owner or not repo or not path:
            return {
                "ok": False,
                "error": "owner, repo, path are required",
            }
        if not message:
            return {
                "ok": False,
                "error": "message is required",
            }
        if not old_str:
            return {
                "ok": False,
                "error": "old_str is required (empty not allowed)",
            }

        client = _get_client(request)
        got = client.get_file(owner, repo, path, ref=branch)
        if not got.get("ok"):
            return got
        content = got.get("content", "")
        actual = content.count(old_str)
        if actual != count:
            return {
                "ok": False,
                "error": (
                    f"old_str occurrence mismatch: "
                    f"expected {count}, actual {actual}"
                ),
            }
        new_content = content.replace(old_str, new_str, count)
        return client.put_file(
            owner, repo, path, new_content, message, branch=branch
        )


