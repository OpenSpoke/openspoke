    @router.post("/copy-file")
    async def core_gitlab_copy_file(request: dict):
        """ファイルを別のパス (別リポジトリも可) に写す。

        Body:
          owner / repo / path (必須): コピー元
          dest_path (必須): コピー先のパス
          dest_owner / dest_repo (任意): 省略時はコピー元と同じ
          ref (任意): コピー元のブランチ or コミット
          branch (任意): コピー先のブランチ
          message (任意): commit message
          overwrite (任意、 既定 True): False なら既存があれば中止
          user_id / gitlab_host (任意)
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        dest_owner = (request.get("dest_owner") or owner).strip()
        dest_repo = (request.get("dest_repo") or repo).strip()
        dest_path = (request.get("dest_path") or "").strip()
        ref = request.get("ref") or None
        branch = request.get("branch") or None
        overwrite = bool(request.get("overwrite", True))
        message = (
            request.get("message")
            or f"copy {owner}/{repo}:{path} -> {dest_path}"
        )

        if not owner or not repo or not path or not dest_path:
            return {
                "ok": False,
                "error": "owner, repo, path, dest_path are required",
            }

        client = _get_client(request)
        try:
            got = client.get_file(owner, repo, path, ref=ref)
            if not got.get("ok"):
                return got

            if not overwrite:
                dest_branch = (
                    branch
                    or client.resolve_default_branch(
                        dest_owner, dest_repo
                    )
                )
                found = client._find_blob_sha(
                    dest_owner, dest_repo, dest_path, dest_branch,
                )
                if found.get("ok") and found.get("sha"):
                    return {
                        "ok": False,
                        "error": (
                            f"dest already exists: "
                            f"{dest_owner}/{dest_repo}:{dest_path} "
                            f"(overwrite=false)"
                        ),
                    }

            put = client.put_file(
                dest_owner, dest_repo, dest_path,
                got.get("content", ""), message, branch=branch,
            )
            if put.get("ok"):
                put["source"] = f"{owner}/{repo}:{path}"
                put["bytes"] = got.get("size", 0)
            return put
        except Exception as e:
            logger.error(
                f"[GITLAB_COPY_FILE] unexpected error: {e}",
                exc_info=True,
            )
            return {
                "ok": False,
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }


    # ==================================================================
    # Endpoint: regex_replace
    # ==================================================================
    @router.post("/regex-replace")
    async def core_gitlab_regex_replace(request: dict):
        """正規表現で置換して push する。

        Body:
          owner / repo / path / pattern (必須)
          replacement (必須): \\1 などの後方参照が使える
          message (必須、 dry_run のときは不要)
          branch (任意)
          count (任意、 既定 0 = すべて)
          expected_count (任意): 置換件数がこの数でなければ中止する安全装置
          ignore_case / multiline / dotall (任意、 既定 False)
          dry_run (任意、 既定 False): 置換件数と差分だけ返して push しない
          user_id / gitlab_host (任意)
        """
        import re as _re

        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        pattern = request.get("pattern") or ""
        replacement = request.get("replacement")
        message = (request.get("message") or "").strip()
        branch = request.get("branch") or None
        dry_run = bool(request.get("dry_run", False))
        try:
            count = int(request.get("count") or 0)
        except Exception:
            count = 0
        expected_count = request.get("expected_count")

        if not owner or not repo or not path or not pattern:
            return {
                "ok": False,
                "error": "owner, repo, path, pattern are required",
            }
        if replacement is None:
            return {"ok": False, "error": "replacement is required"}
        if not dry_run and not message:
            return {"ok": False, "error": "message is required"}

        flags = 0
        if request.get("ignore_case"):
            flags |= _re.IGNORECASE
        if request.get("multiline", True):
            flags |= _re.MULTILINE
        if request.get("dotall"):
            flags |= _re.DOTALL

        try:
            rx = _re.compile(pattern, flags)
        except Exception as e:
            return {"ok": False, "error": f"invalid pattern: {e}"}

        client = _get_client(request)
        try:
            got = client.get_file(owner, repo, path, ref=branch)
            if not got.get("ok"):
                return got
            before = got.get("content", "")
            found = len(rx.findall(before))
            if found == 0:
                return {
                    "ok": False,
                    "error": "pattern did not match anything",
                    "matched": 0,
                }
            if expected_count is not None:
                try:
                    want = int(expected_count)
                except Exception:
                    want = -1
                if want >= 0 and found != want:
                    return {
                        "ok": False,
                        "error": (
                            f"match count mismatch: "
                            f"expected {want}, found {found}"
                        ),
                        "matched": found,
                    }

            after = rx.sub(replacement, before, count=count)
            if after == before:
                return {
                    "ok": False,
                    "error": "replacement produced no change",
                    "matched": found,
                }

            replaced = found if count == 0 else min(count, found)
            if dry_run:
                helpers = _gl_text_helpers()
                diff = helpers["unified_diff"](
                    before.split("\n"), after.split("\n"), path,
                )
                return {
                    "ok": True,
                    "dry_run": True,
                    "matched": found,
                    "replaced": replaced,
                    "size_before": len(before),
                    "size_after": len(after),
                    "diff": diff,
                }

            put = client.put_file(
                owner, repo, path, after, message, branch=branch,
            )
            if put.get("ok"):
                put["matched"] = found
                put["replaced"] = replaced
                put["size_before"] = len(before)
                put["size_after"] = len(after)
            return put
        except Exception as e:
            logger.error(
                f"[GITLAB_REGEX_REPLACE] unexpected error: {e}",
                exc_info=True,
            )
            return {
                "ok": False,
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }


    # ==================================================================
    # Endpoint: str_replace_dryrun
    # ==================================================================
    @router.post("/str-replace-dryrun")
    async def core_gitlab_str_replace_dryrun(request: dict):
        """置換を実際には行わず、 件数と差分だけ返す。

        Body:
          owner / repo / path / old_str (必須)
          new_str (任意、 既定 "" = 削除)
          branch (任意)
          count (任意、 既定 1): 期待される出現回数
          user_id / gitlab_host (任意)
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        old_str = request.get("old_str") or ""
        new_str = request.get("new_str") or ""
        branch = request.get("branch") or None
        try:
            expect = int(request.get("count") or 1)
        except Exception:
            expect = 1

        if not owner or not repo or not path or not old_str:
            return {
                "ok": False,
                "error": "owner, repo, path, old_str are required",
            }

        client = _get_client(request)
        try:
            got = client.get_file(owner, repo, path, ref=branch)
            if not got.get("ok"):
                return got
            before = got.get("content", "")
            occurrences = before.count(old_str)
            if occurrences == 0:
                return {
                    "ok": False,
                    "occurrences": 0,
                    "error": "old_str not found",
                }
            if occurrences != expect:
                return {
                    "ok": False,
                    "occurrences": occurrences,
                    "error": (
                        f"occurrence mismatch: expected {expect}, "
                        f"found {occurrences}"
                    ),
                }
            after = before.replace(old_str, new_str, expect)
            helpers = _gl_text_helpers()
            diff = helpers["unified_diff"](
                before.split("\n"), after.split("\n"), path,
            )
            return {
                "ok": True,
                "dry_run": True,
                "occurrences": occurrences,
                "size_before": len(before),
                "size_after": len(after),
                "diff": diff,
            }
        except Exception as e:
            logger.error(
                f"[GITLAB_STR_REPLACE_DRYRUN] unexpected error: {e}",
                exc_info=True,
            )
            return {
                "ok": False,
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }


    # ==================================================================
    # Endpoint: get_outline / get_symbol
    # ==================================================================
    def _gl_outline_of_text(text: str, path: str, treat_as: str):
        """中身からアウトラインを作る。 github_ops の補助をそのまま使う。

        Returns: (language, symbols, yaml_python_block, error)
        """
        helpers = _gl_text_helpers()
        path_lower = path.lower()
        if treat_as == "auto":
            if path_lower.endswith(".py"):
                lang = "python"
            elif path_lower.endswith((".yaml", ".yml")):
                block = helpers["find_literal_block"](text)
                lang = "python_in_yaml" if block else "yaml"
            else:
                lang = "yaml"
        else:
            lang = treat_as

        if lang == "python":
            symbols, err = helpers["python_outline"](text)
            return lang, symbols or [], None, err
        if lang == "python_in_yaml":
            block = helpers["find_literal_block"](text)
            if not block:
                return (
                    lang, [], None,
                    "no `<name>.py: |` literal block found",
                )
            py_source = helpers["extract_python_from_yaml"](text, block)
            offset = block["content_start_line"] - 1
            symbols, err = helpers["python_outline"](
                py_source, line_offset=offset,
            )
            return lang, symbols or [], block, err
        symbols, err = helpers["yaml_outline"](text)
        return "yaml", symbols or [], None, err


    @router.post("/get-outline")
    async def core_gitlab_get_outline(request: dict):
        """ファイル構造のアウトライン (シンボル名 + 行範囲) を返す。

        対応:
          - .py: Python の top-level def/class + クラス内 method
          - .yaml/.yml: top-level key、 K8s マニフェストなら kind+name
          - data: <name>.py: | (YAML 内に埋め込まれた Python):
            treat_as="auto" で自動的に Python として扱う

        Body:
          owner / repo / path (必須)
          branch (任意)
          treat_as (任意): "auto" (既定) / "python" / "yaml" /
                           "python_in_yaml"
          user_id / gitlab_host (任意)
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        branch = request.get("branch") or None
        treat_as = (
            request.get("treat_as") or "auto"
        ).strip().lower()

        if not owner or not repo or not path:
            return {
                "ok": False, "language": "", "total_lines": 0,
                "symbols": [], "yaml_python_block": None,
                "error": "owner, repo, path are required",
            }

        client = _get_client(request)
        try:
            got = client.get_file(owner, repo, path, ref=branch)
            if not got.get("ok"):
                return {
                    "ok": False, "language": "", "total_lines": 0,
                    "symbols": [], "yaml_python_block": None,
                    "error": got.get("error", "get_file failed"),
                }
            text = got.get("content", "")
            total_lines = text.count("\n") + 1
            lang, symbols, block, err = _gl_outline_of_text(
                text, path, treat_as,
            )
            return {
                "ok": err is None,
                "language": lang,
                "total_lines": total_lines,
                "symbols": symbols,
                "yaml_python_block": block,
                "error": err,
            }
        except Exception as e:
            logger.error(
                f"[GITLAB_GET_OUTLINE] unexpected error: {e}",
                exc_info=True,
            )
            return {
                "ok": False, "language": "", "total_lines": 0,
                "symbols": [], "yaml_python_block": None,
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }


    @router.post("/get-symbol")
    async def core_gitlab_get_symbol(request: dict):
        """名前を指定して、 そのシンボルの本文だけを取り出す。

        Body:
          owner / repo / path / symbol (必須)
          symbol は "ClassName.method" の形でも指定できる
          branch (任意)
          treat_as (任意、 既定 "auto")
          user_id / gitlab_host (任意)
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        symbol = (request.get("symbol") or "").strip()
        branch = request.get("branch") or None
        treat_as = (
            request.get("treat_as") or "auto"
        ).strip().lower()

        if not owner or not repo or not path or not symbol:
            return {
                "ok": False,
                "error": "owner, repo, path, symbol are required",
            }

        client = _get_client(request)
        try:
            got = client.get_file(owner, repo, path, ref=branch)
            if not got.get("ok"):
                return got
            text = got.get("content", "")
            lang, symbols, block, err = _gl_outline_of_text(
                text, path, treat_as,
            )
            if err:
                return {"ok": False, "language": lang, "error": err}

            want = symbol.split(".")
            node = None
            for s in symbols:
                if s.get("name") != want[0]:
                    continue
                if len(want) == 1:
                    node = s
                    break
                for c in s.get("children") or []:
                    if c.get("name") == want[1]:
                        node = c
                        break
                break
            if node is None:
                names = []
                for s in symbols:
                    names.append(s.get("name", ""))
                    for c in s.get("children") or []:
                        names.append(
                            f"{s.get('name', '')}.{c.get('name', '')}"
                        )
                return {
                    "ok": False,
                    "language": lang,
                    "error": f"symbol not found: {symbol}",
                    "available": names[:200],
                }

            lines = text.split("\n")
            start = max(1, int(node.get("start_line", 1)))
            end = min(len(lines), int(node.get("end_line", start)))
            body = "\n".join(lines[start - 1:end])
            return {
                "ok": True,
                "language": lang,
                "symbol": symbol,
                "kind": node.get("kind", ""),
                "start_line": start,
                "end_line": end,
                "total_lines": len(lines),
                "content": body,
                "yaml_python_block": block,
            }
        except Exception as e:
            logger.error(
                f"[GITLAB_GET_SYMBOL] unexpected error: {e}",
                exc_info=True,
            )
            return {
                "ok": False,
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }


    # ==================================================================
    # Endpoint: タグ (チェックポイント) 4 本
    #
    # GitLab のタグ名はパスの一部に入るので、 Cloudflare の経路では
    # "/" を含む名前が使えない。 作成時に弾く。
    # ==================================================================

    def _gl_tag_name_ok(name: str) -> bool:
        return bool(name) and "/" not in name and " " not in name


    @router.post("/create-tag")
    async def core_gitlab_create_tag(request: dict):
        """いまの状態にタグを打つ (チェックポイント)。

        Body:
          owner / repo / tag (必須)
          ref (任意): 対象のブランチ or コミット (省略時 default branch)
          message (任意): 注釈タグにする場合の本文
          user_id / gitlab_host (任意)
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        tag = (request.get("tag") or "").strip()
        ref = request.get("ref") or None
        message = request.get("message") or ""

        if not owner or not repo or not tag:
            return {"ok": False, "error": "owner, repo, tag are required"}
        if not _gl_tag_name_ok(tag):
            return {
                "ok": False,
                "error": (
                    "タグ名に / と空白は使えません "
                    "(Cloudflare 経路の制約)"
                ),
            }

        client = _get_client(request)
        try:
            project = client.encode_project(owner, repo)
            branch = ref or client.resolve_default_branch(owner, repo)
            url = (
                f"{client.base_url}/projects/{project}/repository/tags"
            )
            body = {"tag_name": tag, "ref": branch}
            if message:
                body["message"] = message
            resp = requests.post(
                url,
                headers={
                    **client.headers,
                    "Content-Type": "application/json",
                },
                json=body,
                timeout=_GITLAB_API_TIMEOUT,
            )
            if resp.status_code in (200, 201):
                d = resp.json() or {}
                commit = d.get("commit") or {}
                return {
                    "ok": True,
                    "tag": d.get("name", tag),
                    "ref": branch,
                    "commit_sha": commit.get("id", ""),
                }
            return {
                "ok": False,
                "error": f"HTTP {resp.status_code}: {resp.text[:300]}",
            }
        except Exception as e:
            logger.error(
                f"[GITLAB_CREATE_TAG] unexpected error: {e}",
                exc_info=True,
            )
            return {
                "ok": False,
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }


    @router.post("/list-tags")
    async def core_gitlab_list_tags(request: dict):
        """タグ (チェックポイント) の一覧を新しい順に返す。

        Body:
          owner / repo (必須)
          search (任意): 名前の部分一致で絞る
          limit (任意、 既定 50、 上限 200)
          user_id / gitlab_host (任意)
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        search = (request.get("search") or "").strip()
        try:
            limit = int(request.get("limit") or 50)
        except Exception:
            limit = 50
        limit = max(1, min(limit, 200))

        if not owner or not repo:
            return {"ok": False, "error": "owner, repo are required"}

        client = _get_client(request)
        try:
            project = client.encode_project(owner, repo)
            url = (
                f"{client.base_url}/projects/{project}/repository/tags"
            )
            params = {
                "per_page": min(limit, 100),
                "order_by": "updated",
                "sort": "desc",
            }
            if search:
                params["search"] = search
            resp = requests.get(
                url,
                headers=client.headers,
                params=params,
                timeout=_GITLAB_API_TIMEOUT,
            )
            if resp.status_code >= 400:
                return {
                    "ok": False,
                    "error": (
                        f"HTTP {resp.status_code}: {resp.text[:300]}"
                    ),
                }
            tags = []
            for t in (resp.json() or [])[:limit]:
                commit = t.get("commit") or {}
                tags.append({
                    "tag": t.get("name", ""),
                    "commit_sha": commit.get("id", ""),
                    "created_at": commit.get("created_at", ""),
                    "title": commit.get("title", ""),
                    "message": t.get("message") or "",
                })
            return {"ok": True, "count": len(tags), "tags": tags}
        except Exception as e:
            logger.error(
                f"[GITLAB_LIST_TAGS] unexpected error: {e}",
                exc_info=True,
            )
            return {
                "ok": False,
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }


    @router.post("/delete-tag")
    async def core_gitlab_delete_tag(request: dict):
        """タグ (チェックポイント) を消す。

        Body:
          owner / repo / tag (必須)
          user_id / gitlab_host (任意)
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        tag = (request.get("tag") or "").strip()

        if not owner or not repo or not tag:
            return {"ok": False, "error": "owner, repo, tag are required"}
        if not _gl_tag_name_ok(tag):
            return {
                "ok": False,
                "error": "タグ名に / と空白は使えません",
            }

        client = _get_client(request)
        try:
            project = client.encode_project(owner, repo)
            url = (
                f"{client.base_url}/projects/{project}"
                f"/repository/tags/{quote(tag, safe='')}"
            )
            resp = requests.delete(
                url,
                headers=client.headers,
                timeout=_GITLAB_API_TIMEOUT,
            )
            if resp.status_code in (200, 204):
                return {"ok": True, "tag": tag, "deleted": True}
            if resp.status_code == 404:
                return {
                    "ok": True,
                    "tag": tag,
                    "deleted": False,
                    "note": "そのタグはありません",
                }
            return {
                "ok": False,
                "error": f"HTTP {resp.status_code}: {resp.text[:300]}",
            }
        except Exception as e:
            logger.error(
                f"[GITLAB_DELETE_TAG] unexpected error: {e}",
                exc_info=True,
            )
            return {
                "ok": False,
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }


    # ==================================================================
    # Endpoint: restore_from_ref (タグ / コミットから書き戻す)
    # ==================================================================
    @router.post("/restore-from-ref")
    async def core_gitlab_restore_from_ref(request: dict):
        """過去のタグやコミットの内容でファイルを書き戻す。

        安全のため、 対象は必ずファイル 1 本。 リポジトリ全体の巻き戻しは
        この口では行わない (git_mirror / git_path_sync を使うこと)。

        Body:
          owner / repo / path / from_ref (必須)
            from_ref はタグ名でもコミット SHA でもよい
          branch (任意): 書き戻し先のブランチ
          message (任意)
          dry_run (任意、 既定 False): 差分だけ返して push しない
          user_id / gitlab_host (任意)
        """
        owner = (request.get("owner") or "").strip()
        repo = (request.get("repo") or "").strip()
        path = (request.get("path") or "").strip()
        from_ref = (request.get("from_ref") or "").strip()
        branch = request.get("branch") or None
        dry_run = bool(request.get("dry_run", False))
        message = (
            request.get("message")
            or f"restore {path} from {from_ref}"
        )

        if not owner or not repo or not path or not from_ref:
            return {
                "ok": False,
                "error": "owner, repo, path, from_ref are required",
            }

        client = _get_client(request)
        try:
            old = client.get_file(owner, repo, path, ref=from_ref)
            if not old.get("ok"):
                return old
            old_text = old.get("content", "")

            cur = client.get_file(owner, repo, path, ref=branch)
            cur_text = cur.get("content", "") if cur.get("ok") else ""

            if cur.get("ok") and cur_text == old_text:
                return {
                    "ok": True,
                    "changed": False,
                    "note": "いまの内容と同じです",
                    "from_ref": from_ref,
                }

            if dry_run:
                helpers = _gl_text_helpers()
                diff = helpers["unified_diff"](
                    cur_text.split("\n"), old_text.split("\n"), path,
                )
                return {
                    "ok": True,
                    "dry_run": True,
                    "changed": True,
                    "from_ref": from_ref,
                    "size_before": len(cur_text),
                    "size_after": len(old_text),
                    "diff": diff,
                }

            put = client.put_file(
                owner, repo, path, old_text, message, branch=branch,
            )
            if put.get("ok"):
                put["changed"] = True
                put["from_ref"] = from_ref
                put["size_before"] = len(cur_text)
                put["size_after"] = len(old_text)
            return put
        except Exception as e:
            logger.error(
                f"[GITLAB_RESTORE_FROM_REF] unexpected error: {e}",
                exc_info=True,
            )
            return {
                "ok": False,
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }
