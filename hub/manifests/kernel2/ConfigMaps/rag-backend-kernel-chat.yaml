apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-backend-kernel-chat
  namespace: rag-company1
data:
  chat_endpoints.py: |
    """chat_endpoints.py — Aki と Claude の対話フロントエンド用バックエンド。

    設計:
      - Anthropic の stream + SimpleMCPClient + tool loop の既存パターン
        (main.py の /core/claude/stream-with-mcp と同じ構造) をそのまま流用
      - MCP hub (mcp.example.com/mcp 相当、 内部は
        mcp-company1.mcp.svc.cluster.local:8000/sse) の全 tool を Claude に露出
      - user 発話ごとに知識ベース (Memgraph Topic) の意味検索で上位 N 件を
        system_prompt に事前注入 (auto-injection、 Phase 5)
      - streaming で逐次描画 (Phase 2)

    OpenSearch インデックス:
      - chat_threads:  {thread_id, owner, title, created_at, updated_at,
                        last_message_at, message_count, model}
      - chat_messages: {message_id, thread_id, owner, order, role, content,
                        model, input_tokens, output_tokens, created_at,
                        injected_topics, tool_calls}

    kernel 本体との依存 (lazy import):
      - get_anthropic_client (Anthropic client 共有)
      - SimpleMCPClient (MCP over SSE クライアント)
      - MCP_SERVER_URL, MCP_API_KEY, MCP_CONNECT_TIMEOUT
      - CLAUDE_MAX_TOOL_ITERATIONS, CLAUDE_STREAM_MAX_ACCUMULATED_TOKENS
      - _claude_strip_unsupported_sampling (Opus 4.7+ の sampling 制約対応)
      - neo4j_driver (直接 Cypher 実行、 意味検索の embedding 用)
      - get_embeddings_parallel (embedding 直接計算)
    """
    import os
    import time
    import uuid
    import math
    import json
    import logging
    import re
    from typing import List, Dict, Any, Optional, Tuple

    import requests
    from fastapi import APIRouter
    from fastapi.responses import StreamingResponse

    logger = logging.getLogger(__name__)

    router = APIRouter()

    OPENSEARCH_URL = os.environ.get(
        "OPENSEARCH_URL",
        "http://opensearch.opensearch.svc.cluster.local:9200",
    ).rstrip("/")

    CHAT_THREADS_INDEX = "chat_threads"
    CHAT_MESSAGES_INDEX = "chat_messages"

    DEFAULT_MODEL = "claude-sonnet-4-6"
    SLIDING_WINDOW_SIZE = 20
    MAX_OUTPUT_TOKENS = 4096

    # Jev による per-turn モデル自動選択 (auto_route=True で有効)。
    # Jev に choice でこの候補の中から 1 つ選ばせる。
    # Jev が候補外の値を返した場合は DEFAULT_MODEL にフォールバック。
    CHAT_JEV_ROUTE_MODELS = [
        "claude-haiku-4-5",
        "claude-sonnet-4-6",
        "claude-opus-4-7",
    ]

    # Step E-2: Jev + gemma2 (R2D2 + C3PO) 経路。
    # モデル ID が CHAT_JEV_GEMMA2_MODEL_ID のとき、 turn 頭で Jev に応答方針を
    # choice で問い、 その結果を gemma2 の system prompt に渡して日本語に
    # 言い直させる。 tool loop なし、 Sonnet フォールバックなし、 単発生成。
    # 「Jev に判断を寄せ、 gemma2 は話すだけ」の設計方針。
    CHAT_JEV_GEMMA2_MODEL_ID = "jev-gemma2"
    CHAT_JEV_GEMMA2_UNDERLYING = "gemma2:9b"

    # Phase 5: 自動注入
    INJECT_TOP_N = 3
    INJECT_MIN_SCORE = 0.35
    INJECT_CONTENT_CHAR_LIMIT = 3000
    EMBED_CONTENT_CHAR_LIMIT = 2000

    # Jev による KB ゲート (Phase 2-h Step F、 既定オン)。 発話ごとに Jev が
    # 「知識ベースを参照する必要があるか」を noul で判定し、 必要と判断したら
    # 意味検索の上位候補から Jev choice で最終 K 件を選抜。 Jev 失敗時は
    # 既存の埋め込み類似度 top-N にフォールバック。 常時、 system_prompt には
    # 「読め・書け・メモリに頼るな」の 3 リマインダーが Jev の判定に添えて入る。
    CHAT_JEV_KB_GATE_ENABLED = os.getenv(
        "CHAT_JEV_KB_GATE_ENABLED", "true"
    ).lower() != "false"
    CHAT_JEV_KB_SEARCH_CANDIDATES = 15
    CHAT_JEV_KB_INJECT_TOP_K = 3

    # tool_calls を message doc に保存するときの result_brief の切り詰め
    TOOL_RESULT_BRIEF_CHAR_LIMIT = 500

    # tool result を Anthropic の messages に載せるときの上限 (文字数)。
    # Anthropic 200K context に対して、 tools schema (60-100K) + system prompt (5-10K) +
    # 20 message history (5-15K) + injected topics (5-10K) を差し引くと、
    # tool result に使える余地はターン全体で 50-100K token 程度。
    # 1 tool call あたり 30000 文字 (~10K token JA、 ~8K token EN) に制限し、
    # 同一ターン内で複数の tool call が並んでも context 上限を超えないようにする。
    # 切り詰められた場合は Claude に明示的に伝え、 より狭いクエリで
    # 呼び直すように促す。
    MCP_TOOL_RESULT_MAX_CHARS = 30000

    # チャンク化 (Phase 6: 断片単位の意味検索、 既存の topic 全文検索と并立)。
    # Topic の content を段落単位で分割し、 一つのをすぎる場合は
    # target 文字強制分割。 min 未満の断片は前後とマージ。
    CHUNK_TARGET_CHARS = 500
    CHUNK_MAX_CHARS = 800
    CHUNK_MIN_CHARS = 100

    # 1M context beta を利用できるモデル。 anthropic-beta: context-1m-2025-08-07 header を
    # 付とさない場合 default 200K context になる (GA 後も明示 opt-in が
    # 必要なケースがあるため、 安全側で付ける)。 Haiku 4.5 は非対応。
    MODELS_SUPPORTING_1M_CONTEXT = {
        "claude-sonnet-4-6",
        "claude-opus-4-6",
        "claude-opus-4-7",
        "claude-opus-4-8",
        "claude-opus-5",
    }

    # gemma2 (Ollama) 経路に露出する MCP ツールの許可リスト。 gemma2:9b は
    # 既定コンテキスト 8192 トークンと狭く、 200+ ツールのスキーマを一度に載せると
    # コンテキストを食い潰す。 加えてツール選択精度も未知数のため、 初期実装では
    # 小さめの安全な集合に絞る。 対話専用ツール (list_my_chat_threads 等) は別途
    # 全て露出する (件数が少ないため)。 実運用の挙動を見て段階的に拡張する。
    OLLAMA_ALLOWED_TOOL_NAMES = {
        # 知識ベース (中央ハブ Memgraph)
        "system_brief", "system_topics", "system_lookup",
        "upsert_knowledge", "delete_knowledge",
        # ファイル閲覧
        "github_get_file_range", "github_grep_file",
        "github_get_outline", "github_get_symbol",
        # ファイル差分編集
        "github_str_replace_dryrun", "github_apply_str_replace",
        # Kubernetes 観測
        "k8s_list_pods", "k8s_get_logs",
        # 診断
        "whoami",
    }

    # gemma2 経路の tool loop 反復上限。 Claude よりツール選択精度が低いため
    # 無限ループ検出のフォールバックを低めに設定する。
    OLLAMA_MAX_TOOL_ITERATIONS = 20

    def _is_ollama_model(model: str) -> bool:
        """モデル名から Ollama 経路か Anthropic 経路かを判定する。
        Claude モデルは全て "claude-" 接頭辞なので、 それ以外は Ollama 扱い。
        現状 gemma2:9b が対象。
        """
        return not (model or "").lower().startswith("claude")

    # tool loop の反復上限 (chat 専用、 kernel のデフォルト 5 を上書き)。
    # 実際のコスト保証は CLAUDE_STREAM_MAX_ACCUMULATED_TOKENS (300K) が主軸。
    # iteration 上限は 「無限ループ検出」 のフォールバックに過ぎない。
    # Sonnet 4.6 は複数 tool を並列で呼ぶので 100 iteration あれば
    # 実質数百の MCP tool call が可能。 現実的な調査タスクで足りなくなることは
    # ほぼ無い (cost cap が 25-30 iteration 目付近で先に効く)。
    CHAT_MAX_TOOL_ITERATIONS = 100

    # 累積トークン上限 (chat 専用、 kernel の CLAUDE_STREAM_MAX_ACCUMULATED_TOKENS
    # デフォルト 300K を上書き)。 kernel の値は秘書 backend 向けで対話フロントエンド
    # の深い探索には狭すぎる。 3M token に拡張し、 対話同一ターン内の最悪コストを
    # Sonnet 4.6 (input $3/M 、 output $15/M) で 最大 $45/turn に制限。
    # fresh input + output の合計で、 cache read は含まない。 実際の cost は
    # cache hit の分だけ少なくなる。
    CHAT_ACCUMULATED_TOKENS_CAP = 3000000

    # chat-scoped tool (中期記憶): sliding window の外を Claude 自身が
    # 辿でるように、 MCP tool 群とは別に chat_endpoints 内で実行する tool を定義。
    # SimpleMCPClient で取った MCP tool と一緒に Claude に露出し、
    # tool loop で名前を見て dispatch (chat-scoped ならローカル実行)。
    CHAT_SCOPED_TOOL_SCHEMAS = [
        {
            "name": "list_my_chat_threads",
            "description": (
                "現在の利用者が所有する全チャットスレッドの一覧"
                " ({thread_id, title, message_count, last_message_at, current})を返す。"
                " current=true は現在のスレッド。 過去のスレッドを横断的に"
                " 参照する際の起点。"
            ),
            "input_schema": {"type": "object", "properties": {}},
        },
        {
            "name": "read_chat_thread_messages",
            "description": (
                "スレッドのメッセージを時間軸ベースまたは順序ベースで取得する。"
                " default の sliding window 20 件の外を Claude 自身が能動的に"
                " 取り戻す用途。 主用途は時間軸: since / until (ISO 8601 UTC)"
                " で範囲を指定し、 時間軸に沿ってウィンドウを自由に動かせる。"
                " 例: 1 時間前を見る → since=(現在時刻 - 1h)、 until=現在時刻。"
                " 順序ベース: from_order / to_order で 0-indexed 位置指定。"
                " 両方指定の場合は AND。 何も指定しなければ最新 limit 件。"
                " thread_id 省略時は現在のスレッド。 各メッセージには order,"
                " role (user/assistant), content, created_at が含まれる。"
            ),
            "input_schema": {
                "type": "object",
                "properties": {
                    "thread_id": {
                        "type": "string",
                        "description": "対象スレッド ID (省略時は現在のスレッド)",
                    },
                    "since": {
                        "type": "string",
                        "description": (
                            "開始時刻 (ISO 8601 UTC、 例:"
                            " 2026-09-08T15:00:00Z)。 この時刻以降のメッセージを対象"
                        ),
                    },
                    "until": {
                        "type": "string",
                        "description": (
                            "終了時刻 (ISO 8601 UTC)。"
                            " この時刻以前のメッセージを対象"
                        ),
                    },
                    "from_order": {
                        "type": "integer",
                        "description": "取得開始 order (含む、 省略時は制限なし)",
                    },
                    "to_order": {
                        "type": "integer",
                        "description": "取得終了 order (含む、 省略時は制限なし)",
                    },
                    "limit": {
                        "type": "integer",
                        "description": "最大取得件数 (default 30、 max 100)",
                    },
                },
            },
        },
        {
            "name": "search_my_chat_history",
            "description": (
                "自分のチャット履歴を全文検索する (OpenSearch の match query)。"
                " thread_id 指定でその 1 スレッド、 省略で全スレッド横断。"
                " ハイライト付きのスニペットと thread_id / order を返すので"
                " 必要なら read_chat_thread_messages で前後を取り直せる。"
            ),
            "input_schema": {
                "type": "object",
                "properties": {
                    "query": {
                        "type": "string",
                        "description": "検索クエリ (自然文)",
                    },
                    "thread_id": {
                        "type": "string",
                        "description": "対象スレッド ID (省略で自分の全スレッド)",
                    },
                    "limit": {
                        "type": "integer",
                        "description": "最大件数 (default 10、 max 30)",
                    },
                },
                "required": ["query"],
            },
        },
        {
            "name": "search_topic_chunks",
            "description": (
                "知識ベース全 Topic のチャンク (段落単位、 200-500 字) を"
                " 意味検索する。 Topic 全体を system_lookup で読むより"
                " 5-50 倍安価。 Topic 横断で関連断片が集まるので、"
                " 概念調査・トピック横断調査・具体的な情報探しはこのツールを"
                " 使うこと。 得られた {topic_id, chunk_index} を渡して"
                " lookup_topic_chunk_range で前後の文脈を取れる。"
                " 各 chunk には {topic_id, topic_title, chunk_index, text, score} が入る。"
            ),
            "input_schema": {
                "type": "object",
                "properties": {
                    "query": {
                        "type": "string",
                        "description": "検索クエリ (自然文、 日本語 / 英語)",
                    },
                    "limit": {
                        "type": "integer",
                        "description": "上位何件 (default 8、 max 20)",
                    },
                    "min_score": {
                        "type": "number",
                        "description": (
                            "コサイン類似度のカットオフ (default 0.30、"
                            " 小さすぎるとノイズが増える)"
                        ),
                    },
                },
                "required": ["query"],
            },
        },
        {
            "name": "lookup_topic_chunk_range",
            "description": (
                "特定 Topic のチャンクを index 範囲で取得する。"
                " search_topic_chunks で得た chunk_index の前後を取りに行く用途。"
                " index は 0-indexed。 from_index / to_index 省略時はそれぞれ"
                " 最初 / 最後を意味する。 Topic 全体を見たいなら"
                " system_lookup (別ツール、 全文取得で高コスト) を使う。"
            ),
            "input_schema": {
                "type": "object",
                "properties": {
                    "topic_id": {
                        "type": "string",
                        "description": "対象 Topic の id",
                    },
                    "from_index": {
                        "type": "integer",
                        "description": "開始 chunk_index (含む、 省略で 0)",
                    },
                    "to_index": {
                        "type": "integer",
                        "description": "終了 chunk_index (含む、 省略で最後)",
                    },
                    "limit": {
                        "type": "integer",
                        "description": "最大取得数 (default 5、 max 15)",
                    },
                },
                "required": ["topic_id"],
            },
        },
    ]
    CHAT_SCOPED_TOOL_NAMES = {t["name"] for t in CHAT_SCOPED_TOOL_SCHEMAS}

    _indices_ensured = [False]
    _topic_embeddings_cache: Dict[str, Tuple[str, List[float]]] = {}

    # チャンクキャッシュ (Phase 6): {topic_id: (updated_at, [{chunk_index, text, embedding}, ...])}
    # 既存の topic 全文 embedding キャッシュとは独立、 Pod メモリ内。
    # Pod 再起動で消えるが初回検索時に自動再構築。
    _topic_chunks_cache: Dict[str, Tuple[str, List[dict]]] = {}


    def _prewarm_caches():
        """Pod 起動時にバックグラウンドでキャッシュを構築する。
        最初の対話発話でユーザーが 2 分以上待たされるのを防ぐ。
        400 topic × 平均 9 chunk = ~3700 chunk の embedding を計算するのに
        130 秒程度かかるため、 起動 30 秒後に別スレッドで先回りする。"""
        # Pod 起動直後の初期化 (neo4j_driver 等) が終わるまで待つ
        time.sleep(30)
        try:
            logger.info("[CHAT/PREWARM] starting cache prewarm in background")
            t0 = time.time()
            # 既存の Phase 5 topic embedding cache
            _refresh_topic_embeddings()
            t1 = time.time()
            logger.info(
                f"[CHAT/PREWARM] topic embeddings done in {t1-t0:.1f}s "
                f"(cached={len(_topic_embeddings_cache)})"
            )
            # Phase 6 chunk cache
            _refresh_topic_chunks_cache()
            t2 = time.time()
            logger.info(
                f"[CHAT/PREWARM] chunk cache done in {t2-t1:.1f}s "
                f"(cached_topics={len(_topic_chunks_cache)})"
            )
            logger.info(
                f"[CHAT/PREWARM] total prewarm time: {t2-t0:.1f}s"
            )
        except Exception as e:
            logger.error(f"[CHAT/PREWARM] failed: {e}", exc_info=True)


    # モジュール読み込み時にバックグラウンドスレッドを起動
    # (kernel Pod 起動 → main.py の chat_endpoints import → ここでスレッド起動)
    import threading as _threading
    _prewarm_thread = _threading.Thread(
        target=_prewarm_caches, daemon=True, name="chat-cache-prewarm",
    )
    _prewarm_thread.start()


    def _now_iso() -> str:
        return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


    def _ensure_indices() -> None:
        if _indices_ensured[0]:
            return
        threads_mapping = {
            "mappings": {
                "properties": {
                    "thread_id": {"type": "keyword"},
                    "owner": {"type": "keyword"},
                    "title": {"type": "text"},
                    "created_at": {"type": "date"},
                    "updated_at": {"type": "date"},
                    "last_message_at": {"type": "date"},
                    "message_count": {"type": "integer"},
                    "model": {"type": "keyword"},
                    "project_id": {"type": "keyword"},
                }
            }
        }
        messages_mapping = {
            "mappings": {
                "properties": {
                    "message_id": {"type": "keyword"},
                    "thread_id": {"type": "keyword"},
                    "owner": {"type": "keyword"},
                    "order": {"type": "integer"},
                    "role": {"type": "keyword"},
                    "content": {"type": "text"},
                    "model": {"type": "keyword"},
                    "input_tokens": {"type": "integer"},
                    "output_tokens": {"type": "integer"},
                    "created_at": {"type": "date"},
                    "injected_topics": {"type": "object", "enabled": False},
                    "tool_calls": {"type": "object", "enabled": False},
                    "cache_w_tokens": {"type": "integer"},
                    "cache_r_tokens": {"type": "integer"},
                    "cost_usd": {"type": "float"},
                }
            }
        }
        for name, mapping in [
            (CHAT_THREADS_INDEX, threads_mapping),
            (CHAT_MESSAGES_INDEX, messages_mapping),
        ]:
            try:
                h = requests.head(f"{OPENSEARCH_URL}/{name}", timeout=5)
                if h.status_code == 200:
                    continue
                c = requests.put(
                    f"{OPENSEARCH_URL}/{name}",
                    json=mapping,
                    headers={"Content-Type": "application/json"},
                    timeout=10,
                )
                if c.status_code in (200, 201):
                    logger.info(f"[CHAT] created OpenSearch index: {name}")
                elif c.status_code == 400 and "resource_already_exists" in c.text:
                    pass
                else:
                    logger.warning(
                        f"[CHAT] failed to create index {name}: "
                        f"{c.status_code} {c.text[:200]}"
                    )
            except Exception as e:
                logger.warning(f"[CHAT] ensure_indices error for {name}: {e}")
        _indices_ensured[0] = True


    def _get_owner(request: dict) -> str:
        owner = (request or {}).get("owner") or ""
        return str(owner).strip() or "anonymous"


    def _os_post(path: str, payload: dict, timeout: int = 10) -> dict:
        try:
            r = requests.post(
                f"{OPENSEARCH_URL}{path}",
                json=payload,
                headers={"Content-Type": "application/json"},
                timeout=timeout,
            )
            try:
                return r.json()
            except Exception:
                if r.status_code < 400:
                    return {"_ok": True}
                return {"_error": f"{r.status_code} {r.text[:200]}"}
        except Exception as e:
            return {"_error": str(e)}


    def _os_put(path: str, payload: dict, timeout: int = 10) -> dict:
        try:
            r = requests.put(
                f"{OPENSEARCH_URL}{path}",
                json=payload,
                headers={"Content-Type": "application/json"},
                params={"refresh": "true"},
                timeout=timeout,
            )
            try:
                return r.json()
            except Exception:
                if r.status_code < 400:
                    return {"_ok": True}
                return {"_error": f"{r.status_code} {r.text[:200]}"}
        except Exception as e:
            return {"_error": str(e)}


    def _os_get(path: str, timeout: int = 10) -> dict:
        try:
            r = requests.get(f"{OPENSEARCH_URL}{path}", timeout=timeout)
            if r.status_code == 404:
                return {"found": False}
            try:
                return r.json()
            except Exception:
                return {"_error": f"{r.status_code} {r.text[:200]}"}
        except Exception as e:
            return {"_error": str(e)}


    def _os_delete(path: str, timeout: int = 10) -> dict:
        try:
            r = requests.delete(f"{OPENSEARCH_URL}{path}", timeout=timeout)
            try:
                return r.json()
            except Exception:
                return {"_ok": r.status_code < 400}
        except Exception as e:
            return {"_error": str(e)}


    # ============================================================
    # 意味検索 (Phase 4) + 自動注入 (Phase 5)
    # ============================================================

    def _list_all_topics_meta() -> List[dict]:
        try:
            from main import neo4j_driver as _neo4j_driver
        except Exception as e:
            logger.warning(f"[CHAT/SEARCH] neo4j_driver import failed: {e}")
            return []
        if _neo4j_driver is None:
            logger.warning("[CHAT/SEARCH] neo4j_driver is None")
            return []
        cypher = (
            "MATCH (t:Topic) "
            "RETURN t.id AS id, t.title AS title, t.summary AS summary, "
            "t.content AS content, t.updated_at AS updated_at"
        )
        try:
            with _neo4j_driver.session() as session:
                result = session.run(cypher)
                records = []
                for record in result:
                    d = dict(record)
                    records.append({
                        "id": d.get("id"),
                        "title": d.get("title"),
                        "summary": d.get("summary"),
                        "content": d.get("content"),
                        "updated_at": (
                            str(d.get("updated_at"))
                            if d.get("updated_at") is not None else ""
                        ),
                    })
                return records
        except Exception as e:
            logger.warning(f"[CHAT/SEARCH] neo4j query failed: {e}")
            return []


    def _compute_embeddings(texts: List[str]) -> List[List[float]]:
        if not texts:
            return []
        try:
            from main import get_embeddings_parallel
        except Exception as e:
            raise RuntimeError(f"embedding function not importable: {e}")
        return get_embeddings_parallel(texts)


    def _cosine(a: List[float], b: List[float]) -> float:
        if not a or not b or len(a) != len(b):
            return 0.0
        dot = 0.0
        na = 0.0
        nb = 0.0
        for x, y in zip(a, b):
            dot += x * y
            na += x * x
            nb += y * y
        if na == 0.0 or nb == 0.0:
            return 0.0
        return dot / (math.sqrt(na) * math.sqrt(nb))


    def _refresh_topic_embeddings() -> Dict[str, dict]:
        topics = _list_all_topics_meta()
        topic_map: Dict[str, dict] = {}
        for t in topics:
            tid = t.get("id")
            if tid:
                topic_map[tid] = t
        if not topic_map:
            return {}
        to_ids: List[str] = []
        to_texts: List[str] = []
        for tid, t in topic_map.items():
            current_updated = str(t.get("updated_at") or "")
            cached = _topic_embeddings_cache.get(tid)
            if cached and cached[0] == current_updated:
                continue
            text = " ".join([
                (t.get("title") or "").strip(),
                (t.get("summary") or "").strip(),
                (t.get("content") or "")[:EMBED_CONTENT_CHAR_LIMIT].strip(),
            ]).strip()
            if not text:
                continue
            to_ids.append(tid)
            to_texts.append(text)
        if to_ids:
            try:
                embs = _compute_embeddings(to_texts)
                if len(embs) == len(to_ids):
                    for tid, emb in zip(to_ids, embs):
                        _topic_embeddings_cache[tid] = (
                            str(topic_map[tid].get("updated_at") or ""),
                            emb,
                        )
                    logger.info(
                        f"[CHAT/SEARCH] refreshed {len(to_ids)} topic embeddings "
                        f"(total cached={len(_topic_embeddings_cache)})"
                    )
            except Exception as e:
                logger.error(
                    f"[CHAT/SEARCH] embedding refresh failed: {e}", exc_info=True,
                )
        stale = [
            tid for tid in _topic_embeddings_cache.keys()
            if tid not in topic_map
        ]
        for tid in stale:
            _topic_embeddings_cache.pop(tid, None)
        return topic_map


    def _search_topics(
        query: str, limit: int = 5, min_score: float = 0.0
    ) -> List[dict]:
        q_embs = _compute_embeddings([query])
        if not q_embs:
            return []
        q_emb = q_embs[0]
        topic_map = _refresh_topic_embeddings()
        if not topic_map:
            return []
        ranked = []
        for tid, cached in _topic_embeddings_cache.items():
            _, emb = cached
            score = _cosine(q_emb, emb)
            if score < min_score:
                continue
            t = topic_map.get(tid) or {}
            ranked.append({
                "id": tid,
                "title": t.get("title") or "",
                "summary": t.get("summary") or "",
                "content": t.get("content") or "",
                "score": round(score, 4),
            })
        ranked.sort(key=lambda x: x["score"], reverse=True)
        return ranked[:limit]


    # ============================================================
    # チャンク単位の意味検索 (Phase 6)
    # ============================================================

    def _split_into_chunks(text: str) -> List[str]:
        """テキストを段落単位で分割し、 大きすぎる段落は target 文字で強制分割、
        小さすぎる断片は前のチャンクにマージする。

        分割規則:
        1. 空行で区切られた段落ごとに分割
        2. 1 つの段落が CHUNK_MAX_CHARS を超えると、 CHUNK_TARGET_CHARS ごとに強制分割
        3. 複数段落をバッファに収めて CHUNK_TARGET_CHARS ごとにチャンク化
        4. 最後に CHUNK_MIN_CHARS 未満のチャンクは前のチャンクにマージ
        """
        if not text or not text.strip():
            return []

        # 段落分割 (空行区切り)
        paragraphs: List[str] = []
        current: List[str] = []
        for line in text.split("\n"):
            if not line.strip():
                if current:
                    paragraphs.append("\n".join(current))
                    current = []
            else:
                current.append(line)
        if current:
            paragraphs.append("\n".join(current))

        # チャンク化
        chunks: List[str] = []
        buffer: List[str] = []
        buffer_len = 0

        for para in paragraphs:
            para_len = len(para)

            # 段落が単独で max を超える → 強制分割
            if para_len > CHUNK_MAX_CHARS:
                if buffer:
                    chunks.append("\n\n".join(buffer))
                    buffer = []
                    buffer_len = 0
                for i in range(0, para_len, CHUNK_TARGET_CHARS):
                    chunks.append(para[i:i + CHUNK_TARGET_CHARS])
                continue

            # buffer に追加すると target を超える → buffer flush
            if buffer_len + para_len > CHUNK_TARGET_CHARS and buffer:
                chunks.append("\n\n".join(buffer))
                buffer = [para]
                buffer_len = para_len
            else:
                buffer.append(para)
                buffer_len += para_len + 2

        if buffer:
            chunks.append("\n\n".join(buffer))

        # min 未満の断片を前にマージ
        merged: List[str] = []
        for c in chunks:
            if len(c) < CHUNK_MIN_CHARS and merged:
                merged[-1] = merged[-1] + "\n\n" + c
            else:
                merged.append(c)

        return merged


    def _refresh_topic_chunks_cache() -> Dict[str, dict]:
        """全 topic のチャンクキャッシュを差分更新。 updated_at の変化で検知。

        最初のチャンクには title/summary を前置して検索スコアを向上させる。
        """
        topics = _list_all_topics_meta()
        topic_map: Dict[str, dict] = {}
        for t in topics:
            tid = t.get("id")
            if tid:
                topic_map[tid] = t
        if not topic_map:
            return {}

        all_new_texts: List[Tuple[str, int, str]] = []
        topic_ids_to_rebuild = set()

        for tid, t in topic_map.items():
            current_updated = str(t.get("updated_at") or "")
            cached = _topic_chunks_cache.get(tid)
            if cached and cached[0] == current_updated:
                continue

            content = t.get("content") or ""
            title = t.get("title") or ""
            summary = t.get("summary") or ""
            chunks_text = _split_into_chunks(content)
            if not chunks_text:
                text = f"{title}\n{summary}".strip()
                if text:
                    chunks_text = [text]

            # 最初のチャンクに title/summary を前置 (検索スコアのため)
            if chunks_text:
                prefix_parts = []
                if title:
                    prefix_parts.append(f"[{title}]")
                if summary:
                    prefix_parts.append(summary)
                if prefix_parts:
                    prefix = " ".join(prefix_parts) + "\n\n"
                    chunks_text[0] = prefix + chunks_text[0]

            topic_ids_to_rebuild.add(tid)
            for i, txt in enumerate(chunks_text):
                all_new_texts.append((tid, i, txt))

        if not all_new_texts:
            # stale 削除
            stale = [tid for tid in _topic_chunks_cache.keys()
                     if tid not in topic_map]
            for tid in stale:
                _topic_chunks_cache.pop(tid, None)
            return topic_map

        # embedding (一括 batch)
        texts_for_embed = [
            t[2][:EMBED_CONTENT_CHAR_LIMIT] for t in all_new_texts
        ]
        try:
            embs = _compute_embeddings(texts_for_embed)
        except Exception as e:
            logger.error(
                f"[CHAT/CHUNK] embedding batch failed: {e}", exc_info=True,
            )
            return topic_map

        if len(embs) != len(all_new_texts):
            logger.warning(
                f"[CHAT/CHUNK] batch size mismatch: "
                f"requested={len(all_new_texts)} got={len(embs)}"
            )
            return topic_map

        # topic ごとにリスト化して cache に投入
        by_topic: Dict[str, List[dict]] = {}
        for (tid, ci, txt), emb in zip(all_new_texts, embs):
            by_topic.setdefault(tid, []).append({
                "chunk_index": ci,
                "text": txt,
                "embedding": emb,
            })
        for tid, ch_list in by_topic.items():
            ch_list.sort(key=lambda x: x["chunk_index"])
            _topic_chunks_cache[tid] = (
                str(topic_map[tid].get("updated_at") or ""),
                ch_list,
            )

        stale = [tid for tid in _topic_chunks_cache.keys()
                 if tid not in topic_map]
        for tid in stale:
            _topic_chunks_cache.pop(tid, None)

        logger.info(
            f"[CHAT/CHUNK] refreshed {len(all_new_texts)} chunks "
            f"from {len(topic_ids_to_rebuild)} topics "
            f"(total cached topics={len(_topic_chunks_cache)})"
        )
        return topic_map


    def _search_chunks(
        query: str, limit: int = 8, min_score: float = 0.30,
    ) -> List[dict]:
        """全チャンクを意味検索し、 上位 N 件を topic 横断で返す。"""
        q_embs = _compute_embeddings([query])
        if not q_embs:
            return []
        q_emb = q_embs[0]
        topic_map = _refresh_topic_chunks_cache()
        if not topic_map:
            return []
        ranked: List[dict] = []
        for tid, cached in _topic_chunks_cache.items():
            _, chunks = cached
            t = topic_map.get(tid) or {}
            title = t.get("title") or ""
            for chunk in chunks:
                score = _cosine(q_emb, chunk["embedding"])
                if score < min_score:
                    continue
                ranked.append({
                    "topic_id": tid,
                    "topic_title": title,
                    "chunk_index": chunk["chunk_index"],
                    "text": chunk["text"],
                    "score": round(score, 4),
                })
        ranked.sort(key=lambda x: x["score"], reverse=True)
        return ranked[:limit]


    def _get_topic_chunk_range(
        topic_id: str,
        from_index: Optional[int] = None,
        to_index: Optional[int] = None,
        limit: int = 5,
    ) -> dict:
        """指定 topic のチャンクを index 範囲で取得。キャッシュになければ再構築。"""
        topic_map = _refresh_topic_chunks_cache()
        cached = _topic_chunks_cache.get(topic_id)
        if not cached:
            return {
                "ok": False,
                "error": f"topic not found or empty: {topic_id}",
            }
        _, chunks = cached
        total = len(chunks)
        if total == 0:
            return {
                "ok": True,
                "topic_id": topic_id,
                "total_chunks": 0,
                "chunks": [],
            }
        fi = 0 if from_index is None else max(0, int(from_index))
        ti = total - 1 if to_index is None else min(total - 1, int(to_index))
        if ti < fi:
            ti = fi
        # limit 適用
        if ti - fi + 1 > limit:
            ti = fi + limit - 1
        selected = chunks[fi:ti + 1]
        t = topic_map.get(topic_id) or {}
        return {
            "ok": True,
            "topic_id": topic_id,
            "topic_title": t.get("title") or "",
            "total_chunks": total,
            "returned_range": [fi, ti],
            "chunks": [
                {"chunk_index": c["chunk_index"], "text": c["text"]}
                for c in selected
            ],
        }


    def _jev_kb_gate(
        user_content: str,
    ) -> Tuple[bool, List[dict], Dict[str, Any]]:
        """Jev で「知識ベースを参照すべきか」「するならどの topic か」を判定する。

        3 段構成:
        1) Jev noul で needs_kb を判定
        2) needs_kb=True なら意味検索で CHAT_JEV_KB_SEARCH_CANDIDATES 件を候補化
        3) Jev choice で候補から 1 件選び、 除外して次を選ぶ、 を
           CHAT_JEV_KB_INJECT_TOP_K 回繰り返して最終選抜

        Returns:
            (needs_kb, chosen_topics, jev_info)
            chosen_topics: 完全な topic dict のリスト (id, title, summary, content)
            jev_info: ログ用の Jev 応答メタ
        """
        info: Dict[str, Any] = {"gate": None, "choices": [], "errors": []}

        # Step 1: needs_kb 判定
        try:
            from main import call_jev
            gate_result = call_jev(
                state=user_content,
                questions={
                    "needs_kb": {
                        "type": "noul",
                        "instructions": (
                            "この質問に応えるのに、 OpenSpoke "
                            "環境固有の知識 (プラットフォームの設定、 過去の判断や決定、 "
                            "稼働中のプロジェクトの経緯、 個別モジュールの構成、 "
                            "会社固有の運用ルール、 過去の障害と対策、 "
                            "過去のスレッドでの合意 等) を参照する必要があるか。 "
                            "Python 文法や Kubernetes の一般概念など、 "
                            "一般技術知識だけで答えられるなら false。 "
                            "迷ったら true を選べ (推測より参照が常に良い)。"
                        ),
                    },
                },
                timeout=10,
            )
            info["gate"] = gate_result
        except Exception as e:
            logger.warning(f"[CHAT/JEV_KB_GATE] noul failed: {e}")
            info["errors"].append({"stage": "noul", "error": str(e)})
            # 判定失敗時は安全側 (読むべし) に倒し、 埋め込みで topic を選ぶ
            try:
                fallback_topics = _search_topics(
                    user_content,
                    limit=INJECT_TOP_N,
                    min_score=INJECT_MIN_SCORE,
                )
            except Exception:
                fallback_topics = []
            info["fallback"] = "noul_failed_embedding"
            return True, fallback_topics, info

        needs_kb_ans = (gate_result.get("answers") or {}).get("needs_kb") or {}
        prob = needs_kb_ans.get("noul")
        if isinstance(prob, (int, float)) and prob < 0.5:
            return False, [], info

        # Step 2: 意味検索で候補を出す
        try:
            candidates = _search_topics(
                user_content,
                limit=CHAT_JEV_KB_SEARCH_CANDIDATES,
                min_score=0.0,
            )
        except Exception as e:
            logger.warning(f"[CHAT/JEV_KB_GATE] search failed: {e}")
            info["errors"].append({"stage": "search", "error": str(e)})
            return True, [], info

        if not candidates:
            return True, [], info

        # Step 3: Jev choice を K 回繰り返して top-K 選抜
        remaining = list(candidates)
        chosen: List[dict] = []
        for k in range(min(CHAT_JEV_KB_INJECT_TOP_K, len(candidates))):
            if not remaining:
                break
            criteria = {}
            for t in remaining:
                title = (t.get("title") or "")[:80]
                summary = (t.get("summary") or "")[:120]
                criteria[t["id"]] = (
                    f"{title} — {summary}" if summary else title
                )
            try:
                choice_result = call_jev(
                    state=user_content,
                    questions={
                        "topic": {
                            "type": "choice",
                            "instructions": (
                                "この質問に応えるのに一番役立ちそうな "
                                "知識ベース topic を 1 つ選べ。 "
                                "title と summary を見て判断。"
                            ),
                            "criteria": criteria,
                        },
                    },
                    timeout=10,
                )
                info["choices"].append(choice_result)
            except Exception as e:
                logger.warning(
                    f"[CHAT/JEV_KB_GATE] choice #{k+1} failed: {e}"
                )
                info["errors"].append(
                    {"stage": f"choice_{k+1}", "error": str(e)}
                )
                break

            picked_id = (choice_result.get("answers") or {}).get(
                "topic", {}
            ).get("choice")
            picked_topic = next(
                (t for t in remaining if t["id"] == picked_id), None,
            )
            if picked_topic is None:
                break
            chosen.append(picked_topic)
            remaining = [t for t in remaining if t["id"] != picked_id]

        if not chosen:
            # Jev が 1 件も選べなかったら埋め込み上位を fallback として使う
            chosen = candidates[:CHAT_JEV_KB_INJECT_TOP_K]
            info["fallback"] = "no_valid_choice_embedding"

        return True, chosen, info


    def _build_system_prompt(user_content: str, user_namespace: str) -> Tuple[str, List[dict]]:
        """system_prompt を構築し、 事前注入した topic のメタを返す。

        3 つの常時リマインダー (読め・書け・メモリに頼るな) を毎ターン先頭に据え、
        Jev による KB ゲート (needs_kb noul + topic choice) の判定結果を添える。
        Jev 失敗時は埋め込み類似度 top-N にフォールバック。
        """
        preamble_lines = [
            "あなたは OpenSpoke 利用者の対話パートナーです。",
            "OpenSpoke プラットフォームと利用者の技術的作業の相談相手として振る舞います。",
            "",
            f"現在時刻 (UTC): {_now_iso()}",
            "バックエンドの sliding window は直近 20 発話。 これより古い履歴を",
            "見たいときは read_chat_thread_messages を時間軸ベースで使うのが基本。",
            "",
            "MCP tool 経由で OpenSpoke の知識ベース (Memgraph 上の Topic ノード) や",
            "各種インフラ (GitHub, K8s, Fleet, Memgraph, OpenSearch, MinIO 等) に",
            "アクセスできます。 タスクに応じて能動的に使ってください。",
            "",
            "## 記憶と記録に関する厳格ルール (常時、 例外なし)",
            "",
            "1. **知識ベースを読め**: OpenSpoke 環境、 過去の判断、 稼働中の状態、",
            "   個別プロジェクトの経緯を話題にするときは、 推測せず必ず知識ベースを引く。",
            "   下の Jev 判定と事前注入トピックを起点に、 足りなければ tool を呼ぶ。",
            "2. **知識ベースに書け**: 新しい知見、 決定、 訂正が出たら、 会話の途中でも",
            f"   upsert_knowledge (namespace='{user_namespace}') で即記録する。 「あとで書く」 は",
            "   絶対にしない。 記録は無条件・自発的。 追記漏れは利用者への裏切り。",
            "3. **メモリなんかに記録するな**: 会話履歴・対話ログ・独自の内部メモに",
            "   頼るな。 OpenSpoke 環境における唯一の記録先は Memgraph 上の知識ベースだ。",
            "   短期は sliding window に、 中長期は知識ベースにだけ書く。",
            "",
            "## 知識ベースアクセスの選択 (安い順)",
            "",
            "1. search_topic_chunks(query): チャンク単位の意味検索。",
            "   Topic 全体を取らず、 関連する断片だけ (200-500 字 × 8 件程度) を返す。",
            "   基本は常にこれを最初に呼ぶ (system_lookup の 5-50 倍安い)。",
            "2. lookup_topic_chunk_range(topic_id, from_index, to_index): search で得た",
            "   {topic_id, chunk_index} の前後のチャンクを取りに行く用途。",
            "3. system_lookup(topic): Topic 全文取得 (高コスト)。 Topic 全体が必要な場合のみ。",
            "4. system_topics: Topic 一覧 (id, title, summary)。 メタ的な問いに使う。",
            "5. system_brief: OpenSpoke 全体の地図 (新しいスレッドの最初など)。",
            "",
            f"知識の追記は upsert_knowledge (namespace='{user_namespace}') が基本です。",
            "",
        ]

        injected_meta: List[dict] = []
        topics: List[dict] = []
        jev_source = "none"

        if CHAT_JEV_KB_GATE_ENABLED:
            try:
                needs_kb, chosen_topics, jev_info = _jev_kb_gate(user_content)
                logger.info(
                    f"[CHAT/JEV_KB_GATE] needs_kb={needs_kb} "
                    f"chosen_count={len(chosen_topics)} "
                    f"errors={len(jev_info.get('errors') or [])} "
                    f"fallback={jev_info.get('fallback')}"
                )
                if not needs_kb:
                    preamble_lines.append("## Jev 判定: 知識ベース参照不要")
                    preamble_lines.append("")
                    preamble_lines.append(
                        "Jev がこの発話を「一般知識で答えられる」と判定した。 "
                        "事前注入はしないが、 判断が変わったら"
                        " search_topic_chunks で自発的に読みに行くこと。"
                    )
                    preamble_lines.append("")
                    return "\n".join(preamble_lines), injected_meta
                topics = chosen_topics
                jev_source = "jev_gate"
            except Exception as e:
                logger.warning(
                    f"[CHAT/JEV_KB_GATE] gate raised, fallback: {e}"
                )
                topics = []

        if not topics:
            # Jev 無効時、 または Jev 失敗時のフォールバック
            try:
                topics = _search_topics(
                    user_content,
                    limit=INJECT_TOP_N,
                    min_score=INJECT_MIN_SCORE,
                )
                if topics and jev_source == "none":
                    jev_source = "embedding_only"
                elif topics:
                    jev_source = "embedding_fallback"
            except Exception as e:
                logger.warning(f"[CHAT/INJECT] search failed, skip: {e}")
                topics = []

        if topics:
            header = (
                "## Jev が選んだ関連知識 (事前注入)"
                if jev_source == "jev_gate"
                else "## 事前注入した関連知識"
            )
            preamble_lines.append(header)
            preamble_lines.append("")
            if jev_source == "jev_gate":
                preamble_lines.append(
                    f"Jev が意味検索の候補から関連度で {len(topics)} 件を選抜した。"
                )
            else:
                preamble_lines.append(
                    f"今回の発話に関連する上位 {len(topics)} 件を意味検索で事前抽出した。"
                )
            preamble_lines.append(
                "不十分な場合や別の観点も欲しい場合は MCP tool を呼んで補完してください。"
            )
            preamble_lines.append("")
            for i, t in enumerate(topics, start=1):
                score_val = t.get("score")
                score_str = (
                    f", 類似度 {score_val:.2f}"
                    if isinstance(score_val, (int, float))
                    else ""
                )
                preamble_lines.append(
                    f"### 関連知識 {i}: {t['title']} "
                    f"(id={t['id']}{score_str})"
                )
                summary = t.get("summary") or ""
                content = (t.get("content") or "")[:INJECT_CONTENT_CHAR_LIMIT]
                if summary:
                    preamble_lines.append(f"要約: {summary}")
                if content:
                    preamble_lines.append(content)
                preamble_lines.append("")
            injected_meta = [
                {"id": t["id"], "title": t["title"], "score": t.get("score")}
                for t in topics
            ]

        return "\n".join(preamble_lines), injected_meta


    def _execute_chat_scoped_tool(
        ctx: dict, tool_name: str, tool_input: dict,
    ) -> str:
        """chat-scoped tool を owner / current_thread 制約付きで実行し、
        tool_result 用の JSON 文字列を返す。"""
        owner = ctx["owner"]
        current_thread = ctx["thread_id"]
        try:
            if tool_name == "list_my_chat_threads":
                query = {
                    "size": 200,
                    "query": {"term": {"owner": owner}},
                    "sort": [
                        {"last_message_at": {
                            "order": "desc", "missing": "_last",
                        }},
                        {"created_at": {"order": "desc"}},
                    ],
                }
                result = _os_post(
                    f"/{CHAT_THREADS_INDEX}/_search", query,
                )
                if "_error" in result:
                    return json.dumps(
                        {"ok": False, "error": result["_error"]},
                        ensure_ascii=False,
                    )
                hits = result.get("hits", {}).get("hits", []) or []
                threads = []
                for h in hits:
                    src = h.get("_source", {}) or {}
                    tid = src.get("thread_id") or h.get("_id")
                    threads.append({
                        "thread_id": tid,
                        "title": src.get("title") or "",
                        "message_count": int(src.get("message_count") or 0),
                        "last_message_at": src.get("last_message_at"),
                        "current": (tid == current_thread),
                    })
                return json.dumps(
                    {"ok": True, "count": len(threads), "threads": threads},
                    ensure_ascii=False,
                )

            if tool_name == "read_chat_thread_messages":
                tid = (tool_input or {}).get("thread_id") or current_thread
                from_order = (tool_input or {}).get("from_order")
                to_order = (tool_input or {}).get("to_order")
                since = (tool_input or {}).get("since")
                until = (tool_input or {}).get("until")
                limit_raw = (tool_input or {}).get("limit")
                try:
                    limit = int(limit_raw) if limit_raw is not None else 30
                except Exception:
                    limit = 30
                limit = max(1, min(limit, 100))

                g = _os_get(f"/{CHAT_THREADS_INDEX}/_doc/{tid}")
                if "_error" in g or not g.get("found"):
                    return json.dumps(
                        {"ok": False, "error": "thread not found"},
                        ensure_ascii=False,
                    )
                tdoc = g.get("_source") or {}
                if tdoc.get("owner") != owner:
                    return json.dumps(
                        {"ok": False, "error": "permission denied"},
                        ensure_ascii=False,
                    )

                filters: List[dict] = [{"term": {"thread_id": tid}}]
                # 順序ベース (order)
                if from_order is not None or to_order is not None:
                    range_q: Dict[str, int] = {}
                    if from_order is not None:
                        try:
                            range_q["gte"] = int(from_order)
                        except Exception:
                            pass
                    if to_order is not None:
                        try:
                            range_q["lte"] = int(to_order)
                        except Exception:
                            pass
                    if range_q:
                        filters.append({"range": {"order": range_q}})
                # 時間軸ベース (created_at)
                if since or until:
                    time_range: Dict[str, str] = {}
                    if since:
                        time_range["gte"] = str(since)
                    if until:
                        time_range["lte"] = str(until)
                    if time_range:
                        filters.append({"range": {"created_at": time_range}})

                q = {
                    "size": limit,
                    "query": {"bool": {"must": filters}},
                    "sort": [{"order": {"order": "asc"}}],
                }
                result = _os_post(
                    f"/{CHAT_MESSAGES_INDEX}/_search", q,
                )
                if "_error" in result:
                    return json.dumps(
                        {"ok": False, "error": result["_error"]},
                        ensure_ascii=False,
                    )
                hits = result.get("hits", {}).get("hits", []) or []
                messages = []
                for h in hits:
                    src = h.get("_source", {}) or {}
                    messages.append({
                        "order": src.get("order"),
                        "role": src.get("role"),
                        "content": src.get("content"),
                        "created_at": src.get("created_at"),
                    })
                return json.dumps({
                    "ok": True,
                    "thread_id": tid,
                    "thread_title": tdoc.get("title"),
                    "total_in_thread": int(tdoc.get("message_count") or 0),
                    "count": len(messages),
                    "messages": messages,
                }, ensure_ascii=False)

            if tool_name == "search_my_chat_history":
                query_text = (tool_input or {}).get("query") or ""
                if not query_text.strip():
                    return json.dumps(
                        {"ok": False, "error": "query is required"},
                        ensure_ascii=False,
                    )
                tid = (tool_input or {}).get("thread_id") or ""
                limit_raw = (tool_input or {}).get("limit")
                try:
                    limit = int(limit_raw) if limit_raw is not None else 10
                except Exception:
                    limit = 10
                limit = max(1, min(limit, 30))

                filters: List[dict] = [
                    {"term": {"owner": owner}},
                    {"match": {"content": query_text}},
                ]
                if tid:
                    filters.append({"term": {"thread_id": tid}})

                q = {
                    "size": limit,
                    "query": {"bool": {"must": filters}},
                    "sort": [{"_score": {"order": "desc"}}],
                    "highlight": {
                        "fields": {
                            "content": {
                                "fragment_size": 200,
                                "number_of_fragments": 2,
                            },
                        },
                        "pre_tags": ["<mark>"],
                        "post_tags": ["</mark>"],
                    },
                }
                result = _os_post(
                    f"/{CHAT_MESSAGES_INDEX}/_search", q,
                )
                if "_error" in result:
                    return json.dumps(
                        {"ok": False, "error": result["_error"]},
                        ensure_ascii=False,
                    )
                hits = result.get("hits", {}).get("hits", []) or []
                out = []
                for h in hits:
                    src = h.get("_source", {}) or {}
                    highlights = (h.get("highlight", {}) or {}).get(
                        "content", []
                    ) or []
                    if highlights:
                        snippet = " ... ".join(highlights)
                    else:
                        snippet = (src.get("content") or "")[:200]
                    out.append({
                        "thread_id": src.get("thread_id"),
                        "order": src.get("order"),
                        "role": src.get("role"),
                        "created_at": src.get("created_at"),
                        "content_snippet": snippet,
                        "score": h.get("_score"),
                    })
                return json.dumps({
                    "ok": True,
                    "count": len(out),
                    "query": query_text,
                    "scope": ("thread" if tid else "all"),
                    "hits": out,
                }, ensure_ascii=False)

            if tool_name == "search_topic_chunks":
                query_text = (tool_input or {}).get("query") or ""
                if not query_text.strip():
                    return json.dumps(
                        {"ok": False, "error": "query is required"},
                        ensure_ascii=False,
                    )
                limit_raw = (tool_input or {}).get("limit")
                try:
                    limit = int(limit_raw) if limit_raw is not None else 8
                except Exception:
                    limit = 8
                limit = max(1, min(limit, 20))
                min_score_raw = (tool_input or {}).get("min_score")
                try:
                    min_score = (
                        float(min_score_raw)
                        if min_score_raw is not None else 0.30
                    )
                except Exception:
                    min_score = 0.30
                min_score = max(0.0, min(min_score, 1.0))
                results = _search_chunks(
                    query_text, limit=limit, min_score=min_score,
                )
                return json.dumps({
                    "ok": True,
                    "count": len(results),
                    "query": query_text,
                    "chunks": results,
                }, ensure_ascii=False)

            if tool_name == "lookup_topic_chunk_range":
                topic_id = (tool_input or {}).get("topic_id") or ""
                if not topic_id.strip():
                    return json.dumps(
                        {"ok": False, "error": "topic_id is required"},
                        ensure_ascii=False,
                    )
                fi = (tool_input or {}).get("from_index")
                ti = (tool_input or {}).get("to_index")
                limit_raw = (tool_input or {}).get("limit")
                try:
                    limit = int(limit_raw) if limit_raw is not None else 5
                except Exception:
                    limit = 5
                limit = max(1, min(limit, 15))
                result = _get_topic_chunk_range(
                    topic_id.strip(),
                    from_index=fi, to_index=ti, limit=limit,
                )
                return json.dumps(result, ensure_ascii=False)

            return json.dumps(
                {"ok": False, "error": f"unknown chat tool: {tool_name}"},
                ensure_ascii=False,
            )
        except Exception as e:
            logger.error(
                f"[CHAT_TOOL] {tool_name} failed: {e}", exc_info=True,
            )
            return json.dumps(
                {"ok": False,
                 "error": f"{type(e).__name__}: {str(e)[:200]}"},
                ensure_ascii=False,
            )


    @router.post("/core/handoff/topics/search")
    async def core_handoff_topics_search(request: dict):
        """発話 / 自然文から関連 Topic を意味検索で返す (Phase 4、 フロントエンドの
        「思い出して」ボタン用)。"""
        query = (request or {}).get("query") or ""
        limit = int((request or {}).get("limit") or 5)
        min_score = float((request or {}).get("min_score") or 0.0)
        if not query.strip():
            return {"ok": False, "topics": [], "error": "query is required"}
        try:
            topics = _search_topics(query, limit=limit, min_score=min_score)
            summarized = [
                {"id": t["id"], "title": t["title"],
                 "summary": t["summary"], "score": t["score"]}
                for t in topics
            ]
            return {"ok": True, "topics": summarized, "error": None}
        except Exception as e:
            logger.error(f"[CHAT/SEARCH] search failed: {e}", exc_info=True)
            return {"ok": False, "topics": [],
                    "error": f"{type(e).__name__}: {str(e)[:200]}"}


    # ============================================================
    # KB gate エンドポイント (Phase 2-h Step G、 claude.ai の対話 Claude 用)
    # ============================================================
    # claude.ai の Claude (このシステム外の対話 Claude) が turn の頭と末に叩く
    # 外部脳ツール。 Chat 経路の _jev_kb_gate を切り出して外向き化したもの。
    #
    #   prep_turn:   利用者の指示に対して知識ベースを引くべきか、 引くならどの topic か、
    #                を Jev で判定し、 選抜 topic の完全 (id/title/summary/content) を
    #                返す。 Claude はこれ以外の情報源 (memory、 圧縮 transcript) を
    #                OpenSpoke 環境の情報源として使わない前提。
    #   record_turn: Claude の作業結果と、 Claude 自身が下書きした topic 案を受け取り、
    #                Jev noul で「記録に値するか」を判定し、 値するなら
    #                /core/handoff/topic/upsert で Memgraph に投入する。
    #                返り値は利用者に見せる削ぎ落とし報告 (user_report、 後方互換のため
    #                legacy_report も同値で入る)。

    _KB_REMINDERS = [
        "OpenSpoke 環境固有の指示に応じるときは、 推測せず必ず知識ベースを引く (jev_prep_turn を先に叩く)。",
        "作業の結末を得たら、 利用者に見せる前に jev_record_turn に送って知識ベースに書く。 記録要否は Jev が判定する。",
        "claude.ai の memory (memory_read / memory_write) と圧縮 transcript は、 OpenSpoke 環境の情報源として使わない。 中長期の記録先は Memgraph 知識ベース (system_lookup / upsert_knowledge の経路) のみ。",
    ]


    @router.post("/core/kb/prep_turn")
    async def core_kb_prep_turn(request: dict):
        """claude.ai の Claude が turn 頭で叩く外向きエンドポイント。

        利用者の指示に応える前準備として、 知識ベース参照要否を Jev で判定し、
        必要なら意味検索 + Jev choice で選抜した topic の完全メタ (id / title
        / summary / content) を返す。 常時 3 リマインダー (KB を引け・KB に書け
        ・memory に頼るな) も同梱。

        Body:
            {"instruction": str, "context_hint": str (optional)}
        Returns:
            {"ok": bool, "needs_kb": bool,
             "chosen_topics": [{"id","title","summary","content","score"}],
             "reminders": [str, ...],
             "jev_info": {...}, "error": str | null}
        """
        instruction = ((request or {}).get("instruction") or "").strip()
        context_hint = ((request or {}).get("context_hint") or "").strip()
        if not instruction:
            return {
                "ok": False, "needs_kb": False, "chosen_topics": [],
                "reminders": list(_KB_REMINDERS), "jev_info": {},
                "error": "instruction is required",
            }
        state = instruction if not context_hint else (
            f"# 直前文脈 (要約)\n{context_hint}\n\n"
            f"# 今回の指示\n{instruction}"
        )
        try:
            needs_kb, chosen, jev_info = _jev_kb_gate(state)
        except Exception as e:
            logger.error(
                f"[KB/PREP_TURN] gate failed: {e}", exc_info=True
            )
            return {
                "ok": False, "needs_kb": True, "chosen_topics": [],
                "reminders": list(_KB_REMINDERS),
                "jev_info": {"error": f"{type(e).__name__}: {str(e)[:200]}"},
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }
        return {
            "ok": True,
            "needs_kb": needs_kb,
            "chosen_topics": [
                {
                    "id": t.get("id"),
                    "title": t.get("title") or "",
                    "summary": t.get("summary") or "",
                    "content": (t.get("content") or "")[:INJECT_CONTENT_CHAR_LIMIT],
                    "score": t.get("score"),
                }
                for t in chosen
            ],
            "reminders": list(_KB_REMINDERS),
            "jev_info": jev_info,
            "error": None,
        }


    @router.post("/core/kb/record_turn")
    async def core_kb_record_turn(request: dict):
        """claude.ai の Claude が turn 末で叩く外向きエンドポイント。

        作業結果と Claude 自身が下書きした topic 案 (id / title / summary / body)
        を受け取り、 Jev noul で「記録に値するか」を判定し、 値するなら
        /core/handoff/topic/upsert を叩いて Memgraph に投入する。 返り値の
        user_report (後方互換のため legacy_report も同値で入る) は利用者に見せる
        削ぎ落とし報告 (1 行)。

        Body:
            {"context": str, "result": str,
             "proposed_topic": {"id","title","summary","body",
                                 "category" (optional),
                                 "existing_id" (optional)}}
        Returns:
            {"ok": bool, "recorded": bool, "action": "created"|"updated"|"skip",
             "topic_id": str | null, "legacy_report": str, "user_report": str,
             "jev_verdict": {...}, "jev_info": {...}, "error": str | null}
        """
        context = ((request or {}).get("context") or "").strip()
        result = ((request or {}).get("result") or "").strip()
        proposed = (request or {}).get("proposed_topic") or {}
        p_id = (proposed.get("id") or "").strip()
        p_title = (proposed.get("title") or "").strip()
        p_summary = (proposed.get("summary") or "").strip()
        p_body = (proposed.get("body") or "").strip()
        p_category = (proposed.get("category") or "topic").strip() or "topic"
        p_module = (proposed.get("module") or "").strip() or None
        existing_id = (proposed.get("existing_id") or "").strip() or None

        if not result:
            return {
                "ok": False, "recorded": False, "action": "skip",
                "topic_id": None, "legacy_report": "", "user_report": "", "jev_verdict": {},
                "jev_info": {}, "error": "result is required",
            }
        if not (p_id and p_title and p_summary and p_body):
            return {
                "ok": False, "recorded": False, "action": "skip",
                "topic_id": None, "legacy_report": "", "user_report": "", "jev_verdict": {},
                "jev_info": {},
                "error": "proposed_topic requires id / title / summary / body",
            }

        state = (
            f"# 作業前提 (利用者の指示と直前文脈)\n{context[:2000]}\n\n"
            f"# 実施した作業と結末\n{result[:4000]}\n\n"
            f"# 記録案\n"
            f"id: {p_id}\ntitle: {p_title}\nsummary: {p_summary}\n\n"
            f"{p_body[:3000]}"
        )

        jev_info: Dict[str, Any] = {"errors": []}
        verdict: Dict[str, Any] = {}
        try:
            from main import call_jev
            gate = call_jev(
                state=state,
                questions={
                    "worth_recording": {
                        "type": "noul",
                        "instructions": (
                            "この記録案は OpenSpoke 環境における新知見・決定・訂正・"
                            "実装済み事実として知識ベースに残す価値があるか。 "
                            "恒久的に効果を持つ事実 (実装完了、 方針決定、 実測結果、 "
                            "恒久的な運用手順、 bug 修正の根本原因、 新しい仕様や設計) "
                            "なら true。 その場限りの発言、 質問、 雑談、 未検証の推測、 "
                            "既存 topic に完全に含まれる重複、 なら false。 "
                            "迷ったら true を選べ (書き忘れは書き過ぎより悪い)。"
                        ),
                    },
                },
                timeout=10,
            )
            verdict["worth_recording_noul"] = (
                (gate.get("answers") or {}).get("worth_recording", {}).get("noul")
            )
            jev_info["gate"] = gate
        except Exception as e:
            logger.warning(
                f"[KB/RECORD_TURN] noul failed: {e}", exc_info=True
            )
            jev_info["errors"].append({"stage": "noul", "error": str(e)})
            # Jev 失敗時は安全側 (書く) に倒す
            verdict["worth_recording_noul"] = 1.0
            jev_info["fallback"] = "noul_failed_record"

        prob = verdict.get("worth_recording_noul")
        if isinstance(prob, (int, float)) and prob < 0.5:
            skip_report = (
                "今回の結末は知識ベースに残す価値がないと判断 "
                f"(worth_recording={prob:.2f})。"
            )
            return {
                "ok": True, "recorded": False, "action": "skip",
                "topic_id": None,
                "legacy_report": skip_report,
                "user_report": skip_report,
                "jev_verdict": verdict, "jev_info": jev_info,
                "error": None,
            }

        target_id = existing_id or p_id
        try:
            # localhost:8000 経由の HTTP fetch は kernel Pod の Uvicorn worker (default 1)
            # が spawn/pickup で塞がって deadlock 気味に timeout する問題があるため、
            # main.topic_upsert_direct を direct import で叩く (プロセス内呼び出し)。
            # 参考: topic jev_external_brain_direct_call_root_cause_fix_20260921
            # (git_credentials.resolve_typesafe_token_for_org と同じ手法)。
            from main import topic_upsert_direct
            up = topic_upsert_direct(
                target_id,
                title=p_title,
                summary=p_summary,
                content=p_body,
                category=p_category,
                module=p_module,
            )
            jev_info["upsert"] = {
                "action": up.get("action"),
                "updated_at": up.get("updated_at"),
            }
            if not up.get("ok"):
                return {
                    "ok": False, "recorded": False, "action": "skip",
                    "topic_id": target_id, "legacy_report": "", "user_report": "",
                    "jev_verdict": verdict, "jev_info": jev_info,
                    "error": up.get("error") or "upsert failed",
                }
            action = up.get("action") or ("updated" if existing_id else "created")
        except Exception as e:
            logger.error(
                f"[KB/RECORD_TURN] upsert failed: {e}", exc_info=True
            )
            return {
                "ok": False, "recorded": False, "action": "skip",
                "topic_id": target_id, "legacy_report": "", "user_report": "",
                "jev_verdict": verdict,
                "jev_info": {**jev_info, "upsert_error": str(e)},
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            }

        verb = "更新" if action == "updated" else "新規記録"
        report_text = f"知識ベースに{verb}: `{target_id}` — {p_summary}"

        return {
            "ok": True, "recorded": True, "action": action,
            "topic_id": target_id, "legacy_report": report_text, "user_report": report_text,
            "jev_verdict": verdict, "jev_info": jev_info,
            "error": None,
        }


