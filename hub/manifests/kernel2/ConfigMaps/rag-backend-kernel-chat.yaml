    def _list_messages(thread_id: str, size: int = 500) -> List[dict]:
        result = _os_post(
            f"/{CHAT_MESSAGES_INDEX}/_search",
            {
                "size": size,
                "query": {"term": {"thread_id": thread_id}},
                "sort": [{"order": {"order": "asc"}}],
            },
        )
        if "_error" in result:
            return []
        hits = result.get("hits", {}).get("hits", []) or []
        out = []
        for h in hits:
            src = h.get("_source", {}) or {}
            src["message_id"] = src.get("message_id") or h.get("_id")
            out.append(src)
        return out


    @router.post("/core/chat/messages/list")
    async def core_chat_messages_list(request: dict):
        _ensure_indices()
        owner = _get_owner(request)
        thread_id = (request or {}).get("thread_id") or ""
        if not thread_id:
            return {"ok": False, "messages": [], "error": "thread_id is required"}
