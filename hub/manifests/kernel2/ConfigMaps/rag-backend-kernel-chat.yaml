            f"[CHAT] thread created: {thread_id} owner={owner!r} "
            f"title={title!r} project_id={project_id!r}"
        )
        return {
            "ok": True, "thread_id": thread_id, "title": title,
            "created_at": now, "model": model,
            "project_id": project_id, "error": None,
        }


