        now = _now_iso()
        if not title:
            title = f"新規スレッド {now[:19].replace('T', ' ')} UTC"
        thread_id = f"thread_{uuid.uuid4().hex[:16]}"
        doc = {
            "thread_id": thread_id,
            "owner": owner,
            "title": title,
            "created_at": now,
            "updated_at": now,
