            return {"ok": False, "messages": [], "error": "permission denied"}
        messages = _list_messages(thread_id)
        return {"ok": True, "messages": messages, "error": None}


    def _compute_cost_usd(
        model: str, input_tokens: int, output_tokens: int,
        cache_w: int = 0, cache_r: int = 0,
    ) -> float:
        """モデル別 pricing で cost_usd を計算 (kernel の /core/claude/text と同じリート)。
        Sonnet: input $3/M, cache_w $3.75/M, cache_r $0.30/M, output $15/M
        Opus:   input $15/M, cache_w $18.75/M, cache_r $1.50/M, output $75/M
        Haiku:  input $1/M, cache_w $1.25/M, cache_r $0.10/M, output $5/M
        """
        m = (model or "").lower()
        # Claude 以外 (gemma / mistral / llama など Ollama 全般) はローカル無料
        if _is_ollama_model(model):
            return 0.0
        if "opus" in m:
            p_in, p_cw, p_cr, p_out = 15.0, 18.75, 1.50, 75.0
        elif "haiku" in m:
            p_in, p_cw, p_cr, p_out = 1.0, 1.25, 0.10, 5.0
        else:
            p_in, p_cw, p_cr, p_out = 3.0, 3.75, 0.30, 15.0
        return (
            (input_tokens * p_in / 1_000_000)
            + (cache_w * p_cw / 1_000_000)
            + (cache_r * p_cr / 1_000_000)
            + (output_tokens * p_out / 1_000_000)
        )


    def _save_message(
        thread_id: str, owner: str, order: int, role: str, content: str,
        model: Optional[str] = None,
        input_tokens: int = 0, output_tokens: int = 0,
        cache_w_tokens: int = 0, cache_r_tokens: int = 0,
        cost_usd: float = 0.0,
        injected_topics: Optional[List[dict]] = None,
        tool_calls: Optional[List[dict]] = None,
    ) -> str:
        message_id = f"msg_{uuid.uuid4().hex[:16]}"
        doc = {
            "message_id": message_id,
            "thread_id": thread_id,
            "owner": owner,
            "order": int(order),
            "role": role,
            "content": content,
            "model": model or "",
            "input_tokens": int(input_tokens or 0),
            "output_tokens": int(output_tokens or 0),
            "cache_w_tokens": int(cache_w_tokens or 0),
            "cache_r_tokens": int(cache_r_tokens or 0),
            "cost_usd": float(cost_usd or 0.0),
            "created_at": _now_iso(),
            "injected_topics": injected_topics or [],
            "tool_calls": tool_calls or [],
        }
        _os_put(f"/{CHAT_MESSAGES_INDEX}/_doc/{message_id}", doc)
        return message_id


    def _messages_with_cache_control(msgs: List[dict]) -> List[dict]:
        """messages array のコピーを返す。 最後のメッセージの最後の
        コンテンツブロックに cache_control ephemeral を付ける。

        これで [system + tools + このメッセージまで] がキャッシュ対象になり、
        次の iteration (同じツールループ内) で cache_r として安価に再利用される。
        30+ iteration ある場合の fresh input を大幅削減できる。

        注意: 4 マーカー上限に対して system + tools + ここ = 3 マーカーを使う。
        メッセージ内の日本語トークン周りの cache write は 1.25x コストだが、
        次 iteration 以降の cache read は 0.1x で十分にペイする。
        """
        if not msgs:
            return msgs
        result = list(msgs[:-1])
        last = msgs[-1]
        last_content = last.get("content")
        role = last.get("role", "user")
        if isinstance(last_content, str):
            # 文字列 → text ブロックリストに包んで cache_control を付ける
            new_last = {
                "role": role,
                "content": [{
                    "type": "text",
                    "text": last_content,
                    "cache_control": {"type": "ephemeral"},
                }],
            }
        elif isinstance(last_content, list) and last_content:
            # ブロックリスト → 最後のブロックに cache_control を付ける
            new_content = list(last_content)
            new_content[-1] = {
                **new_content[-1],
                "cache_control": {"type": "ephemeral"},
            }
            new_last = {
                "role": role,
                "content": new_content,
            }
        else:
            # 空 or 不後入な型 → 修正せず元のまま返す
            return msgs
        result.append(new_last)
        return result


    def _jev_choose_model(content: str) -> Tuple[str, Dict[str, Any]]:
        """Turn 頭で Jev に使用モデルを choice で選ばせる。

        失敗時 (キー未登録、 Jev 側エラー、 予想外の回答値 等) は
        DEFAULT_MODEL にフォールバックし、 エラー内容をレスポンスに含めて返す。

        Returns:
            (chosen_model, jev_response) — chosen_model は CHAT_JEV_ROUTE_MODELS の
            どれか (失敗時は DEFAULT_MODEL)。 jev_response は Jev の生応答
            または {"error": "..."}。
        """
        try:
            from main import call_jev
            result = call_jev(
                state=content,
                questions={
                    "model": {
                        "type": "choice",
                        "instructions": (
                            "この質問に応えるのに一番向いているモデルはどれか。 "
                            "Haiku は簡単な調べもの・要約・軽い返答向け、 "
                            "Sonnet はコード・分析・計画・普通の対話全般、 "
                            "Opus は難しい推論・大きな設計判断・深い議論向け。"
                        ),
                        "criteria": {
                            "claude-haiku-4-5": "軽量・高速、 事実的な回答や軽い確認向け",
                            "claude-sonnet-4-6": "既定、 バランス重視、 コード修正や分析や普通の対話全般",
                            "claude-opus-4-7": "重量・高度な推論、 難しい設計判断・深い議論向け",
                        },
                    },
                },
                timeout=10,
            )
        except Exception as e:
            logger.warning(f"[CHAT/JEV_ROUTE] Jev call failed, using default: {e}")
            return DEFAULT_MODEL, {"error": str(e)}

        chosen = (result.get("answers") or {}).get("model", {}).get("choice")
        if chosen not in CHAT_JEV_ROUTE_MODELS:
            logger.warning(
                f"[CHAT/JEV_ROUTE] Jev returned unexpected choice {chosen!r}, "
                f"using default"
            )
            return DEFAULT_MODEL, result
        return chosen, result


    def _prepare_send(request: dict) -> Tuple[Optional[dict], Optional[str]]:
        _ensure_indices()
        owner = _get_owner(request)
        thread_id = (request or {}).get("thread_id") or ""
        content = (request or {}).get("content") or ""
        model = (request or {}).get("model") or DEFAULT_MODEL
        auto_route = bool((request or {}).get("auto_route"))
        jev_route_info: Optional[Dict[str, Any]] = None
        # jev-gemma2 モデルは Jev+gemma2 経路専用で auto_route (Claude 内選択) の対象外
        if auto_route and model != CHAT_JEV_GEMMA2_MODEL_ID:
            routed_model, jev_route_info = _jev_choose_model(content)
            answers = (jev_route_info.get("answers") or {}).get("model") or {}
            confidence = answers.get("confidence")
            usage = jev_route_info.get("usage") or {}
            logger.info(
                f"[CHAT/JEV_ROUTE] thread={thread_id} "
                f"original_model={model} jev_choice={routed_model} "
                f"confidence={confidence} "
                f"jev_input_tokens={usage.get('input_tokens')}"
            )
            model = routed_model
        enable_injection = (request or {}).get("enable_injection")
        if enable_injection is None:
            enable_injection = True
        if not thread_id:
            return None, "thread_id is required"
        if not content.strip():
            return None, "content is required"
        g = _os_get(f"/{CHAT_THREADS_INDEX}/_doc/{thread_id}")
        if "_error" in g or not g.get("found"):
            return None, "thread not found"
        tdoc = g.get("_source") or {}
        if tdoc.get("owner") != owner:
            return None, "permission denied"
        prior = _list_messages(thread_id, size=1000)
        next_order = (int(prior[-1]["order"]) + 1) if prior else 0
        user_msg_id = _save_message(
            thread_id, owner, next_order, "user", content
        )
        window_size = max(SLIDING_WINDOW_SIZE - 1, 0)
        window = prior[-window_size:] if window_size > 0 else []
        api_messages: List[Dict[str, str]] = []
        for m in window:
            r_ = m.get("role")
            c_ = m.get("content") or ""
            if r_ in ("user", "assistant") and c_:
                api_messages.append({"role": r_, "content": c_})
        api_messages.append({"role": "user", "content": content})
        if enable_injection:
            system_prompt, injected_topics_meta = _build_system_prompt(content, owner)
        else:
            system_prompt = ""
            injected_topics_meta = []
        return ({
            "owner": owner,
            "thread_id": thread_id,
            "content": content,
            "model": model,
            "prior": prior,
            "next_order": next_order,
            "user_msg_id": user_msg_id,
            "api_messages": api_messages,
            "system_prompt": system_prompt,
            "injected_topics_meta": injected_topics_meta,
        }, None)


    def _finalize_send(
        ctx: dict, assistant_text: str,
        input_tokens: int, output_tokens: int,
        cache_w_tokens: int = 0, cache_r_tokens: int = 0,
        tool_calls: Optional[List[dict]] = None,
    ) -> Tuple[str, float]:
        cost_usd = _compute_cost_usd(
            ctx["model"], input_tokens, output_tokens,
            cache_w=cache_w_tokens, cache_r=cache_r_tokens,
        )
        ass_order = ctx["next_order"] + 1
        ass_msg_id = _save_message(
            ctx["thread_id"], ctx["owner"], ass_order, "assistant",
            assistant_text,
            model=ctx["model"],
            input_tokens=input_tokens,
            output_tokens=output_tokens,
            cache_w_tokens=cache_w_tokens,
            cache_r_tokens=cache_r_tokens,
            cost_usd=cost_usd,
            injected_topics=ctx["injected_topics_meta"],
            tool_calls=tool_calls or [],
        )
        now = _now_iso()
        new_count = len(ctx["prior"]) + 2
        _os_post(
            f"/{CHAT_THREADS_INDEX}/_update/{ctx['thread_id']}?refresh=true",
            {"doc": {
                "last_message_at": now,
                "updated_at": now,
                "message_count": new_count,
                "model": ctx["model"],
            }},
        )
        return ass_msg_id, cost_usd


    # ============================================================
    # Step E-2: Jev + gemma2 (R2D2 + C3PO) の思考ループ
    # Jev = 推論役 (次の行動と応答方針を choice で判定)
    # gemma2 = 発話役 (ツール引数の JSON と最終応答の日本語を生成)
    # Claude の tool loop と同じ形で「推論 → ツール実行 → 応答」を
    # 繰り返す。 露出するツールは MCP hub の list_tools で得た全ツール。
    # ============================================================
    JEV_GEMMA2_MAX_ITERATIONS = 6
    JEV_GEMMA2_TOOL_DESC_MAX_CHARS = 140  # Jev に渡す description の長さ上限

    def _stream_via_jev_gemma2(ctx: dict, _emit):
        """Jev + gemma2 の思考ループ。 stream_gen から yield from で使う。

        Args:
            ctx: _prepare_send が返した実行コンテキスト
            _emit: SSE 1 イベントを bytes 化する関数
        """
        content = ctx.get("content") or ""
        thread_id = ctx.get("thread_id")
        owner = ctx.get("owner")

        # 共有リソースを lazy import
        try:
            from main import (
                call_jev,
                SimpleMCPClient,
                MCP_SERVER_URL,
                MCP_API_KEY,
                MCP_CONNECT_TIMEOUT,
                VLLM_URL,
                LLM_TIMEOUT,
            )
        except Exception as e:
            yield _emit({
                "type": "error",
                "error": f"[JEV_ERROR] import failed: {type(e).__name__}: {e}",
            })
            return

        if not MCP_API_KEY or not MCP_SERVER_URL:
            yield _emit({
                "type": "error",
                "error": "[JEV_ERROR] MCP not configured",
            })
            return

        # MCP client 接続と 全ツールのスキーマ取得
        # (SimpleMCPClient は context manager。 __enter__ で接続を張り、
        # __exit__ で切断する。 tool loop 中も使うので手動で開閉する)
        _mcp_cm = None
        try:
            _mcp_cm = SimpleMCPClient(
                MCP_SERVER_URL, MCP_API_KEY, timeout=MCP_CONNECT_TIMEOUT,
            )
            mcp_client = _mcp_cm.__enter__()
            all_tools = mcp_client.list_tools()
            # 全ツールを露出 (list_tools の結果をそのまま使う)
            tool_map = {
                t["name"]: t
                for t in all_tools
                if t.get("name")
            }
            # Jev に渡す tool_name の choice criteria を動的生成
            # (description は先頭 N 文字に切り詰めて Jev の input を押さえる)
            tool_choice_criteria = {
                name: (
                    (t.get("description") or "説明なし").strip().split("\n")[0][:JEV_GEMMA2_TOOL_DESC_MAX_CHARS]
                    or "説明なし"
                )
                for name, t in tool_map.items()
            }
            logger.info(
                f"[CHAT/JEV_GEMMA2] MCP tools exposed count={len(tool_map)} "
                f"thread={thread_id} owner={owner!r}"
            )
        except Exception as e:
            logger.error(
                f"[CHAT/JEV_GEMMA2] MCP connect failed "
                f"thread={thread_id} owner={owner!r}: "
                f"{type(e).__name__}: {e}",
                exc_info=True,
            )
            if _mcp_cm is not None:
                try:
                    _mcp_cm.__exit__(None, None, None)
                except Exception:
                    pass
            yield _emit({
                "type": "error",
                "error": f"[JEV_ERROR] MCP connect failed: {type(e).__name__}: {e}",
            })
            return

        # 思考履歴 (Jev/gemma2 の state に注入する文字列)
        thought_history: List[str] = []
        accumulated_tool_calls: List[Dict[str, Any]] = []
        _prev_tool_calls: List[str] = []  # "tool_name:args_json" の履歴 (重複検知用)
        total_jev_in_tokens = 0
        total_gemma_in_tokens = 0
        total_gemma_out_tokens = 0

        next_action_criteria = {
            "call_tool": "情報取得・現状確認・検索・履歴参照のためツールを呼ぶ (一覧・状態・調査・確認の依頼はこれ)",
            "respond_directly": "既にツール結果が揃っている、 または一般知識で即答できる",
            "ask_user": "発話が曖昧すぎて、 ツールに渡す引数も推定できない",
            "decline": "実行不能・拒否すべき (システム操作の実行手段が無い場合を含む)",
        }

        final_iteration = 0
        loop_completed_naturally = False
        for iteration in range(JEV_GEMMA2_MAX_ITERATIONS):
            final_iteration = iteration
            state_lines = [f"ユーザーの発話: {content}"]
            if thought_history:
                state_lines.append("")
                # 重複ツール呼び出し抑止: 思考履歴に「同じツールを繰り返し呼ぶな」を注入
                if len(_prev_tool_calls) >= 2:
                    state_lines.append(
                        "【重要】 既にツールを複数回呼んでいる。 "
                        "同じツールを同じ引数で再び呼ぶことは禁止。 "
                        "既に得た情報で回答できるなら respond_directly を選べ。"
                    )
                state_lines.append("【これまでの推論・調査】")
                state_lines.extend(thought_history)
            state = "\n".join(state_lines)

            # ---- 1. Jev に「次の行動」と「使うツール」を同時に判定させる ----
            try:
                loop_result = call_jev(
                    state=state,
                    questions={
                        "next_action": {
                            "type": "choice",
                            "criteria": next_action_criteria,
                            "instructions": (
                                "現在の状況で次に何をすべきかを選べ。 "
                                "重要: 自分は MCP tool 経由でシステムから "
                                "情報を取得する能力を持っている。 "
                                "ユーザーが情報・現状・一覧・履歴・検索結果を "
                                "求めている場合は迷わず call_tool を選べ "
                                "(「〜を教えて」「〜の一覧」「〜の状態」"
                                "「〜を確認」「〜を調べて」等)。 "
                                "自分が持つ MCP tool は下の tool_name の "
                                "criteria に列挙されている。 "
                                "ただし システム操作 (Pod 再起動、 "
                                "ファイル書き込み等) の実行手段は無いので decline。 "
                                "既にツール結果が思考履歴に揃っているなら "
                                "respond_directly。"
                            ),
                        },
                        "tool_name": {
                            "type": "choice",
                            "criteria": tool_choice_criteria,
                            "instructions": (
                                "next_action=call_tool を選ぶなら "
                                "criteria の description を見てユーザーの発話に最も合う tool を 1 つ選べ。 "
                                "例: Pod 一覧なら k8s_list_pods、 ログなら k8s_get_logs、 "
                                "topic 詳細なら system_lookup、 過去の会話なら conversation_search、 "
                                "Web ページなら web_fetch、 GitHub コードなら github_get_file / github_grep_file、 "
                                "契約書なら contract_* 系、 "
                                "メール / GitHub アカウント / 要望管理などは 同名接頭の tool 群を探せ。 "
                                "next_action がそれ以外の場合も 1 つ選ぶが無視される。"
                            ),
                        },
                    },
                    timeout=15,
                )
            except Exception as e:
                logger.error(
                    f"[CHAT/JEV_GEMMA2] Jev loop iter={iteration} failed: "
                    f"{type(e).__name__}: {e}",
                    exc_info=True,
                )
                yield _emit({
                    "type": "error",
                    "error": f"[JEV_ERROR] iter={iteration}: {type(e).__name__}: {str(e)[:200]}",
                })
                return

            loop_answers = loop_result.get("answers") or {}
            next_action = (loop_answers.get("next_action") or {}).get("choice") or "respond_directly"
            tool_name = (loop_answers.get("tool_name") or {}).get("choice")
            loop_usage = loop_result.get("usage") or {}
            total_jev_in_tokens += loop_usage.get("input_tokens") or 0

            logger.info(
                f"[CHAT/JEV_GEMMA2] iter={iteration} "
                f"next_action={next_action} tool_name={tool_name} "
                f"thread={thread_id} owner={owner!r}"
            )

            if next_action != "call_tool":
                loop_completed_naturally = True
                break

            if not tool_name or tool_name not in tool_map:
                thought_history.append(
                    f"[思考] ツール選択が不正 ({tool_name!r})。 直接応答に切替。"
                )
                loop_completed_naturally = True
                break

            # ---- 2. gemma2 にツール引数を JSON で生成させる ----
            tool_def = tool_map[tool_name]
            tool_schema = tool_def.get("input_schema") or tool_def.get("inputSchema") or {}

            args_system = (
                "あなたはツール呼び出しの引数を JSON で生成する専門役です。\n"
                f"ツール名: {tool_name}\n"
                "入力スキーマ:\n"
                f"{json.dumps(tool_schema, ensure_ascii=False, indent=2)}\n"
                "\n"
                "制約:\n"
                "- JSON オブジェクトのみを出力する (フェンスや説明文は不要)\n"
                "- スキーマの required フィールドは必ず含める\n"
                "- 分からない値は最小限の推測で埋める\n"
                "- 応答は 1 つの JSON オブジェクトのみ\n"
            )

            args_payload = {
                "model": CHAT_JEV_GEMMA2_UNDERLYING,
                "messages": [
                    {"role": "system", "content": args_system},
                    {"role": "user", "content": state},
                ],
                "temperature": 0.3,
                "max_tokens": 1024,
                "stream": False,
            }

            try:
                resp = requests.post(
                    f"{VLLM_URL}/v1/chat/completions",
                    json=args_payload,
                    timeout=LLM_TIMEOUT,
                )
                resp.raise_for_status()
                args_data = resp.json()
                args_msg = ((args_data.get("choices") or [{}])[0].get("message") or {})
                args_text = args_msg.get("content") or ""
                args_usage = args_data.get("usage") or {}
                total_gemma_in_tokens += args_usage.get("prompt_tokens") or 0
                total_gemma_out_tokens += args_usage.get("completion_tokens") or 0
            except Exception as e:
                logger.error(
                    f"[CHAT/JEV_GEMMA2] gemma2 args gen failed for {tool_name}: "
                    f"{type(e).__name__}: {e}",
                    exc_info=True,
                )
                thought_history.append(
                    f"[思考] {tool_name} の引数生成中に gemma2 が失敗 "
                    f"({type(e).__name__})。 直接応答に切替。"
                )
                loop_completed_naturally = True
                break

            tool_args: Dict[str, Any] = {}
            args_json_text: Optional[str] = None
            fence_match = re.search(
                r"```(?:json)?\s*\n?(\{.*?\})\s*\n?```",
                args_text, re.DOTALL,
            )
            if fence_match:
                args_json_text = fence_match.group(1).strip()
            else:
                brace_start = args_text.find("{")
                if brace_start >= 0:
                    depth = 0
                    for idx in range(brace_start, len(args_text)):
                        if args_text[idx] == "{":
                            depth += 1
                        elif args_text[idx] == "}":
                            depth -= 1
                            if depth == 0:
                                args_json_text = args_text[brace_start:idx+1]
                                break

            try:
                tool_args = json.loads((args_json_text or "{}").strip())
                if not isinstance(tool_args, dict):
                    tool_args = {}
            except Exception as e:
                thought_history.append(
                    f"[思考] {tool_name} の引数 JSON 解析に失敗 "
                    f"({type(e).__name__}): {args_text[:200]}"
                )
                loop_completed_naturally = True
                break

            # ---- 3. 重複ツール呼び出し検知 ----
            call_key = f"{tool_name}:{json.dumps(tool_args, sort_keys=True)}"
            dup_count = _prev_tool_calls.count(call_key)
            _prev_tool_calls.append(call_key)
            if dup_count >= 1:
                thought_history.append(
                    f"[思考] {tool_name} を同じ引数で既に呼んだ。 "
                    "同じ結果しか返らないので、 手持ちの情報で応答する。"
                )
                logger.info(
                    f"[CHAT/JEV_GEMMA2] duplicate tool call detected "
                    f"iter={iteration} tool={tool_name} "
                    f"thread={thread_id} owner={owner!r}"
                )
                loop_completed_naturally = True
                break

            # ---- 4. ツール実行 ----
            yield _emit({
                "type": "tool_use",
                "tool_name": tool_name,
                "tool_input": tool_args,
            })

            try:
                tool_output = mcp_client.call_tool(
                    tool_name, tool_args,
                )
                if isinstance(tool_output, dict):
                    blocks = tool_output.get("content") or []
                    output_text = "\n\n".join(
                        b.get("text", "")
                        for b in blocks
                        if isinstance(b, dict) and b.get("type") == "text"
                    ) or str(tool_output)
                else:
                    output_text = str(tool_output)

                original_len = len(output_text)
                if original_len > MCP_TOOL_RESULT_MAX_CHARS:
                    output_text = (
                        output_text[:MCP_TOOL_RESULT_MAX_CHARS]
                        + f"\n\n[結果を {original_len} → {MCP_TOOL_RESULT_MAX_CHARS} 文字に切詰]"
                    )

                yield _emit({
                    "type": "tool_result",
                    "content": output_text,
                })

                accumulated_tool_calls.append({
                    "tool_name": tool_name,
                    "tool_input": tool_args,
                    "result_brief": output_text[:TOOL_RESULT_BRIEF_CHAR_LIMIT],
                })

                thought_history.append(
                    f"[ツール呼出 iter={iteration}] {tool_name}"
                    f"({json.dumps(tool_args, ensure_ascii=False)})"
                )
                thought_history.append(f"[結果]\n{output_text}")
            except Exception as e:
                logger.error(
                    f"[CHAT/JEV_GEMMA2] tool {tool_name} failed: "
                    f"{type(e).__name__}: {e}",
                    exc_info=True,
                )
                error_text = f"エラー: {type(e).__name__}: {str(e)[:200]}"
                yield _emit({
                    "type": "tool_result",
                    "content": error_text,
                })
                thought_history.append(
                    f"[ツール失敗 iter={iteration}] {tool_name}: {error_text}"
                )
            # 次の iteration へ

        if not loop_completed_naturally:
            thought_history.append(
                f"[思考] {JEV_GEMMA2_MAX_ITERATIONS} 回の推論上限に達したので、 "
                "現時点の情報で応答する。"
            )

        # ---- 4. 最終応答: Jev が 5 項目を判定 → gemma2 が生成 ----
        final_state_lines = [f"ユーザーの発話: {content}"]
        if thought_history:
            final_state_lines.append("")
            final_state_lines.append("【推論・調査の記録】")
            final_state_lines.extend(thought_history)
        final_state = "\n".join(final_state_lines)

        final_questions = {
            "intent": {
                "type": "choice",
                "criteria": {
                    "answer_question": "質問に答える",
                    "respond_to_request": "依頼に応じる (自分に可能な範囲で)",
                    "confirm_info": "情報を確認する",
                    "casual_chat": "雑談として応じる",
                    "decline": "断る・拒否する (実行手段が無い場合を含む)",
                },
                "instructions": (
                    "このターンで果たすべき役割を選べ。 "
                    "自分にはシステム操作の実行手段が無いので、 "
                    "そういう依頼を受けた場合は decline。"
                ),
            },
            "stance": {
                "type": "choice",
                "criteria": {
                    "affirmative": "肯定・同意",
                    "negative": "否定・反対",
                    "neutral": "中立",
                    "hold": "保留・様子見",
                    "correct": "訂正・指摘",
                },
                "instructions": "応答の立場を選べ。",
            },
            "tone": {
                "type": "choice",
                "criteria": {
                    "polite": "丁寧・敬語",
                    "neutral": "です・ます調",
                    "casual": "砕けたカジュアル",
                },
                "instructions": "ユーザーの文体に合わせるトーンを選べ。",
            },
            "certainty": {
                "type": "choice",
                "criteria": {
                    "certain": "断定できる",
                    "highly_likely": "ほぼ確実",
                    "unsure": "半々",
                    "doubtful": "自信なし",
                    "unknown": "わからない",
                },
                "instructions": "回答内容への確信度を選べ。",
            },
            "length": {
                "type": "choice",
                "criteria": {
                    "one_sentence": "一文",
                    "short": "2-3 文",
                    "medium": "段落 1 つ (3-5 文)",
                    "long": "段落複数 (6-10 文)",
                },
                "instructions": "返答の適切な長さを選べ。",
            },
        }

        try:
            final_result = call_jev(
                state=final_state,
                questions=final_questions,
                timeout=15,
            )
        except Exception as e:
            logger.error(
                f"[CHAT/JEV_GEMMA2] Jev final judgment failed: "
                f"{type(e).__name__}: {e}",
                exc_info=True,
            )
            yield _emit({
                "type": "error",
                "error": f"[JEV_ERROR] final: {type(e).__name__}: {str(e)[:200]}",
            })
            return

        final_answers = final_result.get("answers") or {}
        intent = (final_answers.get("intent") or {}).get("choice", "")
        stance = (final_answers.get("stance") or {}).get("choice", "")
        tone = (final_answers.get("tone") or {}).get("choice", "")
        certainty = (final_answers.get("certainty") or {}).get("choice", "")
        length = (final_answers.get("length") or {}).get("choice", "")
        final_jev_usage = final_result.get("usage") or {}
        total_jev_in_tokens += final_jev_usage.get("input_tokens") or 0

        logger.info(
            f"[CHAT/JEV_GEMMA2] final judgment thread={thread_id} owner={owner!r} "
            f"intent={intent} stance={stance} tone={tone} "
            f"certainty={certainty} length={length} "
            f"iterations={final_iteration+1} "
            f"tool_calls={len(accumulated_tool_calls)} "
            f"jev_input_tokens={total_jev_in_tokens}"
        )

        intent_desc_map = {
            "answer_question": "ユーザーの質問に答える",
            "respond_to_request": "ユーザーの依頼に自分にできる範囲で応じる",
            "confirm_info": "情報を確認する",
            "casual_chat": "雑談として応じる",
            "decline": "断る・拒否する (実行手段が無いことを伝える)",
        }
        stance_desc_map = {
            "affirmative": "肯定的な立場で",
            "negative": "否定的な立場で",
            "neutral": "中立の立場で",
            "hold": "保留・様子見の姿勢で",
            "correct": "訂正・指摘する立場で",
        }
        tone_desc_map = {
            "polite": "丁寧・敬語で",
            "neutral": "です・ます調で",
            "casual": "砕けたカジュアルな口調で",
        }
        certainty_desc_map = {
            "certain": "断定的に",
            "highly_likely": "ほぼ確実として",
            "unsure": "半々の確信で",
            "doubtful": "自信のない表現で",
            "unknown": "わからない旨を含めて",
        }
        length_desc_map = {
            "one_sentence": "一文で",
            "short": "2-3 文で",
            "medium": "段落 1 つ (3-5 文) で",
            "long": "段落複数 (6-10 文) で",
        }

        intent_desc = intent_desc_map.get(intent, "応答する")
        stance_desc = stance_desc_map.get(stance, "中立の立場で")
        tone_desc = tone_desc_map.get(tone, "です・ます調で")
        certainty_desc = certainty_desc_map.get(certainty, "適度な確信度で")
        length_desc = length_desc_map.get(length, "2-3 文で")

        tool_context = ""
        if thought_history:
            tool_context = (
                "\n【これまでの調査結果 (参考にしてよいが事実確認済みの範囲だけを使う)】\n"
                + "\n".join(thought_history)
                + "\n"
            )

        system_prompt = (
            "あなたは判断結果を日本語の文章に整える整形役です。\n"
            "以下の指示に厳密に従い、 応答本文のみを出力してください。\n"
            "\n"
            "【指示】\n"
            f"- {stance_desc}、 {intent_desc}\n"
            f"- {tone_desc}、 {length_desc}回答する\n"
            f"- {certainty_desc}表現する\n"
            "\n"
            "【制約】\n"
            "- 指示にない事実、 意見、 推測を追加しない\n"
            "- 前置きや説明、 注釈を付けない\n"
            "- 質問し返さない\n"
            "- あなた自身にはシステム操作 (Pod 再起動、 ファイル書込等) "
            "を実行する手段はない。 実行できない依頼には応じられない旨を伝える\n"
            "- 応答本文のみを出力する\n"
            f"{tool_context}"
        )

        final_payload = {
            "model": CHAT_JEV_GEMMA2_UNDERLYING,
            "messages": [
                {"role": "system", "content": system_prompt},
                {"role": "user", "content": content},
            ],
            "temperature": 0.5,
            "max_tokens": MAX_OUTPUT_TOKENS,
            "stream": False,
        }

        try:
            resp = requests.post(
                f"{VLLM_URL}/v1/chat/completions",
                json=final_payload,
                timeout=LLM_TIMEOUT,
            )
        except Exception as e:
            logger.error(
                f"[CHAT/JEV_GEMMA2] gemma2 final request error: "
                f"{type(e).__name__}: {e}",
                exc_info=True,
            )
            yield _emit({
                "type": "error",
                "error": f"[GEMMA2_ERROR] {type(e).__name__}: {str(e)[:200]}",
            })
            return

        if resp.status_code != 200:
            yield _emit({
                "type": "error",
                "error": (
                    f"[GEMMA2_ERROR] status={resp.status_code} "
                    f"{resp.text[:200]}"
                ),
            })
            return

        try:
            data = resp.json()
        except Exception as e:
            yield _emit({
                "type": "error",
                "error": f"[GEMMA2_ERROR] JSON decode: {type(e).__name__}: {e}",
            })
            return

        choice_data = (data.get("choices") or [{}])[0]
        message = choice_data.get("message", {}) or {}
        text = (message.get("content") or "").strip()
        finish_reason = choice_data.get("finish_reason") or "stop"
        final_usage_data = data.get("usage") or {}
        total_gemma_in_tokens += final_usage_data.get("prompt_tokens") or 0
        total_gemma_out_tokens += final_usage_data.get("completion_tokens") or 0

        if text:
            yield _emit({"type": "delta", "text": text})

        ass_msg_id, cost_usd = _finalize_send(
            ctx, text,
            total_gemma_in_tokens, total_gemma_out_tokens,
            tool_calls=accumulated_tool_calls,
        )
        logger.info(
            f"[CHAT/JEV_GEMMA2] stream OK thread={thread_id} owner={owner!r} "
            f"iterations={final_iteration+1} "
            f"tool_calls={len(accumulated_tool_calls)} "
            f"gemma_in={total_gemma_in_tokens} gemma_out={total_gemma_out_tokens} "
            f"jev_in={total_jev_in_tokens} cost=${cost_usd:.6f} "
            f"finish_reason={finish_reason}"
        )
        yield _emit({
            "type": "done",
            "assistant_message_id": ass_msg_id,
            "input_tokens": total_gemma_in_tokens,
            "output_tokens": total_gemma_out_tokens,
            "cache_w_tokens": 0,
            "cache_r_tokens": 0,
            "cost_usd": round(cost_usd, 6),
            "stop_reason": finish_reason,
            "tool_calls_count": len(accumulated_tool_calls),
        })

        # MCP client の context manager をクローズ
        if _mcp_cm is not None:
            try:
                _mcp_cm.__exit__(None, None, None)
            except Exception:
                pass


    # ============================================================
    # gemma2 (Ollama) 向け MCP tool loop
    # OpenAI 互換の /v1/chat/completions を叩き、 Claude 版と同じ SSE
    # イベント形式で出力する。 stream=False で 1 iteration の応答を丸ごと
    # 受け取り、 content を 1 つの delta として emit、 tool_calls があれば
    # 実行して loop する簡易実装。 gemma2:9b はローカル無料なのでトークン
    # 単価は問わないが、 累積 3M トークンでループ暴走を止める。
    # ============================================================
    def _run_mcp_loop_ollama(ctx: dict, _emit):
        """gemma2 (Ollama) 経路の MCP tool loop。 stream_gen から yield from で使う。

        Args:
            ctx: _prepare_send が返した実行コンテキスト
            _emit: SSE 1 イベントを bytes 化する関数 (_emit(dict) -> bytes)

        Yields:
            SSE イベントの bytes (Claude 版と同じ形式)
        """
        # kernel 本体の共有リソースを lazy import
        try:
            from main import (
                SimpleMCPClient,
                MCP_SERVER_URL,
                MCP_API_KEY,
                MCP_CONNECT_TIMEOUT,
                VLLM_URL,
                LLM_TIMEOUT,
            )
        except Exception as e:
            yield _emit({
                "type": "error",
                "error": f"main import failed: {type(e).__name__}: {e}",
            })
            return

        if not MCP_API_KEY or not MCP_SERVER_URL:
            yield _emit({
                "type": "error",
                "error": "MCP config missing (MCP_API_KEY/MCP_SERVER_URL not set)",
            })
            return

        accumulated_text_parts: List[str] = []
        accumulated_tool_calls: List[dict] = []
        total_in_tokens = 0
        total_out_tokens = 0
        stop_reason: Optional[str] = None

        try:
            with SimpleMCPClient(
                MCP_SERVER_URL, MCP_API_KEY, timeout=MCP_CONNECT_TIMEOUT,
            ) as mcp_client:
                try:
                    all_tools = mcp_client.list_tools()
                except Exception as e:
                    yield _emit({
                        "type": "error",
                        "error": f"MCP list_tools failed: {type(e).__name__}: {e}",
                    })
                    return

                # 許可リストで絞ってから OpenAI 互換のツールスキーマに変換
                tools_for_ollama = []
                exposed_mcp_count = 0
                for t in all_tools:
                    if t["name"] not in OLLAMA_ALLOWED_TOOL_NAMES:
                        continue
                    tools_for_ollama.append({
                        "type": "function",
                        "function": {
                            "name": t["name"],
                            "description": t.get("description", ""),
                            "parameters": t.get(
                                "inputSchema",
                                {"type": "object", "properties": {}},
                            ),
                        },
                    })
                    exposed_mcp_count += 1
                # 対話専用ツールは全て露出 (件数少)
                for chat_t in CHAT_SCOPED_TOOL_SCHEMAS:
                    tools_for_ollama.append({
                        "type": "function",
                        "function": {
                            "name": chat_t["name"],
                            "description": chat_t["description"],
                            "parameters": chat_t["input_schema"],
                        },
                    })

                logger.info(
                    f"[CHAT/ollama] MCP exposed {exposed_mcp_count} MCP tools "
                    f"(from {len(all_tools)} available) + "
                    f"{len(CHAT_SCOPED_TOOL_SCHEMAS)} chat-scoped tools "
                    f"thread={ctx['thread_id']} model={ctx['model']}"
                )

                # messages を OpenAI 形式に整える (ctx["api_messages"] は既に
                # [{role, content: str}] 形式)。 先頭に system prompt を挟む。
                # gemma2:9b は tools 非対応のため、 system prompt に手動で
                # tools 一覧と JSON 呼び出しフォーマットを埋め込む。
                # 引数は JSON schema ではなく関数シグネチャ形式でコンパクトに
                # (name: type、 optional は ? マーク) 表現。
                tools_desc_parts = []
                for tf in tools_for_ollama:
                    fn = tf["function"]
                    params = fn.get("parameters", {}) or {}
                    props = params.get("properties", {}) or {}
                    required = params.get("required", []) or []
                    arg_parts = []
                    for arg_name, arg_schema in props.items():
                        if isinstance(arg_schema, dict):
                            arg_type = arg_schema.get("type", "any")
                        else:
                            arg_type = "any"
                        req_mark = "" if arg_name in required else "?"
                        arg_parts.append(f"{arg_name}{req_mark}: {arg_type}")
                    arg_signature = ", ".join(arg_parts)
                    desc = (fn.get("description") or "")[:100]
                    tools_desc_parts.append(
                        f"- {fn['name']}({arg_signature}): {desc}"
                    )
                tools_desc_text = "\n".join(tools_desc_parts)
                gemma_tools_instruction = (
                    "\n\n利用可能なツール一覧:\n"
                    + tools_desc_text
                    + "\n\n"
                    + "重要: ツールを呼びたい場合は、 以下のフォーマットの JSON を "
                    + "あなた自身が直接生成してください。 コードフェンス "
                    + "(バッククォート 3 つ)、 説明文、 ユーザーへの指示、 その他のテキストは絶対に含めないでください。\n\n"
                    + "悪い例 (これは間違い):\n"
                    + "```json\n"
                    + '{"tool": "system_brief", "arguments": {}}\n'
                    + "```\n"
                    + "と入力してください。\n\n"
                    + "良い例 (これが正しい):\n"
                    + '{"tool": "system_brief", "arguments": {}}\n\n'
                    + "ツールを呼ぶ必要がない場合は、 通常の自然文で回答してください "
                    + "(JSON は書かないでください)。"
                )
                base_system = ctx["system_prompt"] or ""
                combined_system = base_system + gemma_tools_instruction
                msgs: List[Dict[str, Any]] = list(ctx["api_messages"])
                msgs = (
                    [{"role": "system", "content": combined_system}]
                    + msgs
                )

                for iteration in range(OLLAMA_MAX_TOOL_ITERATIONS):
                    payload: Dict[str, Any] = {
                        "model": ctx["model"],
                        "messages": msgs,
                        "temperature": 0.5,
                        "max_tokens": MAX_OUTPUT_TOKENS,
                        "stream": False,
                    }
                    # gemma2:9b は tools 非対応のため tools フィールドは付けない
                    # (system prompt に埋め込み済み)

                    try:
                        # requests.post は kernel 側で monkey patch されており
                        # gemma_usage index に自動記録される
                        resp = requests.post(
                            f"{VLLM_URL}/v1/chat/completions",
                            json=payload,
                            timeout=LLM_TIMEOUT,
                        )
                    except Exception as e:
                        logger.error(
                            f"[CHAT/ollama] request error iter={iteration}: "
                            f"{type(e).__name__}: {e}",
                            exc_info=True,
                        )
                        yield _emit({
                            "type": "error",
                            "error": f"{type(e).__name__}: {str(e)[:200]}",
                        })
                        return

                    if resp.status_code != 200:
                        yield _emit({
                            "type": "error",
                            "error": (
                                f"ollama call failed: {resp.status_code} "
                                f"{resp.text[:200]}"
                            ),
                        })
                        return

                    try:
                        data = resp.json()
                    except Exception as e:
                        yield _emit({
                            "type": "error",
                            "error": f"JSON decode failed: {type(e).__name__}: {e}",
                        })
                        return

                    choice = (data.get("choices") or [{}])[0]
                    message = choice.get("message", {}) or {}
                    content = message.get("content") or ""
                    finish_reason = choice.get("finish_reason") or ""
                    # gemma2 応答から JSON tool_call を抽出する (手動 tool loop)
                    # 1. ```json ... ``` コードフェンス内を優先
                    # 2. なければ応答内の最初の {...} を balance count で抽出
                    tool_calls: List[Dict[str, Any]] = []
                    content_for_display = content
                    json_candidate: Optional[str] = None
                    fence_match = re.search(
                        r"```(?:json)?\s*\n?(\{.*?\})\s*\n?```",
                        content, re.DOTALL,
                    )
                    if fence_match:
                        json_candidate = fence_match.group(1).strip()
                    else:
                        # balance count で最初の JSON object を抽出
                        depth = 0
                        start = -1
                        for i, ch in enumerate(content):
                            if ch == "{":
                                if depth == 0:
                                    start = i
                                depth += 1
                            elif ch == "}":
                                if depth > 0:
                                    depth -= 1
                                    if depth == 0 and start >= 0:
                                        json_candidate = content[start:i+1]
                                        break
                    if json_candidate:
                        try:
                            parsed = json.loads(json_candidate)
                            if (isinstance(parsed, dict)
                                    and "tool" in parsed
                                    and isinstance(parsed["tool"], str)):
                                args = parsed.get("arguments") or {}
                                if not isinstance(args, dict):
                                    args = {}
                                tool_calls = [{
                                    "id": f"call_{uuid.uuid4().hex[:8]}",
                                    "function": {
                                        "name": parsed["tool"],
                                        "arguments": json.dumps(
                                            args, ensure_ascii=False,
                                        ),
                                    },
                                }]
                                # JSON を含む応答全体は UI に表示しない
                                content_for_display = ""
                        except (ValueError, TypeError):
                            pass
                    usage = data.get("usage", {}) or {}
                    in_tk = int(usage.get("prompt_tokens", 0) or 0)
                    out_tk = int(usage.get("completion_tokens", 0) or 0)
                    total_in_tokens += in_tk
                    total_out_tokens += out_tk

                    # 累積トークン上限チェック (無料だが暴走止め)
                    if (total_in_tokens + total_out_tokens
                            > CHAT_ACCUMULATED_TOKENS_CAP):
                        if content:
                            accumulated_text_parts.append(content)
                            yield _emit({"type": "delta", "text": content})
                        partial_text = "".join(accumulated_text_parts).strip()
                        if not partial_text:
                            partial_text = (
                                f"[累積 {CHAT_ACCUMULATED_TOKENS_CAP:,} トークンの"
                                f" 上限に達し、 回答を完結できませんでした]"
                            )
                        else:
                            partial_text += (
                                f"\n\n[累積 {CHAT_ACCUMULATED_TOKENS_CAP:,} トークンの"
                                f" 上限に達しました]"
                            )
                        ass_msg_id, cost_usd = _finalize_send(
                            ctx, partial_text, total_in_tokens, total_out_tokens,
                            tool_calls=accumulated_tool_calls,
                        )
                        yield _emit({
                            "type": "done",
                            "assistant_message_id": ass_msg_id,
                            "input_tokens": total_in_tokens,
                            "output_tokens": total_out_tokens,
                            "cache_w_tokens": 0,
                            "cache_r_tokens": 0,
                            "cost_usd": round(cost_usd, 6),
                            "stop_reason": "cost_cap",
                            "tool_calls_count": len(accumulated_tool_calls),
                        })
                        return

                    # content があれば 1 つの delta として emit
                    # (gemma2 の tool_call JSON は content_for_display で隠す)
                    if content_for_display:
                        accumulated_text_parts.append(content_for_display)
                        yield _emit({"type": "delta", "text": content_for_display})

                    # tool_calls が無ければ終了
                    if not tool_calls:
                        stop_reason = finish_reason or "stop"
                        break

                    # assistant メッセージを msgs に追加 (tool_calls 込み)
                    assistant_msg: Dict[str, Any] = {
                        "role": "assistant",
                        "content": content,
                    }
                    if tool_calls:
                        assistant_msg["tool_calls"] = tool_calls
                    msgs.append(assistant_msg)

                    # 各 tool_call を実行
                    for tc in tool_calls:
                        tc_id = tc.get("id") or f"call_{uuid.uuid4().hex[:8]}"
                        fn = tc.get("function", {}) or {}
                        tool_name = fn.get("name") or ""
                        tool_args_raw = fn.get("arguments") or "{}"
                        # arguments は json 文字列で来るのが標準だが、 一部の
                        # 実装は dict のまま返すので両対応
                        try:
                            if isinstance(tool_args_raw, dict):
                                tool_args = tool_args_raw
                            else:
                                tool_args = json.loads(tool_args_raw)
                            if not isinstance(tool_args, dict):
                                tool_args = {}
                        except Exception:
                            tool_args = {}

                        yield _emit({
                            "type": "tool_use",
                            "name": tool_name,
                            "input": tool_args,
                        })

                        try:
                            if tool_name in CHAT_SCOPED_TOOL_NAMES:
                                content_str = _execute_chat_scoped_tool(
                                    ctx, tool_name, tool_args,
                                )
                            elif tool_name in OLLAMA_ALLOWED_TOOL_NAMES:
                                tool_output = mcp_client.call_tool(
                                    tool_name, tool_args,
                                )
                                content_str = (
                                    tool_output if tool_output else "(no result)"
                                )
                            else:
                                # 許可リスト外のツールを gemma2 が幻覚した
                                content_str = (
                                    f"[このツールは gemma2 経路では露出していません: "
                                    f"{tool_name}。 別のツールで試してください]"
                                )
                            if len(content_str) > MCP_TOOL_RESULT_MAX_CHARS:
                                original_len = len(content_str)
                                content_str = (
                                    content_str[:MCP_TOOL_RESULT_MAX_CHARS]
                                    + f"\n\n[結果が長いため "
                                    f"{MCP_TOOL_RESULT_MAX_CHARS:,} 文字で"
                                    f"切り詰めました (元の長さ: "
                                    f"{original_len:,} 文字)]"
                                )
                                logger.info(
                                    f"[CHAT/ollama] tool {tool_name} truncated: "
                                    f"{original_len} -> "
                                    f"{MCP_TOOL_RESULT_MAX_CHARS} chars"
                                )
                            msgs.append({
                                "role": "user",
                                "content": (
                                    f"[ツール実行結果 - {tool_name}]\n"
                                    f"{content_str}\n\n"
                                    f"この結果を元に、 次のツールを呼ぶか、 "
                                    f"最終回答を返してください。"
                                ),
                            })
                            brief = str(content_str)[
                                :TOOL_RESULT_BRIEF_CHAR_LIMIT
                            ]
                            accumulated_tool_calls.append({
                                "name": tool_name,
                                "input": tool_args,
                                "result_brief": brief,
                                "ok": True,
                            })
                            yield _emit({
                                "type": "tool_result",
                                "name": tool_name,
                                "ok": True,
                                "result_brief": brief,
                            })
                        except Exception as e:
                            err_msg = (
                                f"ツール実行エラー: "
                                f"{type(e).__name__}: {str(e)[:120]}"
                            )
                            logger.error(
                                f"[CHAT/ollama] tool {tool_name} failed: "
                                f"{type(e).__name__}: {e}",
                            )
                            msgs.append({
                                "role": "user",
                                "content": (
                                    f"[ツール実行エラー - {tool_name}]\n"
                                    f"{err_msg}\n\n"
                                    f"この結果を元に、 別のツールを呼ぶか、 "
                                    f"最終回答を返してください。"
                                ),
                            })
                            accumulated_tool_calls.append({
                                "name": tool_name,
                                "input": tool_args,
                                "result_brief": err_msg,
                                "ok": False,
                            })
                            yield _emit({
                                "type": "tool_result",
                                "name": tool_name,
                                "ok": False,
                                "error": f"{type(e).__name__}",
                                "result_brief": err_msg,
                            })
                else:
                    # max iterations 到達
                    partial_text = "".join(accumulated_text_parts).strip()
                    if not partial_text:
                        partial_text = (
                            f"[gemma2 が {OLLAMA_MAX_TOOL_ITERATIONS} 回の"
                            f" ツール呼び出し上限に達し、 回答を完結できませんでした]"
                        )
                    else:
                        partial_text += (
                            f"\n\n[gemma2 が {OLLAMA_MAX_TOOL_ITERATIONS} 回の"
                            f" ツール呼び出し上限に達しました]"
                        )
                    ass_msg_id, cost_usd = _finalize_send(
                        ctx, partial_text, total_in_tokens, total_out_tokens,
                        tool_calls=accumulated_tool_calls,
                    )
                    logger.warning(
                        f"[CHAT/ollama] max iterations reached "
                        f"thread={ctx['thread_id']} owner={ctx['owner']!r} "
                        f"in={total_in_tokens} out={total_out_tokens} "
                        f"tool_calls={len(accumulated_tool_calls)}"
                    )
                    yield _emit({
                        "type": "done",
                        "assistant_message_id": ass_msg_id,
                        "input_tokens": total_in_tokens,
                        "output_tokens": total_out_tokens,
                        "cache_w_tokens": 0,
                        "cache_r_tokens": 0,
                        "cost_usd": round(cost_usd, 6),
                        "stop_reason": "max_iterations",
                        "tool_calls_count": len(accumulated_tool_calls),
                    })
                    return

        except Exception as e:
            logger.error(
                f"[CHAT/ollama] outer error: {type(e).__name__}: {e}",
                exc_info=True,
            )
            yield _emit({
                "type": "error",
                "error": f"{type(e).__name__}: {str(e)[:200]}",
            })
            return

        # 通常完了
        full_text = "".join(accumulated_text_parts).strip()
        ass_msg_id, cost_usd = _finalize_send(
            ctx, full_text, total_in_tokens, total_out_tokens,
            tool_calls=accumulated_tool_calls,
        )
        logger.info(
            f"[CHAT/ollama] stream OK thread={ctx['thread_id']} "
            f"owner={ctx['owner']!r} model={ctx['model']} "
            f"in={total_in_tokens} out={total_out_tokens} "
            f"cost=${cost_usd:.4f} "
            f"tool_calls={len(accumulated_tool_calls)}"
        )
        yield _emit({
            "type": "done",
            "assistant_message_id": ass_msg_id,
            "input_tokens": total_in_tokens,
            "output_tokens": total_out_tokens,
            "cache_w_tokens": 0,
            "cache_r_tokens": 0,
            "cost_usd": round(cost_usd, 6),
            "stop_reason": stop_reason or "stop",
            "tool_calls_count": len(accumulated_tool_calls),
        })


    # ============================================================
    # ストリーミング + MCP tool loop
    # (main.py の /core/claude/stream-with-mcp と同じパターン)
    # ============================================================

    @router.post("/core/chat/send/stream")
    async def core_chat_send_stream(request: dict):
        """SSE ストリーミング + MCP tool loop。

        Event 種別 (`data: {json}\\n\\n`):
          - {"type": "start", user_message_id, injected_topics, model}
          - {"type": "delta", text}
          - {"type": "tool_use", name, input}
          - {"type": "tool_result", name, ok, error?}
          - {"type": "done", assistant_message_id, input_tokens,
             output_tokens, stop_reason, tool_calls_count}
          - {"type": "error", error}
        """
        ctx, err = _prepare_send(request)

        def _err_stream(msg: str):
            payload = json.dumps({"type": "error", "error": msg}, ensure_ascii=False)
            yield (f"data: {payload}\n\n").encode()

        if err is not None:
            return StreamingResponse(_err_stream(err), media_type="text/event-stream")

        def _emit(evt: dict) -> bytes:
            return (f"data: {json.dumps(evt, ensure_ascii=False)}\n\n").encode()

        def stream_gen():
            # start event
            yield _emit({
                "type": "start",
                "user_message_id": ctx["user_msg_id"],
                "injected_topics": ctx["injected_topics_meta"],
                "model": ctx["model"],
            })

            # Step E-2: Jev+gemma2 (C3PO) 経路は別関数に分岐
            if ctx["model"] == CHAT_JEV_GEMMA2_MODEL_ID:
                yield from _stream_via_jev_gemma2(ctx, _emit)
                return

            # gemma2 (Ollama) は OpenAI 互換のツール呼び出しで別ループに分岐
            if _is_ollama_model(ctx["model"]):
                yield from _run_mcp_loop_ollama(ctx, _emit)
                return

            # kernel 本体の共有リソースを lazy import
            try:
                from main import (
                    get_anthropic_client,
                    SimpleMCPClient,
                    MCP_SERVER_URL,
                    MCP_API_KEY,
                    MCP_CONNECT_TIMEOUT,
                    CLAUDE_MAX_TOOL_ITERATIONS,
                    CLAUDE_STREAM_MAX_ACCUMULATED_TOKENS,
                    _claude_strip_unsupported_sampling,
                )
            except Exception as e:
                yield _emit({
                    "type": "error",
                    "error": f"main import failed: {type(e).__name__}: {e}",
                })
                return

            if not MCP_API_KEY or not MCP_SERVER_URL:
                yield _emit({
                    "type": "error",
                    "error": "MCP config missing (MCP_API_KEY/MCP_SERVER_URL not set)",
                })
                return

            try:
                client = get_anthropic_client()
            except Exception as e:
                yield _emit({
                    "type": "error",
                    "error": f"anthropic client init failed: {type(e).__name__}: {e}",
                })
                return

            accumulated_text_parts: List[str] = []
            accumulated_tool_calls: List[dict] = []
            total_in_tokens = 0
            total_out_tokens = 0
            total_cache_w_tokens = 0
            total_cache_r_tokens = 0
            stop_reason: Optional[str] = None

            try:
                with SimpleMCPClient(
                    MCP_SERVER_URL, MCP_API_KEY, timeout=MCP_CONNECT_TIMEOUT,
                ) as mcp_client:
                    try:
                        all_tools = mcp_client.list_tools()
                    except Exception as e:
                        yield _emit({
                            "type": "error",
                            "error": f"MCP list_tools failed: {type(e).__name__}: {e}",
                        })
                        return

                    # MCP tool を Anthropic tool schema に変換 (inputSchema → input_schema)
                    # さらに chat-scoped tool を並べて露出。
                    # 最後の tool に cache_control ephemeral を付けて prompt caching (5min TTL)
                    tools_for_claude = []
                    for t in all_tools:
                        tools_for_claude.append({
                            "name": t["name"],
                            "description": t.get("description", ""),
                            "input_schema": t.get(
                                "inputSchema",
                                {"type": "object", "properties": {}},
                            ),
                        })
                    # chat-scoped tool を追加
                    for chat_t in CHAT_SCOPED_TOOL_SCHEMAS:
                        tools_for_claude.append({
                            "name": chat_t["name"],
                            "description": chat_t["description"],
                            "input_schema": chat_t["input_schema"],
                        })
                    if tools_for_claude:
                        tools_for_claude[-1]["cache_control"] = {"type": "ephemeral"}

                    logger.info(
                        f"[CHAT] MCP exposed {len(all_tools)} MCP tools + "
                        f"{len(CHAT_SCOPED_TOOL_SCHEMAS)} chat-scoped tools "
                        f"thread={ctx['thread_id']} model={ctx['model']}"
                    )

                    msgs = list(ctx["api_messages"])

                    for iteration in range(CHAT_MAX_TOOL_ITERATIONS):
                        create_kwargs: Dict[str, Any] = {
                            "model": ctx["model"],
                            "max_tokens": MAX_OUTPUT_TOKENS,
                            "messages": _messages_with_cache_control(msgs),
                        }
                        if ctx["system_prompt"]:
                            create_kwargs["system"] = [{
                                "type": "text",
                                "text": ctx["system_prompt"],
                                "cache_control": {"type": "ephemeral"},
                            }]
                        if tools_for_claude:
                            create_kwargs["tools"] = tools_for_claude

                        _claude_strip_unsupported_sampling(
                            ctx["model"], create_kwargs,
                        )

                        # 1M context beta header を対応モデルにのみ付与
                        stream_kwargs = dict(create_kwargs)
                        if ctx["model"] in MODELS_SUPPORTING_1M_CONTEXT:
                            stream_kwargs["extra_headers"] = {
                                "anthropic-beta": "context-1m-2025-08-07",
                            }

                        try:
                            with client.messages.stream(**stream_kwargs) as stream:
                                for text_chunk in stream.text_stream:
                                    if text_chunk:
                                        accumulated_text_parts.append(text_chunk)
                                        yield _emit({
                                            "type": "delta",
                                            "text": text_chunk,
                                        })
                                final_message = stream.get_final_message()
                        except Exception as e:
                            logger.error(
                                f"[CHAT] stream error iter={iteration}: "
                                f"{type(e).__name__}: {e}",
                                exc_info=True,
                            )
                            yield _emit({
                                "type": "error",
                                "error": f"{type(e).__name__}: {str(e)[:200]}",
                            })
                            return

                        # usage
                        try:
                            usage = final_message.usage
                            in_tk = int(getattr(usage, "input_tokens", 0) or 0)
                            out_tk = int(getattr(usage, "output_tokens", 0) or 0)
                            cw_tk = int(
                                getattr(usage, "cache_creation_input_tokens", 0) or 0
                            )
                            cr_tk = int(
                                getattr(usage, "cache_read_input_tokens", 0) or 0
                            )
                            total_in_tokens += in_tk
                            total_out_tokens += out_tk
                            total_cache_w_tokens += cw_tk
                            total_cache_r_tokens += cr_tk
                            # OpenSearch の claude_usage index に永続化
                            # (op="chat_send_stream" で chat 向けの使用量を集計可能に)
                            try:
                                from main import record_claude_usage
                                record_claude_usage(
                                    op="chat_send_stream",
                                    input_tokens=in_tk,
                                    output_tokens=out_tk,
                                    model=ctx["model"],
                                    cache_w=cw_tk,
                                    cache_r=cr_tk,
                                    user_id=ctx["owner"],
                                )
                            except Exception as _e:
                                logger.warning(
                                    f"[CHAT] record_claude_usage failed: {_e}"
                                )
                        except Exception:
                            pass

                        # コスト上限チェック
                        if (total_in_tokens + total_out_tokens
                                > CHAT_ACCUMULATED_TOKENS_CAP):
                            partial_text = "".join(accumulated_text_parts).strip()
                            if not partial_text:
                                partial_text = (
                                    f"[累積 {CHAT_ACCUMULATED_TOKENS_CAP:,} token の"
                                    f" コスト上限に達し、 回答を完結できませんでした。"
                                    f" 続けて発話すれば追加調査できます]"
                                )
                            else:
                                partial_text += (
                                    f"\n\n[累積 {CHAT_ACCUMULATED_TOKENS_CAP:,} token の"
                                    f" コスト上限に達しました。"
                                    f" 続けて発話すれば追加調査できます]"
                                )
                            ass_msg_id, cost_usd = _finalize_send(
                                ctx, partial_text, total_in_tokens, total_out_tokens,
                                cache_w_tokens=total_cache_w_tokens,
                                cache_r_tokens=total_cache_r_tokens,
                                tool_calls=accumulated_tool_calls,
                            )
                            logger.warning(
                                f"[CHAT] cost cap reached thread={ctx['thread_id']} "
                                f"owner={ctx['owner']!r} model={ctx['model']} "
                                f"in={total_in_tokens} out={total_out_tokens} "
                                f"cache_r={total_cache_r_tokens} "
                                f"cost=${cost_usd:.4f} "
                                f"tool_calls={len(accumulated_tool_calls)}"
                            )
                            yield _emit({
                                "type": "done",
                                "assistant_message_id": ass_msg_id,
                                "input_tokens": total_in_tokens,
                                "output_tokens": total_out_tokens,
                                "cache_w_tokens": total_cache_w_tokens,
                                "cache_r_tokens": total_cache_r_tokens,
                                "cost_usd": round(cost_usd, 6),
                                "stop_reason": "cost_cap",
                                "tool_calls_count": len(accumulated_tool_calls),
                            })
                            return

                        stop_reason = getattr(final_message, "stop_reason", None)

                        if stop_reason != "tool_use":
                            break

                        # tool_use を実行
                        assistant_content = []
                        for block in final_message.content:
                            btype = getattr(block, "type", None)
                            if btype == "text":
                                assistant_content.append(
                                    {"type": "text", "text": block.text},
                                )
                            elif btype == "tool_use":
                                assistant_content.append({
                                    "type": "tool_use",
                                    "id": block.id,
                                    "name": block.name,
                                    "input": dict(block.input),
                                })
                        msgs.append({"role": "assistant", "content": assistant_content})

                        tool_results_content = []
                        for block in final_message.content:
                            if getattr(block, "type", None) != "tool_use":
                                continue
                            tool_name = block.name
                            tool_args = dict(block.input)

                            yield _emit({
                                "type": "tool_use",
                                "name": tool_name,
                                "input": tool_args,
                            })

                            try:
                                if tool_name in CHAT_SCOPED_TOOL_NAMES:
                                    content_str = _execute_chat_scoped_tool(
                                        ctx, tool_name, tool_args,
                                    )
                                else:
                                    tool_output = mcp_client.call_tool(
                                        tool_name, tool_args,
                                    )
                                    content_str = (
                                        tool_output if tool_output else "(no result)"
                                    )
                                # 巨大な tool result を上限で切り詰めて context 汚染を防ぐ
                                if len(content_str) > MCP_TOOL_RESULT_MAX_CHARS:
                                    original_len = len(content_str)
                                    content_str = (
                                        content_str[:MCP_TOOL_RESULT_MAX_CHARS]
                                        + f"\n\n[結果が長いため {MCP_TOOL_RESULT_MAX_CHARS:,} "
                                        f"文字で切り詰めました (元の長さ: "
                                        f"{original_len:,} 文字)。 より具体的なクエリで"
                                        f"再度呼び出してください。 例: 一覧系 tool は"
                                        f"ページング引数を使う、 検索系はより狭い検索クエリにする]"
                                    )
                                    logger.info(
                                        f"[CHAT] tool {tool_name} result truncated: "
                                        f"{original_len} -> {MCP_TOOL_RESULT_MAX_CHARS} chars"
                                    )
                                tool_results_content.append({
                                    "type": "tool_result",
                                    "tool_use_id": block.id,
                                    "content": content_str,
                                })
                                brief = str(content_str)[
                                    :TOOL_RESULT_BRIEF_CHAR_LIMIT
                                ]
                                accumulated_tool_calls.append({
                                    "name": tool_name,
                                    "input": tool_args,
                                    "result_brief": brief,
                                    "ok": True,
                                })
                                yield _emit({
                                    "type": "tool_result",
                                    "name": tool_name,
                                    "ok": True,
                                    "result_brief": brief,
                                })
                            except Exception as e:
                                err_msg = (
                                    f"ツール実行エラー: "
                                    f"{type(e).__name__}: {str(e)[:120]}"
                                )
                                logger.error(
                                    f"[CHAT] tool {tool_name} failed: "
                                    f"{type(e).__name__}: {e}",
                                )
                                tool_results_content.append({
                                    "type": "tool_result",
                                    "tool_use_id": block.id,
                                    "content": err_msg,
                                    "is_error": True,
                                })
                                accumulated_tool_calls.append({
                                    "name": tool_name,
                                    "input": tool_args,
                                    "result_brief": err_msg,
                                    "ok": False,
                                })
                                yield _emit({
                                    "type": "tool_result",
                                    "name": tool_name,
                                    "ok": False,
                                    "error": f"{type(e).__name__}",
                                    "result_brief": err_msg,
                                })

                        msgs.append({"role": "user", "content": tool_results_content})
                    else:
                        # max iterations 到達: 部分テキストを保存して done として返す
                        partial_text = "".join(accumulated_text_parts).strip()
                        if not partial_text:
                            partial_text = (
                                f"[Claude が {CHAT_MAX_TOOL_ITERATIONS} 回の"
                                f" tool 呼び出し上限に達し、 回答を完結できませんでした。"
                                f" 続けて発話すれば追加調査できます]"
                            )
                        else:
                            partial_text += (
                                f"\n\n[Claude が {CHAT_MAX_TOOL_ITERATIONS} 回の"
                                f" tool 呼び出し上限に達しました。"
                                f" 続けて発話すれば追加調査できます]"
                            )
                        ass_msg_id, cost_usd = _finalize_send(
                            ctx, partial_text, total_in_tokens, total_out_tokens,
                            cache_w_tokens=total_cache_w_tokens,
                            cache_r_tokens=total_cache_r_tokens,
                            tool_calls=accumulated_tool_calls,
                        )
                        logger.warning(
                            f"[CHAT] max iterations reached thread={ctx['thread_id']} "
                            f"owner={ctx['owner']!r} model={ctx['model']} "
                            f"in={total_in_tokens} out={total_out_tokens} "
                            f"cache_r={total_cache_r_tokens} "
                            f"cost=${cost_usd:.4f} "
                            f"tool_calls={len(accumulated_tool_calls)}"
                        )
                        yield _emit({
                            "type": "done",
                            "assistant_message_id": ass_msg_id,
                            "input_tokens": total_in_tokens,
                            "output_tokens": total_out_tokens,
                            "cache_w_tokens": total_cache_w_tokens,
                            "cache_r_tokens": total_cache_r_tokens,
                            "cost_usd": round(cost_usd, 6),
                            "stop_reason": "max_iterations",
                            "tool_calls_count": len(accumulated_tool_calls),
                        })
                        return

            except Exception as e:
                logger.error(
                    f"[CHAT] outer error: {type(e).__name__}: {e}", exc_info=True,
                )
                yield _emit({
                    "type": "error",
                    "error": f"{type(e).__name__}: {str(e)[:200]}",
                })
                return

            # 完了処理: assistant メッセージ保存 + スレッド更新
            full_text = "".join(accumulated_text_parts).strip()
            ass_msg_id, cost_usd = _finalize_send(
                ctx, full_text, total_in_tokens, total_out_tokens,
                cache_w_tokens=total_cache_w_tokens,
                cache_r_tokens=total_cache_r_tokens,
                tool_calls=accumulated_tool_calls,
            )
            logger.info(
                f"[CHAT] stream OK thread={ctx['thread_id']} "
                f"owner={ctx['owner']!r} model={ctx['model']} "
                f"in={total_in_tokens} out={total_out_tokens} "
                f"cache_r={total_cache_r_tokens} "
                f"cost=${cost_usd:.4f} "
                f"injected={len(ctx['injected_topics_meta'])} "
                f"tool_calls={len(accumulated_tool_calls)}"
            )
            yield _emit({
                "type": "done",
                "assistant_message_id": ass_msg_id,
                "input_tokens": total_in_tokens,
                "output_tokens": total_out_tokens,
                "cache_w_tokens": total_cache_w_tokens,
                "cache_r_tokens": total_cache_r_tokens,
                "cost_usd": round(cost_usd, 6),
                "stop_reason": stop_reason,
                "tool_calls_count": len(accumulated_tool_calls),
            })

        return StreamingResponse(
            stream_gen(), media_type="text/event-stream",
        )


    # ============================================================
    # 非ストリーミング版 (レガシー、 tool 未対応)
    # ============================================================

    def _call_anthropic_simple(
        model: str, system_prompt: str, messages_for_api: List[dict],
    ) -> Dict[str, Any]:
        try:
            from main import get_anthropic_client
        except Exception as e:
            raise RuntimeError(f"anthropic import failed: {e}")
        client = get_anthropic_client()
        create_kwargs: Dict[str, Any] = {
            "model": model,
            "max_tokens": MAX_OUTPUT_TOKENS,
            "messages": messages_for_api,
        }
        if system_prompt:
            create_kwargs["system"] = system_prompt
        # 1M context beta header を対応モデルにのみ付与
        if model in MODELS_SUPPORTING_1M_CONTEXT:
            create_kwargs["extra_headers"] = {
                "anthropic-beta": "context-1m-2025-08-07",
            }
        msg = client.messages.create(**create_kwargs)
        text_parts = []
        for block in msg.content:
            btype = getattr(block, "type", None)
            if btype == "text":
                text_parts.append(block.text)
        usage = msg.usage
        return {
            "text": "".join(text_parts).strip(),
            "input_tokens": int(getattr(usage, "input_tokens", 0) or 0),
            "output_tokens": int(getattr(usage, "output_tokens", 0) or 0),
            "stop_reason": msg.stop_reason,
        }


    @router.post("/core/chat/send")
    async def core_chat_send(request: dict):
        """非ストリーミング。 tool 未使用 (streaming 側でのみ tool loop)。"""
        ctx, err = _prepare_send(request)
        if err is not None:
            return {"ok": False, "error": err}
        try:
            resp = _call_anthropic_simple(
                ctx["model"], ctx["system_prompt"], ctx["api_messages"],
            )
        except Exception as e:
            logger.error(f"[CHAT] anthropic call failed: {e}", exc_info=True)
            now = _now_iso()
            _os_post(
                f"/{CHAT_THREADS_INDEX}/_update/{ctx['thread_id']}?refresh=true",
                {"doc": {
                    "last_message_at": now, "updated_at": now,
                    "message_count": len(ctx["prior"]) + 1,
                }},
            )
            return {
                "ok": False, "user_message_id": ctx["user_msg_id"],
                "error": f"{type(e).__name__}: {str(e)[:300]}",
            }
        ass_msg_id = _finalize_send(
            ctx, resp["text"], resp["input_tokens"], resp["output_tokens"],
        )
        return {
            "ok": True,
            "user_message_id": ctx["user_msg_id"],
            "assistant_message_id": ass_msg_id,
            "assistant_content": resp["text"],
            "input_tokens": resp["input_tokens"],
            "output_tokens": resp["output_tokens"],
            "model": ctx["model"],
            "stop_reason": resp.get("stop_reason"),
            "injected_topics": ctx["injected_topics_meta"],
            "error": None,
        }
