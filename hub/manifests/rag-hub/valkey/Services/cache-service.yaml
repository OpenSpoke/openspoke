apiVersion: v1
kind: Service
metadata:
  name: cache-service
  namespace: valkey
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    app: cache-service
  sessionAffinity: None
  type: ClusterIP
