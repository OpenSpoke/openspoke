apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-service
  namespace: valkey
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: cache-service
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: cache-service
    spec:
      containers:
        - command:
            - bash
            - '-c'
            - >
              pip install --no-cache-dir fastapi==0.104.1 uvicorn==0.24.0
              pydantic==2.5.0 redis==5.0.0

              cd /app

              python cache_service.py
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          name: cache-service
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /app
              name: code
              readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: cache-service-code
          name: code
