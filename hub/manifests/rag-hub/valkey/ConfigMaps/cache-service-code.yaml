    """
    Semantic Cache Service
    クエリのembeddingを比較し、類似クエリの結果をキャッシュから返す。
    Bedrockにはない機能: 同じような質問に対して即座に回答を返す。
    """

    import os
    import json
    import math
    import time
    import logging
    import uvicorn
    import redis
    from fastapi import FastAPI
    from pydantic import BaseModel
    from typing import List, Dict, Any, Optional

    logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Semantic Cache Service")

    VALKEY_HOST = os.environ.get("CACHE_VALKEY_HOST", "valkey.valkey.svc.cluster.local")
    VALKEY_PORT = int(os.environ.get("CACHE_VALKEY_PORT", "6379"))
    SIMILARITY_THRESHOLD = float(os.environ.get("SIMILARITY_THRESHOLD", "0.92"))
    CACHE_TTL = int(os.environ.get("CACHE_TTL", "3600"))
    MAX_ENTRIES = int(os.environ.get("MAX_ENTRIES", "500"))

    r = redis.Redis(host=VALKEY_HOST, port=VALKEY_PORT, decode_responses=True)

    # ── 統計 ──

    stats = {"hits": 0, "misses": 0, "stores": 0}

    # ── Pydantic モデル ──

    class CacheCheckRequest(BaseModel):
        embedding: List[float]
        tenant: str
        question: str = ""

    class CacheStoreRequest(BaseModel):
        embedding: List[float]
        tenant: str
        question: str
        result: Dict[str, Any]

    # ── コサイン類似度（純Python実装）──

    def cosine_similarity(a: List[float], b: List[float]) -> float:
        if len(a) != len(b):
            return 0.0
        dot = 0.0
        norm_a = 0.0
        norm_b = 0.0
        for i in range(len(a)):
            dot += a[i] * b[i]
            norm_a += a[i] * a[i]
            norm_b += b[i] * b[i]
        if norm_a == 0 or norm_b == 0:
            return 0.0
        return dot / (math.sqrt(norm_a) * math.sqrt(norm_b))

    # ── エンドポイント ──

    @app.get("/health")
    async def health():
        try:
            r.ping()
            valkey_status = "connected"
            cached_keys = r.dbsize()
        except Exception:
            valkey_status = "disconnected"
            cached_keys = 0

        return {
            "status": "healthy",
            "service": "Semantic Cache",
            "valkey": valkey_status,
            "cached_entries": cached_keys,
            "stats": stats,
            "config": {
                "similarity_threshold": SIMILARITY_THRESHOLD,
                "cache_ttl_sec": CACHE_TTL,
                "max_entries": MAX_ENTRIES,
            }
        }

    @app.post("/cache/check")
    async def cache_check(request: CacheCheckRequest):
        start = time.time()
        tenant_key = f"cache:{request.tenant}"

        try:
            entries = r.lrange(tenant_key, 0, MAX_ENTRIES - 1)
        except Exception as e:
            logger.warning(f"[CACHE] Valkey read failed: {e}")
            stats["misses"] += 1
            return {"hit": False, "processing_time_sec": round(time.time() - start, 4)}

        best_sim = 0.0
        best_entry = None

        for entry_json in entries:
            try:
                entry = json.loads(entry_json)
                sim = cosine_similarity(request.embedding, entry["embedding"])
                if sim > best_sim:
                    best_sim = sim
                    best_entry = entry
            except Exception:
                continue

        elapsed = time.time() - start

        if best_sim >= SIMILARITY_THRESHOLD and best_entry:
            stats["hits"] += 1
            logger.info(f"[CACHE] HIT: sim={best_sim:.4f}, question='{best_entry.get('question', '')[:50]}', checked {len(entries)} entries in {elapsed:.4f}s")
            return {
                "hit": True,
                "similarity": round(best_sim, 4),
                "cached_question": best_entry.get("question", ""),
                "result": best_entry.get("result", {}),
                "processing_time_sec": round(elapsed, 4),
            }
        else:
            stats["misses"] += 1
            logger.info(f"[CACHE] MISS: best_sim={best_sim:.4f}, checked {len(entries)} entries in {elapsed:.4f}s")
            return {
                "hit": False,
                "best_similarity": round(best_sim, 4),
                "processing_time_sec": round(elapsed, 4),
            }

    @app.post("/cache/store")
    async def cache_store(request: CacheStoreRequest):
        start = time.time()
        tenant_key = f"cache:{request.tenant}"

        entry = {
            "embedding": request.embedding,
            "question": request.question,
            "result": request.result,
            "stored_at": time.time(),
        }

        try:
            r.lpush(tenant_key, json.dumps(entry, ensure_ascii=False))
            r.ltrim(tenant_key, 0, MAX_ENTRIES - 1)
            r.expire(tenant_key, CACHE_TTL)
            stats["stores"] += 1

            elapsed = time.time() - start
            logger.info(f"[CACHE] STORED: question='{request.question[:50]}' in {elapsed:.4f}s")

            return {"stored": True, "processing_time_sec": round(elapsed, 4)}
        except Exception as e:
            logger.warning(f"[CACHE] Store failed: {e}")
            return {"stored": False, "error": str(e)}

    @app.get("/cache/stats")
    async def cache_stats():
        total = stats["hits"] + stats["misses"]
        hit_rate = stats["hits"] / total if total > 0 else 0

        try:
            db_size = r.dbsize()
        except Exception:
            db_size = -1

        return {
            "hits": stats["hits"],
            "misses": stats["misses"],
            "stores": stats["stores"],
            "total_queries": total,
            "hit_rate": round(hit_rate, 4),
            "valkey_keys": db_size,
        }

    @app.delete("/cache/clear")
    async def cache_clear():
        try:
            r.flushdb()
            stats["hits"] = 0
            stats["misses"] = 0
            stats["stores"] = 0
            return {"cleared": True}
        except Exception as e:
            return {"cleared": False, "error": str(e)}

    if __name__ == "__main__":
        port = int(os.environ.get("CACHE_PORT", "8000"))
        uvicorn.run("cache_service:app", host="0.0.0.0", port=port, workers=1)
