apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - args:
            - tunnel
            - '--no-autoupdate'
            - '--config'
            - /etc/cloudflared/config.yaml
            - run
            - your-tunnel-id
          env:
            - name: TUNNEL_METRICS
              value: 0.0.0.0:2000
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          name: cloudflared
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/cloudflared
              name: cloudflared-bundle
              readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: cloudflared-bundle
          secret:
            defaultMode: 420
            secretName: cloudflared-bundle
