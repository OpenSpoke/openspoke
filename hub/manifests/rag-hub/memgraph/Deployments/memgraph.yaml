apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: memgraph
  name: memgraph
  namespace: memgraph
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: memgraph
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: memgraph
      namespace: memgraph
    spec:
      containers:
        - args:
            - '--memory-limit=16384'
            - '--log-level=WARNING'
            - '--also-log-to-stderr'
            - '--storage-properties-on-edges=true'
          image: memgraph/memgraph:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 20
            successThreshold: 1
            tcpSocket:
              port: 7687
            timeoutSeconds: 1
          name: memgraph
          ports:
            - containerPort: 7687
              name: bolt
              protocol: TCP
            - containerPort: 7444
              name: websocket
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 7687
            timeoutSeconds: 1
          resources:
            limits:
              cpu: '4'
              memory: 20Gi
            requests:
              cpu: 500m
              memory: 4Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/lib/memgraph
              name: data
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - sh
            - '-c'
            - chown -R 101:101 /var/lib/memgraph
          image: busybox
          imagePullPolicy: IfNotPresent
          name: fix-permissions
          resources: {}
          securityContext:
            runAsUser: 0
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/lib/memgraph
              name: data
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: memgraph-data
