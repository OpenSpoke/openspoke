apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar
  namespace: milvus
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: pulsar
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pulsar
      namespace: milvus
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: rag-type
                    operator: In
                    values:
                      - milvus
      containers:
        - command:
            - bash
            - '-c'
            - |
              bin/pulsar standalone
          env:
            - name: PULSAR_MEM
              value: '-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m'
          image: apachepulsar/pulsar:3.2.3
          imagePullPolicy: IfNotPresent
          name: pulsar
          ports:
            - containerPort: 6650
              name: 6650tcp
              protocol: TCP
            - containerPort: 8080
              name: 8080tcp
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
