apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulsar-data-local
  namespace: milvus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar
  namespace: milvus
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: pulsar
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pulsar
      namespace: milvus
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: rag-type
                    operator: In
                    values:
                      - milvus
      containers:
        - command:
            - bash
            - '-c'
            - |
              set -e
              cat >> conf/standalone.conf <<'CONF'
              advertisedAddress=pulsar.milvus.svc.cluster.local
              bookiePort=3181
              bookieId=pulsar.milvus.svc.cluster.local:3181
              CONF
              bin/pulsar standalone --bookkeeper-port 3181
          env:
            - name: PULSAR_MEM
              value: '-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m'
          image: apachepulsar/pulsar:3.2.3
          imagePullPolicy: IfNotPresent
          name: pulsar
          ports:
            - containerPort: 6650
              name: 6650tcp
              protocol: TCP
            - containerPort: 8080
              name: 8080tcp
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /pulsar/data
              name: pulsar-data-local
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: pulsar-data-local
          persistentVolumeClaim:
            claimName: pulsar-data-local
