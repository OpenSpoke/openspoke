apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: milvus
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: client
      port: 2379
      protocol: TCP
      targetPort: 2379
  selector:
    app: etcd-ha
  sessionAffinity: None
  type: ClusterIP
