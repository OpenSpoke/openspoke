apiVersion: v1
kind: Service
metadata:
  name: milvus-indexcoord
  namespace: milvus
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - port: 31000
      protocol: TCP
      targetPort: 31000
  selector:
    app: milvus-mixcoord
  sessionAffinity: None
  type: ClusterIP
