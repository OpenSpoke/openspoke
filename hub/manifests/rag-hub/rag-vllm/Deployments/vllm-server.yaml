apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  namespace: rag
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: vllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: gpu
                    operator: In
                    values:
                      - enabled
      containers:
        - command:
            - bash
            - '-c'
            - |
              MODEL_NAME="tokyotech-llm--Llama-3.1-Swallow-8B-Instruct-v0.5"
              BASE_DIR="/model-cache/huggingface"

              SNAPSHOT=$(find ${BASE_DIR} -type d -name "snapshots" \
                -path "*${MODEL_NAME}*" 2>/dev/null | head -1)

              if [ -z "${SNAPSHOT}" ]; then
                echo "ERROR: snapshots directory not found under ${BASE_DIR}"
                exit 1
              fi

              SNAPSHOT_HASH=$(ls -1 ${SNAPSHOT} | head -1)
              if [ -z "${SNAPSHOT_HASH}" ]; then
                echo "ERROR: No snapshot hash found in ${SNAPSHOT}"
                exit 1
              fi

              MODEL_PATH="${SNAPSHOT}/${SNAPSHOT_HASH}"
              echo "Loading model from: ${MODEL_PATH}"

              exec python3 -m vllm.entrypoints.openai.api_server \
                --model "${MODEL_PATH}" \
                --host 0.0.0.0 \
                --port 8000 \
                --max-model-len 4096 \
                --served-model-name tokyotech-llm/Llama-3.1-Swallow-8B-Instruct-v0.5 \
                --gpu-memory-utilization 0.75 \
                --max-num-seqs 16 \
                --dtype half
          env:
            - name: VLLM_PORT
              value: '8000'
            - name: HF_HOME
              value: /model-cache/huggingface
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 240
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 10
          name: vllm-server
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 18
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 180
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: '4'
              memory: 16Gi
              nvidia.com/gpu: '1'
            requests:
              cpu: '2'
              memory: 8Gi
              nvidia.com/gpu: '1'
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /model-cache
              name: model-cache
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      initContainers:
        - command:
            - sh
            - '-c'
            - |
              set -e
              echo "[restore] mirroring model from MinIO ..."
              mc mirror --overwrite dst/models/vllm-swallow-8b/huggingface /model-cache/huggingface
              echo "[restore] done"
          env:
            - name: MC_HOST_dst
              value: 'http://minioadmin:minioadminpassword@minio.milvus.svc.cluster.local:9000'
          image: minio/mc:RELEASE.2024-10-08T09-37-26Z
          imagePullPolicy: IfNotPresent
          name: model-restore
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: '500m'
              memory: 512Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /model-cache
              name: model-cache
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 60Gi
