---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-backend-kernel
  namespace: rag-company1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rag-backend-kernel-observer
rules:
  # Pod / Deployment / Event の read-only access
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - namespaces
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rag-backend-kernel-observer
subjects:
  - kind: ServiceAccount
    name: rag-backend-kernel
    namespace: rag-company1
roleRef:
  kind: ClusterRole
  name: rag-backend-kernel-observer
  apiGroup: rbac.authorization.k8s.io
