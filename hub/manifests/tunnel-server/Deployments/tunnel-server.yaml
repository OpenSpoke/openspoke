apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel-server
  namespace: mcp
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: tunnel-server
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: tunnel-server
      annotations:
        restarted-at: "2026-06-03T02:00:00Z"
    spec:
      # Co-locate on the same node as mcp-company1 so the in-cluster hop
      # from the MCP server to the tunnel server is one node away.
      # Adjust or remove this nodeAffinity to match your hub topology;
      # see docs/installation/node-labels.md.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: rag-type
                    operator: In
                    values:
                      - milvus
      containers:
        - name: tunnel-server
          image: ghcr.io/openspoke/openspoke-tunnel-server:v0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_GRPC_LISTEN
              value: ":8080"
            - name: TUNNEL_METRICS_LISTEN
              value: ":9090"
            # TUNNEL_SPOKES is the per-spoke registry.
            # Format: "<spoke_id>:<hub_listen_port>:<pre-shared token>[,...]".
            # Phase 1 (this release) uses static pre-shared tokens.
            # Phase 3 will replace this with Ed25519 keys.
            - name: TUNNEL_SPOKES
              valueFrom:
                secretKeyRef:
                  name: tunnel-server-spokes
                  key: spokes
          ports:
            - containerPort: 8080
              name: grpc
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
            # Per-spoke reverse-listen ports. Add one entry per spoke that
            # is registered in TUNNEL_SPOKES. See the Service manifest for
            # the matching ClusterIP ports.
            - containerPort: 10001
              name: spoke-1
              protocol: TCP
            - containerPort: 10002
              name: spoke-2
              protocol: TCP
            - containerPort: 10003
              name: spoke-3
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 30
            tcpSocket:
              port: 8080
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
