apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: rag-company1
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: rag-frontend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: rag-frontend
      namespace: rag-company1
    spec:
      containers:
        - command:
            - /bin/bash
            - '-c'
            - >
              echo "Packages pre-installed in Docker image"

              streamlit run /app/app.py --server.port=8501
              --server.address=0.0.0.0
          image: rag-frontend-offline:latest
          imagePullPolicy: IfNotPresent
          name: frontend
          ports:
            - containerPort: 8501
              name: 8501tcp
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /app
              name: code
            - mountPath: /root/.streamlit/config.toml
              name: code
              subPath: .streamlit-config.toml
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: rag-frontend-code-reranking
          name: code
