apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-rag-ollama
  name: ollama
  namespace: rag
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-rag-ollama
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ollama
        workload.user.cattle.io/workloadselector: apps.deployment-rag-ollama
      name: ollama
      namespace: rag
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: gpu
                    operator: In
                    values:
                      - enabled
      containers:
        - env:
            - name: OLLAMA_MODELS
              value: /root/.ollama/models
            - name: OLLAMA_VULKAN
              value: '1'
            - name: OLLAMA_KEEP_ALIVE
              value: '-1'
            - name: OLLAMA_NUM_PARALLEL
              value: '1'
            - name: OLLAMA_MAX_LOADED_MODELS
              value: '1'
          image: ollama/ollama:0.17.7
          imagePullPolicy: Always
          name: ollama
          ports:
            - containerPort: 11434
              name: 11434tcp
              protocol: TCP
          resources:
            limits:
              cpu: '8'
              memory: 32Gi
            requests:
              cpu: '4'
              memory: 10Gi
          securityContext:
            privileged: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /root/.ollama
              name: models-local
            - mountPath: /dev/dri
              name: dev-dri
      dnsPolicy: ClusterFirst
      nodeSelector:
        gpu: enabled
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - hostPath:
            path: /dev/dri
            type: Directory
          name: dev-dri
        - name: models-local
          persistentVolumeClaim:
            claimName: ollama-models-local
