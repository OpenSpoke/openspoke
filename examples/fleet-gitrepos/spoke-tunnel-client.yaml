# Example Fleet GitRepo for deploying the v2.0 spoke-side tunnel client
# to every spoke cluster.
#
# Requires a Secret `tunnel-client-secret` in namespace `rag-spoke` on
# each spoke cluster with:
#   spoke_id: <this spoke's id, matching an entry in tunnel-server-spokes>
#   token:    <pre-shared token issued by the hub admin>
# The token can be the same across identical spokes but should be unique
# per spoke. See docs/installation/reverse-tunnel.md.
#
# Adjust:
#   - spec.repo:    your fork URL or the upstream OpenSpoke repo
#   - spec.branch:  branch to track
#   - spec.targets: cluster selector labels for your spoke clusters
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: spoke-tunnel-client
  namespace: fleet-default
spec:
  repo: https://github.com/OpenSpoke/openspoke.git
  branch: main
  # For private forks, create a Secret in the fleet-default namespace and
  # uncomment the line below:
  # clientSecretName: fleet-git-credentials
  paths:
    - spoke/kubernetes/template/tunnel-client
  pollingInterval: 1m0s
  keepResources: true
  targets:
    - name: spokes
      clusterSelector:
        matchLabels:
          role: spoke
