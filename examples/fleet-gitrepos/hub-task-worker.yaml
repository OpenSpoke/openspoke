# Example Fleet GitRepo for deploying the v2.0 hub-side task-worker.
#
# task-worker executes spawns queued by the kernel via /core/spawn/*.
# Requires:
#   - The kernel with /core/spawn/* endpoints (v2.0 hub-kernel).
#   - Optional Secret `anthropic-api-key` in namespace `rag-company1`
#     with an `api-key` key. Without it, the worker still boots but
#     any picked spawn will fail on the Claude call.
# See docs/concepts/spawn.md.
#
# Adjust:
#   - spec.repo:    your fork URL or the upstream OpenSpoke repo
#   - spec.branch:  branch to track
#   - spec.targets: cluster selector labels for your hub cluster
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: hub-task-worker
  namespace: fleet-default
spec:
  repo: https://github.com/OpenSpoke/openspoke.git
  branch: main
  # For private forks, create a Secret in the fleet-default namespace and
  # uncomment the line below:
  # clientSecretName: fleet-git-credentials
  paths:
    - hub/manifests/task-worker
  pollingInterval: 1m0s
  keepResources: true
  targets:
    - name: hub
      clusterSelector:
        matchLabels:
          role: hub
