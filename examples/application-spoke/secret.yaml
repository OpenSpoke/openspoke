# Application spoke: pre-shared token + spoke id.
#
# Obtain TUNNEL_TOKEN by registering the spoke on the hub:
#   spoke_register(cluster_name="app-example", kind="application", ...)
# and copying the returned token into the value below (base64-encoded).
#
# SPOKE_ID must start with "app-" and match the cluster_name used at
# registration.
apiVersion: v1
kind: Secret
metadata:
  name: kernel-proxy-tunnel
  namespace: example-app
type: Opaque
stringData:
  TUNNEL_TOKEN: "REPLACE_ME_WITH_TOKEN_FROM_spoke_register"
  SPOKE_ID: "app-example"
