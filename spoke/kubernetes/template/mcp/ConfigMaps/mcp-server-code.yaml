    # mcp-company1 から secretary_mails index を直接照会するための定数
    # (本来は domain-neutral にしたいが、 secretary backend 経由ルートが
    #  uvicorn workers=1 のデッドロック気味現象で安定しないため、 やむを得ず直接化)
    SECRETARY_MAILS_INDEX = "secretary_mails"


    async def _fetch_recent_mails(user_id: str, classification: str,
                                    since_hours: int, account_id: str,
                                    size: int = 50) -> dict:
        """secretary_mails index を kernel 経由で直接照会する。

        secretary backend `/secretary/mail/recent` は経由しない (Claude+MCP ループ
        中に uvicorn workers=1 のデッドロック気味現象で届かないため)。
        """
        kernel = _ensure_kernel_url()

        # OpenSearch クエリ構築
        from datetime import datetime, timezone, timedelta
        since_dt = datetime.now(timezone.utc) - timedelta(hours=int(since_hours))
        since_iso = since_dt.strftime("%Y-%m-%dT%H:%M:%S.%fZ")

        filters = [
            {"term": {"user_id.keyword": user_id}},
            {"term": {"classification.keyword": classification}},
            {"range": {"fetched_at": {"gte": since_iso}}},
        ]
        if account_id:
            filters.append({"term": {"account_id.keyword": account_id}})

        os_body = {
            "size": int(size),
            "query": {"bool": {"filter": filters}},
            "_source": [
                "account_id", "account_label", "uid", "subject",
                "from", "to", "date", "summary", "fetched_at", "classification",
            ],
            "sort": [{"fetched_at": {"order": "desc"}}],
        }
        print(f"[DEBUG3] _fetch_recent_mails (kernel direct): cls={classification} since_hours={since_hours} account={account_id or '*'}", flush=True)

        try:
            async with httpx.AsyncClient(timeout=15.0) as client:
                resp = await client.post(
                    f"{kernel}/core/opensearch/request",
                    json={
                        "method": "POST",
                        "path": f"/{SECRETARY_MAILS_INDEX}/_search",
                        "body": os_body,
                    },
                )
                resp.raise_for_status()
                data = resp.json()
        except Exception as e:
            err_msg = f"{type(e).__name__}: {str(e)[:200]}"
            print(f"[DEBUG3] _fetch_recent_mails EXCEPTION: {err_msg}", flush=True)
            return {"ok": False, "error": err_msg}

        os_status = data.get("status_code", 0)
        if os_status != 200:
            err = data.get("error", "")
            print(f"[DEBUG3] _fetch_recent_mails: OS status={os_status}, error={err}", flush=True)
            return {"ok": False, "error": f"OpenSearch returned {os_status}"}

        os_resp = data.get("json") or {}
        hits = (os_resp.get("hits", {}) or {}).get("hits", []) or []
        total = (os_resp.get("hits", {}) or {}).get("total", {}).get("value", len(hits))
        print(f"[DEBUG3] _fetch_recent_mails: total={total} returned={len(hits)}", flush=True)

        # アカウント単位にグルーピング (sort=fetched_at desc は維持)
        groups = {}
        for h in hits:
            src = h.get("_source", {}) or {}
            aid = src.get("account_id", "")
            if aid not in groups:
                groups[aid] = {
                    "account_id": aid,
                    "account_label": src.get("account_label", aid),
                    "mails": [],
                }
            groups[aid]["mails"].append({
                "uid": src.get("uid"),
                "subject": src.get("subject", ""),
                "from": src.get("from", ""),
                "to": src.get("to", ""),
                "date": src.get("date", ""),
                "summary": src.get("summary", ""),
                "fetched_at": src.get("fetched_at", ""),
            })

        return {
            "ok": True,
            "total": total,
            "classification": classification,
            "since_hours": since_hours,
            "account_id": account_id or "*",
            "accounts": list(groups.values()),
        }


    @mcp.tool()
    async def list_recent_human_mails(
        user_id: str,
        since_hours: int = 24,
        account_id: str = "",
    ) -> str:
        """人から届いた最近のメール一覧をアカウントごとに返す (読み取り専用、 承認不要)。

        メールマガジンや自動配信メールは除外され、 「個人から個人への返信に値するメール」
        だけを表示する。 アカウント別にグルーピングされる。

        Args:
            user_id:      利用者 ID
            since_hours:  何時間以内のメールを含むか (default 24 = 直近 1 日)
            account_id:   特定アカウントだけ表示したい場合に指定。 省略時は全アカウント横断
        """
        if not user_id:
            return "エラー: user_id が指定されていません。"

        data = await _fetch_recent_mails(
            user_id=user_id, classification="human",
            since_hours=since_hours, account_id=account_id, size=50,
        )
        if not data.get("ok"):
            return f"取得失敗: {data.get('error', 'unknown')}"

        accounts = data.get("accounts") or []
        total = data.get("total", 0)

        if not accounts:
            scope = f"アカウント '{account_id}'" if account_id else "全アカウント"
            return (
                f"## 直近 {since_hours} 時間以内に人から来たメール ({scope})\n\n"
                f"対象期間内に該当するメールはありません (total=0)。"
            )

        lines = [
            f"## 直近 {since_hours} 時間以内に人から来たメール (合計 {total} 件)\n"
        ]
        for grp in accounts:
            label = grp.get("account_label") or grp.get("account_id", "")
            mails = grp.get("mails") or []
            lines.append(f"### {label}  ({len(mails)} 件)")
            for m in mails:
                subj = m.get("subject") or "(件名なし)"
                frm = m.get("from") or "(差出人不明)"
                date = m.get("date") or m.get("fetched_at") or ""
                lines.append(f"- **{subj}**")
                lines.append(f"  - from: {frm}")
                if date:
                    lines.append(f"  - date: {date}")
            lines.append("")

        return "\n".join(lines)


