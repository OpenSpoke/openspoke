        return await stage_draft(
            user_id=user_id, tool="merge_persons",
            args={"primary_id": primary_id, "sub_id": sub_id},
        )


    async def _query_persons_via_kernel(query_body: dict) -> dict:
        """kernel 経由で secretary_persons index を照会する共通ヘルパー。
        secretary backend を経由しない (デッドロック回避)。
        """
        kernel = _ensure_kernel_url()
        try:
            async with httpx.AsyncClient(timeout=15.0) as client:
                resp = await client.post(
                    f"{kernel}/core/opensearch/request",
                    json={
                        "method": "POST",
                        "path": f"/{SECRETARY_PERSONS_INDEX}/_search",
                        "body": query_body,
                    },
                )
                resp.raise_for_status()
                return resp.json()
        except Exception as e:
            return {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}


    @mcp.tool()
    async def list_persons(
        user_id: str,
        tag: str = "",
        company: str = "",
        size: int = 30,
    ) -> str:
        """登録済み人物の一覧を返す (読み取り専用、 承認不要)。

        更新日時降順で並ぶ。 tag や company で絞り込み可能。

        Args:
            user_id: 利用者 ID
            tag:     タグで絞り込み (任意、 例: "A社")
            company: 会社で絞り込み (任意、 例: "A社")
            size:    最大件数 (default 30、 max 100)
        """
        if not user_id:
            return "エラー: user_id が指定されていません。"

        size = max(1, min(int(size), 100))
        filters = [{"term": {"user_id.keyword": user_id}}]
        if tag:
            filters.append({"term": {"tags.keyword": tag}})
        if company:
            filters.append({"term": {"company.keyword": company}})
        query_body = {
            "size": size,
            "query": {"bool": {"filter": filters}},
            "sort": [{"updated_at": {"order": "desc"}}],
            "_source": [
                "person_id", "name", "display_name", "primary_email", "emails",
                "company", "tags", "mail_count_received", "mail_count_sent",
                "last_contacted_at", "updated_at",
            ],
        }
        data = await _query_persons_via_kernel(query_body)
        if data.get("ok") is False:
            return f"取得失敗: {data.get('error', 'unknown')}"

        os_status = data.get("status_code", 0)
        if os_status not in (200,):
            return f"取得失敗: OpenSearch returned {os_status}"
        os_resp = data.get("json") or {}
        hits = (os_resp.get("hits", {}) or {}).get("hits", []) or []
        total = (os_resp.get("hits", {}) or {}).get("total", {}).get("value", len(hits))
        if not hits:
            return f"## 人物一覧 (合計 0 件)\n\n登録された人物はいません。"

        lines = [f"## 人物一覧 (合計 {total} 件、 表示 {len(hits)} 件)\n"]
        for i, h in enumerate(hits, 1):
            p = h.get("_source", {}) or {}
            name = p.get("name") or "(名前なし)"
            display = p.get("display_name") or ""
            primary = p.get("primary_email") or ""
            company_str = p.get("company") or ""
            recv = p.get("mail_count_received", 0)
            sent = p.get("mail_count_sent", 0)
            last = p.get("last_contacted_at", "") or ""
            head = f"### [{i}] {name}"
            if display:
                head += f" ({display})"
            lines.append(head)
            lines.append(f"- person_id: {p.get('person_id', '')}")
            if primary:
                lines.append(f"- email: {primary}")
            if company_str:
                lines.append(f"- 会社: {company_str}")
            if p.get("tags"):
                lines.append(f"- タグ: {p.get('tags')}")
            lines.append(f"- やり取り: 受信 {recv} 件 / 送信 {sent} 件")
            if last:
                lines.append(f"- 最終やり取り: {last[:19]}")
            lines.append("")
        return "\n".join(lines)


    @mcp.tool()
    async def search_persons(
        user_id: str,
        query: str,
        size: int = 10,
    ) -> str:
        """人物を全文検索する (読み取り専用、 承認不要)。

        name / display_name / aliases / company / department / title /
        tags / note / profile / primary_email / emails の全フィールドから検索する。
        kuromoji + multi_match で日本語も英語も扱える。

        典型的な使い方:
        - 「○○さんって誰？」 → search_persons(user_id, "○○")
        - 「A社の担当者一覧」 → search_persons(user_id, "A社")
        - 「銀行口座の件で連絡してきた人」 → search_persons(user_id, "銀行口座")

        Args:
            user_id: 利用者 ID
            query:   検索クエリ (自然言語、 必須)
            size:    最大件数 (default 10、 max 50)
        """
        if not user_id:
            return "エラー: user_id が指定されていません。"
        if not query:
            return "エラー: query が指定されていません。"

        size = max(1, min(int(size), 50))
        # multi_match (kuromoji ベースの全文検索) に加えて、
        # name.keyword / company.keyword / aliases.keyword に対する wildcard を OR で追加。
        # kuromoji が「テストコーポレーション」 のようなカタカナ複合語を
        # 1 トークンにしてしまい、 「テスト」 の部分一致が match 系では
        # 効かないため、 wildcard で文字単位の部分一致を補う。
        # 数百〜数千件規模では速度低下は感じない。 万件超えなら ngram に乗り換え検討。
        wildcard_value = f"*{query}*"
        query_body = {
            "size": size,
            "query": {"bool": {
                "filter": [{"term": {"user_id.keyword": user_id}}],
                "must": [{"bool": {"should": [
                    {"multi_match": {
                        "query": query,
                        "fields": [
                            "name^3", "display_name^3", "aliases^2",
                            "company^2", "department", "title",
                            "tags^2", "note", "profile",
                            "primary_email", "emails",
                        ],
                    }},
                    {"wildcard": {"name.keyword": {"value": wildcard_value, "boost": 1.5}}},
                    {"wildcard": {"display_name.keyword": {"value": wildcard_value, "boost": 1.5}}},
                    {"wildcard": {"company.keyword": {"value": wildcard_value, "boost": 1.5}}},
                    {"wildcard": {"aliases.keyword": {"value": wildcard_value, "boost": 1.0}}},
                    {"wildcard": {"primary_email.keyword": {"value": wildcard_value, "boost": 1.0}}},
                ], "minimum_should_match": 1}}],
            }},
        }
        data = await _query_persons_via_kernel(query_body)
        if data.get("ok") is False:
            return f"取得失敗: {data.get('error', 'unknown')}"

        os_status = data.get("status_code", 0)
        if os_status != 200:
            return f"取得失敗: OpenSearch returned {os_status}"
        os_resp = data.get("json") or {}
        hits = (os_resp.get("hits", {}) or {}).get("hits", []) or []
        if not hits:
            return f"クエリ '{query}' に該当する人物は見つかりませんでした。"

        lines = [f"## 人物検索結果 ({len(hits)} 件) クエリ: '{query}'\n"]
        for i, h in enumerate(hits, 1):
            p = h.get("_source", {}) or {}
            score = h.get("_score", 0.0)
            name = p.get("name") or "(名前なし)"
            display = p.get("display_name") or ""
            primary = p.get("primary_email") or ""
            company_str = p.get("company") or ""
            head = f"### [{i}] {name}"
            if display:
                head += f" ({display})"
            head += f"  score={score:.2f}"
            lines.append(head)
            lines.append(f"- person_id: {p.get('person_id', '')}")
            if primary:
                lines.append(f"- email: {primary}")
            if company_str:
                lines.append(f"- 会社: {company_str}")
            if p.get("tags"):
                lines.append(f"- タグ: {p.get('tags')}")
            note = (p.get("note") or "").strip()
            if note:
                lines.append(f"- メモ: {note[:120]}")
            profile = (p.get("profile") or "").strip()
            if profile:
                lines.append(f"- プロファイル抜粋: {profile[:160]}")
            lines.append("")
        return "\n".join(lines)


    @mcp.tool()
    async def get_person_detail(
        user_id: str,
        person_id: str,
        include_recent_mails: bool = True,
    ) -> str:
        """1 人物の詳細情報を返す (読み取り専用、 承認不要)。

        構造化フィールド + 自由記述プロファイル + 最近のメール履歴をまとめて返す。
        「○○さんとはどんな関係?」「最近何の話してたっけ?」 等の問いに答えるための tool。

        Args:
            user_id:              利用者 ID
            person_id:            対象人物 ID
            include_recent_mails: True なら直近のメール履歴 (最大 5 件) も含める
        """
        if not user_id or not person_id:
            return "エラー: user_id と person_id は必須です。"

        # 人物本体を取得
        kernel = _ensure_kernel_url()
        try:
            async with httpx.AsyncClient(timeout=15.0) as client:
                resp = await client.post(
                    f"{kernel}/core/opensearch/request",
                    json={
                        "method": "GET",
                        "path": f"/{SECRETARY_PERSONS_INDEX}/_doc/{person_id}",
                    },
                )
                resp.raise_for_status()
                data = resp.json()
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        os_status = data.get("status_code", 0)
        if os_status == 404:
            return f"person_id={person_id} は存在しません。"
        if os_status != 200:
            return f"取得失敗: OpenSearch returned {os_status}"

        os_resp = data.get("json") or {}
        p = os_resp.get("_source") or {}
        if p.get("user_id") != user_id:
            return "エラー: 他のユーザーの人物は参照できません。"

        lines = []
        name = p.get("name") or "(名前なし)"
        display = p.get("display_name") or ""
        head = f"## {name}"
        if display:
            head += f" ({display})"
        lines.append(head)
        lines.append(f"- person_id: {p.get('person_id', '')}")
        if p.get("emails"):
            lines.append(f"- メアド: {p.get('emails')}")
        if p.get("primary_email"):
            lines.append(f"- 主メアド: {p.get('primary_email')}")
        if p.get("aliases"):
            lines.append(f"- 別名: {p.get('aliases')}")
        if p.get("company"):
            lines.append(f"- 会社: {p.get('company')}")
        if p.get("department"):
            lines.append(f"- 部署: {p.get('department')}")
        if p.get("title"):
            lines.append(f"- 役職: {p.get('title')}")
        if p.get("tags"):
            lines.append(f"- タグ: {p.get('tags')}")
        recv = p.get("mail_count_received", 0)
        sent = p.get("mail_count_sent", 0)
        lines.append(f"- やり取り: 受信 {recv} 件 / 送信 {sent} 件")
        if p.get("first_seen_at"):
            lines.append(f"- 初観測: {p.get('first_seen_at', '')[:19]}")
        if p.get("last_contacted_at"):
            lines.append(f"- 最終やり取り: {p.get('last_contacted_at', '')[:19]}")
        if p.get("learned_from"):
            lines.append(f"- 由来: {p.get('learned_from')}")
        if p.get("note"):
            lines.append(f"\n### メモ\n{p.get('note', '')}")
        if p.get("profile"):
            lines.append(f"\n### プロファイル\n{p.get('profile', '')}")

        # 最近のメール履歴
        if include_recent_mails and p.get("emails"):
            try:
                from_terms = [{"match": {"from": e}} for e in (p.get("emails") or [])]
                mail_query = {
                    "size": 5,
                    "query": {"bool": {
                        "filter": [{"term": {"user_id.keyword": user_id}}],
                        "should": from_terms,
                        "minimum_should_match": 1,
                    }},
                    "_source": ["uid", "subject", "from", "date",
                                "classification", "summary"],
                    "sort": [{"fetched_at": {"order": "desc"}}],
                }
                async with httpx.AsyncClient(timeout=15.0) as client:
                    resp = await client.post(
                        f"{kernel}/core/opensearch/request",
                        json={
                            "method": "POST",
                            "path": "/secretary_mails/_search",
                            "body": mail_query,
                        },
                    )
                    resp.raise_for_status()
                    mdata = resp.json()
                if mdata.get("status_code") == 200:
                    mhits = (((mdata.get("json") or {}).get("hits", {})
                              ).get("hits", [])) or []
                    if mhits:
                        lines.append(f"\n### 最近のメール ({len(mhits)} 件)")
                        for m in mhits:
                            ms = m.get("_source", {}) or {}
                            lines.append(
                                f"- [{(ms.get('date') or '')[:25]}] "
                                f"({ms.get('classification', '?')}) "
                                f"{ms.get('subject', '')[:60]}"
                            )
            except Exception as e:
                lines.append(f"\n(注: メール履歴取得失敗: {e})")

        return "\n".join(lines)


    @mcp.tool()
    async def send_slack_dm(
        user_id: str,
        text: str,
        recipient_slack_id: str = "",
    ) -> str:
        """Slack で DM を送る。

        Bot Token は knowledge id="slack_bot_token" から読み込む。
        宛先 Slack User ID は recipient_slack_id 引数を最優先、 なければ
        knowledge id="slack_user_id" の content (= the operator自身の Slack ID) を使う。

        典型的な使い方:
        - 「○○からメール来たら Slack に通知して」 routine の実行担当として
        - 「重要なことが起きたら Slack で教えて」 等の能動通知
        - 「△△さん (Slack ID U07XXXXXX) にこの件を伝えて」 → recipient_slack_id 指定

        前提: the operatorが事前に knowledge に Bot Token と Slack User ID を登録済み。
        未登録の場合はエラーを返す。

        Args:
            user_id:           the assistant systemの利用者 ID (knowledge collection の特定に使用)
            text:              送信するテキスト本文 (必須)
            recipient_slack_id: 宛先の Slack User ID。 省略時は knowledge の slack_user_id
                                (= the operator自身) に送る
        """
        if not user_id:
            return "エラー: user_id が指定されていません。"
        if not text:
            return "エラー: text が指定されていません。"

        kernel = _ensure_kernel_url()
        collection_name = _resolve_knowledge_collection(user_id)
        if not collection_name:
            return "エラー: namespace が解決できません。"

        # 1. knowledge から Bot Token を取得
        try:
            t_resp = await _client.post(
                f"{kernel}/core/vectorstore/query",
                json={
                    "namespace": collection_name,
                    "expr": 'id == "slack_bot_token"',
                    "output_fields": ["id", "content"],
                    "limit": 1,
                },
                timeout=15,
            )
            t_resp.raise_for_status()
            t_data = t_resp.json()
        except Exception as e:
            return f"Bot Token 取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if not t_data.get("ok"):
            return f"Bot Token 取得失敗: {t_data.get('error', 'unknown')}"
        t_results = t_data.get("results") or []
        if not t_results:
            return (
                "エラー: Slack Bot Token が登録されていません。\n"
                "the operatorに「Slack の Bot Token を xoxb-... で登録して」 と頼んで、\n"
                "knowledge id=\"slack_bot_token\" に保存してください。"
            )
        bot_token = (t_results[0].get("content") or "").strip()
        if not bot_token:
            return "エラー: 登録されている Bot Token が空文字です。"

        # 2. 宛先 Slack User ID を解決
        slack_user_id = (recipient_slack_id or "").strip()
        if not slack_user_id:
            try:
                u_resp = await _client.post(
                    f"{kernel}/core/vectorstore/query",
                    json={
                        "namespace": collection_name,
                        "expr": 'id == "slack_user_id"',
                        "output_fields": ["id", "content"],
                        "limit": 1,
                    },
                    timeout=15,
                )
                u_resp.raise_for_status()
                u_data = u_resp.json()
                u_results = (u_data.get("results") or []) if u_data.get("ok") else []
                if u_results:
                    slack_user_id = (u_results[0].get("content") or "").strip()
            except Exception as e:
                return f"宛先 Slack ID 取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if not slack_user_id:
            return (
                "エラー: 宛先 Slack User ID が指定されておらず、 knowledge の "
                "id=\"slack_user_id\" にも登録されていません。\n"
                "recipient_slack_id 引数を指定するか、 the operatorに Slack User ID の "
                "登録を依頼してください (knowledge id=\"slack_user_id\")。"
            )

        # 3. kernel /core/slack/send-dm に委譲
        try:
            s_resp = await _client.post(
                f"{kernel}/core/slack/send-dm",
                json={
                    "bot_token": bot_token,
                    "slack_user_id": slack_user_id,
                    "text": text,
                },
                timeout=15,
            )
            s_resp.raise_for_status()
            s_data = s_resp.json()
        except Exception as e:
            return f"Slack DM 送信失敗: {type(e).__name__}: {str(e)[:200]}"

        if not s_data.get("ok"):
            return f"Slack DM 送信失敗: {s_data.get('error', 'unknown')}"

        text_preview = text[:80] + ("…" if len(text) > 80 else "")
        return (
            f"Slack DM を送信しました。\n"
            f"- 宛先 Slack User ID: {slack_user_id}\n"
            f"- 本文: {text_preview}"
        )


    @mcp.tool()
    async def send_mattermost_dm(
        user_id: str,
        text: str,
        recipient_user_id: str = "",
        base_url: str = "",
    ) -> str:
        """Mattermost で DM を送る。

        Bot Token / Bot User ID / 宛先 User ID / Base URL は knowledge から読み込む:
          - id="mattermost_bot_token": Bot の Personal Access Token (必須、 secret)
          - id="mattermost_bot_user_id": Bot 自身の Mattermost user id (必須、 26 文字)
          - id="mattermost_user_id": デフォルト送信先 (the operator自身) の Mattermost user id
          - id="mattermost_base_url": Mattermost サーバの URL (例: https://chat.example.com)

        recipient_user_id 引数を指定するとデフォルト送信先より優先される。
        base_url 引数を指定すると knowledge より優先される。

        典型的な使い方:
        - 「○○からメール来たら Mattermost にも通知して」 routine の実行担当として
        - 「重要なことが起きたら Mattermost で教えて」 等の能動通知
        - 「△△さん (Mattermost user id zzz...) にこの件を伝えて」 → recipient_user_id 指定

        前提: the operatorが事前に knowledge に Bot Token / Bot User ID / 自分の User ID /
        (任意で) Base URL を登録済み。 必要なものが欠けている場合はエラーを返す。

        Args:
            user_id:           the assistant systemの利用者 ID (knowledge collection 特定に使用)
            text:              送信するテキスト本文 (必須)
            recipient_user_id: 宛先の Mattermost user id (26 文字)。
                               省略時は knowledge の mattermost_user_id (= the operator自身)
            base_url:          Mattermost サーバ URL (https://...、 末尾スラッシュ無し)。
                               省略時は knowledge の mattermost_base_url
        """
        if not user_id:
            return "エラー: user_id が指定されていません。"
        if not text:
            return "エラー: text が指定されていません。"

        kernel = _ensure_kernel_url()
        collection_name = _resolve_knowledge_collection(user_id)
        if not collection_name:
            return "エラー: namespace が解決できません。"

        async def _read_knowledge(entry_id: str) -> str:
            """knowledge collection から特定 id の content を取得 (空なら "")。"""
            try:
                r = await _client.post(
                    f"{kernel}/core/vectorstore/query",
                    json={
                        "namespace": collection_name,
                        "expr": f'id == "{entry_id}"',
                        "output_fields": ["id", "content"],
                        "limit": 1,
                    },
                    timeout=15,
                )
                r.raise_for_status()
                d = r.json()
            except Exception:
                return ""
            if not d.get("ok"):
                return ""
            results = d.get("results") or []
            if not results:
                return ""
            return (results[0].get("content") or "").strip()

        # 1. Bot Token
        bot_token = await _read_knowledge("mattermost_bot_token")
        if not bot_token:
            return (
                "エラー: Mattermost Bot Token が登録されていません。\n"
                "the operatorに「Mattermost の Bot Token を覚えて」 と頼んで、 \n"
                "knowledge id=\"mattermost_bot_token\" に保存してください。"
            )

        # 2. Bot 自身の user_id
        bot_user_id = await _read_knowledge("mattermost_bot_user_id")
        if not bot_user_id:
            return (
                "エラー: Mattermost Bot User ID が登録されていません。\n"
                "Bot Token で /api/v4/users/me を叩くと取得できる 26 文字の id を、 \n"
                "knowledge id=\"mattermost_bot_user_id\" に保存してください。"
            )

        # 3. 宛先 user_id
        target_user_id = (recipient_user_id or "").strip()
        if not target_user_id:
            target_user_id = await _read_knowledge("mattermost_user_id")
        if not target_user_id:
            return (
                "エラー: 宛先 Mattermost User ID が指定されておらず、 knowledge の \n"
                "id=\"mattermost_user_id\" にも登録されていません。\n"
                "recipient_user_id 引数を指定するか、 the operator自身の Mattermost user id の\n"
                "登録を依頼してください。"
            )

        # 4. base_url
        target_base_url = (base_url or "").strip().rstrip("/")
        if not target_base_url:
            stored = await _read_knowledge("mattermost_base_url")
            target_base_url = stored.rstrip("/")
        if not target_base_url:
            return (
                "エラー: Mattermost base_url が指定されておらず、 knowledge の \n"
                "id=\"mattermost_base_url\" にも登録されていません。\n"
                "base_url 引数を指定するか、 サーバ URL (例: https://chat.example.com) を\n"
                "knowledge に保存してください。"
            )

        # 5. kernel /core/mattermost/send-dm に委譲
        try:
            m_resp = await _client.post(
                f"{kernel}/core/mattermost/send-dm",
                json={
                    "base_url": target_base_url,
                    "bot_token": bot_token,
                    "bot_user_id": bot_user_id,
                    "recipient_user_id": target_user_id,
                    "text": text,
                },
                timeout=20,
            )
            m_resp.raise_for_status()
            m_data = m_resp.json()
        except Exception as e:
            return f"Mattermost DM 送信失敗: {type(e).__name__}: {str(e)[:200]}"

        if not m_data.get("ok"):
            return f"Mattermost DM 送信失敗: {m_data.get('error', 'unknown')}"

        text_preview = text[:80] + ("…" if len(text) > 80 else "")
        post_id = m_data.get("post_id") or "(不明)"
        return (
            f"Mattermost DM を送信しました。\n"
            f"- サーバ: {target_base_url}\n"
            f"- 宛先 User ID: {target_user_id}\n"
            f"- post_id: {post_id}\n"
            f"- 本文: {text_preview}"
        )


    # ────────────────────────────────────────────────────────────────────────
    # Kubernetes observability (read-only)
    # ────────────────────────────────────────────────────────────────────────
    # kernel /core/k8s/* のラッパー。 the assistant経由で外部 LLM が Kubernetes クラスタの
    # pod / deployment / logs / events を read-only で観測できる。
    # 実装は kernel side の k8s_observer.py が担当。 kernel pod が
    # ServiceAccount=rag-backend-kernel + ClusterRole=rag-backend-kernel-observer
    # で動いており、 in-cluster config で kube API を叩く。

    @mcp.tool()
    async def k8s_list_pods(namespace: str) -> str:
        """指定 namespace の pod 一覧を返す。

        各 pod の phase / ready / restart 回数 / age / node 等を含む。
        「○○ namespace の pod は元気?」「再起動が多い pod は?」 等の確認に使う。

        Args:
            namespace: 対象 namespace (任意の namespace 名を指定可)
                       例: rag-company1 / secretary / mcp / rag / pdf-converter /
                       opensearch / milvus / memgraph / valkey / keycloak /
                       kube-system / cattle-fleet-system 等
        """
        kernel = _ensure_kernel_url()
        if not namespace:
            return "エラー: namespace が指定されていません。"
        try:
            resp = await _client.get(
                f"{kernel}/core/k8s/pods",
                params={"namespace": namespace},
                timeout=30,
            )
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if resp.status_code != 200:
            return f"取得失敗: HTTP {resp.status_code}: {resp.text[:200]}"
        data = resp.json()
        pods = data.get("pods", [])
        count = data.get("count", len(pods))
        if not pods:
            return f"namespace={namespace} に pod はありません (count=0)。"

        lines = [f"## Pods in {namespace} ({count} 件)\n"]
        for i, p in enumerate(pods, 1):
            phase = p.get("phase", "?")
            ready = p.get("ready", "?")
            restarts = p.get("restarts", 0)
            age = p.get("age_seconds", 0)
            age_str = _format_age(age)
            node = p.get("node", "")
            lines.append(
                f"### [{i}] {p.get('name', '')}"
            )
            lines.append(
                f"- phase={phase}  ready={ready}  restarts={restarts}  age={age_str}"
                + (f"  node={node}" if node else "")
            )
            # コンテナごとの状態 (異常時に有用)
            for c in p.get("containers", []):
                cstate = c.get("state", {}) or {}
                cphase = cstate.get("phase", "?")
                if cphase == "running":
                    continue  # 正常時は省略
                reason = cstate.get("reason", "")
                msg = (cstate.get("message", "") or "")[:120]
                lines.append(
                    f"  - container '{c.get('name', '')}' state={cphase}"
                    + (f" reason={reason}" if reason else "")
                    + (f" msg={msg}" if msg else "")
                )
            lines.append("")
        return "\n".join(lines)


    @mcp.tool()
    async def k8s_get_pod(namespace: str, name: str) -> str:
        """指定 pod の詳細情報を返す (annotations / labels / conditions 含む)。

        annotations.restarted-at が見たい時 (Pod が新仕様で再起動したか確認) や、
        CrashLoopBackOff の理由を conditions で確認したい時に使う。

        Args:
            namespace: 対象 namespace
            name:      対象 pod 名
        """
        kernel = _ensure_kernel_url()
        if not namespace or not name:
            return "エラー: namespace と name は必須です。"
        try:
            resp = await _client.get(
                f"{kernel}/core/k8s/pod/{namespace}/{name}",
                timeout=30,
            )
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if resp.status_code == 404:
            return f"pod が存在しません: {namespace}/{name}"
        if resp.status_code != 200:
            return f"取得失敗: HTTP {resp.status_code}: {resp.text[:200]}"
        p = resp.json()

        lines = [f"## Pod {namespace}/{name}\n"]
        lines.append(f"- phase: {p.get('phase', '?')}")
        lines.append(f"- ready: {p.get('ready', '?')}")
        lines.append(f"- restarts: {p.get('restarts', 0)}")
        lines.append(f"- age: {_format_age(p.get('age_seconds', 0))}")
        if p.get("node"):
            lines.append(f"- node: {p.get('node')}")
        if p.get("pod_ip"):
            lines.append(f"- pod_ip: {p.get('pod_ip')}")
        if p.get("creation_timestamp"):
            lines.append(f"- creation: {p.get('creation_timestamp')}")

        # labels と annotations (大事なものを抜粋)
        labels = p.get("labels", {}) or {}
        if labels:
            lines.append(f"\n### Labels")
            for k, v in labels.items():
                lines.append(f"- {k}: {v}")

        annotations = p.get("annotations", {}) or {}
        if annotations:
            lines.append(f"\n### Annotations")
            for k, v in annotations.items():
                v_str = str(v)
                if len(v_str) > 200:
                    v_str = v_str[:200] + "…"
                lines.append(f"- {k}: {v_str}")

        # init containers
        init = p.get("init_containers", []) or []
        if init:
            lines.append(f"\n### Init Containers")
            for c in init:
                cstate = c.get("state", {}) or {}
                lines.append(
                    f"- {c.get('name', '')} state={cstate.get('phase', '?')}"
                    f"  ready={c.get('ready', False)}  restarts={c.get('restart_count', 0)}"
                )

        # main containers
        containers = p.get("containers", []) or []
        if containers:
            lines.append(f"\n### Containers")
            for c in containers:
                cstate = c.get("state", {}) or {}
                lines.append(
                    f"- {c.get('name', '')} state={cstate.get('phase', '?')}"
                    f"  ready={c.get('ready', False)}  restarts={c.get('restart_count', 0)}"
                    f"  image={c.get('image', '')}"
                )
                if cstate.get("reason"):
                    lines.append(f"  - reason: {cstate.get('reason')}")
                if cstate.get("message"):
                    lines.append(f"  - message: {(cstate.get('message') or '')[:200]}")

        # conditions
        conds = p.get("conditions", []) or []
        if conds:
            lines.append(f"\n### Conditions")
            for c in conds:
                lines.append(
                    f"- {c.get('type', '?')}: {c.get('status', '?')}"
                    + (f" ({c.get('reason')})" if c.get('reason') else "")
                )
                if c.get("message"):
                    lines.append(f"  - {c.get('message')}")

        return "\n".join(lines)


    @mcp.tool()
    async def k8s_get_logs(
        namespace: str,
        pod: str,
        container: str = "",
        tail: int = 200,
        since_seconds: int = 0,
        previous: bool = False,
        timestamps: bool = False,
    ) -> str:
        """指定 pod の container ログを取得する。

        典型的な用途:
        - エラー調査: 「○○ pod のログ最新 200 行」 → tail=200
        - 直近 5 分: since_seconds=300
        - クラッシュ原因: previous=True で再起動前のログ取得
        - JWT / api-key / password などの機密値はサーバ側で *** にマスクされる

        Args:
            namespace:     対象 namespace
            pod:           対象 pod 名
            container:     コンテナ名 (省略時は最初のコンテナ)
            tail:          末尾何行取得するか (default 200, 最大 1000)
            since_seconds: 何秒前以降のログだけか (default 0=制限なし、 最大 3600)
            previous:      True で再起動前のインスタンスのログ取得 (default False)
            timestamps:    True で各行に ISO8601 timestamp を前置 (default False)
        """
        kernel = _ensure_kernel_url()
        if not namespace or not pod:
            return "エラー: namespace と pod は必須です。"
        params: dict = {
            "tail": int(tail),
            "previous": str(bool(previous)).lower(),
            "timestamps": str(bool(timestamps)).lower(),
        }
        if container:
            params["container"] = container
        if since_seconds and since_seconds > 0:
            params["since_seconds"] = int(since_seconds)

        try:
            resp = await _client.get(
                f"{kernel}/core/k8s/logs/{namespace}/{pod}",
                params=params,
                timeout=60,
            )
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if resp.status_code == 404:
            return f"pod または container が存在しません: {namespace}/{pod}/{container or '<first>'}"
        if resp.status_code == 400:
            return f"リクエスト不正: {resp.text[:200]}"
        if resp.status_code != 200:
            return f"取得失敗: HTTP {resp.status_code}: {resp.text[:200]}"
        data = resp.json()

        logs = data.get("logs", "") or ""
        line_count = data.get("line_count", 0)
        truncated = data.get("truncated", False)
        elapsed = data.get("elapsed_sec", 0.0)

        header_parts = [
            f"## Logs {namespace}/{pod}/{container or '<first>'}",
            f"({line_count} 行, elapsed={elapsed:.2f}s"
            + (", **truncated**" if truncated else "")
            + (f", previous=True" if previous else "")
            + (f", since={since_seconds}s" if since_seconds else "")
            + ")",
        ]
        if not logs:
            return " ".join(header_parts) + "\n\n(ログなし)"
        return " ".join(header_parts) + "\n\n```\n" + logs + "\n```"


    @mcp.tool()
    async def k8s_list_deployments(namespace: str) -> str:
        """指定 namespace の deployment 一覧を返す。

        replicas (desired/ready/available) と annotations の restarted-at を表示する。
        「○○ deployment は最後にいつ再起動した?」「rollout は完了した?」 等の確認に使う。

        Args:
            namespace: 対象 namespace
        """
        kernel = _ensure_kernel_url()
        if not namespace:
            return "エラー: namespace が指定されていません。"
        try:
            resp = await _client.get(
                f"{kernel}/core/k8s/deployments",
                params={"namespace": namespace},
                timeout=30,
            )
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if resp.status_code != 200:
            return f"取得失敗: HTTP {resp.status_code}: {resp.text[:200]}"
        data = resp.json()
        deps = data.get("deployments", [])
        count = data.get("count", len(deps))
        if not deps:
            return f"namespace={namespace} に deployment はありません。"

        lines = [f"## Deployments in {namespace} ({count} 件)\n"]
        for i, d in enumerate(deps, 1):
            desired = d.get("replicas_desired", 0)
            ready = d.get("replicas_ready", 0)
            available = d.get("replicas_available", 0)
            updated = d.get("replicas_updated", 0)
            age = _format_age(d.get("age_seconds", 0))
            lines.append(f"### [{i}] {d.get('name', '')}")
            lines.append(
                f"- replicas: ready={ready}/{desired}  available={available}  updated={updated}"
            )
            lines.append(f"- age: {age}")
            generation = d.get("generation", 0)
            observed = d.get("observed_generation", 0)
            if generation != observed:
                lines.append(f"- generation: {generation} (observed: {observed}) ← rollout 進行中の可能性")
            else:
                lines.append(f"- generation: {generation} (observed: {observed})")
            restart_at = d.get("annotations_restarted_at", "")
            if restart_at:
                lines.append(f"- restarted-at (custom): {restart_at}")
            kubectl_restart = d.get("annotations_kubectl_restarted_at", "")
            if kubectl_restart:
                lines.append(f"- restartedAt (kubectl): {kubectl_restart}")
            lines.append("")
        return "\n".join(lines)


    @mcp.tool()
    async def local_fleet_state() -> str:
        """自クラスタの Fleet GitOps state (Bundle / BundleDeployment / Cluster) を
        compact JSON で返す (read-only)。

        kernel /core/k8s/fleet-state エンドポイントを呼ぶ。 kernel 側で必要 field だけ
        抽出済なので、 cluster_k8s_get で fleet.cattle.io 系を直接取得した時のような
        巨大 payload にならない (cluster_k8s_get は status.resources や managedFields
        が含まれて MCP 応答サイズ上限を超える)。

        Fleet 配下に組み込まれていないクラスタや、 Fleet サーバ本体以外のクラスタでは
        BundleDeployment しか存在しない (Bundle / Cluster CR は空)。 Fleet サーバ本体
        クラスタ (fleet-cluster) のみで全件 (Bundle, BundleDeployment, Cluster) が返る。

        返り値 (JSON 文字列):
          {
            "clusters": [{"name", "cluster_name", "ns_for_bd", "ready_bundles", "state", "conditions_kv"}, ...],
            "bundles":  [{"name", "namespace", "gitrepo", "summary", "display_state", "conditions_kv", "ready_message"}, ...],
            "bundle_deployments": [{"name", "namespace", "bundle", "gitrepo", "deployed", "ready",
                                    "modified_count", "non_ready_count", "modified_status", "non_ready_status",
                                    "display_state", "conditions_kv", "ready_message"}, ...],
            "errors": [...],
            "counts": {"clusters": N, "bundles": N, "bundle_deployments": N}
          }

        利用者: fleet-state-publisher CronJob (rag-company1/rag) が hub MCP の
        cluster_local_fleet_state ラッパー経由で呼ぶ。
        """
        import json as _json
        kernel = _ensure_kernel_url()
        try:
            resp = await _client.get(
                f"{kernel}/core/k8s/fleet-state",
                timeout=60,
            )
        except Exception as e:
            return _json.dumps({
                "error": f"{type(e).__name__}: {str(e)[:200]}",
                "clusters": [], "bundles": [], "bundle_deployments": [],
            })

        if resp.status_code != 200:
            return _json.dumps({
                "error": f"HTTP {resp.status_code}: {resp.text[:200]}",
                "clusters": [], "bundles": [], "bundle_deployments": [],
            })
        # kernel は dict を返す。 JSON 文字列に直してそのまま戻す。
        return _json.dumps(resp.json(), ensure_ascii=False)


    @mcp.tool()
    async def minio_sync_to_opensearch(
        prefix: str = "",
        bucket: str = "",
        max_keys: int = 10000,
        clear_first: bool = False,
    ) -> str:
        """MinIO バケット内のオブジェクト一覧を OpenSearch index=minio_inventory にダンプする。

        ダンプ後は opensearch_search で index="minio_inventory" を引けば、 ファイル名・サイズ・
        最終更新日時等を確認できる。 PVC データロスト後の MinIO 残存データ調査に使う。

        Args:
            prefix: 先頭一致フィルタ (空なら全件)
            bucket: バケット名 (空なら kernel の MINIO_BUCKET=contracts)
            max_keys: 最大同期件数 (default 10000、 最大 100000)
            clear_first: True なら同期前に index 削除→再作成 (MinIO 上で削除済みのドキュメントも消える)

        Returns:
            human-readable な実行結果サマリ。
        """
        kernel = _ensure_kernel_url()
        try:
            resp = await _client.post(
                f"{kernel}/core/minio/sync-to-opensearch",
                json={
                    "prefix": prefix or "",
                    "bucket": bucket or "",
                    "max_keys": int(max_keys),
                    "clear_first": bool(clear_first),
                },
                timeout=300,  # 大量同期に備えて長め
            )
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if resp.status_code != 200:
            return f"取得失敗: HTTP {resp.status_code}: {resp.text[:300]}"
        data = resp.json()
        lines = [
            f"## MinIO → OpenSearch sync 完了",
            f"- bucket: {data.get('bucket', '')}",
            f"- prefix: '{data.get('prefix', '')}'",
            f"- indexed: {data.get('indexed', 0)} 件",
            f"- errors: {data.get('errors', 0)} 件",
            f"- max_keys: {data.get('max_keys', 0)}",
            f"- cleared: {data.get('cleared', False)}",
            f"- synced_at: {data.get('synced_at', '')}",
            f"- index: {data.get('index', '')}",
            "",
            "## 次のステップ",
            "opensearch_search で index='minio_inventory' を引いて中身を確認してください。",
            "例: query_dsl={'match_all': {}} 、 sort=[{'name': 'asc'}]",
        ]
        return "\n".join(lines)


    @mcp.tool()
    async def minio_list(
        prefix: str = "",
        bucket: str = "",
        recursive: bool = True,
        max_keys: int = 200,
    ) -> str:
        """MinIO バケット内のオブジェクトを一覧する (kernel /core/minio/list 経由)。

        アプリケーションが MinIO に保存するファイル (DOCX 等) の一覧を取得する。
        PVC が消えた時の調査や、 何がオブジェクトストレージに残っているかの確認に使う。

        典型的な使い方:
            - 「バケットに何が残っているか確認」: minio_list(prefix="")
            - 「特定 prefix のファイル一覧」: minio_list(prefix="template_")
            - 「特定 user のファイル一覧」: minio_list(prefix="user_id/")

        Args:
            prefix: 先頭一致フィルタ。 空なら全件 (max_keys まで)
            bucket: バケット名。 空なら kernel の MINIO_BUCKET を使う
            recursive: True (default) ならサブディレクトリを展開して全オブジェクト列挙
            max_keys: 最大返却件数 (default 200、 最大 10000)

        Returns:
            human-readable な一覧テキスト。 size / last_modified も含む。
        """
        kernel = _ensure_kernel_url()
        try:
            resp = await _client.get(
                f"{kernel}/core/minio/list",
                params={
                    "prefix": prefix or "",
                    "bucket": bucket or "",
                    "recursive": "true" if recursive else "false",
                    "max_keys": int(max_keys),
                },
                timeout=30,
            )
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if resp.status_code != 200:
            return f"取得失敗: HTTP {resp.status_code}: {resp.text[:300]}"
        data = resp.json()
        objs = data.get("objects", [])
        count = data.get("count", len(objs))
        truncated = data.get("truncated", False)
        bucket_name = data.get("bucket", "")
        prefix_used = data.get("prefix", "")

        if not objs:
            return f"bucket={bucket_name} prefix='{prefix_used}' にオブジェクトはありません (count=0)。"

        lines = [
            f"## MinIO objects in bucket='{bucket_name}' prefix='{prefix_used}' ({count} 件{' / truncated' if truncated else ''})\n"
        ]
        # 表示: name に加えて size (人が読める単位) と last_modified を併記
        def _fmt_size(n):
            if n is None:
                return "-"
            try:
                n = int(n)
            except Exception:
                return str(n)
            if n < 1024:
                return f"{n} B"
            if n < 1024 * 1024:
                return f"{n / 1024:.1f} KB"
            if n < 1024 * 1024 * 1024:
                return f"{n / (1024 * 1024):.1f} MB"
            return f"{n / (1024 * 1024 * 1024):.2f} GB"

        for o in objs:
            name = o.get("name", "")
            size = _fmt_size(o.get("size"))
            lm = (o.get("last_modified") or "")[:19]  # ISO date+time だけ
            is_dir = o.get("is_dir", False)
            mark = "[DIR]" if is_dir else "     "
            lines.append(f"- {mark} {name}  ({size}, {lm})")
        if truncated:
            lines.append("")
            lines.append(f"※ {count} 件で打ち切り (truncated=true)。 max_keys を増やすか prefix で絞ってください。")
        return "\n".join(lines)


    @mcp.tool()
    async def k8s_list_events(
        namespace: str,
        since_seconds: int = 600,
        type_filter: str = "",
    ) -> str:
        """指定 namespace の event 一覧を返す。

        ImagePullBackOff / OOMKilled / FailedScheduling / FailedMount 等の異常検知に使う。
        新しい順に並ぶ。

        Args:
            namespace:     対象 namespace
            since_seconds: 何秒前以降の event を取得するか (default 600=10分、 最大 86400)
            type_filter:   "Warning" だけ見たい時に指定。 "" なら全件
        """
        kernel = _ensure_kernel_url()
        if not namespace:
            return "エラー: namespace が指定されていません。"
        params = {
            "namespace": namespace,
            "since_seconds": int(since_seconds),
        }
        if type_filter:
            params["type_filter"] = type_filter

        try:
            resp = await _client.get(
                f"{kernel}/core/k8s/events",
                params=params,
                timeout=30,
            )
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if resp.status_code != 200:
            return f"取得失敗: HTTP {resp.status_code}: {resp.text[:200]}"
        data = resp.json()
        events = data.get("events", [])
        count = data.get("count", len(events))
        type_str = data.get("type_filter", "all")
        if not events:
            return (
                f"namespace={namespace} の直近 {since_seconds} 秒に "
                f"event はありません (type={type_str})。"
            )

        lines = [
            f"## Events in {namespace} ({count} 件, "
            f"since={since_seconds}s, type={type_str})\n"
        ]
        for i, e in enumerate(events, 1):
            etype = e.get("type", "?")
            reason = e.get("reason", "")
            msg = (e.get("message", "") or "")[:200]
            count_e = e.get("count", 0)
            ts = e.get("last_timestamp") or e.get("first_timestamp") or ""
            inv = e.get("involved_object") or {}
            inv_str = ""
            if inv:
                inv_str = f"{inv.get('kind', '')}/{inv.get('name', '')}"
            head = f"### [{i}] {etype} {reason}"
            if count_e > 1:
                head += f" ×{count_e}"
            lines.append(head)
            if inv_str:
                lines.append(f"- target: {inv_str}")
            if ts:
                lines.append(f"- last: {ts}")
            if msg:
                lines.append(f"- {msg}")
            lines.append("")
        return "\n".join(lines)


    @mcp.tool()
    async def maintenance_mode_status(
        application: str,
    ) -> str:
        """指定アプリケーションのメンテナンスモード状態を取得する。

        メンテナンスモード中の間は supervisor (自動監視・修復) が停止する。

        戻り値の文字列には次の情報が含まれる:
        - enabled (true/false)
        - started_at (開始時刻、 ISO8601 UTC)
        - expires_at (自動解除予定時刻、 ISO8601 UTC、 期限なしなら空)
        - reason (開始理由)
        - started_by (開始操作者)
        - auto_expired (今回の取得で期限切れによる自動解除が走ったか)

        Args:
            application: アプリケーション識別子。 必須。
        """
        if not application:
            return "エラー: application が指定されていません。"
        try:
            resp = await _client.get(
                f"{RAG_URL}/ops/supervisor/maintenance/{application}",
                timeout=10,
            )
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"
        if resp.status_code != 200:
            return f"取得失敗: HTTP {resp.status_code}: {resp.text[:200]}"

        data = resp.json()
        enabled = bool(data.get("enabled"))
        started_at = data.get("started_at", "") or ""
        expires_at = data.get("expires_at", "") or ""
        reason = data.get("reason", "") or ""
        started_by = data.get("started_by", "") or ""
        auto_expired = bool(data.get("auto_expired"))

        lines = [f"## メンテナンスモード状態 (application={application})"]
        lines.append("")
        lines.append(f"- enabled: {'ON' if enabled else 'OFF'}")
        if started_at:
            lines.append(f"- started_at: {started_at}")
        if expires_at:
            lines.append(f"- expires_at: {expires_at}")
        else:
            if enabled:
                lines.append(f"- expires_at: (未設定 = 手動解除まで継続)")
        if reason:
            lines.append(f"- reason: {reason}")
        if started_by:
            lines.append(f"- started_by: {started_by}")
        if auto_expired:
            lines.append(f"- auto_expired: True (今回の取得で期限切れにより自動解除されました)")
        return "\n".join(lines)


    @mcp.tool()
    async def maintenance_mode_enable(
        application: str,
        reason: str = "",
        hours: float | None = None,
        expires_at: str = "",
        started_by: str = "",
    ) -> str:
        """指定アプリケーションのメンテナンスモードを開始する。

        メンテナンスモード中の間は supervisor (自動監視・修復) が停止する。
        保守作業や手動操作中の誤検知・誤修復を防ぐために使う。

        期限指定:
        - hours: 時間数 (例: 1.5 で 1時間30分後に自動解除)
        - expires_at: ISO8601 UTC 文字列で絶対時刻 (例: "2026-05-11T18:00:00Z")
        - 両方省略すると期限なし (手動 disable まで継続)。 解除し忘れを避けるため、
          通常は hours を指定することが望ましい。
        - 両方指定された場合は expires_at が優先される。

        Args:
            application: アプリケーション識別子。 必須。
            reason:      開始理由 (例: "ConfigMap 更新作業中")。 任意だが推奨。
            hours:       自動解除までの時間数 (float 可、 1.5 で 1時間30分)。 任意。
            expires_at:  自動解除予定時刻 (ISO8601 UTC 文字列)。 任意。
            started_by:  開始操作者の識別 (空ならエージェント側で何も渡さない)。 任意。
        """
        if not application:
            return "エラー: application が指定されていません。"

        params: dict = {}
        if reason:
            params["reason"] = reason
        if hours is not None:
            params["hours"] = float(hours)
        if expires_at:
            params["expires_at"] = expires_at
        if started_by:
            params["started_by"] = started_by

        try:
            resp = await _client.post(
                f"{RAG_URL}/ops/supervisor/maintenance/{application}/enable",
                params=params,
                timeout=10,
            )
        except Exception as e:
            return f"開始失敗: {type(e).__name__}: {str(e)[:200]}"

        if resp.status_code != 200:
            return f"開始失敗: HTTP {resp.status_code}: {resp.text[:300]}"

        data = resp.json()
        started_at_ret = data.get("started_at", "") or ""
        expires_at_ret = data.get("expires_at", "") or ""

        lines = [f"## メンテナンスモードを開始しました (application={application})"]
        lines.append("")
        lines.append(f"- started_at: {started_at_ret}")
        if expires_at_ret:
            lines.append(f"- expires_at: {expires_at_ret} (この時刻に自動解除されます)")
        else:
            lines.append(f"- expires_at: (未設定 = 手動 disable まで継続)")
        if data.get("reason"):
            lines.append(f"- reason: {data['reason']}")
        if data.get("started_by"):
            lines.append(f"- started_by: {data['started_by']}")
        return "\n".join(lines)


    @mcp.tool()
    async def maintenance_mode_disable(
        application: str,
        stopped_by: str = "",
    ) -> str:
        """指定アプリケーションのメンテナンスモードを解除する。

        解除後は supervisor (自動監視・修復) が再開する。
        既に OFF の場合でも成功 (冪等) を返す (was_enabled=False が見えるだけ)。

        Args:
            application: アプリケーション識別子。 必須。
            stopped_by:  解除操作者の識別 (空ならエージェント側で何も渡さない)。 任意。
        """
        if not application:
            return "エラー: application が指定されていません。"

        params: dict = {}
        if stopped_by:
            params["stopped_by"] = stopped_by

        try:
            resp = await _client.post(
                f"{RAG_URL}/ops/supervisor/maintenance/{application}/disable",
                params=params,
                timeout=10,
            )
        except Exception as e:
            return f"解除失敗: {type(e).__name__}: {str(e)[:200]}"

        if resp.status_code != 200:
            return f"解除失敗: HTTP {resp.status_code}: {resp.text[:300]}"

        data = resp.json()
        was_enabled = bool(data.get("was_enabled"))

        lines = [f"## メンテナンスモードを解除しました (application={application})"]
        lines.append("")
        if was_enabled:
            lines.append(f"- was_enabled: True (前状態は ON でした)")
        else:
            lines.append(f"- was_enabled: False (元から OFF でした、 冪等処理)")
        if data.get("stopped_by"):
            lines.append(f"- stopped_by: {data['stopped_by']}")
        return "\n".join(lines)


    def _format_age(seconds: int) -> str:
        """秒数を 1d2h / 3h45m / 12m / 30s 等の短い表記に変える。"""
        try:
            s = int(seconds)
        except (TypeError, ValueError):
            return "?"
        if s < 60:
            return f"{s}s"
        m = s // 60
        if m < 60:
            return f"{m}m"
        h = m // 60
        m = m % 60
        if h < 24:
            return f"{h}h{m}m" if m else f"{h}h"
        d = h // 24
        h = h % 24
        return f"{d}d{h}h" if h else f"{d}d"


