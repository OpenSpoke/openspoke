    @mcp.tool()
    async def list_mail_account(user_id: str) -> str:
        """登録済みメールアカウントの一覧を返す (読み取り専用、 承認不要)。

        パスワードは "***" にマスキングされる。
        last_uid / last_uidvalidity / fetch_interval_sec 等の状態も確認できる。

        Args:
            user_id: アカウント所有者
        """
        if not user_id:
            return "エラー: user_id が指定されていません。"

        kernel = _ensure_kernel_url()

        os_body = {
            "size": 100,
            "query": {"bool": {"filter": [
                {"term": {"user_id.keyword": user_id}},
            ]}},
            "sort": [{"created_at": {"order": "asc"}}],
        }

        try:
            async with httpx.AsyncClient(timeout=15.0) as client:
                resp = await client.post(
                    f"{kernel}/core/opensearch/request",
                    json={
                        "method": "POST",
                        "path": f"/{SECRETARY_MAIL_ACCOUNTS_INDEX}/_search",
                        "body": os_body,
                    },
                )
                resp.raise_for_status()
                data = resp.json()
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        os_status = data.get("status_code", 0)
        if os_status == 404:
            return f"user_id={user_id} に登録されているメールアカウントはありません。"
        if os_status != 200:
            return f"取得失敗: OpenSearch returned {os_status}"

        os_resp = data.get("json") or {}
        hits = (os_resp.get("hits", {}) or {}).get("hits", []) or []
        if not hits:
            return f"user_id={user_id} に登録されているメールアカウントはありません。"

        lines = [f"## メールアカウント一覧 ({len(hits)} 件) user_id={user_id}\n"]
        for i, h in enumerate(hits, 1):
            a = h.get("_source", {}) or {}
            # password マスキング
            if "password" in a:
                a = dict(a)
                a["password"] = "***"
            enabled_jp = "有効" if a.get("enabled", True) else "停止中"
            lines.append(
                f"### [{i}] {a.get('account_label', a.get('account_id', ''))} ({enabled_jp})"
            )
            lines.append(f"- account_id: {a.get('account_id', '')}")
            lines.append(f"- host: {a.get('host', '')}:{a.get('port', '')} (ssl={a.get('ssl', True)})")
            lines.append(f"- username: {a.get('username', '')}")
            lines.append(f"- folders: {a.get('folders', [])}")
            lines.append(f"- 取得間隔: {a.get('fetch_interval_sec', '?')} 秒")
            lines.append(f"- last_uid: {a.get('last_uid', 0)}")
            lines.append(f"- last_uidvalidity: {a.get('last_uidvalidity', 0)}")
            lines.append(f"- created_at: {a.get('created_at', '')}")
            lines.append(f"- updated_at: {a.get('updated_at', '')}")
            lines.append("")

        return "\n".join(lines)


    @mcp.tool()
