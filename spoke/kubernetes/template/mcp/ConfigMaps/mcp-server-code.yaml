apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-code
  namespace: rag-spoke
data:
  mcp_server.py: |
    """
    RAG MCP Server
    テナント単位でデプロイ。環境変数 TENANT_NAME / RAG_BACKEND_URL で動作を切り替える。
    """

    import os
    import uvicorn
    import httpx
    import jwt
    from mcp.server.fastmcp import FastMCP
    from starlette.responses import Response, JSONResponse
    from starlette.routing import Route
    from starlette.requests import Request
    from contextvars import ContextVar

    TENANT      = os.environ["TENANT_NAME"]
    RAG_URL     = os.environ["RAG_BACKEND_URL"]
    # 汎用 tool (vector_search, opensearch_search, graph_query 等) は kernel を直接叩く。
    # 業務領域に依存しないため、 RAG_URL とは別経路。
    # 未設定の場合、 汎用 tool は実行時にエラーを返す (既存業務 tool は影響を受けない)。
    KERNEL_URL  = os.environ.get("KERNEL_URL", "")
    MCP_HOST    = os.environ.get("MCP_HOST", "0.0.0.0")
    MCP_PORT    = int(os.environ.get("MCP_PORT", "8000"))
    API_KEY     = os.environ["MCP_API_KEY"]
    KEYCLOAK_URL          = os.environ.get("KEYCLOAK_URL", "")
    KEYCLOAK_INTERNAL_URL = os.environ.get("KEYCLOAK_INTERNAL_URL", KEYCLOAK_URL)
    KEYCLOAK_REALM        = os.environ.get("KEYCLOAK_REALM", "rag")
    KEYCLOAK_CLIENT_ID    = os.environ.get("KEYCLOAK_CLIENT_ID", "mcp-server")

    _UA = {"User-Agent": "Mozilla/5.0 (compatible; MCP-Server/1.0)"}

    mcp = FastMCP(f"RAG-{TENANT}", host=MCP_HOST)

    # ── 再帰深度カウンタ(ContextVar) ──
    # MCPサーバーが受信したリクエストの X-Recursion-Depth ヘッダを保持する。
    # ツール関数内で _client.post/get を呼ぶ際、event_hook が自動的に depth+1 して
    # Backend に伝搬する。これにより Backend 側は再帰の深さを検知し、
    # 一定深度以上で Claude 使用を禁止することで無限再帰を防止できる。
    _recursion_depth: ContextVar[int] = ContextVar("mcp_recursion_depth", default=0)

    async def _add_recursion_depth_header(request: httpx.Request):
        """MCPサーバー → Backend への全リクエストに X-Recursion-Depth を付与する。

        - Claude.ai 等の外部クライアントから来た最初の呼び出し: ContextVar=0 → 送信時は 1
        - Backend のサブLLM(Claude) から再帰的に呼ばれた場合: ContextVar=N → 送信時は N+1
        """
        current_depth = _recursion_depth.get()
        request.headers["X-Recursion-Depth"] = str(current_depth + 1)


    _client = httpx.AsyncClient(
        timeout=120.0,
        event_hooks={"request": [_add_recursion_depth_header]},
    )

    OPEN_PATHS = {
        "/.well-known/oauth-authorization-server",
        "/.well-known/oauth-protected-resource",
        "/.well-known/oauth-protected-resource/sse",
        "/.well-known/jwks.json",
        "/callback",
        "/oauth/token",
        "/oauth/register",
    }

    # ── 純粋 ASGI ミドルウェア（SSE ストリーミング対応）──────────
    class ApiKeyMiddleware:
        def __init__(self, app):
            self.app = app

        async def __call__(self, scope, receive, send):
            if scope["type"] != "http":
                await self.app(scope, receive, send)
                return

            path = scope.get("path", "")
            if path in OPEN_PATHS:
                await self.app(scope, receive, send)
                return

            headers = dict(scope.get("headers", []))
            api_key = headers.get(b"x-api-key", b"").decode()

            if api_key != API_KEY:
                await self._send_401(send)
                return

            await self.app(scope, receive, send)

        async def _send_401(self, send):
            await send({
                "type": "http.response.start",
                "status": 401,
                "headers": [(b"content-type", b"text/plain")],
            })
            await send({
                "type": "http.response.body",
                "body": b"Unauthorized",
            })

    class JwtAuthMiddleware:
        def __init__(self, app):
            self.app = app

        async def __call__(self, scope, receive, send):
            if scope["type"] != "http":
                await self.app(scope, receive, send)
                return

            path = scope.get("path", "")
            if path in OPEN_PATHS:
                await self.app(scope, receive, send)
                return

            headers = dict(scope.get("headers", []))
            auth = headers.get(b"authorization", b"").decode()
            token = auth.removeprefix("Bearer ").strip()

            if not token:
                await self._send_401(send)
                return

            try:
                jwks_url = f"{KEYCLOAK_INTERNAL_URL}/realms/{KEYCLOAK_REALM}/protocol/openid-connect/certs"
                jwks_client = jwt.PyJWKClient(jwks_url, headers=_UA)
                signing_key = jwks_client.get_signing_key_from_jwt(token)
                jwt.decode(
                    token,
                    signing_key.key,
                    algorithms=["RS256"],
                    audience="account",
                )
            except Exception as e:
                print(f"JWT validation error: {e}")
                await self._send_401(send)
                return

            await self.app(scope, receive, send)

        async def _send_401(self, send):
            await send({
                "type": "http.response.start",
                "status": 401,
                "headers": [(b"content-type", b"text/plain")],
            })
            await send({
                "type": "http.response.body",
                "body": b"Unauthorized",
            })

    class RecursionDepthMiddleware:
        """受信した X-Recursion-Depth ヘッダを ContextVar に設定する ASGI ミドルウェア。

        このミドルウェアを通過した後、ツール関数内で _client.post/get を呼ぶと
        event_hook(_add_recursion_depth_header) が ContextVar を読み取って
        自動的に depth+1 を送信する。

        認証ミドルウェアより外側(最外層)に配置することで、認証エラー時も
        depth 情報が ContextVar に設定される。
        """
        def __init__(self, app):
            self.app = app

        async def __call__(self, scope, receive, send):
            if scope["type"] != "http":
                await self.app(scope, receive, send)
                return

            headers = dict(scope.get("headers", []))
            depth_bytes = headers.get(b"x-recursion-depth", b"0")
            try:
                depth = int(depth_bytes.decode())
            except (ValueError, UnicodeDecodeError):
                depth = 0

            token = _recursion_depth.set(depth)
            try:
                await self.app(scope, receive, send)
            finally:
                _recursion_depth.reset(token)

    # ── OAuth2 メタデータ・JWKS エンドポイント ──────────────────
    async def oauth_metadata(request):
        base_url = f"https://{request.url.hostname}"
        keycloak_base = f"{KEYCLOAK_URL}/realms/{KEYCLOAK_REALM}/protocol/openid-connect"
        return JSONResponse({
            "issuer": base_url,
            "authorization_endpoint": f"{keycloak_base}/auth",
            "token_endpoint": f"{base_url}/oauth/token",
            "registration_endpoint": f"{base_url}/oauth/register",
            "response_types_supported": ["code"],
            "grant_types_supported": ["authorization_code"],
            "code_challenge_methods_supported": ["S256"],
            "scopes_supported": ["openid", "claudeai"],
        })

    async def oauth_protected_resource(request):
        base_url = f"https://{request.url.hostname}"
        return JSONResponse({
            "resource": base_url,
            "authorization_servers": [base_url],
            "bearer_methods_supported": ["header"],
            "scopes_supported": ["claudeai"],
        })

    async def jwks(request):
        async with httpx.AsyncClient(headers=_UA) as c:
            r = await c.get(
                f"{KEYCLOAK_INTERNAL_URL}/realms/{KEYCLOAK_REALM}/protocol/openid-connect/certs"
            )
            return JSONResponse(r.json())

    async def oauth_callback(request):
        code = request.query_params.get("code")
        if not code:
            return JSONResponse({"error": "missing_code"}, status_code=400)

        async with httpx.AsyncClient(headers=_UA) as c:
            resp = await c.post(
                f"{KEYCLOAK_INTERNAL_URL}/realms/{KEYCLOAK_REALM}/protocol/openid-connect/token",
                data={
                    "grant_type": "authorization_code",
                    "code": code,
                    "client_id": KEYCLOAK_CLIENT_ID,
                    "client_secret": os.environ.get("KEYCLOAK_CLIENT_SECRET", ""),
                    "redirect_uri": request.query_params.get("redirect_uri", ""),
                },
                headers={"Content-Type": "application/x-www-form-urlencoded", **_UA},
            )
        return JSONResponse(resp.json(), status_code=resp.status_code)


    # ── Keycloak プロキシ（Cloudflare バイパス用）─────────────
    async def proxy_token(request: Request):
        """トークンリクエストを Keycloak に中継"""
        body = await request.body()
        content_type = request.headers.get("content-type", "application/x-www-form-urlencoded")
        keycloak_token_url = f"{KEYCLOAK_INTERNAL_URL}/realms/{KEYCLOAK_REALM}/protocol/openid-connect/token"
        async with httpx.AsyncClient(headers=_UA) as c:
            resp = await c.post(
                keycloak_token_url,
                content=body,
                headers={"Content-Type": content_type, **_UA},
            )
        return JSONResponse(resp.json(), status_code=resp.status_code)

    async def proxy_register(request: Request):
        """Dynamic Client Registration を Keycloak に中継"""
        body = await request.body()
        content_type = request.headers.get("content-type", "application/json")
        keycloak_reg_url = f"{KEYCLOAK_INTERNAL_URL}/realms/{KEYCLOAK_REALM}/clients-registrations/openid-connect"
        async with httpx.AsyncClient(headers=_UA) as c:
            resp = await c.post(
                keycloak_reg_url,
                content=body,
                headers={"Content-Type": content_type, **_UA},
            )
        return JSONResponse(resp.json(), status_code=resp.status_code)


    @mcp.tool()
    async def search_rag(
        question: str,
        user_id: str,
        top_k: int = 5,
        search_mode: str = "vector_first",
        use_graph: bool = True,
    ) -> str:
        """
        社内ナレッジベースを検索してLLMが生成した回答を返す。
        RAGのLLM（gemma2）が検索と回答生成を一体で行う。
        シンプルな質問や単発の回答が必要な場合に使う。

        Args:
            question:    自然言語での質問（日本語・英語可）
            user_id:     検索対象ユーザーのID（例: example）
            top_k:       取得するチャンク数。デフォルト5、最大20
            search_mode: "vector_first"（ベクトル優先）または "graph_first"（グラフ優先）
            use_graph:   vector_first 時にグラフ補強を使うか（graph_first 時は無視）
        """
        payload = {
            "question":    question,
            "user_id":     user_id,
            "top_k":       top_k,
            "search_mode": search_mode,
            "use_graph":   use_graph,
        }
        resp = await _client.post(f"{RAG_URL}/query", json=payload)

        if resp.status_code == 404:
            return f"ユーザー '{user_id}' のデータが存在しません。先にドキュメントをインデックス化してください。"

        resp.raise_for_status()
        data = resp.json()

        lines = []
        lines.append(f"## 回答\n{data['answer']}")

        ri = data.get("rerank_info")
        if ri and ri.get("reranked"):
            lines.append(
                f"\n_[リランキング] {ri['candidates_count']}件 → {len(ri['selected_indices'])}件選択 "
                f"/ 処理時間: {data.get('processing_time_sec', 0):.2f}秒_"
            )

        entities = data.get("graph_entities", [])
        if entities:
            lines.append("\n## 関連エンティティ")
            for e in entities[:8]:
                related = ", ".join(r["name"] for r in e.get("related", [])[:3] if r.get("name"))
                desc = e.get("description", "")[:60]
                lines.append(f"- **{e['entity']}** ({e['type']}){': ' + desc if desc else ''}"
                             + (f" → {related}" if related else ""))

        docs = data.get("retrieved_documents", [])
        if docs:
            lines.append("\n## 参照ドキュメント")
            src_map = {"vector": "ベクトル", "graph": "グラフ", "vector_fallback": "フォールバック"}
            for i, doc in enumerate(docs, 1):
                src = src_map.get(doc.get("source", "vector"), doc.get("source", ""))
                lines.append(f"\n### [{i}] スコア: {doc['score']:.3f}  ({src})")
                lines.append(doc["text"][:300] + ("…" if len(doc["text"]) > 300 else ""))

        return "\n".join(lines)


    @mcp.tool()
    async def retrieve_chunks(
        query: str,
        user_id: str,
        top_k: int = 5,
        search_mode: str = "vector_first",
        use_graph: bool = True,
    ) -> str:
        """
        LLMによる回答生成をせず、生のドキュメントチャンクとグラフエンティティのみを返す。
        呼び出し側のLLM（Claude）が自ら推論・統合・仮説検証する協調推論用ツール。
        複雑な分析、多角的な考察、複数クエリを組み合わせた深い推論が必要な場合に使う。

        Args:
            query:       検索クエリ（自然言語）
            user_id:     検索対象ユーザーのID
            top_k:       取得チャンク数。デフォルト5、最大20
            search_mode: "vector_first"（ベクトル優先）または "graph_first"（グラフ優先）
            use_graph:   グラフ検索を併用するか
        """
        payload = {
            "question":    query,
            "user_id":     user_id,
            "top_k":       top_k,
            "search_mode": search_mode,
            "use_graph":   use_graph,
        }
        resp = await _client.post(f"{RAG_URL}/retrieve", json=payload)

        if resp.status_code == 404:
            return f"ユーザー '{user_id}' のデータが存在しません。先にドキュメントをインデックス化してください。"

        resp.raise_for_status()
        data = resp.json()

        lines = ["## 取得チャンク（生データ）\n"]

        chunks = data.get("chunks", [])
        for i, chunk in enumerate(chunks, 1):
            lines.append(f"### [{i}] スコア: {chunk['score']:.3f}  ({chunk.get('source', '')})")
            lines.append(chunk["text"])
            lines.append("")

        graph_context = data.get("graph_context", "")
        if graph_context:
            lines.append(f"\n## グラフコンテキスト\n{graph_context}")

        entities = data.get("graph_entities", [])
        if entities:
            lines.append("\n## グラフエンティティ")
            for e in entities[:8]:
                related = ", ".join(r["name"] for r in e.get("related", [])[:3] if r.get("name"))
                lines.append(f"- **{e['entity']}** ({e['type']})" + (f" → {related}" if related else ""))

        lines.append(f"\n_処理時間: {data.get('processing_time_sec', 0):.2f}秒_")

        return "\n".join(lines)


    @mcp.tool()
    async def analyze_chunks(
        question: str,
        user_id: str,
        top_k: int = 5,
        use_graph: bool = True,
    ) -> str:
        """
        チャンクを取得し、RAGのLLM（gemma2）が各チャンクをドメイン知識の観点で一次解釈する。
        Claudeが複数の解釈を統合して最終推論する真の協調推論用ツール。
        社内専門用語・固有名詞・文脈依存の情報が多い場合に使う。
        gemma2がドメイン知識で解釈し、Claudeが高次の統合推論を行う役割分担になる。

        Args:
            question: 分析したい質問（自然言語）
            user_id:  検索対象ユーザーのID
            top_k:    取得チャンク数。デフォルト5、最大10
            use_graph: グラフ検索を併用するか
        """
        payload = {
            "question":    question,
            "user_id":     user_id,
            "top_k":       top_k,
            "use_graph":   use_graph,
            "search_mode": "vector_first",
        }
        resp = await _client.post(f"{RAG_URL}/analyze", json=payload)

        if resp.status_code == 404:
            return f"ユーザー '{user_id}' のデータが存在しません。"

        resp.raise_for_status()
        data = resp.json()

        lines = ["## gemma2 による一次解釈結果\n"]
        lines.append("_以下は gemma2 がドメイン知識をもとに各チャンクを解釈した結果です。_\n")

        for i, chunk in enumerate(data.get("analyzed_chunks", []), 1):
            lines.append(f"### [{i}] スコア: {chunk['score']:.3f}")
            lines.append(f"**原文:** {chunk['original_text'][:200]}")
            if chunk.get("interpretation"):
                lines.append(f"**gemma2 の解釈:** {chunk['interpretation']}")
            lines.append("")

        graph_context = data.get("graph_context", "")
        if graph_context:
            lines.append(f"\n## グラフコンテキスト\n{graph_context}")

        lines.append(f"\n_処理時間: {data.get('processing_time_sec', 0):.2f}秒_")

        return "\n".join(lines)


    @mcp.tool()
    async def search_code(
        query: str,
        user_id: str,
        top_k: int = 3,
    ) -> str:
        """
        インデックス済みの GitHub コードを意味検索する。

        Args:
            query:   検索クエリ（日本語・英語可。例: 認証処理、database connection）
            user_id: 検索対象ユーザーのID
            top_k:   取得件数。デフォルト3、最大10
        """
        payload = {"query": query, "user_id": user_id, "top_k": top_k}
        resp = await _client.post(f"{RAG_URL}/code/search", json=payload)

        if resp.status_code == 404:
            return "コードがインデックス化されていません。GitHub リポジトリを登録してください。"

        resp.raise_for_status()
        data = resp.json()
        results = data.get("results", [])

        if not results:
            return "該当するコードが見つかりませんでした。"

        lines = [f"## コード検索結果 ({len(results)}件)\n"]
        for r in results:
            lines.append(f"### {r['filepath']}  L{r['start_line']}-{r['end_line']}  スコア: {r['score']:.3f}")
            lines.append(f"_Repository: {r['repository']} / Branch: {r['branch']}_")
            lines.append(f"```\n{r['text']}\n```\n")

        return "\n".join(lines)


    @mcp.tool()
    async def list_entities(
        user_id: str,
        limit: int = 30,
    ) -> str:
        """
        ナレッジグラフに登録されているエンティティ（人物・組織・技術・製品など）の一覧を返す。
        explore_related で深掘りする前に、どんなエンティティが存在するかを確認するために使う。

        Args:
            user_id: 検索対象ユーザーのID
            limit:   取得件数。デフォルト30、最大50
        """
        resp = await _client.get(
            f"{RAG_URL}/graph/entities",
            params={"user_id": user_id, "limit": min(limit, 50)},
        )
        resp.raise_for_status()
        data = resp.json()
        entities = data.get("entities", [])

        if not entities:
            return f"ユーザー '{user_id}' のグラフエンティティは登録されていません。"

        lines = [f"## グラフエンティティ一覧 ({len(entities)}件)\n"]
        for e in entities:
            rel = e.get("related_count", 0)
            desc = e.get("description", "")
            line = f"- **{e['name']}** ({e['type']}) 関連数:{rel}"
            if desc:
                line += f" — {desc[:60]}"
            lines.append(line)

        lines.append(f"\n_explore_related ツールでエンティティ名を指定すると、関連情報を深掘りできます。_")
        return "\n".join(lines)


    @mcp.tool()
    async def explore_related(
        entity_name: str,
        user_id: str,
        hops: int = 2,
        include_chunks: bool = True,
    ) -> str:
        """
        指定したエンティティを起点に、ナレッジグラフを辿って関連エンティティ・関係パス・
        関連チャンクを返す。Bedrockにはない、グラフ探索による深掘り機能。
        Claudeが段階的に呼び出して、知識を広げていくagenticな探索に最適。

        使い方の例:
        1. list_entities でエンティティ一覧を取得
        2. 気になるエンティティ名で explore_related を呼ぶ
        3. 返された関連エンティティからさらに explore_related で深掘り

        Args:
            entity_name:    探索の起点となるエンティティ名（例: AuthService, たお君）
            user_id:        検索対象ユーザーのID
            hops:           探索するホップ数。1〜3、デフォルト2
            include_chunks: 関連チャンク（原文）を含めるか。デフォルトtrue
        """
        hops = max(1, min(hops, 3))
        payload = {
            "entity_name": entity_name,
            "user_id": user_id,
            "hops": hops,
            "include_chunks": include_chunks,
        }
        resp = await _client.post(f"{RAG_URL}/graph/explore", json=payload)

        if resp.status_code == 404:
            return f"エンティティ '{entity_name}' が見つかりませんでした。list_entities で存在するエンティティを確認してください。"

        resp.raise_for_status()
        data = resp.json()

        entity = data.get("entity", {})
        related = data.get("related_entities", [])
        paths = data.get("paths", [])
        chunks = data.get("chunks", [])

        lines = [f"## エンティティ探索: {entity_name}\n"]

        if entity:
            lines.append(f"**タイプ:** {entity.get('type', '不明')}")
            if entity.get("description"):
                lines.append(f"**説明:** {entity['description']}")
            lines.append("")

        if related:
            lines.append(f"### 関連エンティティ ({len(related)}件)")
            for r in related:
                rel_type = r.get("relationship", "RELATED")
                direction = r.get("direction", "")
                line = f"- **{r['name']}** ({r.get('type', '')}) [{rel_type}]"
                if r.get("description"):
                    line += f" — {r['description'][:60]}"
                lines.append(line)
            lines.append("")

        if paths:
            lines.append(f"### 関係パス ({len(paths)}件)")
            seen = set()
            for p in paths:
                path_str = " → ".join(p.get("nodes", []))
                if path_str not in seen:
                    seen.add(path_str)
                    lines.append(f"- {path_str} ({p.get('hops', 0)}ホップ)")
            lines.append("")

        if chunks:
            lines.append(f"### 関連チャンク ({len(chunks)}件)")
            for i, c in enumerate(chunks, 1):
                mentioned = ", ".join(c.get("mentioned_entities", [])[:5])
                lines.append(f"#### [{i}]{' — 言及: ' + mentioned if mentioned else ''}")
                lines.append(c.get("text", "")[:400])
                lines.append("")

        if not related and not paths and not chunks:
            lines.append("このエンティティに関連する情報は見つかりませんでした。")

        lines.append(f"\n_探索起点: {entity_name} / ホップ数: {hops}_")
        return "\n".join(lines)


    @mcp.tool()
    async def search_temporal(
        question: str,
        user_id: str,
        since: str = "",
        until: str = "",
        recency_boost: bool = True,
        top_k: int = 10,
    ) -> str:
        """
        時系列対応の検索。期間を指定したり、最新情報を優先した検索ができる。
        Bedrockにはない、時間の概念を持つRAG検索機能。

        使い方の例:
        - 「最近たお君が食べたものは?」→ recency_boost=True で最新情報優先
        - 「先月の出来事を教えて」→ since="2026-03-01", until="2026-03-31"
        - 「2024年時点の情報は?」→ since="2024-01-01", until="2024-12-31"

        Args:
            question:      検索クエリ（空なら全件を時系列で返す）
            user_id:       検索対象ユーザーのID
            since:         この日付以降のデータに限定 (例: "2026-04-01")
            until:         この日付以前のデータに限定 (例: "2026-04-13")
            recency_boost: 新しいデータを優先するか。デフォルトtrue
            top_k:         取得件数。デフォルト10
        """
        payload = {
            "question": question,
            "user_id": user_id,
            "top_k": top_k,
            "since": since,
            "until": until,
            "recency_boost": recency_boost,
        }
        resp = await _client.post(f"{RAG_URL}/query/temporal", json=payload)

        if resp.status_code == 404:
            return f"ユーザー '{user_id}' のデータが存在しません。"

        resp.raise_for_status()
        data = resp.json()

        results = data.get("results", [])
        filters = data.get("filters", {})

        if not results:
            filter_desc = ""
            if since or until:
                filter_desc = f" (期間: {since or '制限なし'} 〜 {until or '制限なし'})"
            return f"該当するデータが見つかりませんでした{filter_desc}。"

        lines = [f"## 時系列検索結果 ({len(results)}件)\n"]
        if since or until:
            lines.append(f"_期間: {since or '制限なし'} 〜 {until or '制限なし'}_")
        if recency_boost:
            lines.append("_最新情報を優先してスコアリング_\n")

        for i, r in enumerate(results, 1):
            date_str = r.get("created_at", "不明")[:10]
            lines.append(f"### [{i}] {date_str}  スコア: {r['score']:.3f}")
            lines.append(r["text"])
            lines.append("")

        return "\n".join(lines)


    @mcp.tool()
    async def schedule_update(
        keyword: str,
        new_text: str,
        user_id: str,
        old_date: str = "",
        new_date: str = "",
    ) -> str:
        """
        既存のスケジュールや情報を変更する。
        キーワードで古いエントリを検索・削除し、新しい内容で再登録する。

        使い方の例:
        - 「ピアノの発表会を金曜日から土曜日に変更」
          → keyword="ピアノ 発表会", new_text="たお君は来週の土曜日にピアノの発表会があります"
        - 「昨日の夕食をカレーに修正」
          → keyword="夕食 ガパオライス", old_date="2026-04-13", new_text="たお君は昨日カレーを食べました"

        Args:
            keyword:   変更対象を特定するキーワード（スペース区切りで複数指定可）
            new_text:  変更後のテキスト
            user_id:   対象ユーザーID
            old_date:  変更対象の日付（絞り込み用、空なら全期間から検索）
            new_date:  変更後の日付（空ならnew_textから自動解決）
        """
        payload = {
            "keyword": keyword,
            "user_id": user_id,
            "old_date": old_date,
            "new_text": new_text,
            "new_date": new_date,
        }
        resp = await _client.post(f"{RAG_URL}/schedule/update", json=payload)
        resp.raise_for_status()
        data = resp.json()

        deleted = data.get("deleted", {})
        inserted = data.get("inserted", {})

        lines = ["## スケジュール変更完了\n"]
        lines.append(f"**削除:** キーワード '{deleted.get('keyword', '')}' でMilvus {deleted.get('milvus_deleted', 0)}件, OpenSearch {deleted.get('opensearch_deleted', 0)}件を削除")
        lines.append(f"**登録:** {inserted.get('text', '')}")
        if inserted.get("event_date"):
            lines.append(f"**日付:** {inserted['event_date']}")

        return "\n".join(lines)


    @mcp.tool()
    async def schedule_delete(
        keyword: str,
        user_id: str,
        date: str = "",
    ) -> str:
        """
        スケジュールや情報を削除する。
        キーワードでマッチするエントリをMilvusとOpenSearchの両方から削除する。

        使い方の例:
        - 「来週のピアノの発表会をキャンセル」
          → keyword="ピアノ 発表会", date="2026-04-24"
        - 「動物園に行った記録を消して」
          → keyword="動物園"

        Args:
            keyword:  削除対象を特定するキーワード（スペース区切りで複数指定可）
            user_id:  対象ユーザーID
            date:     日付で絞り込む場合に指定（空なら全期間から検索）
        """
        # まずプレビュー
        search_resp = await _client.post(f"{RAG_URL}/schedule/search", json={
            "keyword": keyword, "user_id": user_id, "date": date, "top_k": 5
        })
        search_resp.raise_for_status()
        preview = search_resp.json()

        if preview.get("total", 0) == 0:
            return f"キーワード '{keyword}' に一致するデータが見つかりませんでした。"

        # 削除実行
        del_resp = await _client.post(f"{RAG_URL}/schedule/delete", json={
            "keyword": keyword, "user_id": user_id, "date": date
        })
        del_resp.raise_for_status()
        data = del_resp.json()

        lines = ["## スケジュール削除完了\n"]
        lines.append(f"**キーワード:** {keyword}")
        if date:
            lines.append(f"**日付:** {date}")
        lines.append(f"**削除件数:** Milvus {data.get('milvus_deleted', 0)}件, OpenSearch {data.get('opensearch_deleted', 0)}件")
        lines.append("\n**削除対象だったデータ:**")
        for r in preview.get("results", []):
            lines.append(f"- {r.get('created_at', '')[:10]}: {r['text'][:60]}")

        return "\n".join(lines)


