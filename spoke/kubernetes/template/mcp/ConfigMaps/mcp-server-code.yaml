    @mcp.tool()
    async def compose_mail(
        user_id: str,
        account_id: str,
        to: str,
        subject: str,
        body: str,
        cc: str = "",
        bcc: str = "",
        reply_to_message_id: str = "",
    ) -> str:
        """メールを送信する (利用者承認 → the assistant backend が SMTP 送信)。

        承認フロー:
        1. この tool を呼ぶと内容が Valkey に保留される (stage_draft 経由)
        2. 利用者に「以下の内容で送信してよろしいですか？」 と確認する
        3. 利用者が「はい」 と答えると、 the assistant backend が以下を実行:
           - SMTP で実際に送信
           - IMAP の Sent フォルダに APPEND (失敗しても致命ではない)
           - OpenSearch (secretary_sent_mails) に送信履歴を保存

        返信メールの場合は reply_to_message_id を指定すると、 元メールの Message-ID を
        In-Reply-To / References ヘッダに入れて返信スレッドを保つ。

        Args:
            user_id:               送信者の user_id
            account_id:            送信元として使うアカウント識別子 (登録済み)
            to:                    宛先メールアドレス。 複数の場合はカンマ区切り
                                   (例: "alice@example.com, bob@example.com")
            subject:               件名 (必須)
            body:                  本文 (plain text、 必須)
            cc:                    CC 宛先 (任意、 カンマ区切り)
            bcc:                   BCC 宛先 (任意、 カンマ区切り)。 受信側には見えない
            reply_to_message_id:   返信元メールの Message-ID (任意)。 list_recent_human_mails
                                   等の結果に含まれる message_id を渡せば返信スレッドが保たれる
        """
        if not user_id:
            return "エラー: user_id が指定されていません。"
        if not account_id:
            return "エラー: account_id が指定されていません。"
        if not to:
            return "エラー: to (宛先) が指定されていません。"
        if not subject:
            return "エラー: subject (件名) が指定されていません。"
        if not body:
            return "エラー: body (本文) が指定されていません。"

        args = {
            "account_id": account_id,
            "to": to,
            "subject": subject,
            "body": body,
        }
        if cc:
            args["cc"] = cc
        if bcc:
            args["bcc"] = bcc
        if reply_to_message_id:
            args["reply_to_message_id"] = reply_to_message_id

        return await stage_draft(user_id=user_id, tool="compose_mail", args=args)


