    @mcp.tool()
    async def github_update_issue(
        owner: str,
        repo: str,
        number: int,
        title: str = "",
        body: str = "",
        state: str = "",
        state_reason: str = "",
        labels: list = None,
        assignees: list = None,
        milestone: int = -1,
        user_id: str = "",
    ) -> str:
        """既存の Issue を更新する (state 含む)。 空文字または None の引数は変更されない。

        Args:
            owner: リポジトリオーナー
            repo: リポジトリ名
            number: Issue 番号
            title: 新タイトル (空文字なら変更しない)
            body: 新本文 (空文字なら変更しない)
            state: "open" / "closed" (空文字なら変更しない)
            state_reason: closed 時の理由 ("completed" / "not_planned" / "reopened")
            labels: 設定するラベルのリスト。 [] で全クリア、 None なら変更しない
            assignees: 設定するアサイン者のリスト。 [] で全クリア、 None なら変更しない
            milestone: milestone number。 -1 で変更しない (default)
            user_id: the assistant systemの利用者 ID (任意)。 指定があればそのユーザー
                     の登録済み GitHub PAT が使われる。 未指定なら共通 token。
        """
        kernel = _ensure_kernel_url()
        payload: dict = {"owner": owner, "repo": repo, "number": number,
                         "user_id": user_id}
        if title:
            payload["title"] = title
        if body:
            payload["body"] = body
        if state:
            payload["state"] = state
        if state_reason:
            payload["state_reason"] = state_reason
        if labels is not None:
            payload["labels"] = labels
        if assignees is not None:
            payload["assignees"] = assignees
        if milestone is not None and milestone >= 0:
            payload["milestone"] = milestone

        # owner/repo/number/user_id 以外なにも指定が無ければエラー
        if len(payload) <= 4:
            return "更新失敗: 更新すべきフィールドが指定されていません"

        try:
            resp = await _client.post(
                f"{kernel}/core/github/update-issue",
                json=payload,
                timeout=60,
            )
            resp.raise_for_status()
            data = resp.json()
        except Exception as e:
            return f"更新失敗: {type(e).__name__}: {str(e)[:200]}"

        if not data.get("ok"):
            return f"更新失敗: {data.get('error', 'unknown')}"

        issue = data.get("issue") or {}
        return (
            f"Issue を更新しました: {owner}/{repo}#{number}\n"
            f"- state: {issue.get('state', '?')}\n"
            f"- title: {issue.get('title', '')}\n"
            f"- url: {issue.get('html_url', '')}"
        )


