        display_name: str = "",
        company: str = "",
        department: str = "",
        title: str = "",
        tags: str = "",
        aliases: str = "",
        note: str = "",
        profile: str = "",
    ) -> str:
        """人物を手動で登録する (利用者承認 → the assistant backend が実行)。

        通常はメール受信や送信から自動学習されるが、 まだメールのやり取りがない人や
        手動で情報を残したい場合にこの tool を使う。 メアドが既存人物と重複すると
        エラーになる (その場合は merge_persons を使う)。

        Args:
            user_id:       利用者 ID
            name:          氏名 (例: "Example User")
            emails:        メアド (複数の場合はカンマ区切り、 例: "a@example.com, b@example.com")
            display_name:  the operator's見た呼び方 (例: "Example-san")
            company:       所属会社
            department:    部署
            title:         役職
            tags:          タグ (カンマ区切り、 例: "A社, ビジネス")
            aliases:       別名 (カンマ区切り)
            note:          メモ (短文、 構造化情報)
            profile:       自由記述プロファイル (中〜長文、 LLM が後で更新する)
        """
        if not user_id:
            return "エラー: user_id が指定されていません。"
        if not name and not emails:
            return "エラー: name か emails のいずれかは必須です。"

        args: dict = {}
        if name: args["name"] = name
        if emails: args["emails"] = emails
        if display_name: args["display_name"] = display_name
        if company: args["company"] = company
        if department: args["department"] = department
        if title: args["title"] = title
        if tags: args["tags"] = tags
        if aliases: args["aliases"] = aliases
        if note: args["note"] = note
        if profile: args["profile"] = profile

        return await stage_draft(user_id=user_id, tool="add_person", args=args)


    @mcp.tool()
    async def update_person(
        user_id: str,
        person_id: str,
        name: str = "",
        emails: str = "",
        display_name: str = "",
        company: str = "",
        department: str = "",
        title: str = "",
        tags: str = "",
        aliases: str = "",
        note: str = "",
        profile: str = "",
    ) -> str:
        """人物の情報を更新する (利用者承認 → the assistant backend が実行)。

        指定したフィールドだけ更新される。 emails を指定すると全置換になる
        (追加したいだけなら、 既存メアドも含めた全リストで指定する)。

        Args:
            user_id:    利用者 ID
            person_id:  更新対象の人物 ID
            その他:     add_person と同じ意味のフィールド (任意)
        """
        if not user_id or not person_id:
            return "エラー: user_id と person_id は必須です。"

        args: dict = {"person_id": person_id}
        # name は空文字でも明示更新したい場合があるので個別判定
        if name: args["name"] = name
        if emails: args["emails"] = emails
        if display_name: args["display_name"] = display_name
        if company: args["company"] = company
        if department: args["department"] = department
        if title: args["title"] = title
        if tags: args["tags"] = tags
        if aliases: args["aliases"] = aliases
        if note: args["note"] = note
        if profile: args["profile"] = profile

        if len(args) <= 1:
            return "エラー: 更新するフィールドが 1 つも指定されていません。"

        return await stage_draft(user_id=user_id, tool="update_person", args=args)


    @mcp.tool()
    async def delete_person(user_id: str, person_id: str) -> str:
        """人物を削除する (利用者承認 → the assistant backend が実行)。

