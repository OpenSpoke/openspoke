        )


    @mcp.tool()
    async def merge_persons(
        user_id: str,
        primary_id: str,
        sub_id: str,
    ) -> str:
        """2 人の人物を 1 つに統合する (利用者承認 → the assistant backend が実行)。

        primary を残し、 sub を削除する。 emails / aliases / tags / mail counters は
        マージされる。 LLM が「同一人物の可能性あり」 と判定した時や、 利用者が
        明示的に「○○さんと△△さんは同じ」 と指示した時に使う。

        Args:
            user_id:    利用者 ID
            primary_id: 残す方の人物 ID
            sub_id:     削除する方の人物 ID
        """
        if not user_id or not primary_id or not sub_id:
