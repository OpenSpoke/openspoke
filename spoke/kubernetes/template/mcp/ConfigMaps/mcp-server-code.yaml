        return (
            f"削除しました: {owner}/{repo}/{path}\n"
            f"- commit: {commit_sha[:7]}\n"
            f"- url: {html_url}"
        )


    @mcp.tool()
    async def github_list_directory(
        owner: str,
        repo: str,
        path: str = "",
        branch: str = "",
        user_id: str = "",
    ) -> str:
        """GitHub のディレクトリ内容一覧を取得する。

        path がディレクトリの場合は配下のファイル/サブディレクトリ一覧を返す。
        path がファイルの場合は「ディレクトリではない」と返す。
        path 未指定 (空文字) はリポジトリのルート一覧。

        Args:
            owner: リポジトリオーナー (例: "your-org")
            repo: リポジトリ名 (例: "rag")
            path: ディレクトリパス (例: "your-path/manifests"、 ルートなら "")
            branch: ブランチ名 (省略時は default branch)
            user_id: the assistant systemの利用者 ID (任意)。 指定があればそのユーザー
                     の登録済み GitHub PAT が使われる。 未指定なら共通 token。
        """
        kernel = _ensure_kernel_url()
        try:
            resp = await _client.post(
                f"{kernel}/core/github/list-directory",
                json={"owner": owner, "repo": repo, "path": path,
                      "branch": branch if branch else None,
                      "user_id": user_id},
                timeout=60,
            )
            resp.raise_for_status()
            data = resp.json()
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if not data.get("ok"):
            return f"取得失敗: {data.get('error', 'unknown')}"
        if not data.get("exists"):
            display_path = path if path else "(ルート)"
            return f"パスが存在しません: {owner}/{repo}/{display_path}"
        if not data.get("is_directory"):
            return f"ディレクトリではなくファイルです: {owner}/{repo}/{path}"

        items = data.get("items", [])
        display_path = path if path else "(ルート)"
        lines = [f"## {owner}/{repo}/{display_path}" + (f" (branch={branch})" if branch else "")]
        lines.append(f"{len(items)} 件\n")
        if not items:
            lines.append("(空のディレクトリ)")
            return "\n".join(lines)
        for item in items:
            icon = "[DIR]" if item.get("type") == "dir" else "     "
            size_str = ""
            if item.get("type") == "file":
                size = item.get("size", 0)
                size_str = f"  ({size} bytes)"
            lines.append(f"- {icon} {item.get('name', '')}{size_str}")
        return "\n".join(lines)


    # ───────────────────────────────────────────────────────
    # GitHub Issues API ラッパー
    # ───────────────────────────────────────────────────────
    # GitHub Issue を一覧・参照・作成・更新・コメント追加するツール群。
    # 内部で kernel /core/github/*-issue(s) を呼ぶ。
    # 注意: GitHub API では Pull Request も issue の一種だが、 list_issues は
    #       デフォルトで pull request を除外する (include_pull_requests=True で含める)。


    def _format_issue_summary(issue: dict) -> str:
        """Issue を 1 行サマリに整形する。"""
        num = issue.get("number")
        title = issue.get("title", "")
        state = issue.get("state", "")
        labels = issue.get("labels") or []
        assignees = issue.get("assignees") or []
        comments = issue.get("comments", 0)
        is_pr = issue.get("is_pull_request", False)

        marker = "[PR]" if is_pr else "[Issue]"
        label_str = f" [{', '.join(labels)}]" if labels else ""
        assignee_str = f" @{','.join(assignees)}" if assignees else ""
        comment_str = f" 💬{comments}" if comments else ""
        return f"- {marker} #{num} ({state}) {title}{label_str}{assignee_str}{comment_str}"


    @mcp.tool()
    async def github_list_issues(
        owner: str,
        repo: str,
        state: str = "open",
        labels: str = "",
        assignee: str = "",
        creator: str = "",
        sort: str = "created",
        direction: str = "desc",
        per_page: int = 30,
        page: int = 1,
        include_pull_requests: bool = False,
        user_id: str = "",
    ) -> str:
        """GitHub Issue の一覧を取得する。

        Args:
            owner: リポジトリオーナー (例: "your-org")
            repo: リポジトリ名 (例: "rag")
            state: "open" / "closed" / "all" (default "open")
            labels: カンマ区切りラベル名で絞り込み (例: "bug,enhancement")
            assignee: アサイン者の login で絞り込み (例: "example-user")。
                      "none" でアサインなし、 "*" で何かしらアサインあり
            creator: 作成者の login で絞り込み
            sort: "created" / "updated" / "comments" (default "created")
            direction: "asc" / "desc" (default "desc")
            per_page: 1-100 (default 30)
            page: 1-始まりのページ番号 (default 1)
            include_pull_requests: True なら Pull Request も含めて返す (default False)
            user_id: the assistant systemの利用者 ID (任意)。 指定があればそのユーザー
                     の登録済み GitHub PAT が使われる。 未指定なら共通 token。
        """
        kernel = _ensure_kernel_url()
        try:
            resp = await _client.post(
                f"{kernel}/core/github/list-issues",
                json={
                    "owner": owner, "repo": repo,
                    "state": state,
                    "labels": labels if labels else None,
                    "assignee": assignee if assignee else None,
                    "creator": creator if creator else None,
                    "sort": sort, "direction": direction,
                    "per_page": per_page, "page": page,
                    "include_pull_requests": include_pull_requests,
                    "user_id": user_id,
                },
                timeout=60,
            )
            resp.raise_for_status()
            data = resp.json()
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if not data.get("ok"):
            return f"取得失敗: {data.get('error', 'unknown')}"

        issues = data.get("issues", [])
        if not issues:
            return f"## {owner}/{repo} の Issue ({state}): 0 件"

        lines = [f"## {owner}/{repo} の Issue ({state}): {len(issues)} 件  page={page}, per_page={per_page}\n"]
        for issue in issues:
            lines.append(_format_issue_summary(issue))
        return "\n".join(lines)


    @mcp.tool()
    async def github_get_issue(
        owner: str,
        repo: str,
        number: int,
        include_comments: bool = True,
        user_id: str = "",
    ) -> str:
        """Issue 1 件の詳細を取得する (コメントも併せて返す)。

        Args:
            owner: リポジトリオーナー
            repo: リポジトリ名
            number: Issue 番号 (例: 42)
            include_comments: True ならコメントも取得して返す (default True)
            user_id: the assistant systemの利用者 ID (任意)。 指定があればそのユーザー
                     の登録済み GitHub PAT が使われる。 未指定なら共通 token。
        """
        kernel = _ensure_kernel_url()
        try:
            resp = await _client.post(
                f"{kernel}/core/github/get-issue",
                json={"owner": owner, "repo": repo, "number": number,
                      "include_comments": include_comments,
                      "user_id": user_id},
                timeout=60,
            )
            resp.raise_for_status()
            data = resp.json()
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if not data.get("ok"):
            return f"取得失敗: {data.get('error', 'unknown')}"
        if not data.get("exists"):
            return f"Issue が存在しません: {owner}/{repo}#{number}"

        issue = data.get("issue") or {}
        comments = data.get("comments") or []

        marker = "[PR]" if issue.get("is_pull_request") else "[Issue]"
        lines = [
            f"## {marker} #{issue.get('number')} {issue.get('title', '')}",
            f"- state: {issue.get('state', '')}",
            f"- author: @{issue.get('user', '')}",
            f"- created: {issue.get('created_at', '')}",
            f"- updated: {issue.get('updated_at', '')}",
        ]
        if issue.get("closed_at"):
            lines.append(f"- closed: {issue['closed_at']}")
        labels = issue.get("labels") or []
        if labels:
            lines.append(f"- labels: {', '.join(labels)}")
        assignees = issue.get("assignees") or []
        if assignees:
            lines.append(f"- assignees: {', '.join('@' + a for a in assignees)}")
        if issue.get("milestone"):
            lines.append(f"- milestone: {issue['milestone']}")
        lines.append(f"- url: {issue.get('html_url', '')}")

        body = (issue.get("body") or "").strip()
        if body:
            lines.append("\n### 本文\n")
            lines.append(body)
        else:
            lines.append("\n(本文なし)")

        if include_comments and comments:
            lines.append(f"\n### コメント ({len(comments)} 件)\n")
            for c in comments:
                lines.append(f"#### @{c.get('user', '')}  {c.get('created_at', '')}")
                lines.append(c.get("body") or "")
                lines.append("")
        elif include_comments:
            lines.append("\n(コメントなし)")

        return "\n".join(lines)


