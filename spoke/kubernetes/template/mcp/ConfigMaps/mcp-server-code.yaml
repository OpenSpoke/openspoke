    @mcp.tool()
    async def github_push_from_knowledge(
        namespace: str,
        staging_id: str,
        owner: str,
        repo: str,
        path: str,
        message: str,
        branch: str = "",
        delete_after_push: bool = True,
        user_id: str = "",
    ) -> str:
        """知識ベースに分割保存したコード片を結合して GitHub に push する。

        Claude (この LLM) は応答 token 制約で大きなファイルを 1 回の引数として
        渡せない。 そのため次の手順を踏む:
          1. upsert_knowledge を複数回呼んで、 1 ファイルを part に分けて保存
             (id 規約: github_staging_{staging_id}_part_{NNN}, 3 桁 0 埋め)
             例: github_staging_kernel_20260506_part_001
                 github_staging_kernel_20260506_part_002
                 ...
          2. この tool で staging_id を指定して push
             - 全 part を id 順に結合 → GitHub に 1 commit で push
             - 連番に欠番があれば push 中止 (中途半端な状態で push されない)
             - 成功したら staging エントリを自動削除 (delete_after_push=true)

        Args:
            namespace: 知識ベースのテナント識別子 (例: "user_example_com")
            staging_id: part 群を束ねる識別子 (英数+アンダースコア)
            owner: GitHub リポジトリのオーナー (例: "your-org")
            repo: リポジトリ名 (例: "rag")
            path: コミット先のファイルパス (例: "your-path/manifests/.../foo.yaml")
            message: commit message (必須、 空文字不可)
            branch: ブランチ名 (省略時は default branch)
            delete_after_push: push 成功後に staging エントリを自動削除するか (default True)
            user_id: the assistant systemの利用者 ID (任意)。 指定があればそのユーザー
                     の登録済み GitHub PAT が使われる。 未指定なら共通 token。
        """
        kernel = _ensure_kernel_url()
        try:
            resp = await _client.post(
                f"{kernel}/core/github/push-from-knowledge",
                json={
                    "namespace": namespace,
                    "staging_id": staging_id,
                    "owner": owner,
                    "repo": repo,
                    "path": path,
                    "message": message,
                    "branch": branch if branch else None,
                    "delete_after_push": delete_after_push,
                    "user_id": user_id,
                },
                timeout=120,
            )
            resp.raise_for_status()
            data = resp.json()
        except Exception as e:
            return f"push 失敗: {type(e).__name__}: {str(e)[:200]}"

        if not data.get("ok"):
            return f"push 失敗: {data.get('error', 'unknown')}"

        action = data.get("action", "?")
        commit_sha = data.get("commit_sha", "")
        html_url = data.get("html_url", "")
        total_parts = data.get("total_parts", 0)
        total_bytes = data.get("total_bytes", 0)
        deleted_parts = data.get("deleted_parts", 0)

        verb = "新規作成" if action == "created" else "更新"
        lines = [
            f"{verb}しました: {owner}/{repo}/{path}",
            f"- commit: {commit_sha[:7] if commit_sha else '(不明)'}",
            f"- url: {html_url}",
            f"- 結合 part 数: {total_parts}",
            f"- 結合サイズ: {total_bytes} bytes",
        ]
        if delete_after_push:
            lines.append(f"- staging クリーンアップ: {deleted_parts} 件削除")
        return "\n".join(lines)


    @mcp.tool()
    async def github_apply_str_replace(
        owner: str,
        repo: str,
        path: str,
        old_str: str,
        new_str: str,
        message: str,
        branch: str = "",
        count: int = 1,
        user_id: str = "",
    ) -> str:
        """GitHub 上のファイルを取得し、 文字列置換して直接 push する (差分編集)。

        Claude (この LLM) は応答 token 制約で大きなファイル全体を引数として
        渡せないため、 ファイル全体を再生成する github_put_file の代替として
        「old_str を new_str に置き換える」差分のみで GitHub を更新できる。

        動作:
            1. github_get_file 相当でファイル全文を取得 (MCP server 内で完結)
            2. old_str が content 内にちょうど count 回出現することを検証
               (出現数が一致しなければエラーで中止、 誤上書き防止)
            3. content.replace(old_str, new_str, count) で置換
            4. github_put_file 相当で push (1 commit)

        典型的な使い方:
            - 大きな ConfigMap (kernel.yaml 等) の特定の関数だけを修正
            - YAML マニフェストの一部の値だけを変更
            - コメント追加・誤字修正など局所的な編集

        制約:
            - old_str はファイル中で count 回ぴったり出現する必要 (str_replace と同じ規約)
            - old_str / new_str ともに UTF-8 テキスト
            - 改行コード (LF/CRLF) は元ファイルのものを保つこと

        Args:
            owner:   リポジトリオーナー (例: "your-org")
            repo:    リポジトリ名 (例: "rag")
            path:    ファイルパス (例: "your-path/manifests/.../foo.yaml")
            old_str: 置換対象の文字列 (ファイル中で count 回出現する必要)
            new_str: 置換後の文字列 (空文字なら old_str を削除)
            message: commit message (必須、 空文字不可)
            branch:  ブランチ名 (省略時は default branch)
            count:   期待される old_str の出現回数 (default 1、 安全装置)
            user_id: the assistant systemの利用者 ID (任意)。 指定があればそのユーザー
                     の登録済み GitHub PAT が使われる。 未指定なら共通 token。
        """
        kernel = _ensure_kernel_url()
        if not owner or not repo or not path:
            return "エラー: owner / repo / path は必須です。"
        if not old_str:
            return "エラー: old_str が空です。 何を置換するのか指定してください。"
        if not message:
            return "エラー: message (commit message) が必須です。"
        if count < 1:
            return f"エラー: count は 1 以上で指定してください (実際: {count})。"

        # 1. ファイル取得
        try:
            g_resp = await _client.post(
                f"{kernel}/core/github/get-file",
                json={"owner": owner, "repo": repo, "path": path,
                      "branch": branch if branch else None,
                      "user_id": user_id},
                timeout=60,
            )
            g_resp.raise_for_status()
            g_data = g_resp.json()
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if not g_data.get("ok"):
            return f"取得失敗: {g_data.get('error', 'unknown')}"
        if not g_data.get("exists"):
            return (
                f"ファイルが存在しません: {owner}/{repo}/{path}"
                + (f" (branch={branch})" if branch else "")
            )

        original_content = g_data.get("content") or ""
        original_size = len(original_content.encode("utf-8"))

        # 2. old_str の出現数検証 (str_replace と同じ規約: 期待回数と一致)
        actual_count = original_content.count(old_str)
        if actual_count != count:
            head = old_str[:80].replace("\n", "\\n")
            return (
                f"エラー: old_str の出現回数が期待と異なります。\n"
                f"- 期待: {count} 回\n"
                f"- 実際: {actual_count} 回\n"
                f"- old_str 先頭: {head}{'…' if len(old_str) > 80 else ''}\n"
                f"対処: old_str をより具体的にして一意化するか、 count 引数を実際の出現数に合わせる。"
            )

        # 3. 置換 (count 回まで置換、 既に検証済みなので安全)
        new_content = original_content.replace(old_str, new_str, count)

        if new_content == original_content:
            return "エラー: 置換後の内容が変わっていません (old_str と new_str が同一の可能性)。"

        new_size = len(new_content.encode("utf-8"))

        # 4. push
        try:
            p_resp = await _client.post(
                f"{kernel}/core/github/put-file",
                json={
                    "owner": owner, "repo": repo, "path": path,
                    "content": new_content, "message": message,
                    "branch": branch if branch else None,
                    "user_id": user_id,
                },
                timeout=120,
            )
            p_resp.raise_for_status()
            p_data = p_resp.json()
        except Exception as e:
            return f"push 失敗: {type(e).__name__}: {str(e)[:200]}"

        if not p_data.get("ok"):
            return f"push 失敗: {p_data.get('error', 'unknown')}"

        action = p_data.get("action") or "?"
        commit_sha = p_data.get("commit_sha") or ""
        html_url = p_data.get("html_url") or ""
        size_diff = new_size - original_size
        size_diff_str = f"+{size_diff}" if size_diff >= 0 else str(size_diff)

        return (
            f"差分編集を反映しました: {owner}/{repo}/{path}\n"
            f"- action: {action}\n"
            f"- commit: {commit_sha[:7]}\n"
            f"- url: {html_url}\n"
            f"- 置換回数: {count} 回\n"
            f"- サイズ変化: {original_size} → {new_size} bytes ({size_diff_str})"
        )


    @mcp.tool()
    async def github_grep_file(
        owner: str,
        repo: str,
        path: str,
        pattern: str,
        context: int = 2,
        max_matches: int = 50,
        ignore_case: bool = False,
        branch: str = "",
        user_id: str = "",
    ) -> str:
        """GitHub 上のファイルに対し正規表現 grep を実行し、 マッチ行と前後 context 行を返す。

        大きなファイル (数百 KB 〜 MB) に対して、 ファイル全体を取得せずに
        必要な箇所だけ特定するための tool。 github_apply_str_replace の前段で
        「どの old_str をターゲットにすべきか」 を素早く見つけるのに使う。

        動作:
            1. github_get_file 相当でファイル全文を取得 (MCP server 内で完結)
            2. pattern を re.compile(MULTILINE) で評価し、 マッチ行を抽出
            3. 各マッチに対し前後 context 行を付けて返す
            4. マッチ数が max_matches を超えたら打ち切り (truncated 表記)

        出力形式 (1 マッチごとに以下のブロック):
            === 行 N (マッチ) ===
            <行 N-context>
            ...
            <行 N>          ← マッチ行
            ...
            <行 N+context>

        Args:
            owner:       リポジトリオーナー (例: "your-org")
            repo:        リポジトリ名 (例: "rag")
            path:        ファイルパス (例: "your-path/manifests/.../foo.yaml")
            pattern:     Python 正規表現 (re.MULTILINE で評価)。 例: r'def\s+github_'
            context:     マッチ行の前後に含める行数 (default 2、 max 20)
            max_matches: 最大マッチ件数 (default 50、 max 200)
            ignore_case: True なら大文字小文字を無視
            branch:      ブランチ名 (省略時は default branch)
            user_id:     the assistant systemの利用者 ID (任意)。 指定があればそのユーザー
                         の登録済み GitHub PAT が使われる。 未指定なら共通 token。
        """
        import re

        kernel = _ensure_kernel_url()
        if not owner or not repo or not path:
            return "エラー: owner / repo / path は必須です。"
        if not pattern:
            return "エラー: pattern が空です。"
        if context < 0 or context > 20:
            return f"エラー: context は 0〜20 で指定してください (実際: {context})。"
        if max_matches < 1 or max_matches > 200:
            return f"エラー: max_matches は 1〜200 で指定してください (実際: {max_matches})。"

        # 1. ファイル取得
        try:
            g_resp = await _client.post(
                f"{kernel}/core/github/get-file",
                json={"owner": owner, "repo": repo, "path": path,
                      "branch": branch if branch else None,
                      "user_id": user_id},
                timeout=60,
            )
            g_resp.raise_for_status()
            g_data = g_resp.json()
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if not g_data.get("ok"):
            return f"取得失敗: {g_data.get('error', 'unknown')}"
        if not g_data.get("exists"):
            return (
                f"ファイルが存在しません: {owner}/{repo}/{path}"
                + (f" (branch={branch})" if branch else "")
            )

        content = g_data.get("content") or ""
        sha = g_data.get("sha", "")
        size = g_data.get("size", 0)

        # 2. 正規表現コンパイル
        flags = re.MULTILINE
        if ignore_case:
            flags |= re.IGNORECASE
        try:
            regex = re.compile(pattern, flags)
        except re.error as e:
            return f"エラー: 正規表現が不正です: {e}"

        # 3. 行単位でマッチ判定 (行単位の grep セマンティクスを採用)
        lines = content.splitlines()
        match_line_nums = []  # 1-indexed
        for i, line in enumerate(lines, start=1):
            if regex.search(line):
                match_line_nums.append(i)
                if len(match_line_nums) >= max_matches:
                    break

        total_matches = len(match_line_nums)
        truncated = total_matches >= max_matches

        # 4. 出力組み立て
        header = (
            f"## grep: {owner}/{repo}/{path}"
            + (f" (branch={branch})" if branch else "")
            + f"\nsize: {size} bytes, sha: {sha[:7]}, total_lines: {len(lines)}"
            + f"\npattern: {pattern}"
            + (" (ignore_case)" if ignore_case else "")
            + f"\nmatches: {total_matches}"
        )
        if truncated:
            header += f" (truncated at max_matches={max_matches})"

        if total_matches == 0:
            return header + "\n\n(マッチなし)"

        blocks = []
        for ln in match_line_nums:
            start = max(1, ln - context)
            end = min(len(lines), ln + context)
            block_lines = []
            block_lines.append(f"=== 行 {ln} (マッチ) ===")
            for j in range(start, end + 1):
                marker = ">" if j == ln else " "
                block_lines.append(f"{marker}{j:6d}: {lines[j-1]}")
            blocks.append("\n".join(block_lines))

        return header + "\n\n" + "\n\n".join(blocks)


    @mcp.tool()
    async def github_get_file_range(
        owner: str,
        repo: str,
        path: str,
        start_line: int,
        end_line: int,
        branch: str = "",
        user_id: str = "",
    ) -> str:
        """GitHub 上のファイルから指定行範囲だけを取得する (1-indexed、 両端含む)。

        github_grep_file でマッチ位置を特定した後、 その周辺をより広く見たい場合に使う。
        ファイル全文を毎回取得する代わりに、 必要な範囲だけを応答に載せられる。

        Args:
            owner:      リポジトリオーナー
            repo:       リポジトリ名
            path:       ファイルパス
            start_line: 開始行 (1-indexed、 1 以上)
            end_line:   終了行 (1-indexed、 start_line 以上)。 ファイル末尾を超えた場合は末尾まで。
            branch:     ブランチ名 (省略時は default branch)
            user_id:    the assistant systemの利用者 ID (任意)。 指定があればそのユーザー
                        の登録済み GitHub PAT が使われる。 未指定なら共通 token。
        """
        kernel = _ensure_kernel_url()
        if not owner or not repo or not path:
            return "エラー: owner / repo / path は必須です。"
        if start_line < 1:
            return f"エラー: start_line は 1 以上 (実際: {start_line})。"
        if end_line < start_line:
            return f"エラー: end_line は start_line 以上 (start={start_line}, end={end_line})。"
        if end_line - start_line > 5000:
            return f"エラー: 範囲が広すぎます (max 5000 行、 実際: {end_line - start_line + 1} 行)。"

        try:
            g_resp = await _client.post(
                f"{kernel}/core/github/get-file",
                json={"owner": owner, "repo": repo, "path": path,
                      "branch": branch if branch else None,
                      "user_id": user_id},
                timeout=60,
            )
            g_resp.raise_for_status()
            g_data = g_resp.json()
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if not g_data.get("ok"):
            return f"取得失敗: {g_data.get('error', 'unknown')}"
        if not g_data.get("exists"):
            return (
                f"ファイルが存在しません: {owner}/{repo}/{path}"
                + (f" (branch={branch})" if branch else "")
            )

        content = g_data.get("content") or ""
        sha = g_data.get("sha", "")
        size = g_data.get("size", 0)
        lines = content.splitlines()
        total_lines = len(lines)

        if start_line > total_lines:
            return (
                f"## {owner}/{repo}/{path}\n"
                f"size: {size} bytes, sha: {sha[:7]}, total_lines: {total_lines}\n"
                f"(start_line={start_line} はファイル末尾 {total_lines} を超えています)"
            )

        actual_end = min(end_line, total_lines)
        selected = lines[start_line - 1:actual_end]
        numbered = "\n".join(f"{start_line + i:6d}: {ln}" for i, ln in enumerate(selected))

        header = (
            f"## {owner}/{repo}/{path}"
            + (f" (branch={branch})" if branch else "")
            + f"\nsize: {size} bytes, sha: {sha[:7]}, total_lines: {total_lines}"
            + f"\nrange: 行 {start_line} - {actual_end} ({len(selected)} 行)"
        )
        return header + "\n\n" + numbered


    # ============================================================
    # GitHub Account Management (per-user PAT)
    # ============================================================
    # the assistant systemのユーザーごとに GitHub Personal Access Token を登録・管理する。
    # メールアカウントと同じ流儀:
    #  - add/update/delete は stage_draft で保留 → 利用者承認 → the assistant backend で実行
    #  - list は読み取り専用、 kernel /core/github-account/list を直接呼ぶ (承認不要)
    # 既存の github_* tool 群 (get_file, put_file 等) は user_id 引数を渡せば
    # ここで登録した PAT が使われる。 未指定なら共通 token (環境変数) にフォールバック。

    @mcp.tool()
    async def add_github_account(
        user_id: str,
        account_id: str,
        token: str,
        account_label: str = "",
        default: bool = False,
    ) -> str:
        """GitHub アカウント (Personal Access Token) を登録する (利用者承認 → the assistant backend が実行)。

        登録時に GitHub API /user を叩いて token を検証する。
        検証成功時のみ保存され、 取得した login / scopes も一緒に保存される。

        承認フロー:
        1. この tool を呼ぶと内容が Valkey に保留される (stage_draft 経由)
        2. 利用者に「以下の内容で登録してよろしいですか？」 と確認する
        3. 利用者が「はい」 と答えると、 the assistant backend が kernel
           /core/github-account/add を呼んでアカウントを登録する

        重要: token は平文で OpenSearch に保存される (メールアカウントと同方針)。

        既存アカウントが無い状態で登録する場合は default=False でも自動的に
        default=True で保存される (= そのユーザーの既定 token になる)。
        既存アカウントがある状態で default=True を指定すると、 既存の default は
        自動で False に切り替わる。

        Args:
            user_id:       アカウント所有者 (the assistant systemの利用者 ID)
            account_id:    アカウント識別子 (英数+アンダースコア/ハイフン、 例: "github_main")
                           同じ user_id 内で一意
            token:         GitHub Personal Access Token (PAT、 例: "ghp_...")
            account_label: 利用者向け表示名 (省略時は account_id)
            default:       True にすると既定アカウントとして登録 (default False)
        """
        if not user_id:
            return "エラー: user_id が指定されていません。"
        if not account_id:
            return "エラー: account_id が指定されていません。"
        if not token:
            return "エラー: token が指定されていません。"

        args = {
            "account_id": account_id,
            "account_label": account_label or account_id,
            "token": token,
            "default": bool(default),
        }
        return await stage_draft(user_id=user_id, tool="add_github_account", args=args)


    @mcp.tool()
    async def list_github_account(user_id: str) -> str:
        """登録済み GitHub アカウントの一覧を返す (読み取り専用、 承認不要)。

        token はマスク表示される (先頭 4 文字 + アスタリスク + 末尾 4 文字)。
        github_login / scopes / default / 最終使用時刻も確認できる。

        Args:
            user_id: アカウント所有者
        """
        if not user_id:
            return "エラー: user_id が指定されていません。"

        kernel = _ensure_kernel_url()
        try:
            async with httpx.AsyncClient(timeout=15.0) as client:
                resp = await client.post(
                    f"{kernel}/core/github-account/list",
                    json={"user_id": user_id},
                )
                resp.raise_for_status()
                data = resp.json()
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if not data.get("ok"):
            return f"取得失敗: {data.get('error', 'unknown')}"

        accounts = data.get("accounts", [])
        if not accounts:
            return f"user_id={user_id} に登録されている GitHub アカウントはありません。"

        lines = [f"## GitHub アカウント一覧 ({len(accounts)} 件) user_id={user_id}\n"]
        for i, a in enumerate(accounts, 1):
            default_mark = " (既定)" if a.get("default") else ""
            lines.append(
                f"### [{i}] {a.get('account_label', a.get('account_id', ''))}{default_mark}"
            )
            lines.append(f"- account_id: {a.get('account_id', '')}")
            lines.append(f"- github_login: {a.get('github_login', '')}")
            lines.append(f"- scopes: {', '.join(a.get('scopes', []) or []) or '(none)'}")
            lines.append(f"- token: {a.get('token_masked', '')}")
            lines.append(f"- default: {a.get('default', False)}")
            lines.append(f"- created_at: {a.get('created_at', '')}")
            lines.append(f"- updated_at: {a.get('updated_at', '')}")
            last_used = a.get("last_used_at") or "(未使用)"
            lines.append(f"- last_used_at: {last_used}")
            lines.append("")

        return "\n".join(lines)


    @mcp.tool()
    async def update_github_account(
        user_id: str,
        account_id: str,
        token: str = "",
        account_label: str = "",
        default: bool = None,
    ) -> str:
        """GitHub アカウントの部分更新 (利用者承認 → the assistant backend が実行)。

        指定したフィールドだけ更新される。 空文字や None のフィールドは変更しない。
        token を指定した場合は GitHub API /user で再検証してから差し替える。
        default=True を指定すると同ユーザーの他アカウントは自動で default=False に。

        承認フロー:
        1. この tool を呼ぶと内容が Valkey に保留される (stage_draft 経由)
        2. 利用者に確認を取る
        3. 利用者が「はい」 と答えると、 the assistant backend が kernel
           /core/github-account/update を呼ぶ

        Args:
            user_id:       アカウント所有者
            account_id:    更新対象のアカウント識別子
            token:         新しい PAT (空文字なら変更しない)
            account_label: 新しい表示名 (空文字なら変更しない)
            default:       既定アカウントにするか (None なら変更しない)
        """
        if not user_id:
            return "エラー: user_id が指定されていません。"
        if not account_id:
            return "エラー: account_id が指定されていません。"

        args: dict = {"account_id": account_id}
        if token:
            args["token"] = token
        if account_label:
            args["account_label"] = account_label
        if default is not None:
            args["default"] = bool(default)

        if len(args) <= 1:
            return "エラー: 更新すべきフィールドが指定されていません (token / account_label / default のいずれかを指定)。"

        return await stage_draft(user_id=user_id, tool="update_github_account", args=args)


    @mcp.tool()
    async def delete_github_account(
        user_id: str,
        account_id: str,
    ) -> str:
        """GitHub アカウントを削除する (利用者承認 → the assistant backend が実行)。

        削除対象が default=True だった場合、 残ったアカウントのうち最も古い
        ものが自動的に default=True に昇格する。

        承認フロー:
        1. この tool を呼ぶと内容が Valkey に保留される (stage_draft 経由)
        2. 利用者に確認を取る
        3. 利用者が「はい」 と答えると、 the assistant backend が kernel
           /core/github-account/delete を呼ぶ

        Args:
            user_id:    アカウント所有者
            account_id: 削除対象のアカウント識別子
        """
        if not user_id:
            return "エラー: user_id が指定されていません。"
        if not account_id:
            return "エラー: account_id が指定されていません。"

        args = {"account_id": account_id}
        return await stage_draft(user_id=user_id, tool="delete_github_account", args=args)


    @mcp.tool()
    async def feature_request_search(
        app_name: str = "",
        status: str = "",
        priority: str = "",
        keyword: str = "",
        limit: int = 20,
    ) -> str:
        """要望管理 (feature_requests インデックス) を検索する。

        the assistant system等の各アプリで投稿された要望を、 アプリ名・ステータス・優先度・
        キーワード (タイトル・本文) で絞り込んで一覧する。 Claude (私) がフロントエンドの
        運用タブと別に、 このチャットから要望を確認・修正方針を検討するために使う。

        Args:
            app_name: アプリ名で絞り込む (例: "secretary")。 空文字なら全アプリ
            status:   ステータスで絞り込む ("open" / "in_progress" / "done" / "rejected")
            priority: 優先度で絞り込む ("high" / "medium" / "low")
            keyword:  タイトル + 本文の全文検索 (kuromoji)
            limit:    最大件数 (default 20、 max 200)

        戻り値: 整形済みテキスト。 各要望は次の項目を含む:
            - request_id, app_name, status, priority, title
            - 投稿者表示名 / 投稿日 / 更新日 / 完了日
            - 本文 (description) の冒頭 200 字
            - 関連ファイル (files)
            - assistant_conversation の最新発言 1 件 (あれば)
        """
        kernel = _ensure_kernel_url()
        if limit < 1 or limit > 200:
            return f"エラー: limit は 1〜200 で指定してください (実際: {limit})。"

        must_clauses = []
        if app_name:
            must_clauses.append({"term": {"app_name": app_name}})
        if status:
            must_clauses.append({"term": {"status": status}})
        if priority:
            must_clauses.append({"term": {"priority": priority}})
        if keyword:
            must_clauses.append({
                "multi_match": {
                    "query": keyword,
                    "fields": ["title^2", "description"],
                    "type": "best_fields",
                }
            })

        query = {
            "size": int(limit),
            "track_total_hits": True,
            "sort": [{"created_at": {"order": "desc"}}],
        }
        if must_clauses:
            query["query"] = {"bool": {"must": must_clauses}}
        else:
            query["query"] = {"match_all": {}}

        try:
            resp = await _client.post(
                f"{kernel}/core/opensearch/request",
                json={
                    "method": "POST",
                    "path": "/feature_requests/_search",
                    "body": query,
                    "timeout": 30,
                },
                timeout=60,
            )
            resp.raise_for_status()
            data = resp.json()
        except Exception as e:
            return f"検索失敗: {type(e).__name__}: {str(e)[:200]}"

        status_code = int(data.get("status_code", 0) or 0)
        if status_code != 200:
            return f"検索失敗: kernel /core/opensearch/request status={status_code} error={data.get('error', '')}"

        json_data = data.get("json") or {}
        hits = (json_data.get("hits") or {}).get("hits") or []
        total = (json_data.get("hits") or {}).get("total", {}).get("value", 0)

        if not hits:
            filters = []
            if app_name:
                filters.append(f"app_name={app_name}")
            if status:
                filters.append(f"status={status}")
            if priority:
                filters.append(f"priority={priority}")
            if keyword:
                filters.append(f"keyword={keyword!r}")
            filter_str = ", ".join(filters) if filters else "(なし)"
            return f"## 要望検索結果\nフィルタ: {filter_str}\n\n該当なし"

        lines = [f"## 要望検索結果 (全 {total} 件中 {len(hits)} 件)"]
        if app_name:
            lines.append(f"- app_name: {app_name}")
        if status:
            lines.append(f"- status: {status}")
        if priority:
            lines.append(f"- priority: {priority}")
        if keyword:
            lines.append(f"- keyword: {keyword}")
        lines.append("")

        for h in hits:
            src = h.get("_source") or {}
            req_id = src.get("request_id", "")
            t = src.get("title", "")
            d = src.get("description", "") or ""
            d_short = d[:200] + ("…" if len(d) > 200 else "")
            st_ = src.get("status", "")
            pr = src.get("priority", "")
            an = src.get("app_name", "")
            author = src.get("created_by_display_name") or src.get("created_by_user_id", "")
            ca = (src.get("created_at") or "")[:19]
            ua = (src.get("updated_at") or "")[:19]
            ra = (src.get("resolved_at") or "")[:19]
            files = src.get("files") or []
            conv = src.get("assistant_conversation") or []

            lines.append(f"### [{st_}/{pr}] {t}")
            lines.append(f"- id: `{req_id}` / app: {an} / 投稿者: {author}")
            lines.append(f"- 投稿: {ca} / 更新: {ua}" + (f" / 完了: {ra}" if ra else ""))
            lines.append(f"- 本文: {d_short}")
            if files:
                lines.append("- 関連ファイル:")
                for f in files:
                    lines.append(f"  - `{f.get('path', '')}`: {f.get('comment', '')}")
            if conv:
                last = conv[-1]
                last_role = last.get("role", "")
                last_content = (last.get("content", "") or "")[:150]
                last_model = last.get("model_used", "")
                lines.append(
                    f"- 最終発言 ({last_role}{f', {last_model}' if last_model else ''}): {last_content}"
                )
            lines.append("")

        return "\n".join(lines)


    @mcp.tool()
    async def feature_request_get(request_id: str) -> str:
        """要望 1 件の詳細を取得する (assistant_conversation 含む全件)。

        feature_request_search で見つけた要望の id を渡して、 詳細を見るための tool。
        会話履歴の全ターンを含めて返す。

        Args:
            request_id: feature_requests の request_id (例: "req_20260512_001234_abcdef12")

        戻り値: 整形済みテキスト。 タイトル、 本文、 関連ファイル、 アシスタント会話の全履歴を含む。
        """
        kernel = _ensure_kernel_url()
        if not request_id:
            return "エラー: request_id が空です。"

        try:
            resp = await _client.post(
                f"{kernel}/core/opensearch/request",
                json={
                    "method": "GET",
                    "path": f"/feature_requests/_doc/{request_id}",
                    "timeout": 10,
                },
                timeout=30,
            )
            resp.raise_for_status()
            data = resp.json()
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        status_code = int(data.get("status_code", 0) or 0)
        if status_code == 404:
            return f"要望が見つかりません: {request_id}"
        if status_code != 200:
            return f"取得失敗: kernel /core/opensearch/request status={status_code} error={data.get('error', '')}"

        json_data = data.get("json") or {}
        src = json_data.get("_source") or {}
        if not src:
            return f"要望が見つかりません: {request_id} (_source 空)"

        t = src.get("title", "")
        d = src.get("description", "") or ""
        st_ = src.get("status", "")
        pr = src.get("priority", "")
        an = src.get("app_name", "")
        author = src.get("created_by_display_name") or src.get("created_by_user_id", "")
        slack_id = src.get("created_by_slack_id", "")
        ca = (src.get("created_at") or "")[:19]
        ua = (src.get("updated_at") or "")[:19]
        ra = (src.get("resolved_at") or "")[:19]
        note = src.get("resolved_note", "") or ""
        files = src.get("files") or []
        attachments = src.get("attachments") or []
        conv = src.get("assistant_conversation") or []

        lines = []
        lines.append(f"# 要望詳細: {t}")
        lines.append(f"- id: `{request_id}`")
        lines.append(f"- app: {an}")
        lines.append(f"- status: **{st_}** / priority: **{pr}**")
        lines.append(f"- 投稿者: {author}" + (f" (Slack: {slack_id})" if slack_id else ""))
        lines.append(f"- 投稿: {ca}")
        lines.append(f"- 更新: {ua}")
        if ra:
            lines.append(f"- 完了: {ra}")
        if note:
            lines.append(f"- 対応内容: {note}")
        lines.append("")
        lines.append("## 本文")
        lines.append(d if d else "_(本文なし)_")

        # Phase 4: 添付ファイル一覧 (新フィールド)
        if attachments:
            lines.append("")
            lines.append(f"## 添付ファイル ({len(attachments)} 件)")
            for a in attachments:
                aid = a.get("attachment_id", "")
                fn  = a.get("filename", "")
                sz  = a.get("size", 0)
                ct  = a.get("content_type", "")
                ua_ = (a.get("uploaded_at") or "")[:19]
                lines.append(f"- `{aid}` {fn} ({sz:,} bytes, {ct}, uploaded {ua_})")
            lines.append("")
            lines.append("_テキスト抽出には feature_request_get_attachment_text を使ってください。_")

        # 旧 files フィールド (Phase 3 以前の要望のみ表示)
        if files:
            lines.append("")
            lines.append("## 関連ファイル (旧形式、 参照のみ)")
            for f in files:
                lines.append(f"- `{f.get('path', '')}`: {f.get('comment', '')}")

        if conv:
            lines.append("")
            lines.append(f"## アシスタント会話 ({len(conv)} 件)")
            for i, c in enumerate(conv, start=1):
                role = c.get("role", "")
                content = c.get("content", "") or ""
                model = c.get("model_used", "")
                ts = (c.get("timestamp") or "")[:19]
                role_label = "あなた" if role == "user" else "アシスタント"
                model_label = f" [{model}]" if model else ""
                lines.append(f"### [{i}] {role_label}{model_label} ({ts})")
                lines.append(content)
                lines.append("")

        return "\n".join(lines)


    @mcp.tool()
    async def feature_request_get_attachment_text(
        request_id: str,
        attachment_id: str,
        max_chars: int = 30000,
    ) -> str:
        """要望に添付されたファイルからテキストを抽出して返す。

        対応形式: docx / xlsx / pptx / pdf / txt / md / csv / tsv。
        feature_request_get で `## 添付ファイル` セクションに表示される
        attachment_id (例: "att_20260512_123456_abcdef12") をそのまま渡す。

        Args:
            request_id: 要望の request_id
            attachment_id: 添付の attachment_id
            max_chars: 返すテキストの最大文字数 (0 なら全文、 default 30000)

        戻り値:
            添付ファイルから抽出した本文テキスト (整形のためのヘッダ付き)。
            該当ファイルが存在しない、 もしくは対応外形式の場合はエラー文字列を返す。
        """
        if not request_id or not attachment_id:
            return "エラー: request_id と attachment_id は必須です。"

        url = f"{RAG_URL}/feature-requests/{request_id}/attachments/{attachment_id}/text"
        try:
            resp = await _client.get(
                url,
                params={"max_chars": int(max_chars) if max_chars else 0},
                timeout=120,
            )
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if resp.status_code == 404:
            return f"添付ファイルが見つかりません: request_id={request_id}, attachment_id={attachment_id}"
        if resp.status_code == 400:
            try:
                detail = resp.json().get("detail", "")
            except Exception:
                detail = resp.text[:300]
            return f"テキスト抽出不可: {detail}"
        if resp.status_code != 200:
            return f"取得失敗: HTTP {resp.status_code}: {resp.text[:300]}"

        try:
            data = resp.json()
        except Exception as e:
            return f"レスポンス解析失敗: {type(e).__name__}: {str(e)[:200]}"

        fn   = data.get("filename", "")
        sz   = data.get("size", 0)
        ch   = data.get("chars", 0)
        tr   = data.get("truncated", False)
        text = data.get("text", "") or ""

        lines = []
        lines.append(f"# 添付ファイル抽出テキスト")
        lines.append(f"- request_id: `{request_id}`")
        lines.append(f"- attachment_id: `{attachment_id}`")
        lines.append(f"- filename: {fn}")
        lines.append(f"- size: {sz:,} bytes")
        lines.append(f"- 抽出文字数: {ch:,}" + (" (※ 切り詰め済み)" if tr else ""))
        lines.append("")
        lines.append("## 本文")
        lines.append(text if text else "_(抽出結果は空)_")
        return "\n".join(lines)


    # ────────────────────────────────────────────────────────────────────────
    # 知識転送機構 (Phase 3)
    # ────────────────────────────────────────────────────────────────────────
    # 私 (Claude) とthe assistant systemが知識を常時同期するための tool 群。
    # collection 命名規則: secretary_knowledge_{tenant}  (例: secretary_knowledge_example)
    # tool 側で渡された namespace を上記パターンに展開する。
    # collection が存在しなければ自動作成する (schema 固定)。
    #
    # 設計判断:
    #   - kernel 側の /core/vectorstore/upsert は内部で collection.insert() を
    #     呼ぶ「単純 insert」であり真の upsert ではない。同 id で複数行が増える。
    #   - そこで tool 側で「delete (existing id) → insert」の 2 段階実行で
    #     冪等性を担保する。原子性は厳密でないが、再呼び出しで復旧可能。
    #   - 既存の汎用 tool (vector_search 等) と同じく kernel 経由のみ。
    #     pymilvus を MCP server に直接持ち込まない。

    KNOWLEDGE_COLLECTION_PREFIX = "secretary_knowledge_"
    KNOWLEDGE_SHARED_COLLECTION = "secretary_knowledge_shared"
    KNOWLEDGE_EMBEDDING_DIM = 384
    # 注: ベクトルフィールド名は既存の secretary_conv_* / vector_search の規約に合わせて
    #     "vector" とする (kernel /core/vectorstore/search の anns_field default="vector" と一致)。
    KNOWLEDGE_SCHEMA = {
        "fields": [
            {"name": "id",         "dtype": "VARCHAR", "is_primary": True,
             "max_length": 128,    "description": "知識エントリの一意識別子 (手動指定)"},
            {"name": "vector",     "dtype": "FLOAT_VECTOR", "dim": KNOWLEDGE_EMBEDDING_DIM,
             "description": "title + content から生成した埋め込みベクトル"},
            {"name": "title",      "dtype": "VARCHAR", "max_length": 512,
             "description": "知識エントリのタイトル (1 行)"},
            {"name": "content",    "dtype": "VARCHAR", "max_length": 65535,
             "description": "本文 (推奨 500-2000 字、 主題エントリ)"},
            {"name": "category",   "dtype": "VARCHAR", "max_length": 64,
             "description": "粒度カテゴリ (topic / principle / troubleshooting / future_plan 等)"},
            {"name": "created_at", "dtype": "VARCHAR", "max_length": 32,
             "description": "ISO8601 (UTC)"},
            {"name": "updated_at", "dtype": "VARCHAR", "max_length": 32,
             "description": "ISO8601 (UTC)"},
        ],
        "description": "Knowledge transfer collection (Admin <-> Claude <-> Secretary)",
    }
    # 共有 collection schema: 個人 collection と同じ列 + owner_user_id (作成者) と original_id を持つ。
    # 共有 collection の id は "{owner_user_id}__{original_id}" の形 (衝突回避)。
    KNOWLEDGE_SHARED_SCHEMA = {
        "fields": [
            {"name": "id",             "dtype": "VARCHAR", "is_primary": True,
             "max_length": 384,        "description": "共有エントリ ID: {owner_user_id}__{original_id}"},
            {"name": "vector",         "dtype": "FLOAT_VECTOR", "dim": KNOWLEDGE_EMBEDDING_DIM,
             "description": "title + content から生成した埋め込みベクトル"},
            {"name": "owner_user_id",  "dtype": "VARCHAR", "max_length": 256,
             "description": "共有エントリの作成者 (the assistant systemの user_id)"},
            {"name": "original_id",    "dtype": "VARCHAR", "max_length": 128,
             "description": "作成者の collection 上での元 id"},
            {"name": "title",          "dtype": "VARCHAR", "max_length": 512,
             "description": "知識エントリのタイトル (1 行)"},
            {"name": "content",        "dtype": "VARCHAR", "max_length": 65535,
             "description": "本文"},
            {"name": "category",       "dtype": "VARCHAR", "max_length": 64,
             "description": "粒度カテゴリ"},
            {"name": "created_at",     "dtype": "VARCHAR", "max_length": 32,
             "description": "ISO8601 (UTC)"},
            {"name": "updated_at",     "dtype": "VARCHAR", "max_length": 32,
             "description": "ISO8601 (UTC)"},
        ],
        "description": "Shared knowledge collection (cross-user, read-by-all, write-by-owner)",
    }
    KNOWLEDGE_INDEX = {
        "field": "vector",
        "index_type": "IVF_FLAT",
        "metric_type": "COSINE",
        "params": {"nlist": 128},
    }


    def _resolve_knowledge_collection(namespace: str) -> str:
        """namespace (テナント識別子) から実際の Milvus collection 名を組み立てる。

        Milvus collection 名は英数とアンダースコアのみを許容するため、
        namespace に含まれる英数以外の文字 (ハイフン、 ピリオド、 @ 等) は
        `_` に置換する。 これはthe assistantバックエンドの get_secretary_collection_name
        および kernel の _knowledge_resolve_collection と同じ正規化規則。

        例:
            "example-user"
                -> "secretary_knowledge_example_user"
            "00000000-0000-0000-0000-000000000000"  (Keycloak sub UUID)
                -> "secretary_knowledge_00000000_0000_0000_0000_000000000000"
            "user@example.com"
                -> "secretary_knowledge_user_example_com"
            "secretary_knowledge_xxx"  (既に prefix 付き)
                -> "secretary_knowledge_xxx" (そのまま返す)
        """
        ns = (namespace or "").strip()
        if not ns:
            return ""
        if ns.startswith(KNOWLEDGE_COLLECTION_PREFIX):
            return ns
        # 英数以外を _ に置換 (Milvus collection 名規約に準拠)
        safe = "".join(c if c.isalnum() else "_" for c in ns)
        return KNOWLEDGE_COLLECTION_PREFIX + safe


    def _validate_knowledge_id(entry_id: str) -> str:
        """知識エントリ ID の形式を検証する。エラー文字列を返す (空なら OK)。"""
        if not entry_id:
            return "id が指定されていません。"
        if len(entry_id) > 128:
            return f"id が長すぎます (最大 128 文字, 実際 {len(entry_id)})。"
        # 半角英数とアンダースコアのみ
        for c in entry_id:
            if not (c.isascii() and (c.isalnum() or c == "_")):
                return f"id に使用できない文字が含まれています ('{c}')。半角英数とアンダースコアのみ。"
        return ""


    async def _ensure_knowledge_collection(kernel: str, collection_name: str) -> str:
        """collection が存在しなければ schema 付きで作成する。エラー文字列を返す (空なら OK)。"""
        # 1. 存在確認
        h_resp = await _client.post(
            f"{kernel}/core/vectorstore/has-namespace",
            json={"namespace": collection_name},
        )
        h_resp.raise_for_status()
        h_data = h_resp.json()
        if h_data.get("error"):
            return f"has-namespace 失敗: {h_data['error']}"
        if h_data.get("exists"):
            return ""

        # 2. 作成
        i_resp = await _client.post(
            f"{kernel}/core/vectorstore/init-namespace",
            json={
                "namespace": collection_name,
                "schema": KNOWLEDGE_SCHEMA,
                "index": KNOWLEDGE_INDEX,
            },
        )
        i_resp.raise_for_status()
        i_data = i_resp.json()
        if not i_data.get("ok"):
            return f"init-namespace 失敗: {i_data.get('error', 'unknown')}"
        return ""


    async def _ensure_shared_collection(kernel: str) -> str:
        """共有 collection が存在しなければ schema 付きで作成する。 エラー文字列を返す (空なら OK)。"""
        h_resp = await _client.post(
            f"{kernel}/core/vectorstore/has-namespace",
            json={"namespace": KNOWLEDGE_SHARED_COLLECTION},
        )
        h_resp.raise_for_status()
        h_data = h_resp.json()
        if h_data.get("error"):
            return f"has-namespace 失敗: {h_data['error']}"
        if h_data.get("exists"):
            return ""
        i_resp = await _client.post(
            f"{kernel}/core/vectorstore/init-namespace",
            json={
                "namespace": KNOWLEDGE_SHARED_COLLECTION,
                "schema": KNOWLEDGE_SHARED_SCHEMA,
                "index": KNOWLEDGE_INDEX,
            },
        )
        i_resp.raise_for_status()
        i_data = i_resp.json()
        if not i_data.get("ok"):
            return f"shared init-namespace 失敗: {i_data.get('error', 'unknown')}"
        return ""


    def _shared_id(owner_user_id: str, original_id: str) -> str:
        """共有 collection 用の合成 id を組み立てる。"""
        return f"{owner_user_id}__{original_id}"


    @mcp.tool()
    async def upsert_knowledge(
        namespace: str,
        id: str,
        title: str,
        content: str,
        category: str = "topic",
        mode: str = "upsert",
        is_shared: bool = None,
    ) -> str:
        """知識エントリを Milvus に保存する (新規・更新両対応の冪等操作)。

        私 (Claude) とthe assistant systemが共有する知識ベースに 1 エントリを記録する。
        同じ id が既に存在する場合の挙動は mode 引数で制御する。

        共有 (is_shared) について:
            - is_shared=True: 共有エントリとしてthe assistant system共通の collection
              "secretary_knowledge_shared" に保存される。 全ユーザーから読み取り可能。
              共有 collection 内では id="{owner_user_id}__{original_id}" の形で
              識別されるため、 別ユーザーが同じ original_id で共有しても衝突しない。
            - is_shared=False (default): 自分専用の collection
              "secretary_knowledge_{user_id}" に保存される。 自分しか読めない。
            - is_shared=None (省略): 新規・更新ともに「自分の collection」 を対象にする
              (= private 扱い)。 既存共有エントリを更新したい場合は明示的に
              is_shared=True を渡す必要がある。

        private と共有の切り替え:
            「○○を共有して」 と言われたら、 同じ内容で is_shared=True で再 upsert する
            (元の private エントリは残る。 残したくなければ delete_knowledge で消す)。
            「共有を解除して」 と言われたら、 共有エントリを delete_knowledge してから
            必要なら同じ内容を is_shared=False で改めて保存する。

        collection 名は namespace から自動展開される:
            "user_example_com" → "secretary_knowledge_user_example_com"
        collection が存在しなければ schema 付きで自動作成する。

        Args:
            namespace: テナント識別子 (例: "user_example_com")。
                       secretary_knowledge_ prefix は省略可
            id:        知識エントリ ID (半角英数とアンダースコア、 128 文字以内)。
                       共有 collection に書く時は内部的に "{owner}__{id}" に展開される
            title:     1 行タイトル (512 文字以内)
            content:   本文 (推奨 500-2000 字、 65535 文字以内)
            category:  粒度カテゴリ
            mode:      衝突制御モード ("create" / "update" / "upsert")
            is_shared: 共有フラグ。 詳細は上の「共有について」 を参照
        """
        kernel = _ensure_kernel_url()

        # 1. 入力検証
        err = _validate_knowledge_id(id)
        if err:
            return f"エラー: {err}"
        if not title:
            return "エラー: title が指定されていません。"
        if not content:
            return "エラー: content が指定されていません。"
        if len(title) > 512:
            return f"エラー: title が長すぎます (最大 512 文字, 実際 {len(title)})。"
        if len(content) > 65535:
            return f"エラー: content が長すぎます (最大 65535 文字, 実際 {len(content)})。"
        if len(category) > 64:
            return f"エラー: category が長すぎます (最大 64 文字, 実際 {len(category)})。"
        if mode not in ("create", "update", "upsert"):
            return f"エラー: mode は 'create' / 'update' / 'upsert' のいずれかを指定してください (実際: '{mode}')。"

        if not (namespace or "").strip():
            return "エラー: namespace が指定されていません。"

        # owner_user_id: namespace を正規化前の生 namespace から導出
        owner_user_id = (namespace or "").strip()
        if owner_user_id.startswith(KNOWLEDGE_COLLECTION_PREFIX):
            owner_user_id = owner_user_id[len(KNOWLEDGE_COLLECTION_PREFIX):]

        # 2. ターゲット collection の決定
        target_is_shared = bool(is_shared) if is_shared else False
        if target_is_shared:
            collection_name = KNOWLEDGE_SHARED_COLLECTION
            target_id = _shared_id(owner_user_id, id)
            err = await _ensure_shared_collection(kernel)
            if err:
                return f"エラー: {err}"
        else:
            collection_name = _resolve_knowledge_collection(namespace)
            target_id = id
            err = await _ensure_knowledge_collection(kernel, collection_name)
            if err:
                return f"エラー: {err}"

        # 3. embedding 生成 (title + content を結合してベクトル化)
        emb_text = f"{title}\n\n{content}"
        emb_resp = await _client.post(
            f"{kernel}/core/embedding/single",
            json={"text": emb_text},
        )
        emb_resp.raise_for_status()
        emb_data = emb_resp.json()
        vector = emb_data.get("embedding")
        if not vector:
            return "エラー: embedding 取得に失敗しました。"
        if len(vector) != KNOWLEDGE_EMBEDDING_DIM:
            return f"エラー: ベクトル次元数が不正 (期待 {KNOWLEDGE_EMBEDDING_DIM}, 実際 {len(vector)})。"

        # 4. 既存 id があれば削除 (冪等性確保)。 既存の created_at は保持。
        from datetime import datetime, timezone
        now_iso = datetime.now(timezone.utc).isoformat(timespec="seconds")
        created_at = now_iso

        q_resp = await _client.post(
            f"{kernel}/core/vectorstore/query",
            json={
                "namespace": collection_name,
                "expr": f'id == "{target_id}"',
                "output_fields": ["id", "title", "created_at"],
                "limit": 1,
            },
        )
        q_resp.raise_for_status()
        q_data = q_resp.json()
        existing = (q_data.get("results") or []) if q_data.get("ok") else []
        is_update = bool(existing)

        # mode による衝突制御
        if mode == "create" and is_update:
            ex_title = existing[0].get("title", "")
            return (
                f"エラー: id='{id}' は既に存在します (mode='create' は新規専用)。\n"
                f"  既存 title: {ex_title}\n"
                f"  対処: 別の id を選んで再試行する、 または mode='update' / 'upsert' を指定する。"
            )
        if mode == "update" and not is_update:
            return (
                f"エラー: id='{id}' は存在しません (mode='update' は既存専用)。\n"
                f"  対処: 新規作成するなら mode='create' を指定する。"
            )

        if is_update:
            ex_created = existing[0].get("created_at")
            if ex_created:
                created_at = ex_created
            d_resp = await _client.post(
                f"{kernel}/core/vectorstore/delete",
                json={"namespace": collection_name, "expr": f'id == "{target_id}"'},
            )
            d_resp.raise_for_status()
            d_data = d_resp.json()
            if not d_data.get("ok"):
                return f"エラー: 既存エントリの削除に失敗 ({d_data.get('error', 'unknown')})。"

        # 5. insert (collection によって row 構造が異なる)
        if target_is_shared:
            row = {
                "id": target_id,
                "vector": vector,
                "owner_user_id": owner_user_id,
                "original_id": id,
                "title": title,
                "content": content,
                "category": category or "topic",
                "created_at": created_at,
                "updated_at": now_iso,
            }
        else:
            row = {
                "id": target_id,
                "vector": vector,
                "title": title,
                "content": content,
                "category": category or "topic",
                "created_at": created_at,
                "updated_at": now_iso,
            }
        u_resp = await _client.post(
            f"{kernel}/core/vectorstore/upsert",
            json={"namespace": collection_name, "data": [row]},
        )
        u_resp.raise_for_status()
        u_data = u_resp.json()
        if not u_data.get("ok"):
            return f"エラー: insert に失敗 ({u_data.get('error', 'unknown')})。"

        action = "更新" if is_update else "新規作成"
        share_label = "共有 (shared collection)" if target_is_shared else "private (自分の collection)"
        return (
            f"知識エントリを{action}しました。\n"
            f"- collection: {collection_name}\n"
            f"- id: {id}" + (f" (shared id: {target_id})" if target_is_shared else "") + "\n"
            f"- title: {title}\n"
            f"- category: {category}\n"
            f"- 共有状態: {share_label}\n"
            f"- content 長: {len(content)} 字\n"
            f"- created_at: {created_at}\n"
            f"- updated_at: {now_iso}"
        )


    @mcp.tool()
    async def delete_knowledge(
        namespace: str,
        id: str,
        is_shared: bool = False,
    ) -> str:
        """指定 id の知識エントリを Milvus から削除する。

        Args:
            namespace:  テナント識別子 (例: "example-user")。 secretary_knowledge_ prefix は省略可
            id:         削除対象の知識エントリ ID (作成者の collection 上での元 id)
            is_shared:  True なら共有 collection (secretary_knowledge_shared) から削除する。
                        False (default) なら自分の collection から削除する。
                        共有エントリを共有解除したい場合は True を指定する。
        """
        kernel = _ensure_kernel_url()

        err = _validate_knowledge_id(id)
        if err:
            return f"エラー: {err}"

        if not (namespace or "").strip():
            return "エラー: namespace が指定されていません。"

        # owner_user_id: namespace を正規化前の生 namespace から導出
        owner_user_id = (namespace or "").strip()
        if owner_user_id.startswith(KNOWLEDGE_COLLECTION_PREFIX):
            owner_user_id = owner_user_id[len(KNOWLEDGE_COLLECTION_PREFIX):]

        if is_shared:
            collection_name = KNOWLEDGE_SHARED_COLLECTION
            target_id = _shared_id(owner_user_id, id)
        else:
            collection_name = _resolve_knowledge_collection(namespace)
            target_id = id

        # collection 存在確認 (無ければ削除対象なしで成功扱い)
        h_resp = await _client.post(
            f"{kernel}/core/vectorstore/has-namespace",
            json={"namespace": collection_name},
        )
        h_resp.raise_for_status()
        h_data = h_resp.json()
        if not h_data.get("exists"):
            return f"collection={collection_name} は存在しません (削除対象なし)。"

        # 既存確認
        q_resp = await _client.post(
            f"{kernel}/core/vectorstore/query",
            json={
                "namespace": collection_name,
                "expr": f'id == "{target_id}"',
                "output_fields": ["id", "title"],
                "limit": 1,
            },
        )
        q_resp.raise_for_status()
        q_data = q_resp.json()
        existing = (q_data.get("results") or []) if q_data.get("ok") else []
        if not existing:
            return f"id={id} は collection={collection_name} に存在しません (削除対象なし)。"

        title = existing[0].get("title", "")

        d_resp = await _client.post(
            f"{kernel}/core/vectorstore/delete",
            json={"namespace": collection_name, "expr": f'id == "{target_id}"'},
        )
        d_resp.raise_for_status()
        d_data = d_resp.json()
        if not d_data.get("ok"):
            return f"エラー: 削除に失敗 ({d_data.get('error', 'unknown')})。"

        scope = "共有 collection から" if is_shared else "自分の collection から"
        return (
            f"知識エントリを{scope}削除しました。\n"
            f"- collection: {collection_name}\n"
            f"- id: {id}" + (f" (shared id: {target_id})" if is_shared else "") + "\n"
            f"- title: {title}"
        )


    # ────────────────────────────────────────────────────────────────────────
    # ドラフト保留機構 (Phase 3, pending_draft)
    # ────────────────────────────────────────────────────────────────────────
    # tool 呼び出しを伴うドラフトをユーザーに提示する際、 内容を Valkey に保存する。
    # ユーザーの承認発話 (「はい」等) が来た時、 the assistantバックエンドが pending_draft を
    # 検出して直接 tool を実行する。 これにより triage が誤って Swallow に振っても
    # tool 呼び出しが中断しない設計を実現する。
    #
    # 関連設計: knowledge id="secretary_pending_draft_design"

    PENDING_DRAFT_KV_DB = int(os.environ.get("SECRETARY_KV_DB", "1"))
    PENDING_DRAFT_KEY_PREFIX = "secretary:pending_draft:"


    def _validate_user_id(user_id: str) -> str:
        """user_id の形式を検証する。 エラー文字列を返す (空なら OK)。"""
        if not user_id:
            return "user_id が指定されていません。"
        if len(user_id) > 256:
            return f"user_id が長すぎます (最大 256 文字, 実際 {len(user_id)})。"
        # 半角英数とアンダースコア、 ピリオド、 ハイフンを許可
        # (メールアドレス由来の user_id を想定: user_example_com 等)
        for c in user_id:
            if not (c.isascii() and (c.isalnum() or c in "_.-")):
                return f"user_id に使用できない文字が含まれています ('{c}')。"
        return ""


    @mcp.tool()
    async def stage_draft(
        user_id: str,
        tool: str,
        args: dict,
    ) -> str:
        """tool 呼び出しを伴うドラフトを Valkey に保留する。

        ユーザーに「この内容で実行してよろしいですか？」と確認する前にこの tool を呼ぶ。
        ユーザーの承認発話をthe assistantバックエンドが検出した時点で、 保留中の tool が直接実行される。
        これにより triage が誤って Swallow に振っても tool 呼び出しが中断しない。

        典型的な使い方:
            1. ユーザーから記録依頼を受ける
            2. ドラフト (id, title, content 等) を組み立てる
            3. stage_draft(user_id, "upsert_knowledge", {...}) で Valkey に保留
            4. ユーザーに「以下の内容で記録してよろしいですか？」と確認
            5. ユーザーが「はい」と答えたら、 バックエンドが直接 upsert_knowledge を実行する

        後勝ち: 同じ user_id で複数回呼ぶと最新の内容で上書きされる。
        TTL なし: ユーザーがいつ応答しても有効 (古いドラフトが残り続ける可能性あり、
        新しいドラフト提示で上書きされるか、 ユーザーが却下するまで)。

        Args:
            user_id: ドラフトの所有者 (例: "user_example_com")。
                     the assistant systemの user_id 形式 (メールアドレスを _ 区切りに変換) を使う
            tool:    実行予定の tool 名 (例: "upsert_knowledge", "delete_knowledge")
            args:    tool に渡す引数の辞書。 そのままの形で保存され、
                     承認時にこの内容で tool が実行される
        """
        kernel = _ensure_kernel_url()

        # 1. 入力検証
        err = _validate_user_id(user_id)
        if err:
            return f"エラー: {err}"
        if not tool:
            return "エラー: tool が指定されていません。"
        if not isinstance(args, dict):
            return "エラー: args は dict で指定してください。"

        # 2. ドラフト内容を組み立て
        from datetime import datetime, timezone
        now_iso = datetime.now(timezone.utc).isoformat(timespec="seconds")
        draft = {
            "tool": tool,
            "args": args,
            "presented_at": now_iso,
            "presented_by": "claude",  # 将来 Swallow も対応する時に区別する
        }

        # 3. Valkey に保存 (kernel /core/kv/set 経由)
        key = PENDING_DRAFT_KEY_PREFIX + user_id
        import json as _json
        value_str = _json.dumps(draft, ensure_ascii=False)

        kv_resp = await _client.post(
            f"{kernel}/core/kv/set",
            json={
                "db": PENDING_DRAFT_KV_DB,
                "key": key,
                "value": value_str,
            },
        )
        kv_resp.raise_for_status()
        kv_data = kv_resp.json()
        if not kv_data.get("ok"):
            return f"エラー: ドラフト保留に失敗しました ({kv_data.get('error', 'unknown')})。"

        # 4. 結果報告 (LLM が読んでユーザーへの確認質問につなげる)
        args_summary_lines = []
        for k, v in args.items():
            v_str = str(v)
            if len(v_str) > 80:
                v_str = v_str[:80] + "…"
            args_summary_lines.append(f"  - {k}: {v_str}")
        args_summary = "\n".join(args_summary_lines) if args_summary_lines else "  (引数なし)"

        return (
            f"ドラフトを保留しました。 ユーザーに承認を求めてください。\n"
            f"- user_id: {user_id}\n"
            f"- tool: {tool}\n"
            f"- args:\n{args_summary}\n"
            f"- presented_at: {now_iso}\n"
            f"\n"
            f"次のステップ: ユーザーに「この内容で実行してよろしいですか？」と確認する。\n"
            f"ユーザーが承認すれば、 the assistantバックエンドが自動的に {tool} を実行する。"
        )


    @mcp.tool()
    async def add_mail_account(
        user_id: str,
        account_id: str,
        host: str,
        username: str,
        password: str,
        account_label: str = "",
        port: int = 993,
        ssl: bool = True,
        folders: list = None,
        fetch_interval_sec: int = 300,
        smtp_host: str = "",
        smtp_port: int = 587,
        smtp_use_tls: bool = True,
        smtp_username: str = "",
        smtp_password: str = "",
        sender_email: str = "",
        sender_name: str = "",
        persona_full_name: str = "",
        persona_full_name_en: str = "",
        persona_company: str = "",
        persona_company_en: str = "",
        persona_department: str = "",
        persona_title: str = "",
        persona_title_en: str = "",
        persona_postal_code: str = "",
        persona_address: str = "",
        persona_phone: str = "",
        persona_fax: str = "",
        persona_url: str = "",
        signature_text: str = "",
    ) -> str:
        """メールアカウントを登録する (利用者承認 → the assistant backend が実行)。

        登録後は指定間隔 (default 5 分) で自動的に IMAP 取得が始まる。
        新着メールは secretary_mails index に保存され、 the assistantが後で参照できる。

        承認フロー:
        1. この tool を呼ぶと内容が Valkey に保留される (stage_draft 経由)
        2. 利用者に「以下の内容で登録してよろしいですか？」 と確認する
        3. 利用者が「はい」 と答えると、 the assistant backend が以下を実行:
           - secretary_mail_accounts index にアカウント情報を書き込み
           - kernel scheduler に imap_fetch タスクを登録 (interval 自動取得開始)

        重要: パスワードは平文で OpenSearch に保存される (the operator明示の運用方針)。

        SMTP 設定: 省略時は IMAP の host/username/password を流用し、 port=587 / STARTTLS で
        試みる。 IMAP と別のサーバを使う場合は smtp_host / smtp_port / smtp_use_tls /
        smtp_username / smtp_password を指定する。

        署名 (persona): 構造化フィールド (persona_*) を保存しておくと、 送信時に
        標準書式で自動生成される。 細かい書式調整したい場合は signature_text に直接
        記述する (signature_text が空でなければ persona より優先される)。
        署名は通常 update_mail_account で会話的に設定するため、 add_mail_account の段階では
        省略しても良い。

        Args:
            user_id:            アカウント所有者 (the assistant systemの利用者 ID)
            account_id:         アカウント識別子 (英数+アンダースコア推奨、 例: "gmail_main")
                                同じ user_id 内で一意。 task_id にも使われる
            host:               IMAP サーバ host (例: "imap.gmail.com")
            username:           IMAP ログイン名 (通常メールアドレス)
            password:           IMAP パスワード (アプリパスワード推奨)
            account_label:      利用者向け表示名 (例: "プライベート Gmail")。 省略時は account_id
            port:               IMAP ポート (default 993)
            ssl:                SSL/TLS を使うか (default True)
            folders:            取得対象フォルダのリスト (default ["INBOX"])
                                Phase 1 では先頭 1 つだけ処理される
            fetch_interval_sec: 自動取得の間隔秒数 (default 300、 5 分)
            smtp_host:          SMTP サーバ host (省略時は IMAP host を流用)
            smtp_port:          SMTP ポート (default 587 = STARTTLS、 465 なら SMTPS)
            smtp_use_tls:       STARTTLS を使うか (default True、 port=465 のときは無視)
            smtp_username:      SMTP ログイン名 (省略時は IMAP username を流用)
            smtp_password:      SMTP パスワード (省略時は IMAP password を流用)
            sender_email:       From ヘッダのメアド (省略時は smtp_username/username を使う)
            sender_name:        From ヘッダの表示名 (例: "山田 太郎"、 省略可)
            persona_full_name:  署名用 氏名 (例: "山田 太郎")
            persona_full_name_en: 署名用 氏名 ローマ字 (例: "Example User")
            persona_company:    署名用 会社名 (例: "Example Corp.")
            persona_company_en: 署名用 会社名 英語
            persona_department: 署名用 部署
            persona_title:      署名用 役職 (例: "代表取締役")
            persona_title_en:   署名用 役職 英語
            persona_postal_code: 署名用 郵便番号 (例: "000-0000")
            persona_address:    署名用 住所
            persona_phone:      署名用 電話番号
            persona_fax:        署名用 FAX 番号
            persona_url:        署名用 URL (会社サイト等)
            signature_text:     自由記述署名 (空でなければ persona フィールドより優先)
        """
        if folders is None:
            folders = ["INBOX"]
        elif isinstance(folders, str):
            folders = [folders]

        args = {
            "account_id": account_id,
            "account_label": account_label or account_id,
            "host": host,
            "port": int(port),
            "ssl": bool(ssl),
            "username": username,
            "password": password,
            "folders": folders,
            "fetch_interval_sec": int(fetch_interval_sec),
        }
        # SMTP フィールド (空なら省略 → the assistant backend 側で IMAP 値が流用される)
        if smtp_host: args["smtp_host"] = smtp_host
        if smtp_port: args["smtp_port"] = int(smtp_port)
        if smtp_use_tls is not None: args["smtp_use_tls"] = bool(smtp_use_tls)
        if smtp_username: args["smtp_username"] = smtp_username
        if smtp_password: args["smtp_password"] = smtp_password
        if sender_email: args["sender_email"] = sender_email
        if sender_name: args["sender_name"] = sender_name
        # persona / signature_text フィールド (空なら省略)
        for k, v in [
            ("persona_full_name", persona_full_name),
            ("persona_full_name_en", persona_full_name_en),
            ("persona_company", persona_company),
            ("persona_company_en", persona_company_en),
            ("persona_department", persona_department),
            ("persona_title", persona_title),
            ("persona_title_en", persona_title_en),
            ("persona_postal_code", persona_postal_code),
            ("persona_address", persona_address),
            ("persona_phone", persona_phone),
            ("persona_fax", persona_fax),
            ("persona_url", persona_url),
            ("signature_text", signature_text),
        ]:
            if v:
                args[k] = v
        # stage_draft に委譲 (Valkey に保留、 利用者承認待ち)
        return await stage_draft(user_id=user_id, tool="add_mail_account", args=args)


    @mcp.tool()
    async def update_mail_account(
        user_id: str,
        account_id: str,
        account_label: str = None,
        host: str = None,
        port: int = None,
        ssl: bool = None,
        username: str = None,
        password: str = None,
        folders: list = None,
        enabled: bool = None,
        fetch_interval_sec: int = None,
        smtp_host: str = None,
        smtp_port: int = None,
        smtp_use_tls: bool = None,
        smtp_username: str = None,
        smtp_password: str = None,
        sender_email: str = None,
        sender_name: str = None,
        persona_full_name: str = None,
        persona_full_name_en: str = None,
        persona_company: str = None,
        persona_company_en: str = None,
        persona_department: str = None,
        persona_title: str = None,
        persona_title_en: str = None,
        persona_postal_code: str = None,
        persona_address: str = None,
        persona_phone: str = None,
        persona_fax: str = None,
        persona_url: str = None,
        signature_text: str = None,
    ) -> str:
        """登録済みメールアカウントを部分更新する (利用者承認 → the assistant backend が実行)。

        指定したフィールドだけ更新される (None のフィールドは変更されない)。
        署名や persona 情報の設定にはこの tool を使う (会話インターフェース)。

        典型的な使い方:
        - パスワード変更: password だけ指定
        - 一時停止: enabled=False
        - 再開: enabled=True
        - 取得間隔変更: fetch_interval_sec=600 (10 分間隔に)
                        → scheduler の interval も自動同期される
        - フォルダ変更: folders=["INBOX", "Sent"]
        - 署名 (persona) 設定:
            「このアカウントの署名を株式会社XXXの代表取締役 山田太郎、 電話03-1234-5678
              に設定して」 等の依頼を受けたら、 persona_company / persona_title /
              persona_full_name / persona_phone を埋めて update_mail_account を呼ぶ。
            送信時に標準書式で自動的に署名が組み立てられる。
        - 署名のフリーフォーマット指定: signature_text に直接書き込む。 空でなければ
          persona フィールドより優先される。 利用者から「こういう感じの署名にして」
          と具体的なテキストを渡された場合に使う。
        - 署名を消す: signature_text="" を渡す (空文字でも明示的に更新される)。

        Args:
            user_id:    アカウント所有者
            account_id: 更新対象のアカウント識別子
            その他:     add_mail_account と同じ意味のフィールド (任意)
            enabled:    True で取得有効、 False で一時停止 (アカウント自体は残る)
        """
        args: dict = {"account_id": account_id}
        if account_label is not None:
            args["account_label"] = account_label
        if host is not None:
            args["host"] = host
        if port is not None:
            args["port"] = int(port)
        if ssl is not None:
            args["ssl"] = bool(ssl)
        if username is not None:
            args["username"] = username
        if password is not None:
            args["password"] = password
        if folders is not None:
            if isinstance(folders, str):
                folders = [folders]
            args["folders"] = folders
        if enabled is not None:
            args["enabled"] = bool(enabled)
        if fetch_interval_sec is not None:
            args["fetch_interval_sec"] = int(fetch_interval_sec)
        # SMTP フィールド
        if smtp_host is not None: args["smtp_host"] = smtp_host
        if smtp_port is not None: args["smtp_port"] = int(smtp_port)
        if smtp_use_tls is not None: args["smtp_use_tls"] = bool(smtp_use_tls)
        if smtp_username is not None: args["smtp_username"] = smtp_username
        if smtp_password is not None: args["smtp_password"] = smtp_password
        if sender_email is not None: args["sender_email"] = sender_email
        if sender_name is not None: args["sender_name"] = sender_name
        # persona / signature_text フィールド (None でない = 明示更新、 空文字も有効)
        for k, v in [
            ("persona_full_name", persona_full_name),
            ("persona_full_name_en", persona_full_name_en),
            ("persona_company", persona_company),
            ("persona_company_en", persona_company_en),
            ("persona_department", persona_department),
            ("persona_title", persona_title),
            ("persona_title_en", persona_title_en),
            ("persona_postal_code", persona_postal_code),
            ("persona_address", persona_address),
            ("persona_phone", persona_phone),
            ("persona_fax", persona_fax),
            ("persona_url", persona_url),
            ("signature_text", signature_text),
        ]:
            if v is not None:
                args[k] = v

        if len(args) <= 1:
            return "エラー: account_id 以外に更新するフィールドが 1 つも指定されていません。"

        return await stage_draft(user_id=user_id, tool="update_mail_account", args=args)


