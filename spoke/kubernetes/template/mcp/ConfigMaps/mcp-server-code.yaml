    @mcp.tool()
    async def vector_search(
        namespace: str,
        query_text: str,
        top_k: int = 10,
        output_fields: list = None,
        expr: str = "",
    ) -> str:
        """Milvus collection に対して、 query_text のセマンティック検索を実行する。

        query_text を 384 次元 embedding に変換し、 namespace で指定された
        collection に対して COSINE 類似度検索する。 業務領域非依存の汎用 tool。

        Args:
            namespace:     検索対象の Milvus collection 名 (例: "secretary_conv_example")
            query_text:    検索クエリの自然言語テキスト
            top_k:         取得件数 (デフォルト 10、 最大 100)
            output_fields: 取得したいフィールドのリスト (例: ["message_id", "content", "role", "timestamp"])
                           省略時は ["text", "content"] を試す。
            expr:          Milvus フィルタ式 (例: "role == 'user'")。 省略可
        """
        kernel = _ensure_kernel_url()
        if not namespace:
            return "エラー: namespace が指定されていません。"
        if not query_text:
            return "エラー: query_text が指定されていません。"
        top_k = max(1, min(int(top_k), 100))

        # 1. embedding 化
        emb_resp = await _client.post(
            f"{kernel}/core/embedding/single",
            json={"text": query_text},
        )
        emb_resp.raise_for_status()
        emb_data = emb_resp.json()
        vector = emb_data.get("embedding")
        if not vector:
            return "エラー: embedding 取得に失敗しました。"

        # 2. ベクトル検索
        search_body = {
            "namespace": namespace,
            "query_vectors": [vector],
            "limit": top_k,
        }
        if output_fields:
            search_body["output_fields"] = list(output_fields)
        else:
            search_body["output_fields"] = ["text", "content"]
        if expr:
            search_body["expr"] = expr

        s_resp = await _client.post(f"{kernel}/core/vectorstore/search", json=search_body)
        s_resp.raise_for_status()
        s_data = s_resp.json()
        if not s_data.get("ok"):
            return f"検索失敗: {s_data.get('error', 'unknown')}"

        # 3. 結果整形
        all_results = s_data.get("results", [])
        hits = all_results[0] if all_results else []

        if not hits:
            return f"namespace={namespace} に該当データなし (query='{query_text[:60]}...')。"

        lines = [f"## ベクトル検索結果 ({len(hits)} 件) namespace={namespace}\n"]
        for i, hit in enumerate(hits, 1):
            score = hit.get("distance", 0.0)
            entity = hit.get("entity", {}) or {}
            body = entity.get("text") or entity.get("content") or ""
            meta_parts = []
            for k, v in entity.items():
                if k in ("text", "content"):
                    continue
                meta_parts.append(f"{k}={v}")
            meta_str = ", ".join(meta_parts) if meta_parts else ""
            lines.append(f"### [{i}] score={score:.4f}" + (f"  ({meta_str})" if meta_str else ""))
            if body:
                lines.append(body[:500] + ("…" if len(body) > 500 else ""))
            lines.append("")

        return "\n".join(lines)


    @mcp.tool()
    async def vector_query(
        namespace: str,
        expr: str,
        output_fields: list = None,
        limit: int = 100,
    ) -> str:
        """Milvus collection に対してメタデータフィルタクエリを実行する (ベクトル検索ではない)。

        例えば「特定の user_id のレコード」「特定期間の発話」「特定 message_id」
        を ID やフィールド条件で取得したい場合に使う。 業務領域非依存の汎用 tool。

        Args:
            namespace:     対象 Milvus collection 名
            expr:          Milvus フィルタ式 (必須、 例: 'message_id == "abc-123"',
                           'timestamp >= "2026-04-01"', 'role == "user"')
            output_fields: 取得したいフィールド名のリスト
            limit:         最大取得件数 (デフォルト 100、 最大 1000)
        """
        kernel = _ensure_kernel_url()
        if not namespace:
            return "エラー: namespace が指定されていません。"
        if not expr:
            return "エラー: expr が指定されていません。"
        limit = max(1, min(int(limit), 1000))

        body = {
            "namespace": namespace,
            "expr": expr,
            "limit": limit,
        }
        if output_fields:
            body["output_fields"] = list(output_fields)

        resp = await _client.post(f"{kernel}/core/vectorstore/query", json=body)
        resp.raise_for_status()
        data = resp.json()
        if not data.get("ok"):
            return f"クエリ失敗: {data.get('error', 'unknown')}"

        results = data.get("results", [])
        if not results:
            return f"namespace={namespace} に該当データなし (expr='{expr[:80]}')。"

        lines = [f"## メタデータクエリ結果 ({len(results)} 件) namespace={namespace}\n"]
        for i, r in enumerate(results, 1):
            parts = []
            for k, v in r.items():
                v_str = str(v)
                if len(v_str) > 200:
                    v_str = v_str[:200] + "…"
                parts.append(f"{k}={v_str}")
            lines.append(f"### [{i}] " + ", ".join(parts))
            lines.append("")

        return "\n".join(lines)


    @mcp.tool()
    async def opensearch_search(
        index: str,
        query_dsl: dict,
        size: int = 10,
        sort: list = None,
    ) -> str:
        """OpenSearch index に対して任意のクエリ DSL を実行する。

        kuromoji 全文検索、 完全一致、 範囲検索、 集計など何でも可能。
        index 名と DSL は呼び出し側が業務知識に基づいて構築する。

        Args:
            index:     対象 index 名 (例: "secretary_messages", "rag_chunks")
            query_dsl: OpenSearch query DSL の query 部分 (例: {"match": {"content": "..."}})
            size:      取得件数 (デフォルト 10、 最大 1000)
            sort:      ソート指定のリスト (例: [{"timestamp": "desc"}])。 省略可
        """
        kernel = _ensure_kernel_url()
        if not index:
            return "エラー: index が指定されていません。"
        if not query_dsl or not isinstance(query_dsl, dict):
            return "エラー: query_dsl が dict で指定されていません。"
        size = max(1, min(int(size), 1000))

        body = {"size": size, "query": query_dsl}
        if sort:
            body["sort"] = sort

        resp = await _client.post(
            f"{kernel}/core/opensearch/request",
            json={
                "method": "POST",
                "path": f"/{index}/_search",
                "body": body,
            },
        )
        resp.raise_for_status()
        data = resp.json()

        status = data.get("status_code", 0)
        if status != 200:
            return f"OpenSearch エラー: status={status}, error={data.get('error', '')[:200]}"

        os_body = data.get("json") or {}
        hits_section = os_body.get("hits", {})
        total = hits_section.get("total", {}).get("value", "?")
        hits = hits_section.get("hits", [])

        lines = [f"## OpenSearch 検索結果 (total={total}, returned={len(hits)}) index={index}\n"]
        for i, h in enumerate(hits, 1):
            score = h.get("_score")
            doc_id = h.get("_id", "")
            src = h.get("_source", {}) or {}
            score_str = f"score={score:.4f}" if isinstance(score, (int, float)) else ""
            header = f"### [{i}] _id={doc_id}"
            if score_str:
                header += f"  {score_str}"
            lines.append(header)
            for k, v in src.items():
                v_str = str(v)
                if len(v_str) > 300:
                    v_str = v_str[:300] + "…"
                lines.append(f"- {k}: {v_str}")
            lines.append("")

        return "\n".join(lines)


    @mcp.tool()
    async def opensearch_update_document(
        index: str,
        doc_id: str,
        doc: dict,
        doc_as_upsert: bool = False,
    ) -> str:
        """OpenSearch の 1 ドキュメントを部分更新する (POST /{index}/_update/{doc_id})。

        指定したフィールドのみ書き換える partial update。 doc に含めなかった
        フィールドは変更されない。 1 ドキュメントの特定フィールドだけを直す
        用途を想定 (例: セッションの状態フラグや属性を 1 つだけ修正する)。

        Args:
            index:         対象 index 名 (例: "draft_sessions")
            doc_id:        更新対象ドキュメントの _id
            doc:           更新するフィールドの辞書 (例: {"no_review_reason": "理由テキスト"})。
                           空 dict は無意味なので拒否される。
            doc_as_upsert: True にすると、 doc_id が存在しない場合は doc の内容で
                           新規作成する (default False = 存在しない場合エラー)。
        """
        kernel = _ensure_kernel_url()
        if not index:
            return "エラー: index が指定されていません。"
        if not doc_id:
            return "エラー: doc_id が指定されていません。"
        if not isinstance(doc, dict) or not doc:
            return "エラー: doc が dict で指定されていません (空 dict も不可)。"

        body = {"doc": doc}
        if doc_as_upsert:
            body["doc_as_upsert"] = True

        resp = await _client.post(
            f"{kernel}/core/opensearch/request",
            json={
                "method": "POST",
                "path": f"/{index}/_update/{doc_id}",
                "body": body,
            },
        )
        resp.raise_for_status()
        data = resp.json()

        status = data.get("status_code", 0)
        if status not in (200, 201):
            os_body = data.get("json") or {}
            err = data.get("error") or os_body.get("error") or "(no error info)"
            return f"OpenSearch 更新エラー: status={status}, error={str(err)[:300]}"

        os_body = data.get("json") or {}
        result = os_body.get("result", "?")
        version = os_body.get("_version", "?")
        lines = [
            f"## OpenSearch 更新完了 index={index} _id={doc_id}",
            f"- result: {result}",
            f"- _version: {version}",
            f"- 更新フィールド: {', '.join(doc.keys())}",
        ]
        return "\n".join(lines)


    @mcp.tool()
    async def opensearch_delete_document(
        index: str,
        doc_id: str,
        refresh: bool = True,
    ) -> str:
        """OpenSearch から 1 ドキュメントを物理削除する (DELETE /{index}/_doc/{doc_id})。

        存在しない doc_id の場合は status 404 を返すが、 エラー扱いせず "not_found"
        として人間向け文字列を返す。 削除後は refresh=True (default) により即座に
        検索結果から消える。

        Args:
            index:   対象 index 名 (例: "ledger_records")
            doc_id:  削除対象ドキュメントの _id
            refresh: True (default) なら即座に検索可能化 (refresh=true パラメータ付与)
        """
        kernel = _ensure_kernel_url()
        if not index:
            return "エラー: index が指定されていません。"
        if not doc_id:
            return "エラー: doc_id が指定されていません。"

        params = {"refresh": "true"} if refresh else None

        resp = await _client.post(
            f"{kernel}/core/opensearch/request",
            json={
                "method": "DELETE",
                "path": f"/{index}/_doc/{doc_id}",
                "params": params,
            },
        )
        resp.raise_for_status()
        data = resp.json()

        status = data.get("status_code", 0)
        os_body = data.get("json") or {}
        if status == 404:
            return f"## OpenSearch 削除 (対象なし) index={index} _id={doc_id}\n- result: not_found"
        if status not in (200, 201):
            err = data.get("error") or os_body.get("error") or "(no error info)"
            return f"OpenSearch 削除エラー: status={status}, error={str(err)[:300]}"

        result = os_body.get("result", "?")
        version = os_body.get("_version", "?")
        return (
            f"## OpenSearch 削除完了 index={index} _id={doc_id}\n"
            f"- result: {result}\n"
            f"- _version: {version}"
        )


    @mcp.tool()
    async def opensearch_delete_by_query(
        index: str,
        query_dsl: dict,
        refresh: bool = True,
        max_docs: int = 0,
    ) -> str:
        """OpenSearch のクエリ DSL に一致するドキュメントを物理削除する
        (POST /{index}/_delete_by_query)。

        削除対象を意図せず広げないため、 query_dsl は dict 必須かつ空 dict 拒否。
        全件削除したい場合は明示的に {"match_all": {}} を渡すこと。 削除前に件数を
        確認するには opensearch_search で同じ DSL を size=0 で先に確認する。

        Args:
            index:     対象 index 名 (例: "ledger_records")
            query_dsl: OpenSearch query DSL の query 部分
                       (例: {"range": {"created_at": {"lt": "2026-05-17T00:00:00+09:00"}}})
            refresh:   True (default) なら即座に検索可能化
            max_docs:  0 (default) なら制限なし。 1 以上なら OpenSearch の max_docs
                       パラメータに渡して削除件数の上限を設定
        """
        kernel = _ensure_kernel_url()
        if not index:
            return "エラー: index が指定されていません。"
        if not isinstance(query_dsl, dict) or not query_dsl:
            return "エラー: query_dsl が dict で指定されていません (空 dict も不可)。"

        body = {"query": query_dsl}
        if max_docs and max_docs > 0:
            body["max_docs"] = int(max_docs)

        params = {"refresh": "true"} if refresh else None

        resp = await _client.post(
            f"{kernel}/core/opensearch/request",
            json={
                "method": "POST",
                "path": f"/{index}/_delete_by_query",
                "body": body,
                "params": params,
            },
        )
        resp.raise_for_status()
        data = resp.json()

        status = data.get("status_code", 0)
        os_body = data.get("json") or {}
        if status not in (200, 201):
            err = data.get("error") or os_body.get("error") or "(no error info)"
            return f"OpenSearch 一括削除エラー: status={status}, error={str(err)[:300]}"

        total = os_body.get("total", "?")
        deleted = os_body.get("deleted", "?")
        failures = os_body.get("failures") or []
        lines = [
            f"## OpenSearch 一括削除完了 index={index}",
            f"- total: {total}",
            f"- deleted: {deleted}",
            f"- failures: {len(failures)}",
        ]
        if failures:
            lines.append(f"- 最初の失敗: {str(failures[0])[:300]}")
        return "\n".join(lines)


    @mcp.tool()
    async def opensearch_soft_delete_by_query(
        index: str,
        query_dsl: dict,
        reason: str = "",
        refresh: bool = True,
    ) -> str:
        """OpenSearch のクエリ DSL に一致するドキュメントを論理削除する
        (POST /{index}/_update_by_query + Painless スクリプト)。

        対象ドキュメントに以下のフィールドを追加 / 上書きする:
            - deleted_at:     実行時刻 (UTC ISO8601 文字列)
            - deleted_reason: reason 引数の値

        物理削除は行わないため、 opensearch_restore_by_query で取り消し可能。
        既に deleted_at が立っているドキュメントも上書き更新する (理由を変える用途)。

        注意: アプリ側で deleted_at の有無による表示フィルタリングを実装していない
        場合、 論理削除しても画面表示からは消えない。 必要に応じて検索クエリに
        {"bool": {"must_not": {"exists": {"field": "deleted_at"}}}} を組み込む。

        Args:
            index:     対象 index 名
            query_dsl: query 部分の DSL
            reason:    削除理由 (deleted_reason に保存)。 空文字も可
            refresh:   True (default) なら即座に検索可能化
        """
        kernel = _ensure_kernel_url()
        if not index:
            return "エラー: index が指定されていません。"
        if not isinstance(query_dsl, dict) or not query_dsl:
            return "エラー: query_dsl が dict で指定されていません (空 dict も不可)。"

        from datetime import datetime, timezone
        now_iso = datetime.now(timezone.utc).isoformat()

        body = {
            "query": query_dsl,
            "script": {
                "source": (
                    "ctx._source.deleted_at = params.deleted_at; "
                    "ctx._source.deleted_reason = params.deleted_reason;"
                ),
                "lang": "painless",
                "params": {
                    "deleted_at": now_iso,
                    "deleted_reason": reason or "",
                },
            },
        }

        params = {"refresh": "true"} if refresh else None

        resp = await _client.post(
            f"{kernel}/core/opensearch/request",
            json={
                "method": "POST",
                "path": f"/{index}/_update_by_query",
                "body": body,
                "params": params,
            },
        )
        resp.raise_for_status()
        data = resp.json()

        status = data.get("status_code", 0)
        os_body = data.get("json") or {}
        if status not in (200, 201):
            err = data.get("error") or os_body.get("error") or "(no error info)"
            return f"OpenSearch 論理削除エラー: status={status}, error={str(err)[:300]}"

        total = os_body.get("total", "?")
        updated = os_body.get("updated", "?")
        failures = os_body.get("failures") or []
        lines = [
            f"## OpenSearch 論理削除完了 index={index}",
            f"- total: {total}",
            f"- updated: {updated}",
            f"- deleted_at: {now_iso}",
            f"- deleted_reason: {reason or '(空)'}",
            f"- failures: {len(failures)}",
        ]
        if failures:
            lines.append(f"- 最初の失敗: {str(failures[0])[:300]}")
        return "\n".join(lines)


    @mcp.tool()
    async def opensearch_restore_by_query(
        index: str,
        query_dsl: dict,
        refresh: bool = True,
    ) -> str:
        """論理削除を取り消す。 対象ドキュメントから deleted_at / deleted_reason
        フィールドを Painless スクリプトで除去する (POST /{index}/_update_by_query)。

        典型的には query_dsl に {"exists": {"field": "deleted_at"}} を含めて
        論理削除されているものだけを対象にする。

        Args:
            index:     対象 index 名
            query_dsl: query 部分の DSL
            refresh:   True (default) なら即座に検索可能化
        """
        kernel = _ensure_kernel_url()
        if not index:
            return "エラー: index が指定されていません。"
        if not isinstance(query_dsl, dict) or not query_dsl:
            return "エラー: query_dsl が dict で指定されていません (空 dict も不可)。"

        body = {
            "query": query_dsl,
            "script": {
                "source": (
                    "ctx._source.remove('deleted_at'); "
                    "ctx._source.remove('deleted_reason');"
                ),
                "lang": "painless",
            },
        }

        params = {"refresh": "true"} if refresh else None

        resp = await _client.post(
            f"{kernel}/core/opensearch/request",
            json={
                "method": "POST",
                "path": f"/{index}/_update_by_query",
                "body": body,
                "params": params,
            },
        )
        resp.raise_for_status()
        data = resp.json()

        status = data.get("status_code", 0)
        os_body = data.get("json") or {}
        if status not in (200, 201):
            err = data.get("error") or os_body.get("error") or "(no error info)"
            return f"OpenSearch 復元エラー: status={status}, error={str(err)[:300]}"

        total = os_body.get("total", "?")
        updated = os_body.get("updated", "?")
        failures = os_body.get("failures") or []
        lines = [
            f"## OpenSearch 復元完了 index={index}",
            f"- total: {total}",
            f"- updated: {updated}",
            f"- failures: {len(failures)}",
        ]
        if failures:
            lines.append(f"- 最初の失敗: {str(failures[0])[:300]}")
        return "\n".join(lines)


    @mcp.tool()
    async def local_mcp_call(
        service: str,
        namespace: str,
        tool_name: str,
        arguments: dict = None,
        port: int = 8000,
    ) -> str:
        """同一 K8s クラスタ内の別 MCP サーバのツールを SSE 経由で呼び出す。

        K8s Service DNS (<service>.<namespace>.svc.cluster.local:<port>) で
        内部接続する。 クラスタ内通信なので Cloudflare Tunnel や外部 endpoint は不要。
        認証は同一クラスタ内で共有されている MCP_API_KEY (このスポーク MCP の env から
        取得) を X-API-Key ヘッダで付ける。

        用途: 各スポーク MCP はそのクラスタ内に立っている別 MCP (例えばアプリケーション
        専用 MCP) に Service DNS で接続できる。 これにより、 中央ハブ → スポーク MCP
        → 同クラスタ内のターゲット MCP という多段ホップが可能になる。

        重要: OpenSearch インスタンスは複数存在する。 各 MCP の kernel (KERNEL_URL) に
        よってアクセス先 OpenSearch が決まる。 例:
          - rag-spoke namespace の MCP (= このスポーク MCP) → rag-spoke kernel
            → opensearch.rag-spoke.svc... (スポーク用 OpenSearch)
          - mcp namespace の MCP (= アプリケーション MCP) → アプリケーション kernel
            → opensearch.opensearch.svc... (アプリケーション用)
        スポーク MCP の opensearch_search/opensearch_update_document はスポーク用に
        しか届かない。 アプリケーション本体の OpenSearch に届けるには本ツール経由で
        mcp namespace のアプリケーション MCP の同名ツールを呼ぶこと。

        Args:
            service:   対象 MCP の Service 名 (例: "mcp-company1")
            namespace: 対象 Service の namespace (例: "mcp")
            tool_name: 呼び出すツール名 (例: "opensearch_search")
            arguments: ツールの引数辞書 (省略時は空)
            port:      Service のポート (default 8000)
        """
        import os
        if not service:
            return "エラー: service が指定されていません。"
        if not namespace:
            return "エラー: namespace が指定されていません。"
        if not tool_name:
            return "エラー: tool_name が指定されていません。"
        if arguments is None:
            arguments = {}
        if not isinstance(arguments, dict):
            return "エラー: arguments は dict である必要があります。"

        sse_url = f"http://{service}.{namespace}.svc.cluster.local:{port}/sse"
        api_key = os.environ.get("MCP_API_KEY", "")
        headers = {"X-API-Key": api_key} if api_key else {}

        try:
            from mcp import ClientSession
            from mcp.client.sse import sse_client

            async with sse_client(
                sse_url, headers=headers
            ) as (read_stream, write_stream):
                async with ClientSession(read_stream, write_stream) as session:
                    await session.initialize()
                    result = await session.call_tool(tool_name, arguments)
                    parts = []
                    for c in (result.content or []):
                        txt = getattr(c, "text", None)
                        if txt is not None:
                            parts.append(txt)
                        else:
                            parts.append(str(c))
                    out = "\n".join(parts).strip()
                    return out if out else "(対象 MCP から空応答)"
        except Exception as e:
            logger.error("[local_mcp_call] failed service=%s namespace=%s tool=%s: %s",
                         service, namespace, tool_name, e)
            return (f"エラー: ローカル MCP '{service}.{namespace}' の呼び出しに失敗 "
                    f"({type(e).__name__}: {str(e)[:200]})")


    @mcp.tool()
    async def graph_query(
        cypher: str,
        params: dict = None,
    ) -> str:
        """Memgraph に対して任意の Cypher クエリを実行する。

        ノード・関係の検索、 集計、 パス探索など Cypher で表現できる任意のクエリを発行可能。
        パラメータ化クエリ ($name で参照) によって安全に値を渡せる。

        Args:
            cypher: Cypher クエリ文字列
                    (例: 'MATCH (n:Person {name: $name}) RETURN n')
            params: Cypher 内の $xxx に渡すパラメータ辞書 (省略可)
        """
        kernel = _ensure_kernel_url()
        if not cypher:
            return "エラー: cypher が指定されていません。"
        if params is not None and not isinstance(params, dict):
            return "エラー: params は dict でなければなりません。"

        body = {"cypher": cypher}
        if params:
            body["params"] = params

        resp = await _client.post(f"{kernel}/core/graph/run", json=body)
        resp.raise_for_status()
        data = resp.json()
        if not data.get("ok"):
            return f"グラフクエリ失敗: {data.get('error', 'unknown')}"

        records = data.get("records", [])
        if not records:
            return f"該当レコードなし (cypher='{cypher[:80]}…')。"

        lines = [f"## Cypher 実行結果 ({len(records)} 件)\n"]
        for i, r in enumerate(records, 1):
            parts = []
            for k, v in r.items():
                v_str = str(v)
                if len(v_str) > 200:
                    v_str = v_str[:200] + "…"
                parts.append(f"{k}={v_str}")
            lines.append(f"### [{i}] " + ", ".join(parts))
            lines.append("")

        return "\n".join(lines)


    @mcp.tool()
    async def rerank(
        query: str,
        passages: list,
        top_k: int = 10,
    ) -> str:
        """候補テキスト群を Cross-Encoder (BAAI/bge-reranker-base) で再評価する。

        ベクトル検索や OpenSearch 検索で得た候補リストに対し、 query との関連度を
        改めて精密にスコアリングし、 上位 top_k 件を返す。

        Args:
            query:    元のクエリ文字列
            passages: 再ランク対象の候補テキストのリスト (各要素は文字列)
            top_k:    上位何件を返すか (デフォルト 10)
        """
        kernel = _ensure_kernel_url()
        if not query:
            return "エラー: query が指定されていません。"
        if not passages or not isinstance(passages, list):
            return "エラー: passages はリストで指定してください。"
        top_k = max(1, min(int(top_k), len(passages)))

        candidates = [{"text": p, "_orig_index": i} for i, p in enumerate(passages) if isinstance(p, str)]
        if not candidates:
            return "エラー: passages の中に有効な文字列がありません。"

        resp = await _client.post(
            f"{kernel}/core/reranker/score",
            json={
                "question": query,
                "candidates": candidates,
                "final_count": top_k,
            },
        )
        resp.raise_for_status()
        data = resp.json()
        if not data.get("ok"):
            return f"再ランク失敗: {data.get('error', 'unknown')}"

        results = data.get("results", [])
        debug = data.get("debug_info", {})

        lines = [f"## Reranker 結果 (上位 {len(results)} 件 / 候補 {len(passages)} 件)\n"]
        if debug.get("reranked") is False:
            lines.append(f"_注: 再ランクスキップ (理由: {debug.get('reason', '')})_\n")

        for i, r in enumerate(results, 1):
            text = r.get("text", "")
            score = r.get("rerank_score")
            orig_idx = r.get("_orig_index", "?")
            score_str = f"rerank_score={score:.4f}" if isinstance(score, (int, float)) else ""
            lines.append(f"### [{i}] orig_index={orig_idx}  {score_str}")
            lines.append(text[:500] + ("…" if len(text) > 500 else ""))
            lines.append("")

        return "\n".join(lines)


    # ────────────────────────────────────────────────────────────────────────
    # Web fetch (URL からテキスト本体を取得する汎用 tool)
    # ────────────────────────────────────────────────────────────────────────
    # kernel /core/web/fetch・/core/web/fetch-batch のラッパー。
    # the assistant (内部の Claude)・Claude.ai (外部の Claude)・将来の他 LLM が
    # 共通利用できる汎用 Web 取得機能を提供する。

    @mcp.tool()
    async def web_fetch(
        url: str,
        max_content_length: int = 5000,
        timeout: int = 10,
    ) -> str:
        """指定 URL の Web ページ本体テキストを取得する。

        HTML を解析し、 script / style / nav / header / footer 等の不要要素を
        除去した本文テキストを返す。 静的 HTML のみ対応 (JavaScript レンダリング不可)。
        Content-Type が text/html または text/plain でない場合は取得失敗となる。

        典型的な用途:
            - ユーザーが共有した URL の内容を要約
            - 記事・ドキュメント・GitHub README 等の内容を読んで応答に活かす
            - 検索結果の URL を実際に取得して詳細確認

        制限:
            - 認証付きページ (Cookie / Authorization) 不可
            - PDF / 画像 / 動画 不可
            - JavaScript 必須サイト不可 (静的 HTML のみ)
            - Cloudflare Bot Protection 等で弾かれることがある

        Args:
            url: 取得対象の URL (http:// または https:// で始まる必要)
            max_content_length: 取得テキストの最大文字数 (1〜200000、 default 5000)
                超過分は末尾に "... (以下省略)" を付けて切り詰める
            timeout: HTTP タイムアウト秒数 (1〜60、 default 10)
        """
        kernel = _ensure_kernel_url()
        try:
            resp = await _client.post(
                f"{kernel}/core/web/fetch",
                json={
                    "url": url,
                    "max_content_length": max_content_length,
                    "timeout": timeout,
                },
                timeout=timeout + 5,  # kernel タイムアウトより少し長く
            )
            resp.raise_for_status()
            data = resp.json()
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if not data.get("ok"):
            return f"取得失敗: {data.get('error', 'unknown')}"

        body = data.get("content") or ""
        truncated = data.get("truncated", False)
        truncated_note = ""
        if truncated:
            orig = data.get("original_length") or 0
            truncated_note = f" (元 {orig} 字以上を {len(body)} 字に切り詰め)"

        return f"## {url}{truncated_note}\n\n{body}"


    @mcp.tool()
    async def web_fetch_batch(
        urls: list,
        max_content_length: int = 5000,
        timeout: int = 10,
        max_workers: int = 3,
    ) -> str:
        """複数の URL を並列取得する。 web_fetch の複数版。

        各 URL に対して web_fetch と同じ処理を行い、 結果をまとめて返す。
        失敗した URL も結果リストに含まれる (ok=False で表示)。

        Args:
            urls: 取得対象 URL のリスト (1〜20 件)
            max_content_length: 各 URL の最大文字数 (default 5000)
            timeout: 各 URL のタイムアウト秒数 (default 10)
            max_workers: 並列度 (1〜10、 default 3)
        """
        kernel = _ensure_kernel_url()
        if not isinstance(urls, list) or not urls:
            return "エラー: urls はリストで指定してください (1 件以上)。"

        try:
            resp = await _client.post(
                f"{kernel}/core/web/fetch-batch",
                json={
                    "urls": urls,
                    "max_content_length": max_content_length,
                    "timeout": timeout,
                    "max_workers": max_workers,
                },
                timeout=timeout + 30,  # batch は時間がかかる
            )
            resp.raise_for_status()
            data = resp.json()
        except Exception as e:
            return f"バッチ取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if not data.get("ok"):
            return f"バッチ取得失敗: {data.get('error', 'unknown')}"

        results = data.get("results", [])
        fetched_count = data.get("fetched_count", 0)
        elapsed = data.get("elapsed_sec", 0.0)

        lines = [f"## バッチ取得結果 ({fetched_count}/{len(results)} 件成功, {elapsed:.2f}秒)\n"]
        for i, r in enumerate(results, 1):
            url = r.get("url", "")
            ok = r.get("ok", False)
            if ok:
                body = r.get("content") or ""
                truncated = r.get("truncated", False)
                trunc_note = ""
                if truncated:
                    orig = r.get("original_length") or 0
                    trunc_note = f" (元 {orig} 字以上 → {len(body)} 字)"
                lines.append(f"### [{i}] {url}{trunc_note}\n{body}\n")
            else:
                err = r.get("error", "unknown")
                lines.append(f"### [{i}] {url} (失敗)\nエラー: {err}\n")

        return "\n".join(lines)


    # ────────────────────────────────────────────────────────────────────────
    # GitHub Contents API (ファイル単位 commit / push)
    # ────────────────────────────────────────────────────────────────────────
    # わたくし (the assistant) や外部 LLM が GitHub にファイルを直接 commit / push できる。
    # 1 ファイル = 1 commit。 git clone 不要、 ローカル workspace 不要。
    #
    # 想定ユースケース:
    #   - ConfigMap などのマニフェストを直接 commit して Fleet に GitOps 反映
    #   - わたくしの実装変更を即座にデプロイ (検証なし、 the operator明示の運用)


    @mcp.tool()
    async def github_get_file(
        owner: str,
        repo: str,
        path: str,
        branch: str = "",
        user_id: str = "",
    ) -> str:
        """GitHub からファイル内容を取得する。

        Args:
            owner: リポジトリオーナー (例: "your-org")
            repo: リポジトリ名 (例: "rag")
            path: ファイルパス (例: "fleet/config.yaml")
            branch: ブランチ名 (省略時は default branch、 通常 main)
            user_id: the assistant systemの利用者 ID。 指定があればそのユーザーの
                     登録済み GitHub PAT が使われる。 未指定 or 未登録なら
                     システム共通 token (環境変数 GITHUB_TOKEN) にフォールバック。
        """
        kernel = _ensure_kernel_url()
        try:
            resp = await _client.post(
                f"{kernel}/core/github/get-file",
                json={"owner": owner, "repo": repo, "path": path,
                      "branch": branch if branch else None,
                      "user_id": user_id},
                timeout=60,
            )
            resp.raise_for_status()
            data = resp.json()
        except Exception as e:
            return f"取得失敗: {type(e).__name__}: {str(e)[:200]}"

        if not data.get("ok"):
            return f"取得失敗: {data.get('error', 'unknown')}"
        if not data.get("exists"):
            return f"ファイルが存在しません: {owner}/{repo}/{path}" + (f" (branch={branch})" if branch else "")

        content = data.get("content") or ""
        sha = data.get("sha", "")
        size = data.get("size", 0)
        return (
            f"## {owner}/{repo}/{path}"
            + (f" (branch={branch})" if branch else "")
            + f"\nsize: {size} bytes, sha: {sha[:7]}\n\n{content}"
        )


    @mcp.tool()
    async def github_put_file(
        owner: str,
        repo: str,
        path: str,
        content: str,
        message: str,
        branch: str = "",
        user_id: str = "",
    ) -> str:
        """GitHub にファイルを作成 or 更新して直接 push する。

        既存ファイルがあれば自動的に更新、 無ければ新規作成。
        1 ファイル = 1 commit で直接 push する (Pull Request は経由しない)。

        Args:
            owner: リポジトリオーナー (例: "your-org")
            repo: リポジトリ名 (例: "rag")
            path: ファイルパス (例: "fleet/config.yaml")
            content: ファイル本文 (UTF-8 テキスト)
            message: commit message (必須、 空文字不可)
            branch: ブランチ名 (省略時は default branch、 通常 main)
            user_id: the assistant systemの利用者 ID (任意)。 指定があればそのユーザー
                     の登録済み GitHub PAT が使われる。 未指定なら共通 token。
        """
        kernel = _ensure_kernel_url()
        try:
            resp = await _client.post(
                f"{kernel}/core/github/put-file",
                json={
                    "owner": owner, "repo": repo, "path": path,
                    "content": content, "message": message,
                    "branch": branch if branch else None,
                    "user_id": user_id,
                },
                timeout=120,
            )
            resp.raise_for_status()
            data = resp.json()
        except Exception as e:
            return f"push 失敗: {type(e).__name__}: {str(e)[:200]}"

        if not data.get("ok"):
            return f"push 失敗: {data.get('error', 'unknown')}"

        action = data.get("action") or "?"
        commit_sha = data.get("commit_sha") or ""
        html_url = data.get("html_url") or ""
        action_jp = "新規作成" if action == "created" else "更新" if action == "updated" else action
        return (
            f"{action_jp}しました: {owner}/{repo}/{path}\n"
            f"- commit: {commit_sha[:7]}\n"
            f"- url: {html_url}"
        )


    @mcp.tool()
    async def github_delete_file(
        owner: str,
        repo: str,
        path: str,
        message: str,
        branch: str = "",
        user_id: str = "",
    ) -> str:
        """GitHub からファイルを削除して直接 push する。

        ファイルが存在しなければ「削除対象なし」を返す (冪等)。

        Args:
            owner: リポジトリオーナー (例: "your-org")
            repo: リポジトリ名 (例: "rag")
            path: ファイルパス
            message: commit message (必須)
            branch: ブランチ名 (省略時は default branch)
            user_id: the assistant systemの利用者 ID (任意)。 指定があればそのユーザー
                     の登録済み GitHub PAT が使われる。 未指定なら共通 token。
        """
        kernel = _ensure_kernel_url()
        try:
            resp = await _client.post(
                f"{kernel}/core/github/delete-file",
                json={
                    "owner": owner, "repo": repo, "path": path,
                    "message": message,
                    "branch": branch if branch else None,
                    "user_id": user_id,
                },
                timeout=60,
            )
            resp.raise_for_status()
            data = resp.json()
        except Exception as e:
            return f"削除失敗: {type(e).__name__}: {str(e)[:200]}"

        if not data.get("ok"):
            return f"削除失敗: {data.get('error', 'unknown')}"
