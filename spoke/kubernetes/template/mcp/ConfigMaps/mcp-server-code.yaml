    if __name__ == "__main__":
        from starlette.applications import Starlette
        from starlette.routing import Mount

        AUTH_ENABLED   = os.environ.get("MCP_AUTH_ENABLED", "true").lower() == "true"
        OAUTH_ENABLED  = os.environ.get("MCP_OAUTH_ENABLED", "false").lower() == "true"

        sse_app  = mcp.sse_app()
        http_app = mcp.streamable_http_app()

        combined = Starlette(routes=[
            Route("/.well-known/oauth-authorization-server", oauth_metadata),
            Route("/.well-known/oauth-protected-resource", oauth_protected_resource),
            Route("/.well-known/oauth-protected-resource/sse", oauth_protected_resource),
            Route("/.well-known/jwks.json", jwks),
            Route("/callback", oauth_callback),
            Route("/oauth/token", proxy_token, methods=["POST"]),
            Route("/oauth/register", proxy_register, methods=["POST"]),
            Mount("/mcp", app=http_app),
            Mount("/", app=sse_app),
        ])

        class CombinedAuthMiddleware:
            """API Key または Bearer JWT のどちらかで認証を通す"""
            def __init__(self, inner):
                self.inner = inner
            async def __call__(self, scope, receive, send):
                if scope["type"] != "http":
                    await self.inner(scope, receive, send)
                    return
                path = scope.get("path", "")
                if path in OPEN_PATHS:
                    await self.inner(scope, receive, send)
                    return
                headers = dict(scope.get("headers", []))
                # 1) API Key チェック
                api_key = headers.get(b"x-api-key", b"").decode()
                if api_key == API_KEY:
                    await self.inner(scope, receive, send)
                    return
                # 2) Bearer JWT チェック
                auth = headers.get(b"authorization", b"").decode()
                token = auth.removeprefix("Bearer ").strip()
                if token:
                    try:
                        jwks_url = f"{KEYCLOAK_INTERNAL_URL}/realms/{KEYCLOAK_REALM}/protocol/openid-connect/certs"
                        jwks_client = jwt.PyJWKClient(jwks_url, headers=_UA)
                        signing_key = jwks_client.get_signing_key_from_jwt(token)
                        jwt.decode(token, signing_key.key, algorithms=["RS256"], audience="account")
                        await self.inner(scope, receive, send)
                        return
                    except Exception as e:
                        print(f"JWT validation error: {e}")
                # どちらも通らない
                await send({"type": "http.response.start", "status": 401, "headers": [(b"content-type", b"text/plain")]})
                await send({"type": "http.response.body", "body": b"Unauthorized"})

        if OAUTH_ENABLED and AUTH_ENABLED:
            app = CombinedAuthMiddleware(combined)
        elif OAUTH_ENABLED:
            app = JwtAuthMiddleware(combined)
        elif AUTH_ENABLED:
            app = ApiKeyMiddleware(combined)
        else:
            app = combined

        # 再帰深度伝搬ミドルウェアを最外層に適用
        # (認証ミドルウェアより外側 = 先に処理される)
        app = RecursionDepthMiddleware(app)

        uvicorn.run(app, host=MCP_HOST, port=MCP_PORT)

