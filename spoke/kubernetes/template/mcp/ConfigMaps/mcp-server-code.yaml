    # ============================================================
    # 汎用 tool 群 (KERNEL_URL を直接叩く、 業務領域非依存)
    # ============================================================
    # これらの tool はthe assistant system / 将来の任意のシステムから
    # 共通利用できる低レベル汎用機能を提供する。 業務固有の知識は持たず、
    # 「Milvus に検索する」「OpenSearch を引く」「Memgraph で Cypher 実行」
    # 等のデータストア操作を抽象化する。
    # アプリケーション側 (the assistantバックエンド等) が、 これらを組合わせて
    # 業務ロジックを構築する。

    def _ensure_kernel_url() -> str:
        """KERNEL_URL が設定されているか検証して返す。 未設定なら例外を投げる。"""
        if not KERNEL_URL:
            raise RuntimeError(
                "KERNEL_URL is not configured for this MCP server. "
                "Set the KERNEL_URL environment variable to enable generic tools."
            )
        return KERNEL_URL


