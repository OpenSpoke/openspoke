apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-spoke
  namespace: rag-spoke
---
# fleet_agent_install ツールが fleet-agent をインストールするために
# cluster-admin 相当の権限が必要 (ClusterRoleBinding を含むため)。
#
# スポーク MCP には API key + JWT (Keycloak OAuth) の認証層があるので、
# このツールを呼び出せるのは認証済みクライアントだけ。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-spoke
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: mcp-spoke
    namespace: rag-spoke
