apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: memgraph
  name: memgraph
  namespace: rag-spoke
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: memgraph
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: memgraph
      annotations:
        restarted-at: "2026-05-19T00:00:00Z"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: spoke-node
                    operator: In
                    values:
                      - enable
      containers:
        - args:
            - '--memory-limit=1024'
            - '--log-level=WARNING'
            - '--also-log-to-stderr'
            - '--storage-properties-on-edges=true'
          image: memgraph/memgraph:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 20
            successThreshold: 1
            tcpSocket:
              port: 7687
            timeoutSeconds: 1
          name: memgraph
          ports:
            - containerPort: 7687
              name: bolt
              protocol: TCP
            - containerPort: 7444
              name: websocket
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 7687
            timeoutSeconds: 1
          resources:
            limits:
              cpu: '1'
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/lib/memgraph
              name: data
      dnsPolicy: ClusterFirst
      initContainers:
        - command:
            - sh
            - '-c'
            - chown -R 101:101 /var/lib/memgraph
          image: busybox
          imagePullPolicy: IfNotPresent
          name: fix-permissions
          resources: {}
          securityContext:
            runAsUser: 0
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/lib/memgraph
              name: data
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: memgraph-data
