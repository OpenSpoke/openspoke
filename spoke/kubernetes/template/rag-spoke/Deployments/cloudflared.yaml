# Legacy v1 spoke-exposure path.
#
# From v2.0 onward, prefer `spoke/kubernetes/template/tunnel-client/`,
# which reverses the direction (spoke -> hub) and removes the need for
# a public per-spoke tunnel. This file is retained so upgrading v1
# clusters is a two-step migration rather than a hard cutover:
#   1. Deploy tunnel-client alongside cloudflared.
#   2. Confirm the hub can reach the spoke's MCP via tunnel-server, then
#      scale this Deployment to 0 (or remove this GitRepo entry entirely).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: rag-spoke
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: cloudflared
      annotations:
        restarted-at: "2026-06-03T02:00:00Z"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: spoke-node
                    operator: In
                    values:
                      - enable
      containers:
        - args:
            - tunnel
            - '--no-autoupdate'
            - '--config'
            - /etc/cloudflared/config.yaml
            - run
          env:
            - name: TUNNEL_METRICS
              value: 0.0.0.0:2000
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          name: cloudflared
          ports:
            - containerPort: 2000
              name: metrics
              protocol: TCP
          resources:
            limits:
              cpu: '500m'
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/cloudflared
              name: cloudflared-bundle
              readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: cloudflared-bundle
          secret:
            defaultMode: 420
            secretName: cloudflared-bundle
