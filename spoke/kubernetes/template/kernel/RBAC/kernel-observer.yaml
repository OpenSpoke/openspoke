---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-backend-kernel
  namespace: rag-spoke
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rag-backend-kernel-observer-spoke
rules:
  # Pod / Deployment / Event の read-only access
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - namespaces
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list"]
  # Fleet GitOps CRDs (read-only): kernel が local_fleet_state エンドポイントで
  # Bundle / BundleDeployment を取得するために必要。
  # fleet-state-publisher CronJob から cluster_local_fleet_state ツール経由で呼ばれる。
  - apiGroups: ["fleet.cattle.io"]
    resources:
      - bundles
      - bundledeployments
      - gitrepos
      - clusters
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rag-backend-kernel-observer-spoke
subjects:
  - kind: ServiceAccount
    name: rag-backend-kernel
    namespace: rag-spoke
roleRef:
  kind: ClusterRole
  name: rag-backend-kernel-observer-spoke
  apiGroup: rbac.authorization.k8s.io
