apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-ui
  namespace: fleet-ui
data:
  # Fleet UI バックエンドの設定。
  # フロントエンドの SPA はこの値を /api/config 経由で読み出す。
  config.yaml: |
    server:
      listen: ":8080"
      readTimeout: 30s
      writeTimeout: 30s
    auth:
      mode: basic
      secretName: fleet-ui-basicauth
      secretNamespace: fleet-ui
    fleet:
      # in-cluster の Fleet を見る
      defaultWorkspace: fleet-default
      systemNamespace: cattle-fleet-system
    ui:
      title: "Fleet UI"
      brandColor: "#3d98d3"
