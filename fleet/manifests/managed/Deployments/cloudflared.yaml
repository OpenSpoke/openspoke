# 既存スポーク用 cloudflared (cloudflared namespace, tunnel=mytunnel-0009) とは
# 完全に分離した、 fleet-ui 専用の cloudflared。
# Aki さんが Cloudflare ダッシュボードで作成する別 tunnel に接続する。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: fleet-ui
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --config
            - /etc/cloudflared/config.yaml
            - run
            - a273cbf0-d9e7-455a-a55e-151a4d50cfed
          env:
            - name: TUNNEL_METRICS
              value: 0.0.0.0:2000
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          volumeMounts:
            - name: cloudflared-bundle
              mountPath: /etc/cloudflared
              readOnly: true
          resources: {}
      volumes:
        - name: cloudflared-bundle
          secret:
            secretName: cloudflared-bundle
            defaultMode: 420
